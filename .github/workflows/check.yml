name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to start: names separated by spaces, or all"
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Rules
        run: bun test

      - name: Apps
        run: bun scripts/check.ts --index index.json

      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: index.json

      - name: The apps that changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ASKED: ${{ github.event.inputs.apps }}
        run: |
          if [ -n "$ASKED" ]; then
            if [ "$ASKED" = all ]; then changed=$(ls apps); else changed=$ASKED; fi
          elif git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD -- apps | cut -d/ -f2 | sort -u)
          else
            changed=$(ls apps)
          fi
          list=""
          for a in $changed; do [ -d "apps/$a" ] && list="$list $a"; done
          echo "apps=$(printf '%s\n' $list | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # every app that changed is started as Hata installs it, each on a runner of its own
  smoke:
    needs: check
    if: needs.check.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
    steps:
      - name: Room for large images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Start ${{ matrix.app }}
        run: sudo "$(which bun)" scripts/smoke.ts ${{ matrix.app }}

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # one at a time, and only the index of what main is now: a run of an older commit must not put it back
    concurrency: index
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: index

      - name: Publish the index
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is at ${head::7} now: its own run publishes"; exit 0; fi
          mkdir out && mv index.json out/ && cd out
          git init -q -b index
          git add index.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Index of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" index
