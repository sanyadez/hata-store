# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  ddns-updater:
    image: qmcgaw/ddns-updater:v2.10.0
    command:
      - touch /data/config.json
    deploy:
      resources:
        limits:
          memory: 32M
    environment:
      BACKUP_DIRECTORY: /updater/data
      BACKUP_PERIOD: "0"
      CONFIG: ""
      HTTP_TIMEOUT: 10s
      LISTENING_ADDRESS: ":8000"
      LOG_CALLER: hidden
      LOG_LEVEL: info
      PERIOD: 5m
      PUBLICIP_DNS_PROVIDERS: all
      PUBLICIP_DNS_TIMEOUT: 3s
      PUBLICIP_FETCHERS: all
      PUBLICIP_HTTP_PROVIDERS: all
      PUBLICIPV4_HTTP_PROVIDERS: all
      PUBLICIPV6_HTTP_PROVIDERS: all
      ROOT_URL: /
      SHOUTRRR_ADDRESSES: ""
      UPDATE_COOLDOWN_PERIOD: 5m
    hostname: ddns-updater
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /updater/data
