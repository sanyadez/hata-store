services:
  calibre:
    image: lscr.io/linuxserver/calibre:9.16.0
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - ${WEB_PORT:-8181}:8181
      # Calibre's own content server, once it is turned on in Calibre's preferences
      - ${CONTENT_PORT:-8081}:8081
    volumes:
      - ${APP_DATA:-.}/config:/config
      # the library place Calibre's first-run wizard offers
      - ${LIBRARY:-./library}:/config/Calibre Library
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      PASSWORD: ${PASSWORD:-}
