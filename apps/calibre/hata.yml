title: Calibre
tagline:
  en: The Calibre e-book manager, opened in the browser
  uk: Менеджер електронних книжок Calibre просто в браузері
description:
  en: >
    The full Calibre desktop app running on the server: keep the family's e-book library in
    order, fix titles, authors and covers, convert between EPUB, MOBI, PDF and other formats,
    and send books to a reader. Its content server lets phones and readers download books too.
  uk: >
    Повноцінний застосунок Calibre, що працює на сервері: тримайте бібліотеку електронних книжок
    родини в порядку, виправляйте назви, авторів і обкладинки, перетворюйте між EPUB, MOBI, PDF
    та іншими форматами й надсилайте книжки на читалку. Через його сервер вмісту книжки можуть
    завантажувати й телефони та читалки.
notes:
  en: >
    The page opens over **HTTPS** with a certificate of its own: let the browser go on. In the
    first-run wizard keep the library place it offers, `/config/Calibre Library`: that is your
    library folder. The content server is turned on in Preferences → Sharing over the net, with
    the port 8081 left as it is. Without a password anybody on the home network can open Calibre.
  uk: >
    Сторінка відкривається через **HTTPS** з власним сертифікатом: дозвольте браузеру продовжити.
    У майстрі першого запуску залиште запропоноване місце бібліотеки, `/config/Calibre Library`:
    це і є ваша тека з книжками. Сервер вмісту вмикається в налаштуваннях Calibre, у розділі
    спільного доступу через мережу; порт 8081 лишіть як є. Без пароля Calibre може відкрити будь-хто в домашній мережі.
category: media
developer: Kovid Goyal
website: https://calibre-ebook.com
source: https://github.com/kovidgoyal/calibre
icon: data:image/svg+xml;base64,
web:
  service: calibre
  port: 8181
  scheme: https
settings:
  - name: WEB_PORT
    type: port
    default: 8181
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: LIBRARY
    type: folder
    default: ${DATA_ROOT}/Media/Books
    label: { en: Library folder, uk: Тека з бібліотекою }
    hint:
      en: Where Calibre keeps the books
      uk: Де Calibre зберігає книжки
  - name: PASSWORD
    type: password
    label: { en: Password, uk: Пароль }
    hint:
      en: Asked when the page opens, with the user name abc; empty — no password
      uk: Його питатимуть, коли відкривається сторінка, з іменем користувача abc; порожній — без пароля
  - name: CONTENT_PORT
    type: port
    default: 8081
    advanced: true
    label: { en: Content server port, uk: Порт сервера вмісту }
