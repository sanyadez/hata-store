title: Speedtest Tracker
tagline:
  en: Measures your internet speed on a schedule and keeps the history
  uk: Вимірює швидкість інтернету за розкладом і зберігає історію
description:
  en: >
    Runs an Ookla Speedtest from the server every few hours and draws download, upload and ping over
    days and months, so you see whether the provider gives what you pay for. It can send a message
    when the speed falls below a threshold.
  uk: >
    Кожні кілька годин запускає з сервера Speedtest від Ookla і малює завантаження, віддачу й затримку
    за дні та місяці, тож видно, чи дає провайдер те, за що ви платите. Може надіслати повідомлення,
    коли швидкість падає нижче за поріг.
notes:
  en: >
    Each test uses the connection fully for half a minute and spends traffic: on a metered link choose
    a rare schedule.
  uk: >
    Кожна перевірка на пів хвилини повністю займає з'єднання й витрачає трафік: на лімітному тарифі
    виберіть рідший розклад.
category: network
developer: Alex Justesen
website: https://docs.speedtest-tracker.dev
source: https://github.com/alexjustesen/speedtest-tracker
icon: data:image/webp;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: speedtest-tracker
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 8098
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ADMIN_EMAIL
    type: text
    required: true
    label: { en: E-mail to sign in, uk: Пошта для входу }
    hint:
      en: The administrator is made with it at the first start
      uk: З нею під час першого запуску створюється адміністратор
  - name: ADMIN_PASSWORD
    type: password
    required: true
    label: { en: Password to sign in, uk: Пароль для входу }
  - name: SPEEDTEST_SCHEDULE
    type: choice
    default: "0 */6 * * *"
    label: { en: How often to test, uk: Як часто перевіряти }
    options:
      - { value: "0 * * * *", label: { en: Every hour, uk: Щогодини } }
      - { value: "0 */6 * * *", label: { en: Every 6 hours, uk: Кожні 6 годин } }
      - { value: "0 6 * * *", label: { en: Once a day, uk: Раз на день } }
  - name: PRUNE_DAYS
    type: number
    default: 0
    advanced: true
    label: { en: Keep results for days, uk: Скільки днів зберігати результати }
    hint:
      en: 0 keeps them all
      uk: 0 — зберігати всі
  - name: APP_KEY
    type: secret
    length: 32
    label: { en: Encryption key, uk: Ключ шифрування }
