title: Audiobookshelf
tagline:
  en: Audiobookshelf is a self-hosted audiobook and podcast server.
  uk: Audiobookshelf — ваш власний сервер аудіокниг і подкастів.
description:
  en: "Audiobookshelf is a self-hosted media server designed for managing and streaming audiobooks, podcasts, and e-books, offering a secure and flexible solution for personal media libraries. Its lightweight architecture and intuitive Web interface (available as a Progressive Web App, PWA) enable seamless access from any browser, while beta Android and iOS apps support offline listening, catering to privacy-focused media enthusiasts.\n\nThe app supports on-the-fly streaming of all audio formats and provides robust management tools, including automatic metadata and cover art fetching from multiple sources, bulk drag-and-drop uploads for books and podcasts, and chapter editing with lookup via the Audnexus API. Users can search and subscribe to podcasts with auto-downloading episodes or manage content via open RSS feeds. It supports multi-user access with custom permissions, ensuring individual playback progress syncs across devices. Additionally, it offers audio tools (like merging files into m4b or embedding metadata) and experimental e-book support (epub, pdf, cbr, cbz), with the ability to send e-books to devices like Kindle.\n\nIt automatically detects library updates, eliminating manual rescans, and includes daily automated backups to safeguard metadata. Chromecast support (on Web and Android apps) enhances streaming capabilities, while an active community provides support documentation for continuous improvements. Whether for personal collections or family sharing, the app's intuitive interface and versatile features deliver a modern media management platform, meeting diverse needs.\n\n**Key Features:**\n- Multi-user support w/ custom permissions\n- Keeps progress per user and syncs across devices\n- Lookup and apply metadata and cover art from several providers\n- Audiobook chapter editor w/ chapter lookup\n- Audiobook tools: Embed metadata in audio files & merge multiple audio files to a single m4b\n- Search and add podcasts to download episodes w/ auto-download\n- Open RSS feeds for audiobooks and podcast episodes\n- Backups with automated backup scheduling\n- Basic ebook support and ereader (epub, pdf, cbr, cbz) + send to device (i.e. Kindle)\n\n**Learn More:**\n- [Audiobookshelf Official Website](https://audiobookshelf.org)\n- [Audiobookshelf GitHub Repository](https://github.com/advplyr/audiobookshelf)"
  uk: "Audiobookshelf — ваш власний медіасервер для керування аудіокнигами, подкастами та електронними книгами і їх потокового відтворення. Він надійний і гнучкий для особистих медіатек. Легка архітектура та зручний вебінтерфейс (доступний як прогресивний вебзастосунок, PWA) дають доступ із будь-якого браузера, а бета-версії застосунків для Android та iOS підтримують офлайн-прослуховування — для тих, хто дбає про приватність.\n\nЗастосунок відтворює потоком усі аудіоформати «на льоту» й має потужні засоби керування: автоматичне отримання метаданих і обкладинок із кількох джерел, пакетне завантаження книг і подкастів перетягуванням, редагування розділів із пошуком через API Audnexus. Можна шукати подкасти й підписуватися на них з автоматичним завантаженням випусків або працювати з відкритими RSS-стрічками. Підтримується багатокористувацький доступ із власними правами, а прогрес відтворення кожного користувача синхронізується між пристроями. Також є аудіоінструменти (наприклад, об’єднання файлів у m4b або вбудовування метаданих) та експериментальна підтримка електронних книг (epub, pdf, cbr, cbz) з можливістю надсилати їх на пристрої, як-от Kindle.\n\nВін автоматично помічає оновлення в бібліотеці, тож перескановувати її вручну не потрібно, а щоденні автоматичні резервні копії зберігають метадані. Підтримка Chromecast (у вебверсії та застосунку для Android) розширює можливості відтворення, а активна спільнота підтримує документацію й постійно покращує проєкт. Для особистих колекцій чи сімейного доступу — зручний інтерфейс і різноманітні функції роблять його сучасною платформою для керування медіа.\n\n**Основні можливості:**\n- Багатокористувацький режим із власними правами\n- Прогрес зберігається окремо для кожного користувача й синхронізується між пристроями\n- Пошук і застосування метаданих та обкладинок із кількох джерел\n- Редактор розділів аудіокниг із пошуком розділів\n- Інструменти для аудіокниг: вбудовування метаданих в аудіофайли та об’єднання кількох файлів в один m4b\n- Пошук і додавання подкастів з автоматичним завантаженням випусків\n- Відкриті RSS-стрічки для аудіокниг і випусків подкастів\n- Резервні копії з автоматичним розкладом\n- Базова підтримка електронних книг і читалка (epub, pdf, cbr, cbz) та надсилання на пристрій (наприклад, Kindle)\n\n**Дізнатися більше:**\n- [Офіційний сайт Audiobookshelf](https://audiobookshelf.org)\n- [Репозиторій Audiobookshelf на GitHub](https://github.com/advplyr/audiobookshelf)"
category: media
developer: advplyr
website: https://audiobookshelf.org
source: https://github.com/advplyr/audiobookshelf
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: audiobookshelf
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 13378
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: AUDIOBOOKS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Audiobooks"
    label:
      en: Audiobooks directory
      uk: Тека аудіокниг
    hint:
      en: Inside the app it is /audiobooks
      uk: У застосунку вона — /audiobooks
  - name: PODCASTS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Podcasts"
    label:
      en: Podcasts directory
      uk: Тека подкастів
    hint:
      en: Inside the app it is /podcasts
      uk: У застосунку вона — /podcasts
