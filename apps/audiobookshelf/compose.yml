# Apache-2.0, changed for Hata Store: see NOTICE
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    deploy:
      resources:
        reservations:
          memory: 64M
    restart: unless-stopped
    volumes:
      - "${AUDIOBOOKS_DIR:-./Media/Audiobooks}:/audiobooks"
      - "${PODCASTS_DIR:-./Media/Podcasts}:/podcasts"
      - "${APP_DATA:-.}/config:/config"
      - "${APP_DATA:-.}/metadata:/metadata"
    ports:
      - "${WEB_PORT:-13378}:80"
