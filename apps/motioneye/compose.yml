# Apache-2.0, changed for Hata Store: see NOTICE
services:
  motioneye:
    image: ccrisan/motioneye:master-amd64
    ports:
      - "${WEB_PORT:-8765}:8765"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /etc/motioneye
      - type: bind
        source: "${MOTIONEYE_DIR:-./Media/motioneye}"
        target: /var/lib/motioneye
    privileged: false
