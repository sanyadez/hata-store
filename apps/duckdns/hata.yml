title:
  en: duckdns
tagline:
  en: "Dynamic DNS for your domain, supporting both IPv4 and IPv6"
  zh: 为您的域名提供动态DNS服务，支持IPv4和IPv6
  ar: DNS ديناميكي لنطاقك، يدعم كلاً من IPv4 و IPv6
  de: "Dynamisches DNS für Ihre Domain, unterstützt sowohl IPv4 als auch IPv6"
  es: "DNS dinámico para su dominio, compatible con IPv4 e IPv6"
  fr: "DNS dynamique pour votre domaine, prenant en charge IPv4 et IPv6"
  hu: "Dinamikus DNS a domainjéhez, támogatja az IPv4 és IPv6 protokollokat"
  it: "DNS dinamico per il tuo dominio, supporta sia IPv4 che IPv6"
  ru: "Динамический DNS для вашего домена, поддерживает как IPv4, так и IPv6"
  pl: "Dynamiczny DNS dla Twojej domeny, obsługujący zarówno IPv4, jak i IPv6"
  pt: "DNS dinâmico para seu domínio, suportando IPv4 e IPv6"
  sv: "Dynamisk DNS för din domän, stöder både IPv4 och IPv6"
  uk: Динамічний DNS для вашого домену з підтримкою IPv4 та IPv6
description:
  en: "duckdns is a DDNS (Dynamic DNS) application that dynamically binds IP addresses to domain names, supporting both IPv4 and IPv6."
  zh: duckdns是一个DDNS（动态DNS）应用，能够动态地将IP地址绑定到域名，支持IPv4和IPv6。
  ar: duckdns هو تطبيق DDNS (نظام أسماء النطاقات الديناميكي) يربط عناوين IP بالأسماء المجالية ديناميكيًا، ويدعم كلاً من IPv4 و IPv6.
  de: "duckdns ist eine DDNS (Dynamic DNS)-Anwendung, die IP-Adressen dynamisch an Domainnamen bindet und sowohl IPv4 als auch IPv6 unterstützt."
  es: "duckdns es una aplicación DDNS (DNS dinámico) que vincula dinámicamente direcciones IP a nombres de dominio, compatible con IPv4 e IPv6."
  fr: "duckdns est une application DDNS (DNS dynamique) qui lie dynamiquement des adresses IP à des noms de domaine, prenant en charge IPv4 et IPv6."
  hu: "A duckdns egy DDNS (dinamikus DNS) alkalmazás, amely dinamikusan köti az IP-címeket a domainnevekhez, és támogatja az IPv4 és IPv6 protokollokat."
  it: "duckdns è un'applicazione DDNS (DNS dinamico) che lega dinamicamente gli indirizzi IP ai nomi di dominio, supportando sia IPv4 che IPv6."
  ru: "duckdns - это приложение DDNS (динамический DNS), которое динамически связывает IP-адреса с доменными именами, поддерживая как IPv4, так и IPv6."
  pl: "duckdns to aplikacja DDNS (dynamiczny DNS), która dynamicznie wiąże adresy IP z nazwami domen, obsługując zarówno IPv4, jak i IPv6."
  pt: "duckdns é um aplicativo DDNS (DNS dinâmico) que vincula dinamicamente endereços IP a nomes de domínio, suportando IPv4 e IPv6."
  sv: duckdns är en DDNS (dynamisk DNS)-applikation som dynamiskt binder IP-adresser till domännamn och stöder både IPv4 och IPv6.
  uk: "duckdns — застосунок для DDNS (динамічного DNS), який автоматично прив’язує IP-адреси до доменних імен. Підтримує IPv4 та IPv6."
notes:
  en: "Attention Please Will update IPv6 address by default. You can modify it by settings.\n\nPlease register sub-domain on https://www.duckdns.org/ and gain your token."
  zh: "请注意 将默认更新IPv6，你可以在设置面板更改。\n\n请在https://www.duckdns.org/注册子域名并获取token。"
  uk: "Увага! За замовчуванням оновлюється й адреса IPv6. Це можна змінити в налаштуваннях.\n\nЗареєструйте піддомен на https://www.duckdns.org/ і отримайте свій токен."
category: network
developer: DuckDNS Team
website: https://www.duckdns.org
source: https://github.com/linuxserver/docker-duckdns
