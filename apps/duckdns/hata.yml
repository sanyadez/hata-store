# Apache-2.0, changed for Hata Store: see NOTICE
title: duckdns
tagline:
  en: "Dynamic DNS for your domain, supporting both IPv4 and IPv6"
  uk: Динамічний DNS для вашого домену з підтримкою IPv4 та IPv6
description:
  en: "duckdns is a DDNS (Dynamic DNS) application that dynamically binds IP addresses to domain names, supporting both IPv4 and IPv6."
  uk: "duckdns — застосунок для DDNS (динамічного DNS), який автоматично прив’язує IP-адреси до доменних імен. Підтримує IPv4 та IPv6."
notes:
  en: "Attention Please Will update IPv6 address by default. You can modify it by settings.\n\nPlease register sub-domain on https://www.duckdns.org/ and gain your token."
  uk: "Увага! За замовчуванням оновлюється й адреса IPv6. Це можна змінити в налаштуваннях.\n\nЗареєструйте піддомен на https://www.duckdns.org/ і отримайте свій токен."
category: network
developer: DuckDNS Team
website: https://www.duckdns.org
source: https://github.com/linuxserver/docker-duckdns
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
settings:
  - name: SUBDOMAINS
    type: text
    required: true
    label:
      en: Subdomains
      uk: Піддомени
    hint:
      en: "Your names on duckdns.org without .duckdns.org, separated by commas"
      uk: "Ваші імена на duckdns.org без .duckdns.org, через кому"
  - name: TOKEN
    type: password
    required: true
    label:
      en: DuckDNS token
      uk: Токен DuckDNS
    hint:
      en: Shown on duckdns.org after signing in
      uk: Показано на duckdns.org після входу
  - name: UPDATE_IP
    type: choice
    default: ipv4
    options:
      - value: ipv4
        label: IPv4
      - value: ipv6
        label: IPv6
      - value: both
        label:
          en: Both
          uk: Обидві
    label:
      en: Address to update
      uk: Яку адресу оновлювати
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
