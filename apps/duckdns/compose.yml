# Apache-2.0, changed for Hata Store: see NOTICE
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest@sha256:b692b1584655661c952dafad7fb594a1e9422e48c5dfe1b3400bb5b293bdb9ab
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SUBDOMAINS: "${SUBDOMAINS:?set SUBDOMAINS}"
      TOKEN: "${TOKEN:?set TOKEN}"
      UPDATE_IP: "${UPDATE_IP:-ipv4}"
      LOG_FILE: "false"
    volumes:
      - "${APP_DATA:-.}:/config"
    restart: unless-stopped
