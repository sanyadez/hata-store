# Apache-2.0, changed for Hata Store: see NOTICE
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest@sha256:97563419e4edfbec21249efe8b2deb93e867ea04568f7bfb057254f49881a79b
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SUBDOMAINS: "${SUBDOMAINS:?set SUBDOMAINS}"
      TOKEN: "${TOKEN:?set TOKEN}"
      UPDATE_IP: "${UPDATE_IP:-ipv4}"
      LOG_FILE: "false"
    volumes:
      - "${APP_DATA:-.}:/config"
    restart: unless-stopped
