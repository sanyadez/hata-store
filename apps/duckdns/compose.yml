# Apache-2.0, changed for Hata Store: see NOTICE
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest@sha256:8be3d2d20da2b4a3ec4d86eb456460ef79d791d6c7ceea865a9d01aa53ce1456
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SUBDOMAINS: "${SUBDOMAINS:?set SUBDOMAINS}"
      TOKEN: "${TOKEN:?set TOKEN}"
      UPDATE_IP: "${UPDATE_IP:-ipv4}"
      LOG_FILE: "false"
    volumes:
      - "${APP_DATA:-.}:/config"
    restart: unless-stopped
