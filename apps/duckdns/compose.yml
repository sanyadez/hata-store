# Apache-2.0, changed for Hata Store: see NOTICE
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest@sha256:cae32b5b29878e158e2a5c129e6090d65a2cb4659995888382b2264a729c7bab
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SUBDOMAINS: "${SUBDOMAINS:?set SUBDOMAINS}"
      TOKEN: "${TOKEN:?set TOKEN}"
      UPDATE_IP: "${UPDATE_IP:-ipv4}"
      LOG_FILE: "false"
    volumes:
      - "${APP_DATA:-.}:/config"
    restart: unless-stopped
