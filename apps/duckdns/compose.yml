# Apache-2.0, changed for Hata Store: see NOTICE
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest@sha256:7736cb8f1b0cde0e24f6e80fac6c5ab9567b77e10fe62b753a4977ac767bbd5c
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SUBDOMAINS: "${SUBDOMAINS:?set SUBDOMAINS}"
      TOKEN: "${TOKEN:?set TOKEN}"
      UPDATE_IP: "${UPDATE_IP:-ipv4}"
      LOG_FILE: "false"
    volumes:
      - "${APP_DATA:-.}:/config"
    restart: unless-stopped
