# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: HoloPlay
tagline:
  en: A web app to listen Youtube audio source.
  fr: Une application Web pour écouter les sources audio de Youtube.
  zh: 一个用于收听Youtube音频源的Web应用。
  uk: Вебзастосунок для прослуховування аудіо з YouTube.
description:
  en: HoloPlay is a web based self-hosted using Invidious API for listening Youtube audio source.
  fr: "HoloPlay est une alternative qui utilise l'API Invidious pour écouter des sources audio de Youtube."
  zh: HoloPlay是一个基于Web的自托管应用，使用Invidious API来播放Youtube音频源。
  uk: "HoloPlay — вебзастосунок для власного сервера, який через API Invidious дає змогу слухати аудіо з YouTube."
category: media
developer: Stéphane Richin
website: https://github.com/stephane-r/HoloPlay
source: https://github.com/stephane-r/HoloPlay
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
  - 6.webp
  - 7.webp
web:
  service: holoplay
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
permissions:
  privileged:
    en: Its authors run it with full access to the server
    uk: Автори запускають його з повним доступом до сервера
