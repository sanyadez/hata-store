# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  2fauth:
    image: 2fauth/2fauth:6.1.3
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: always
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /2fauth
    environment:
      APP_KEY: "${APP_KEY:?set APP_KEY}"
