# Apache-2.0, changed for Hata Store: see NOTICE
services:
  resilio-sync:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: linuxserver/resilio-sync:3.1.2
    ports:
      - "${PORT_55555:-55555}:55555"
      - "${WEB_PORT:-8888}:8888"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /sync
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
    privileged: false
