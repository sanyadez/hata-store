# Apache-2.0, changed for Hata Store: see NOTICE
title: resilio-sync
tagline:
  en: Unleash the power of seamless file synchronization.
  uk: Безперебійна синхронізація файлів у повну силу.
description:
  en: resilio-sync is a Docker-based application that enables fast and secure file synchronization and sharing.
  uk: resilio-sync — застосунок у Docker для швидкої та безпечної синхронізації файлів і обміну ними.
category: productivity
developer: self
website: https://www.resilio.com/sync/
source: https://github.com/linuxserver/docker-resilio-sync
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
web:
  service: resilio-sync
  port: 8888
settings:
  - name: PORT_55555
    type: port
    default: 55555
    label:
      en: Port 55555
      uk: Порт 55555
    advanced: true
  - name: WEB_PORT
    type: port
    default: 8888
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads
      uk: Завантаження
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
