title: Syncthing
tagline:
  en: Open decentralized file synchronization
  uk: Відкрита децентралізована синхронізація файлів
description:
  en: "# Unlocking the True Potential of Data Backup\n\nSay goodbye to traditional cloud backup limitations and embrace the future with Syncthing. Unlike conventional cloud services that often come with privacy concerns and storage restrictions, Syncthing provides a secure, real-time file synchronization solution that keeps your data exclusively in your hands. Whether you're syncing work documents or personal photos, you have complete control over where and how your files are stored and shared.\n\n# Features That Make a Difference\n\nSyncthing offers a seamless, user-friendly experience with powerful features designed for everyday users. Enjoy continuous file synchronization between multiple devices without any subscription fees. Experience peace of mind knowing that your data is encrypted and protected from unauthorized access. Syncthing’s open-source nature means no hidden costs, providing a truly transparent and cost-effective solution for your file management needs."
  uk: "# Розкрийте справжній потенціал резервного копіювання\n\nЗабудьте про обмеження звичайних хмарних резервних копій і виберіть майбутнє з Syncthing. На відміну від звичайних хмарних сервісів, що часто мають проблеми з приватністю й обмеження сховища, Syncthing забезпечує безпечну синхронізацію файлів у реальному часі, а ваші дані лишаються лише у ваших руках. Синхронізуєте ви робочі документи чи особисті фото, ви повністю контролюєте, де й як зберігаються та передаються ваші файли.\n\n# Можливості, що мають значення\n\nSyncthing пропонує зручну роботу без зайвих клопотів і потужні функції для щоденного користування. Файли постійно синхронізуються між кількома пристроями без жодної передплати. Ваші дані зашифровані й захищені від несанкціонованого доступу, тож можна бути спокійними. Відкритий код Syncthing означає відсутність прихованих витрат: це справді прозоре й економне рішення для керування вашими файлами."
category: productivity
developer: Syncthing
website: https://syncthing.net
source: https://github.com/syncthing/syncthing
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: syncthing
  port: 8384
settings:
  - name: WEB_PORT
    type: port
    default: 8384
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_22000
    type: port
    default: 22000
    label:
      en: Syncthing listening Port (TCP)
      uk: Порт Syncthing (TCP)
    advanced: true
  - name: PORT_21027
    type: port
    default: 21027
    label:
      en: Syncthing protocol discovery Port (TCP)
      uk: Порт виявлення протоколу Syncthing (TCP)
    advanced: true
  - name: DATA_DIR
    type: folder
    default: "${DATA_ROOT}"
    label:
      en: Data folder
      uk: Тека даних
