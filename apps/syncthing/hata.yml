web:
  service: syncthing
  port: 8384
settings:
  - name: WEB_PORT
    type: port
    default: 8384
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_22000
    type: port
    default: 22000
    label:
      en: Syncthing listening Port (TCP)
      zh: Syncthing监听端口（TCP）
      uk: Порт Syncthing (TCP)
    advanced: true
  - name: PORT_21027
    type: port
    default: 21027
    label:
      en: Syncthing protocol discovery Port (TCP)
      zh: Syncthing协议发现端口（TCP）
      uk: Порт виявлення протоколу Syncthing (TCP)
    advanced: true
  - name: DATA_DIR
    type: folder
    default: "${DATA_ROOT}"
    label:
      en: Data folder
      uk: Тека даних
