# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: FreshRSS
tagline:
  en: "A free, self-hostable news aggregator…"
  zh: "一个免费的、可自行托管的新闻聚合器..."
  de: "Ein kostenloser, selbst zu hostender Nachrichten-Aggregator..."
  es: "Un agregador de noticias gratuito y autoalojable..."
  fr: "Un agrégateur de nouvelles gratuit et auto-hébergeable..."
  hu: "Ingyenes, önállóan hosztolható híraggregátor..."
  it: "Un aggregatore di notizie gratuito e auto-ostabile..."
  ru: "Бесплатный, самодостаточный агрегатор новостей..."
  pl: "Darmowy, samoobsługowy agregator wiadomości..."
  pt: "Um agregador de notícias gratuito e auto-hospedável..."
  sv: "En gratis, självhanterlig nyhetsaggregator ..."
  uk: "Безкоштовний агрегатор новин, який можна розгорнути на власному сервері…"
description:
  en: "FreshRSS is a self-hosted RSS and Atom feed aggregator. It is lightweight, easy to work with, powerful, and customizable."
  zh: FreshRSS 是一款自托管 RSS 和 Atom 新闻聚合器。它重量轻、易于使用、功能强大且可定制。
  ar: FreshRSS هو مُجمِّع خلاصات RSS و Atom ذاتي الاستضافة. إنه خفيف الوزن وسهل الاستخدام وقوي وقابل للتخصيص.
  de: "FreshRSS ist ein selbstgehosteter RSS- und Atom-Feed-Aggregator. Er ist leichtgewichtig, einfach zu bedienen, leistungsstark und anpassbar."
  es: "FreshRSS es un agregador RSS y Atom autoalojado. Es ligero, fácil de usar, potente y personalizable."
  fr: "FreshRSS est un agrégateur de flux RSS et Atom auto-hébergé. Il est léger, facile à utiliser, puissant et personnalisable."
  hu: "A FreshRSS egy saját üzemeltetésű RSS és Atom feed aggregátor. Könnyű, könnyen kezelhető, nagy teljesítményű és testreszabható."
  it: "FreshRSS è un aggregatore di feed RSS e Atom autoportato. È leggero, facile da usare, potente e personalizzabile."
  ru: "FreshRSS - это самодостаточный агрегатор RSS и Atom-лент. Он легкий, простой в работе, мощный и настраиваемый."
  pl: "FreshRSS to samoobsługowy agregator kanałów RSS i Atom. Jest lekki, łatwy w obsłudze, wydajny i konfigurowalny."
  pt: "O FreshRSS é um agregador de feeds RSS e Atom auto-hospedado. Ele é leve, fácil de usar, avançado e personalizável."
  sv: "FreshRSS är en självhanterad RSS- och Atom-flödesaggregator. Det är lättviktigt, enkelt att arbeta med, kraftfullt och anpassningsbart."
  uk: "FreshRSS — агрегатор RSS- і Atom-стрічок для власного сервера. Він легкий, простий у використанні, потужний і гнучкий у налаштуванні."
category: productivity
developer: FreshRSS
website: https://freshrss.org/
source: https://github.com/FreshRSS/FreshRSS
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
web:
  service: freshrss
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 8749
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: CRON_MIN
    type: text
    default: "1,31"
    label:
      en: Set cron job interval to refresh feeds
      uk: Інтервал оновлення стрічок за розкладом
