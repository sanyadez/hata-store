# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  freshrss:
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      CRON_MIN: "${CRON_MIN:-1,31}"
    image: freshrss/freshrss:1.29.1
    ports:
      - "${WEB_PORT:-8749}:80"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /var/www/FreshRSS/data
      - type: bind
        source: "${APP_DATA:-.}/extensions"
        target: /var/www/FreshRSS/extensions
