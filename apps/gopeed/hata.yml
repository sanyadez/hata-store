title: Gopeed
tagline:
  en: "Open source, lightweight, native, supports (HTTP, BitTorrent, Magnet, etc.) for downloading."
  uk: "Легкий власний завантажувач з відкритим кодом, що підтримує HTTP, BitTorrent, Magnet та інші."
description:
  en: "Gopeed is a modern high-speed download tool supporting HTTP, BitTorrent, and Magnet protocols, offering a beautiful interface and powerful functionality. Its lightweight design and multi-platform support make it ideal for efficient file downloading across various devices.\n\nThe tool's core features include high-speed downloading and an elegant interface. It leverages Golang coroutines for concurrent downloading, supporting HTTP, HTTPS, BitTorrent, and Magnet protocols for fast, stable performance. The interface follows Material Design standards, including a dark mode, balancing aesthetics and usability. Advanced features include seeding, DHT, PEX, uTP, Webtorrent, and UPnP support, with daily automatic tracker list updates to enhance download efficiency.\n\nIt provides a RESTful API for open integration, allowing users to remotely control download tasks, pause, or delete them. Decentralized extensions enable JavaScript plugins to enhance functionality, such as downloading videos or music from websites. The tool's speed, flexibility, and user-friendly design deliver a modern download solution.\n\n**Key Features:**\n- High-speed downloading with HTTP, BitTorrent, Magnet protocols\n- Seeding, DHT, PEX, uTP, Webtorrent, UPnP\n- Daily automatic tracker list updates\n- RESTful API for remote download task control\n- Decentralized extensions with JavaScript plugins\n\n**Learn More:**\n- [Gopeed Official Website](https://gopeed.com)\n- [Gopeed GitHub Repository](https://github.com/gopeedlab/gopeed)"
  uk: "Gopeed — сучасний швидкий завантажувач із підтримкою протоколів HTTP, BitTorrent і Magnet, гарним інтерфейсом і потужними можливостями. Легкість і підтримка багатьох платформ роблять його зручним для ефективного завантаження файлів на різних пристроях.\n\nОсновні можливості — висока швидкість і охайний інтерфейс. Gopeed використовує корутини Golang для паралельного завантаження й підтримує HTTP, HTTPS, BitTorrent і Magnet для швидкої та стабільної роботи. Інтерфейс відповідає стандартам Material Design і має темний режим, поєднуючи вигляд і зручність. Серед розширених можливостей — роздавання, DHT, PEX, uTP, Webtorrent і UPnP, а також щоденне автоматичне оновлення списків трекерів для ефективнішого завантаження.\n\nДля інтеграції є RESTful API, що дає змогу віддалено керувати завантаженнями, ставити їх на паузу чи видаляти. Децентралізовані розширення на JavaScript додають нові можливості, наприклад завантаження відео чи музики з сайтів. Швидкість, гнучкість і зручність роблять його сучасним рішенням для завантажень.\n\n**Основні можливості:**\n- Швидке завантаження через HTTP, BitTorrent і Magnet\n- Роздавання, DHT, PEX, uTP, Webtorrent, UPnP\n- Щоденне автоматичне оновлення списків трекерів\n- RESTful API для віддаленого керування завантаженнями\n- Децентралізовані розширення на JavaScript\n\n**Докладніше:**\n- [Офіційний сайт Gopeed](https://gopeed.com)\n- [Репозиторій Gopeed на GitHub](https://github.com/gopeedlab/gopeed)"
category: media
