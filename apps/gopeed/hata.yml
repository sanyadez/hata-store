  zh: 开源、轻量级、原生、支持（HTTP、BitTorrent、Magnet等）下载。
  ja: オープンソース、軽量、ネイティブ、ダウンロード用（HTTP、BitTorrent、Magnetなど）をサポート。
  ko: "오픈 소스, 경량, 네이티브, 다운로드용 (HTTP, BitTorrent, Magnet 등) 지원."
  fr: "Open source, léger, natif, prend en charge (HTTP, BitTorrent, Magnet, etc.) pour le téléchargement."
  de: "Open Source, leichtgewichtig, nativ, unterstützt (HTTP, BitTorrent, Magnet, etc.) zum Herunterladen."
  sv: "Öppen källkod, lättviktig, inbyggd, stöder (HTTP, BitTorrent, Magnet, etc.) för nedladdning."
  el: "Ανοιχτού κώδικα, ελαφρύ, εγγενές, υποστηρίζει (HTTP, BitTorrent, Magnet, κ.λπ.) για λήψη."
  hr: "Otvoreni kod, lagani, urođeni, podržava (HTTP, BitTorrent, Magnet, itd.) za preuzimanje."
  pt: "Código aberto, leve, nativo, suporta (HTTP, BitTorrent, Magnet, etc.) para descarregamento."
  ru: "Открытый исходный код, легкий, нативный, поддерживает (HTTP, BitTorrent, Magnet и т.д.) для загрузки."
