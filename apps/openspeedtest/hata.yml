title:
  en: OpenSpeedTest
tagline:
  en: HTML5 Network Speed Test Server.
  zh: HTML5网络速度测试服务器。
  ar: خادم اختبار سرعة الشبكة HTML5.
  de: HTML5-Netzwerkgeschwindigkeitstestserver.
  es: Servidor de prueba de velocidad de red HTML5.
  fr: Serveur de test de vitesse de réseau HTML5.
  hu: HTML5 hálózati sebességteszt szerver.
  it: Server di test di velocità di rete HTML5.
  ru: HTML5-сервер тестирования скорости сети.
  pl: Serwer testów prędkości sieci HTML5.
  pt: Servidor de teste de velocidade de rede HTML5.
  sv: HTML5-nätverkshastighetstestserver.
  uk: Сервер HTML5 для перевірки швидкості мережі.
description:
  en: An application for launching HTML5 Network Speed Test Server. You can test download & upload speed from any device within your network with a web browser that is IE10 or new.
  zh: 一个用于启动HTML5网络速度测试服务器的应用程序。您可以使用IE10或更高版本的Web浏览器从您的网络中的任何设备上测试下载和上传速度。
  ar: تطبيق لتشغيل خادم اختبار سرعة الشبكة HTML5. يمكنك اختبار سرعة التحميل والتحميل من أي جهاز داخل شبكتك باستخدام متصفح ويب يعمل على IE10 أو أحدث.
  de: "Eine Anwendung zum Starten eines HTML5-Netzwerkgeschwindigkeitstestservers. Sie können die Download- und Uploadgeschwindigkeit von jedem Gerät in Ihrem Netzwerk mit einem Webbrowser testen, der IE10 oder neuer ist."
  es: Una aplicación para iniciar un servidor de prueba de velocidad de red HTML5. Puede probar la velocidad de descarga y carga desde cualquier dispositivo dentro de su red con un navegador web que sea IE10 o superior.
  fr: Une application pour lancer un serveur de test de vitesse de réseau HTML5. Vous pouvez tester la vitesse de téléchargement et de téléchargement à partir de tout appareil dans votre réseau avec un navigateur Web qui est IE10 ou plus récent.
  hu: "HTML5 hálózati sebességteszt szerver indítására szolgáló alkalmazás. Bármelyik eszközről tesztelheti a letöltési és feltöltési sebességet a hálózatában egy olyan webböngészővel, amely IE10 vagy újabb."
  it: "Un'applicazione per avviare un server di test di velocità di rete HTML5. È possibile testare la velocità di download e upload da qualsiasi dispositivo all'interno della rete con un browser web che è IE10 o superiore."
  ru: "Приложение для запуска HTML5-сервера тестирования скорости сети. Вы можете проверить скорость загрузки и выгрузки с любого устройства в вашей сети с помощью веб-браузера, который поддерживает IE10 или новее."
  pl: "Aplikacja do uruchamiania serwera testów prędkości sieci HTML5. Możesz przetestować prędkość pobierania i wysyłania z dowolnego urządzenia w sieci przy użyciu przeglądarki internetowej, która obsługuje IE10 lub nowszą."
  pt: Um aplicativo para iniciar um servidor de teste de velocidade de rede HTML5. Você pode testar a velocidade de download e upload de qualquer dispositivo em sua rede com um navegador da web que seja IE10 ou superior.
  sv: En applikation för att starta en HTML5-nätverkshastighetstestserver. Du kan testa nedladdnings- och uppladdningshastighet från vilket enhet som helst i ditt nätverk med en webbläsare som är IE10 eller nyare.
  uk: Застосунок для запуску сервера HTML5 для перевірки швидкості мережі. Швидкість завантаження та вивантаження можна перевірити з будь-якого пристрою у вашій мережі через браузер IE10 або новіший.
