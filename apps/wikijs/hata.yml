title: Wiki.js
tagline:
  en: A handsome wiki with Markdown and a visual editor
  uk: Гарна вікі з Markdown і візуальним редактором
description:
  en: >
    A wiki for family notes, a home lab or a hobby. Pages are written in Markdown or a visual
    editor, kept in a tree with the history of every change and found by full-text search; diagrams
    and pictures included. The pages can also be mirrored into a Git repository.
  uk: >
    Вікі для сімейних нотаток, домашньої лабораторії чи захоплення. Сторінки пишуть у Markdown або
    у візуальному редакторі, вони лежать деревом з історією кожної зміни, а знаходить їх пошук
    усім текстом; є діаграми й зображення. Сторінки можна ще й віддзеркалювати в репозиторій Git.
notes:
  en: >
    The first time it is opened it asks for the administrator's e-mail and password and the site's
    address.
  uk: >
    Під час першого відкриття попросить пошту й пароль адміністратора та адресу сайту.
category: productivity
developer: Requarks
website: https://js.wiki
source: https://github.com/requarks/wiki
icon: data:image/webp;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: wiki
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
