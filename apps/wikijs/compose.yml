services:
  wiki:
    image: ghcr.io/requarks/wiki:2.5.317
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${WEB_PORT:-3000}:3000
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_NAME: wiki

  db:
    image: postgres:15.19-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA:-.}/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 30
