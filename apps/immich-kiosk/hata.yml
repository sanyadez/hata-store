title: Immich Kiosk
tagline:
  en: Your Immich photos as a slideshow on any screen
  uk: Ваші фото з Immich як слайд-шоу на будь-якому екрані
description:
  en: >
    Turns an old tablet, a TV or a wall display into a photo frame. Open its page in a browser and
    it shows pictures from your Immich library one after another, with the clock and date if you
    like; albums, people and dates to show can be chosen in the page's address.
  uk: >
    Перетворює старий планшет, телевізор чи настінний екран на фоторамку. Відкрийте його сторінку
    в браузері, і він показуватиме знімки з вашої бібліотеки Immich один за одним, за бажання з
    годинником і датою; альбоми, людей і дати можна вибрати в адресі сторінки.
notes:
  en: >
    Needs Immich running on this server or elsewhere, and an API key made there.
  uk: >
    Потрібен Immich на цьому сервері чи деінде та ключ API, створений у ньому.
category: photos
developer: Damon Golding
website: https://docs.immichkiosk.app
source: https://github.com/damongolding/immich-kiosk
icon: data:image/svg+xml;base64,
web:
  service: immich-kiosk
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: IMMICH_URL
    type: url
    required: true
    label: { en: Immich address, uk: Адреса Immich }
    hint:
      en: "For Immich on this server: http://<server address>:2283"
      uk: "Для Immich на цьому сервері: http://<адреса сервера>:2283"
  - name: IMMICH_API_KEY
    type: password
    required: true
    label: { en: Immich API key, uk: Ключ API Immich }
    hint:
      en: "In Immich: your account settings → API keys → New API key"
      uk: "В Immich: налаштування облікового запису → Ключі API → Новий ключ API"
  - name: DURATION
    type: number
    default: 60
    label: { en: Seconds per photo, uk: Секунд на одне фото }
  - name: SHOW_TIME
    type: switch
    default: true
    label: { en: Show the clock and date, uk: Показувати годинник і дату }
  - name: KIOSK_PASSWORD
    type: password
    advanced: true
    label: { en: Password for the page, uk: Пароль до сторінки }
    hint:
      en: Added to the address as ?password=…; leave it empty to open the page to anyone at home
      uk: Додається до адреси як ?password=…; порожній — сторінку відкриває будь-хто вдома
