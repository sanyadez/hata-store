description:
  en: "DeepSeek OCR is a powerful open-source OCR (Optical Character Recognition) tool based on the advanced DeepSeek-AI model. It enables accurate text extraction from images and document scans via a user-friendly web interface and API. Supports various image formats and offers configurations for image size, cropping, and upload limits. Additionally, DeepSeek OCR features four core recognition modes: Plain OCR for raw text extraction, Describe for intelligent image content descriptions, Find for keyword localization with visual bounding box returns, and Freeform for flexible image understanding tasks based on custom prompts.\n\n**Key Features:**\n- High-accuracy text recognition with DeepSeek-OCR, supporting images and multi-page PDF documents\n- Preserves document layout including tables, formulas, and structural formatting\n- Web frontend (React) and REST API (FastAPI) for easy usage and system integration\n- Export results to Markdown, HTML, DOCX, or JSON formats\n- Automatic extraction and embedding of images from PDF files\n- GPU acceleration and Docker deployment for fast and scalable processing\n\n**Learn More:**\n- [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  de: "DeepSeek OCR ist ein leistungsstarkes Open-Source-OCR-Tool (Optical Character Recognition), das auf dem fortschrittlichen DeepSeek-AI-Modell basiert. Es ermöglicht die präzise Extraktion von Text aus Bildern und Dokumentenscans über eine benutzerfreundliche Weboberfläche und API. Unterstützt verschiedene Bildformate und bietet Konfigurationen für Bildgröße, Zuschneiden und Upload-Limits. Gleichzeitig bietet DeepSeek OCR vier grundlegende Erkennungsmodi: Plain OCR für die ursprüngliche Textextraktion, Describe für intelligente Bildinhaltsbeschreibungen, Find zur Unterstützung der Schlüsselwortlokalisierung mit Rückgabe visueller Begrenzungsrahmen und Freeform für flexible Bildverständnisaufgaben basierend auf benutzerdefinierten Hinweisen.\n\n**Hauptfunktionen:**\n- Hochgenaue Texterkennung mit DeepSeek-OCR, unterstützt Bilder und mehrseitige PDF-Dokumente\n- Behält das Dokumentenlayout einschließlich Tabellen, Formeln und strukturierter Formatierung bei\n- Web-Frontend (React) und REST-API (FastAPI) für einfache Nutzung und Systemintegration\n- Exportieren Sie Ergebnisse in Markdown, HTML, DOCX oder JSON-Formate\n- Automatische Extraktion und Einbettung von Bildern aus PDF-Dateien\n- GPU-Beschleunigung und Docker-Bereitstellung für schnelle und skalierbare Verarbeitung\n\n**Mehr Erfahren:**\n- [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  el: "Το DeepSeek OCR είναι ένα ισχυρό εργαλείο OCR (Optical Character Recognition) ανοιχτού κώδικα βασισμένο στο προηγμένο μοντέλο DeepSeek-AI. Επιτρέπει την ακριβή εξαγωγή κειμένου από εικόνες και σαρώσεις εγγράφων μέσω φιλικής προς τον χρήστη web διεπαφής και API. Υποστηρίζει διάφορες μορφές εικόνων και προσφέρει ρυθμίσεις για μέγεθος εικόνας, περικοπή και όρια ανεβάσματος. Παράλληλα, το DeepSeek OCR διαθέτει τέσσερις βασικές λειτουργίες αναγνώρισης: Plain OCR για την αρχική εξαγωγή κειμένου, Describe για έξυπνες περιγραφές περιεχομένου εικόνας, Find για την υποστήριξη εντοπισμού λέξεων-κλειδιών με επιστροφή οπτικών πλαισίων οριοθέτησης και Freeform για ευέλικτες εργασίες κατανόησης εικόνας με βάση προσαρμοσμένες υποδείξεις.\n\n**Κύρια Χαρακτηριστικά:**\n- Υψηλή ακρίβεια αναγνώρισης κειμένου με DeepSeek-OCR, υποστηρίζει εικόνες και πολύσελιδα έγγραφα PDF\n- Διατηρεί τη διάταξη του εγγράφου συμπεριλαμβανομένων πινάκων, τύπων και δομημένης μορφοποίησης\n- Web Frontend (React) και REST API (FastAPI) για εύκολη χρήση και ενσωμάτωση συστήματος\n- Εξαγωγή αποτελεσμάτων σε μορφές Markdown, HTML, DOCX ή JSON\n- Αυτόματη εξαγωγή και ενσωμάτωση εικόνων από αρχεία PDF\n- Επιτάχυνση GPU και ανάπτυξη Docker για γρήγορη και κλιμακούμενη επεξεργασία\n\n**Μάθετε Περισσότερα:**\n- [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  fr: "DeepSeek OCR est un outil OCR (Reconnaissance Optique de Caractères) open source puissant basé sur le modèle avancé DeepSeek-AI. Il permet l'extraction précise de texte à partir d'images et de scans de documents via une interface web conviviale et une API. Prend en charge divers formats d'images et offre des configurations pour la taille d'image, le recadrage et les limites de téléversement. De plus, DeepSeek OCR propose quatre modes de reconnaissance principaux : Plain OCR pour l'extraction de texte brut, Describe pour les descriptions intelligentes du contenu des images, Find pour la localisation de mots-clés avec retour de cadres de délimitation visuels, et Freeform pour des tâches flexibles de compréhension d'images basées sur des invites personnalisées.\n\n**Fonctionnalités Clés:**\n- Reconnaissance de texte haute précision avec DeepSeek-OCR, supportant les images et les documents PDF multipages\n- Préserve la mise en page du document y compris les tableaux, les formules et le formatage structurel\n- Frontend web (React) et API REST (FastAPI) pour une utilisation facile et l'intégration système\n- Exporter les résultats aux formats Markdown, HTML, DOCX ou JSON\n- Extraction et intégration automatiques d'images à partir de fichiers PDF\n- Accélération GPU et déploiement Docker pour un traitement rapide et évolutif\n\n**En Savoir Plus:**\n- [Application DeepSeek OCR (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  hr: "DeepSeek OCR je moćan alat za OCR (Optical Character Recognition) otvorenog koda temeljen na naprednom modelu DeepSeek-AI. Omogućuje precizno izvlačenje teksta iz slika i skeniranih dokumenata putem korisničkog web sučelja i API-ja. Podržava različite formate slika i nudi konfiguracije za veličinu slike, rezanje i limite učitavanja. Dodatno, DeepSeek OCR sadrži četiri osnovna načina prepoznavanja: Plain OCR za izvorno izvlačenje teksta, Describe za inteligentne opise sadržaja slike, Find za lokalizaciju ključnih riječi s povratom vizualnih okvira ograničenja i Freeform za fleksibilne zadatke razumijevanja slika temeljene na prilagođenim uputama.\n\n**Ključne Značajke:**\n- Visoka točnost prepoznavanja teksta s DeepSeek-OCR, podržava slike i višestranične PDF dokumente\n- Očuvava izgled dokumenta uključujući tablice, formule i strukturno formatiranje\n- Web frontend (React) i REST API (FastAPI) za lako korištenje i integraciju sustava\n- Izvoz rezultata u Markdown, HTML, DOCX ili JSON formate\n- Automatsko izvlačenje i ugradnja slika iz PDF datoteka\n- GPU ubrzanje i Docker implementacija za brzo i skalabilno procesiranje\n\n**Saznajte Više:**\n- [DeepSeek OCR aplikacija (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  it: "DeepSeek OCR è uno strumento OCR (Optical Character Recognition) open source potente basato sul modello avanzato DeepSeek-AI. Consente l'estrazione precisa del testo da immagini e scansioni di documenti tramite un'interfaccia web user-friendly e API. Supporta vari formati immagine e offre configurazioni per dimensione immagine, ritaglio e limiti di upload. Inoltre, DeepSeek OCR presenta quattro modalità di riconoscimento principali: Plain OCR per l'estrazione di testo grezzo, Describe per descrizioni intelligenti del contenuto delle immagini, Find per la localizzazione di parole chiave con restituzione di bounding box visivi e Freeform per compiti flessibili di comprensione delle immagini basati su prompt personalizzati.\n\n**Funzionalità Principali:**\n- Riconoscimento testo ad alta precisione con DeepSeek-OCR, supporta immagini e documenti PDF multipagina\n- Mantiene il layout del documento inclusi tabelle, formule e formattazione strutturale\n- Frontend web (React) e API REST (FastAPI) per facile utilizzo e integrazione del sistema\n- Esporta risultati in formati Markdown, HTML, DOCX o JSON\n- Estrazione e incorporamento automatici di immagini da file PDF\n- Accelerazione GPU e distribuzione Docker per elaborazione rapida e scalabile\n\n**Scopri di Più:**\n- [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  ja: "DeepSeek OCRは、先進的なDeepSeek-AIモデルに基づく強力なオープンソースOCR（Optical Character Recognition）ツールです。ユーザー友好なWebインターフェースとAPI経由で、画像やドキュメントスキャンから正確にテキストを抽出します。さまざまな画像形式をサポートし、画像サイズ、クロップ、アップロード制限の設定を提供します。同時に、DeepSeek OCRには4つのコア認識モードがあります：生のテキスト抽出のためのPlain OCR、画像コンテンツのインテリジェントな説明のためのDescribe、視覚的境界ボックスを返すキーワードローカライゼーションのためのFind、カスタムプロンプトに基づく柔軟な画像理解タスクのためのFreeformです。\n\n**主な機能：**\n- DeepSeek-OCRによる高精度テキスト認識、画像と複数ページのPDFドキュメントをサポート\n- 表、数式、構造的フォーマットを含むドキュメントレイアウトを保持\n- 簡単な使用とシステム統合のためのWebフロントエンド（React）とREST API（FastAPI）\n- Markdown、HTML、DOCX、またはJSON形式で結果をエクスポート\n- PDFファイルからの画像の自動抽出と埋め込み\n- 高速でスケーラブルな処理のためのGPUアクセラレーションとDockerデプロイメント\n\n**詳細情報：**\n- [DeepSeek OCR アプリ (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  ko: "DeepSeek OCR은 고급 DeepSeek-AI 모델을 기반으로 한 강력한 오픈소스 OCR(광학 문자 인식) 도구입니다. 사용자 친화적인 웹 인터페이스와 API를 통해 이미지와 문서 스캔에서 정확한 텍스트 추출을 가능하게 합니다. 다양한 이미지 형식을 지원하며 이미지 크기, 자르기, 업로드 제한 등의 구성 옵션을 제공합니다. 또한 DeepSeek OCR은 네 가지 핵심 인식 모드를 제공합니다: 원시 텍스트 추출을 위한 Plain OCR, 이미지 콘텐츠의 지능적 설명을 위한 Describe, 시각적 경계 상자 반환과 함께 키워드 위치 지정을 위한 Find, 사용자 정의 프롬프트를 기반으로 한 유연한 이미지 이해 작업을 위한 Freeform입니다.\n\n**주요 기능:**\n- DeepSeek-OCR의 고정밀 텍스트 인식, 이미지와 다중 페이지 PDF 문서 지원\n- 표, 수식, 구조적 서식을 포함한 문서 레이아웃 보존\n- 쉬운 사용 및 시스템 통합을 위한 웹 프론트엔드(React) 및 REST API(FastAPI)\n- Markdown, HTML, DOCX 또는 JSON 형식으로 결과 내보내기\n- PDF 파일에서 이미지 자동 추출 및 임베딩\n- 빠르고 확장 가능한 처리를 위한 GPU 가속 및 Docker 배포\n\n**자세히 알아보기:**\n- [DeepSeek OCR 앱 (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  nb: "DeepSeek OCR er et kraftig open-source OCR-verktøy (Optical Character Recognition) basert på det avanserte DeepSeek-AI-modellen. Det muliggjør nøyaktig tekstuttrekking fra bilder og documentskanninger via et brukervennlig web-grensesnitt og API. Støtter ulike bildeformater og tilbyr konfigurasjoner for bildestørrelse, beskjæring og opplastingsgrenser. I tillegg har DeepSeek OCR fire kjerne gjenkjenningsmoduser: Plain OCR for rå tekstuttrekking, Describe for intelligente bildeinnholdsbeskrivelser, Find for nøkkelordlokalisering med visuelle avgrensningsbokser, og Freeform for fleksible bildeforståelsesoppgaver basert på tilpassede ledetekster.\n\n**Nøkkelegenskaper:**\n- Høy nøyaktighet tekstgjenkjenning med DeepSeek-OCR, støtter bilder og flersidige PDF-dokumenter\n- Bevarer dokumentlayout inkludert tabeller, formler og strukturert formatering\n- Web-frontend (React) og REST API (FastAPI) for enkel bruk og systemintegrasjon\n- Eksporter resultater til Markdown, HTML, DOCX eller JSON-formater\n- Automatisk uttrekking og innbygging av bilder fra PDF-filer\n- GPU-akselerasjon og Docker-distribusjon for rask og skalerbar behandling\n\n**Lær Mer:**\n- [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  pt: "DeepSeek OCR é uma ferramenta OCR (Reconhecimento Ótico de Caracteres) open source poderosa baseada no modelo avançado DeepSeek-AI. Permite a extração precisa de texto de imagens e digitalizações de documentos via interface web amigável ao usuário e API. Suporta vários formatos de imagem e oferece configurações para tamanho de imagem, corte e limites de upload. Além disso, o DeepSeek OCR apresenta quatro modos de reconhecimento principais: Plain OCR para extração de texto bruto, Describe para descrições inteligentes de conteúdo de imagem, Find para localização de palavras-chave com retorno de caixas delimitadoras visuais e Freeform para tarefas flexíveis de compreensão de imagem baseadas em prompts personalizados.\n\n**Funcionalidades Principais:**\n- Reconhecimento de texto de alta precisão com DeepSeek-OCR, suportando imagens e documentos PDF de múltiplas páginas\n- Preserva o layout do documento incluindo tabelas, fórmulas e formatação estrutural\n- Frontend web (React) e API REST (FastAPI) para uso fácil e integração do sistema\n- Exporte resultados para formatos Markdown, HTML, DOCX ou JSON\n- Extração e incorporação automáticas de imagens de arquivos PDF\n- Aceleração GPU e implantação Docker para processamento rápido e escalável\n\n**Saiba Mais:**\n- [Aplicação DeepSeek OCR (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  ru: "DeepSeek OCR — мощный инструмент OCR (Optical Character Recognition) с открытым исходным кодом на базе продвинутой модели DeepSeek-AI. Позволяет точно извлекать текст из изображений и сканов документов через удобный веб-интерфейс и API. Поддерживает различные форматы изображений и предлагает настройки размера изображения, обрезки и лимитов загрузки. Кроме того, DeepSeek OCR имеет четыре основных режима распознавания: Plain OCR для извлечения необработанного текста, Describe для интеллектуальных описаний содержимого изображений, Find для локализации ключевых слов с возвратом визуальных ограничивающих рамок и Freeform для гибких задач понимания изображений на основе настраиваемых подсказок.\n\n**Ключевые Особенности:**\n- Высокоточное распознавание текста с DeepSeek-OCR, поддерживает изображения и многостраничные PDF-документы\n- Сохраняет макет документа, включая таблицы, формулы и структурное форматирование\n- Веб-фронтенд (React) и REST API (FastAPI) для простого использования и интеграции системы\n- Экспорт результатов в форматы Markdown, HTML, DOCX или JSON\n- Автоматическое извлечение и встраивание изображений из PDF-файлов\n- Ускорение GPU и развертывание Docker для быстрой и масштабируемой обработки\n\n**Узнать Больше:**\n- [Приложение DeepSeek OCR (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  sv: "DeepSeek OCR är ett kraftfullt open source OCR-verktyg (Optical Character Recognition) baserat på den avancerade DeepSeek-AI-modellen. Det möjliggör exakt textutvinning från bilder och documentskanningar via ett användarvänligt webbgränssnitt och API. Stödjer olika bildformat och erbjuder konfigurationer för bildstorlek, beskärning och uppladdningsgränser. Dessutom har DeepSeek OCR fyra kärnigenkänningslägen: Plain OCR för rå textextrahering, Describe för intelligenta bildinnehållsbeskrivningar, Find för nyckelordslokalisering med visuella begränsningsrutor, och Freeform för flexibla bildförståelseuppgifter baserade på anpassade uppmaningar.\n\n**Nyckelfunktioner:**\n- Hög noggrannhet textigenkänning med DeepSeek-OCR, stöder bilder och flersidiga PDF-dokument\n- Bevarar dokumentlayout inklusive tabeller, formler och strukturerad formatering\n- Webb-frontend (React) och REST API (FastAPI) för enkel användning och systemintegration\n- Exportera resultat till Markdown, HTML, DOCX eller JSON-format\n- Automatisk extrahering och inbäddning av bilder från PDF-filer\n- GPU-acceleration och Docker-distribution för snabb och skalbar bearbetning\n\n**Läs Mer:**\n- [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  tr: "DeepSeek OCR, gelişmiş DeepSeek-AI modeline dayalı güçlü açık kaynaklı bir OCR (Optik Karakter Tanıma) aracıdır. Kullanıcı dostu web arayüzü ve API aracılığıyla görüntülerden ve belge taramalarından doğru metin çıkarma sağlar. Çeşitli görüntü formatlarını destekler ve görüntü boyutu, kırpma ve yükleme limitleri için yapılandırmalar sunar. Ayrıca, DeepSeek OCR dört temel tanıma modu sunar: ham metin çıkarma için Plain OCR, akıllı görüntü içeriği açıklamaları için Describe, görsel sınırlayıcı kutu dönüşleriyle anahtar kelime konumlandırma için Find ve özel istemlere dayalı esnek görüntü anlama görevleri için Freeform.\n\n**Temel Özellikler:**\n- DeepSeek-OCR ile yüksek doğrulukta metin tanıma, görüntüleri ve çok sayfalı PDF belgelerini destekler\n- Tablolar, formüller ve yapısal biçimlendirme dahil olmak üzere belge düzenini korur\n- Kolay kullanım ve sistem entegrasyonu için web ön yüz (React) ve REST API (FastAPI)\n- Sonuçları Markdown, HTML, DOCX veya JSON formatlarında dışa aktar\n- PDF dosyalarından görüntülerin otomatik çıkarılması ve gömülmesi\n- Hızlı ve ölçeklenebilir işlem için GPU hızlandırma ve Docker dağıtımı\n\n**Daha Fazla Bilgi:**\n- [DeepSeek OCR Uygulaması (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
  zh: "DeepSeek OCR 是一个基于先进 DeepSeek-AI 模型的强大开源 OCR（光学字符识别）工具。它通过用户友好的 Web 界面和 API，从图像和文档扫描中实现精确文本提取。支持多种图像格式，并提供图像大小、裁剪和上传限制配置。同时，DeepSeek OCR 内置四种核心识别模式：Plain OCR 用于原始文本抽取，Describe 提供智能图像内容描述，Find 支持关键词定位并返回视觉边界框，Freeform 则允许基于自定义提示进行灵活的图像理解任务。\n\n**主要功能：**\n- 使用 DeepSeek-OCR 的高精度文本识别，支持图像和多页 PDF 文档\n- 保留文档布局，包括表格、公式和结构化格式\n- Web 前端（React）和 REST API（FastAPI），便于使用和系统集成\n- 将结果导出为 Markdown、HTML、DOCX 或 JSON 格式\n- 从 PDF 文件中自动提取和嵌入图像\n- GPU 加速和 Docker 部署，实现快速和可扩展的处理\n\n**了解更多：**\n- [DeepSeek OCR 应用（GitHub）](https://github.com/rdumasia303/deepseek_ocr_app)"
  uk: "DeepSeek OCR — потужний інструмент OCR (оптичного розпізнавання символів) з відкритим кодом на основі сучасної моделі DeepSeek-AI. Він точно витягує текст із зображень і сканів документів через зручний вебінтерфейс та API. Підтримує різні формати зображень і дає змогу налаштувати розмір зображення, обрізання та обмеження завантаження. Також є чотири основні режими розпізнавання: Plain OCR — для витягування звичайного тексту, Describe — для розумного опису вмісту зображення, Find — для пошуку за ключовими словами з поверненням рамок на зображенні, і Freeform — для гнучкого аналізу зображень за вашими власними запитами.\n\n**Основні можливості:**\n- Точне розпізнавання тексту за допомогою DeepSeek-OCR, підтримка зображень і багатосторінкових PDF-документів\n- Збереження розмітки документа, зокрема таблиць, формул і структури\n- Вебінтерфейс (React) і REST API (FastAPI) для зручної роботи та інтеграції\n- Експорт результатів у Markdown, HTML, DOCX або JSON\n- Автоматичне витягування та вбудовування зображень із PDF-файлів\n- Прискорення на GPU й розгортання через Docker для швидкої та масштабованої обробки\n\n**Докладніше:**\n- [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)"
notes:
  en: "The first run will download the model (~5-10GB), which may take some time."
  de: Der erste Start lädt das Modell (~5–10 GB) herunter; das kann einige Zeit dauern.
  el: "Η πρώτη εκτέλεση θα κατεβάσει το μοντέλο (~5-10GB), οπότε ίσως χρειαστεί λίγη ώρα."
  fr: "Lors de la première exécution, le modèle (~5-10 Go) sera téléchargé, ce qui peut prendre un certain temps."
