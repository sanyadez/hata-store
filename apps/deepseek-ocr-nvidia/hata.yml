web:
  service: deepseek-ocr-frontend
  port: 80
settings:
  - name: DEEPSEEK_OCR_BACKEND_PORT_8000
    type: port
    default: 22523
    label:
      en: Backend API Port
      uk: Порт API бекенда
    advanced: true
  - name: API_HOST
    type: text
    default: 0.0.0.0
    label:
      en: API Host
      uk: Хост API
  - name: API_PORT
    type: text
    default: "8000"
    label:
      en: API Port
      uk: Порт API
  - name: FRONTEND_PORT
    type: text
    default: "3000"
    label:
      en: Frontend Port
      uk: Порт фронтенда
  - name: MODEL_NAME
    type: text
    default: deepseek-ai/DeepSeek-OCR
    label:
      en: Model Name
      uk: Назва моделі
  - name: HF_HOME
    type: text
    default: /models
    label:
      en: Hugging Face Home Directory
      uk: Домашня тека Hugging Face
  - name: MAX_UPLOAD_SIZE_MB
    type: text
    default: "100"
    label:
      en: Max Upload Size (MB)
      uk: Макс. розмір завантаження (МБ)
  - name: BASE_SIZE
    type: text
    default: "1024"
    label:
      en: Base Size
      uk: Базовий розмір
  - name: IMAGE_SIZE
    type: text
    default: "640"
    label:
      en: Image Size
      uk: Розмір зображення
  - name: CROP_MODE
    type: text
    default: "true"
    label:
      en: Crop Mode
      uk: Режим обрізання
  - name: WEB_PORT
    type: port
    default: 23000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
