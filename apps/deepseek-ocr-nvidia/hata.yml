  it: "Al primo avvio verrà scaricato il modello (~5-10 GB), operazione che può richiedere un po' di tempo."
  ja: 初回起動時にモデル（約5～10GB）がダウンロードされるため、完了まで時間がかかる場合があります。
  ko: 첫 실행 시 모델(~5~10GB)을 다운로드하므로 다소 시간이 걸릴 수 있습니다.
  nb: "Første gang du kjører appen lastes modellen ned (~5–10 GB), noe som kan ta litt tid."
  pt: "Na primeira execução será transferido o modelo (~5-10GB), o que pode demorar algum tempo."
  ru: При первом запуске будет загружена модель (~5–10 ГБ); это может занять некоторое время.
  sv: "Vid första körningen laddas modellen ned (~5–10 GB), vilket kan ta en stund."
  tr: İlk çalıştırmada model (~5-10GB) indirileceği için biraz zaman alabilir.
  zh: 首次运行会下载模型（约 5-10GB），可能需要一些时间。
  uk: "Під час першого запуску буде завантажено модель (~5–10 ГБ), це може зайняти деякий час."
