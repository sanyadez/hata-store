# Apache-2.0, changed for Hata Store: see NOTICE
services:
  deepseek-ocr-backend:
    image: icewhaletech/deepseek-ocr-backend:v2.2.0
    environment:
      API_HOST: "${API_HOST:-0.0.0.0}"
      API_PORT: "${API_PORT:-8000}"
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
      MODEL_NAME: "${MODEL_NAME:-deepseek-ai/DeepSeek-OCR}"
      HF_HOME: "${HF_HOME:-/models}"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-100}"
      BASE_SIZE: "${BASE_SIZE:-1024}"
      IMAGE_SIZE: "${IMAGE_SIZE:-640}"
      CROP_MODE: "${CROP_MODE:-true}"
    volumes:
      - "${APP_DATA:-.}/models:/models"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
          memory: 8G
    shm_size: 4g
    ports:
      - "${DEEPSEEK_OCR_BACKEND_PORT_8000:-22523}:8000"
    networks:
      - deepseek-ocr-network
    restart: unless-stopped
  deepseek-ocr-frontend:
    image: icewhaletech/deepseek-ocr-frontend:v2.2.0
    ports:
      - "${WEB_PORT:-23000}:80"
    deploy:
      resources:
        reservations:
          memory: 512M
    depends_on:
      - deepseek-ocr-backend
    networks:
      - deepseek-ocr-network
    restart: unless-stopped
networks:
  deepseek-ocr-network:
    driver: bridge
