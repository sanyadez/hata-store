# Apache-2.0, changed for Hata Store: see NOTICE
services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest@sha256:d4f908a2f620456c5833b3abb72bb9d7ee79830969e6c2e76662c666812a823f
    ports:
      - "${WEB_PORT:-3051}:3001"
    cap_add:
      - SYS_ADMIN
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/storage"
        target: /app/server/storage
    environment:
      STORAGE_DIR: /app/server/storage
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
