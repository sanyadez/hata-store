# Apache-2.0, changed for Hata Store: see NOTICE
title: AnythingLLM
tagline:
  en: The all-in-one AI application.
  uk: Універсальний застосунок зі штучним інтелектом.
description:
  en: "AnythingLLM is the easiest to use, all-in-one AI application that can do RAG, AI Agents, and much more with no code or infrastructure headaches."
  uk: "AnythingLLM — найпростіший у використанні універсальний застосунок зі штучним інтелектом, який уміє RAG, ШІ-агентів і багато іншого без коду та клопоту з інфраструктурою."
notes:
  en: "**Usage Tips** AnythingLLM supports but does not directly provide various LLMs backends, you need to configure the backends you need yourself. Please refer to the [official documentation](https://docs.anythingllm.com) for more information."
  uk: "**Поради щодо використання** AnythingLLM підтримує різні бекенди LLM, але сам їх не надає, тому потрібні бекенди слід налаштувати самостійно. Докладніше читайте в [офіційній документації](https://docs.anythingllm.com)."
category: ai
developer: Mintplex Labs
website: https://anythingllm.com
source: https://github.com/Mintplex-Labs/anything-llm
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: anythingllm
  port: 3001
settings:
  - name: WEB_PORT
    type: port
    default: 3051
    label:
      en: Web port
      uk: Порт вебінтерфейсу
permissions:
  capabilities:
    en: "It asks for extra rights of the system: SYS_ADMIN"
    uk: "Він просить додаткових прав у системі: SYS_ADMIN"
