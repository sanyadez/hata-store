title:
  en: Lazylibrarian
tagline:
  en: eBook Auto Downloader
  zh: eBook自动下载器
  ar: محمّل كتب إلكترونية تلقائي
  de: eBook Auto Downloader
  es: Descargador automático de libros electrónicos
  fr: Téléchargeur de livres électroniques automatique
  hu: eBook automatikus letöltő
  it: eBook Auto Downloader
  ru: Автоматический загрузчик электронных книг
  pl: Automatyczny pobieracz e-booków
  pt: eBook Auto Downloader
  sv: eBook Auto Downloader
  uk: Автоматичне завантаження електронних книг
description:
  en: Lazylibrarian is a program to follow authors and grab metadata for all your digital reading needs. It uses a combination of Goodreads Librarything and optionally GoogleBooks as sources for author info and book info. This container is based on the DobyTang fork.
  zh: Lazylibrarian是一个程序，用于跟踪作者并获取所有数字阅读需求的元数据。它使用Goodreads Librarything和可选的GoogleBooks作为作者信息和书籍信息的来源。此容器基于DobyTang分支。
  ar: Lazylibrarian هو برنامج لمتابعة المؤلفين والحصول على بيانات التعريف لجميع احتياجات القراءة الرقمية الخاصة بك. يستخدم مزيجًا من Goodreads Librarything واختياريًا GoogleBooks كمصادر لمعلومات المؤلف ومعلومات الكتاب. يعتمد هذا الحاوية على تفريع DobyTang.
  de: "Lazylibrarian ist ein Programm, um Autoren zu verfolgen und Metadaten für alle Ihre digitalen Lesebedürfnisse zu erhalten. Es verwendet eine Kombination aus Goodreads Librarything und optional GoogleBooks als Quellen für Autoren- und Buchinformationen. Dieser Container basiert auf dem DobyTang-Fork."
  es: Lazylibrarian es un programa para seguir autores y obtener metadatos para todas sus necesidades de lectura digital. Usa una combinación de Goodreads Librarything y opcionalmente GoogleBooks como fuentes de información de autor y libro. Este contenedor se basa en el bifurcación de DobyTang.
  fr: "Lazylibrarian est un programme pour suivre les auteurs et obtenir des métadonnées pour tous vos besoins de lecture numérique. Il utilise une combinaison de Goodreads Librarything et éventuellement GoogleBooks comme sources d'informations sur l'auteur et le livre. Ce conteneur est basé sur la fourchette DobyTang."
  hu: "A Lazylibrarian egy program, amely követi az írókat és lekérdezi az összes digitális olvasási igényének metadatáit. Goodreads Librarything és opcionálisan GoogleBooks kombinációját használja az írói és könyvi információk forrásaként. Ez a tároló a DobyTang fork alapján épül fel."
  it: "Lazylibrarian è un programma per seguire gli autori e ottenere i metadati per tutte le vostre esigenze di lettura digitali. Usa una combinazione di Goodreads Librarything e opzionalmente GoogleBooks come fonti di informazioni sull'autore e sul libro. Questo contenitore si basa sulla biforcazione di DobyTang."
  ru: Lazylibrarian - это программа для отслеживания авторов и получения метаданных для всех ваших цифровых потребностей в чтении. Он использует комбинацию Goodreads Librarything и по желанию GoogleBooks в качестве источников информации об авторе и книге. Этот контейнер основан на форке DobyTang.
  pl: Lazylibrarian to program do śledzenia autorów i pobierania metadanych dla wszystkich potrzeb czytania cyfrowego. Używa połączenia Goodreads Librarything i opcjonalnie GoogleBooks jako źródeł informacji o autorze i książce. Ten kontener oparty jest na forku DobyTang.
  pt: Lazylibrarian é um programa para seguir autores e obter metadados para todas as suas necessidades de leitura digital. Usa uma combinação de Goodreads Librarything e opcionalmente GoogleBooks como fontes de informações do autor e do livro. Este contêiner é baseado no fork DobyTang.
  sv: Lazylibrarian är ett program för att följa författare och hämta metadata för alla dina digitala läsningsbehov. Det använder en kombination av Goodreads Librarything och valfritt GoogleBooks som källor för författar- och bokinformation. Denna behållare baseras på DobyTang-forken.
  uk: "Lazylibrarian — програма, що стежить за авторами й збирає метадані для всього, що ви читаєте в цифровому форматі. Як джерела відомостей про авторів і книги вона поєднує Goodreads та Librarything, а за бажання ще й GoogleBooks. Цей контейнер ґрунтується на форку DobyTang."
category: media
developer: Lazylibrarian Team
website: https://lazylibrarian.gitlab.io/
source: https://github.com/lazylibrarian/LazyLibrarian
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: lazylibrarian
  port: 5299
settings:
  - name: WEB_PORT
    type: port
    default: 5299
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: LazyLibrarian downloads directory
      uk: Тека завантажень LazyLibrarian
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
  - name: BOOKS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Books"
    label:
      en: LazyLibrarian Books directory
      uk: Тека книг LazyLibrarian
    hint:
      en: Inside the app it is /books
      uk: У застосунку вона — /books
