# Apache-2.0, changed for Hata Store: see NOTICE
services:
  lazylibrarian:
    environment:
      DOCKER_MODS: linuxserver/calibre-web:calibre|linuxserver/mods:lazylibrarian-ffmpeg
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: linuxserver/lazylibrarian:version-169e669f
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-5299}:5299"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
      - type: bind
        source: "${BOOKS_DIR:-./Media/Books}"
        target: /books
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
