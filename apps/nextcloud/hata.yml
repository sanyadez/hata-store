title: Nextcloud
tagline:
  en: Files, calendars and contacts of your own, on every device
  uk: Власні файли, календарі й контакти на всіх пристроях
description:
  en: |
    A cloud of your own: files synced between computers and phones, shared by links, edited in the
    browser; calendars and contacts that phones sync with; and hundreds of apps on top — notes,
    tasks, photos, video calls.
  uk: |
    Власна хмара: файли, синхронізовані між комп'ютерами й телефонами, спільні за посиланнями,
    редаговані в браузері; календарі й контакти, з якими синхронізуються телефони; і сотні
    застосунків поверх — нотатки, завдання, фото, відеодзвінки.
notes:
  en: |
    The first start takes a few minutes: Nextcloud sets itself up with the administrator given here.
    It answers only at the addresses it knows — the app's address in Hata and those listed in
    "Other addresses" (both read at the first start only; later they are changed in config.php).
  uk: |
    Перший запуск триває кілька хвилин: Nextcloud налаштовується сам з адміністратором, указаним тут.
    Він відповідає лише за адресами, які знає, — адресою застосунку в Hata і тими, що вписані в
    «Інші адреси» (обидві читаються лише за першого запуску; потім їх змінюють у config.php).
category: files
developer: Nextcloud
website: https://nextcloud.com
source: https://github.com/nextcloud/server
icon: data:image/svg+xml;base64,
web:
  service: nextcloud
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 8081
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ADMIN_USER
    type: text
    default: admin
    required: true
    label: { en: Administrator, uk: Адміністратор }
  - name: ADMIN_PASSWORD
    type: password
    required: true
    label: { en: Administrator's password, uk: Пароль адміністратора }
  - name: TRUSTED_DOMAINS
    type: text
    label: { en: Other addresses, uk: Інші адреси }
    hint:
      en: Other host names it is opened at, separated by spaces
      uk: Інші імена, за якими його відкривають, через пробіл
  - name: UPLOAD_LIMIT
    type: text
    default: 16G
    advanced: true
    label: { en: Largest upload, uk: Найбільший файл для вивантаження }
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
