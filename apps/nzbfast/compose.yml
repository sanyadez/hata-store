# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  nzbfast:
    image: nzbfast/nzbfast:1.3.1
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      NZBFAST_APIKEY: ""
    ports:
      - "${WEB_PORT:-6790}:6789"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${APP_DATA:-.}/watch"
        target: /watch
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
    deploy:
      resources:
        reservations:
          memory: 128M
