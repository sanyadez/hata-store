title: Grocy
tagline:
  en: What is in the fridge and the pantry, and what to buy
  uk: Що є в холодильнику й коморі і що треба купити
description:
  en: >
    Groceries and household management for the family: stock with best-before dates, a shopping list
    that fills itself when something runs low, recipes that know what is at home, a meal plan, chores
    and batteries to change. A phone's camera scans barcodes straight into the stock.
  uk: >
    Облік продуктів і господарства для родини: запаси зі строками придатності, список покупок, що сам
    поповнюється, коли чогось замало, рецепти, які знають, що є вдома, план харчування, хатні справи й
    батарейки, які пора міняти. Камера телефона сканує штрихкоди одразу в запаси.
notes:
  en: >
    The first sign-in is **admin** with the password **admin**; change the password right after it.
  uk: >
    Перший вхід — **admin** з паролем **admin**; одразу після нього змініть пароль.
category: productivity
developer: Bernd Bestel
website: https://grocy.info
source: https://github.com/grocy/grocy
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: grocy
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 9283
    label: { en: Web port, uk: Порт вебінтерфейсу }
