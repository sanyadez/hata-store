title: Monica
tagline:
  en: A Personal Relationship Management tool to help you document your social life.
  uk: "Інструмент для керування особистими стосунками, що допомагає вести записи про ваше соціальне життя."
description:
  en: "Monica is a self-hosted personal relationship management tool that helps users document and organize interactions with family and friends via an intuitive Web interface, creating a personalized contact database. It is ideal for users balancing work and life, ensuring key personal connections are never missed.\n\nThe tool's core features include comprehensive contact management and smart reminders. It supports creating detailed contact profiles, logging personal details, relationships (e.g., family, friends), and how contacts were met. Users can set automatic reminders for birthdays, anniversaries, and other key dates, while tracking conversations, activities, and gift ideas. A diary feature records daily moods and significant moments, maintaining a clear life record.\n\nIt offers task and debt management to track to-dos or financial interactions. Users can upload photos and documents, favorite contacts, and organize relationships with labels for streamlined data management. Full control over local data ensures privacy. The tool’s intuitive operation and high flexibility deliver a modern relationship management solution.\n\n**Key Features:**\n- Comprehensive contact management with detailed profiles\n- Automatic reminders for birthdays, anniversaries, and key dates\n- Track conversations, activities, and gift ideas\n- Diary feature to record daily moods and moments\n- Task and debt management for to-dos and finances\n- Upload photos and documents, favorite contacts\n- Organize contacts with labels\n- Local data storage for privacy assurance\n\n**Learn More:**\n- [Monica Official Website](https://www.monicahq.com)\n- [Monica GitHub Repository](https://github.com/monicahq/monica)"
  uk: "Monica — інструмент для керування особистими стосунками, який ви розгортаєте самі. Він допомагає записувати та впорядковувати спілкування з родиною та друзями через зручний вебінтерфейс і створює персональну базу контактів. Підходить тим, хто поєднує роботу й особисте життя та не хоче випускати з уваги важливих людей.\n\nОсновні можливості — керування контактами та розумні нагадування. Можна створювати докладні профілі контактів, записувати особисті подробиці, зв'язки (родина, друзі) і те, як ви познайомилися. Для днів народження, річниць та інших важливих дат налаштовуються автоматичні нагадування, а ще можна вести облік розмов, подій і ідей подарунків. Щоденник фіксує щоденний настрій і важливі моменти, тож зберігається чіткий запис життя.\n\nДля завдань і боргів є окреме керування: можна стежити за справами чи фінансовими взаєминами. Можна завантажувати фото й документи, позначати контакти обраними та впорядковувати зв'язки мітками. Повний контроль над локальними даними гарантує приватність. Зрозуміла робота й висока гнучкість роблять це сучасним рішенням для керування стосунками.\n\n**Основні можливості:**\n- Повне керування контактами з докладними профілями\n- Автоматичні нагадування про дні народження, річниці та важливі дати\n- Облік розмов, подій і ідей подарунків\n- Щоденник для запису щоденного настрою та моментів\n- Керування завданнями та боргами\n- Завантаження фото й документів, обрані контакти\n- Впорядкування контактів за мітками\n- Локальне зберігання даних для приватності\n\n**Дізнатися більше:**\n- [Офіційний сайт Monica](https://www.monicahq.com)\n- [Репозиторій Monica на GitHub](https://github.com/monicahq/monica)"
