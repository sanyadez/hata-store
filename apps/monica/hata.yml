settings:
  - name: WEB_PORT
    type: port
    default: 18930
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: APP_KEY
    type: secret
    label:
      en: Application Encryption Key
      uk: Ключ шифрування застосунку
  - name: DB_HOST
    type: text
    default: monica-db
    label:
      en: Database Host
      uk: Хост бази даних
  - name: DB_USERNAME
    type: text
    default: monicauser
    label:
      en: Database Username
      uk: "Ім'я користувача бази даних"
  - name: DB_PASSWORD
    type: secret
    label:
      en: Password between its services
      uk: Пароль між його сервісами
  - name: MARIADB_RANDOM_ROOT_PASSWORD
    type: secret
    label:
      en: Generate Random Root Password
      uk: Згенерувати випадковий пароль root
  - name: MARIADB_DATABASE
    type: text
    default: monica
    label:
      en: Database Name
      uk: Назва бази даних
  - name: MARIADB_USER
    type: text
    default: monicauser
    label:
      en: Database User
      uk: Користувач бази даних
