# Apache-2.0, changed for Hata Store: see NOTICE
title: Emby(Nvidia GPU)
tagline:
  en: TAKE YOUR MEDIA ANYWHERE WITH EMBY
  uk: ВЗЯТИ СВОЇ МЕДІА З СОБОЮ З EMBY
description:
  en: "Bringing all of your home videos, music, and photos together into one place has never been easier. Your personal Emby Server automatically converts and streams your media on-the-fly to play on any device."
  uk: "Зібрати домашнє відео, музику й фото в одному місці ще ніколи не було так просто. Ваш особистий сервер Emby сам перетворює медіа та передає їх потоком на льоту, щоб їх можна було відтворити на будь-якому пристрої."
category: media
developer: Emby Team
website: https://emby.media/
source: https://hub.docker.com/r/emby/embyserver
icon: "data:image/svg+xml;base64,"
web:
  service: emby
  port: 8096
settings:
  - name: WEB_PORT
    type: port
    default: 8096
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_8920
    type: port
    default: 8920
    label:
      en: Port 8920
      uk: Порт 8920
    advanced: true
  - name: TV_SHOWS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/TV Shows"
    label:
      en: Media/TV Shows
      uk: Медіа/Серіали
    hint:
      en: Inside the app it is /data/tvshows
      uk: У застосунку вона — /data/tvshows
  - name: MOVIES_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Movies"
    label:
      en: Media/Movies
      uk: Медіа/Фільми
    hint:
      en: Inside the app it is /data/movies
      uk: У застосунку вона — /data/movies
  - name: UID
    type: text
    default: "1000"
    label:
      en: UID used to run Emby
      uk: "UID, від імені якого працює Emby"
  - name: GID
    type: text
    default: "100"
    label:
      en: Primary GID used to run Emby
      uk: "Основний GID, від імені якого працює Emby"
  - name: GIDLIST
    type: text
    default: "100"
    label:
      en: Gidlist
      uk: Список GID
    hint:
      en: "Comma-separated supplementary group IDs. The default includes users (100), video (44), and render (109); adjust these IDs if the host uses different values."
      uk: "Ідентифікатори додаткових груп через кому. Типово це users (100), video (44) і render (109); змініть їх, якщо на хості інші значення."
permissions:
  devices:
    en: "It uses devices of the server: /dev/dri, /dev/vchiq, /dev/video10, /dev/video11, /dev/video12"
    uk: "Він користується пристроями сервера: /dev/dri, /dev/vchiq, /dev/video10, /dev/video11, /dev/video12"
