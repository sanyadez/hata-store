title: ntfy
tagline:
  en: Push notifications to your phone from scripts, apps and Hata itself
  uk: Сповіщення на телефон від скриптів, застосунків і самої Hata
description:
  en: >
    A notification server of your own. Anything that can make a web request — a backup script, a
    smart home, a monitoring tool — sends a message to a topic, and the ntfy app on the phone or the
    browser shows it at once. Hata can send its own notifications there too: choose ntfy in Hata's
    notification settings.
  uk: >
    Власний сервер сповіщень. Усе, що вміє надіслати вебзапит, — скрипт резервного копіювання,
    розумний дім, моніторинг — шле повідомлення в тему, і застосунок ntfy на телефоні чи браузер
    одразу його показує. Hata теж може надсилати туди свої сповіщення: виберіть ntfy у налаштуваннях
    сповіщень Hata.
notes:
  en: >
    Sign in to the app on the phone with the administrator's name and password. To send from a
    script or from Hata, make an access token in the web page: account, then "Access tokens".
  uk: >
    У застосунку на телефоні входьте з ім'ям і паролем адміністратора. Щоб надсилати зі скрипта чи
    з Hata, створіть токен доступу на вебсторінці: обліковий запис, далі «Токени доступу».
category: productivity
developer: Philipp Heckel
website: https://ntfy.sh
source: https://github.com/binwiederhier/ntfy
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: ntfy
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 8093
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ADMIN_USER
    type: text
    default: admin
    required: true
    label: { en: Administrator's name, uk: Ім'я адміністратора }
  - name: ADMIN_PASSWORD
    type: password
    required: true
    label: { en: Administrator's password, uk: Пароль адміністратора }
  - name: ACCESS
    type: choice
    default: deny-all
    label: { en: Who may use the topics, uk: Хто може користуватися темами }
    options:
      - value: deny-all
        label:
          en: Only those with a password or token
          uk: Лише ті, хто має пароль чи токен
      - value: read-write
        label:
          en: Anyone who can reach the server
          uk: Будь-хто, хто має доступ до сервера
