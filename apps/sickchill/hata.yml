web:
  service: sickchill
  port: 8081
settings:
  - name: WEB_PORT
    type: port
    default: 8081
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads
      uk: Завантаження
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
  - name: TV_SHOWS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/TV Shows"
    label:
      en: Media/TV Shows
      uk: Медіа/Серіали
    hint:
      en: Inside the app it is /tv
      uk: У застосунку вона — /tv
