title:
  en: Sickchill
tagline:
  en: Automatic video library manager for TV Shows
  zh: 自动视频库管理器
  ar: مدير مكتبة الفيديو التلقائي للبرامج التلفزيونية
  de: Automatischer Video-Bibliotheksmanager für TV-Shows
  es: Administrador automático de bibliotecas de video para programas de televisión
  fr: Gestionnaire de bibliothèque vidéo automatique pour les émissions de télévision
  hu: Automatikus videókönyvtárkezelő a TV-műsorokhoz
  it: Gestore automatico di librerie video per programmi televisivi
  ru: Автоматический менеджер видеобиблиотек для телевизионных шоу
  pl: Automatyczny menedżer bibliotek wideo dla programów telewizyjnych
  pt: Gerenciador automático de bibliotecas de vídeo para programas de TV
  sv: Automatisk videobibliotekshanterare för TV-program
  uk: Автоматичний менеджер відеобібліотеки серіалів
description:
  en: "SickChill is an automatic Video Library Manager for TV Shows. It watches for new episodes of your favorite shows, and when they are posted it does its magic: automatic torrent/nzb searching, downloading, and processing at the qualities you want."
  zh: SickChill是一个自动视频库管理器。它会监视您喜欢的节目的新剧集，当它们发布时，它会自动搜索、下载和处理您想要的质量。
  ar: "SickChill هو مدير مكتبة الفيديو التلقائي للبرامج التلفزيونية. يراقبها للحصول على حلقات جديدة من البرامج التلفزيونية المفضلة لديك ، وعندما يتم نشرها ، يقوم بعملها السحري: البحث التلقائي عن التورنت / nzb ، التنزيل ، والمعالجة بالجودات التي تريدها."
  de: "SickChill ist ein automatischer Video-Bibliotheksmanager für TV-Shows. Es überwacht neue Episoden Ihrer Lieblingssendungen und wenn sie veröffentlicht werden, macht es seine Magie: automatische Torrent / nzb-Suche, Download und Verarbeitung in der Qualität, die Sie möchten."
  es: "SickChill es un administrador automático de bibliotecas de video para programas de televisión. Vigila nuevas episodios de tus programas favoritos, y cuando se publican, hace su magia: búsqueda automática de torrents / nzbs, descarga y procesamiento en las calidades que desea."
  fr: "SickChill est un gestionnaire de bibliothèque vidéo automatique pour les émissions de télévision. Il surveille les nouvelles épisodes de vos émissions préférées, et lorsque elles sont publiées, il fait sa magie: recherche automatique de torrents / nzbs, téléchargement et traitement dans les qualités que vous souhaitez."
  hu: "A SickChill egy automatikus videókönyvtárkezelő a TV-műsorokhoz. Megfigyeli a kedvenc műsoraid új részeit, és amikor megjelennek, csodálatos dolgokat tesz: automatikus torrent / nzb keresés, letöltés és feldolgozás a kívánt minőségben."
  it: "SickChill è un gestore automatico di librerie video per programmi televisivi. Monitora nuovi episodi dei tuoi programmi preferiti, e quando vengono pubblicati, fa la sua magia: ricerca automatica di torrent / nzbs, download e elaborazione nelle qualità che desideri."
  ru: "SickChill - это автоматический менеджер видеобиблиотек для телевизионных шоу. Он следит за новыми эпизодами ваших любимых шоу, и когда они выпускаются, он делает свою магию: автоматический поиск торрентов / nzbs, загрузка и обработка в качестве, которое вы хотите."
  pl: "SickChill jest automatycznym menedżerem bibliotek wideo dla programów telewizyjnych. Obserwuje nowe odcinki ulubionych programów telewizyjnych, a gdy są opublikowane, robi swoją magię: automatyczne wyszukiwanie torrentów / nzbs, pobieranie i przetwarzanie w jakości, którą chcesz."
  pt: "SickChill é um gerenciador automático de bibliotecas de vídeo para programas de TV. Ele observa novos episódios de seus programas favoritos e quando são publicados, faz sua magia: busca automática de torrents / nzbs, download e processamento nas qualidades que você deseja."
  sv: "SickChill är en automatisk videobibliotekshanterare för TV-program. Den övervakar nya avsnitt av dina favoritprogram och när de publiceras gör den sin magi: automatisk torrent / nzb-sökning, nedladdning och bearbetning i de kvaliteter du vill ha."
  uk: "SickChill — автоматичний менеджер відеобібліотеки серіалів. Він стежить за новими епізодами ваших улюблених серіалів і, щойно вони з’являються, робить усе сам: шукає торренти й nzb, завантажує та обробляє їх у потрібній вам якості."
category: media
developer: Sickchill Team
website: https://sickchill.github.io
source: https://github.com/SickChill/SickChill
