# Apache-2.0, changed for Hata Store: see NOTICE
title: Duplicati
tagline:
  en: Store securely encrypted backups in the cloud!
  uk: Надійні зашифровані резервні копії в хмарі!
description:
  en: "Duplicati is a free, open source, backup client that securely stores encrypted, incremental, compressed backups on cloud storage services and remote file servers."
  uk: "Duplicati — безкоштовний клієнт резервного копіювання з відкритим кодом. Він надійно зберігає зашифровані, інкрементні, стиснуті резервні копії в хмарних сховищах і на віддалених файлових серверах."
category: productivity
developer: duplicati
website: https://duplicati.com/
source: https://github.com/duplicati/duplicati
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: duplicati
  port: 8200
settings:
  - name: SETTINGS_ENCRYPTION_KEY
    type: secret
    label:
      en: Key of its settings
      uk: Ключ його налаштувань
  - name: WEB_PASSWORD
    type: password
    required: true
    label:
      en: Password of its page
      uk: Пароль його сторінки
  - name: WEB_PORT
    type: port
    default: 8200
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: BACKUPS_DIR
    type: folder
    default: "${DATA_ROOT}/Duplicati/backups"
    label:
      en: Duplicati/backups
      uk: Duplicati/backups
    hint:
      en: Inside the app it is /backups
      uk: У застосунку вона — /backups
  - name: SOURCE_DIR
    type: folder
    default: "${DATA_ROOT}/Duplicati/source"
    label:
      en: Duplicati/source
      uk: Duplicati/source
    hint:
      en: Inside the app it is /source
      uk: У застосунку вона — /source
