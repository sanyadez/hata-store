# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: MySpeed
  pt: MySpeed
tagline:
  en: Analysis software that shows your internet speed for up to 30 days.
  pt: Software de análise que mostra a velocidade da sua internet por até 30 dias.
  zh: 记录网速度长达30天的分析软件。
  uk: Програма для аналізу швидкості вашого інтернету за останні 30 днів.
description:
  en: MySpeed is a speed test analysis software that stores the speed of your internet for up to 30 days. This can also be useful if you want to know when your network might have drops or if you want to check if your internet matches the booked values from your contract.
  pt: MySpeed ​​é um software de análise de teste de velocidade que armazena a velocidade da sua internet por até 30 dias. Isso também pode ser útil se você quiser saber quando sua rede pode sofrer quedas ou se quiser verificar se sua internet corresponde aos valores contratados em seu contrato.
  zh: MySpeed是一款速度测试分析软件，可以存储您的互联网速度长达30天。如果您想知道您的网络何时可能会掉线，或者想要检查您的互联网是否与合同中预订的数值相匹配，这也可能会有所帮助。
  uk: "MySpeed — програма для аналізу тестів швидкості, яка зберігає дані про швидкість вашого інтернету до 30 днів. Це стане в пригоді, якщо ви хочете знати, коли в мережі бувають збої, або перевірити, чи відповідає швидкість інтернету тій, що вказано в договорі."
category: network
developer: Mathias Wagner
website: https://myspeed.dev
source: https://github.com/gnmyt/myspeed
