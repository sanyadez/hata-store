# Apache-2.0, changed for Hata Store: see NOTICE
services:
  myspeed:
    deploy:
      resources:
        limits:
          memory: 256M
    image: germannewsmaker/myspeed:1.0.9
    ports:
      - "${WEB_PORT:-5216}:5216"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /myspeed/data
    privileged: false
