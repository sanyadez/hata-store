title: Beszel
tagline:
  en: A light watch over the server and its containers, with history and alerts
  uk: Легкий нагляд за сервером і його контейнерами, з історією й сповіщеннями
description:
  en: >
    A small monitoring hub with an agent for this server in one app. It draws the history of the
    processor, memory, disks, network and temperatures, and of every Docker container, and warns
    you when something runs too hot or too full. Other machines can be added with an agent of their own.
  uk: >
    Невеликий центр моніторингу разом з агентом для цього сервера в одному застосунку. Малює історію
    процесора, пам'яті, дисків, мережі й температур, а також кожного контейнера Docker, і попереджає,
    коли щось перегрівається чи заповнюється. Інші комп'ютери можна додати з власним агентом.
notes:
  en: >
    At the first visit Beszel asks to make an account. Then one more step: press **Add system**, give
    it a name, put **/beszel_socket/beszel.sock** as the host, copy the **public key** from that dialog
    into the "Hub key" setting of this app and save; then add the system in Beszel.
  uk: >
    Під час першого відкриття Beszel попросить створити обліковий запис. Далі ще один крок: натисніть
    **Add system**, дайте назву, як адресу вкажіть **/beszel_socket/beszel.sock**, скопіюйте
    **публічний ключ** із цього вікна в налаштування «Ключ центру» цього застосунку й збережіть; тоді
    додайте систему в Beszel.
category: monitoring
developer: henrygd
website: https://beszel.dev
source: https://github.com/henrygd/beszel
icon: data:image/svg+xml;base64,
web:
  service: beszel
  port: 8090
settings:
  - name: WEB_PORT
    type: port
    default: 8090
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: KEY
    type: text
    label: { en: Hub key, uk: Ключ центру }
    hint:
      en: Leave it empty at first. The public key from Beszel's "Add system" dialog, starting with ssh-ed25519
      uk: Спершу залиште порожнім. Публічний ключ із вікна «Add system» у Beszel, починається з ssh-ed25519
permissions:
  host-network:
    en: The agent uses the server's own network to see its real traffic
    uk: Агент працює в мережі самого сервера, щоб бачити справжній трафік
  docker:
    en: "The agent reads Docker's socket to show each container's use; the socket gives control of Docker, though the agent only reads"
    uk: "Агент читає сокет Docker, щоб показувати навантаження кожного контейнера; сокет дає керування Docker, хоч агент лише читає"
