# Apache-2.0, changed for Hata Store: see NOTICE
services:
  frontend:
    image: taskingai/taskingai-console:v0.3.0
    depends_on:
      - backend-web
      - backend-api
    networks:
      - taskingai_network
    restart: unless-stopped
  backend-inference:
    image: taskingai/taskingai-inference:v0.2.14
    environment:
      AES_ENCRYPTION_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      ICON_URL_PREFIX: http://nginx:3080
      PROJECT_ID: taskingai
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - taskingai_network
    restart: unless-stopped
  backend-plugin:
    image: taskingai/taskingai-plugin:v0.2.10
    environment:
      AES_ENCRYPTION_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      ICON_URL_PREFIX: http://nginx:3080
      OBJECT_STORAGE_TYPE: local
      HOST_URL: http://nginx:3080
      PATH_TO_VOLUME: /var/lib/data
      PROJECT_ID: taskingai
    volumes:
      - "${APP_DATA:-.}/data/object_storage:/var/lib/data"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - taskingai_network
    restart: unless-stopped
  backend-api:
    image: taskingai/taskingai-server:v0.3.0
    environment:
      POSTGRES_URL: "postgres://postgres:${DB_PASSWORD_2:?set DB_PASSWORD_2}@db:5432/taskingai"
      REDIS_URL: "redis://:${DB_PASSWORD_2:?set DB_PASSWORD_2}@cache:6379/0"
      TASKINGAI_INFERENCE_URL: http://backend-inference:8000
      TASKINGAI_PLUGIN_URL: http://backend-plugin:8000
      AES_ENCRYPTION_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      OBJECT_STORAGE_TYPE: local
      HOST_URL: http://nginx:3080
      PATH_TO_VOLUME: /var/lib/data
      PROJECT_ID: taskingai
    volumes:
      - "${APP_DATA:-.}/data/object_storage:/var/lib/data"
    depends_on:
      - db
      - cache
      - backend-inference
      - backend-plugin
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - taskingai_network
    restart: unless-stopped
  backend-web:
    image: taskingai/taskingai-server:v0.3.0
    environment:
      POSTGRES_URL: "postgres://postgres:${DB_PASSWORD_2:?set DB_PASSWORD_2}@db:5432/taskingai"
      REDIS_URL: "redis://:${DB_PASSWORD_2:?set DB_PASSWORD_2}@cache:6379/0"
      TASKINGAI_INFERENCE_URL: http://backend-inference:8000
      TASKINGAI_PLUGIN_URL: http://backend-plugin:8000
      AES_ENCRYPTION_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?set JWT_SECRET_KEY}"
      PURPOSE: WEB
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: "${DB_PASSWORD_2:?set DB_PASSWORD_2}"
      OBJECT_STORAGE_TYPE: local
      HOST_URL: http://nginx:3080
      PATH_TO_VOLUME: /var/lib/data
      PROJECT_ID: taskingai
    volumes:
      - "${APP_DATA:-.}/data/object_storage:/var/lib/data"
    depends_on:
      - db
      - cache
      - backend-inference
      - backend-plugin
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - taskingai_network
    restart: unless-stopped
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_DB: taskingai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD_2:?set DB_PASSWORD_2}"
    volumes:
      - "${APP_DATA:-.}/data/postgres:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - taskingai_network
  cache:
    image: redis:7-alpine
    command:
      - redis-server
      - "--requirepass"
      - TaskingAI321
    volumes:
      - "${APP_DATA:-.}/data/redis:/data"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - auth
        - TaskingAI321
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - taskingai_network
  nginx:
    image: nginx:1.24
    ports:
      - "${NGINX_PORT_80:-3080}:80"
    volumes:
      - "${APP_DATA:-.}/data/nginx_cache:/var/cache/nginx"
    depends_on:
      - frontend
      - backend-web
      - backend-api
    networks:
      - taskingai_network
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
networks:
  taskingai_network:
    driver: bridge
configs:
  nginx_config:
    content: "server {\n  listen 80;\n\n  client_max_body_size 20M;\n\n  location /images/providers/icons/ {\n      proxy_pass http://backend-inference:8000;\n  }\n\n  location /images/plugins/bundles/icons/ {\n      proxy_pass http://backend-plugin:8000;\n  }\n\n  location /api/v1/ {\n      proxy_pass http://backend-web:8000;\n      proxy_http_version 1.1;\n      proxy_set_header Connection '';\n      proxy_buffering off;\n      proxy_cache off;\n      proxy_read_timeout 24h;\n  }\n\n  location /v1/ {\n      proxy_pass http://backend-api:8000;\n      proxy_http_version 1.1;\n      proxy_set_header Connection '';\n      proxy_buffering off;\n      proxy_cache off;\n      proxy_read_timeout 24h;\n  }\n\n  location /imgs/ {\n      proxy_pass http://backend-web:8000;\n  }\n\n  location / {\n      proxy_pass http://frontend:80;\n  }\n}\n"
