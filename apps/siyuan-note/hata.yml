title: SiYuan Note
tagline:
  en: Private personal knowledge management
  uk: Приватне особисте керування знаннями
description:
  en: "Experience Seamless Knowledge Management with SiYuan. SiYuan redefines knowledge management by seamlessly integrating with your home TV, mobile devices, and other platforms. Unlike traditional knowledge systems, SiYuan offers a cohesive and flexible environment that adapts to your lifestyle, allowing you to access and organize information effortlessly across all your devices. Whether you are a creator or a regular consumer, SiYuan's innovative approach ensures your knowledge is always at your fingertips.\n\nPowerful Features, Minimal Cost. SiYuan stands out with its robust set of features, most of which are free, even for commercial use. Enjoy block-level referencing, two-way links, custom attributes, SQL query embeds, and the unique protocol siyuan://. The editor supports block-style, markdown WYSIWYG, list outlines, and block zoom-in. Handle large documents with ease and include mathematical formulas, charts, flowcharts, and more. Capture web content, annotate PDFs, and export in various formats including Markdown, PDF, Word, and HTML. SiYuan also offers AI-powered writing and Q/A chat via OpenAI API, Tesseract OCR, and multi-tab support for a comprehensive and seamless experience."
  uk: "Керуйте знаннями легко з SiYuan. SiYuan по-новому підходить до керування знаннями: він інтегрується з вашим домашнім телевізором, мобільними пристроями та іншими платформами. На відміну від традиційних систем, SiYuan пропонує цілісне й гнучке середовище, що підлаштовується під ваш спосіб життя, і дає змогу без зусиль отримувати доступ до інформації та впорядковувати її на всіх пристроях. Чи ви автор, чи звичайний користувач, підхід SiYuan гарантує, що ваші знання завжди під рукою.\n\nПотужні можливості за мінімальну ціну. SiYuan вирізняється широким набором функцій, більшість з яких безкоштовні, навіть для комерційного використання. Це посилання на рівні блоків, двосторонні посилання, власні атрибути, вбудовані SQL-запити та унікальний протокол siyuan://. Редактор підтримує блоковий стиль, markdown WYSIWYG, списки-структури та наближення блоків. Він легко працює з великими документами й дозволяє додавати математичні формули, діаграми, блок-схеми тощо. Можна зберігати вебвміст, робити позначки в PDF та експортувати у різні формати, зокрема Markdown, PDF, Word і HTML. SiYuan також пропонує письмо за допомогою ШІ та чат запитань і відповідей через OpenAI API, розпізнавання тексту Tesseract OCR і підтримку кількох вкладок для зручної роботи."
