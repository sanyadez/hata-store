# Apache-2.0, changed for Hata Store: see NOTICE
services:
  siyuan-note:
    command: "serve --accessAuthCode=${ACCESS_CODE:?set ACCESS_CODE} --workspace=/siyuan/workspace/"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    image: b3log/siyuan:v3.8.8
    deploy:
      resources:
        reservations:
          memory: 512M
    ports:
      - "${WEB_PORT:-6806}:6806"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/workspace"
        target: /siyuan/workspace
