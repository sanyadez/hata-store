title: Alist-Sync
tagline:
  en: An Alist storage synchronization tool based on the Web interface.
  uk: Засіб синхронізації сховищ Alist із вебінтерфейсом.
description:
  en: "Alist-Sync is a storage synchronization tool based on the Web interface. It can achieve data synchronization and mutual backup among multiple network disks, and also has practical functions such as multi-task management, scheduled synchronization and difference handling."
  uk: "Alist-Sync — засіб синхронізації сховищ із вебінтерфейсом. Він синхронізує дані та створює взаємні резервні копії між кількома мережевими дисками, а також має корисні функції: керування кількома завданнями, синхронізацію за розкладом і обробку відмінностей."
notes:
  en: The default login password is admin/admin.
  uk: "Типовий логін і пароль для входу: admin/admin."
category: productivity
developer: xjxjin
website: https://github.com/xjxjin/alist-sync
source: https://github.com/xjxjin/alist-sync
icon: "data:image/webp;base64,"
