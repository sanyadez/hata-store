web:
  service: ztnet
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3050
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: ZT_ADDR
    type: text
    default: http://172.17.0.1:9993
    label:
      en: ZeroTier controller address
      uk: Адреса контролера ZeroTier
  - name: POSTGRES_HOST
    type: text
    default: ztnet-postgres
    label:
      en: PostgreSQL Host
      uk: Хост PostgreSQL
  - name: POSTGRES_PORT
    type: text
    default: "5432"
    label:
      en: PostgreSQL Port
      uk: Порт PostgreSQL
  - name: POSTGRES_USER
    type: text
    default: ztnet
    label:
      en: PostgreSQL User
      uk: Користувач PostgreSQL
  - name: DB_PASSWORD
    type: secret
    label:
      en: Password between its services
      uk: Пароль між його сервісами
  - name: POSTGRES_DB
    type: text
    default: ztnet
    label:
      en: PostgreSQL Database Name
      uk: Назва бази даних PostgreSQL
  - name: NEXTAUTH_URL
    type: text
    default: http://0.0.0.0:3050
    label:
      en: Canonical URL of your site
      uk: Канонічна адреса вашого сайту
  - name: NEXTAUTH_SECRET
    type: secret
    length: 23
    label:
      en: NextAuth Secret Key
      uk: Секретний ключ NextAuth
  - name: NEXTAUTH_URL_INTERNAL
    type: text
    default: http://ztnet:3000
    label:
      en: Server-side URL for NEXTAUTH
      uk: Серверна адреса для NEXTAUTH
  - name: POSTGRES_USER_2
    type: text
    default: ztnet
    label:
      en: PostgreSQL User
      uk: Користувач PostgreSQL
  - name: POSTGRES_DB_2
    type: text
    default: ztnet
    label:
      en: PostgreSQL Database Name
      uk: Назва бази даних PostgreSQL
permissions:
  host-files:
    en: "It reaches these places of the system: /var/lib/zerotier-one"
    uk: "Він має доступ до цих місць системи: /var/lib/zerotier-one"
