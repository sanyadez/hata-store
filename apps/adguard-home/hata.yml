title: AdGuard Home
tagline:
  en: Network-wide ad and tracker blocking
  uk: Блокування реклами й трекерів у всій мережі
description:
  en: "Difference from Traditional Ad Blockers. Unlike traditional ad-blocking plugins that work only on individual devices, AdGuard Home offers a network-wide solution. By setting it up, you can block ads and trackers across all your home devices without needing to install any additional software on each device. This means comprehensive protection with minimal effort.\n\nHow AdGuard Home Works and How to Use It. AdGuard Home functions as a DNS server that reroutes tracking domains to a \"black hole,\" effectively preventing your devices from connecting to these servers. This blocks ads and trackers not only on your computer but also on your smartphone and smart home devices. To start using AdGuard Home, deploy it on your device, then change the DNS address assigned by DHCP on your router to the IP address of your AdGuard Home server."
  uk: "Чим відрізняється від звичайних блокувальників реклами. Звичайні розширення для блокування реклами працюють лише на окремому пристрої, а AdGuard Home блокує рекламу й трекери в усій мережі. Налаштувавши його, ви захистите всі домашні пристрої, не встановлюючи нічого на кожен із них. Повний захист — майже без зусиль.\n\nЯк працює AdGuard Home і як ним користуватися. AdGuard Home працює як DNS-сервер: домени, що стежать за користувачем, він спрямовує в «чорну діру», і ваші пристрої просто не можуть з’єднатися з цими серверами. Так блокується реклама й трекери не лише на комп’ютері, а й на смартфоні та пристроях розумного дому. Щоб почати, запустіть AdGuard Home на своєму пристрої, а потім у налаштуваннях роутера замініть DNS-адресу, яку видає DHCP, на IP-адресу сервера з AdGuard Home."
category: network
developer: AdguardTeam
website: https://adguard.com/en/adguard-home/overview.html
source: https://github.com/AdguardTeam/AdGuardHome
