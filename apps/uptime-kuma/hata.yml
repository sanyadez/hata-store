title: Uptime Kuma
tagline:
  en: Watches your sites and services and tells you when one goes down
  uk: Стежить за сайтами й сервісами і каже, коли щось ляже
description:
  en: >
    A self-hosted monitoring tool. Checks websites, ports, DNS records, Docker containers and more
    every minute, draws the history of each, and sends a notification to Telegram, ntfy, e-mail or
    dozens of other services when something stops answering. Public status pages included.
  uk: >
    Моніторинг на власному сервері. Щохвилини перевіряє сайти, порти, записи DNS, контейнери Docker
    тощо, малює історію кожного й надсилає сповіщення в Telegram, ntfy, на пошту чи в десятки інших
    сервісів, коли щось перестає відповідати. Є й публічні сторінки стану.
category: monitoring
developer: Louis Lam
website: https://uptime.kuma.pet
source: https://github.com/louislam/uptime-kuma
icon: data:image/svg+xml;base64,
web:
  service: uptime-kuma
  port: 3001
settings:
  - name: WEB_PORT
    type: port
    default: 3001
    label: { en: Web port, uk: Порт вебінтерфейсу }
