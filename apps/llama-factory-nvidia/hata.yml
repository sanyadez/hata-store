title: LLaMA Factory(Nvidia GPU)
tagline:
  en: Unified LLM Fine-Tuning with 100+ Models
  uk: Єдине тонке налаштування LLM зі 100+ моделями
description:
  en: "LLaMA Factory is a comprehensive framework for fine-tuning Large Language Models (LLMs) with support for over 100 models. It provides a user-friendly web interface and powerful training methods including LoRA, QLoRA, and full-parameter training.\n\n**Key Features:**\n- Support for 100+ LLMs including LLaMA, Mistral, Qwen, and more\n- Multiple fine-tuning methods (LoRA, QLoRA, Full, Freeze)\n- Intuitive Web UI for easy model management\n- Built-in API server for model inference\n- Multi-GPU training support\n- Quantization and model export capabilities\n\n**Hardware Requirements:**\n- GPU: NVIDIA GPU with CUDA support required\n\n**Learn More:**\n- [GitHub Repository](https://github.com/hiyouga/LLaMA-Factory)\n- [Documentation](https://llamafactory.readthedocs.io/)"
  uk: "LLaMA Factory — комплексний фреймворк для тонкого налаштування великих мовних моделей (LLM) з підтримкою понад 100 моделей. Має зручний вебінтерфейс і потужні методи навчання, зокрема LoRA, QLoRA та навчання всіх параметрів.\n\n**Основні можливості:**\n- Підтримка понад 100 LLM, зокрема LLaMA, Mistral, Qwen та інших\n- Кілька методів тонкого налаштування (LoRA, QLoRA, Full, Freeze)\n- Зрозумілий вебінтерфейс для зручного керування моделями\n- Вбудований сервер API для інференсу моделей\n- Підтримка навчання на кількох GPU\n- Квантизація та експорт моделей\n\n**Вимоги до обладнання:**\n- GPU: потрібна відеокарта NVIDIA з підтримкою CUDA\n\n**Докладніше:**\n- [Репозиторій на GitHub](https://github.com/hiyouga/LLaMA-Factory)\n- [Документація](https://llamafactory.readthedocs.io/)"
