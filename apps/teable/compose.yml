# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  teable:
    image: teableio/teable:latest@sha256:daae4151e112811f0a59b178a8076393112fbc00ed2b6490dc0d10b696bd4af8
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 512M
    ports:
      - "${WEB_PORT:-3200}:3000"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/assets"
        target: /app/.assets
    environment:
      TZ: "${TZ:-UTC}"
      NEXT_ENV_IMAGES_ALL_REMOTE: "${NEXT_ENV_IMAGES_ALL_REMOTE:-true}"
      PUBLIC_ORIGIN: "${APP_URL:-http://127.0.0.1:3000}"
      PRISMA_DATABASE_URL: "postgresql://example:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@teable-db:5432/teable-db"
      BACKEND_CACHE_PROVIDER: "${BACKEND_CACHE_PROVIDER:-redis}"
      BACKEND_CACHE_REDIS_URI: redis://default:password@teable-cache:6379/0
    networks:
      - teable-network
    depends_on:
      teable-db:
        condition: service_healthy
      teable-cache:
        condition: service_healthy
  teable-db:
    image: postgres:15
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 256M
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /var/lib/postgresql/data
    environment:
      TZ: "${TZ:-UTC}"
      POSTGRES_DB: "${POSTGRES_DB:-teable-db}"
      POSTGRES_USER: "${POSTGRES_USER:-example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    networks:
      - teable-network
    healthcheck:
      test:
        - CMD-SHELL
        - "sh -c 'pg_isready -U example -d teable-db'"
      interval: 10s
      timeout: 3s
      retries: 3
  teable-cache:
    image: redis:7.2.4
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 256M
    expose:
      - "6379"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/teable-cache-data"
        target: /data
    networks:
      - teable-network
    command:
      - redis-server
      - "--requirepass password"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - "--raw"
        - incr
        - ping
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  teable-network:
    name: teable-network
    driver: bridge
