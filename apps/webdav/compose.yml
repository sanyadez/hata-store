# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  webdav:
    cpu_shares: 90
    command:
      []
    deploy:
      resources:
        limits:
          memory: 15806M
    environment:
      GID: "1000"
      PASSWORD: hata
      TZ: "${TZ:-UTC}"
      UDI: "1000"
      USERNAME: "${USERNAME:-admin}"
    image: ugeek/webdav:amd64
    ports:
      - "${WEB_PORT:-5005}:80"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${MEDIA_DIR:-./Media}"
        target: /media
    privileged: false
