# Apache-2.0, changed for Hata Store: see NOTICE
title: FileFlows
tagline:
  en: File processing made easy!
  uk: Обробка файлів — це просто!
description:
  en: "Save storage space with efficient file processing.\n\nFileFlows lets you monitor and process any file type with custom flows. Videos, audio, images, archives, comics, eBooks—you name it!"
  uk: "Заощаджуйте місце завдяки ефективній обробці файлів.\n\nFileFlows стежить за файлами будь-якого типу й обробляє їх за вашими власними потоками. Відео, аудіо, зображення, архіви, комікси, електронні книги — що завгодно!"
category: media
developer: FileFlows
website: https://fileflows.com/
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: fileflows
  port: 5000
settings:
  - name: WEB_PORT
    type: port
    default: 19200
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MEDIA_DIR
    type: folder
    default: "${DATA_ROOT}/Media"
    label:
      en: Media
      uk: Медіа
    hint:
      en: Inside the app it is /Media
      uk: У застосунку вона — /Media
permissions:
  docker:
    en: "It controls the server's Docker: it sees and manages the containers"
    uk: "Він керує Docker сервера: бачить контейнери й керує ними"
  devices:
    en: "It uses devices of the server: /dev/dri"
    uk: "Він користується пристроями сервера: /dev/dri"
