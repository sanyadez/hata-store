# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: FileFlows
tagline:
  en: File processing made easy!
  zh: 文件处理变得轻松！
  ar: جعل معالجة الملفات أسهل!
  de: Dateiverarbeitung leicht gemacht!
  es: ¡Procesamiento de archivos hecho fácil!
  fr: Traitement des fichiers simplifié !
  hu: A fájlkezelés egyszerűvé vált!
  it: Elaborazione dei file resa semplice!
  ru: Обработка файлов стала проще!
  pl: Przetwarzanie plików stało się łatwiejsze!
  pt: Processamento de arquivos facilitado!
  sv: Filhantering gjort enkelt!
  uk: Обробка файлів — це просто!
description:
  en: "Save storage space with efficient file processing.\n\nFileFlows lets you monitor and process any file type with custom flows. Videos, audio, images, archives, comics, eBooks—you name it!"
  zh: "通过高效的文件处理节省存储空间。\n\nFileFlows 让您通过自定义流程监控和处理任何类型的文件。视频、音频、图像、档案、漫画、电子书——应有尽有！"
  ar: "وفر مساحة التخزين من خلال معالجة الملفات بكفاءة.\n\nيتيح لك FileFlows مراقبة ومعالجة أي نوع من الملفات من خلال تدفقات مخصصة. الفيديوهات، الصوت، الصور، الأرشيفات، الكوميديا، الكتب الإلكترونية - كل شيء!"
  de: "Speichern Sie Speicherplatz durch effiziente Dateiverarbeitung.\n\nMit FileFlows können Sie jede Art von Datei mit benutzerdefinierten Workflows überwachen und verarbeiten. Videos, Audios, Bilder, Archive, Comics, E-Books – alles, was Sie sich wünschen!"
  es: "Ahorra espacio de almacenamiento con un procesamiento de archivos eficiente.\n\nFileFlows te permite monitorear y procesar cualquier tipo de archivo con flujos personalizados. Videos, audios, imágenes, archivos, cómics, libros electrónicos: ¡todo lo que necesites!"
  fr: "Économisez de l'espace de stockage grâce à un traitement de fichiers efficace.\n\nFileFlows vous permet de surveiller et de traiter n'importe quel type de fichier avec des flux personnalisés. Vidéos, audios, images, archives, bandes dessinées, eBooks — tout ce que vous voulez !"
  hu: "Takarítson meg tárolóhelyet hatékony fájlkezeléssel.\n\nA FileFlows lehetővé teszi bármilyen fájltípus figyelését és feldolgozását testreszabott folyamatokkal. Videók, hangok, képek, archívumok, képregények, e-könyvek — minden, amit csak szeretne!"
  it: "Risparmia spazio di archiviazione con un'elaborazione dei file efficiente.\n\nFileFlows ti consente di monitorare e elaborare qualsiasi tipo di file con flussi personalizzati. Video, audio, immagini, archivi, fumetti, eBook — tutto ciò di cui hai bisogno!"
  ru: "Сэкономьте место для хранения с эффективной обработкой файлов.\n\nFileFlows позволяет вам отслеживать и обрабатывать любой тип файлов с помощью настраиваемых потоков. Видео, аудио, изображения, архивы, комиксы, электронные книги — все, что вам нужно!"
  pl: "Oszczędzaj miejsce na dysku dzięki efektywnej obróbce plików.\n\nFileFlows pozwala monitorować i przetwarzać każdy typ pliku za pomocą niestandardowych przepływów. Filmy, dźwięki, obrazy, archiwa, komiksy, e-booki — wszystko, czego potrzebujesz!"
  pt: "Economize espaço de armazenamento com o processamento eficiente de arquivos.\n\nO FileFlows permite monitorar e processar qualquer tipo de arquivo com fluxos personalizados. Vídeos, áudios, imagens, arquivos, quadrinhos, eBooks – tudo o que você precisar!"
  sv: "Spara lagringsutrymme med effektiv filhantering.\n\nFileFlows låter dig övervaka och bearbeta alla filtyper med anpassade flöden. Videor, ljud, bilder, arkiv, serier, e-böcker – allt du kan tänka dig!"
  uk: "Заощаджуйте місце завдяки ефективній обробці файлів.\n\nFileFlows стежить за файлами будь-якого типу й обробляє їх за вашими власними потоками. Відео, аудіо, зображення, архіви, комікси, електронні книги — що завгодно!"
category: media
developer: FileFlows
website: https://fileflows.com/
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: fileflows
  port: 5000
settings:
  - name: WEB_PORT
    type: port
    default: 19200
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MEDIA_DIR
    type: folder
    default: "${DATA_ROOT}/Media"
    label:
      en: Media
      uk: Медіа
    hint:
      en: Inside the app it is /Media
      uk: У застосунку вона — /Media
permissions:
  docker:
    en: "It controls the server's Docker: it sees and manages the containers"
    uk: "Він керує Docker сервера: бачить контейнери й керує ними"
  devices:
    en: "It uses devices of the server: /dev/dri"
    uk: "Він користується пристроями сервера: /dev/dri"
