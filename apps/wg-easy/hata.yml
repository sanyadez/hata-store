# Apache-2.0, changed for Hata Store: see NOTICE
title: WireGuard Easy
tagline:
  en: WEB UI to manage WireGuard VPN.
  uk: Вебінтерфейс для керування VPN WireGuard.
description:
  en: You have found the easiest way to install & manage WireGuard on any Linux host!
  uk: Ви знайшли найпростіший спосіб установити WireGuard на будь-який хост Linux і керувати ним!
notes:
  en: "🔧 Settings\n\n⚠️ Warning!\n\nYou need to change at least change the mandatory parameter `WG_HOST` for this app to work properly. It's value has to be a domain (or an IP address) that points to this server (accesible from WAN).\n\nSame applies to the `WG_PORT` parameter. Change it to the port accessible from outside your LAN if it differs from the default 51820."
  uk: "🔧 Налаштування\n\n⚠️ Увага!\n\nЩоб застосунок працював правильно, потрібно змінити принаймні обов'язковий параметр `WG_HOST`. Його значення має бути доменом (або IP-адресою), що вказує на цей сервер і доступний із WAN.\n\nТе саме стосується параметра `WG_PORT`: змініть його на порт, доступний ззовні вашої локальної мережі, якщо він відрізняється від типового 51820."
category: network
developer: WeejeWel
website: https://github.com/wg-easy/wg-easy
source: https://github.com/wg-easy/wg-easy
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: wg-easy
  port: 51821
settings:
  - name: WG_HOST
    type: text
    required: true
    label:
      en: "The server's address from outside"
      uk: Адреса сервера ззовні
    hint:
      en: The public IP address or name the devices connect to; the port has to be forwarded to this server by the router
      uk: "Публічна IP-адреса або ім'я, до якого під'єднуються пристрої; порт має бути переадресований роутером на цей сервер"
  - name: PORT_51820
    type: port
    default: 51820
    label:
      en: Wireguard VPN port
      uk: Порт Wireguard VPN
    advanced: true
  - name: WEB_PORT
    type: port
    default: 51821
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PASSWORD
    type: password
    required: true
    label:
      en: Password
      uk: Пароль
permissions:
  capabilities:
    en: "It asks for extra rights of the system: NET_ADMIN, SYS_MODULE"
    uk: "Він просить додаткових прав у системі: NET_ADMIN, SYS_MODULE"
