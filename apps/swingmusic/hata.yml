title: Swing Music
tagline:
  en: "Swing Music is a beautifully designed, self-hosted music streaming server."
  uk: Swing Music — гарний власний сервер потокового відтворення музики.
description:
  en: "Swing Music is a fast, beautiful, self-hosted music player designed for your local audio files, offering a sleek experience akin to Spotify but powered by your own music library. Simply run the app and access your music collection effortlessly through a web browser.\n\nSwing Music curates Daily Mixes based on your listening habits, ensures a clean and consistent library with metadata normalization, and supports album versioning (e.g., Deluxe, Remaster) alongside related artist and album recommendations. Browse your music library via folder view, manage playlists, and enjoy a seamless listening experience with silence detection and cross-fade. Additional features include listening statistics, lyrics view, Last.fm scrobbling, multi-user support, and personalized collections for grouping albums and artists.\n\nWith its stunning browser-based interface and robust functionality, Swing Music is the perfect choice for music enthusiasts seeking a beautiful and practical way to manage and enjoy their local music collection."
  uk: "Swing Music — швидкий, гарний власний музичний плеєр для ваших локальних аудіофайлів. Він схожий на Spotify, але працює на вашій власній музичній бібліотеці. Просто запустіть застосунок і відкривайте колекцію музики через браузер.\n\nSwing Music складає щоденні добірки на основі того, що ви слухаєте, підтримує чисту й узгоджену бібліотеку завдяки нормалізації метаданих, а також розрізняє версії альбомів (наприклад, Deluxe, Remaster) і радить пов'язаних виконавців та альбоми. Переглядайте бібліотеку за теками, керуйте плейлистами та слухайте без перерв завдяки виявленню тиші й плавному переходу між піснями. Також є статистика прослуховувань, перегляд текстів пісень, скроблінг на Last.fm, підтримка кількох користувачів і персональні колекції для групування альбомів та виконавців.\n\nЗавдяки чудовому інтерфейсу в браузері та надійній роботі Swing Music — ідеальний вибір для меломанів, які шукають гарний і практичний спосіб керувати локальною музичною колекцією та слухати її."
notes:
  en: "When you first start Swing Music, it will ask you to pick music directory: Where do you want to look for music? select \"Specific directories\" Option, and select \"/music\" and rescan.\n\nDefault Account | Name | Password | | -------- | -------- | | `admin` | `admin` |"
  uk: "Під час першого запуску Swing Music попросить обрати теку з музикою: «Де шукати музику?». Виберіть варіант «Specific directories», потім «/music» і запустіть повторне сканування.\n\nОбліковий запис за промовчанням | Ім'я | Пароль | | -------- | -------- | | `admin` | `admin` |"
category: media
developer: SwingMX
website: https://swingmx.com
source: https://github.com/swing-opensource/swingmusic
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: swingmusic
  port: 1970
settings:
  - name: WEB_PORT
    type: port
    default: 1970
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MUSIC_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Music"
    label:
      en: Media/Music
      uk: Медіа/Музика
    hint:
      en: Inside the app it is /music
      uk: У застосунку вона — /music
