# Apache-2.0, changed for Hata Store: see NOTICE
services:
  swingmusic:
    image: ghcr.io/swingmx/swingmusic:v2.1.4
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${MUSIC_DIR:-./Media/Music}"
        target: /music
    ports:
      - "${WEB_PORT:-1970}:1970"
    restart: unless-stopped
