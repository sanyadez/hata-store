title: Jellyfin
tagline:
  en: Your films, series and music, streamed to any screen
  uk: Ваші фільми, серіали й музика на будь-якому екрані
description:
  en: >
    A media server that is free and has no accounts in the cloud. Point it at your folders and it
    finds posters, descriptions and subtitles, remembers where you stopped, and streams to the browser,
    phones, smart TVs, Kodi and DLNA players, converting what a device cannot play.
  uk: >
    Медіасервер, безплатний і без облікових записів у хмарі. Вкажіть йому теки, і він знайде постери,
    описи й субтитри, запам'ятає, де ви зупинились, і покаже в браузері, на телефонах, смарт-телевізорах,
    у Kodi та DLNA-програвачах, перекодувавши те, чого пристрій не відтворює.
category: media
developer: Jellyfin
website: https://jellyfin.org
source: https://github.com/jellyfin/jellyfin
icon: data:image/svg+xml;base64,
web:
  service: jellyfin
  port: 8096
settings:
  - name: WEB_PORT
    type: port
    default: 8096
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: MEDIA
    type: folder
    default: ${DATA_ROOT}/Media
    label: { en: Media folder, uk: Тека з медіа }
    hint:
      en: Films, series and music; inside the app it is /media
      uk: Фільми, серіали й музика; у застосунку вона — /media
