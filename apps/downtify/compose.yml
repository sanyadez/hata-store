# Apache-2.0, changed for Hata Store: see NOTICE
services:
  downtify:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: ghcr.io/henriquesebastiao/downtify:2.13.0
    deploy:
      resources:
        reservations:
          memory: 2048M
    ports:
      - "${WEB_PORT:-8582}:8000"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${DOWNTIFY_DIR:-./Downloads/downtify}"
        target: /downloads
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
