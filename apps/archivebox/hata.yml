title: ArchiveBox
tagline:
  en: Self-hosted internet archiving solution
  uk: Рішення для архівування інтернету на власному сервері
description:
  en: "ArchiveBox is a powerful, self-hosted internet archiving solution that allows you to create your own personal archive of web pages, PDFs, videos, and more. It functions as a personal internet archive, saving content in multiple formats for long-term preservation.\n\nThe system consists of multiple components:\n- **ArchiveBox**: The main application providing the web interface and archiving capabilities\n- **Sonic**: A fast search backend for full-text search across archived content\n- **ArchiveBox Scheduler**: A background service for scheduled archiving tasks\n- **NoVNC**: A web-based VNC client for browser-based archiving\n\n**Key Features:**\n- Save web pages in multiple formats (HTML, PDF, screenshots, etc.)\n- Full-text search across all archived content\n- Scheduled archiving of websites and RSS feeds\n- Browser-based archiving with NoVNC\n- User authentication and access control\n- Extract and save media files (videos, audio, PDFs, etc.)\n\n**Learn More:**\n- [ArchiveBox Official Website](https://archivebox.io)\n- [ArchiveBox GitHub Repository](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Documentation](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  uk: "ArchiveBox — потужне рішення для архівування інтернету на власному сервері, що дає змогу створити власний архів вебсторінок, PDF, відео й не тільки. Він працює як особистий інтернет-архів і зберігає вміст у кількох форматах для довготривалого зберігання.\n\nСистема складається з кількох компонентів:\n- **ArchiveBox**: головний застосунок із вебінтерфейсом і можливостями архівування\n- **Sonic**: швидкий пошуковий бекенд для повнотекстового пошуку в архівованому вмісті\n- **ArchiveBox Scheduler**: фоновий сервіс для архівування за розкладом\n- **NoVNC**: вебклієнт VNC для архівування через браузер\n\n**Основні можливості:**\n- Збереження вебсторінок у кількох форматах (HTML, PDF, знімки екрана тощо)\n- Повнотекстовий пошук по всьому архівованому вмісту\n- Архівування сайтів і RSS-стрічок за розкладом\n- Архівування через браузер за допомогою NoVNC\n- Автентифікація користувачів і керування доступом\n- Вилучення й збереження медіафайлів (відео, аудіо, PDF тощо)\n\n**Дізнатися більше:**\n- [Офіційний сайт ArchiveBox](https://archivebox.io)\n- [Репозиторій ArchiveBox на GitHub](https://github.com/ArchiveBox/ArchiveBox)\n- [Документація ArchiveBox](https://github.com/ArchiveBox/ArchiveBox/wiki)"
notes:
  en: "**Default Account**"
  uk: "**Обліковий запис за замовчуванням**"
category: productivity
developer: ArchiveBox
website: https://archivebox.io
source: https://github.com/ArchiveBox/ArchiveBox
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: archivebox
  port: 8000
settings:
  - name: WEB_PORT
    type: port
    default: 18010
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: ADMIN_USERNAME
    type: text
    default: admin
    required: true
    label:
      en: Admin Username for Authentication
      uk: Ім’я адміністратора для входу
  - name: ADMIN_PASSWORD
    type: password
    required: true
    label:
      en: Admin Password for Authentication
      uk: Пароль адміністратора для входу
  - name: ALLOWED_HOSTS
    type: text
    default: "*"
    label:
      en: Allowed Hosts for Web Interface
      uk: Дозволені хости для вебінтерфейсу
  - name: CSRF_TRUSTED_ORIGINS
    type: text
    default: "*"
    label:
      en: Trusted Origins for CSRF Protection
      uk: Довірені джерела для захисту від CSRF
  - name: PUBLIC_INDEX
    type: text
    default: "True"
    label:
      en: Allow Public Access to Snapshot List
      uk: Публічний доступ до списку знімків
  - name: PUBLIC_SNAPSHOTS
    type: text
    default: "True"
    label:
      en: Allow Public Access to Snapshot Content
      uk: Публічний доступ до вмісту знімків
  - name: PUBLIC_ADD_VIEW
    type: text
    default: "False"
    label:
      en: Allow Public URL Submission
      uk: Публічне додавання адрес
  - name: SEARCH_BACKEND_ENGINE
    type: text
    default: sonic
    label:
      en: Search Backend Engine
      uk: Рушій пошукового бекенда
  - name: SEARCH_BACKEND_HOST_NAME
    type: text
    default: archivebox_sonic
    label:
      en: Search Backend Host Name
      uk: Ім’я хоста пошукового бекенда
  - name: DB_PASSWORD
    type: secret
    label:
      en: Password between its services
      uk: Пароль між його сервісами
  - name: TIMEOUT
    type: text
    default: "120"
    label:
      en: Timeout for Download Operations
      uk: Тайм-аут завантаження
  - name: SEARCH_BACKEND_ENGINE_2
    type: text
    default: sonic
    label:
      en: Search Backend Engine
      uk: Рушій пошукового бекенда
  - name: SEARCH_BACKEND_HOST_NAME_2
    type: text
    default: archivebox_sonic
    label:
      en: Search Backend Host Name
      uk: Ім’я хоста пошукового бекенда
  - name: ARCHIVEBOX_NOVNC_PORT_8080
    type: port
    default: 18082
    label:
      en: NoVNC Web Interface Port
      uk: Порт вебінтерфейсу NoVNC
    advanced: true
  - name: DISPLAY_WIDTH
    type: text
    default: "1920"
    label:
      en: Display Width in Pixels
      uk: Ширина екрана в пікселях
  - name: DISPLAY_HEIGHT
    type: text
    default: "1080"
    label:
      en: Display Height in Pixels
      uk: Висота екрана в пікселях
  - name: RUN_XTERM
    type: text
    default: "no"
    label:
      en: Run XTerm Terminal
      uk: Запускати термінал XTerm
