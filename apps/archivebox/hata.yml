description:
  en: "ArchiveBox is a powerful, self-hosted internet archiving solution that allows you to create your own personal archive of web pages, PDFs, videos, and more. It functions as a personal internet archive, saving content in multiple formats for long-term preservation.\n\nThe system consists of multiple components:\n- **ArchiveBox**: The main application providing the web interface and archiving capabilities\n- **Sonic**: A fast search backend for full-text search across archived content\n- **ArchiveBox Scheduler**: A background service for scheduled archiving tasks\n- **NoVNC**: A web-based VNC client for browser-based archiving\n\n**Key Features:**\n- Save web pages in multiple formats (HTML, PDF, screenshots, etc.)\n- Full-text search across all archived content\n- Scheduled archiving of websites and RSS feeds\n- Browser-based archiving with NoVNC\n- User authentication and access control\n- Extract and save media files (videos, audio, PDFs, etc.)\n\n**Learn More:**\n- [ArchiveBox Official Website](https://archivebox.io)\n- [ArchiveBox GitHub Repository](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Documentation](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  it: "ArchiveBox è una potente soluzione di archiviazione internet self-hosted che ti permette di creare il tuo archivio personale di pagine web, PDF, video e altro ancora. Funziona come un archivio internet personale, salvando i contenuti in più formati per la conservazione a lungo termine.\n\nIl sistema è composto da più componenti:\n- **ArchiveBox**: L'applicazione principale che fornisce l'interfaccia web e le capacità di archiviazione\n- **Sonic**: Un backend di ricerca veloce per la ricerca full-text nei contenuti archiviati\n- **ArchiveBox Scheduler**: Un servizio in background per le attività di archiviazione pianificate\n- **NoVNC**: Un client VNC basato sul web per l'archiviazione basata su browser\n\n**Caratteristiche principali:**\n- Salva pagine web in più formati (HTML, PDF, screenshot, ecc.)\n- Ricerca full-text su tutti i contenuti archiviati\n- Archiviazione pianificata di siti web e feed RSS\n- Archiviazione basata su browser con NoVNC\n- Autenticazione utente e controllo degli accessi\n- Estrai e salva file multimediali (video, audio, PDF, ecc.)\n\n**Scopri di più:**\n- [Sito web ufficiale di ArchiveBox](https://archivebox.io)\n- [Repository GitHub di ArchiveBox](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Documentazione](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  nb: "ArchiveBox er en kraftfull, selvbetjent internettarkiveringsløsning som lar deg lage ditt eget personlige arkiv av nettsider, PDF-er, videoer og mer. Den fungerer som et personlig internettarkiv, og lagrer innhold i flere formater for langtidsbevaring.\n\nSystemet består av flere komponenter:\n- **ArchiveBox**: Hovedapplikasjonen som gir webgrensesnitt og arkiveringsmuligheter\n- **Sonic**: Et rask søkebackend for fulltekstsøk i arkivert innhold\n- **ArchiveBox Scheduler**: En bakgrunnstjeneste for planlagte arkiveringsoppgaver\n- **NoVNC**: En nettleserbasert VNC-klient for nettleserbasert arkivering\n\n**Nøkkelegenskaper:**\n- Lagre nettsider i flere formater (HTML, PDF, skjermbilder, etc.)\n- Fulltekstsøk på alt arkivert innhold\n- Planlagt arkivering av nettsteder og RSS-feeds\n- Nettleserbasert arkivering med NoVNC\n- Brukerautentisering og tilgangskontroll\n- Ekstraher og lagre mediefiler (videoer, lyd, PDF-er, etc.)\n\n**Lær mer:**\n- [ArchiveBox offisielt nettsted](https://archivebox.io)\n- [ArchiveBox GitHub Repository](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Dokumentasjon](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  zh: "ArchiveBox是一个强大的自托管互联网存档解决方案，允许您创建自己的网页、PDF、视频等个人存档。它作为个人互联网存档运行，以多种格式保存内容以供长期保存。\n\n该系统由多个组件组成：\n- **ArchiveBox**: 提供Web界面和存档功能的主应用程序\n- **Sonic**: 用于在存档内容中进行全文搜索的快速搜索后端\n- **ArchiveBox Scheduler**: 用于计划存档任务的后台服务\n- **NoVNC**: 用于基于浏览器的存档的基于Web的VNC客户端\n\n**主要功能：**\n- 以多种格式保存网页（HTML、PDF、截图等）\n- 在所有存档内容中进行全文搜索\n- 计划存档网站和RSS源\n- 使用NoVNC进行基于浏览器的存档\n- 用户身份验证和访问控制\n- 提取和保存媒体文件（视频、音频、PDF等）\n\n**了解更多：**\n- [ArchiveBox官方网站](https://archivebox.io)\n- [ArchiveBox GitHub仓库](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox 文档](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  ja: "ArchiveBoxは、Webページ、PDF、ビデオなどの独自の個人アーカイブを作成できる強力なセルフホスト型インターネットアーカイブソリューションです。個人用インターネットアーカイブとして機能し、長期保存のために複数の形式でコンテンツを保存します。\n\nこのシステムは複数のコンポーネントで構成されています：\n- **ArchiveBox**: Webインターフェースとアーカイブ機能を提供するメインアプリケーション\n- **Sonic**: アーカイブされたコンテンツ全体で全文検索を行うための高速検索バックエンド\n- **ArchiveBox Scheduler**: スケジュールされたアーカイブタスク用のバックグラウンドサービス\n- **NoVNC**: ブラウザベースのアーカイブ用のWebベースのVNCクライアント\n\n**主な機能：**\n- 複数の形式でWebページを保存（HTML、PDF、スクリーンショットなど）\n- すべてのアーカイブされたコンテンツで全文検索\n- WebサイトとRSSフィードのスケジュールされたアーカイブ\n- NoVNCを使用したブラウザベースのアーカイブ\n- ユーザー認証とアクセス制御\n- メディアファイルの抽出と保存（ビデオ、オーディオ、PDFなど）\n\n**詳細情報：**\n- [ArchiveBox公式ウェブサイト](https://archivebox.io)\n- [ArchiveBox GitHubリポジトリ](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox ドキュメント](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  ko: "ArchiveBox는 웹 페이지, PDF, 비디오 등의 개인 아카이브를 생성할 수 있는 강력한 셀프 호스팅 인터넷 아카이빙 솔루션입니다. 장기 보존을 위해 여러 형식으로 콘텐츠를 저장하는 개인 인터넷 아카이브로 기능합니다.\n\n이 시스템은 여러 구성 요소로 이루어져 있습니다:\n- **ArchiveBox**: 웹 인터페이스와 아카이빙 기능을 제공하는 주요 애플리케이션\n- **Sonic**: 아카이브된 콘텐츠 전체에서 전체 텍스트 검색을 위한 빠른 검색 백엔드\n- **ArchiveBox Scheduler**: 예약된 아카이빙 작업을 위한 백그라운드 서비스\n- **NoVNC**: 브라우저 기반 아카이빙을 위한 웹 기반 VNC 클라이언트\n\n**주요 기능:**\n- 여러 형식으로 웹 페이지 저장(HTML, PDF, 스크린샷 등)\n- 모든 아카이브된 콘텐츠에서 전체 텍스트 검색\n- 웹사이트 및 RSS 피드의 예약된 아카이빙\n- NoVNC를 사용한 브라우저 기반 아카이빙\n- 사용자 인증 및 접근 제어\n- 미디어 파일 추출 및 저장(비디오, 오디오, PDF 등)\n\n**더 알아보기:**\n- [ArchiveBox 공식 웹사이트](https://archivebox.io)\n- [ArchiveBox GitHub 저장소](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox 문서](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  fr: "ArchiveBox est une puissante solution d'archivage Internet auto-hébergée qui vous permet de créer votre propre archive personnelle de pages Web, de PDF, de vidéos et plus encore. Elle fonctionne comme une archive Internet personnelle, sauvegardant le contenu dans plusieurs formats pour une préservation à long terme.\n\nLe système se compose de plusieurs composants :\n- **ArchiveBox** : L'application principale fournissant l'interface Web et les capacités d'archivage\n- **Sonic** : Un backend de recherche rapide pour la recherche en texte intégral dans le contenu archivé\n- **ArchiveBox Scheduler** : Un service d'arrière-plan pour les tâches d'archivage planifiées\n- **NoVNC** : Un client VNC basé sur le Web pour l'archivage basé sur le navigateur\n\n**Fonctionnalités clés :**\n- Sauvegardez les pages Web dans plusieurs formats (HTML, PDF, captures d'écran, etc.)\n- Recherche en texte intégral dans tout le contenu archivé\n- Archivage planifié de sites Web et de flux RSS\n- Archivage basé sur le navigateur avec NoVNC\n- Authentification utilisateur et contrôle d'accès\n- Extrayez et sauvegardez des fichiers multimédias (vidéos, audio, PDF, etc.)\n\n**En savoir plus :**\n- [Site officiel d'ArchiveBox](https://archivebox.io)\n- [Dépôt GitHub d'ArchiveBox](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Documentation](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  de: "ArchiveBox ist eine leistungsstarke, selbst gehostete Internet-Archivierungslösung, mit der Sie Ihr eigenes persönliches Archiv von Webseiten, PDFs, Videos und mehr erstellen können. Es funktioniert als persönliches Internet-Archiv und speichert Inhalte in mehreren Formaten für die langfristige Aufbewahrung.\n\nDas System besteht aus mehreren Komponenten:\n- **ArchiveBox**: Die Hauptanwendung, die die Weboberfläche und Archivierungsfunktionen bereitstellt\n- **Sonic**: Ein schnelles Such-Backend für die Volltextsuche in archivierten Inhalten\n- **ArchiveBox Scheduler**: Ein Hintergrunddienst für geplante Archivierungsaufgaben\n- **NoVNC**: Ein webbasierter VNC-Client für die browserbasierte Archivierung\n\n**Hauptmerkmale:**\n- Speichern Sie Webseiten in mehreren Formaten (HTML, PDF, Screenshots, etc.)\n- Volltextsuche über alle archivierten Inhalte\n- Geplante Archivierung von Websites und RSS-Feeds\n- Browserbasierte Archivierung mit NoVNC\n- Benutzerauthentifizierung und Zugriffskontrolle\n- Extrahieren und Speichern von Mediendateien (Videos, Audio, PDFs, etc.)\n\n**Mehr erfahren:**\n- [ArchiveBox offizielle Website](https://archivebox.io)\n- [ArchiveBox GitHub Repository](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Dokumentation](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  sv: "ArchiveBox är en kraftfull, självhostad internetarkiveringslösning som låter dig skapa ditt eget personliga arkiv av webbsidor, PDF:er, videor och mer. Den fungerar som ett personligt internetarkiv och sparar innehåll i flera format för långtidsbevarande.\n\nSystemet består av flera komponenter:\n- **ArchiveBox**: Huvudapplikationen som tillhandahåller webbgränssnitt och arkiveringsfunktioner\n- **Sonic**: Ett snabbt sökbackend för fulltextsökning över arkiverat innehåll\n- **ArchiveBox Scheduler**: En bakgrundstjänst för schemalagda arkiveringsuppgifter\n- **NoVNC**: En webbaserad VNC-klient för webbläsarbaserad arkivering\n\n**Nyckelfunktioner:**\n- Spara webbsidor i flera format (HTML, PDF, skärmdumpar, etc.)\n- Fulltextsökning över allt arkiverat innehåll\n- Schemalagd arkivering av webbplatser och RSS-flöden\n- Webbläsarbaserad arkivering med NoVNC\n- Användarautentisering och åtkomstkontroll\n- Extrahera och spara mediefiler (videor, ljud, PDF:er, etc.)\n\n**Läs mer:**\n- [ArchiveBox officiella webbplats](https://archivebox.io)\n- [ArchiveBox GitHub Repository](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Dokumentation](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  el: "Το ArchiveBox είναι μια ισχυρή, αυτο-φιλοξενούμενη λύση αρχειοθέτησης διαδικτύου που σας επιτρέπει να δημιουργήσετε το δικό σας προσωπικό αρχείο ιστοσελίδων, PDF, βίντεο και άλλα. Λειτουργεί ως προσωπικό αρχείο διαδικτύου, αποθηκεύοντας περιεχόμενο σε πολλαπλές μορφές για μακροπρόθεσμη διατήρηση.\n\nΤο σύστημα αποτελείται από πολλαπλά στοιχεία:\n- **ArchiveBox**: Η κύρια εφαρμογή που παρέχει τη διαδικτυακή διεπαφή και τις δυνατότητες αρχειοθέτησης\n- **Sonic**: Ένα γρήγορο backend αναζήτησης για πλήρη αναζήτηση κειμένου σε αρχειοθετημένο περιεχόμενο\n- **ArchiveBox Scheduler**: Μια υπηρεσία παρασκηνίου για προγραμματισμένες εργασίες αρχειοθέτησης\n- **NoVNC**: Ένας web-based VNC client για αρχειοθέτηση βασισμένη σε πρόγραμμα περιήγησης\n\n**Βασικά Χαρακτηριστικά:**\n- Αποθήκευση ιστοσελίδων σε πολλαπλές μορφές (HTML, PDF, στιγμιότυπα οθόνης, κ.λπ.)\n- Πλήρη αναζήτηση κειμένου σε όλο το αρχειοθετημένο περιεχόμενο\n- Προγραμματισμένη αρχειοθέτηση ιστοσελίδων και RSS feeds\n- Αρχειοθέτηση βασισμένη σε πρόγραμμα περιήγησης με NoVNC\n- Ταυτοποίηση χρήστη και έλεγχος πρόσβασης\n- Εξαγωγή και αποθήκευση αρχείων πολυμέσων (βίντεο, ήχος, PDF, κ.λπ.)\n\n**Μάθετε Περισσότερα:**\n- [Επίσημη Ιστοσελίδα ArchiveBox](https://archivebox.io)\n- [Αποθήκη GitHub ArchiveBox](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Τεκμηρίωση](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  hr: "ArchiveBox je snažno, samo-hostano rješenje za arhiviranje interneta koje vam omogućuje stvaranje vlastitog osobnog arhiva web stranica, PDF-ova, videozapisa i više. Funkcionira kao osobni internet arhiv, pohranjujući sadržaj u više formata za dugoročno čuvanje.\n\nSustav se sastoji od više komponenti:\n- **ArchiveBox**: Glavna aplikacija koja pruža web sučelje i mogućnosti arhiviranja\n- **Sonic**: Brz backend za pretraživanje za pretragu cjelokupnog teksta u arhiviranom sadržaju\n- **ArchiveBox Scheduler**: Usluga u pozadini za zakazane zadatke arhiviranja\n- **NoVNC**: Web-based VNC klijent za arhiviranje temeljeno na pregledniku\n\n**Ključne značajke:**\n- Pohranjivanje web stranica u više formata (HTML, PDF, snimke zaslona, itd.)\n- Pretraga cjelokupnog teksta u svom arhiviranom sadržaju\n- Zakazano arhiviranje web stranica i RSS feedova\n- Arhiviranje temeljeno na pregledniku s NoVNC-om\n- Autentifikacija korisnika i kontrola pristupa\n- Ekstrakcija i pohrana medijskih datoteka (videozapisi, audio, PDF-ovi, itd.)\n\n**Saznajte više:**\n- [Službena web stranica ArchiveBox](https://archivebox.io)\n- [ArchiveBox GitHub Repozitorij](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Dokumentacija](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  pt: "ArchiveBox é uma poderosa solução de arquivamento de internet auto-hospedada que lhe permite criar o seu próprio arquivo pessoal de páginas web, PDFs, vídeos e mais. Funciona como um arquivo de internet pessoal, guardando conteúdo em múltiplos formatos para preservação a longo prazo.\n\nO sistema consiste em múltiplos componentes:\n- **ArchiveBox**: A aplicação principal que fornece a interface web e capacidades de arquivamento\n- **Sonic**: Um backend de pesquisa rápido para pesquisa de texto completo em conteúdo arquivado\n- **ArchiveBox Scheduler**: Um serviço de fundo para tarefas de arquivamento agendadas\n- **NoVNC**: Um cliente VNC baseado na web para arquivamento baseado em navegador\n\n**Características Principais:**\n- Guardar páginas web em múltiplos formatos (HTML, PDF, capturas de ecrã, etc.)\n- Pesquisa de texto completo em todo o conteúdo arquivado\n- Arquivamento agendado de websites e feeds RSS\n- Arquivamento baseado em navegador com NoVNC\n- Autenticação de utilizador e controlo de acesso\n- Extrair e guardar ficheiros multimédia (vídeos, áudio, PDFs, etc.)\n\n**Saiba Mais:**\n- [Website Oficial ArchiveBox](https://archivebox.io)\n- [Repositório GitHub ArchiveBox](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Documentação](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  ru: "ArchiveBox - это мощное самохостинговое решение для архивирования интернета, которое позволяет создавать собственный личный архив веб-страниц, PDF-файлов, видео и многого другого. Оно функционирует как личный интернет-архив, сохраняя контент в нескольких форматах для долгосрочного хранения.\n\nСистема состоит из нескольких компонентов:\n- **ArchiveBox**: Основное приложение, предоставляющее веб-интерфейс и возможности архивирования\n- **Sonic**: Быстрый бэкенд поиска для полнотекстового поиска по заархивированному контенту\n- **ArchiveBox Scheduler**: Фоновая служба для запланированных задач архивирования\n- **NoVNC**: Веб-клиент VNC для архивирования на основе браузера\n\n**Ключевые особенности:**\n- Сохранение веб-страниц в нескольких форматах (HTML, PDF, скриншоты и т.д.)\n- Полнотекстовый поиск по всему заархивированному контенту\n- Запланированное архивирование веб-сайтов и RSS-лент\n- Архивирование на основе браузера с помощью NoVNC\n- Аутентификация пользователей и контроль доступа\n- Извлечение и сохранение медиафайлов (видео, аудио, PDF и т.д.)\n\n**Узнать больше:**\n- [Официальный сайт ArchiveBox](https://archivebox.io)\n- [Репозиторий ArchiveBox на GitHub](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Документация](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  tr: "ArchiveBox, web sayfalarının, PDF'lerin, videoların ve daha fazlasının kendi kişisel arşivinizi oluşturmanıza olanak tanıyan güçlü, kendi kendine barındırılan bir internet arşivleme çözümüdür. Uzun süreli koruma için içeriği birden çok formatta kaydeden kişisel bir internet arşivi olarak işlev görür.\n\nSistem birden fazla bileşenden oluşur:\n- **ArchiveBox**: Web arayüzünü ve arşivleme yeteneklerini sağlayan ana uygulama\n- **Sonic**: Arşivlenmiş içeriklerde tam metin araması için hızlı bir arama arka ucu\n- **ArchiveBox Scheduler**: Zamanlanmış arşivleme görevleri için bir arka plan hizmeti\n- **NoVNC**: Tarayıcı tabanlı arşivleme için web tabanlı bir VNC istemcisi\n\n**Ana Özellikler:**\n- Web sayfalarını birden çok formatta kaydetme (HTML, PDF, ekran görüntüleri vb.)\n- Tüm arşivlenmiş içerikte tam metin arama\n- Web sitelerinin ve RSS akışlarının zamanlanmış arşivlenmesi\n- NoVNC ile tarayıcı tabanlı arşivleme\n- Kullanıcı kimlik doğrulaması ve erişim kontrolü\n- Medya dosyalarını çıkarma ve kaydetme (videolar, ses, PDF'ler vb.)\n\n**Daha Fazla Bilgi Edinin:**\n- [ArchiveBox Resmi Web Sitesi](https://archivebox.io)\n- [ArchiveBox GitHub Deposu](https://github.com/ArchiveBox/ArchiveBox)\n- [ArchiveBox Belgelendirme](https://github.com/ArchiveBox/ArchiveBox/wiki)"
  uk: "ArchiveBox — потужне рішення для архівування інтернету на власному сервері, що дає змогу створити власний архів вебсторінок, PDF, відео й не тільки. Він працює як особистий інтернет-архів і зберігає вміст у кількох форматах для довготривалого зберігання.\n\nСистема складається з кількох компонентів:\n- **ArchiveBox**: головний застосунок із вебінтерфейсом і можливостями архівування\n- **Sonic**: швидкий пошуковий бекенд для повнотекстового пошуку в архівованому вмісті\n- **ArchiveBox Scheduler**: фоновий сервіс для архівування за розкладом\n- **NoVNC**: вебклієнт VNC для архівування через браузер\n\n**Основні можливості:**\n- Збереження вебсторінок у кількох форматах (HTML, PDF, знімки екрана тощо)\n- Повнотекстовий пошук по всьому архівованому вмісту\n- Архівування сайтів і RSS-стрічок за розкладом\n- Архівування через браузер за допомогою NoVNC\n- Автентифікація користувачів і керування доступом\n- Вилучення й збереження медіафайлів (відео, аудіо, PDF тощо)\n\n**Дізнатися більше:**\n- [Офіційний сайт ArchiveBox](https://archivebox.io)\n- [Репозиторій ArchiveBox на GitHub](https://github.com/ArchiveBox/ArchiveBox)\n- [Документація ArchiveBox](https://github.com/ArchiveBox/ArchiveBox/wiki)"
