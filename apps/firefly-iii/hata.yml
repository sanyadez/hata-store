title: Firefly III
tagline:
  en: Your money under control, from salary to the last coffee
  uk: Ваші гроші під контролем, від зарплати до останньої кави
description:
  en: >
    A personal finance manager for the household budget. Keeps your accounts, income and spending,
    sorts transactions into categories and budgets, follows bills and savings goals, and draws
    reports of where the money goes. Bank statements can be imported from files.
  uk: >
    Менеджер особистих фінансів для домашнього бюджету. Веде рахунки, доходи й витрати, розкладає
    операції за категоріями й бюджетами, стежить за рахунками до сплати й цілями заощаджень і
    показує звіти, куди йдуть гроші. Банківські виписки можна імпортувати з файлів.
notes:
  en: >
    The first account registered on the start page becomes the administrator.
  uk: >
    Перший обліковий запис, зареєстрований на стартовій сторінці, стає адміністратором.
category: finance
developer: James Cole
website: https://www.firefly-iii.org
source: https://github.com/firefly-iii/firefly-iii
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: app
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: DEFAULT_LANGUAGE
    type: choice
    default: en_US
    options:
      - { value: en_US, label: English }
      - { value: uk_UA, label: Українська }
    label: { en: Language, uk: Мова }
    hint:
      en: Each user can change it later in their preferences
      uk: Кожен користувач може змінити її згодом у своїх налаштуваннях
  - name: APP_KEY
    type: secret
    length: 32
    label: { en: Encryption key, uk: Ключ шифрування }
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
  - name: CRON_TOKEN
    type: secret
    length: 32
    label: { en: Scheduled jobs token, uk: Ключ для запланованих завдань }
