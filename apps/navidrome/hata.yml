# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Navidrome
tagline:
  en: Music Collection and Streaming Server
  zh: 音乐收藏和流媒体服务器
  uk: Сервер музичної колекції та стримінгу
description:
  en: "Navidrome is an open source web-based music collection server and streamer. It gives you freedom to listen to your music collection from any browser or mobile device. It's like your personal Spotify!"
  zh: Navidrome是一个开源的基于Web的音乐收藏服务器和流媒体服务器。它让您可以在任何浏览器或移动设备上自由收听音乐收藏。就像您个人的Spotify一样！
  uk: Navidrome — вебсервер музичної колекції та стримінгу з відкритим кодом. Він дає змогу слухати вашу музику з будь-якого браузера чи мобільного пристрою. Це як ваш особистий Spotify!
category: media
developer: The Navidrome Authors
website: https://www.navidrome.org
source: https://github.com/navidrome/navidrome
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: navidrome
  port: 4533
settings:
  - name: WEB_PORT
    type: port
    default: 4533
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MUSIC_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Music"
    label:
      en: Music folder
      zh: 音乐文件夹
      uk: Тека з музикою
    hint:
      en: Inside the app it is /music
      uk: У застосунку вона — /music
  - name: ND_SCANSCHEDULE
    type: text
    default: 1h
    label:
      en: Configure periodic scans using cron syntax
      zh: 使用cron语法配置定期扫描
      uk: Налаштуйте періодичне сканування у синтаксисі cron
  - name: ND_LOGLEVEL
    type: text
    default: info
    label:
      en: Log level
      zh: 日志级别
      uk: Рівень журналу
  - name: ND_SESSIONTIMEOUT
    type: text
    default: 24h
    label:
      en: Nd sessiontimeout
      uk: Тайм-аут сеансу
    hint:
      en: How long Navidrome will wait before closing web ui idle sessions
      zh: Navidrome在关闭Web UI空闲会话之前等待多长时间
      uk: "Скільки Navidrome чекатиме, перш ніж закрити неактивні сеанси вебінтерфейсу."
  - name: ND_BASEURL
    type: text
    label:
      en: Nd baseurl
      uk: Базова адреса
    hint:
      en: "Base URL (only the path part) to configure Navidrome behind a proxy (ex: /music)"
      zh: 配置Navidrome在代理后面的基本URL（仅路径部分）（例如：/music）
      uk: "Базова адреса (лише шлях) для роботи Navidrome за проксі (наприклад: /music)."
