# Apache-2.0, changed for Hata Store: see NOTICE
services:
  navidrome:
    deploy:
      resources:
        reservations:
          memory: 1024M
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4533}:4533"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
      - type: bind
        source: "${MUSIC_DIR:-./Media/Music}"
        target: /music
    environment:
      ND_SCANSCHEDULE: "${ND_SCANSCHEDULE:-1h}"
      ND_LOGLEVEL: "${ND_LOGLEVEL:-info}"
      ND_SESSIONTIMEOUT: "${ND_SESSIONTIMEOUT:-24h}"
      ND_BASEURL: "${ND_BASEURL:-}"
      TZ: "${TZ:-UTC}"
    privileged: false
