# Apache-2.0, changed for Hata Store: see NOTICE
title: Threadfin
tagline:
  en: M3U proxy server
  uk: Проксі-сервер M3U
description:
  en: "Threadfin is a M3U proxy server for Plex, Emby, Jellyfin and any client and provider which supports the .TS and .M3U8 (HLS) streaming formats."
  uk: "Threadfin — проксі-сервер M3U для Plex, Emby, Jellyfin та будь-якого клієнта й провайдера, що підтримує потокові формати .TS і .M3U8 (HLS)."
category: media
developer: jdownloader
website: https://github.com/Threadfin/Threadfin
source: https://github.com/Threadfin/Threadfin
icon: "data:image/svg+xml;base64,"
web:
  service: threadfin
  port: 34400
  path: /web/
settings:
  - name: WEB_PORT
    type: port
    default: 34400
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: THREADFIN_BRANCH
    type: text
    default: main
    label:
      en: "Set Threadfin git branch [ main, beta, dev ] Default: beta"
      uk: "Гілка git Threadfin [ main, beta, dev ], типово: beta"
  - name: THREADFIN_DEBUG
    type: text
    default: "0"
    label:
      en: "Set Threadfin debug level [ 0-3 ] Default: 0=OFF"
      uk: "Рівень налагодження Threadfin [ 0-3 ], типово: 0 (вимкнено)"
