# Apache-2.0, changed for Hata Store: see NOTICE
services:
  threadfin:
    image: fyb3roptik/threadfin:1.2.37
    restart: unless-stopped
    environment:
      THREADFIN_BRANCH: "${THREADFIN_BRANCH:-main}"
      THREADFIN_DEBUG: "${THREADFIN_DEBUG:-0}"
    ports:
      - "${WEB_PORT:-34400}:34400"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /home/threadfin/conf/data
      - type: bind
        source: "${APP_DATA:-.}/backup"
        target: /home/threadfin/conf/backup
