settings:
  - name: WEB_PORT
    type: port
    default: 7878
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MOVIES_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Movies"
    label:
      en: Radarr movies directory
      zh: Radarr电影目录
      uk: Тека фільмів Radarr
    hint:
      en: Inside the app it is /movies
      uk: У застосунку вона — /movies
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Radarr downloads directory
      zh: Radarr下载目录
      uk: Тека завантажень Radarr
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
