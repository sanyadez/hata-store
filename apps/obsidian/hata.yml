web:
  service: obsidian
  port: 3001
  scheme: https
settings:
  - name: PORT_3000
    type: port
    default: 15323
    label:
      en: Obsidian Desktop GUI HTTP Port
      uk: HTTP-порт графічного інтерфейсу Obsidian
    advanced: true
  - name: WEB_PORT
    type: port
    default: 15324
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PUID_2
    type: text
    default: "1000"
    label:
      en: User ID for file permissions
      uk: ID користувача для прав доступу до файлів
  - name: PGID_2
    type: text
    default: "1000"
    label:
      en: Group ID for file permissions
      uk: ID групи для прав доступу до файлів
