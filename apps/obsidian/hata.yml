# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Obsidian
tagline:
  en: "Obsidian is a knowledge management app for creating, linking, and visually organizing Markdown notes."
  it: "Obsidian è un'app di gestione della conoscenza per la creazione, il collegamento e l'organizzazione visiva di note…"
  nb: "Obsidian er en kunnskapsstyringsapp for å lage, koble og organisere visuelle Markdown-notater."
  zh: Obsidian 是一款知识管理应用，支持 Markdown 笔记的创建、链接与可视化组织。
  ja: Obsidian は、Markdown ノートの作成、リンク、および視覚的な整理を行うための知識管理アプリです。
  ko: "Obsidian은 Markdown 노트를 작성, 연결 및 시각적으로 정리하기 위한 지식 관리 앱입니다."
  fr: "Obsidian est une application de gestion de connaissances pour créer, lier et organiser visuellement des notes Markdown."
  de: "Obsidian ist eine Wissensmanagement-App für das Erstellen, Verlinken und visuelle Organisieren von Markdown-Notizen."
  sv: "Obsidian är en kunskapsstyringsapp för att skapa, länka och visualisera organisera Markdown-anteckningar."
  el: "Το Obsidian είναι μια εφαρμογή διαχείρισης γνώσεων για τη δημιουργία, την σύνδεση και την οπτική οργάνωση σημειώσεων…"
  hr: "Obsidian je aplikacija za upravljanje znanjem za stvaranje, povezivanje i vizualno organiziranje Markdown bilješki."
  pt: "Obsidian é uma aplicação de gestão de conhecimento para criar, ligar e organizar visualmente notas Markdown."
  ru: "Obsidian — это приложение для управления знаниями, предназначенное для создания, связывания и визуальной организации…"
  tr: "Obsidian, Markdown notlarını oluşturmak, bağlamak ve görsel olarak düzenlemek için bir bilgi yönetimi uygulamasıdır."
  uk: "Obsidian — застосунок для керування знаннями: створюйте, пов'язуйте та наочно впорядковуйте нотатки в Markdown."
description:
  en: "Obsidian is a self-hosted knowledge management app designed for creating, linking, and organizing notes, operating on local Markdown files, leveraging WebDAV and kasmVNC remote desktop technology to deliver a near-native experience in browsers. Its intuitive interface supports storing and editing notes on devices, ensuring full data ownership, ideal for crafting a lasting second brain.\n\nThe app's core features include robust note management and connectivity, suitable for various scenarios. Bi-directional linking connects related notes, forming a web of knowledge, while the Graph View visualizes note relationships, helping users uncover hidden connections. It supports Markdown editing with live preview for easy formatting and structuring. Hundreds of community plugins and themes offer extended functionality, such as calendars, kanban boards, PDF annotation, and advanced search, enabling tailored workflows. The Canvas feature provides infinite visual organization space, aiding students in organizing research, writers in developing stories, or professionals in managing projects. Notes are stored as standard Markdown files, openable with any text editor, ensuring future-proof portability.\n\nIt enhances usability through community-provided documentation, and whether for personal knowledge bases or team collaboration, the app's high flexibility and intuitive operation offer a modern knowledge management solution.\n\n**Key Features:**\n- Local storage, ensuring full data ownership\n- Bi-directional note linking for a knowledge web\n- Graph View for visualizing note connections\n- Extensible plugin system for personalized needs\n- Markdown support with live preview\n- Infinite Canvas for visual organization\n- Theme customization for enhanced visuals\n\n**Learn More:**\n- [Obsidian Official Website](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  it: "Obsidian è un'app di gestione della conoscenza self-hosted progettata per creare, collegare e organizzare note, operando su file Markdown locali, sfruttando la tecnologia desktop remoto WebDAV e kasmVNC per offrire un'esperienza quasi nativa nei browser. La sua interfaccia intuitiva supporta l'archiviazione e la modifica delle note sui dispositivi, garantendo la piena proprietà dei dati, ideale per creare un secondo cervello duraturo.\n\nLe funzionalità principali dell'app includono gestione robusta delle note e connettività, adatte a vari scenari. Il collegamento bidirezionale connette note correlate, formando una rete di conoscenza, mentre la Vista Grafico visualizza le relazioni tra le note, aiutando gli utenti a scoprire connessioni nascoste. Supporta la modifica Markdown con anteprima dal vivo per una facile formattazione e strutturazione. Centinaia di plugin e temi della community offrono funzionalità estese, come calendari, bacheche kanban, annotazioni PDF e ricerca avanzata, permettendo flussi di lavoro personalizzati. La funzione Canvas fornisce spazio di organizzazione visiva infinito, aiutando studenti nell'organizzare ricerche, scrittori nello sviluppare storie, o professionisti nella gestione progetti. Le note sono archiviate come file Markdown standard, apribili con qualsiasi editor di testo, garantendo portabilità a prova di futuro.\n\nMigliora l'usabilità attraverso documentazione fornita dalla community, e che sia per basi di conoscenza personali o collaborazione di team, l'alta flessibilità e l'operazione intuitiva dell'app offrono una soluzione moderna di gestione della conoscenza.\n\n**Caratteristiche Principali:**\n- Archiviazione locale, garantendo piena proprietà dei dati\n- Collegamento bidirezionale delle note per una rete di conoscenza\n- Vista Grafico per visualizzare connessioni delle note\n- Sistema di plugin estensibile per esigenze personalizzate\n- Supporto Markdown con anteprima dal vivo\n- Canvas infinito per organizzazione visiva\n- Personalizzazione temi per elementi visivi migliorati\n\n**Per saperne di più:**\n- [Sito Web Ufficiale Obsidian](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  nb: "Obsidian er en selvvertet kunnskapsstyringsapp designet for å opprette, koble og organisere notater, som opererer på lokale Markdown-filer og utnytter WebDAV og kasmVNC ekstern skrivebordsteknologi for å levere en nesten innfødt opplevelse i nettlesere. Det intuitive grensesnittet støtter lagring og redigering av notater på enheter, og sikrer full datainnehav, ideelt for å lage en varig andre hjerne.\n\nAppens hovedfunksjoner inkluderer robust notatbehandling og tilkobling, egnet for ulike scenarier. Toveis kobling forbinder relaterte notater og danner et kunnskapsnett, mens Graf-visningen visualiserer notatforbindelser og hjelper brukere med å avdekke skjulte forbindelser. Den støtter Markdown-redigering med direkteforhåndsvisning for enkel formatering og strukturering. Hundrevis av fellesskapstillegg og temaer tilbyr utvidet funksjonalitet, som kalendere, kanban-tavler, PDF-annotasjon og avansert søk, som muliggjør skreddersydde arbeidsflyter. Canvas-funksjonen gir uendelig visuelt organisasjonsrom, som hjelper studenter med å organisere forskning, forfattere med å utvikle historier, eller fagfolk med å administrere prosjekter. Notater lagres som standard Markdown-filer, som kan åpnes med hvilken som helst tekstredigerer, noe som sikrer fremtidssikker portabilitet.\n\nDen forbedrer brukervennligheten gjennom fellesskapstilveiebrakt dokumentasjon, og enten det er for personlige kunnskapsbaser eller teamsamarbeid, tilbyr appens høye fleksibilitet og intuitive drift en moderne kunnskapsstyringsløsning.\n\n**Hovedfunksjoner:**\n- Lokal lagring, sikrer full datainnehav\n- Toveis notatkobling for et kunnskapsnett\n- Graf-visning for visualisering av notatforbindelser\n- Utvidbart plugin-system for personlige behov\n- Markdown-støtte med direkteforhåndsvisning\n- Uendelig Canvas for visuell organisering\n- Tematilpasning for forbedret visuell opplevelse\n\n**Lær mer:**\n- [Obsidian Offisiell Nettside](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  zh: "Obsidian 是一款自托管知识管理应用，专为创建、链接和组织笔记设计，基于本地 Markdown 文件操作，通过 WebDAV 协议和 kasmVNC 远程桌面技术，支持在浏览器中提供与本地几乎一致的流畅体验。其直观的界面支持在设备上存储和编辑笔记，确保数据完全归用户所有，适合打造持久的第二大脑。\n\n该应用的核心功能包括强大的笔记管理和连接功能，适用于多种场景。双向链接功能将相关笔记关联起来，形成知识网络，而图谱视图以可视化方式展示笔记间的联系，帮助用户发现隐藏的概念关系。它支持实时预览的 Markdown 编辑，便于格式化和组织内容。数百种社区插件和主题提供扩展功能，如日历、看板、PDF 批注和高级搜索，让用户根据需求定制工作流程。画布功能提供无限视觉组织空间，助力学生整理研究笔记、作家构思故事或专业人士管理项目。笔记存储为标准 Markdown 文件，可用任何文本编辑器打开，确保数据未来可迁移。\n\n它通过社区支持文档优化使用体验，无论是个人知识库还是团队协作，该应用以高灵活性和直观操作，提供现代化知识管理解决方案。\n\n**主要功能:**\n- 本地存储，确保数据完全归用户所有\n- 双向笔记链接，构建知识网络\n- 图谱视图，可视化笔记间联系\n- 可扩展的插件系统，满足个性化需求\n- 支持实时预览的 Markdown 编辑\n- 无限画布，视觉化组织创意\n- 主题自定义，提升视觉体验\n\n**了解更多:**\n- [Obsidian官方网站](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  ja: "Obsidianは、ローカルMarkdownファイル上で動作し、WebDAVとkasmVNCリモートデスクトップ技術を活用してブラウザでネイティブに近い体験を提供する、ノートの作成、リンク、整理のために設計されたセルフホスト型ナレッジマネジメントアプリです。直感的なインターフェースはデバイス上でのノートの保存と編集をサポートし、完全なデータ所有権を確保し、持続的なセカンドブレインを構築するのに理想的です。\n\nアプリの主要機能には、様々なシナリオに適した堅牢なノート管理と接続性が含まれます。双方向リンクは関連するノートを接続してナレッジウェブを形成し、グラフビューはノートの関係を視覚化してユーザーが隠れた接続を発見するのを助けます。ライブプレビューでのMarkdown編集をサポートし、簡単な書式設定と構造化を可能にします。数百のコミュニティプラグインとテーマがカレンダー、カンバンボード、PDF注釈、高度な検索などの拡張機能を提供し、カスタマイズされたワークフローを可能にします。Canvas機能は無限の視覚的組織スペースを提供し、学生の研究整理、作家のストーリー開発、専門家のプロジェクト管理を支援します。ノートは標準的なMarkdownファイルとして保存され、任意のテキストエディタで開くことができ、将来性のある可搬性を保証します。\n\nコミュニティ提供のドキュメントを通じて使いやすさを向上させ、個人のナレッジベースでもチームコラボレーションでも、アプリの高い柔軟性と直感的な操作により現代的なナレッジマネジメントソリューションを提供します。\n\n**主な機能:**\n- ローカルストレージ、完全なデータ所有権を保証\n- ナレッジウェブのための双方向ノートリンク\n- ノート接続を視覚化するグラフビュー\n- 個人のニーズに対応する拡張可能なプラグインシステム\n- ライブプレビューでのMarkdownサポート\n- 視覚的整理のための無限キャンバス\n- 視覚効果を向上させるテーマカスタマイゼーション\n\n**詳細を見る:**\n- [Obsidian公式ウェブサイト](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  ko: "Obsidian은 로컬 Markdown 파일에서 작동하며, WebDAV 및 kasmVNC 원격 데스크톱 기술을 활용하여 브라우저에서 거의 네이티브 경험을 제공하는 노트 생성, 연결 및 정리를 위해 설계된 자체 호스팅 지식 관리 앱입니다. 직관적인 인터페이스는 기기에서 노트 저장 및 편집을 지원하며, 완전한 데이터 소유권을 보장하여 지속적인 제2의 뇌를 만드는데 이상적입니다.\n\n앱의 핵심 기능에는 다양한 시나리오에 적합한 강력한 노트 관리 및 연결성이 포함됩니다. 양방향 링크는 관련된 노트를 연결하여 지식 웹을 형성하고, 그래프 뷰는 노트 관계를 시각화하여 사용자가 숨겨진 연결을 발견하도록 돕습니다. 쉬운 서식 지정 및 구조화를 위한 실시간 미리보기가 있는 Markdown 편집을 지원합니다. 수백 개의 커뮤니티 플러그인과 테마가 달력, 칸반 보드, PDF 주석, 고급 검색과 같은 확장 기능을 제공하여 맞춤형 워크플로우를 가능하게 합니다. 캔버스 기능은 무한한 시각적 조직 공간을 제공하여 학생들의 연구 정리, 작가들의 스토리 개발, 전문가들의 프로젝트 관리를 지원합니다. 노트는 표준 Markdown 파일로 저장되어 모든 텍스트 편집기로 열 수 있어 미래 보장 이식성을 보장합니다.\n\n커뮤니티에서 제공하는 문서를 통해 사용성을 향상시키며, 개인 지식 베이스든 팀 협업이든 앱의 높은 유연성과 직관적인 작업으로 현대적인 지식 관리 솔루션을 제공합니다.\n\n**주요 기능:**\n- 로컬 저장소, 완전한 데이터 소유권 보장\n- 지식 웹을 위한 양방향 노트 연결\n- 노트 연결을 시각화하는 그래프 뷰\n- 개인화된 요구사항을 위한 확장 가능한 플러그인 시스템\n- 실시간 미리보기가 있는 Markdown 지원\n- 시각적 조직을 위한 무한 캔버스\n- 향상된 시각 효과를 위한 테마 사용자 정의\n\n**더 자세히 알아보기:**\n- [Obsidian 공식 웹사이트](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  fr: "Obsidian est une application de gestion des connaissances auto-hébergée conçue pour créer, lier et organiser des notes, fonctionnant sur des fichiers Markdown locaux, exploitant la technologie de bureau à distance WebDAV et kasmVNC pour offrir une expérience quasi-native dans les navigateurs. Son interface intuitive prend en charge le stockage et l'édition de notes sur les appareils, garantissant la pleine propriété des données, idéale pour créer un second cerveau durable.\n\nLes fonctionnalités principales de l'application incluent une gestion robuste des notes et une connectivité, adaptées à divers scénarios. La liaison bidirectionnelle connecte les notes liées, formant un réseau de connaissances, tandis que la Vue Graphique visualise les relations entre les notes, aidant les utilisateurs à découvrir des connexions cachées. Elle prend en charge l'édition Markdown avec aperçu en direct pour un formatage et une structuration faciles. Des centaines de plugins et thèmes communautaires offrent des fonctionnalités étendues, telles que calendriers, tableaux kanban, annotation PDF et recherche avancée, permettant des flux de travail personnalisés. La fonctionnalité Canvas fournit un espace d'organisation visuelle infini, aidant les étudiants à organiser la recherche, les écrivains à développer des histoires, ou les professionnels à gérer des projets. Les notes sont stockées sous forme de fichiers Markdown standard, ouvrable avec n'importe quel éditeur de texte, garantissant une portabilité à l'épreuve du temps.\n\nElle améliore l'utilisabilité grâce à la documentation fournie par la communauté, et que ce soit pour des bases de connaissances personnelles ou la collaboration d'équipe, la haute flexibilité et l'opération intuitive de l'application offrent une solution moderne de gestion des connaissances.\n\n**Caractéristiques principales:**\n- Stockage local, garantissant la pleine propriété des données\n- Liaison bidirectionnelle des notes pour un réseau de connaissances\n- Vue Graphique pour visualiser les connexions des notes\n- Système de plugins extensible pour les besoins personnalisés\n- Support Markdown avec aperçu en direct\n- Canvas infini pour l'organisation visuelle\n- Personnalisation des thèmes pour des visuels améliorés\n\n**En savoir plus:**\n- [Site Web Officiel Obsidian](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  de: "Obsidian ist eine selbst gehostete Wissensmanagemment-App, die zum Erstellen, Verknüpfen und Organisieren von Notizen entwickelt wurde und auf lokalen Markdown-Dateien arbeitet, wobei WebDAV- und kasmVNC-Remote-Desktop-Technologie genutzt wird, um eine nahezu native Erfahrung in Browsern zu bieten. Die intuitive Benutzeroberfläche unterstützt das Speichern und Bearbeiten von Notizen auf Geräten und gewährleistet vollständigen Datenbesitz, ideal für die Erstellung eines dauerhaften zweiten Gehirns.\n\nDie Kernfunktionen der App umfassen robuste Notizverwaltung und Konnektivität, geeignet für verschiedene Szenarien. Bidirektionale Verknüpfung verbindet verwandte Notizen und bildet ein Wissensnetz, während die Graph-Ansicht Notizbeziehungen visualisiert und Benutzern hilft, versteckte Verbindungen zu entdecken. Sie unterstützt Markdown-Bearbeitung mit Live-Vorschau für einfache Formatierung und Strukturierung. Hunderte von Community-Plugins und Themes bieten erweiterte Funktionalität wie Kalender, Kanban-Boards, PDF-Annotation und erweiterte Suche, die maßgeschneiderte Arbeitsabläufe ermöglichen. Die Canvas-Funktion bietet unbegrenzten visuellen Organisationsraum und hilft Studenten beim Organisieren von Forschung, Schriftstellern beim Entwickeln von Geschichten oder Fachleuten beim Verwalten von Projekten. Notizen werden als Standard-Markdown-Dateien gespeichert, die mit jedem Texteditor geöffnet werden können, was zukunftssichere Portabilität gewährleistet.\n\nSie verbessert die Benutzerfreundlichkeit durch von der Community bereitgestellte Dokumentation, und ob für persönliche Wissensbasen oder Teamzusammenarbeit, die hohe Flexibilität und intuitive Bedienung der App bieten eine moderne Wissensmanagemment-Lösung.\n\n**Hauptmerkmale:**\n- Lokale Speicherung, gewährleistet vollständigen Datenbesitz\n- Bidirektionale Notizverknüpfung für ein Wissensnetz\n- Graph-Ansicht zur Visualisierung von Notizverbindungen\n- Erweiterbares Plugin-System für personalisierte Bedürfnisse\n- Markdown-Unterstützung mit Live-Vorschau\n- Unendliche Canvas für visuelle Organisation\n- Theme-Anpassung für verbesserte Visuals\n\n**Mehr erfahren:**\n- [Obsidian Offizielle Website](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  sv: "Obsidian är en självvärd kunskapshanteringsapp designad för att skapa, länka och organisera anteckningar, som arbetar på lokala Markdown-filer och utnyttjar WebDAV och kasmVNC fjärrskrivbordsteknologi för att leverera en nästan inbyggd upplevelse i webbläsare. Det intuitiva gränssnittet stöder lagring och redigering av anteckningar på enheter, vilket säkerställer fullständigt dataägarskap, idealiskt för att skapa en varaktig andra hjärna.\n\nAppens kärnfunktioner inkluderar robust anteckningshantering och anslutning, lämplig för olika scenarier. Dubbelriktad länkning förbinder relaterade anteckningar och bildar ett kunskapsnät, medan Graf-vyn visualiserar anteckningsförhållanden och hjälper användare att avslöja dolda förbindelser. Den stöder Markdown-redigering med live förhandsvisning för enkel formatering och strukturering. Hundratals community-plugins och teman erbjuder utökad funktionalitet som kalendrar, kanban-tavlor, PDF-annotering och avancerad sökning, som möjliggör skräddarsydda arbetsflöden. Canvas-funktionen ger oändligt visuellt organisationsutrymme, som hjälper studenter att organisera forskning, författare att utveckla berättelser, eller yrkesverksamma att hantera projekt. Anteckningar lagras som standard Markdown-filer, öppningsbara med vilken textredigerare som helst, vilket säkerställer framtidssäker portabilitet.\n\nDen förbättrar användbarheten genom community-tillhandahållen dokumentation, och oavsett om det är för personliga kunskapsbaser eller teamsamarbete, erbjuder appens höga flexibilitet och intuitiva drift en modern kunskapshanteringslösning.\n\n**Huvudfunktioner:**\n- Lokal lagring, säkerställer fullständigt dataägarskap\n- Dubbelriktad anteckningslänkning för ett kunskapsnät\n- Graf-vy för visualisering av anteckningsförbindelser\n- Utbyggbart plugin-system för personliga behov\n- Markdown-stöd med live förhandsvisning\n- Oändlig Canvas för visuell organisation\n- Temaanpassning för förbättrade visuella effekter\n\n**Läs mer:**\n- [Obsidian Officiell Webbplats](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  el: "Το Obsidian είναι μια αυτο-φιλοξενούμενη εφαρμογή διαχείρισης γνώσης σχεδιασμένη για τη δημιουργία, σύνδεση και οργάνωση σημειώσεων, λειτουργώντας σε τοπικά αρχεία Markdown, αξιοποιώντας την τεχνολογία απομακρυσμένης επιφάνειας εργασίας WebDAV και kasmVNC για να παρέχει μια σχεδόν εγγενή εμπειρία σε περιηγητές. Η διαισθητική διεπαφή του υποστηρίζει την αποθήκευση και επεξεργασία σημειώσεων σε συσκευές, διασφαλίζοντας πλήρη κυριότητα δεδομένων, ιδανική για τη δημιουργία ενός διαρκούς δεύτερου εγκεφάλου.\n\nΤα βασικά χαρακτηριστικά της εφαρμογής περιλαμβάνουν ισχυρή διαχείριση σημειώσεων και συνδεσιμότητα, κατάλληλα για διάφορα σενάρια. Η αμφίδρομη σύνδεση συνδέει σχετικές σημειώσεις, σχηματίζοντας ένα δίκτυο γνώσης, ενώ η Προβολή Γραφήματος οπτικοποιεί τις σχέσεις σημειώσεων, βοηθώντας τους χρήστες να αποκαλύψουν κρυφές συνδέσεις. Υποστηρίζει επεξεργασία Markdown με ζωντανή προεπισκόπηση για εύκολη μορφοποίηση και δομή. Εκατοντάδες plugins και θέματα της κοινότητας προσφέρουν εκτεταμένη λειτουργικότητα όπως ημερολόγια, πίνακες kanban, σχολιασμό PDF και προηγμένη αναζήτηση, επιτρέποντας προσαρμοσμένες ροές εργασίας. Η λειτουργία Canvas παρέχει άπειρο χώρο οπτικής οργάνωσης, βοηθώντας φοιτητές να οργανώσουν έρευνα, συγγραφείς να αναπτύξουν ιστορίες, ή επαγγελματίες να διαχειριστούν έργα. Οι σημειώσεις αποθηκεύονται ως τυπικά αρχεία Markdown, που μπορούν να ανοιχτούν με οποιοδήποτε επεξεργαστή κειμένου, διασφαλίζοντας μελλοντικά ασφαλή φορητότητα.\n\nΒελτιώνει τη χρηστικότητα μέσω τεκμηρίωσης που παρέχεται από την κοινότητα, και είτε για προσωπικές βάσεις γνώσης είτε για συνεργασία ομάδας, η υψηλή ευελιξία και η διαισθητική λειτουργία της εφαρμογής προσφέρουν μια σύγχρονη λύση διαχείρισης γνώσης.\n\n**Βασικά Χαρακτηριστικά:**\n- Τοπική αποθήκευση, διασφαλίζοντας πλήρη κυριότητα δεδομένων\n- Αμφίδρομη σύνδεση σημειώσεων για ένα δίκτυο γνώσης\n- Προβολή Γραφήματος για την οπτικοποίηση συνδέσεων σημειώσεων\n- Επεκτάσιμο σύστημα προσθέτων για εξατομικευμένες ανάγκες\n- Υποστήριξη Markdown με ζωντανή προεπισκόπηση\n- Άπειρο Canvas για οπτική οργάνωση\n- Προσαρμογή θεμάτων για βελτιωμένα οπτικά στοιχεία\n\n**Μάθετε περισσότερα:**\n- [Επίσημη Ιστοσελίδα Obsidian](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  hr: "Obsidian je self-hosted aplikacija za upravljanje znanjem namijenjena stvaranju, povezivanju i organiziranju bilješki, radeći na lokalnim Markdown datotekama, koristeći WebDAV i kasmVNC tehnologiju udaljene radne površine za pružanje gotovo izvornog iskustva u preglednicima. Njezino intuitivno sučelje podržava pohranjivanje i uređivanje bilješki na uređajima, osiguravajući potpuno vlasništvo podataka, idealno za stvaranje trajnog drugog mozga.\n\nOsnovne značajke aplikacije uključuju robusno upravljanje bilješkama i povezivost, prikladne za različite scenarije. Dvosmjerno povezivanje povezuje povezane bilješke, stvarajući mrežu znanja, dok Graph View vizualizira odnose bilješki, pomažući korisnicima otkrivati skrivene veze. Podržava Markdown uređivanje s uživo pretpregledom za lako oblikovanje i strukturiranje. Stotine community dodataka i tema nude proširenu funkcionalnost poput kalendara, kanban ploča, PDF anotacije i napredne pretrage, omogućavajući prilagođene radne tokove. Canvas značajka pruža beskonačan prostor za vizualnu organizaciju, pomažući studentima organizirati istraživanja, piscima razvijati priče ili stručnjacima upravljati projektima. Bilješke se pohranjuju kao standardne Markdown datoteke, otvorene s bilo kojim uređivačem teksta, osiguravajući buduću portabilnost.\n\nPoboljšava upotrebljivost kroz dokumentaciju koju pruža zajednica, i bilo da se radi o osobnim bazama znanja ili timskoj suradnji, visoka fleksibilnost i intuitivno rukovanje aplikacije nude moderno rješenje za upravljanje znanjem.\n\n**Ključne značajke:**\n- Lokalno pohranjivanje, osigurava potpuno vlasništvo podataka\n- Dvosmjerno povezivanje bilješki za mrežu znanja\n- Graph View za vizualizaciju veza bilješki\n- Proširivi sustav dodataka za personalizirane potrebe\n- Markdown podrška s uživo pretpregledom\n- Beskonačni Canvas za vizualnu organizaciju\n- Prilagođavanje tema za poboljšane vizuale\n\n**Saznajte više:**\n- [Obsidian Službena Web stranica](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  pt: "Obsidian é uma aplicação de gestão de conhecimento auto-hospedada concebida para criar, ligar e organizar notas, operando em ficheiros Markdown locais, aproveitando a tecnologia de ambiente de trabalho remoto WebDAV e kasmVNC para proporcionar uma experiência quase nativa em navegadores. A sua interface intuitiva suporta o armazenamento e edição de notas em dispositivos, garantindo propriedade total dos dados, ideal para criar um segundo cérebro duradouro.\n\nAs funcionalidades principais da aplicação incluem gestão robusta de notas e conectividade, adequadas para vários cenários. A ligação bidirecional conecta notas relacionadas, formando uma rede de conhecimento, enquanto a Vista de Gráfico visualiza relacionamentos de notas, ajudando utilizadores a descobrir ligações ocultas. Suporta edição Markdown com pré-visualização ao vivo para formatação e estruturação fáceis. Centenas de plugins e temas da comunidade oferecem funcionalidade estendida como calendários, quadros kanban, anotação PDF e pesquisa avançada, permitindo fluxos de trabalho personalizados. A funcionalidade Canvas fornece espaço infinito de organização visual, ajudando estudantes a organizar investigação, escritores a desenvolver histórias, ou profissionais a gerir projetos. As notas são armazenadas como ficheiros Markdown padrão, abríveis com qualquer editor de texto, garantindo portabilidade à prova de futuro.\n\nMelhora a usabilidade através de documentação fornecida pela comunidade, e seja para bases de conhecimento pessoais ou colaboração em equipa, a alta flexibilidade e operação intuitiva da aplicação oferecem uma solução moderna de gestão de conhecimento.\n\n**Características Principais:**\n- Armazenamento local, garantindo propriedade total dos dados\n- Ligação bidirecional de notas para uma rede de conhecimento\n- Vista de Gráfico para visualizar ligações de notas\n- Sistema de plugins extensível para necessidades personalizadas\n- Suporte Markdown com pré-visualização ao vivo\n- Canvas infinito para organização visual\n- Personalização de temas para visuais melhorados\n\n**Saiba mais:**\n- [Site Oficial Obsidian](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  ru: "Obsidian — это самохостируемое приложение для управления знаниями, предназначенное для создания, связывания и организации заметок, работающее с локальными файлами Markdown и использующее технологию удаленного рабочего стола WebDAV и kasmVNC для обеспечения почти нативного опыта в браузерах. Его интуитивный интерфейс поддерживает хранение и редактирование заметок на устройствах, обеспечивая полное владение данными, идеально подходящее для создания долговечного второго мозга.\n\nОсновные функции приложения включают надежное управление заметками и связность, подходящие для различных сценариев. Двунаправленное связывание соединяет связанные заметки, формируя сеть знаний, в то время как График-вид визуализирует отношения заметок, помогая пользователям обнаруживать скрытые связи. Оно поддерживает редактирование Markdown с живым предпросмотром для легкого форматирования и структурирования. Сотни плагинов и тем сообщества предлагают расширенную функциональность, такую как календари, доски канбан, аннотирование PDF и расширенный поиск, обеспечивая настраиваемые рабочие процессы. Функция Canvas предоставляет бесконечное пространство визуальной организации, помогая студентам организовывать исследования, писателям разрабатывать истории, или профессионалам управлять проектами. Заметки хранятся как стандартные файлы Markdown, открываемые любым текстовым редактором, обеспечивая будущую портативность.\n\nОно улучшает удобство использования через документацию, предоставляемую сообществом, и будь то для личных баз знаний или командного сотрудничества, высокая гибкость и интуитивная работа приложения предлагают современное решение для управления знаниями.\n\n**Основные функции:**\n- Локальное хранилище, обеспечивающее полное владение данными\n- Двунаправленное связывание заметок для сети знаний\n- График-вид для визуализации связей заметок\n- Расширяемая система плагинов для персонализированных потребностей\n- Поддержка Markdown с живым предпросмотром\n- Бесконечный Canvas для визуальной организации\n- Настройка тем для улучшенных визуальных элементов\n\n**Узнать больше:**\n- [Официальный сайт Obsidian](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  tr: "Obsidian, yerel Markdown dosyaları üzerinde çalışan, tarayıcılarda neredeyse yerel bir deneyim sunmak için WebDAV ve kasmVNC uzak masaüstü teknolojisini kullanan, notlar oluşturmak, bağlamak ve organize etmek için tasarlanmış, kendi kendine barındırılan bir bilgi yönetimi uygulamasıdır. Sezgisel arayüzü cihazlarda not depolama ve düzenlemeyi destekler, tam veri sahipliğini sağlar, kalıcı bir ikinci beyin oluşturmak için idealdir.\n\nUygulamanın temel özellikleri çeşitli senaryolar için uygun güçlü not yönetimi ve bağlantıyı içerir. Çift yönlü bağlantı ilgili notları birbirine bağlayarak bir bilgi ağı oluşturur, Graf Görünümü ise not ilişkilerini görselleştirerek kullanıcıların gizli bağlantıları keşfetmesine yardımcı olur. Kolay biçimlendirme ve yapılandırma için canlı önizleme ile Markdown düzenlemeyi destekler. Yüzlerce topluluk eklentisi ve teması takvimler, kanban panoları, PDF açıklama ve gelişmiş arama gibi genişletilmiş işlevsellik sunarak özelleştirilmiş iş akışlarını mümkün kılar. Canvas özelliği sonsuz görsel organizasyon alanı sağlayarak öğrencilerin araştırma organize etmesine, yazarların hikayeler geliştirmesine veya profesyonellerin projeleri yönetmesine yardımcı olur. Notlar herhangi bir metin düzenleyici ile açılabilen standart Markdown dosyaları olarak saklanır, gelecek garantili taşınabilirlik sağlar.\n\nTopluluk tarafından sağlanan belgeler aracılığıyla kullanılabilirliği artırır ve ister kişisel bilgi tabanları ister takım işbirliği için olsun, uygulamanın yüksek esnekliği ve sezgisel işletimi modern bir bilgi yönetimi çözümü sunar.\n\n**Temel Özellikler:**\n- Yerel depolama, tam veri sahipliğini sağlar\n- Bilgi ağı için çift yönlü not bağlantısı\n- Not bağlantılarını görselleştirmek için Grafik Görünümü\n- Kişiselleştirilmiş ihtiyaçlar için genişletilebilir eklenti sistemi\n- Canlı önizleme ile Markdown desteği\n- Görsel organizasyon için sonsuz Tuval\n- Gelişmiş görseller için tema özelleştirmesi\n\n**Daha fazla bilgi edinin:**\n- [Obsidian Resmi Web Sitesi](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
  uk: "Obsidian — застосунок для керування знаннями, який ви розгортаєте самі. Він призначений для створення, зв'язування та впорядкування нотаток, працює з локальними файлами Markdown і завдяки WebDAV та віддаленому робочому столу kasmVNC дає майже нативні відчуття в браузері. Зручний інтерфейс дозволяє зберігати й редагувати нотатки на пристроях із повною власністю на дані — ідеально для побудови довготривалого «другого мозку».\n\nОсновні можливості — потужне керування нотатками та зв'язками, придатне для різних сценаріїв. Двосторонні посилання пов'язують споріднені нотатки у мережу знань, а граф наочно показує зв'язки між нотатками й допомагає знайти приховані залежності. Підтримується редагування в Markdown із живим переглядом для зручного форматування та структурування. Сотні плагінів і тем від спільноти додають можливості на кшталт календарів, канбан-дощок, анотування PDF і розширеного пошуку, тож робочий процес можна підлаштувати під себе. Canvas дає безмежний простір для візуальної організації: студентам — упорядковувати дослідження, письменникам — розвивати історії, фахівцям — керувати проєктами. Нотатки зберігаються як звичайні файли Markdown, які відкриє будь-який текстовий редактор, тож вони лишаться переносними надалі.\n\nКористуватися допомагає документація від спільноти, а висока гнучкість і зрозуміла робота роблять застосунок сучасним рішенням для керування знаннями — чи то особиста база знань, чи командна співпраця.\n\n**Основні можливості:**\n- Локальне зберігання з повною власністю на дані\n- Двосторонні посилання між нотатками для мережі знань\n- Граф для візуалізації зв'язків між нотатками\n- Розширювана система плагінів для особистих потреб\n- Підтримка Markdown із живим переглядом\n- Безмежний Canvas для візуальної організації\n- Налаштування тем для кращого вигляду\n\n**Дізнатися більше:**\n- [Офіційний сайт Obsidian](https://obsidian.md)\n- [DockerHub](https://hub.docker.com/r/linuxserver/obsidian)"
