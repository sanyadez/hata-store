title:
  en: MongoDB 4
tagline:
  en: A free and open-source cross-platform document-oriented database program.
  zh: 一个免费且开源的跨平台面向文档的数据库程序。MongoDB 被归类为 NoSQL 数据库程序，它使用具有模式的类似 JSON 的文档。
  ar: برنامج قاعدة بيانات وثائقية عابرة المنصات ومفتوح المصدر ومجاني.
  de: "Ein kostenloses und Open-Source, plattformübergreifendes, dokumentenorientiertes Datenbankprogramm."
  es: "Un programa de base de datos orientado a documentos, gratuito y de código abierto, que es multiplataforma."
  fr: "Un programme de base de données orienté documents, gratuit et open source, multiplateforme."
  hu: "Egy ingyenes, nyílt forráskódú, többplatformos dokumentumorientált adatbázisprogram."
  it: "Un programma gratuito e open source di database orientato ai documenti, multipiattaforma."
  ru: "Бесплатная и открытая кросс-платформенная программная система, ориентированная на документы."
  pl: "Darmowy, otwartoźródłowy program bazodanowy zorientowany na dokumenty, działający na wielu platformach."
  pt: "Um programa de banco de dados orientado a documentos, gratuito e de código aberto, multiplataforma."
  uk: Безкоштовна кросплатформна документоорієнтована база даних із відкритим кодом.
description:
  en: "MongoDB is a free and open-source cross-platform document-oriented database program. Classified as a NoSQL database program, MongoDB uses JSON-like documents with schemata. MongoDB is developed by MongoDB Inc., and is published under a combination of the Server Side Public License and the Apache License."
  zh: MongoDB 是一个免费且开源的跨平台面向文档的数据库程序。MongoDB 被归类为 NoSQL 数据库程序，它使用具有模式的类似 JSON 的文档。MongoDB 由 MongoDB Inc. 开发，并在 Server Side Public License 和 Apache License 的组合下发布。
  ar: MongoDB هو برنامج قاعدة بيانات وثائقية عابرة للمنصات ومفتوح المصدر ومجاني. يُصنف MongoDB كبرنامج قاعدة بيانات NoSQL، ويستخدم وثائق تشبه JSON مع تخطيطات. تم تطوير MongoDB بواسطة MongoDB Inc. وتم نشره تحت ترخيص Server Side Public وترخيص Apache.
  de: "MongoDB ist ein kostenloses und Open-Source, plattformübergreifendes, dokumentenorientiertes Datenbankprogramm. MongoDB wird als NoSQL-Datenbankprogramm eingestuft und verwendet JSON-ähnliche Dokumente mit Schemata. MongoDB wird von MongoDB Inc. entwickelt und unter der Kombination der Server Side Public License und der Apache License veröffentlicht."
  es: "MongoDB es un programa de base de datos orientado a documentos, gratuito y de código abierto, multiplataforma. MongoDB se clasifica como un programa de base de datos NoSQL y utiliza documentos similares a JSON con esquemas. MongoDB es desarrollado por MongoDB Inc. y se publica bajo una combinación de la Licencia Pública del Lado del Servidor y la Licencia Apache."
  fr: "MongoDB est un programme de base de données orienté documents, gratuit et open source, multiplateforme. MongoDB est classé comme un programme de base de données NoSQL et utilise des documents de type JSON avec des schémas. MongoDB est développé par MongoDB Inc. et est publié sous une combinaison de la Licence Publique du Côté Serveur et de la Licence Apache."
  hu: "A MongoDB egy ingyenes és nyílt forráskódú, többplatformos dokumentumorientált adatbázisprogram. A MongoDB-t NoSQL adatbázisprogramként sorolják be, JSON-szerű dokumentumokat használ sémákkal. A MongoDB-t a MongoDB Inc. fejleszti és a Server Side Public License és az Apache License kombinációjával jelenteti meg."
  it: "MongoDB è un programma di database orientato ai documenti, gratuito e open source, multipiattaforma. MongoDB viene classificato come un programma di database NoSQL e utilizza documenti simili a JSON con schemi. MongoDB è sviluppato da MongoDB Inc. ed è pubblicato sotto una combinazione della Server Side Public License e dell'Apache License."
  ru: MongoDB - это бесплатная и открытая кросс-платформенная программа для работы с документоориентированной базой данных. Она классифицируется как NoSQL-база данных и использует документы в формате JSON с схемами. MongoDB разработана компанией MongoDB Inc. и распространяется под комбинацией лицензий Server Side Public и Apache.
  pl: "MongoDB to darmowy i otwartoźródłowy, wieloplatformowy program bazodanowy zorientowany na dokumenty. MongoDB jest klasyfikowana jako program bazodanowy NoSQL i wykorzystuje dokumenty w formacie JSON z schematami. MongoDB jest rozwijana przez MongoDB Inc. i jest publikowana na zasadach licencji Server Side Public License oraz licencji Apache."
  pt: "O MongoDB é um programa de banco de dados orientado a documentos, gratuito e de código aberto, multiplataforma. Classificado como um programa de banco de dados NoSQL, o MongoDB utiliza documentos semelhantes a JSON com esquemas. O MongoDB é desenvolvido pela MongoDB Inc. e é publicado sob uma combinação da Licença Pública do Lado do Servidor e da Licença Apache."
  uk: "MongoDB — безкоштовна кросплатформна документоорієнтована база даних із відкритим кодом. Це NoSQL-база: вона зберігає JSON-подібні документи зі схемами. MongoDB розробляє MongoDB Inc., а поширюється вона за комбінацією ліцензій Server Side Public License та Apache License."
