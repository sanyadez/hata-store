# Apache-2.0, changed for Hata Store: see NOTICE
services:
  filedrop:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: noecl/filedrop:1.0.1
    deploy:
      resources:
        reservations:
          memory: 2048M
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /var/file_drop_files
