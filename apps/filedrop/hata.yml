title: FileDrop
tagline:
  en: "FileDrop is a free, open source file sharing service"
  uk: FileDrop — безкоштовний сервіс обміну файлами з відкритим кодом
description:
  en: "FileDrop is a self-hosted file sharing service that allows you to easily share files with family, friends, or colleagues. It's been designed to be easy to use and light on resources."
  uk: "FileDrop — сервіс обміну файлами для самостійного розгортання, за допомогою якого можна легко ділитися файлами з родиною, друзями чи колегами. Він простий у користуванні й невибагливий до ресурсів."
category: productivity
developer: Noé Favier (noe.favier@outlook.com)
website: https://hub.docker.com/
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
web:
  service: filedrop
  port: 8000
settings:
  - name: WEB_PORT
    type: port
    default: 8000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
