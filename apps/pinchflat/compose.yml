# Apache-2.0, changed for Hata Store: see NOTICE
services:
  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202
    deploy:
      resources:
        reservations:
          memory: 256M
    ports:
      - "${WEB_PORT:-8945}:8945"
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${DOWNLOADS_DIR:-./Media/Downloads}"
        target: /downloads
