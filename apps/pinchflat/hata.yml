title: Pinchflat
tagline:
  en: Your next YouTube media manager
  uk: Ваш наступний менеджер медіа з YouTube
description:
  en: "Pinchflat is a self-hosted app for downloading YouTube content built using yt-dlp. It's designed to be lightweight, self-contained, and easy to use. You set up rules for how to download content from YouTube channels or playlists and it'll do the rest, periodically checking for new content.\n\nKey features include:\n- Self-contained - just one Docker container with no external dependencies\n- Powerful naming system so content is stored where and how you want it\n- Easy-to-use web interface with presets to get you started right away\n- First-class support for media center apps like Plex, Jellyfin, and Kodi\n- Supports serving RSS feeds to your favourite podcast app\n- Automatically downloads new content from channels and playlists\n- Supports downloading audio content\n- Custom rules for handling YouTube Shorts and livestreams\n- Apprise support for notifications\n- Optionally automatically delete old content\n- Advanced options like setting cutoff dates and filtering by title\n- Reliable hands-off operation\n- Can pass cookies to YouTube to download your private playlists\n- Sponsorblock integration\n- Supports running custom scripts when after downloading/deleting media\n\nPerfect for people who want to download content for use with a media center app or for those who want to archive media!"
  uk: "Pinchflat — застосунок для самостійного розгортання, що завантажує вміст із YouTube за допомогою yt-dlp. Він легкий, самодостатній і простий у користуванні. Ви задаєте правила, як завантажувати вміст із каналів чи плейлистів YouTube, а решту він робить сам, періодично перевіряючи нове.\n\nОсновні можливості:\n- Самодостатність — один контейнер Docker без зовнішніх залежностей\n- Потужна система іменування: вміст зберігається там і так, як вам потрібно\n- Зручний вебінтерфейс із готовими шаблонами для швидкого старту\n- Повноцінна підтримка медіацентрів, як-от Plex, Jellyfin і Kodi\n- Видача RSS-стрічок для вашого улюбленого застосунку подкастів\n- Автоматичне завантаження нового вмісту з каналів і плейлистів\n- Підтримка завантаження аудіо\n- Власні правила для YouTube Shorts і прямих трансляцій\n- Підтримка Apprise для сповіщень\n- Необов'язкове автоматичне видалення старого вмісту\n- Розширені параметри, як-от крайні дати й фільтрація за назвою\n- Надійна робота без втручання\n- Можливість передавати YouTube cookie, щоб завантажувати приватні плейлисти\n- Інтеграція з Sponsorblock\n- Підтримка запуску власних скриптів після завантаження чи видалення медіа\n\nЧудово підходить тим, хто завантажує вміст для медіацентру або хоче архівувати медіа!"
notes:
  en: "Pinchflat will automatically create the necessary directories and start downloading content based on your configured sources.\n\nMake sure you have enough storage space for your downloads. The app uses /downloads as the default download directory.\n\nAfter installation, access the web interface to configure your YouTube channels and playlists for automatic downloading."
  uk: "Pinchflat сам створить потрібні теки й почне завантажувати вміст згідно з налаштованими джерелами.\n\nПереконайтеся, що вистачає місця для завантажень. Застосунок за замовчуванням використовує теку /downloads.\n\nПісля встановлення відкрийте вебінтерфейс і налаштуйте канали та плейлисти YouTube для автоматичного завантаження."
category: media
developer: kieraneglin
website: https://github.com/kieraneglin/pinchflat
source: https://github.com/kieraneglin/pinchflat
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: pinchflat
  port: 8945
settings:
  - name: WEB_PORT
    type: port
    default: 8945
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Downloads"
    label:
      en: Pinchflat downloads directory
      uk: Тека завантажень Pinchflat
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
