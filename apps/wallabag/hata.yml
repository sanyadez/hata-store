title: Wallabag
tagline:
  en: Save and classify articles. Read them later. Freely.
  uk: Зберігайте й розкладайте статті. Читайте їх пізніше. Вільно.
description:
  en: "Wallabag is a web page saving app that allows users to save articles for offline reading, extracting content for a distraction-free experience. Its intuitive Web interface enables saving articles with a click, ensuring users can read them at their convenience.\n\nThe app's core features include convenient web page saving, optimized reading, and flexible content organization. It extracts only the article's content, removing pop-ups and ads, and displays it in a clean, comfortable view. Users can organize saved articles with tags and automatic tagging rules, creating a personalized content library accessible on demand. Browser extensions enable quick saving, compatible with Chrome, Firefox, Opera, and more. Cross-platform clients cover Android, iOS, and other devices, ensuring a seamless reading experience. It also supports multi-user collaboration for sharing saved articles.\n\nIt enables importing data from services like Pocket, Readability, Instapaper, or Pinboard, simplifying content library migration. RSS generation allows users to access saved articles in RSS readers. Community documentation enhances usability, and the app's high flexibility and intuitive operation deliver a modern web content management solution.\n\n**Key Features:**\n- Save web pages for offline reading\n- Extract pure content for a distraction-free reading view\n- Article classification with automatic tagging rules for a personalized content library\n- Browser extensions for quick web page saving\n- Cross-platform clients (Android, iOS, Chrome, Firefox, Opera)\n- Multi-user collaboration for sharing saved articles\n- Import data from Pocket, Readability, Instapaper, Pinboard and other services\n- RSS generation for accessing saved articles in readers\n\n**Learn More:**\n- [Wallabag Official Website](https://wallabag.org)\n- [Wallabag GitHub Repository](https://github.com/wallabag/wallabag)\n- [Wallabag Documentation](https://doc.wallabag.org)\n- [Wallabag Docker Image](https://hub.docker.com/r/wallabag/wallabag)"
  uk: "Wallabag — застосунок для збереження вебсторінок, що дозволяє зберігати статті для читання офлайн і витягує з них вміст, щоб ніщо не відволікало. Зручний вебінтерфейс дає змогу зберегти статтю одним кліком і прочитати її, коли вам зручно.\n\nОсновні можливості — зручне збереження вебсторінок, оптимізоване читання та гнучке впорядкування вмісту. Застосунок витягує лише текст статті, прибирає спливні вікна й рекламу та показує її в чистому, зручному вигляді. Збережені статті можна впорядковувати за допомогою тегів і правил автоматичного тегування, створюючи власну бібліотеку, доступну будь-коли. Розширення для браузерів дозволяють швидко зберігати сторінки; вони працюють у Chrome, Firefox, Opera та інших. Кросплатформні клієнти для Android, iOS та інших пристроїв забезпечують зручне читання всюди. Підтримується і спільна робота кількох користувачів, щоб ділитися збереженими статтями.\n\nМожна імпортувати дані з Pocket, Readability, Instapaper чи Pinboard і легко перенести свою бібліотеку. Генерація RSS дає змогу читати збережені статті в RSS-рідерах. Документація спільноти допомагає розібратися, а гнучкість і простота роблять застосунок сучасним засобом керування вебвмістом.\n\n**Основні можливості:**\n- Збереження вебсторінок для читання офлайн\n- Витягування чистого вмісту для читання без відволікань\n- Класифікація статей із правилами автоматичного тегування для власної бібліотеки\n- Розширення для браузерів для швидкого збереження сторінок\n- Кросплатформні клієнти (Android, iOS, Chrome, Firefox, Opera)\n- Спільна робота кількох користувачів, обмін збереженими статтями\n- Імпорт даних із Pocket, Readability, Instapaper, Pinboard та інших сервісів\n- Генерація RSS для доступу до збережених статей у рідерах\n\n**Докладніше:**\n- [Офіційний сайт Wallabag](https://wallabag.org)\n- [Репозиторій Wallabag на GitHub](https://github.com/wallabag/wallabag)\n- [Документація Wallabag](https://doc.wallabag.org)\n- [Docker-образ Wallabag](https://hub.docker.com/r/wallabag/wallabag)"
notes:
  en: "You need to set the environment variable `SYMFONY__ENV__DOMAIN_NAME` to your domain name or IP address, which can be modified through the Wallabag settings page.\n\n**Default Account**\n\n| Username | Password | |----------|----------| | `wallabag`    | `wallabag` |"
  uk: "Потрібно задати змінну середовища `SYMFONY__ENV__DOMAIN_NAME` — ваше доменне ім'я або IP-адресу; її можна змінити на сторінці налаштувань Wallabag.\n\n**Типовий обліковий запис**\n\n| Ім'я користувача | Пароль | |----------|----------| | `wallabag`    | `wallabag` |"
