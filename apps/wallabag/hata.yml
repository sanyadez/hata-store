    type: port
    default: 25661
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: SYMFONY__ENV__DOMAIN_NAME
    type: text
    default: http://<IP>:25661
    label:
      en: Instance domain name
      uk: "Доменне ім'я екземпляра"
  - name: SYMFONY__ENV__SERVER_NAME
    type: text
    default: Wallabag
    label:
      en: Server name
      uk: Назва сервера
