title: Trilium
tagline:
  en: Build your personal knowledge base with TriliumNext Notes
  uk: Створіть власну базу знань за допомогою TriliumNext Notes
description:
  en: "TriliumNext Notes is a cross-platform hierarchical note-taking tool focused on building large personal knowledge bases, offering robust organization and editing capabilities. Its intuitive interface and versatile features make it ideal for scholars, developers, and note-taking enthusiasts managing complex knowledge.\n\nThe tool's core features include hierarchical note organization and rich editing. Users can arrange notes in an arbitrarily deep tree structure, with single notes clonable to multiple locations. It supports a WYSIWYG editor with tables, images, math, and Markdown autoformatting for efficiency. Code notes feature syntax highlighting, while fast navigation includes full-text search and note hoisting. Seamless versioning and note attributes enable organization, querying, and advanced scripting.\n\nIt offers secure login (OpenID, TOTP), supports self-hosted synchronization servers or third-party services, and provides per-note encryption for privacy. Users can sketch diagrams with Excalidraw, create relation/link maps, mind maps with Mind Elixir, and geo maps with location pins and GPX tracks. A REST API enables automation, with scalability for over 100,000 notes. Touch-optimized mobile frontend, dark theme, user themes, Evernote/Markdown import/export, and Web Clipper enhance usability.\n\n**Key Features:**\n- Notes can be arranged into arbitrarily deep tree. Single note can be placed into multiple places in the tree (see [cloning](https://triliumnext.github.io/Docs/Wiki/cloning-notes))\n- Rich WYSIWYG note editor including e.g. tables, images and [math](https://triliumnext.github.io/Docs/Wiki/text-notes) with markdown [autoformat](https://triliumnext.github.io/Docs/Wiki/text-notes#autoformat)\n- Support for editing [notes with source code](https://triliumnext.github.io/Docs/Wiki/code-notes), including syntax highlighting\n- Fast and easy [navigation between notes](https://triliumnext.github.io/Docs/Wiki/note-navigation), full text search and [note hoisting](https://triliumnext.github.io/Docs/Wiki/note-hoisting)\n- Seamless [note versioning](https://triliumnext.github.io/Docs/Wiki/note-revisions)\n- Note [attributes](https://triliumnext.github.io/Docs/Wiki/attributes) can be used for note organization, querying and advanced [scripting](https://triliumnext.github.io/Docs/Wiki/scripts)\n- Direct [OpenID and TOTP integration](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Installation%20%26%20Setup/Server%20Installation/Multi-Factor%20Authentication.md) for more secure login\n- [Synchronization](https://triliumnext.github.io/Docs/Wiki/synchronization) with self-hosted sync server\n- there's a [3rd party service for hosting synchronisation server](https://trilium.cc/paid-hosting)\n- [Sharing](https://triliumnext.github.io/Docs/Wiki/sharing) (publishing) notes to public internet\n- Strong [note encryption](https://triliumnext.github.io/Docs/Wiki/protected-notes) with per-note granularity\n- Sketching diagrams, based on [Excalidraw](https://excalidraw.com/) (note type canvas)\n- [Relation maps](https://triliumnext.github.io/Docs/Wiki/relation-map) and [link maps](https://triliumnext.github.io/Docs/Wiki/link-map) for visualizing notes and their relations\n- Mind maps, based on [Mind Elixir](https://docs.mind-elixir.com/)\n- [Geo maps](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Note%20Types/Geo%20Map.md) with location pins and GPX tracks\n- [Scripting](https://triliumnext.github.io/Docs/Wiki/scripts) - see [Advanced showcases](https://triliumnext.github.io/Docs/Wiki/advanced-showcases)\n- [REST API](https://triliumnext.github.io/Docs/Wiki/etapi) for automation\n- Scales well in both usability and performance upwards of 100 000 notes\n- Touch optimized [mobile frontend](https://triliumnext.github.io/Docs/Wiki/mobile-frontend) for smartphones and tablets\n- Built-in [dark theme](https://triliumnext.github.io/Docs/Wiki/themes), support for user themes\n- [Evernote](https://triliumnext.github.io/Docs/Wiki/evernote-import) and [Markdown import & export](https://triliumnext.github.io/Docs/Wiki/markdown)\n- [Web Clipper](https://triliumnext.github.io/Docs/Wiki/web-clipper) for easy saving of web content\n- Customizable UI (sidebar buttons, user-defined widgets,...)\n- [Metrics](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Advanced%20Usage/Metrics.md), along with a [Grafana Dashboard](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Advanced%20Usage/Metrics/grafana-dashboard.json)\n\n**Learn More:**\n- [TriliumNext GitHub Repository](https://github.com/TriliumNext/Trilium)\n- [awesome-trilium](https://github.com/Nriver/awesome-trilium) for 3rd party themes, scripts, plugins and more\n- [TriliumRocks!](https://trilium.rocks/) for tutorials, guides, and much more"
  uk: "TriliumNext Notes — кросплатформний інструмент для ієрархічних нотаток, призначений для створення великих особистих баз знань. Він має потужні засоби організації та редагування, а зрозумілий інтерфейс і гнучкі можливості роблять його зручним для науковців, розробників і всіх, хто веде складні нотатки.\n\nОсновні можливості — ієрархічна організація нотаток і багатий редактор. Нотатки можна розкладати в дерево довільної глибини, а одну нотатку — клонувати в кілька місць. Є WYSIWYG-редактор із таблицями, зображеннями, формулами та автоформатуванням Markdown. Нотатки з кодом мають підсвічування синтаксису, а швидку навігацію забезпечують повнотекстовий пошук і «підняття» нотатки (hoisting). Безперервне версіонування та атрибути нотаток допомагають упорядковувати, шукати й писати складні скрипти.\n\nЗастосунок пропонує безпечний вхід (OpenID, TOTP), підтримує синхронізацію зі своїм сервером або сторонніми сервісами та шифрування кожної нотатки окремо. Можна малювати діаграми в Excalidraw, створювати карти зв'язків і посилань, інтелект-карти з Mind Elixir та геокарти з позначками місць і треками GPX. REST API дозволяє автоматизацію, а продуктивності вистачає на понад 100 000 нотаток. Зручності додають мобільний інтерфейс для сенсорних екранів, темна тема, власні теми, імпорт і експорт Evernote та Markdown, а також Web Clipper.\n\n**Основні можливості:**\n- Нотатки можна розкладати в дерево довільної глибини. Одну нотатку можна розмістити в кількох місцях дерева (див. [клонування](https://triliumnext.github.io/Docs/Wiki/cloning-notes))\n- Багатий WYSIWYG-редактор нотаток, зокрема з таблицями, зображеннями й [формулами](https://triliumnext.github.io/Docs/Wiki/text-notes) та [автоформатуванням](https://triliumnext.github.io/Docs/Wiki/text-notes#autoformat) Markdown\n- Редагування [нотаток із вихідним кодом](https://triliumnext.github.io/Docs/Wiki/code-notes) з підсвічуванням синтаксису\n- Швидка й проста [навігація між нотатками](https://triliumnext.github.io/Docs/Wiki/note-navigation), повнотекстовий пошук і [підняття нотаток](https://triliumnext.github.io/Docs/Wiki/note-hoisting)\n- Безперервне [версіонування нотаток](https://triliumnext.github.io/Docs/Wiki/note-revisions)\n- [Атрибути](https://triliumnext.github.io/Docs/Wiki/attributes) нотаток для впорядкування, пошуку та складних [скриптів](https://triliumnext.github.io/Docs/Wiki/scripts)\n- Пряма [інтеграція OpenID і TOTP](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Installation%20%26%20Setup/Server%20Installation/Multi-Factor%20Authentication.md) для безпечнішого входу\n- [Синхронізація](https://triliumnext.github.io/Docs/Wiki/synchronization) зі своїм сервером синхронізації\n- Є [сторонній сервіс хостингу сервера синхронізації](https://trilium.cc/paid-hosting)\n- [Спільний доступ](https://triliumnext.github.io/Docs/Wiki/sharing) (публікація) нотаток в інтернеті\n- Надійне [шифрування нотаток](https://triliumnext.github.io/Docs/Wiki/protected-notes) із вибором для кожної нотатки\n- Малювання діаграм на основі [Excalidraw](https://excalidraw.com/) (тип нотатки «полотно»)\n- [Карти зв'язків](https://triliumnext.github.io/Docs/Wiki/relation-map) і [карти посилань](https://triliumnext.github.io/Docs/Wiki/link-map) для візуалізації нотаток та їхніх зв'язків\n- Інтелект-карти на основі [Mind Elixir](https://docs.mind-elixir.com/)\n- [Геокарти](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Note%20Types/Geo%20Map.md) з позначками місць і треками GPX\n- [Скрипти](https://triliumnext.github.io/Docs/Wiki/scripts) — див. [приклади складних рішень](https://triliumnext.github.io/Docs/Wiki/advanced-showcases)\n- [REST API](https://triliumnext.github.io/Docs/Wiki/etapi) для автоматизації\n- Добре масштабується за зручністю й продуктивністю до понад 100 000 нотаток\n- [Мобільний інтерфейс](https://triliumnext.github.io/Docs/Wiki/mobile-frontend), оптимізований для сенсорних екранів смартфонів і планшетів\n- Вбудована [темна тема](https://triliumnext.github.io/Docs/Wiki/themes) і підтримка власних тем\n- [Імпорт Evernote](https://triliumnext.github.io/Docs/Wiki/evernote-import) та [імпорт і експорт Markdown](https://triliumnext.github.io/Docs/Wiki/markdown)\n- [Web Clipper](https://triliumnext.github.io/Docs/Wiki/web-clipper) для простого збереження вмісту вебсторінок\n- Настроюваний інтерфейс (кнопки бічної панелі, власні віджети тощо)\n- [Метрики](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Advanced%20Usage/Metrics.md) та [панель Grafana](https://github.com/TriliumNext/Trilium/blob/main/docs/User%20Guide/User%20Guide/Advanced%20Usage/Metrics/grafana-dashboard.json)\n\n**Докладніше:**\n- [Репозиторій TriliumNext на GitHub](https://github.com/TriliumNext/Trilium)\n- [awesome-trilium](https://github.com/Nriver/awesome-trilium) — сторонні теми, скрипти, плагіни та інше\n- [TriliumRocks!](https://trilium.rocks/) — підручники, посібники й багато іншого"
