# Apache-2.0, changed for Hata Store: see NOTICE
services:
  trilium:
    command:
      []
    deploy:
      resources:
        reservations:
          memory: 256M
    image: triliumnext/trilium:v0.103.0
    ports:
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /home/node/trilium-data
    privileged: false
