title: BeaverHabitTracker
tagline:
  en: "A self-hosted, goal-free habit tracking tool."
  uk: Трекер звичок без цілей для власного сервера.
description:
  en: "Beaver Habit Tracker is a self-hosted habit tracking tool designed for users who want to effortlessly monitor daily behaviors without the stress of goal-setting. Its intuitive Web interface offers a pressure-free tracking experience, ideal for those focused on behavior observation and personal growth.\n\nThe tool's core features include goal-free habit tracking and a minimalist interface. It allows users to log multiple habits easily, without focusing on streaks or targets, and provides simple visualizations to understand behavior patterns. Users can add daily notes to record specific activities or reflections, with a smooth, low-effort interface.\n\nIt uses a self-hosted approach, ensuring data privacy and full control, with a lightweight, efficient design requiring minimal server resources. Users can manually reorder habits for an optimized experience. The tool's stress-free observation and intuitive operation help users gradually improve habits, delivering a modern habit management solution.\n\n**Key Features:**\n- Goal-free habit tracking focused on awareness, not achievement\n- Clean, minimalist interface for effortless daily logging\n- Lightweight and efficient, requiring minimal server resources\n- Simple visualizations to understand behavior patterns\n- Daily notes for recording activities or reflections\n\n**Learn More:**\n- [Beaver Habit Tracker Official Website](https://beaverhabits.com/)\n- [Beaver Habit Tracker GitHub](https://github.com/daya0576/beaverhabits)"
  uk: "Beaver Habit Tracker — трекер звичок для власного сервера, створений для тих, хто хоче без зусиль стежити за щоденною поведінкою без стресу від постановки цілей. Зрозумілий вебінтерфейс дає змогу вести облік без тиску — це ідеально для тих, хто хоче спостерігати за поведінкою та розвиватися.\n\nОсновні можливості: облік звичок без цілей і мінімалістичний інтерфейс. Можна легко вести облік кількох звичок, не думаючи про серії чи плани, а прості візуалізації допомагають зрозуміти закономірності поведінки. До кожного дня можна додавати нотатки про конкретні дії чи роздуми — зручно й без зайвих зусиль.\n\nВін працює на вашому сервері, тому дані залишаються приватними й під вашим контролем, а легка та ефективна конструкція потребує мінімум ресурсів. Звички можна вручну впорядковувати як зручно. Спостереження без стресу й проста робота допомагають поступово покращувати звички — це сучасне рішення для керування ними.\n\n**Основні можливості:**\n- Облік звичок без цілей: усвідомленість, а не досягнення\n- Чистий мінімалістичний інтерфейс для щоденних записів без зусиль\n- Легкий і ефективний, потребує мінімум серверних ресурсів\n- Прості візуалізації для розуміння закономірностей поведінки\n- Щоденні нотатки для запису дій чи роздумів\n\n**Дізнатися більше:**\n- [Офіційний сайт Beaver Habit Tracker](https://beaverhabits.com/)\n- [Beaver Habit Tracker на GitHub](https://github.com/daya0576/beaverhabits)"
category: productivity
developer: daya0576
website: https://beaverhabits.com/
source: https://github.com/daya0576/beaverhabits
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: beaverhabittracker
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 15580
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: HABITS_STORAGE
    type: text
    default: USER_DISK
    label:
      en: Sets the storage type for habits
      uk: Тип сховища для звичок
  - name: TRUSTED_LOCAL_EMAIL
    type: text
    default: your@email.com
    label:
      en: Sets the trusted local email
      uk: Довірена локальна адреса пошти
  - name: INDEX_HABIT_DATE_COLUMNS
    type: text
    default: "5"
    label:
      en: Customize the displayed dates for the index page
      uk: "Дати, що показуються на головній сторінці"
  - name: ENABLE_IOS_STANDALONE
    type: text
    default: "true"
    label:
      en: Enables iOS standalone mode
      uk: Автономний режим для iOS
