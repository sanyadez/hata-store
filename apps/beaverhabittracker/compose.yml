# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  beaverhabittracker:
    image: daya0576/beaverhabits:0.10.0
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 128M
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "${WEB_PORT:-15580}:8080"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/"
        target: /app/.user
    environment:
      HABITS_STORAGE: "${HABITS_STORAGE:-USER_DISK}"
      TRUSTED_LOCAL_EMAIL: "${TRUSTED_LOCAL_EMAIL:-your@email.com}"
      INDEX_HABIT_DATE_COLUMNS: "${INDEX_HABIT_DATE_COLUMNS:-5}"
      ENABLE_IOS_STANDALONE: "${ENABLE_IOS_STANDALONE:-true}"
