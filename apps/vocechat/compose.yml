# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  vocechat:
    environment:
      TZ: "${TZ:-UTC}"
    image: privoce/vocechat-server:v0.5.17
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-3009}:3000"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/home/vocechat-server/data"
        target: /home/vocechat-server/data
