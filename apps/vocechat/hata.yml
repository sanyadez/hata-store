title: VoceChat
tagline:
  en: Have a Private Social Space Hosted on Your Site
  uk: Приватний соціальний простір на вашому сервері
description:
  en: "VoceChat is a secure chat software designed for independent deployment, offering a flexible solution for seamless communication. It combines instant messaging with channel-based group chats, allowing you to engage in one-on-one conversations or create themed channels for group discussions.\n\nVoceChat supports a variety of message formats, including text, images, files, emojis, and rich text (Markdown), making your communication vibrant and expressive. Once deployed, it can be accessed via a WebAPP or mobile APP, ensuring a consistent experience across platforms.\n\nWith robust management features, VoceChat enables easy member and channel administration, giving you full control over your team or group’s communication environment. Whether for individual users or enterprise teams, VoceChat delivers a secure, versatile, and efficient chat solution."
  uk: "VoceChat — захищений чат для самостійного розгортання, гнучке рішення для зручного спілкування. Він поєднує миттєві повідомлення та групові чати в каналах: можна листуватися наодинці або створювати тематичні канали для обговорень.\n\nVoceChat підтримує різні формати повідомлень: текст, зображення, файли, емодзі та розмічений текст (Markdown), тож спілкування виходить жвавим і виразним. Після розгортання до чату можна заходити через вебзастосунок або мобільний застосунок, і скрізь він працює однаково.\n\nПотужні засоби керування дозволяють легко адмініструвати учасників і канали та повністю контролювати спілкування у вашій команді чи групі. Для окремих користувачів і корпоративних команд VoceChat — це безпечний, гнучкий та ефективний чат."
