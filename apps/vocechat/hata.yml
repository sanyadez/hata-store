title:
  en: VoceChat
tagline:
  en: Have a Private Social Space Hosted on Your Site
  it: Ospita uno Spazio Sociale Privato sul Tuo Sito
  nb: Ha et Privat Sosialt Rom Hostet på Ditt Nettsted
  zh: 在您的网站上托管一个私人社交空间
  ja: あなたのサイトでホストされるプライベートなソーシャルスペースを持つ
  ko: 당신의 사이트에서 호스팅되는 프라이빗 소셜 공간을 가져보세요
  fr: Hébergez un Espace Social Privé sur Votre Site
  de: Haben Sie einen Privaten Sozialen Raum auf Ihrer Website
  sv: Ha ett Privat Socialt Utrymme Hostat på Din Webbplats
  el: Φιλοξενήστε έναν Ιδιωτικό Κοινωνικό Χώρο στον Ιστότοπό σας
  hr: Imajte Privatni Društveni Prostor Hostiran na Vašoj Stranici
  pt: Tenha um Espaço Social Privado Hospedado no Seu Site
  ru: Создайте Приватное Социальное Пространство на Вашем Сайте
  tr: Sitenizde Barındırılan Özel Bir Sosyal Alan Sahip Olun
