# Apache-2.0, changed for Hata Store: see NOTICE
services:
  mongo:
    image: mongo:8.3.11
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${PORT_27017:-27017}:27017"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data/configdb"
        target: /data/configdb
      - type: bind
        source: "${APP_DATA:-.}/data/db"
        target: /data/db
