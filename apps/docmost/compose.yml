# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  docmost:
    image: docmost/docmost:0.96.0
    deploy:
      resources:
        reservations:
          memory: 512M
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/storage"
        target: /app/data/storage
    environment:
      APP_URL: "${APP_URL:-http://localhost:3000}"
      APP_SECRET: "${APP_SECRET:?set APP_SECRET}"
      DATABASE_URL: "postgresql://docmost:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@docmost-db:5432/docmost?schema=public"
      REDIS_URL: "${REDIS_URL:-redis://docmost-redis:6379}"
    networks:
      - docmost-network
    depends_on:
      - docmost-db
      - docmost-redis
  docmost-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-docmost}"
      POSTGRES_USER: "${POSTGRES_USER:-docmost}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/pgdata"
        target: /var/lib/postgresql/data
    networks:
      - docmost-network
  docmost-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/redis"
        target: /data
    networks:
      - docmost-network
networks:
  docmost-network:
    driver: bridge
