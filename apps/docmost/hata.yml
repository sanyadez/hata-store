settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: APP_SECRET
    type: secret
    label:
      en: Application Secret Key
      uk: Секретний ключ застосунку
  - name: REDIS_URL
    type: text
    default: redis://docmost-redis:6379
    label:
      en: Redis Connection URL
      uk: URL підключення до Redis
  - name: POSTGRES_DB
    type: text
    default: docmost
    label:
      en: PostgreSQL Database Name
      uk: Назва бази даних PostgreSQL
  - name: POSTGRES_USER
    type: text
    default: docmost
    label:
      en: PostgreSQL User
      uk: Користувач PostgreSQL
  - name: POSTGRES_PASSWORD
    type: secret
    label:
      en: PostgreSQL Password
      uk: Пароль PostgreSQL
