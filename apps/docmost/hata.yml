title: Docmost
tagline:
  en: A modern wiki and knowledge base for teams
  uk: Сучасна вікі та база знань для команд
description:
  en: "Docmost is a self-hosted collaborative wiki and documentation tool designed for real-time collaboration, allowing multiple users to edit the same page simultaneously without conflicts. Its intuitive interface is ideal for teams managing knowledge bases, project documentation, or wikis, offering an efficient knowledge creation and sharing experience.\n\nThe tool's core features include real-time collaborative editing and space organization. It supports multiple users editing pages in real time for seamless collaboration and organizes pages into 'spaces' for teams, projects, or departments, each with independent permission settings. A rich text editor with Markdown shortcuts simplifies content creation. Built-in Draw.io, Excalidraw, and Mermaid tools provide robust diagramming capabilities.\n\nIt offers permissions management, assigning access via user groups for content security. Pages can be publicly shared via links for external access. Comments enhance communication and feedback, while page history tracks changes. Features like nested navigation, quick search, file attachments, and Markdown/HTML import/export are supported. The tool’s collaboration and flexibility deliver a modern documentation solution.\n\n**Key Features:**\n- Real-time collaborative editing for multiple users\n- Spaces for organizing pages by team, project or department\n- Permissions management with user group access control\n- Rich text editor with Markdown shortcuts\n- Built-in Draw.io, Excalidraw, Mermaid diagramming tools\n- Public page sharing via links\n- Page comments for communication and feedback\n- Page history, nested navigation, search, and file attachments\n\n**Learn More:**\n- [Docmost Official Website](https://docmost.com/)\n- [Docmost GitHub](https://github.com/docmost/docmost)"
  uk: "Docmost — вікі та інструмент для документації для самостійного розгортання, створений для спільної роботи в реальному часі: кілька користувачів можуть одночасно редагувати одну сторінку без конфліктів. Зручний інтерфейс підійде командам, що ведуть бази знань, проєктну документацію чи вікі, і робить створення та поширення знань ефективним.\n\nГоловні можливості — спільне редагування в реальному часі та організація за просторами. Кілька користувачів редагують сторінки одночасно, а сторінки групуються в «простори» для команд, проєктів або відділів, кожен із власними налаштуваннями прав. Текстовий редактор із Markdown-скороченнями спрощує створення вмісту. Вбудовані Draw.io, Excalidraw і Mermaid дають змогу малювати діаграми.\n\nДоступ до вмісту захищено керуванням правами через групи користувачів. Сторінками можна ділитися публічно за посиланням. Коментарі полегшують обговорення, а історія сторінки відстежує зміни. Також є вкладена навігація, швидкий пошук, вкладення файлів та імпорт і експорт у Markdown/HTML. Завдяки спільній роботі й гнучкості Docmost — сучасне рішення для документації.\n\n**Основні можливості:**\n- Спільне редагування для кількох користувачів у реальному часі\n- Простори для організації сторінок за командами, проєктами чи відділами\n- Керування правами з доступом через групи користувачів\n- Текстовий редактор із Markdown-скороченнями\n- Вбудовані інструменти діаграм Draw.io, Excalidraw, Mermaid\n- Публічний доступ до сторінок за посиланням\n- Коментарі до сторінок для обговорення\n- Історія сторінок, вкладена навігація, пошук і вкладення файлів\n\n**Докладніше:**\n- [Офіційний сайт Docmost](https://docmost.com/)\n- [Docmost на GitHub](https://github.com/docmost/docmost)"
