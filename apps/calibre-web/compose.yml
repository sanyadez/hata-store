# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  calibre-web:
    environment:
      DOCKER_MODS: ghcr.io/linuxserver/mods:universal-calibre
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: linuxserver/calibre-web:0.6.24
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-8083}:8083"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${BOOKS_DIR:-./Media/Books}"
        target: /books
