web:
  service: calibre-web
  port: 8083
settings:
  - name: WEB_PORT
    type: port
    default: 8083
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: BOOKS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Books"
    label:
      en: Media/Books
      uk: Медіа/Книжки
    hint:
      en: Inside the app it is /books
      uk: У застосунку вона — /books
