title:
  en: Karakeep
tagline:
  en: The Bookmark Everything App
  it: "L'app per salvare tutto"
  nb: Appen for å bokmerke alt
  zh: 什么都能收藏的应用
  ja: 何でも保存できるブックマークアプリ
  ko: 무엇이든 저장하는 북마크 앱
  fr: "L'application pour tout mettre en favoris"
  de: Die App zum Speichern von allem
  sv: Appen för att bokmärka allt
  el: Η εφαρμογή για να αποθηκεύετε τα πάντα
  hr: Aplikacija za spremanje svega
  pt: A aplicação para guardar tudo
  ru: "Приложение, чтобы сохранять всё"
  tr: Her şeyi kaydetme uygulaması
  uk: "Застосунок, щоб зберігати закладками все"
description:
  en: "Karakeep is an open-source, self-hosted bookmark manager for links, notes, images, PDFs, and highlights, built to keep everything you want to save in one place. It automatically fetches titles, descriptions, and previews, then helps you organize your library with AI tagging, full-text search, lists, and rule-based automation. With browser extensions, mobile apps, RSS ingestion, and page archiving, Karakeep works well as both a read-later tool and a durable personal content archive.\n\n**Main Features:**\n- Save links, notes, images, PDFs, and text highlights in one library\n- Auto-fetch titles, descriptions, images, and archived pages for later reading\n- Use AI tagging, summarization, OCR, and full-text search to rediscover content quickly\n- Organize content with tags, collaborative lists, RSS feeds, and rule-based workflows\n- Access your collection through the web app, mobile apps, browser extensions, REST API, and CLI\n\n**Learn More:**\n- [Karakeep Official Website](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep Documentation](https://docs.karakeep.app/)"
  it: "Karakeep è un gestore di segnalibri open-source e self-hosted per link, note, immagini, PDF ed evidenziazioni, pensato per raccogliere in un solo posto tutto ciò che vuoi conservare. Recupera automaticamente titoli, descrizioni e anteprime, poi ti aiuta a organizzare la libreria con tagging AI, ricerca full-text, liste e automazioni basate su regole. Con estensioni browser, app mobili, importazione RSS e archiviazione completa delle pagine, Karakeep funziona bene sia come strumento read-later sia come archivio personale durevole di contenuti.\n\n**Funzionalità Principali:**\n- Salva link, note, immagini, PDF ed evidenziazioni di testo in un'unica libreria\n- Recupera automaticamente titoli, descrizioni, immagini e pagine archiviate per la lettura successiva\n- Usa tagging AI, riepiloghi, OCR e ricerca full-text per ritrovare rapidamente i contenuti\n- Organizza i contenuti con tag, liste collaborative, feed RSS e flussi basati su regole\n- Accedi alla raccolta tramite web app, app mobili, estensioni browser, REST API e CLI\n\n**Ulteriori Informazioni:**\n- [Sito Ufficiale Karakeep](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Documentazione di Karakeep](https://docs.karakeep.app/)"
  nb: "Karakeep er en åpen kildekode og selvhostet bokmerkeapp for lenker, notater, bilder, PDF-er og uthevinger, laget for å samle alt du vil lagre på ett sted. Den henter automatisk titler, beskrivelser og forhåndsvisninger, og hjelper deg deretter med å organisere biblioteket med AI-merking, fulltekstsøk, lister og regelbasert automatisering. Med nettleserutvidelser, mobilapper, RSS-import og sidearkivering fungerer Karakeep godt både som et les-senere-verktøy og som et varig personlig innholdsarkiv.\n\n**Hovedfunksjoner:**\n- Lagre lenker, notater, bilder, PDF-er og tekstuthevinger i ett bibliotek\n- Hent automatisk titler, beskrivelser, bilder og arkiverte sider for senere lesing\n- Bruk AI-merking, oppsummering, OCR og fulltekstsøk for å finne innhold raskt igjen\n- Organiser innhold med tagger, samarbeidslister, RSS-feeder og regelbaserte arbeidsflyter\n- Få tilgang til samlingen via webappen, mobilapper, nettleserutvidelser, REST API og CLI\n\n**Lær Mer:**\n- [Karakeep Offisielle Nettside](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep Dokumentasjon](https://docs.karakeep.app/)"
  zh: "Karakeep 是一款开源、自托管的收藏管理应用，可以把链接、笔记、图片、PDF 和网页高亮集中保存到同一个资料库中。 它会自动抓取标题、描述和预览内容，并结合 AI 标签、全文搜索、列表和规则引擎，帮助你更快整理与找回收藏。 借助浏览器扩展、移动端应用、RSS 导入和整页归档能力，Karakeep 既适合作为稍后读工具，也适合作为长期保存个人内容的归档库。\n\n**主要功能：**\n- 在同一个资料库中保存链接、笔记、图片、PDF 和文本高亮\n- 自动抓取标题、描述、图片和归档页面，方便后续阅读\n- 借助 AI 标签、摘要、OCR 和全文搜索，更快找回需要的内容\n- 通过标签、协作列表、RSS 订阅和规则工作流整理收藏\n- 可通过 Web 应用、移动端应用、浏览器扩展、REST API 和 CLI 访问内容\n\n**了解更多：**\n- [Karakeep 官网](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep 文档](https://docs.karakeep.app/)"
  ja: "Karakeepは、リンク、メモ、画像、PDF、ハイライトを一か所に保存できるように作られた、オープンソースでセルフホスト可能なブックマーク管理アプリです。 タイトル、説明、プレビューを自動取得し、AIタグ付け、全文検索、リスト、ルールベースの自動化でライブラリ整理を支援します。 ブラウザー拡張、モバイルアプリ、RSS取り込み、ページアーカイブに対応しており、あとで読むためのツールとしても、個人コンテンツを長く保管するアーカイブとしても使いやすい構成です。\n\n**主な機能：**\n- リンク、メモ、画像、PDF、テキストハイライトをひとつのライブラリに保存\n- タイトル、説明、画像、アーカイブ済みページを自動取得して後で読みやすく整理\n- AIタグ付け、要約、OCR、全文検索で必要な内容をすばやく再発見\n- タグ、共同リスト、RSSフィード、ルールベースのワークフローでコンテンツを整理\n- Webアプリ、モバイルアプリ、ブラウザー拡張、REST API、CLIからコレクションにアクセス可能\n\n**詳細情報：**\n- [Karakeep 公式サイト](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep ドキュメント](https://docs.karakeep.app/)"
  ko: "Karakeep은 링크, 메모, 이미지, PDF, 하이라이트를 한곳에 모아 저장할 수 있도록 만든 오픈 소스 자체 호스팅 북마크 관리자입니다. 제목, 설명, 미리보기를 자동으로 가져오고, AI 태깅, 전체 텍스트 검색, 리스트, 규칙 기반 자동화로 라이브러리 정리를 도와줍니다. 브라우저 확장, 모바일 앱, RSS 수집, 페이지 아카이빙을 지원해 나중에 읽기 도구로도 좋고 개인 콘텐츠를 오래 보관하는 아카이브로도 잘 맞습니다.\n\n**주요 기능:**\n- 링크, 메모, 이미지, PDF, 텍스트 하이라이트를 하나의 라이브러리에 저장\n- 제목, 설명, 이미지, 보관된 페이지를 자동으로 가져와 나중에 읽기 쉽게 정리\n- AI 태깅, 요약, OCR, 전체 텍스트 검색으로 필요한 내용을 빠르게 다시 찾기\n- 태그, 협업 리스트, RSS 피드, 규칙 기반 워크플로로 콘텐츠 구성\n- 웹 앱, 모바일 앱, 브라우저 확장, REST API, CLI를 통해 컬렉션에 접근\n\n**더 알아보기:**\n- [Karakeep 공식 웹사이트](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep 문서](https://docs.karakeep.app/)"
  fr: "Karakeep est un gestionnaire de favoris open-source et auto-hébergé pour les liens, notes, images, PDF et surlignages, conçu pour réunir en un seul endroit tout ce que vous voulez conserver. Il récupère automatiquement les titres, descriptions et aperçus, puis vous aide à organiser votre bibliothèque avec le marquage par IA, la recherche plein texte, les listes et l'automatisation basée sur des règles. Avec des extensions de navigateur, des applications mobiles, l'ingestion RSS et l'archivage complet des pages, Karakeep convient aussi bien comme outil de lecture différée que comme archive personnelle durable de contenus.\n\n**Fonctionnalités Principales :**\n- Enregistre liens, notes, images, PDF et surlignages de texte dans une seule bibliothèque\n- Récupère automatiquement titres, descriptions, images et pages archivées pour une lecture ultérieure\n- Utilise le marquage IA, les résumés, l'OCR et la recherche plein texte pour retrouver rapidement le contenu\n- Organise le contenu avec des tags, des listes collaboratives, des flux RSS et des workflows fondés sur des règles\n- Donne accès à la collection via l'application web, les applications mobiles, les extensions de navigateur, l'API REST et le CLI\n\n**En Savoir Plus :**\n- [Site Officiel Karakeep](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Documentation Karakeep](https://docs.karakeep.app/)"
  de: "Karakeep ist ein quelloffener und selbst gehosteter Bookmark-Manager für Links, Notizen, Bilder, PDFs und Highlights, der alles, was Sie aufheben möchten, an einem Ort sammelt. Er ruft automatisch Titel, Beschreibungen und Vorschauen ab und hilft anschließend mit KI-Tagging, Volltextsuche, Listen und regelbasierter Automatisierung bei der Organisation Ihrer Bibliothek. Mit Browser-Erweiterungen, mobilen Apps, RSS-Import und Seitenarchivierung eignet sich Karakeep sowohl als Später-lesen-Werkzeug als auch als dauerhaftes persönliches Inhaltsarchiv.\n\n**Hauptfunktionen:**\n- Speichert Links, Notizen, Bilder, PDFs und Text-Highlights in einer einzigen Bibliothek\n- Holt automatisch Titel, Beschreibungen, Bilder und archivierte Seiten für späteres Lesen\n- Nutzt KI-Tagging, Zusammenfassungen, OCR und Volltextsuche, um Inhalte schnell wiederzufinden\n- Organisiert Inhalte mit Tags, gemeinsamen Listen, RSS-Feeds und regelbasierten Workflows\n- Zugriff über Web-App, mobile Apps, Browser-Erweiterungen, REST-API und CLI\n\n**Mehr Erfahren:**\n- [Karakeep Offizielle Website](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep Dokumentation](https://docs.karakeep.app/)"
  sv: "Karakeep är en öppen källkod och självhostad bokmärkeshanterare för länkar, anteckningar, bilder, PDF-filer och markeringar, byggd för att samla allt du vill spara på ett ställe. Den hämtar automatiskt titlar, beskrivningar och förhandsvisningar och hjälper dig sedan att organisera biblioteket med AI-taggar, fulltextsökning, listor och regelbaserad automatisering. Med webbläsartillägg, mobilappar, RSS-import och sidarkivering fungerar Karakeep bra både som ett läs-senare-verktyg och som ett hållbart personligt innehållsarkiv.\n\n**Huvudfunktioner:**\n- Spara länkar, anteckningar, bilder, PDF-filer och textmarkeringar i ett enda bibliotek\n- Hämta automatiskt titlar, beskrivningar, bilder och arkiverade sidor för senare läsning\n- Använd AI-taggar, sammanfattningar, OCR och fulltextsökning för att snabbt hitta tillbaka till innehåll\n- Organisera innehåll med taggar, delade listor, RSS-flöden och regelbaserade arbetsflöden\n- Få åtkomst till samlingen via webbappen, mobilappar, webbläsartillägg, REST API och CLI\n\n**Lär Dig Mer:**\n- [Karakeep Officiella Webbplats](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep Dokumentation](https://docs.karakeep.app/)"
  el: "Το Karakeep είναι ένας open-source και self-hosted διαχειριστής σελιδοδεικτών για συνδέσμους, σημειώσεις, εικόνες, PDF και επισημάνσεις, φτιαγμένος για να συγκεντρώνει σε ένα μέρος όλα όσα θέλετε να κρατήσετε. Ανακτά αυτόματα τίτλους, περιγραφές και προεπισκοπήσεις και στη συνέχεια σας βοηθά να οργανώσετε τη βιβλιοθήκη σας με ετικέτες AI, πλήρη αναζήτηση κειμένου, λίστες και αυτοματισμούς βασισμένους σε κανόνες. Με επεκτάσεις browser, mobile apps, εισαγωγή RSS και αρχειοθέτηση σελίδων, το Karakeep λειτουργεί καλά τόσο ως εργαλείο read-later όσο και ως ανθεκτικό προσωπικό αρχείο περιεχομένου.\n\n**Κύριες Λειτουργίες:**\n- Αποθηκεύει συνδέσμους, σημειώσεις, εικόνες, PDF και επισημάνσεις κειμένου σε μία βιβλιοθήκη\n- Ανακτά αυτόματα τίτλους, περιγραφές, εικόνες και αρχειοθετημένες σελίδες για ανάγνωση αργότερα\n- Χρησιμοποιεί ετικέτες AI, περιλήψεις, OCR και πλήρη αναζήτηση κειμένου για γρήγορη επανανακάλυψη περιεχομένου\n- Οργανώνει περιεχόμενο με ετικέτες, συνεργατικές λίστες, RSS feeds και ροές εργασίας βασισμένες σε κανόνες\n- Παρέχει πρόσβαση μέσω web app, mobile apps, επεκτάσεων browser, REST API και CLI\n\n**Μάθετε Περισσότερα:**\n- [Επίσημος Ιστότοπος Karakeep](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Τεκμηρίωση Karakeep](https://docs.karakeep.app/)"
  hr: "Karakeep je open-source i samohostirani upravitelj oznaka za poveznice, bilješke, slike, PDF-ove i istaknute dijelove teksta, napravljen da na jednom mjestu čuva sve što želite spremiti. Automatski dohvaća naslove, opise i preglede, a zatim pomaže organizirati biblioteku uz AI označavanje, pretraživanje punog teksta, liste i automatizaciju temeljenu na pravilima. Uz proširenja preglednika, mobilne aplikacije, RSS uvoz i arhiviranje stranica, Karakeep dobro služi i kao alat za kasnije čitanje i kao trajna osobna arhiva sadržaja.\n\n**Glavne Funkcije:**\n- Sprema poveznice, bilješke, slike, PDF-ove i tekstualna isticanja u jednu biblioteku\n- Automatski dohvaća naslove, opise, slike i arhivirane stranice za kasnije čitanje\n- Koristi AI oznake, sažetke, OCR i pretraživanje punog teksta za brzo ponovno pronalaženje sadržaja\n- Organizira sadržaj pomoću oznaka, suradničkih lista, RSS izvora i radnih tokova temeljenih na pravilima\n- Omogućuje pristup zbirci kroz web aplikaciju, mobilne aplikacije, proširenja preglednika, REST API i CLI\n\n**Saznajte Više:**\n- [Službena Web Stranica Karakeep](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep Dokumentacija](https://docs.karakeep.app/)"
  pt: "O Karakeep é um gestor de marcadores open-source e auto-hospedado para ligações, notas, imagens, PDFs e destaques, criado para reunir num só lugar tudo o que quer guardar. Obtém automaticamente títulos, descrições e pré-visualizações e depois ajuda a organizar a biblioteca com etiquetagem por IA, pesquisa em texto completo, listas e automação baseada em regras. Com extensões de navegador, aplicações móveis, ingestão RSS e arquivamento de páginas, o Karakeep funciona bem tanto como ferramenta de leitura posterior como arquivo pessoal duradouro de conteúdos.\n\n**Principais Funcionalidades:**\n- Guarda ligações, notas, imagens, PDFs e destaques de texto numa única biblioteca\n- Obtém automaticamente títulos, descrições, imagens e páginas arquivadas para leitura posterior\n- Usa etiquetagem por IA, resumos, OCR e pesquisa em texto completo para reencontrar conteúdos rapidamente\n- Organiza conteúdos com etiquetas, listas colaborativas, feeds RSS e fluxos de trabalho baseados em regras\n- Dá acesso à coleção através da aplicação web, aplicações móveis, extensões de navegador, API REST e CLI\n\n**Saiba Mais:**\n- [Site Oficial Karakeep](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Documentação do Karakeep](https://docs.karakeep.app/)"
  ru: "Karakeep — это open-source и self-hosted менеджер закладок для ссылок, заметок, изображений, PDF и выделений, созданный для того, чтобы хранить всё важное в одном месте. Он автоматически получает заголовки, описания и превью, а затем помогает наводить порядок с помощью ИИ-тегов, полнотекстового поиска, списков и автоматизации на основе правил. Благодаря расширениям браузера, мобильным приложениям, RSS-импорту и архивированию страниц Karakeep хорошо подходит и как инструмент для чтения позже, и как долговременный личный архив контента.\n\n**Основные Функции:**\n- Сохраняет ссылки, заметки, изображения, PDF и текстовые выделения в одной библиотеке\n- Автоматически получает заголовки, описания, изображения и архивированные страницы для последующего чтения\n- Использует ИИ-теги, сводки, OCR и полнотекстовый поиск, чтобы быстрее находить нужный контент\n- Организует материалы с помощью тегов, совместных списков, RSS-лент и рабочих процессов на основе правил\n- Дает доступ к коллекции через веб-приложение, мобильные приложения, расширения браузера, REST API и CLI\n\n**Узнать Больше:**\n- [Официальный Сайт Karakeep](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Документация Karakeep](https://docs.karakeep.app/)"
  tr: "Karakeep, bağlantılar, notlar, görseller, PDF dosyaları ve vurgular için açık kaynaklı ve kendi kendine barındırılabilen bir yer imi yöneticisidir; saklamak istediğiniz her şeyi tek yerde toplamak için tasarlanmıştır. Başlıkları, açıklamaları ve önizlemeleri otomatik olarak çeker; ardından yapay zeka etiketleme, tam metin arama, listeler ve kural tabanlı otomasyon ile kütüphanenizi düzenlemenize yardımcı olur. Tarayıcı eklentileri, mobil uygulamalar, RSS içe aktarma ve sayfa arşivleme desteğiyle Karakeep hem daha sonra okumak için hem de kalıcı kişisel içerik arşivi olarak iyi çalışır.\n\n**Başlıca İşlevler:**\n- Bağlantıları, notları, görselleri, PDF dosyalarını ve metin vurgularını tek bir kütüphanede saklar\n- Daha sonra okumak için başlıkları, açıklamaları, görselleri ve arşivlenmiş sayfaları otomatik olarak getirir\n- İçeriği hızla yeniden bulmak için yapay zeka etiketleme, özetleme, OCR ve tam metin aramayı kullanır\n- İçeriği etiketler, ortak listeler, RSS akışları ve kural tabanlı iş akışlarıyla düzenler\n- Koleksiyona web uygulaması, mobil uygulamalar, tarayıcı eklentileri, REST API ve CLI üzerinden erişim sağlar\n\n**Daha Fazla Bilgi:**\n- [Karakeep Resmi Web Sitesi](https://karakeep.app/)\n- [Karakeep GitHub](https://github.com/karakeep-app/karakeep)\n- [Karakeep Dokümantasyonu](https://docs.karakeep.app/)"
  uk: "Karakeep — це менеджер закладок з відкритим кодом для власного сервера. Зберігає посилання, нотатки, зображення, PDF і виділені фрагменти. Усе, що ви хочете зберегти, лежить в одному місці. Він сам підтягує заголовки, описи й попередній перегляд, а впорядковувати бібліотеку допомагають ШІ-теги, повнотекстовий пошук, списки та автоматизація за правилами. Завдяки розширенням для браузерів, мобільним застосункам, імпорту RSS і архівуванню сторінок Karakeep підходить і як інструмент «прочитати пізніше», і як надійний особистий архів.\n\n**Основні можливості:**\n- Зберігайте посилання, нотатки, зображення, PDF і виділені фрагменти тексту в одній бібліотеці\n- Автоматично отримуйте заголовки, описи, зображення й архівовані сторінки для читання пізніше\n- Швидко знаходьте потрібне завдяки ШІ-тегам, підсумкам, OCR і повнотекстовому пошуку\n- Упорядковуйте вміст за допомогою тегів, спільних списків, RSS-стрічок і автоматизації за правилами\n- Користуйтеся збіркою через вебзастосунок, мобільні застосунки, розширення для браузерів, REST API і CLI\n\n**Докладніше:**\n- [Офіційний сайт Karakeep](https://karakeep.app/)\n- [Karakeep на GitHub](https://github.com/karakeep-app/karakeep)\n- [Документація Karakeep](https://docs.karakeep.app/)"
notes:
  en: "Set `NEXTAUTH_URL` to the address you will use to access Karakeep. Use long random strings for `NEXTAUTH_SECRET` and `MEILI_MASTER_KEY`, and keep the `MEILI_MASTER_KEY` identical in both `karakeep` and `meilisearch`. The first user to sign up on your instance becomes the admin."
  it: "Imposta `NEXTAUTH_URL` con l'indirizzo che userai per accedere a Karakeep. Usa stringhe casuali lunghe per `NEXTAUTH_SECRET` e `MEILI_MASTER_KEY`, e mantieni `MEILI_MASTER_KEY` identico sia in `karakeep` sia in `meilisearch`. Il primo utente che si registra sulla tua istanza diventa amministratore."
  nb: "Sett `NEXTAUTH_URL` til adressen du vil bruke for å få tilgang til Karakeep. Bruk lange tilfeldige strenger for `NEXTAUTH_SECRET` og `MEILI_MASTER_KEY`, og behold samme `MEILI_MASTER_KEY` i både `karakeep` og `meilisearch`. Den første brukeren som registrerer seg på instansen din blir administrator."
  zh: "请将 `NEXTAUTH_URL` 设置为你实际访问 Karakeep 时使用的地址。 请为 `NEXTAUTH_SECRET` 和 `MEILI_MASTER_KEY` 使用足够长的随机字符串，并确保 `karakeep` 与 `meilisearch` 两个服务中的 `MEILI_MASTER_KEY` 保持一致。 你的实例中第一个注册的用户会成为管理员。"
  ja: "`NEXTAUTH_URL` は、Karakeep にアクセスするときに実際に使うアドレスへ設定してください。 `NEXTAUTH_SECRET` と `MEILI_MASTER_KEY` には十分に長いランダム文字列を使用し、`karakeep` と `meilisearch` の `MEILI_MASTER_KEY` は同じ値に保ってください。 このインスタンスで最初に登録したユーザーが管理者になります。"
  ko: "`NEXTAUTH_URL`은 Karakeep에 실제로 접속할 때 사용할 주소로 설정하세요. `NEXTAUTH_SECRET`와 `MEILI_MASTER_KEY`에는 충분히 긴 임의 문자열을 사용하고, `karakeep`과 `meilisearch` 두 서비스의 `MEILI_MASTER_KEY` 값은 같게 유지하세요. 인스턴스에 처음 가입하는 사용자가 관리자가 됩니다."
  fr: "Définissez `NEXTAUTH_URL` sur l'adresse que vous utiliserez pour accéder à Karakeep. Utilisez de longues chaînes aléatoires pour `NEXTAUTH_SECRET` et `MEILI_MASTER_KEY`, et gardez le même `MEILI_MASTER_KEY` dans `karakeep` et `meilisearch`. Le premier utilisateur qui s'inscrit sur votre instance devient administrateur."
  de: "Setzen Sie `NEXTAUTH_URL` auf die Adresse, unter der Sie Karakeep aufrufen werden. Verwenden Sie lange Zufallszeichenfolgen für `NEXTAUTH_SECRET` und `MEILI_MASTER_KEY`, und halten Sie `MEILI_MASTER_KEY` in `karakeep` und `meilisearch` identisch. Der erste Benutzer, der sich auf Ihrer Instanz registriert, wird Administrator."
  sv: "Sätt `NEXTAUTH_URL` till den adress du kommer att använda för att nå Karakeep. Använd långa slumpmässiga strängar för `NEXTAUTH_SECRET` och `MEILI_MASTER_KEY`, och behåll samma `MEILI_MASTER_KEY` i både `karakeep` och `meilisearch`. Den första användaren som registrerar sig på din instans blir administratör."
  el: "Ορίστε το `NEXTAUTH_URL` στη διεύθυνση που θα χρησιμοποιείτε για πρόσβαση στο Karakeep. Χρησιμοποιήστε μεγάλες τυχαίες συμβολοσειρές για τα `NEXTAUTH_SECRET` και `MEILI_MASTER_KEY`, και κρατήστε το `MEILI_MASTER_KEY` ίδιο στα `karakeep` και `meilisearch`. Ο πρώτος χρήστης που θα εγγραφεί στο instance σας γίνεται διαχειριστής."
  hr: "Postavite `NEXTAUTH_URL` na adresu koju ćete koristiti za pristup Karakeepu. Koristite duge nasumične nizove za `NEXTAUTH_SECRET` i `MEILI_MASTER_KEY`, a `MEILI_MASTER_KEY` neka bude isti u servisima `karakeep` i `meilisearch`. Prvi korisnik koji se registrira na vašoj instanci postaje administrator."
  pt: "Defina `NEXTAUTH_URL` para o endereço que vai usar para aceder ao Karakeep. Use cadeias aleatórias longas para `NEXTAUTH_SECRET` e `MEILI_MASTER_KEY`, e mantenha o mesmo `MEILI_MASTER_KEY` em `karakeep` e `meilisearch`. O primeiro utilizador a registar-se na sua instância torna-se administrador."
  ru: "Установите `NEXTAUTH_URL` в адрес, который вы будете использовать для доступа к Karakeep. Используйте длинные случайные строки для `NEXTAUTH_SECRET` и `MEILI_MASTER_KEY`, и сохраняйте одинаковое значение `MEILI_MASTER_KEY` в `karakeep` и `meilisearch`. Первый пользователь, зарегистрировавшийся в вашем экземпляре, становится администратором."
  tr: "`NEXTAUTH_URL` değerini, Karakeep'e erişmek için kullanacağınız adrese ayarlayın. `NEXTAUTH_SECRET` ve `MEILI_MASTER_KEY` için uzun rastgele dizeler kullanın ve `MEILI_MASTER_KEY` değerini hem `karakeep` hem de `meilisearch` hizmetlerinde aynı tutun. Örneğinizde kaydolan ilk kullanıcı yönetici olur."
  uk: "Вкажіть у `NEXTAUTH_URL` адресу, за якою ви відкриватимете Karakeep. Для `NEXTAUTH_SECRET` і `MEILI_MASTER_KEY` використайте довгі випадкові рядки, а `MEILI_MASTER_KEY` має бути однаковим у `karakeep` і `meilisearch`. Перший користувач, який зареєструється у вашому екземплярі, стає адміністратором."
