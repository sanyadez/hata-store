# Apache-2.0, changed for Hata Store: see NOTICE
services:
  pocketbase:
    image: argonptg/pocketbase:0.26.6
    deploy:
      resources:
        limits:
          memory: 1024M
    ports:
      - "${WEB_PORT:-8090}:8090"
    restart: always
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/pb_data"
        target: /pb_data
