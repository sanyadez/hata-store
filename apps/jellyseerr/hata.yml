title: Jellyseerr
tagline:
  en: Jellyseerr is a free and open source software application for managing requests for your media library.
  uk: Jellyseerr — безкоштовний застосунок з відкритим кодом для керування запитами до вашої медіатеки.
description:
  en: "Jellyseerr is a self-hosted media request and management tool designed to streamline media library request and discovery processes, offering an intuitive Web interface, ideal for home media server users and small teams. It seamlessly integrates with existing media services, enabling efficient management of movies, shows, and mixed content libraries.\n\nThe tool's core features include a customizable request system and broad media server integration. It allows users to request movies or individual show seasons through a user-friendly interface, with administrators able to approve requests via a simple management UI. It integrates with Jellyfin, Emby, and Plex, supporting user import and authentication with existing accounts. Diverse notification channels (e.g., Discord, Telegram, Email) provide real-time request status updates, and library scanning tracks available media to prevent duplicate requests.\n\nIt offers a granular permission system, enabling precise control over user access and actions. The mobile-friendly design facilitates on-the-go request approvals, while watchlist and blacklist support help users filter content. Support for PostgreSQL and SQLite databases ensures flexible deployment options. Community support via GitHub and Discord provides documentation and assistance, delivering a modern media management solution with intuitive operation and high flexibility.\n\n**Key Features:**\n- Full Jellyfin/Emby/Plex integration including authentication with user import & management.\n- Support for PostgreSQL and SQLite databases.\n- Supports Movies, Shows and Mixed Libraries.\n- Ability to change email addresses for SMTP purposes.\n- Easy integration with your existing services. Currently, Jellyseerr supports Sonarr and Radarr.\n- Jellyfin/Emby/Plex library scan, to keep track of the titles which are already available.\n- Customizable request system, which allows users to request individual seasons or movies in a friendly, easy-to-use interface.\n- Incredibly simple request management UI. Don't dig through the app to simply approve recent requests!\n- Granular permission system.\n- Support for various notification agents.\n- Mobile-friendly design, for when you need to approve requests on the go!\n- Support for watchlisting & blacklisting media.\n\n**Learn More:**\n- [Jellyseerr Documentation](https://docs.jellyseerr.dev/)\n- [Jellyseerr GitHub Repository](https://github.com/Fallenbagel/jellyseerr)"
  uk: "Jellyseerr — це інструмент для запитів і керування медіа на власному сервері, який спрощує пошук і замовлення контенту в медіатеці. Має зрозумілий вебінтерфейс і підійде користувачам домашнього медіасервера та невеликим командам. Він легко поєднується з наявними медіасервісами та допомагає керувати фільмами, серіалами і змішаними бібліотеками.\n\nОсновні можливості — настроювана система запитів і широка інтеграція з медіасерверами. Користувачі можуть замовляти фільми або окремі сезони серіалів у зручному інтерфейсі, а адміністратори схвалюють запити в простому інтерфейсі керування. Підтримуються Jellyfin, Emby і Plex: можна імпортувати користувачів і входити з наявними обліковими записами. Різні канали сповіщень (Discord, Telegram, електронна пошта тощо) одразу повідомляють про стан запиту, а сканування бібліотеки відстежує вже наявні матеріали, щоб не створювати дублікати.\n\nДоступна детальна система дозволів, яка точно визначає, що кому можна. Зручний на телефоні дизайн дає змогу схвалювати запити будь-де, а списки перегляду і чорний список допомагають відфільтрувати контент. Підтримка PostgreSQL і SQLite робить розгортання гнучким. Документацію та допомогу можна знайти в спільноті на GitHub і Discord. Це сучасне рішення для керування медіа: просте у використанні й гнучке.\n\n**Основні можливості:**\n- Повна інтеграція з Jellyfin/Emby/Plex, зокрема вхід та імпорт користувачів і керування ними.\n- Підтримка баз даних PostgreSQL і SQLite.\n- Підтримка фільмів, серіалів і змішаних бібліотек.\n- Можливість змінювати адреси електронної пошти для SMTP.\n- Проста інтеграція з вашими сервісами. Наразі Jellyseerr підтримує Sonarr і Radarr.\n- Сканування бібліотеки Jellyfin/Emby/Plex, щоб знати, які назви вже є.\n- Настроювана система запитів: користувачі можуть замовляти окремі сезони чи фільми в зручному і простому інтерфейсі.\n- Неймовірно простий інтерфейс керування запитами. Не треба нічого шукати по застосунку, щоб схвалити останні запити!\n- Детальна система дозволів.\n- Підтримка різних агентів сповіщень.\n- Дизайн, зручний на телефоні, — щоб схвалювати запити в дорозі!\n- Підтримка списків перегляду і чорного списку для медіа.\n\n**Докладніше:**\n- [Документація Jellyseerr](https://docs.jellyseerr.dev/)\n- [Репозиторій Jellyseerr на GitHub](https://github.com/Fallenbagel/jellyseerr)"
