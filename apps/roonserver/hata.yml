title:
  en: Roon Server
  de: Roon Server
  es: Roon Server
  fr: Roon Server
  ja: Roon Server
  ko: Roon Server
  zh: Roon Server
tagline:
  en: Music software that transforms your listening experience
  de: "Musiksoftware, die Ihr Hörerlebnis verändert"
  es: Software musical que transforma tu experiencia auditiva
  fr: "Un logiciel musical qui transforme votre expérience d'écoute"
  ja: 音楽体験を変える音楽ソフトウェア
  ko: 음악 감상 경험을 바꾸는 음악 소프트웨어
  zh: 改变音乐聆听体验的音乐软件
  uk: "Музичне програмне забезпечення, що змінює те, як ви слухаєте музику"
description:
  en: "Roon music software transforms your listening experience with rich metadata, discovery features, and audiophile sound. It works with streaming services and local files.\n\nRoon brings all your music together and adds bios, reviews, photos, lyrics, tour dates, and cross-linked credits for performers, songwriters, producers, engineers, and composers. Everything about music - browsing, discovery, collecting, and listening - is more engaging with Roon.\n\nRoonServer is the central server component. It runs on a Linux amd64/x86_64 host, stores the Roon database and settings, and serves your library to Roon Remote clients and audio endpoints on your local network. It is controlled from the Roon app and does not provide a browser-based WebUI."
  zh: "Roon 音乐软件通过丰富的元数据、发现功能和发烧级音质改变您的聆听体验，同时支持流媒体服务和本地文件。\n\nRoon 将您的所有音乐集中在一起，并补充艺术家简介、评论、照片、歌词、巡演日期，以及演奏者、词曲作者、制作人、工程师和作曲家的交叉关联信息。音乐浏览、发现、收藏和聆听都因此更加精彩。\n\nRoonServer 是中央服务器组件，运行于 Linux amd64/x86_64 主机，保存 Roon 数据库和设置，并向局域网中的 Roon Remote 客户端和音频终端提供音乐库。它由 Roon 应用管理，不提供基于浏览器的 WebUI。"
  de: "Roon ist Musiksoftware mit umfangreichen Metadaten, Entdeckungsfunktionen und audiophiler Klangqualität. Sie funktioniert mit Streaming-Diensten und lokalen Dateien. RoonServer ist die zentrale Serverkomponente für Ihre Bibliothek und wird über die Roon-App gesteuert; eine browserbasierte WebUI gibt es nicht."
  es: "Roon es un software musical con metadatos enriquecidos, funciones de descubrimiento y sonido para audiófilos. Funciona con servicios de streaming y archivos locales. RoonServer es el componente central de tu biblioteca y se controla desde la aplicación Roon; no ofrece WebUI."
  fr: "Roon est un logiciel musical avec des métadonnées riches, des fonctions de découverte et un son audiophile. Il fonctionne avec les services de streaming et les fichiers locaux. RoonServer est le composant central de votre bibliothèque et se contrôle depuis l'application Roon ; il ne fournit pas de WebUI."
  ja: Roonは豊富なメタデータ、音楽発見機能、オーディオファイル向けの音質を備え、ストリーミングサービスとローカルファイルに対応します。RoonServerはライブラリの中央サーバーで、Roonアプリから操作し、ブラウザ用WebUIはありません。
  ko: "Roon은 풍부한 메타데이터, 음악 발견 기능, 오디오파일 수준의 음질을 제공하며 스트리밍 서비스와 로컬 파일을 지원합니다. RoonServer는 라이브러리의 중앙 서버로 Roon 앱에서 제어하며 브라우저 WebUI는 제공하지 않습니다."
  uk: "Музичне програмне забезпечення Roon змінює те, як ви слухаєте музику: багаті метадані, можливості відкриття нового та якісний звук для аудіофілів. Воно працює зі стрімінговими сервісами й локальними файлами.\n\nRoon збирає всю вашу музику докупи й додає біографії, рецензії, фото, тексти пісень, дати турів та взаємопов'язані відомості про виконавців, авторів пісень, продюсерів, звукорежисерів і композиторів. З Roon усе, що пов'язане з музикою, — перегляд, відкриття нового, колекціонування й прослуховування — стає цікавішим.\n\nRoonServer — головна серверна складова. Вона працює на хості Linux amd64/x86_64, зберігає базу даних і налаштування Roon та віддає вашу бібліотеку клієнтам Roon Remote і аудіопристроям у вашій локальній мережі. Керувати нею потрібно із застосунку Roon, вебінтерфейсу в браузері вона не має."
notes:
  en: "RoonServer has no WebUI. After installation, use the Roon app on a device on the same LAN to discover and configure this server."
  de: "RoonServer verfügt über keine WebUI. Verwenden Sie nach der Installation die Roon-App im selben LAN, um den Server zu finden und zu konfigurieren."
  es: "RoonServer no tiene WebUI. Después de la instalación, usa la aplicación Roon en un dispositivo de la misma LAN para descubrir y configurar este servidor."
  fr: "RoonServer ne possède pas de WebUI. Après l'installation, utilisez l'application Roon sur un appareil du même réseau local pour découvrir et configurer ce serveur."
  ja: RoonServerにはWebUIがありません。インストール後、同じLAN上の端末でRoonアプリを使用してサーバーを検出・設定してください。
  ko: RoonServer에는 WebUI가 없습니다. 설치 후 같은 LAN의 기기에서 Roon 앱으로 서버를 검색하고 설정하세요.
  zh: RoonServer 没有 WebUI。安装后，请在同一局域网内的手机、平板、电脑或其他 Roon Remote 设备上使用 Roon 应用发现并配置此服务器。
  uk: "RoonServer не має вебінтерфейсу. Після встановлення скористайтеся застосунком Roon на пристрої в тій самій локальній мережі, щоб знайти й налаштувати цей сервер."
