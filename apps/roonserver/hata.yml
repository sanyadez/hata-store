# Apache-2.0, changed for Hata Store: see NOTICE
title: Roon Server
tagline:
  en: Music software that transforms your listening experience
  uk: "Музичне програмне забезпечення, що змінює те, як ви слухаєте музику"
description:
  en: "Roon music software transforms your listening experience with rich metadata, discovery features, and audiophile sound. It works with streaming services and local files.\n\nRoon brings all your music together and adds bios, reviews, photos, lyrics, tour dates, and cross-linked credits for performers, songwriters, producers, engineers, and composers. Everything about music - browsing, discovery, collecting, and listening - is more engaging with Roon.\n\nRoonServer is the central server component. It runs on a Linux amd64/x86_64 host, stores the Roon database and settings, and serves your library to Roon Remote clients and audio endpoints on your local network. It is controlled from the Roon app and does not provide a browser-based WebUI."
  uk: "Музичне програмне забезпечення Roon змінює те, як ви слухаєте музику: багаті метадані, можливості відкриття нового та якісний звук для аудіофілів. Воно працює зі стрімінговими сервісами й локальними файлами.\n\nRoon збирає всю вашу музику докупи й додає біографії, рецензії, фото, тексти пісень, дати турів та взаємопов'язані відомості про виконавців, авторів пісень, продюсерів, звукорежисерів і композиторів. З Roon усе, що пов'язане з музикою, — перегляд, відкриття нового, колекціонування й прослуховування — стає цікавішим.\n\nRoonServer — головна серверна складова. Вона працює на хості Linux amd64/x86_64, зберігає базу даних і налаштування Roon та віддає вашу бібліотеку клієнтам Roon Remote і аудіопристроям у вашій локальній мережі. Керувати нею потрібно із застосунку Roon, вебінтерфейсу в браузері вона не має."
notes:
  en: "RoonServer has no WebUI. After installation, use the Roon app on a device on the same LAN to discover and configure this server."
  uk: "RoonServer не має вебінтерфейсу. Після встановлення скористайтеся застосунком Roon на пристрої в тій самій локальній мережі, щоб знайти й налаштувати цей сервер."
category: media
developer: Roon Labs
website: https://roon.app
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
settings:
  - name: MUSIC_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Music"
    label:
      en: Media/Music
      uk: Медіа/Музика
    hint:
      en: Inside the app it is /Music
      uk: У застосунку вона — /Music
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
  devices:
    en: "It uses devices of the server: /dev/snd, /dev/bus/usb, /dev/dri"
    uk: "Він користується пристроями сервера: /dev/snd, /dev/bus/usb, /dev/dri"
  capabilities:
    en: "It asks for extra rights of the system: SYS_ADMIN, DAC_READ_SEARCH"
    uk: "Він просить додаткових прав у системі: SYS_ADMIN, DAC_READ_SEARCH"
  host-files:
    en: "It reaches these places of the system: /run/udev"
    uk: "Він має доступ до цих місць системи: /run/udev"
