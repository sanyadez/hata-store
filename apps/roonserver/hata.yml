permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
  devices:
    en: "It uses devices of the server: /dev/snd, /dev/bus/usb, /dev/dri"
    uk: "Він користується пристроями сервера: /dev/snd, /dev/bus/usb, /dev/dri"
  capabilities:
    en: "It asks for extra rights of the system: SYS_ADMIN, DAC_READ_SEARCH"
    uk: "Він просить додаткових прав у системі: SYS_ADMIN, DAC_READ_SEARCH"
  host-files:
    en: "It reaches these places of the system: /run/udev"
    uk: "Він має доступ до цих місць системи: /run/udev"
