# Apache-2.0, changed for Hata Store: see NOTICE
services:
  jackett:
    environment:
      AUTO_UPDATE: "true"
      PGID: "1000"
      PUID: "1000"
      TZ: "${TZ:-UTC}"
    image: linuxserver/jackett:0.24.2910
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-9117}:9117"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
