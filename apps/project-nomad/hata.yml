web:
  service: admin
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: URL
    type: text
    default: http://localhost:8080
    label:
      en: "Public URL used to access NOMAD, including the web port"
      zh: 访问 NOMAD 的完整地址，包含 Web 端口
      uk: "Публічна адреса для доступу до NOMAD, разом із портом вебінтерфейсу"
  - name: APP_KEY
    type: secret
    length: 33
    label:
      en: App key
      uk: Ключ застосунку
  - name: DB_PASSWORD
    type: secret
    label:
      en: Password between its services
      uk: Пароль між його сервісами
  - name: MYSQL_ROOT_PASSWORD
    type: secret
    label:
      en: MYSQL_ROOT_PASSWORD
  - name: DOZZLE_PORT_8080
    type: port
    default: 9999
    label:
      en: Port 8080
      uk: Порт 8080
    advanced: true
permissions:
  docker:
    en: "It controls the server's Docker: it sees and manages the containers"
    uk: "Він керує Docker сервера: бачить контейнери й керує ними"
  host-files:
    en: "It reaches these places of the system: /"
    uk: "Він має доступ до цих місць системи: /"
