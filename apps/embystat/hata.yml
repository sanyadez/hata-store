# Apache-2.0, changed for Hata Store: see NOTICE
title: Embystat
tagline:
  en: Calculate all kinds of statistics from your (local) Emby or Jellyfin server
  uk: Різноманітна статистика з вашого (локального) сервера Emby або Jellyfin
description:
  en: "EmbyStat is a personal web server that can calculate all kinds of statistics from your (local) Emby or Jellyfin server. Just install this on your server and let him calculate all kinds of fun stuff. This project is still in Alpha phase, but feel free to pull in on your computer and test it out yourself. When the time is right I will host a full informational website/release for common platforms and Wiki pages."
  uk: "EmbyStat — особистий вебсервер, що збирає різноманітну статистику з вашого (локального) сервера Emby або Jellyfin. Просто встановіть його на сервер і дайте йому порахувати всілякі цікаві речі. Проєкт ще на стадії альфа, але ви можете спробувати його на своєму комп’ютері. Коли прийде час, я запущу повноцінний інформаційний сайт, випуски для поширених платформ і сторінки Wiki."
category: media
developer: Embystart Team
website: https://github.com/mregni/EmbyStat
source: https://github.com/mregni/EmbyStat
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: embystat
  port: 6555
settings:
