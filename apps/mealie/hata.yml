title: Mealie
tagline:
  en: The family cookbook, meal plans and shopping lists
  uk: Родинна кулінарна книга, меню на тиждень і списки покупок
description:
  en: >
    A home for your recipes. Paste a link and Mealie takes the recipe off the page — without the
    life story above it; plan the week's meals, and the shopping list makes itself from them. Every
    member of the household has an account, and recipes scale to any number of servings.
  uk: >
    Дім для ваших рецептів. Вставте посилання, і Mealie забере рецепт зі сторінки — без довгої
    передмови над ним; сплануйте страви на тиждень, і список покупок складеться сам. Кожен у родині
    має свій обліковий запис, а рецепти перераховуються на будь-яку кількість порцій.
notes:
  en: >
    The first sign-in is **changeme@example.com** with the password **MyPassword**; change both at once.
  uk: >
    Перший вхід — **changeme@example.com** з паролем **MyPassword**; одразу змініть обидва.
category: productivity
developer: Mealie
website: https://mealie.io
source: https://github.com/mealie-recipes/mealie
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
web:
  service: mealie
  port: 9000
settings:
  - name: WEB_PORT
    type: port
    default: 9925
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ALLOW_SIGNUP
    type: switch
    default: false
    label: { en: Anyone may sign up, uk: Будь-хто може зареєструватися }
    hint:
      en: When off, new people join by an invitation link
      uk: Коли вимкнено, нові люди приходять за посиланням-запрошенням
