services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-9925}:9000
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ${APP_DATA:-.}/data:/app/data
    environment:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      BASE_URL: ${APP_URL:-http://localhost:9925}
