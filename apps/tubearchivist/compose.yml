services:
  tubearchivist:
    image: bbilly1/tubearchivist:v0.5.12
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-8000}:8000
    volumes:
      - ${MEDIA:-./youtube}:/youtube
      - ${APP_DATA:-.}/cache:/cache
    environment:
      ES_URL: http://archivist-es:9200
      REDIS_CON: redis://archivist-redis:6379
      HOST_UID: ${PUID:-1000}
      HOST_GID: ${PGID:-1000}
      # the address the pages are opened at, with its scheme and port: requests from elsewhere are refused
      TA_HOST: ${APP_URL:-http://localhost:8000}
      TA_USERNAME: ${TA_USERNAME:-admin}
      TA_PASSWORD: ${TA_PASSWORD:?set TA_PASSWORD, the password to sign in with}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-es
      - archivist-redis

  archivist-redis:
    image: redis:8.10.2
    restart: unless-stopped
    volumes:
      - ${APP_DATA:-.}/redis:/data
    depends_on:
      - archivist-es

  archivist-es:
    image: bbilly1/tubearchivist-es:8.19.0
    restart: unless-stopped
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      discovery.type: single-node
      path.repo: /usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # Elasticsearch runs as the user 1000 and must own its folder
    volumes:
      - ${APP_DATA:-.}/es:/usr/share/elasticsearch/data
