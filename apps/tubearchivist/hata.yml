title: Tube Archivist
tagline:
  en: Your own YouTube archive, with search and a player
  uk: Власний архів YouTube, з пошуком і програвачем
description:
  en: >
    Subscribe to channels and playlists, and their videos are downloaded with titles,
    descriptions, comments and subtitles. Everything can be searched and watched in its own
    player, which remembers where you stopped, and stays with you when a video disappears from
    YouTube.
  uk: >
    Підпишіться на канали й списки відтворення, і їхні відео завантажуватимуться разом із назвами,
    описами, коментарями й субтитрами. Усе можна шукати й дивитися у власному програвачі, що
    пам'ятає, де ви зупинилися, і воно лишається у вас, навіть коли відео зникає з YouTube.
notes:
  en: >
    Its search engine (Elasticsearch) needs about 2 GB of memory and the server's setting
    `vm.max_map_count` of at least 262144; if it keeps stopping, set it with
    `sudo sysctl -w vm.max_map_count=262144` and in `/etc/sysctl.conf`. Elasticsearch comes for x86-64 only.
  uk: >
    Його пошуковий рушій (Elasticsearch) потребує близько 2 ГБ пам'яті й налаштування сервера
    `vm.max_map_count` щонайменше 262144; якщо він раз у раз зупиняється, задайте його командою
    `sudo sysctl -w vm.max_map_count=262144` і в `/etc/sysctl.conf`. Elasticsearch є лише для x86-64.
category: media
developer: Tube Archivist
website: https://www.tubearchivist.com
source: https://github.com/tubearchivist/tubearchivist
icon: data:image/png;base64,
web:
  service: tubearchivist
  port: 8000
settings:
  - name: WEB_PORT
    type: port
    default: 8000
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: MEDIA
    type: folder
    default: ${DATA_ROOT}/Media/YouTube
    label: { en: Video folder, uk: Тека для відео }
    hint:
      en: Where the downloaded videos are kept
      uk: Куди складаються завантажені відео
  - name: TA_USERNAME
    type: text
    default: admin
    required: true
    label: { en: User name, uk: Ім'я користувача }
  - name: TA_PASSWORD
    type: password
    required: true
    label: { en: Password, uk: Пароль }
    hint:
      en: For the first sign-in
      uk: Для першого входу
  - name: ELASTIC_PASSWORD
    type: secret
    label: { en: Search engine password, uk: Пароль пошукового рушія }
