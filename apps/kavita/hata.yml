title: Kavita
tagline:
  en: Kavita is a free and open source web based Comic and Book Server.
  uk: Kavita — безкоштовний вебсервер коміксів і книг з відкритим кодом.
description:
  en: "Kavita is a self-hosted digital library app designed for managing and reading comics, light novels, and e-books (supporting CBZ, CBR, EPUB, PDF, and more), offering a secure and convenient solution for personal reading collections. Its responsive Web interface allows users to access content effortlessly via any browser, with fullscreen reading and full localization support, ideal for comic and e-book enthusiasts building personalized digital libraries.\n\nThe app's core features include robust library management and an enhanced reading experience. Users can organize content with collections, reading lists, and custom tags, editing metadata to keep libraries neatly arranged. The built-in manga reader supports dual-page mode, Webtoon scrolling, and image splitting, while the e-book reader offers customizable fonts, spacing, and themes, with by-line progress syncing across devices. The PDF reader provides light/dark modes and diverse settings. It supports multi-user management, allowing custom permissions for sharing libraries or restricting content access, perfect for family or team use. Bulk imports and full-text search streamline large collection management.\n\nIt can be flexibly deployed on personal servers or NAS devices, with an active community providing extensive documentation to enhance functionality. Folder monitoring automatically detects file changes without manual scans, and sending content to Kindle or other devices improves cross-device access. Whether creating a personal reading hub or sharing media with others, the app's intuitive interface and high customizability deliver a modern management platform, meeting needs from casual reading to professional collections.\n\n**Key Features:**\n- Serve up Manga/Webtoons/Comics (cbr, cbz, zip/rar/rar5, 7zip, raw images) and Books (epub, pdf)\n- First class responsive readers that work great on any device (phone, tablet, desktop)\n- Customizable theming support: [Theme Repo](https://github.com/Kareadita/Themes) and [Documentation](https://wiki.kavitareader.com/guides/themes/)\n- External metadata integration and scrobbling for read status, ratings, and reviews (available via Kavita+)\n- Rich Metadata support with filtering and searching\n- Ways to group reading material: Collections, Reading Lists (CBL Import), Want to Read\n- Ability to manage users with rich Role-based management for age restrictions, abilities within the app, etc\n- Rich web readers supporting webtoon, continuous reading mode (continue without leaving the reader), virtual pages (epub), etc\n- Ability to customize your dashboard and side nav with smart filters, custom order and visibility toggles\n- Ability to download metadata (available via Kavita+)\n\n**Learn More:**\n- [Kavita Official Website](https://www.kavitareader.com)\n- [Kavita GitHub Repository](https://github.com/Kareadita/Kavita)"
  uk: "Kavita — це застосунок цифрової бібліотеки на власному сервері для керування та читання коміксів, ранобе й електронних книг (CBZ, CBR, EPUB, PDF та інші формати), безпечне й зручне рішення для особистих колекцій. Адаптивний вебінтерфейс відкривається в будь-якому браузері, підтримує читання на весь екран і повну локалізацію. Підійде всім, хто збирає власну цифрову бібліотеку коміксів і книг.\n\nОсновні можливості — потужне керування бібліотекою і зручне читання. Вміст можна впорядковувати за допомогою колекцій, списків читання та власних тегів, а метадані — редагувати, щоб бібліотека залишалася охайною. Вбудований рідер манґи підтримує режим двох сторінок, прокручування як у вебтунах і розрізання зображень, а рідер електронних книг пропонує настроювані шрифти, інтервали й теми та синхронізує прогрес до рядка між пристроями. Рідер PDF має світлий і темний режими та різні налаштування. Підтримується кілька користувачів із власними дозволами на спільний доступ до бібліотек або обмеження вмісту — зручно для родини чи команди. Масовий імпорт і повнотекстовий пошук полегшують роботу з великими колекціями.\n\nЗастосунок можна гнучко розгорнути на власному сервері або NAS, а активна спільнота пропонує докладну документацію. Стеження за теками саме помічає зміни файлів, без ручного сканування, а надсилання вмісту на Kindle чи інші пристрої полегшує доступ з різних пристроїв. Чи це особиста читальня, чи спільний доступ для інших — зрозумілий інтерфейс і висока настроюваність дають сучасну платформу керування, яка задовольнить потреби від розважального читання до серйозних колекцій.\n\n**Основні можливості:**\n- Роздає мангу, вебтуни та комікси (cbr, cbz, zip/rar/rar5, 7zip, звичайні зображення) і книги (epub, pdf)\n- Першокласні адаптивні рідери, які чудово працюють на будь-якому пристрої (телефон, планшет, комп'ютер)\n- Настроювані теми: [репозиторій тем](https://github.com/Kareadita/Themes) і [документація](https://wiki.kavitareader.com/guides/themes/)\n- Інтеграція із зовнішніми метаданими та скроблінг статусу читання, оцінок і відгуків (через Kavita+)\n- Багаті метадані з фільтрацією та пошуком\n- Способи групувати матеріали: колекції, списки читання (імпорт CBL), «Хочу прочитати»\n- Керування користувачами за ролями: вікові обмеження, можливості в застосунку тощо\n- Багаті вебрідери з підтримкою вебтунів, безперервного читання (без виходу з рідера), віртуальних сторінок (epub) тощо\n- Можна настроїти головну сторінку і бічну навігацію за допомогою розумних фільтрів, власного порядку та перемикачів видимості\n- Завантаження метаданих (через Kavita+)\n\n**Докладніше:**\n- [Офіційний сайт Kavita](https://www.kavitareader.com)\n- [Репозиторій Kavita на GitHub](https://github.com/Kareadita/Kavita)"
