# Apache-2.0, changed for Hata Store: see NOTICE
services:
  kavita:
    image: jvmilazz0/kavita:0.9.1
    deploy:
      resources:
        reservations:
          memory: 128M
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5150}:5000"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /kavita/config
      - type: bind
        source: "${MANGA_DIR:-./Media/Manga}"
        target: /manga
    environment:
      TZ: "${TZ:-UTC}"
