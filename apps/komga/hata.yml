title: Komga
tagline:
  en: "Komga is a media server for your comics, mangas, BDs, magazines and eBooks."
  uk: "Komga — медіасервер для ваших коміксів, манґи, BD, журналів та електронних книг."
description:
  en: "Komga is a self-hosted app designed for managing comics, manga, magazines, and e-books (supporting CBZ, CBR, PDF, and EPUB formats), offering a secure and convenient solution for personal media libraries. Its responsive Web interface enables users to access and manage content effortlessly via any browser, without complex local installations, ideal for comic and e-book enthusiasts.\n\nThe app's core features include versatile content organization and diverse reading options. Users can arrange their library with collections and reading lists, edit metadata for series or books, and keep content neatly organized. It integrates a built-in Web reader, supports Mihon SDK extensions, or connects with third-party OPDS readers, catering to varied reading preferences. Whether managing a personal comic collection or sharing e-books with family, it supports multi-user access and delivers a smooth browsing experience. Bulk import streamlines large media library management, perfect for efficient content organization.\n\nIt can be flexibly deployed on personal servers or NAS devices, with an active community providing support documentation, enabling users to extend functionality through community resources. Whether building a personal digital library or a private media-sharing hub, the app's intuitive interface and high customizability offer a secure, modern media management platform, meeting needs from casual reading to professional collections.\n\n**Key Features:**\n- Organize your library with collections and read lists\n- Edit metadata for your series and books\n- Import embedded metadata automatically\n- Webreader with multiple reading modes\n- Manage multiple users, with per-library access control, age restrictions, and labels restrictions\n- Offers a REST API, many community tools and scripts can interact with Komga\n- OPDS v1 and v2 support\n- Kobo Sync with your Kobo eReader\n- KOReader Sync\n- Download book files, whole series, or read lists\n- Duplicate files detection\n- Duplicate pages detection and removal\n- Import books from outside your libraries directly into your series folder\n- Import ComicRack cbl read lists\n\n**Learn More:**\n- [Komga Official Website](https://komga.org)\n- [Komga GitHub Repository](https://github.com/gotson/komga)"
  uk: "Komga — це застосунок для керування коміксами на власному сервері, манґою, журналами та електронними книгами (формати CBZ, CBR, PDF і EPUB), безпечне й зручне рішення для особистих медіатек. Адаптивний вебінтерфейс дає змогу переглядати вміст і керувати ним у будь-якому браузері, без складного встановлення на комп'ютер. Підійде всім, хто любить комікси та електронні книги.\n\nОсновні можливості — різноманітне впорядкування вмісту і різні способи читання. Бібліотеку можна розкласти за колекціями та списками читання, а метадані серій чи книг — редагувати, щоб усе було охайно. Є вбудований вебрідер, підтримка розширень Mihon SDK, а також підключення сторонніх рідерів OPDS — на будь-який смак. Чи це особиста колекція коміксів, чи електронні книги для родини, підтримується багатокористувацький доступ і зручний перегляд. Масовий імпорт полегшує роботу з великими медіатеками.\n\nЗастосунок можна гнучко розгорнути на власному сервері або NAS, а активна спільнота пропонує документацію, що допомагає розширювати можливості. Чи ви будуєте особисту цифрову бібліотеку, чи приватний осередок обміну медіа, зрозумілий інтерфейс і висока настроюваність дають безпечну сучасну платформу керування медіа, яка задовольнить потреби від розважального читання до серйозних колекцій.\n\n**Основні можливості:**\n- Впорядковуйте бібліотеку за допомогою колекцій і списків читання\n- Редагуйте метадані серій і книг\n- Автоматичний імпорт вбудованих метаданих\n- Вебрідер з кількома режимами читання\n- Кілька користувачів із доступом до окремих бібліотек, віковими обмеженнями та обмеженнями за мітками\n- Є REST API, тож з Komga можуть взаємодіяти численні інструменти та скрипти спільноти\n- Підтримка OPDS v1 і v2\n- Синхронізація Kobo з вашою читалкою Kobo\n- Синхронізація KOReader\n- Завантаження файлів книг, цілих серій або списків читання\n- Виявлення дублікатів файлів\n- Виявлення та видалення дублікатів сторінок\n- Імпорт книг ззовні бібліотек прямо в теку серії\n- Імпорт списків читання ComicRack у форматі cbl\n\n**Докладніше:**\n- [Офіційний сайт Komga](https://komga.org)\n- [Репозиторій Komga на GitHub](https://github.com/gotson/komga)"
