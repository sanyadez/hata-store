# Apache-2.0, changed for Hata Store: see NOTICE
services:
  komga:
    image: gotson/komga:1.29.1
    deploy:
      resources:
        reservations:
          memory: 128M
    ports:
      - "${WEB_PORT:-25600}:25600"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
    environment:
      PGID: "1000"
      PUID: "1000"
