# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  qbittorrent:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
      UMASK: "${UMASK:-002}"
    image: ghcr.io/hotio/qbittorrent:release-5.0.4
    deploy:
      resources:
        reservations:
          memory: 256M
    ports:
      - "${WEB_PORT:-8181}:8080"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${DATA_DIR:-./data}"
        target: /DATA
