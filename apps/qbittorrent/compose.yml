# Apache-2.0, changed for Hata Store: see NOTICE
services:
  # qBittorrent answers 401 to every request whose Host names a port other than the one it listens on inside,
  # which is what a published port looks like. This step, at every start, keeps that one check off and touches nothing else.
  allow-published-port:
    image: ghcr.io/hotio/qbittorrent:release-v5.3.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        f=/config/config/qBittorrent.conf
        mkdir -p /config/config
        if grep -q 'HostHeaderValidation=' "$$f" 2>/dev/null; then
          sed -i 's/HostHeaderValidation=.*/HostHeaderValidation=false/' "$$f"
        elif grep -q '^\[WebUI\]' "$$f" 2>/dev/null; then
          sed -i '/^\[WebUI\]/a HostHeaderValidation=false' "$$f"
        else
          printf '\n[WebUI]\nHostHeaderValidation=false\n' >> "$$f"
        fi
        chown -R "$${PUID}:$${PGID}" /config/config
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
    restart: "no"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
  qbittorrent:
    depends_on:
      allow-published-port:
        condition: service_completed_successfully
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
      UMASK: "${UMASK:-002}"
    image: ghcr.io/hotio/qbittorrent:release-v5.3.0
    deploy:
      resources:
        reservations:
          memory: 256M
    ports:
      - "${WEB_PORT:-8181}:8080"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${DATA_DIR:-./data}"
        target: /DATA
