# Apache-2.0, changed for Hata Store: see NOTICE
title: qBittorrent
tagline:
  en: P2P bittorrent download
  uk: Завантаження через торенти (P2P BitTorrent)
description:
  en: "**Elevate Your Home Media Experience**. qBittorrent transforms your home media setup with a polished interface reminiscent of µTorrent, minus the ads. Unlike traditional download tools, it offers a streamlined, efficient, and ad-free experience. This makes it a perfect fit for those seeking a hassle-free way to manage and enjoy their media collections at home.\n\n**Feature-Rich and User-Friendly**. With qBittorrent, you gain access to a well-integrated and extensible search engine, allowing simultaneous searches across multiple torrent sites, and category-specific searches for books, music, and software. Its support for RSS feeds with advanced filters, magnet links, encrypted connections, and more, ensures you have complete control over your downloads. Available on all major platforms and in around 70 languages, qBittorrent is both versatile and accessible."
  uk: "**Зручні домашні медіа**. qBittorrent оновлює ваші домашні медіа завдяки охайному інтерфейсу, схожому на µTorrent, але без реклами. На відміну від звичайних завантажувачів, він простий, ефективний і не показує реклами. Тому він ідеально підходить для тих, хто хоче без клопоту керувати своїми медіаколекціями вдома.\n\n**Багато можливостей і зручність**. У qBittorrent є добре інтегрований розширюваний пошук: можна одночасно шукати на багатьох торентових сайтах і за окремими категоріями — книги, музика, програми. Підтримка RSS-стрічок із розширеними фільтрами, magnet-посилань, шифрованих з’єднань та іншого дає вам повний контроль над завантаженнями. Застосунок доступний на всіх основних платформах приблизно 70 мовами, тож він і гнучкий, і зручний."
notes:
  en: "Default Account\n\n| Username | Password | |----------|----------| | `admin`    | Get from log |\n\nPasswords need to be viewed in the log\n\nDefault Accessible Path in qBittorrent\n\n| Name | Value | | ---- | ----- | | DATA Path | `/DATA` | | Downloads Path | `/DATA/Downloads` | | Media Path | `/DATA/Media` |"
  uk: "Обліковий запис за промовчанням\n\n| Ім'я користувача | Пароль | |----------|----------| | `admin`    | Дивіться в журналі |\n\nПароль потрібно подивитися в журналі\n\nТеки за промовчанням, доступні в qBittorrent\n\n| Назва | Значення | | ---- | ----- | | Тека DATA | `/DATA` | | Тека завантажень | `/DATA/Downloads` | | Тека медіа | `/DATA/Media` |"
category: media
developer: qBittorrent
website: https://www.qbittorrent.org
source: https://github.com/qbittorrent/qBittorrent
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: qbittorrent
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8181
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DATA_DIR
    type: folder
    default: "${DATA_ROOT}"
    label:
      en: Data folder
      uk: Тека даних
  - name: UMASK
    type: text
    default: "002"
    label:
      en: Run qBittorrent as specified UMASK
      uk: "UMASK, з яким запускати qBittorrent"
