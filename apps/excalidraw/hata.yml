title: Excalidraw
tagline:
  en: Virtual whiteboard for sketching hand-drawn like diagrams
  uk: "Віртуальна дошка для схем, схожих на намальовані від руки"
description:
  en: "Excalidraw is a virtual hand-drawn style whiteboard platform supporting infinite canvas and end-to-end encrypted collaboration. An intuitive interface offers a hand-drawn experience, ideal for brainstorming, design sketches, or educational scenarios, meeting diverse creative needs.\n\nCore features include an infinite canvas whiteboard and end-to-end encrypted collaboration. Hand-drawn style with shape library support allows creating rich graphics, enhanced by image insertion capabilities. Dark mode improves user experience, catering to diverse users.\n\nIt provides export options including PNG, SVG, and clipboard for easy content sharing. Drawing capabilities cover rectangle, circle, diamond, arrow, line, free-draw, and eraser, with arrow-binding and labeled arrow support. Undo, redo, zoom, and panning functionalities optimize operations. With creativity and security at the core, the platform delivers a modern whiteboard design solution.\n\n**Key Features:**\n- Infinite canvas whiteboard supporting hand-drawn style\n- Shape library support for creating rich graphics\n- Image insertion capability\n- Dark mode\n- Export to PNG, SVG, and clipboard\n- Open format - export drawings as an `.excalidraw` json file\n- Wide range of tools - rectangle, circle, diamond, arrow, line, free-draw, eraser...\n- Arrow-binding & labeled arrows\n- Undo and redo\n- Zoom and panning support\n\n**Learn More:**\n- [Excalidraw Official Website](https://excalidraw.com/)\n- [Excalidraw GitHub](https://github.com/excalidraw/excalidraw)"
  uk: "Excalidraw — віртуальна дошка в стилі малювання від руки з нескінченним полотном і наскрізно зашифрованою спільною роботою. Зрозумілий інтерфейс створює відчуття малювання від руки, що чудово підходить для мозкових штурмів, ескізів дизайну чи навчання.\n\nГоловні можливості — дошка з нескінченним полотном і наскрізно зашифрована спільна робота. Малювання в рукописному стилі та бібліотека фігур дозволяють створювати багату графіку, а вставлення зображень її доповнює. Темний режим робить користування зручнішим для різних людей.\n\nМожна експортувати в PNG, SVG або в буфер обміну, щоб легко поділитися результатом. Доступні прямокутник, коло, ромб, стрілка, лінія, вільне малювання та гумка, а також прив'язування стрілок і стрілки з підписами. Скасування, повторення, масштабування та переміщення полотна спрощують роботу. Завдяки творчості й безпеці Excalidraw — сучасне рішення для дошки з малюнками.\n\n**Основні можливості:**\n- Дошка з нескінченним полотном у стилі малювання від руки\n- Бібліотека фігур для створення багатої графіки\n- Вставлення зображень\n- Темний режим\n- Експорт у PNG, SVG і буфер обміну\n- Відкритий формат — малюнки можна експортувати як json-файл `.excalidraw`\n- Широкий набір інструментів: прямокутник, коло, ромб, стрілка, лінія, вільне малювання, гумка...\n- Прив'язування стрілок і стрілки з підписами\n- Скасування й повторення дій\n- Масштабування та переміщення полотна\n\n**Докладніше:**\n- [Офіційний сайт Excalidraw](https://excalidraw.com/)\n- [Excalidraw на GitHub](https://github.com/excalidraw/excalidraw)"
