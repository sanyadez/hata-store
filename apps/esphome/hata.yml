# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: ESPHome
tagline:
  en: Home Automation systems
  zh: 家庭自动化系统
  uk: Системи розумного дому
description:
  en: ESPHome is a system to control your microcontrollers by simple yet powerful configuration files and control them remotely through Home Automation systems.
  zh: ESPHome 是一个通过简单而强大的配置文件控制微控制器并通过家庭自动化系统远程控制它们的系统。
  uk: "ESPHome — система для керування мікроконтролерами за допомогою простих, але потужних файлів конфігурації, яку можна дистанційно контролювати через системи розумного дому."
category: home
developer: kd9lsv
website: https://esphome.io
source: https://github.com/esphome/esphome
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: esphome
  port: 6052
settings:
  - name: WEB_PORT
    type: port
    default: 6052
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: ESPHOME_DASHBOARD_USE_PING
    type: text
    default: "false"
    label:
      en: Ping IP addresses instead of mDNS
      zh: Ping IP 地址而不是 mDNS
      uk: Пінгувати IP-адреси замість mDNS
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
