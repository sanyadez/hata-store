# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:4.10.4
    restart: always
    environment:
      TZ: "${TZ:-UTC}"
    ports:
      - "${WEB_PORT:-8111}:8443"
      - "${PORT_8123:-8112}:8123"
      - "${PORT_19132:-19132}:19132/udp"
      - 25500-25600:25500-25600
    volumes:
      - "${APP_DATA:-.}/backups:/crafty/backups"
      - "${APP_DATA:-.}/logs:/crafty/logs"
      - "${APP_DATA:-.}/servers:/crafty/servers"
      - "${APP_DATA:-.}/config:/crafty/app/config"
      - "${APP_DATA:-.}/import:/crafty/import"
