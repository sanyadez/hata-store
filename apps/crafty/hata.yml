    type: port
    default: 8111
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_8123
    type: port
    default: 8112
    label:
      en: Port 8123
      uk: Порт 8123
    advanced: true
  - name: PORT_19132
    type: port
    default: 19132
    label:
      en: Minecraft Bedrock listening Port (UDP)
      zh: Minecraft Bedrock监听端口 (UDP)
      uk: Порт Minecraft Bedrock (UDP)
    advanced: true
