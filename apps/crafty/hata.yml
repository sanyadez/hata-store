# Apache-2.0, changed for Hata Store: see NOTICE
title: Crafty
tagline:
  en: Take control of your Minecraft servers.
  uk: Візьміть під контроль свої сервери Minecraft.
description:
  en: "Crafty is an open source Minecraft control panel built using Tornado and AdminLTE, featuring server scheduling, a interactive console and the ability to run almost any type of Minecraft server"
  uk: "Crafty — панель керування серверами Minecraft з відкритим кодом, створена на Tornado та AdminLTE. Вона вміє запускати завдання за розкладом, має інтерактивну консоль і здатна керувати майже будь-яким типом сервера Minecraft."
notes:
  en: "Default Account | Username | Password | |----------|----------| | `admin`    | `app/config/default-creds.txt` |"
  uk: "Обліковий запис за замовчуванням | Ім’я користувача | Пароль | |----------|----------| | `admin`    | `app/config/default-creds.txt` |"
category: media
developer: Crafty Team
website: https://craftycontrol.com
source: https://gitlab.com/crafty-controller/crafty-4
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
  - 6.webp
  - 7.webp
web:
  service: crafty
  port: 8443
  path: /panel
  scheme: https
settings:
  - name: WEB_PORT
    type: port
    default: 8111
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_8123
    type: port
    default: 8112
    label:
      en: Port 8123
      uk: Порт 8123
    advanced: true
  - name: PORT_19132
    type: port
    default: 19132
    label:
      en: Minecraft Bedrock listening Port (UDP)
      uk: Порт Minecraft Bedrock (UDP)
    advanced: true
