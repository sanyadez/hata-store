title: Radicale
tagline:
  en: Calendars, contacts and to-do lists, synced across your devices
  uk: Календарі, контакти й списки справ, синхронізовані між пристроями
description:
  en: >
    A small CalDAV and CardDAV server. Phones, tablets and computers keep their calendars, address
    books and tasks in it instead of somebody's cloud: Thunderbird, DAVx⁵ on Android and the built-in
    apps of iPhone and macOS connect to it directly.
  uk: >
    Невеликий сервер CalDAV і CardDAV. Телефони, планшети й комп'ютери тримають у ньому календарі,
    адресні книги й завдання замість чиєїсь хмари: Thunderbird, DAVx⁵ на Android і вбудовані
    програми iPhone та macOS під'єднуються до нього напряму.
notes:
  en: >
    Sign in with the name and password you set here. More people are added from the app's terminal:
    `htpasswd -B /var/lib/radicale/users <name>`.
  uk: >
    Входьте з ім'ям і паролем, які задасте тут. Інших людей додають у терміналі застосунку:
    `htpasswd -B /var/lib/radicale/users <ім'я>`.
category: productivity
developer: Kozea
website: https://radicale.org
source: https://github.com/Kozea/Radicale
icon: data:image/svg+xml;base64,
web:
  service: radicale
  port: 5232
settings:
  - name: WEB_PORT
    type: port
    default: 5232
    label: { en: Port, uk: Порт }
  - name: RADICALE_USER
    type: text
    default: radicale
    required: true
    label: { en: User name, uk: Ім'я користувача }
    hint:
      en: Latin letters and digits
      uk: Латинські літери й цифри
  - name: RADICALE_PASSWORD
    type: password
    required: true
    label: { en: Password, uk: Пароль }
