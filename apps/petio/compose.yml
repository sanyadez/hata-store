# Apache-2.0, changed for Hata Store: see NOTICE
services:
  petio:
    image: ghcr.io/petio-team/petio@sha256:1c5a9276a844f4284601cbe332905864950545ebdeaad74bacb9097ea4f4b333
    restart: unless-stopped
    networks:
      - petio-network
    depends_on:
      - mongo
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${WEB_PORT:-7777}:7777"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /app/api/config
      - type: bind
        source: "${APP_DATA:-.}/logs"
        target: /app/logs
  mongo:
    image: mongo:4.4.22
    restart: unless-stopped
    hostname: mongo
    networks:
      - petio-network
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
networks:
  petio-network:
    driver: bridge
