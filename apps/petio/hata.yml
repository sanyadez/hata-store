title: Petio
tagline:
  en: "A third party companion app available to Plex server owners to allow their users to request, review and discover…"
  uk: "Супутник сервера Plex: користувачі просять фільми й серіали, лишають відгуки та знаходять нове."
description:
  en: "Petio is a third party companion app available to Plex server owners to allow their users to request, review and discover content. The app is built to appear instantly familiar and intuitive to even the most tech-agnostic users. Petio will help you manage requests from your users, connect to other third party apps such as Sonarr and Radarr, notify users when content is available and track request progress. Petio also allows users to discover media both on and off your server, quickly and easily find related content and review to leave their opinion for other users.\n\nPetio is an ongoing, forever free, always evolving project currently in alpha prototype stage and now available!"
  uk: "Petio — сторонній супутній застосунок для власників серверів Plex, у якому їхні користувачі можуть надсилати запити, писати відгуки та знаходити контент. Застосунок задуманий так, щоб бути інтуїтивно зрозумілим навіть тим, хто далекий від технологій. Petio допомагає керувати запитами користувачів, підключається до сторонніх застосунків, як-от Sonarr і Radarr, сповіщає користувачів, коли контент стає доступним, і показує перебіг виконання запитів. Також Petio дає змогу відкривати для себе медіа як на вашому сервері, так і поза ним, швидко й легко знаходити схожий контент і залишати відгуки, щоб поділитися враженнями з іншими користувачами.\n\nPetio — це проєкт, який постійно розвивається, завжди залишатиметься безкоштовним і зараз доступний на стадії альфа-прототипу."
