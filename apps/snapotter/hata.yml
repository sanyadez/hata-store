# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: SnapOtter
tagline:
  en: "Self-hosted file toolkit for images, video, audio, PDFs, and files"
  uk: "Власний набір інструментів для зображень, відео, аудіо, PDF та файлів"
description:
  en: "SnapOtter is an open-source, self-hosted file manipulation suite with 200+ tools across images, video, audio, PDFs, and files. It includes batch processing, reusable pipelines, local AI tools, a browser image editor, and a REST API so files stay on your own server.\n\nDefault login is admin / admin. SnapOtter asks you to change the default password after first login."
  uk: "SnapOtter — відкритий власний набір для роботи з файлами, що має понад 200 інструментів для зображень, відео, аудіо, PDF та інших файлів. У ньому є пакетна обробка, повторно використовувані конвеєри, локальні інструменти ШІ, редактор зображень у браузері та REST API, тож файли лишаються на вашому сервері.\n\nЛогін за промовчанням — admin / admin. Після першого входу SnapOtter попросить змінити пароль за промовчанням."
notes:
  en: "Default login is admin / admin. You will be asked to change the password after first login.\n\nThis package uses SnapOtter embedded mode, so leave DATABASE_URL and REDIS_URL unset unless you are moving to the upstream multi-container PostgreSQL and Redis stack."
  uk: "Логін за промовчанням — admin / admin. Після першого входу вас попросять змінити пароль.\n\nЦей пакет використовує вбудований режим SnapOtter, тому не задавайте DATABASE_URL і REDIS_URL, якщо не переходите на багатоконтейнерний стек PostgreSQL і Redis від розробників."
category: productivity
developer: SnapOtter
website: https://snapotter.com
source: https://github.com/snapotter-hq/SnapOtter
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
web:
  service: snapotter
  port: 1349
settings:
  - name: WEB_PORT
    type: port
    default: 1349
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: AUTH_ENABLED
    type: text
    default: "true"
    label:
      en: Require login before using SnapOtter
      uk: Вимагати вхід перед використанням SnapOtter
  - name: DEFAULT_USERNAME
    type: text
    default: admin
    label:
      en: "Initial administrator username, used only on first run"
      uk: "Початкове ім'я адміністратора, використовується лише при першому запуску"
  - name: DEFAULT_PASSWORD
    type: password
    required: true
    label:
      en: "Initial administrator password, change after first login"
      uk: "Початковий пароль адміністратора, змініть після першого входу"
  - name: MAX_UPLOAD_SIZE_MB
    type: text
    default: "0"
    label:
      en: "Maximum upload size in MB, set to 0 for unlimited"
      uk: "Максимальний розмір завантаження в МБ, 0 — без обмежень"
  - name: MAX_BATCH_SIZE
    type: text
    default: "0"
    label:
      en: "Maximum files per batch, set to 0 for unlimited"
      uk: "Максимум файлів у пакеті, 0 — без обмежень"
  - name: CONCURRENT_JOBS
    type: text
    default: "0"
    label:
      en: "Number of concurrent jobs, set to 0 to auto-detect"
      uk: "Кількість одночасних завдань, 0 — визначити автоматично"
  - name: REDIS_MAXMEMORY
    type: text
    default: 512mb
    label:
      en: Memory cap for embedded Redis
      uk: "Ліміт пам'яті для вбудованого Redis"
