title: Oksskolten
tagline:
  en: A feed reader that brings every article in full, with search and AI summaries
  uk: Читалка RSS, що завантажує кожну статтю повністю, з пошуком і підсумками від ШІ
description:
  en: >
    Oksskolten follows your RSS and Atom feeds and, for every new post, fetches the article itself from
    the site, cleans it of ads and menus and keeps it as text, so you read whole articles without leaving
    the app. Everything is found by full-text search. With a key of Anthropic, Gemini or OpenAI (or a
    model of your own through Ollama) it summarises and translates articles and answers questions about
    your feeds in a chat. It has passkeys, offline reading on the phone and 14 colour themes.
  uk: >
    Oksskolten стежить за вашими стрічками RSS і Atom і для кожного нового допису сам завантажує статтю
    з сайту, очищує її від реклами й меню та зберігає як текст, тож статті читаються повністю, не
    виходячи із застосунку. Усе знаходить повнотекстовий пошук. З ключем Anthropic, Gemini чи OpenAI
    (або власною моделлю через Ollama) він підсумовує й перекладає статті та відповідає в чаті на
    запитання про ваші стрічки. Має вхід за ключами доступу, читання без мережі на телефоні й 14
    кольорових тем.
notes:
  en: >
    At the first visit Oksskolten asks to make the account; it has one person. Keys of AI services are
    entered in its settings.
  uk: >
    Під час першого відкриття Oksskolten попросить створити обліковий запис; користувач у нього один.
    Ключі сервісів ШІ вводяться в його налаштуваннях.
category: productivity
developer: babarot
website: https://oksskolten.com
source: https://github.com/babarot/oksskolten
icon: "data:image/webp;base64,"
screenshots: [1.webp, 2.webp, 3.webp, 4.webp]
web:
  service: oksskolten
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3017
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: MEILI_MASTER_KEY
    type: secret
    label: { en: Key of the search engine, uk: Ключ пошукового рушія }
