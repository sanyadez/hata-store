# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.79.0
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    ports:
      - "${WEB_PORT:-7474}:7474"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
