# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  hugo:
    image: ghcr.io/gohugoio/hugo:v0.161.1
    deploy:
      resources:
        reservations:
          memory: 256M
    restart: unless-stopped
    user: 0:0
    ports:
      - "${WEB_PORT:-1313}:1313"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/project"
        target: /project
      - type: bind
        source: "${APP_DATA:-.}/cache"
        target: /cache
    command:
      - server
      - "--bind=0.0.0.0"
