title: changedetection.io
tagline:
  en: Tells you when a web page changes — a price, a stock, a notice
  uk: Повідомляє, коли змінюється вебсторінка — ціна, наявність, оголошення
description:
  en: >
    Watches web pages and lets you know when something on them changes: a price drops, an item is
    back in stock, a new notice appears. Watch a whole page or just one part of it, and get the
    news by e-mail, Telegram, ntfy or dozens of other services.
  uk: >
    Стежить за вебсторінками й повідомляє, коли на них щось змінюється: падає ціна, товар знову є
    в наявності, з'являється нове оголошення. Стежте за цілою сторінкою чи лише за її частиною й
    отримуйте новини поштою, у Telegram, ntfy чи десятки інших сервісів.
notes:
  en: >
    There is no password at first: set one in its settings if others on the network should not see
    your list. Pages that are drawn by JavaScript need a browser of their own, which is not installed
    here.
  uk: >
    Спочатку пароля немає: задайте його в налаштуваннях, якщо інші в мережі не мають бачити ваш
    список. Для сторінок, які малює JavaScript, потрібен окремий браузер, а його тут не встановлено.
category: monitoring
developer: dgtlmoon
website: https://changedetection.io
source: https://github.com/dgtlmoon/changedetection.io
icon: data:image/svg+xml;base64,
web:
  service: changedetection
  port: 5000
settings:
  - name: WEB_PORT
    type: port
    default: 5000
    label: { en: Web port, uk: Порт вебінтерфейсу }
