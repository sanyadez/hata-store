tagline:
  en: An accelerated video generation framework that speeds up end-to-end diffusion while preserving video quality
  de: Ein Beschleunigungsframework für die End-to-End-Diffusionsgenerierung bei gleichbleibender Videoqualität
  el: Πλαίσιο επιτάχυνσης για ενιαία (end-to-end) παραγωγή διάχυσης με διατήρηση της ποιότητας βίντεο
  fr: Un framework d’accélération pour la génération par diffusion de bout en bout tout en préservant la qualité vidéo
  hr: Akceleracijski okvir za end-to-end difuzijsko generiranje uz očuvanje kvalitete videa
  it: Un framework di accelerazione per la generazione end-to-end tramite diffusione mantenendo la qualità video
  ja: 動画品質を維持しながらエンドツーエンドの拡散生成を高速化する動画生成フレームワーク
  ko: 비디오 품질을 유지하면서 엔드투엔드 확산 생성을 가속하는 비디오 생성 프레임워크
  nb: Et akselerasjonsrammeverk for ende-til-ende diffusjonsgenerering med bevart videokvalitet
  pt: Um framework de aceleração para geração por difusão de ponta a ponta mantendo a qualidade de vídeo
  ru: Ускоряющий фреймворк для сквозной диффузионной генерации с сохранением качества видео
  sv: Ett accelerationsramverk för end-to-end-diffusionsgenerering med bibehållen videokvalitet
  tr: Video kalitesini koruyarak uçtan uca difüzyon üretimini hızlandıran bir video üretim çerçevesi
  zh: 一种能够加速端到端扩散生成并保持视频质量的视频生成加速框架
  uk: "Фреймворк прискореної генерації відео, що пришвидшує дифузію від початку до кінця зі збереженням якості відео"
description:
  en: "TurboDiffusion is an accelerated text-to-video generation framework based on the Latent Consistency Model (LCM). It leverages various TurboWan2 models to rapidly generate high-quality videos from text descriptions. The framework supports both image and video generation and provides optimized checkpoints for different GPU configurations.\n\n**Key Features:**\n- Ultra-fast video and image generation\n- Intuitive Gradio WebUI\n- Optimized for different GPU configurations\n- Quantized and unquantized checkpoints\n- Flexible model configuration\n\n**Hardware Requirements:**\n- Recommended: RTX 3090 or above\n- GPU VRAM: > 30 GB\n- System RAM: > 40 GB\n- CUDA-compatible NVIDIA drivers\n\n**Learn More:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  de: "TurboDiffusion ist ein beschleunigtes Framework zur Text-zu-Video-Generierung auf Basis des Latent Consistency Model (LCM). Es nutzt verschiedene TurboWan2-Modelle, um aus Textbeschreibungen schnell hochwertige Videos zu erzeugen. Das Framework unterstützt sowohl die Bild- als auch die Videogenerierung und bietet optimierte Checkpoints für unterschiedliche GPU-Konfigurationen.\n\n**Hauptfunktionen:**\n- Extrem schnelle Video- und Bildgenerierung\n- Intuitive Gradio WebUI\n- Optimiert für unterschiedliche GPU-Konfigurationen\n- Quantisierte und nicht quantisierte Checkpoints\n- Flexible Modellkonfiguration\n\n**Hardware-Anforderungen:**\n- Empfohlen: RTX 3090 oder höher\n- GPU-VRAM: > 30 GB\n- System-RAM: > 40 GB\n- CUDA-kompatible NVIDIA-Treiber\n\n**Mehr erfahren:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  el: "Το TurboDiffusion είναι ένα επιταχυνόμενο πλαίσιο παραγωγής κειμένου-σε-βίντεο βασισμένο στο Latent Consistency Model (LCM). Χρησιμοποιεί διάφορα μοντέλα TurboWan2 για τη γρήγορη δημιουργία βίντεο υψηλής ποιότητας από περιγραφές κειμένου. Το πλαίσιο υποστηρίζει παραγωγή εικόνων και βίντεο και παρέχει βελτιστοποιημένα checkpoints για διαφορετικές διαμορφώσεις GPU.\n\n**Κύρια χαρακτηριστικά:**\n- Εξαιρετικά γρήγορη παραγωγή βίντεο και εικόνων\n- Διαισθητικό Gradio WebUI\n- Βελτιστοποιημένο για διαφορετικές διαμορφώσεις GPU\n- Ποσοτικοποιημένα και μη ποσοτικοποιημένα checkpoints\n- Ευέλικτη διαμόρφωση μοντέλων\n\n**Απαιτήσεις υλικού:**\n- Συνιστάται: RTX 3090 ή νεότερη\n- VRAM GPU: > 30 GB\n- RAM συστήματος: > 40 GB\n- Οδηγοί NVIDIA συμβατοί με CUDA\n\n**Μάθετε περισσότερα:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  fr: "TurboDiffusion est un framework accéléré de génération texte-à-vidéo basé sur le Latent Consistency Model (LCM). Il utilise divers modèles TurboWan2 pour générer rapidement des vidéos de haute qualité à partir de descriptions textuelles. Le framework prend en charge la génération d’images et de vidéos et fournit des checkpoints optimisés pour différentes configurations GPU.\n\n**Fonctionnalités principales :**\n- Génération ultra-rapide de vidéos et d’images\n- Gradio WebUI intuitive\n- Optimisé pour différentes configurations GPU\n- Checkpoints quantifiés et non quantifiés\n- Configuration flexible des modèles\n\n**Configuration matérielle requise :**\n- Recommandé : RTX 3090 ou supérieure\n- VRAM GPU : > 30 Go\n- RAM système : > 40 Go\n- Pilotes NVIDIA compatibles CUDA\n\n**En savoir plus :**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  hr: "TurboDiffusion je ubrzani okvir za generiranje teksta-u-video temeljen na Latent Consistency Modelu (LCM). Koristi različite TurboWan2 modele za brzo generiranje visokokvalitetnih videozapisa iz tekstualnih opisa. Okvir podržava generiranje slika i videozapisa te pruža optimizirane checkpointove za različite GPU konfiguracije.\n\n**Glavne značajke:**\n- Ultra brzo generiranje videozapisa i slika\n- Intuitivni Gradio WebUI\n- Optimizirano za različite GPU konfiguracije\n- Kvantizirani i nekvantizirani checkpointovi\n- Fleksibilna konfiguracija modela\n\n**Hardverski zahtjevi:**\n- Preporučeno: RTX 3090 ili noviji\n- VRAM GPU-a: > 30 GB\n- Sistemски RAM: > 40 GB\n- CUDA-kompatibilni NVIDIA upravljački programi\n\n**Saznajte više:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  it: "TurboDiffusion è un framework accelerato per la generazione testo-video basato sul Latent Consistency Model (LCM). Utilizza vari modelli TurboWan2 per generare rapidamente video di alta qualità a partire da descrizioni testuali. Il framework supporta la generazione di immagini e video e fornisce checkpoint ottimizzati per diverse configurazioni GPU.\n\n**Funzionalità principali:**\n- Generazione ultra-rapida di video e immagini\n- Gradio WebUI intuitiva\n- Ottimizzato per diverse configurazioni GPU\n- Checkpoint quantizzati e non quantizzati\n- Configurazione modello flessibile\n\n**Requisiti hardware:**\n- Consigliato: RTX 3090 o superiore\n- VRAM GPU: > 30 GB\n- RAM di sistema: > 40 GB\n- Driver NVIDIA compatibili con CUDA\n\n**Scopri di più:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  ja: "TurboDiffusionは、Latent Consistency Model（LCM）に基づく加速テキスト動画生成フレームワークです。さまざまなTurboWan2モデルを使用し、テキスト記述から高品質な動画を高速に生成します。本フレームワークは画像および動画生成をサポートし、異なるGPU構成向けに最適化されたチェックポイントを提供します。\n\n**主な機能：**\n- 超高速な動画・画像生成\n- 直感的なGradio WebUI\n- さまざまなGPU構成に最適化\n- 量子化／非量子化チェックポイント\n- 柔軟なモデル設定\n\n**ハードウェア要件：**\n- 推奨：RTX 3090以上\n- GPU VRAM：30GB超\n- システムRAM：40GB超\n- CUDA互換のNVIDIAドライバー\n\n**詳細情報：**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  ko: "TurboDiffusion은 Latent Consistency Model(LCM)을 기반으로 한 가속 텍스트-비디오 생성 프레임워크입니다. 다양한 TurboWan2 모델을 활용하여 텍스트 설명으로부터 고품질 비디오를 빠르게 생성합니다. 이 프레임워크는 이미지 및 비디오 생성을 지원하며, 다양한 GPU 구성에 최적화된 체크포인트를 제공합니다.\n\n**주요 기능:**\n- 초고속 비디오 및 이미지 생성\n- 직관적인 Gradio WebUI\n- 다양한 GPU 구성에 최적화\n- 양자화 및 비양자화 체크포인트\n- 유연한 모델 구성\n\n**하드웨어 요구 사항:**\n- 권장: RTX 3090 이상\n- GPU VRAM: 30GB 초과\n- 시스템 RAM: 40GB 초과\n- CUDA 호환 NVIDIA 드라이버\n\n**자세히 알아보기:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  nb: "TurboDiffusion er et akselerert rammeverk for tekst-til-video-generering basert på Latent Consistency Model (LCM). Det bruker ulike TurboWan2-modeller for raskt å generere videoer av høy kvalitet fra tekstbeskrivelser. Rammeverket støtter både bilde- og videogenerering og gir optimaliserte checkpoints for ulike GPU-konfigurasjoner.\n\n**Hovedfunksjoner:**\n- Ultra-rask video- og bildegenerering\n- Intuitiv Gradio WebUI\n- Optimalisert for ulike GPU-konfigurasjoner\n- Kvantiserte og ikke-kvantiserte checkpoints\n- Fleksibel modellkonfigurasjon\n\n**Maskinvarekrav:**\n- Anbefalt: RTX 3090 eller nyere\n- GPU VRAM: > 30 GB\n- System-RAM: > 40 GB\n- CUDA-kompatible NVIDIA-drivere\n\n**Les mer:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  pt: "TurboDiffusion é um framework acelerado para geração texto-para-vídeo baseado no Latent Consistency Model (LCM). Ele utiliza vários modelos TurboWan2 para gerar rapidamente vídeos de alta qualidade a partir de descrições de texto. O framework suporta geração de imagens e vídeos e fornece checkpoints otimizados para diferentes configurações de GPU.\n\n**Principais funcionalidades:**\n- Geração ultra-rápida de vídeos e imagens\n- Gradio WebUI intuitivo\n- Otimizado para diferentes configurações de GPU\n- Checkpoints quantizados e não quantizados\n- Configuração de modelo flexível\n\n**Requisitos de hardware:**\n- Recomendado: RTX 3090 ou superior\n- VRAM da GPU: > 30 GB\n- RAM do sistema: > 40 GB\n- Drivers NVIDIA compatíveis com CUDA\n\n**Saiba mais:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  ru: "TurboDiffusion — это ускоренный фреймворк генерации текста в видео на основе Latent Consistency Model (LCM). Он использует различные модели TurboWan2 для быстрого создания высококачественных видео по текстовым описаниям. Фреймворк поддерживает генерацию изображений и видео и предоставляет оптимизированные чекпоинты для различных конфигураций GPU.\n\n**Основные возможности:**\n- Сверхбыстрая генерация видео и изображений\n- Интуитивный Gradio WebUI\n- Оптимизация под разные конфигурации GPU\n- Квантизованные и неквантизованные чекпоинты\n- Гибкая конфигурация моделей\n\n**Требования к оборудованию:**\n- Рекомендуется: RTX 3090 и выше\n- VRAM GPU: > 30 ГБ\n- ОЗУ системы: > 40 ГБ\n- Драйверы NVIDIA, совместимые с CUDA\n\n**Подробнее:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  sv: "TurboDiffusion är ett accelererat ramverk för text-till-video-generering baserat på Latent Consistency Model (LCM). Det använder olika TurboWan2-modeller för att snabbt generera högkvalitativa videor från textbeskrivningar. Ramverket stödjer både bild- och videogenerering och tillhandahåller optimerade checkpoints för olika GPU-konfigurationer.\n\n**Nyckelfunktioner:**\n- Ultrasnabb video- och bildgenerering\n- Intuitivt Gradio WebUI\n- Optimerat för olika GPU-konfigurationer\n- Kvantiserade och icke-kvantiserade checkpoints\n- Flexibel modellkonfiguration\n\n**Hårdvarukrav:**\n- Rekommenderas: RTX 3090 eller högre\n- GPU VRAM: > 30 GB\n- System-RAM: > 40 GB\n- CUDA-kompatibla NVIDIA-drivrutiner\n\n**Läs mer:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  tr: "TurboDiffusion, Latent Consistency Model (LCM) tabanlı hızlandırılmış bir metinden videoya üretim çerçevesidir. Çeşitli TurboWan2 modellerini kullanarak metin açıklamalarından yüksek kaliteli videoları hızlı bir şekilde üretir. Çerçeve hem görüntü hem de video üretimini destekler ve farklı GPU yapılandırmaları için optimize edilmiş checkpoint'ler sunar.\n\n**Temel özellikler:**\n- Ultra hızlı video ve görüntü üretimi\n- Sezgisel Gradio WebUI\n- Farklı GPU yapılandırmaları için optimize edilmiş\n- Quantized ve unquantized checkpoint'ler\n- Esnek model yapılandırması\n\n**Donanım gereksinimleri:**\n- Önerilen: RTX 3090 veya üzeri\n- GPU VRAM: > 30 GB\n- Sistem RAM: > 40 GB\n- CUDA uyumlu NVIDIA sürücüleri\n\n**Daha fazla bilgi:**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  zh: "TurboDiffusion是基于潜在一致性模型（LCM）的加速文本到视频生成框架。它使用各种TurboWan2模型，能够从文本描述快速生成高质量视频。该框架支持图像和视频生成，并为不同的GPU配置提供优化的检查点。\n\n**主要功能：**\n- 极速视频和图像生成\n- 直观的Gradio WebUI\n- 针对不同GPU配置优化\n- 量化和非量化检查点\n- 灵活的模型配置\n\n**硬件要求：**\n- 推荐 RTX 3090 及以上GPU\n- 显存 > 30GB\n- 内存 > 40GB\n- CUDA兼容的NVIDIA驱动\n\n**了解更多：**\n- [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)"
  uk: "TurboDiffusion — фреймворк прискореної генерації відео з тексту на основі Latent Consistency Model (LCM). Він використовує різні моделі TurboWan2, щоб швидко створювати якісні відео за текстовим описом. Фреймворк підтримує генерацію і зображень, і відео та має оптимізовані контрольні точки для різних конфігурацій GPU.\n\n**Основні можливості:**\n- Надшвидка генерація відео та зображень\n- Зручний вебінтерфейс Gradio\n- Оптимізація під різні конфігурації GPU\n- Квантизовані й неквантизовані контрольні точки\n- Гнучке налаштування моделей\n\n**Вимоги до обладнання:**\n- Рекомендовано: RTX 3090 або краще\n- Відеопам'ять GPU: > 30 ГБ\n- Оперативна пам'ять: > 40 ГБ\n- Драйвери NVIDIA з підтримкою CUDA\n\n**Докладніше:**\n- [TurboDiffusion на GitHub](https://github.com/thu-ml/TurboDiffusion)"
notes:
  en: "Built-in model: TurboWan2.1-T2V-1.3B-480P\n\n1. Officially supported model list (TurboDiffusion official HF org) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Install hf download (Hugging Face CLI) (Run in terminal)\n\n- Method A (Recommended): Official one-click installation script `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Method B: pip install (suitable for existing Python environments) `pip install -U huggingface_hub`\n\n- Verify after installation: `hf --help`\n\n3.  Download specific model weights to a fixed directory (Recommended command template) Template: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Example: Download 14B 720P quant weights (adjust based on actual filename in repo) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth  --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. How to apply after download is complete\n- Confirm weights file is at: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Refresh the model list in the WebUI, click discover model / refresh model list"
  de: "Built-in model: TurboWan2.1-T2V-1.3B-480P\n\n1. Offiziell unterstützte Modellliste (TurboDiffusion offizielle HF-Organisation) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. hf-Download installieren (Hugging Face CLI) (Im Terminal ausführen)\n\n- Methode A (Empfohlen): Offizielles Ein-Klick-Installationsskript `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Methode B: pip install (geeignet für bestehende Python-Umgebungen) `pip install -U huggingface_hub`\n\n- Nach der Installation verifizieren: `hf --help`\n\n3. Bestimmte Modellgewichte in ein festes Verzeichnis herunterladen (Empfohlenes Befehlsvorlage) Vorlage: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Beispiel: 14B 720P quant-Gewichte herunterladen (basierend auf dem tatsächlichen Dateinamen im Repo anpassen) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Anwendung nach abgeschlossenem Download\n- Bestätigen, dass die Gewichtedatei unter: `/DATA/AppData/turbodiffusion_nvidia/models` liegt\n- Modellliste in der WebUI aktualisieren, auf Modell entdecken / Modellliste aktualisieren klicken"
  el: "Ενσωματωμένο μοντέλο: TurboWan2.1-T2V-1.3B-480P\n\n1. Επίσημα υποστηριζόμενη λίστα μοντέλων (TurboDiffusion επίσημος οργανισμός HF) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Εγκατάσταση hf download (Hugging Face CLI) (Εκτέλεση στο τερματικό)\n\n- Μέθοδος Α (Συνιστάται): Επίσημο σενάριο εγκατάστασης με ένα κλικ `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Μέθοδος B: pip install (κατάλληλο για υπάρχοντα περιβάλλοντα Python) `pip install -U huggingface_hub`\n\n- Επαλήθευση μετά την εγκατάσταση: `hf --help`\n\n3. Λήψη συγκεκριμένων βαρών μοντέλου σε σταθερό κατάλογο (Προτεινόμενο πρότυπο εντολής) Πρότυπο: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Παράδειγμα: Λήψη 14B 720P quant βαρών (προσαρμόστε βάσει του πραγματικού αρχείου στο repo) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Πώς να εφαρμόσετε μετά την ολοκλήρωση της λήψης\n- Επιβεβαιώστε ότι το αρχείο βαρών βρίσκεται στο: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Ανανεώστε τη λίστα μοντέλων στο WebUI, κάντε κλικ στο discover model / refresh model list"
  fr: "Modèle intégré : TurboWan2.1-T2V-1.3B-480P\n\n1. Liste des modèles officiellement pris en charge (organisation HF officielle TurboDiffusion) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Installer hf download (Hugging Face CLI) (Exécuter dans le terminal)\n\n- Méthode A (Recommandée) : Script d'installation officiel en un clic `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Méthode B : pip install (adapté aux environnements Python existants) `pip install -U huggingface_hub`\n\n- Vérifier après l'installation : `hf --help`\n\n3. Télécharger des poids de modèle spécifiques dans un répertoire fixe (Modèle de commande recommandé) Modèle : `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Exemple : Télécharger les poids quant 14B 720P (ajuster selon le nom de fichier réel dans le repo) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Comment appliquer après le téléchargement\n- Confirmer que le fichier de poids se trouve à : `/DATA/AppData/turbodiffusion_nvidia/models`\n- Actualiser la liste des modèles dans la WebUI, cliquer sur discover model / refresh model list"
  hr: "Ugrađeni model: TurboWan2.1-T2V-1.3B-480P\n\n1. Službeno podržani popis modela (TurboDiffusion službena HF organizacija) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Instaliraj hf download (Hugging Face CLI) (Pokreni u terminalu)\n\n- Metoda A (Preporučeno): Službena skripta za instalaciju jednim klikom `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Metoda B: pip install (prikladno za postojeća Python okruženja) `pip install -U huggingface_hub`\n\n- Provjeri nakon instalacije: `hf --help`\n\n3. Preuzmi specifične težine modela u direktorij (Preporučeni predložak naredbe) Predložak: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Primjer: Preuzmi 14B 720P quant težine (prilagodi prema stvarnom nazivu datoteke u repozitoriju) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Kako primijeniti nakon završetka preuzimanja\n- Potvrdi da je datoteka težina na: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Osvježi popis modela u WebUI-u, klikni discover model / refresh model list"
  it: "Modello integrato: TurboWan2.1-T2V-1.3B-480P\n\n1. Elenco modelli ufficialmente supportati (organizzazione HF ufficiale TurboDiffusion) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Installa hf download (Hugging Face CLI) (Esegui nel terminale)\n\n- Metodo A (Consigliato): Script di installazione ufficiale con un clic `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Metodo B: pip install (adatto per ambienti Python esistenti) `pip install -U huggingface_hub`\n\n- Verifica dopo l'installazione: `hf --help`\n\n3. Scarica pesi del modello specifici in una directory fissa (Modello di comando consigliato) Modello: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Esempio: Scarica pesi quant 14B 720P (regola in base al nome file effettivo nel repo) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Come applicare dopo il download completato\n- Conferma che il file dei pesi si trova in: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Aggiorna l'elenco dei modelli nella WebUI, fai clic su discover model / refresh model list"
  ja: "組み込みモデル: TurboWan2.1-T2V-1.3B-480P\n\n1. 正式にサポートされているモデル一覧（TurboDiffusion公式HF org） Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. hf downloadのインストール（Hugging Face CLI）（ターミナルで実行）\n\n- 方法A（推奨）：公式ワンクリックインストールスクリプト `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- 方法B：pip install（既存のPython環境に適しています） `pip install -U huggingface_hub`\n\n- インストール後の確認： `hf --help`\n\n3. 特定のモデルウェイトを固定ディレクトリにダウンロード（推奨コマンドテンプレート） テンプレート： `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` 例：14B 720P quantウェイトのダウンロード（repoの実際のファイル名に基づいて調整） `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. ダウンロード完了後の適用方法\n- ウェイトファイルが `/DATA/AppData/turbodiffusion_nvidia/models` にあることを確認\n- WebUIでモデルリストを更新し、discover model / refresh model listをクリック"
  ko: "내장 모델: TurboWan2.1-T2V-1.3B-480P\n\n1. 공식 지원 모델 목록 (TurboDiffusion 공식 HF 조직) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. hf download 설치 (Hugging Face CLI) (터미널에서 실행)\n\n- 방법 A (권장): 공식 원클릭 설치 스크립트 `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- 방법 B: pip install (기존 Python 환경에 적합) `pip install -U huggingface_hub`\n\n- 설치 후 확인: `hf --help`\n\n3. 특정 모델 가중치를 고정 디렉토리에 다운로드 (권장 명령 템플릿) 템플릿: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` 예시: 14B 720P quant 가중치 다운로드 (repo의 실제 파일名에 따라 조정) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. 다운로드 완료 후 적용 방법\n- 가중치 파일이 `/DATA/AppData/turbodiffusion_nvidia/models`에 있는지 확인\n- WebUI에서 모델 목록을 새로고침하고, discover model / refresh model list 클릭"
  nb: "Innebygd modell: TurboWan2.1-T2V-1.3B-480P\n\n1. Offisielt støttet modelliste (TurboDiffusion offisiell HF-organisasjon) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Installer hf download (Hugging Face CLI) (Kjør i terminal)\n\n- Metode A (Anbefalt): Offisielt ett-klikks installasjonsskript `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Metode B: pip install (egnet for eksisterende Python-miljøer) `pip install -U huggingface_hub`\n\n- Verifiser etter installasjon: `hf --help`\n\n3. Last ned spesifikke modelvekt til en fast mappe (Anbefalt kommandomal) Mal: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Eksempel: Last ned 14B 720P quant vekter (juster basert på faktisk filnavn i repo) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Hvordan bruke etter nedlasting er fullført\n- Bekreft at vektfilen er på: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Oppdater modellisten i WebUI, klikk discover model / refresh model list"
  pt: "Modelo integrado: TurboWan2.1-T2V-1.3B-480P\n\n1. Lista de modelos oficialmente suportados (organização oficial HF TurboDiffusion) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Instalar hf download (Hugging Face CLI) (Executar no terminal)\n\n- Método A (Recomendado): Script de instalação oficial com um clique `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Método B: pip install (adequado para ambientes Python existentes) `pip install -U huggingface_hub`\n\n- Verificar após a instalação: `hf --help`\n\n3. Transferir pesos de modelo específicos para um diretório fixo (Modelo de comando recomendado) Modelo: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Exemplo: Transferir pesos quant 14B 720P (ajustar com base no nome real do ficheiro no repo) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Como aplicar após a transferência estar concluída\n- Confirmar que o ficheiro de pesos está em: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Atualizar a lista de modelos na WebUI, clicar em discover model / refresh model list"
  ru: "Встроенная модель: TurboWan2.1-T2V-1.3B-480P\n\n1. Официально поддерживаемый список моделей (официальная организация HF TurboDiffusion) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Установка hf download (Hugging Face CLI) (Запустить в терминале)\n\n- Метод A (Рекомендуется): Официальный скрипт установки одним нажатием `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Метод B: pip install (подходит для существующих Python-окружений) `pip install -U huggingface_hub`\n\n- Проверить после установки: `hf --help`\n\n3. Загрузка конкретных весов модели в фиксированную директорию (Рекомендуемый шаблон команды) Шаблон: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Пример: Загрузка весов quant 14B 720P (настройте в соответствии с фактическим именем файла в репозитории) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Как применить после завершения загрузки\n- Подтвердите, что файл весов находится в: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Обновите список моделей в WebUI, нажмите discover model / refresh model list"
  sv: "Inbyggd modell: TurboWan2.1-T2V-1.3B-480P\n\n1. Officiellt stödda modelllistan (TurboDiffusion officiella HF-organisation) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Installera hf download (Hugging Face CLI) (Kör i terminal)\n\n- Metod A (Rekommenderad): Officiellt installationsskript med ett klick `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Metod B: pip install (lämplig för befintliga Python-miljöer) `pip install -U huggingface_hub`\n\n- Verifiera efter installation: `hf --help`\n\n3. Ladda ner specifika modellvikter till en fast katalog (Rekommenderad kommandomal) Mall: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Exempel: Ladda ner 14B 720P quant-vikter (justera baserat på faktiskt filnamn i repo) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Hur man applicerar efter nedladdning är klar\n- Bekräfta att viktfilen finns på: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Uppdatera modelllistan i WebUI, klicka på discover model / refresh model list"
  tr: "Dahili model: TurboWan2.1-T2V-1.3B-480P\n\n1. Resmi olarak desteklenen model listesi (TurboDiffusion resmi HF org) Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. hf download kurulumu (Hugging Face CLI) (Terminalde çalıştır)\n\n- Yöntem A (Önerilen): Resmi tek tıklama kurulum betiği `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Yöntem B: pip install (mevcut Python ortamları için uygun) `pip install -U huggingface_hub`\n\n- Kurulumdan sonra doğrula: `hf --help`\n\n3. Belirli model ağırlıklarını sabit bir dizine indir (Önerilen komut şablonu) Şablon: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Örnek: 14B 720P quant ağırlıklarını indir (repodaki gerçek dosya adına göre ayarla) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. İndirme tamamlandıktan sonra nasıl uygulanır\n- Ağırlık dosyasının şu konumda olduğunu doğrula: `/DATA/AppData/turbodiffusion_nvidia/models`\n- WebUI'da model listesini yenile, discover model / refresh model list'e tıkla"
  zh: "内置模型：TurboWan2.1-T2V-1.3B-480P\n\n1. 官方支持的模型列表（TurboDiffusion官方HF组织） Text-to-Video (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Image-to-Video (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. 安装hf download（Hugging Face CLI）（在终端中运行）\n\n- 方法A（推荐）：官方一键安装脚本 `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- 方法B：pip install（适用于现有Python环境） `pip install -U huggingface_hub`\n\n- 安装后验证： `hf --help`\n\n3. 将特定模型权重下载到固定目录（推荐命令模板） 模板： `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` 示例：下载14B 720P quant权重（根据仓库中的实际文件名调整） `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. 下载完成后的应用方法\n- 确认权重文件位于：/DATA/AppData/turbodiffusion_nvidia/models\n- 在WebUI中刷新模型列表，点击discover model / refresh model list"
  uk: "Вбудована модель: TurboWan2.1-T2V-1.3B-480P\n\n1. Офіційно підтримувані моделі (офіційна організація TurboDiffusion на HF) Текст у відео (T2V)\n- [TurboDiffusion/TurboWan2.1-T2V-1.3B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-1.3B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-480P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-480P)\n- [TurboDiffusion/TurboWan2.1-T2V-14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.1-T2V-14B-720P) Зображення у відео (I2V)\n- [TurboDiffusion/TurboWan2.2-I2V-A14B-720P](https://huggingface.co/TurboDiffusion/TurboWan2.2-I2V-A14B-720P)\n\n2. Встановіть hf download (Hugging Face CLI) (виконайте в терміналі)\n\n- Спосіб А (рекомендований): офіційний скрипт встановлення в один рядок `curl -LsSf https://hf.co/cli/install.sh | bash`\n\n- Спосіб Б: pip install (підходить для наявних середовищ Python) `pip install -U huggingface_hub`\n\n- Перевірка після встановлення: `hf --help`\n\n3.  Завантажте ваги потрібної моделі в окрему теку (рекомендований шаблон команди) Шаблон: `hf download <repo_id> <filename> --local-dir /DATA/AppData/turbodiffusion_nvidia/models` Приклад: завантаження квантизованих ваг 14B 720P (підставте справжню назву файлу з репозиторію) `hf download TurboDiffusion/TurboWan2.1-T2V-14B-720P TurboWan2.1-T2V-14B-720P-quant.pth  --local-dir /DATA/AppData/turbodiffusion_nvidia/models`\n\n4. Як застосувати після завершення завантаження\n- Переконайтеся, що файл ваг лежить у: `/DATA/AppData/turbodiffusion_nvidia/models`\n- Оновіть список моделей у вебінтерфейсі: натисніть «discover model» / «refresh model list»"
