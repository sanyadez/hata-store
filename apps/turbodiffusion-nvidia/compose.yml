# Apache-2.0, changed for Hata Store: see NOTICE
services:
  turbodiffusion:
    image: icewhaletech/turbodiffusion:20260312
    deploy:
      resources:
        reservations:
          memory: 40G
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      MODEL_PATHS: "/workspace/TurboDiffusion/checkpoints_host,/workspace/TurboDiffusion/checkpoints"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}"
      CUDA_HOME: "${CUDA_HOME:-/usr/local/cuda}"
      PYTHONPATH: "${PYTHONPATH:-/workspace/TurboDiffusion/turbodiffusion}"
    ports:
      - "${WEB_PORT:-27860}:7860"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/models"
        target: /workspace/TurboDiffusion/checkpoints_host
      - type: bind
        source: "${APP_DATA:-.}/outputs"
        target: /workspace/TurboDiffusion/outputs
    working_dir: /workspace/TurboDiffusion
    command:
      - python
      - turbodiffusion/app_gradio.py
    restart: unless-stopped
