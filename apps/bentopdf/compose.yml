# Apache-2.0, changed for Hata Store: see NOTICE
services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:2.8.10
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DISABLE_IPV6: "${DISABLE_IPV6:-false}"
    healthcheck:
      test:
        - CMD
        - wget
        - "--spider"
        - "-q"
        - http://localhost:8080
      interval: 30s
      timeout: 10s
      retries: 3
