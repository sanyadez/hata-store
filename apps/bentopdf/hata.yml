# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: BentoPDF
tagline:
  en: "Privacy-first, self-hosted PDF toolkit"
  zh: 隐私优先的自托管 PDF 工具箱
  uk: "Self-hosted набір інструментів для PDF, де приватність на першому місці"
description:
  en: "**Your PDFs never leave your device.** BentoPDF is a privacy-first PDF toolkit that runs entirely in your browser. Every merge, split, conversion, and edit happens locally on your machine — no file is ever uploaded to a server. More than 50 tools are bundled into one clean, fast, ad-free interface.\n\n**One app for every PDF job.** Organize and edit your documents (merge, split, reorder, rotate, crop, watermark, page numbers, redaction, annotations and forms), convert to and from PDF (images, Word, Excel, PowerPoint, EPUB, Markdown and more), run OCR, and secure your files with compression, encryption, digital signatures, and metadata cleanup."
  zh: "**你的 PDF 永不离开设备。** BentoPDF 是一款隐私优先的 PDF 工具箱，完全在浏览器中运行。合并、拆分、转换和编辑等所有操作都在本地完成——任何文件都不会上传到服务器。它将 50 多种工具集成到一个简洁、快速、无广告的界面中。\n\n**一个应用搞定所有 PDF 任务。** 整理与编辑文档（合并、拆分、重排、旋转、裁剪、水印、页码、涂黑、批注与表单），在 PDF 与多种格式之间互转（图片、Word、Excel、PowerPoint、EPUB、Markdown 等），运行 OCR，并通过压缩、加密、数字签名和元数据清理来保护文件。"
  uk: "**Ваші PDF ніколи не залишають ваш пристрій.** BentoPDF — набір інструментів для PDF, який дбає про приватність і працює цілком у вашому браузері. Кожне об’єднання, розділення, перетворення й редагування відбувається локально на вашому комп’ютері — жоден файл не надсилається на сервер. Понад 50 інструментів зібрано в одному чистому, швидкому інтерфейсі без реклами.\n\n**Один застосунок для будь-яких завдань із PDF.** Впорядковуйте й редагуйте документи (об’єднання, розділення, зміна порядку, поворот, обрізання, водяні знаки, номери сторінок, приховування даних, анотації та форми), перетворюйте в PDF і з нього (зображення, Word, Excel, PowerPoint, EPUB, Markdown та інше), запускайте OCR і захищайте файли: стиснення, шифрування, цифрові підписи та очищення метаданих."
notes:
  en: "## Getting Started\n\n## HTTPS for Office conversions"
  zh: "## 快速开始\n\n## Office 转换需要 HTTPS"
  uk: "## Початок роботи\n\n## HTTPS для перетворення офісних файлів"
category: productivity
developer: BentoPDF
website: https://bentopdf.com
source: https://github.com/alam00000/bentopdf
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: bentopdf
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DISABLE_IPV6
    type: text
    default: "false"
    label:
      en: "Set to \"true\" to disable the container's IPv6 listener"
      zh: "设为 \"true\" 可禁用容器的 IPv6 监听"
      uk: "Укажіть \"true\", щоб вимкнути прослуховування IPv6 у контейнері"
