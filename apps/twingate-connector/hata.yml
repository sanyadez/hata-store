# Apache-2.0, changed for Hata Store: see NOTICE
title: Twingate
tagline:
  en: Twingate Connector
  uk: Конектор Twingate
description:
  en: "It's a connector for Twingate\"."
  uk: Це конектор для Twingate.
category: network
developer: Twingate
website: https://www.twingate.com
icon: "data:image/svg+xml;base64,"
settings:
  - name: TWINGATE_NETWORK
    type: text
    required: true
    label:
      en: Twingate network
      uk: Мережа Twingate
    hint:
      en: "The name before .twingate.com in your network's address"
      uk: Назва перед .twingate.com в адресі вашої мережі
  - name: TWINGATE_ACCESS_TOKEN
    type: password
    required: true
    label:
      en: Access token
      uk: Токен доступу
    hint:
      en: Given by the Twingate Admin Console when a connector is added
      uk: "Видає Twingate Admin Console, коли додаєте конектор"
  - name: TWINGATE_REFRESH_TOKEN
    type: password
    required: true
    label:
      en: Refresh token
      uk: Токен оновлення
  - name: HOSTNAME
    type: text
    label:
      en: Name of this connector
      uk: Назва цього конектора
