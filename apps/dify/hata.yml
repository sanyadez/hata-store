title: Dify
tagline:
  en: LLM App Development Platform
  uk: Платформа для розробки застосунків на основі LLM
description:
  en: Dify is an open-source large language model (LLM) application development platform. It combines the concepts of Backend-as-a-Service and LLMOps to enable developers to quickly build production-grade generative AI applications. Even non-technical personnel can participate in the definition and data operations of AI applications.
  uk: "Dify — платформа з відкритим кодом для розробки застосунків на основі великих мовних моделей (LLM). Вона поєднує ідеї Backend-as-a-Service та LLMOps, щоб розробники могли швидко створювати генеративні ШІ-застосунки промислового рівня. Навіть нетехнічні фахівці можуть брати участь у визначенні ШІ-застосунків і роботі з даними."
category: ai
developer: LangGenius
website: https://dify.ai
source: https://github.com/langgenius/dify
