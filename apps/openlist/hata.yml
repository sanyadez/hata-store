title:
  en: OpenList
tagline:
  en: Mount your cloud drive on your home NAS
  it: Monta il tuo disco cloud sul tuo NAS domestico
  nb: Monter skylagringsstasjonen din på hjemme-NAS-en
  zh: 将你的云盘挂载到家用 NAS 上
  ja: クラウドドライブをホーム NAS にマウント
  ko: 클라우드 드라이브를 홈 NAS에 마운트
  fr: Montez votre disque cloud sur votre NAS domestique
  de: Mounten Sie Ihr Cloud-Laufwerk auf Ihrem Heim-NAS
  sv: Montera din molndisk på ditt hemmabaserade NAS
  el: Προσαρτήστε τη μονάδα cloud σας στο οικιακό σας NAS
  hr: Povežite svoj cloud disk na kućni NAS
  pt: Monte o seu disco na nuvem no seu NAS doméstico
  ru: Подключите ваш облачный диск к домашнему NAS
  tr: "Bulut sürücünüzü ev NAS'ınıza bağlayın"
  uk: Підключіть свої хмарні сховища до домашнього NAS
description:
  en: "OpenList is a community-driven, self-hosted file listing and cloud drive mounting service that supports multiple storage backends in one place. It brings local storage plus services like OneDrive, Google Drive, S3, WebDAV, SMB, and many other providers into one browser-based file hub. With previews, uploads, sharing, WebDAV, offline download, and package download built in, it works well for home NAS setups, personal cloud libraries, and lightweight team file portals.\n\n**Main Features:**\n- Connect local disks, cloud drives, object storage, and WebDAV or SMB endpoints in one place\n- Preview documents, images, audio, video, code, Markdown, and Office files directly in the browser\n- Upload, move, rename, copy, delete, and batch download files and folders from a single interface\n- Enable WebDAV, protected routes, sharing, dark mode, and multi-language support\n- Support offline downloads, cross-storage file copying, and multi-thread acceleration\n\n**Learn More:**\n- [OpenList Official Website](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  it: "OpenList è un servizio self-hosted e community-driven per l'elenco dei file e il montaggio dei cloud drive, con supporto a più back-end di archiviazione in un unico posto. Riunisce archiviazione locale e servizi come OneDrive, Google Drive, S3, WebDAV, SMB e molti altri provider in un unico hub file accessibile dal browser. Con anteprime, upload, condivisione, WebDAV, download offline e download di pacchetti integrati, si adatta bene a NAS domestici, librerie cloud personali e portali file leggeri per team.\n\n**Funzionalità Principali:**\n- Collega dischi locali, cloud drive, object storage ed endpoint WebDAV o SMB in un solo posto\n- Anteprima nel browser di documenti, immagini, audio, video, codice, Markdown e file Office\n- Carica, sposta, rinomina, copia, elimina e scarica in batch file e cartelle da un'unica interfaccia\n- Abilita WebDAV, percorsi protetti, condivisione, modalità scura e supporto multilingua\n- Supporta download offline, copia di file tra archivi diversi e accelerazione multi-thread\n\n**Ulteriori Informazioni:**\n- [Sito Ufficiale OpenList](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  nb: "OpenList er en selvhostet og fellesskapsdrevet tjeneste for fillisting og montering av skylagring, med støtte for flere lagringsbakender på ett sted. Den samler lokal lagring og tjenester som OneDrive, Google Drive, S3, WebDAV, SMB og mange andre leverandører i ett nettleserbasert filnav. Med innebygd forhåndsvisning, opplasting, deling, WebDAV, offline nedlasting og pakkenedlasting passer den godt til hjemme-NAS, personlige skylagre og lette filportaler for team.\n\n**Hovedfunksjoner:**\n- Koble lokale disker, skylagring, objektlagring og WebDAV- eller SMB-endepunkter på ett sted\n- Forhåndsvis dokumenter, bilder, lyd, video, kode, Markdown og Office-filer direkte i nettleseren\n- Last opp, flytt, gi nytt navn, kopier, slett og last ned filer og mapper i batch fra ett grensesnitt\n- Aktiver WebDAV, beskyttede ruter, deling, mørk modus og støtte for flere språk\n- Støtter offline nedlastinger, filkopiering mellom lagre og flertrådet akselerasjon\n\n**Lær Mer:**\n- [OpenList Offisielle Nettside](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  zh: "OpenList 是一个社区驱动的自托管文件列表与云盘挂载服务，可在一个入口中统一接入多种存储后端。 它把本地存储、OneDrive、Google Drive、S3、WebDAV、SMB 等多种存储统一到一个基于浏览器的文件入口中。 内置预览、上传、分享、WebDAV、离线下载和打包下载后，它很适合家庭 NAS、个人云资料库和轻量团队文件门户。\n\n**主要功能：**\n- 连接本地磁盘、云盘、对象存储以及 WebDAV 或 SMB 等多种存储后端\n- 直接在浏览器中预览文档、图片、音视频、代码、Markdown 和 Office 文件\n- 通过统一界面上传、移动、重命名、复制、删除和批量下载文件与文件夹\n- 提供 WebDAV、受保护路径、分享、深色模式和多语言支持\n- 支持离线下载、跨存储复制文件和多线程加速\n\n**了解更多：**\n- [OpenList 官网](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  ja: "OpenListは、複数のストレージバックエンドをひとつの場所で扱える、コミュニティ主導のセルフホスト型ファイル一覧・クラウドドライブマウントサービスです。 ローカルストレージに加え、OneDrive、Google Drive、S3、WebDAV、SMB など多くのプロバイダーを、ブラウザー上のひとつのファイルハブにまとめます。 プレビュー、アップロード、共有、WebDAV、オフラインダウンロード、パッケージダウンロードを標準搭載しており、家庭用 NAS、個人クラウドライブラリ、軽量なチーム向けファイルポータルに向いています。\n\n**主な機能：**\n- ローカルディスク、クラウドドライブ、オブジェクトストレージ、WebDAV や SMB のエンドポイントを一か所に接続\n- ドキュメント、画像、音声、動画、コード、Markdown、Office ファイルをブラウザー内で直接プレビュー\n- 単一の画面から、ファイルやフォルダーのアップロード、移動、名前変更、コピー、削除、バッチダウンロードが可能\n- WebDAV、保護されたルート、共有、ダークモード、多言語サポートを利用可能\n- オフラインダウンロード、ストレージ間ファイルコピー、マルチスレッド高速化に対応\n\n**詳細情報：**\n- [OpenList 公式サイト](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  ko: "OpenList는 여러 스토리지 백엔드를 한곳에서 다룰 수 있는 커뮤니티 주도의 자체 호스팅 파일 목록 및 클라우드 드라이브 마운트 서비스입니다. 로컬 저장소와 OneDrive, Google Drive, S3, WebDAV, SMB 등 다양한 제공자를 하나의 브라우저 기반 파일 허브로 통합합니다. 미리보기, 업로드, 공유, WebDAV, 오프라인 다운로드, 패키지 다운로드를 기본 제공해 가정용 NAS, 개인 클라우드 라이브러리, 가벼운 팀 파일 포털에 잘 맞습니다.\n\n**주요 기능:**\n- 로컬 디스크, 클라우드 드라이브, 오브젝트 스토리지, WebDAV 또는 SMB 엔드포인트를 한곳에 연결\n- 문서, 이미지, 오디오, 비디오, 코드, Markdown, Office 파일을 브라우저에서 직접 미리보기\n- 하나의 인터페이스에서 파일과 폴더 업로드, 이동, 이름 변경, 복사, 삭제, 일괄 다운로드 수행\n- WebDAV, 보호된 경로, 공유, 다크 모드, 다국어 지원 제공\n- 오프라인 다운로드, 저장소 간 파일 복사, 멀티스레드 가속 지원\n\n**더 알아보기:**\n- [OpenList 공식 웹사이트](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  fr: "OpenList est un service auto-hébergé et communautaire de listing de fichiers et de montage de lecteurs cloud, avec prise en charge de plusieurs backends de stockage au même endroit. Il regroupe le stockage local et des services comme OneDrive, Google Drive, S3, WebDAV, SMB et bien d'autres fournisseurs dans un hub de fichiers accessible depuis le navigateur. Avec les aperçus, l'envoi, le partage, WebDAV, le téléchargement hors ligne et le téléchargement groupé intégrés, il convient bien aux NAS domestiques, aux bibliothèques cloud personnelles et aux portails de fichiers légers pour équipes.\n\n**Fonctionnalités Principales :**\n- Connecte disques locaux, lecteurs cloud, stockage objet et points de terminaison WebDAV ou SMB au même endroit\n- Prévisualise directement dans le navigateur documents, images, audio, vidéo, code, Markdown et fichiers Office\n- Permet d'envoyer, déplacer, renommer, copier, supprimer et télécharger par lots fichiers et dossiers depuis une seule interface\n- Active WebDAV, routes protégées, partage, mode sombre et prise en charge multilingue\n- Prend en charge le téléchargement hors ligne, la copie entre stockages et l'accélération multithread\n\n**En Savoir Plus :**\n- [Site Officiel OpenList](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  de: "OpenList ist ein community-getriebener, selbst gehosteter Dienst für Dateilisten und das Einbinden von Cloud-Laufwerken, der mehrere Speicher-Backends an einem Ort unterstützt. Er bündelt lokalen Speicher sowie Dienste wie OneDrive, Google Drive, S3, WebDAV, SMB und viele weitere Anbieter in einem browserbasierten Datei-Hub. Mit integrierter Vorschau, Uploads, Freigaben, WebDAV, Offline-Downloads und Paket-Downloads eignet er sich gut für Heim-NAS-Systeme, persönliche Cloud-Bibliotheken und leichte Dateiportale für Teams.\n\n**Hauptfunktionen:**\n- Verbindet lokale Laufwerke, Cloud-Speicher, Objektspeicher sowie WebDAV- oder SMB-Endpunkte an einem Ort\n- Zeigt Dokumente, Bilder, Audio, Video, Code, Markdown und Office-Dateien direkt im Browser an\n- Ermöglicht Hochladen, Verschieben, Umbenennen, Kopieren, Löschen und Stapel-Downloads von Dateien und Ordnern über eine einzige Oberfläche\n- Bietet WebDAV, geschützte Routen, Freigaben, Dunkelmodus und mehrsprachige Unterstützung\n- Unterstützt Offline-Downloads, Dateiübertragungen zwischen Speichern und Multi-Thread-Beschleunigung\n\n**Mehr Erfahren:**\n- [OpenList Offizielle Website](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  sv: "OpenList är en communitydriven och självhostad tjänst för fillistning och montering av molndiskar, med stöd för flera lagringsbakändar på ett ställe. Den samlar lokal lagring och tjänster som OneDrive, Google Drive, S3, WebDAV, SMB och många andra leverantörer i ett webbläsarbaserat filnav. Med inbyggd förhandsvisning, uppladdning, delning, WebDAV, offline-nedladdning och paketnedladdning passar den bra för hem-NAS, personliga molnbibliotek och lätta filportaler för team.\n\n**Huvudfunktioner:**\n- Anslut lokala diskar, molndiskar, objektlagring och WebDAV- eller SMB-endpoints på ett ställe\n- Förhandsgranska dokument, bilder, ljud, video, kod, Markdown och Office-filer direkt i webbläsaren\n- Ladda upp, flytta, byt namn på, kopiera, radera och batchladda ner filer och mappar från ett enda gränssnitt\n- Aktivera WebDAV, skyddade vägar, delning, mörkt läge och stöd för flera språk\n- Stöd för offline-nedladdningar, kopiering mellan lagringar och flertrådad acceleration\n\n**Lär Dig Mer:**\n- [OpenList Officiella Webbplats](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  el: "Το OpenList είναι μια community-driven και self-hosted υπηρεσία για καταλόγους αρχείων και προσάρτηση cloud drives, με υποστήριξη για πολλαπλά storage backends σε ένα μέρος. Συγκεντρώνει τοπική αποθήκευση και υπηρεσίες όπως OneDrive, Google Drive, S3, WebDAV, SMB και πολλούς άλλους παρόχους σε ένα κεντρικό περιβάλλον αρχείων μέσα από τον browser. Με ενσωματωμένες προεπισκοπήσεις, μεταφορτώσεις, κοινή χρήση, WebDAV, λήψεις εκτός σύνδεσης και λήψεις πακέτων, ταιριάζει καλά σε οικιακά NAS, προσωπικές cloud βιβλιοθήκες και ελαφριές πύλες αρχείων για ομάδες.\n\n**Κύριες Λειτουργίες:**\n- Συνδέει τοπικούς δίσκους, cloud drives, object storage και endpoints WebDAV ή SMB σε ένα μέρος\n- Προεπισκόπηση εγγράφων, εικόνων, ήχου, βίντεο, κώδικα, Markdown και αρχείων Office απευθείας στον browser\n- Μεταφόρτωση, μετακίνηση, μετονομασία, αντιγραφή, διαγραφή και μαζική λήψη αρχείων και φακέλων από ένα ενιαίο περιβάλλον\n- Ενεργοποιεί WebDAV, προστατευμένες διαδρομές, κοινή χρήση, σκοτεινή λειτουργία και υποστήριξη πολλών γλωσσών\n- Υποστηρίζει λήψεις εκτός σύνδεσης, αντιγραφή αρχείων μεταξύ αποθηκευτικών χώρων και επιτάχυνση πολλαπλών νημάτων\n\n**Μάθετε Περισσότερα:**\n- [Επίσημος Ιστότοπος OpenList](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  hr: "OpenList je community-driven i samohostirani servis za popis datoteka i povezivanje cloud diskova, s podrškom za više spremišnih pozadina na jednom mjestu. Objedinjuje lokalnu pohranu i servise poput OneDrivea, Google Drivea, S3, WebDAV-a, SMB-a i mnogih drugih pružatelja u jedno pregledničko središte za datoteke. Uz ugrađene preglede, prijenos datoteka, dijeljenje, WebDAV, izvanmrežna preuzimanja i paketna preuzimanja, dobro odgovara kućnim NAS sustavima, osobnim cloud bibliotekama i laganim timskim portalima za datoteke.\n\n**Glavne Funkcije:**\n- Povezuje lokalne diskove, cloud diskove, object storage i WebDAV ili SMB odredišta na jednom mjestu\n- Izravno u pregledniku pregledava dokumente, slike, audio, video, kod, Markdown i Office datoteke\n- Omogućuje prijenos, premještanje, preimenovanje, kopiranje, brisanje i skupno preuzimanje datoteka i mapa iz jednog sučelja\n- Omogućuje WebDAV, zaštićene rute, dijeljenje, tamni način rada i podršku za više jezika\n- Podržava izvanmrežna preuzimanja, kopiranje datoteka između spremišta i višedretveno ubrzanje\n\n**Saznajte Više:**\n- [Službena Web Stranica OpenList](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  pt: "O OpenList é um serviço auto-hospedado e orientado pela comunidade para listagem de ficheiros e montagem de discos na nuvem, com suporte para vários backends de armazenamento num só local. Reúne armazenamento local e serviços como OneDrive, Google Drive, S3, WebDAV, SMB e muitos outros fornecedores num único centro de ficheiros baseado no navegador. Com pré-visualizações, carregamentos, partilha, WebDAV, downloads offline e downloads em pacote integrados, adapta-se bem a NAS domésticos, bibliotecas cloud pessoais e portais de ficheiros leves para equipas.\n\n**Principais Funcionalidades:**\n- Liga discos locais, discos na nuvem, armazenamento de objetos e endpoints WebDAV ou SMB num só local\n- Pré-visualiza documentos, imagens, áudio, vídeo, código, Markdown e ficheiros Office diretamente no navegador\n- Permite carregar, mover, renomear, copiar, apagar e descarregar em lote ficheiros e pastas a partir de uma única interface\n- Ativa WebDAV, rotas protegidas, partilha, modo escuro e suporte multilingue\n- Suporta downloads offline, cópia de ficheiros entre armazenamentos e aceleração multithread\n\n**Saiba Mais:**\n- [Site Oficial OpenList](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  ru: "OpenList — это community-driven и self-hosted сервис для файловых списков и подключения облачных дисков с поддержкой нескольких хранилищ в одном месте. Он объединяет локальное хранилище и сервисы вроде OneDrive, Google Drive, S3, WebDAV, SMB и многих других провайдеров в единый файловый центр, работающий в браузере. Благодаря встроенным предпросмотрам, загрузке, общему доступу, WebDAV, офлайн-загрузкам и пакетным скачиваниям он хорошо подходит для домашних NAS, личных облачных библиотек и лёгких командных файловых порталов.\n\n**Основные Функции:**\n- Подключает локальные диски, облачные накопители, объектное хранилище и конечные точки WebDAV или SMB в одном месте\n- Позволяет просматривать документы, изображения, аудио, видео, код, Markdown и Office-файлы прямо в браузере\n- Даёт возможность загружать, перемещать, переименовывать, копировать, удалять и пакетно скачивать файлы и папки из единого интерфейса\n- Предоставляет WebDAV, защищённые маршруты, общий доступ, тёмный режим и поддержку нескольких языков\n- Поддерживает офлайн-загрузки, копирование файлов между хранилищами и многопоточную акселерацию\n\n**Узнать Больше:**\n- [Официальный Сайт OpenList](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  tr: "OpenList, birden fazla depolama arka ucunu tek yerde destekleyen, topluluk odaklı ve kendi kendine barındırılabilen bir dosya listeleme ve bulut sürücüsü bağlama hizmetidir. Yerel depolamayı ve OneDrive, Google Drive, S3, WebDAV, SMB ile daha birçok sağlayıcıyı tarayıcı tabanlı tek bir dosya merkezinde bir araya getirir. Yerleşik önizleme, yükleme, paylaşım, WebDAV, çevrimdışı indirme ve paket indirme özellikleri sayesinde ev NAS kurulumları, kişisel bulut arşivleri ve hafif ekip dosya portalları için iyi bir uyum sağlar.\n\n**Başlıca İşlevler:**\n- Yerel diskleri, bulut sürücülerini, nesne depolamayı ve WebDAV veya SMB uç noktalarını tek yerde birleştirir\n- Belgeleri, görselleri, sesleri, videoları, kodu, Markdown'u ve Office dosyalarını doğrudan tarayıcıda önizler\n- Tek bir arayüzden dosya ve klasör yükleme, taşıma, yeniden adlandırma, kopyalama, silme ve toplu indirme işlemlerini sunar\n- WebDAV, korumalı yollar, paylaşım, karanlık mod ve çok dilli desteği etkinleştirir\n- Çevrimdışı indirmeleri, depolar arası dosya kopyalamayı ve çok iş parçacıklı hızlandırmayı destekler\n\n**Daha Fazla Bilgi:**\n- [OpenList Resmi Web Sitesi](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  uk: "OpenList — розроблений спільнотою сервіс для самостійного розгортання, що показує файли та підключає хмарні сховища, об'єднуючи багато джерел в одному місці. Він збирає локальні сховища й сервіси на кшталт OneDrive, Google Drive, S3, WebDAV, SMB та багатьох інших в одному файловому центрі в браузері. Завдяки вбудованим переглядові, завантаженню, спільному доступу, WebDAV, офлайн-завантаженню та пакетному завантаженню він добре підходить для домашніх NAS, особистих хмарних бібліотек і невеликих командних файлових порталів.\n\n**Основні можливості:**\n- Підключення локальних дисків, хмарних сховищ, об'єктних сховищ і точок WebDAV чи SMB в одному місці\n- Перегляд документів, зображень, аудіо, відео, коду, Markdown і файлів Office просто в браузері\n- Завантаження, переміщення, перейменування, копіювання, видалення та пакетне скачування файлів і тек в одному інтерфейсі\n- WebDAV, захищені маршрути, спільний доступ, темна тема й підтримка багатьох мов\n- Офлайн-завантаження, копіювання файлів між сховищами та багатопотокове прискорення\n\n**Докладніше:**\n- [Офіційний сайт OpenList](https://oplist.org/)\n- [OpenList на GitHub](https://github.com/OpenListTeam/OpenList)"
