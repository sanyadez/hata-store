# Apache-2.0, changed for Hata Store: see NOTICE
title: OpenList
tagline:
  en: Mount your cloud drive on your home NAS
  uk: Підключіть свої хмарні сховища до домашнього NAS
description:
  en: "OpenList is a community-driven, self-hosted file listing and cloud drive mounting service that supports multiple storage backends in one place. It brings local storage plus services like OneDrive, Google Drive, S3, WebDAV, SMB, and many other providers into one browser-based file hub. With previews, uploads, sharing, WebDAV, offline download, and package download built in, it works well for home NAS setups, personal cloud libraries, and lightweight team file portals.\n\n**Main Features:**\n- Connect local disks, cloud drives, object storage, and WebDAV or SMB endpoints in one place\n- Preview documents, images, audio, video, code, Markdown, and Office files directly in the browser\n- Upload, move, rename, copy, delete, and batch download files and folders from a single interface\n- Enable WebDAV, protected routes, sharing, dark mode, and multi-language support\n- Support offline downloads, cross-storage file copying, and multi-thread acceleration\n\n**Learn More:**\n- [OpenList Official Website](https://oplist.org/)\n- [OpenList GitHub](https://github.com/OpenListTeam/OpenList)"
  uk: "OpenList — розроблений спільнотою сервіс для самостійного розгортання, що показує файли та підключає хмарні сховища, об'єднуючи багато джерел в одному місці. Він збирає локальні сховища й сервіси на кшталт OneDrive, Google Drive, S3, WebDAV, SMB та багатьох інших в одному файловому центрі в браузері. Завдяки вбудованим переглядові, завантаженню, спільному доступу, WebDAV, офлайн-завантаженню та пакетному завантаженню він добре підходить для домашніх NAS, особистих хмарних бібліотек і невеликих командних файлових порталів.\n\n**Основні можливості:**\n- Підключення локальних дисків, хмарних сховищ, об'єктних сховищ і точок WebDAV чи SMB в одному місці\n- Перегляд документів, зображень, аудіо, відео, коду, Markdown і файлів Office просто в браузері\n- Завантаження, переміщення, перейменування, копіювання, видалення та пакетне скачування файлів і тек в одному інтерфейсі\n- WebDAV, захищені маршрути, спільний доступ, темна тема й підтримка багатьох мов\n- Офлайн-завантаження, копіювання файлів між сховищами та багатопотокове прискорення\n\n**Докладніше:**\n- [Офіційний сайт OpenList](https://oplist.org/)\n- [OpenList на GitHub](https://github.com/OpenListTeam/OpenList)"
category: productivity
developer: OpenListTeam
