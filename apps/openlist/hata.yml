web:
  service: openlist
  port: 5244
settings:
  - name: WEB_PORT
    type: port
    default: 5244
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: UMASK
    type: text
    default: "022"
    label:
      en: Sets the default file creation mask for OpenList
      uk: Маска прав для нових файлів в OpenList за замовчуванням
  - name: OPENLIST_ADMIN_PASSWORD
    type: password
    required: true
    label:
      en: "Administrator's password"
      uk: Пароль адміністратора
