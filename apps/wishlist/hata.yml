title: Wishlist
tagline:
  en: Wish lists for family and friends, where a gift can be claimed without the owner knowing
  uk: Списки бажань для родини й друзів, де подарунок можна забронювати так, щоб власник не знав
description:
  en: >
    Everybody keeps a list of what they would like, with a link, a price and a picture, and the others
    see it and claim what they are going to give, so two people never buy the same thing. The owner of a
    list does not see what is claimed on it. Friends and family can be separate groups, people can
    suggest items for somebody else's list, and a group can be turned into a registry with a public link
    for a wedding or a birthday, where guests claim gifts without an account.
  uk: >
    Кожен веде список того, що хотів би отримати, з посиланням, ціною й фото, а інші бачать його й
    бронюють те, що збираються подарувати, тож двоє ніколи не куплять одне й те саме. Власник списку не
    бачить, що в ньому заброньовано. Друзі й родина можуть бути окремими групами, можна пропонувати
    речі до чужого списку, а групу — перетворити на реєстр подарунків із публічним посиланням для
    весілля чи дня народження, де гості бронюють подарунки без облікового запису.
notes:
  en: >
    At the first visit Wishlist walks you through making the administrator. Anyone who can open the page
    can then sign up; to make it invite-only, switch off public sign-up in the administration settings.
  uk: >
    Під час першого відкриття Wishlist проведе через створення адміністратора. Після цього
    зареєструватися може кожен, хто відкриє сторінку; щоб пускати лише за запрошеннями, вимкніть
    відкриту реєстрацію в налаштуваннях адміністрування.
category: social
developer: cmintey
website: https://github.com/cmintey/wishlist
source: https://github.com/cmintey/wishlist
icon: "data:image/webp;base64,"
screenshots: [1.webp, 2.webp, 3.webp, 4.webp]
web:
  service: wishlist
  port: 3280
settings:
  - name: WEB_PORT
    type: port
    default: 3280
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: DEFAULT_CURRENCY
    type: text
    default: USD
    label: { en: Default currency, uk: Типова валюта }
    hint:
      en: "Its three-letter code: USD, EUR, UAH… Each item can still have its own"
      uk: "Трилітерний код: USD, EUR, UAH… Кожна річ однаково може мати власну"
  - name: TOKEN_TIME
    type: number
    default: 72
    advanced: true
    label: { en: Invitation links last (hours), uk: Термін дії посилань-запрошень (годин) }
    hint:
      en: Also the links that reset a password
      uk: Як і посилань для скидання пароля
