# Apache-2.0, changed for Hata Store: see NOTICE
title: Plex
tagline:
  en: Stream Movies & TV Shows
  uk: Потокове відтворення фільмів і серіалів
description:
  en: "Transform your home into a cinematic oasis with your very own media server. Unlike streaming platforms that compress and limit the quality of your content, a Plex server in your home allows you to maintain the pristine, high-bitrate glory of Blu-ray and beyond. Imagine pairing this high-fidelity, uninterrupted media access with cutting-edge home theater tech like VR headsets, 75-inch UHD TVs, or 100-inch laser projectors. The result? A breathtaking visual and auditory experience that streams seamlessly across TVs and mobile devices alike, right from the comfort of your couch."
  uk: "Перетворіть свій дім на кінотеатр зі власним медіасервером. На відміну від стрімінгових платформ, які стискають і обмежують якість вмісту, сервер Plex удома дає змогу зберегти бездоганну якість з високим бітрейтом, як на Blu-ray і вище. Уявіть, що цей якісний і нічим не обмежений доступ до медіа поєднано з сучасною технікою для домашнього кінотеатру: VR-шоломами, UHD-телевізорами на 75 дюймів чи лазерними проєкторами на 100 дюймів. Результат — приголомшливі враження для очей і слуху, що без збоїв транслюються на телевізори й мобільні пристрої просто з вашого дивана."
notes:
  en: "## Plex\n\n#### Stream Movies & TV Shows <br>\n\n*FAQ* Authorized Files and Data to Plex\n\n1. Click setting via top right menu of App icon\n2. map your device's media location in 'Host Path' and link it to Plex's 'Container Path' at /Media for seamless access. To add a media library in Plex\n3. Go to Plex settings\n4. click 'Add Library'\n5. select your media type, and specify the path, such as /Media, where your media files are stored for Plex to catalog and include in your library."
  uk: "## Plex\n\n#### Потокове відтворення фільмів і серіалів <br>\n\n*Поширені запитання* Як дати Plex доступ до файлів і даних\n\n1. Натисніть налаштування в меню значка застосунку у верхньому правому куті\n2. Вкажіть розташування медіа вашого пристрою в «Host Path» і зв'яжіть його з «Container Path» Plex за адресою /Media для безперешкодного доступу. Щоб додати медіатеку в Plex:\n3. Відкрийте налаштування Plex\n4. Натисніть «Add Library»\n5. Виберіть тип медіа й вкажіть шлях, наприклад /Media, де зберігаються ваші медіафайли, щоб Plex каталогізував їх і додав до вашої бібліотеки."
category: media
developer: Plex
website: https://www.plex.tv
source: https://github.com/linuxserver/docker-plex
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: plex
  port: 32400
  path: /web/index.html
settings:
  - name: MEDIA_DIR
    type: folder
    default: "${DATA_ROOT}/Media"
    label:
      en: Plex Media directory
      uk: Тека медіа Plex
    hint:
      en: Inside the app it is /Media
      uk: У застосунку вона — /Media
  - name: VERSION
    type: text
    default: docker
    label:
      en: Let Docker handle the Plex Version
      uk: Доручити Docker вибір версії Plex
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
  devices:
    en: "It uses devices of the server: /dev/dri, /dev/dvb"
    uk: "Він користується пристроями сервера: /dev/dri, /dev/dvb"
