# Apache-2.0, changed for Hata Store: see NOTICE
services:
  opodsync:
    image: ganeshlab/opodsync:latest@sha256:605c5e78bfe5392cdc4557d3d6f02d28eb709c5d5b5cf1c15d4500fc2e6f8319
    deploy:
      resources:
        reservations:
          memory: 512M
    ports:
      - "${WEB_PORT:-8086}:8080"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /var/www/server/data
    restart: unless-stopped
