# Apache-2.0, changed for Hata Store: see NOTICE
title: Frigate
tagline:
  en: Monitor your security cameras with locally processed AI
  uk: "Стежте за камерами відеоспостереження за допомогою ШІ, що працює локально"
description:
  en: "Frigate is an open-source network video recorder (NVR) with real-time AI object detection. It provides local, private camera recording, event review, snapshots, and live viewing through a web interface."
  uk: "Frigate — відеореєстратор (NVR) із відкритим кодом і розпізнаванням об’єктів ШІ в реальному часі. Він забезпечує локальний приватний запис з камер, перегляд подій, знімки та перегляд наживо через вебінтерфейс."
category: home
developer: Frigate
website: https://frigate.video/
source: https://github.com/blakeblackshear/frigate
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: frigate
  port: 8971
  scheme: https
settings:
  - name: WEB_PORT
    type: port
    default: 8971
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_8554
    type: port
    default: 8554
    label:
      en: Port 8554
      uk: Порт 8554
    advanced: true
  - name: PORT_8555
    type: port
    default: 8555
    label:
      en: Port 8555
      uk: Порт 8555
    advanced: true
  - name: MEDIA_DIR
    type: folder
    default: "${DATA_ROOT}/Media"
    label:
      en: Media
      uk: Медіа
    hint:
      en: Inside the app it is /media/frigate
      uk: У застосунку вона — /media/frigate
permissions:
  privileged:
    en: Its authors run it with full access to the server
    uk: Автори запускають його з повним доступом до сервера
  devices:
    en: "It uses devices of the server: /dev/bus/usb, /dev/apex_0, /dev/video11, /dev/dri/renderD128"
    uk: "Він користується пристроями сервера: /dev/bus/usb, /dev/apex_0, /dev/video11, /dev/dri/renderD128"
