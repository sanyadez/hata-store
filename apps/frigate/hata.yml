settings:
  - name: WEB_PORT
    type: port
    default: 8971
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_8554
    type: port
    default: 8554
    label:
      en: Port 8554
      uk: Порт 8554
    advanced: true
  - name: PORT_8555
    type: port
    default: 8555
    label:
      en: Port 8555
      uk: Порт 8555
    advanced: true
  - name: MEDIA_DIR
    type: folder
    default: "${DATA_ROOT}/Media"
    label:
      en: Media
      uk: Медіа
    hint:
      en: Inside the app it is /media/frigate
      uk: У застосунку вона — /media/frigate
permissions:
  privileged:
    en: Its authors run it with full access to the server
    uk: Автори запускають його з повним доступом до сервера
  devices:
    en: "It uses devices of the server: /dev/bus/usb, /dev/apex_0, /dev/video11, /dev/dri/renderD128"
    uk: "Він користується пристроями сервера: /dev/bus/usb, /dev/apex_0, /dev/video11, /dev/dri/renderD128"
