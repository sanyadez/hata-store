title: RomM
tagline:
  en: RomM is a self-hosted ROM manager for managing and playing game collections.
  uk: RomM — власний менеджер ROM для керування та запуску колекцій ігор.
description:
  en: "RomM is a self-hosted game collection management app designed for emulator enthusiasts, offering a convenient way to scan, enrich, browse, and play games. Its responsive Web interface allows users to manage collections via any modern browser, supporting over 400 platforms, ideal for retro gaming fans building personal game libraries.\n\nThe app's core features include robust library management and seamless gameplay. It fetches metadata from IGDB, Screenscraper, and MobyGames, and custom artwork from SteamGridDB, enhancing the visual appeal of collections. Users can play games directly in the browser using EmulatorJS and RuffleRS, with support for multi-disk games, DLCs, patches, and manuals. It also enables parsing and filtering by filename tags for tailored organization. Additionally, it supports multi-user accounts with limited access permissions, allowing library sharing with friends and displaying RetroAchievements.\n\nIt can be flexibly deployed on personal servers or NAS devices, with official apps for Playnite and muOS enhancing cross-device access. Users can upload, update, or delete games via the Web interface, with community support documentation expanding functionality. Whether managing a personal retro game library or sharing with others, the app's intuitive interface and high customizability deliver a modern game management platform, meeting diverse needs.\n\n**Key Features:**\n- Scan and enhance your game library with metadata from IGDB, Screenscraper and MobyGames\n- Fetch custom artwork from SteamGridDB\n- Display your achievements from Retroachievements\n- Metadata available for 400+ platforms\n- Play games directly from the browser using EmulatorJS and RuffleRS\n- Share your library with friends with limited access and permissions\n- Official apps for Playnite and muOS\n- Supports multi-disk games, DLCs, mods, hacks, patches, and manuals\n- Parse and filter by tags in filenames\n- View, upload, update, and delete games from any modern web browser\n\n**Learn More:**\n- [RomM Official Website](https://romm.app)\n- [RomM GitHub Repository](https://github.com/rommapp/romm)"
  uk: "RomM — власний застосунок для керування колекцією ігор, створений для любителів емуляторів. Він дає змогу зручно сканувати, доповнювати, переглядати та запускати ігри. Адаптивний вебінтерфейс працює в будь-якому сучасному браузері й підтримує понад 400 платформ, тож підходить шанувальникам ретроігор, які збирають особисту бібліотеку.\n\nОснова застосунку — надійне керування бібліотекою та зручна гра. Він отримує метадані з IGDB, Screenscraper і MobyGames, а власні обкладинки — зі SteamGridDB, що робить колекцію привабливішою. Грати можна просто в браузері через EmulatorJS і RuffleRS, з підтримкою багатодискових ігор, DLC, патчів і посібників. Також можна розбирати й фільтрувати ігри за тегами в назвах файлів для зручного впорядкування. Є кілька облікових записів з обмеженими правами, тож бібліотекою можна ділитися з друзями, а ще показуються RetroAchievements.\n\nЙого можна гнучко розгорнути на власному сервері чи NAS, а офіційні застосунки для Playnite і muOS полегшують доступ з різних пристроїв. Завантажувати, оновлювати й видаляти ігри можна через вебінтерфейс, а документація від спільноти розширює можливості. Для особистої колекції ретроігор чи для спільного користування інтуїтивний інтерфейс і гнучкі налаштування роблять із застосунку сучасну платформу керування іграми.\n\n**Основні можливості:**\n- Скануйте й доповнюйте бібліотеку ігор метаданими з IGDB, Screenscraper і MobyGames\n- Отримуйте власні обкладинки зі SteamGridDB\n- Показуйте свої досягнення з Retroachievements\n- Метадані для понад 400 платформ\n- Грайте просто в браузері через EmulatorJS і RuffleRS\n- Діліться бібліотекою з друзями з обмеженим доступом і правами\n- Офіційні застосунки для Playnite і muOS\n- Підтримка багатодискових ігор, DLC, модів, хаків, патчів і посібників\n- Розбір і фільтрування за тегами в назвах файлів\n- Перегляд, завантаження, оновлення та видалення ігор у будь-якому сучасному браузері\n\n**Докладніше:**\n- [Офіційний вебсайт RomM](https://romm.app)\n- [Репозиторій RomM на GitHub](https://github.com/rommapp/romm)"
