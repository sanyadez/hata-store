title: Mosquitto
tagline:
  en: The message broker smart home devices talk through
  uk: Брокер повідомлень, через який спілкуються пристрої розумного дому
description:
  en: >
    An MQTT broker from the Eclipse Foundation. Sensors, switches, Zigbee2MQTT, Tasmota and ESPHome
    devices publish what they see to it, and Home Assistant or Node-RED read it and send commands
    back. Small, fast and keeps retained messages across restarts.
  uk: >
    Брокер MQTT від Eclipse Foundation. Датчики, вимикачі, Zigbee2MQTT, пристрої з Tasmota чи ESPHome
    надсилають до нього свої дані, а Home Assistant чи Node-RED читають їх і шлють команди назад.
    Маленький, швидкий і зберігає зафіксовані повідомлення між перезапусками.
notes:
  en: >
    It has no web page. Devices and apps connect to the server's address on the MQTT port with the
    user name and password chosen here: anonymous access is off, so a device on the home network
    cannot read or switch anything without them.
  uk: >
    Вебсторінки в нього немає. Пристрої й застосунки під'єднуються до адреси сервера на порт MQTT з
    обраними тут іменем і паролем: анонімний доступ вимкнено, тож без них жоден пристрій у домашній
    мережі нічого не прочитає й не перемкне.
category: home
developer: Eclipse Foundation
website: https://mosquitto.org
source: https://github.com/eclipse-mosquitto/mosquitto
icon: data:image/svg+xml;base64,
settings:
  - name: MQTT_PORT
    type: port
    default: 1883
    label: { en: MQTT port, uk: Порт MQTT }
  - name: MQTT_USER
    type: text
    default: mqtt
    required: true
    label: { en: User name, uk: Ім'я користувача }
    hint:
      en: What devices and apps sign in with
      uk: З ним входять пристрої й застосунки
  - name: MQTT_PASSWORD
    type: password
    required: true
    label: { en: Password, uk: Пароль }
