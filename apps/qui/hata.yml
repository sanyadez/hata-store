# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Qui
tagline:
  en: "Fast, modern web interface for qBittorrent"
  zh: 快速、现代的 qBittorrent 网页管理界面
  uk: Швидкий сучасний вебінтерфейс для qBittorrent
description:
  en: "**One dashboard for all your qBittorrent instances.** Qui is a fast, modern web interface for qBittorrent. Instead of juggling several separate WebUI tabs, you connect every qBittorrent instance to Qui and manage them all from a single, responsive dashboard. It ships as a lightweight single binary, so it stays quick and resource-friendly even when you are watching thousands of torrents.\n\n**Automation and cross-seeding built in.** Built by the team behind autobrr, Qui goes well beyond basic torrent listing. It adds powerful rule-based automation, built-in cross-seeding that automatically finds and adds matching torrents across your trackers, scheduled backups with restore, and a clean multi-language interface. Point it at your Torznab-compatible indexers — such as Prowlarr or Jackett — to put cross-seeding on autopilot, then filter, search, and bulk-manage torrents across every instance at once."
  zh: "**一个面板管理所有 qBittorrent 实例。** Qui 是一个快速、现代的 qBittorrent 网页界面。无需在多个独立的 WebUI 标签页之间切换，您只需将每个 qBittorrent 实例连接到 Qui，即可在一个响应迅速的面板中统一管理。它以轻量级单二进制文件的形式发布，即使在监控成千上万个种子时也能保持快速且占用资源极少。\n\n**内置自动化与交叉做种。** Qui 由 autobrr 团队打造，功能远不止于种子列表。它提供强大的基于规则的自动化、内置的交叉做种（自动在各个 tracker 之间查找并添加匹配的种子）、带恢复功能的定时备份，以及简洁的多语言界面。将其指向兼容 Torznab 的索引器（例如 Prowlarr 或 Jackett），即可让交叉做种自动运行，并可一次性跨所有实例筛选、搜索和批量管理种子。"
  uk: "**Одна панель для всіх ваших екземплярів qBittorrent.** Qui — швидкий сучасний вебінтерфейс для qBittorrent. Замість кількох окремих вкладок WebUI ви підключаєте всі екземпляри qBittorrent до Qui й керуєте ними з однієї адаптивної панелі. Це легкий окремий виконуваний файл, тож він лишається швидким і невибагливим до ресурсів, навіть коли ви стежите за тисячами торентів.\n\n**Автоматизація та cross-seeding уже вбудовані.** Qui створила команда autobrr, і він набагато більший за простий список торентів. У ньому є потужна автоматизація на основі правил, вбудований cross-seeding, що сам знаходить і додає збіжні торенти на різних трекерах, резервні копії за розкладом із відновленням і зручний багатомовний інтерфейс. Підключіть індексатори, сумісні з Torznab, як-от Prowlarr чи Jackett, щоб cross-seeding працював сам, а потім фільтруйте, шукайте й масово керуйте торентами одразу в усіх екземплярах."
notes:
  en: "## Getting Started\n\n## Cross-seeding & indexers\n\nQui can automatically find and add matching torrents across your trackers. Point it at your Torznab-compatible indexers (for example Prowlarr or Jackett) to enable cross-seeding.\n\n> A PostgreSQL database is deployed automatically alongside Qui — no manual setup required."
  zh: "## 快速开始\n\n## 交叉做种与索引器\n\nQui 可以自动在各个 tracker 之间查找并添加匹配的种子。将其指向兼容 Torznab 的索引器（例如 Prowlarr 或 Jackett）即可启用交叉做种。\n\n> Qui 会自动部署一个 PostgreSQL 数据库——无需手动配置。"
  uk: "## Початок роботи\n\n## Cross-seeding та індексатори\n\nQui може автоматично знаходити й додавати збіжні торенти на різних трекерах. Підключіть індексатори, сумісні з Torznab (наприклад, Prowlarr або Jackett), щоб увімкнути cross-seeding.\n\n> База даних PostgreSQL розгортається автоматично разом із Qui — налаштовувати нічого не потрібно."
