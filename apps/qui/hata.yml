settings:
  - name: WEB_PORT
    type: port
    default: 7476
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: QUI__DATABASE_ENGINE
    type: text
    default: postgres
    label:
      en: Database engine to use (postgres or sqlite)
      zh: 使用的数据库引擎（postgres 或 sqlite）
      uk: Рушій бази даних (postgres або sqlite)
  - name: POSTGRES_USER
    type: text
    default: qui
    label:
      en: PostgreSQL database user
      zh: PostgreSQL 数据库用户
      uk: Користувач бази даних PostgreSQL
  - name: POSTGRES_PASSWORD
    type: secret
    label:
      en: PostgreSQL database password
      zh: PostgreSQL 数据库密码
      uk: Пароль бази даних PostgreSQL
  - name: POSTGRES_DB
    type: text
    default: qui
    label:
      en: PostgreSQL database name
      zh: PostgreSQL 数据库名称
      uk: Назва бази даних PostgreSQL
