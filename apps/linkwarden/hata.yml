    type: port
    default: 3428
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: NEXTAUTH_URL
    type: text
    default: http://localhost:3000/api/v1/auth
    label:
      en: Environment variable NEXTAUTH_URL
      uk: Змінна середовища NEXTAUTH_URL
  - name: DB_PASSWORD
    type: secret
    label:
      en: Password between its services
      uk: Пароль між його сервісами
  - name: STORAGE_FOLDER
    type: text
    default: /data
    label:
      en: Environment variable STORAGE_FOLDER
      uk: Змінна середовища STORAGE_FOLDER
  - name: MEILI_HOST
    type: text
    default: http://linkwarden-meilisearch:7700
    label:
      en: Environment variable MEILI_HOST
      uk: Змінна середовища MEILI_HOST
  - name: DB_PASSWORD_2
    type: secret
    label:
      en: Password between its services
      uk: Пароль між його сервісами
  - name: NEXT_PUBLIC_DISABLE_REGISTRATION
    type: text
    default: "false"
    label:
      en: Environment variable NEXT_PUBLIC_DISABLE_REGISTRATION
      uk: Змінна середовища NEXT_PUBLIC_DISABLE_REGISTRATION
  - name: NEXT_PUBLIC_CREDENTIALS_ENABLED
    type: text
    default: "true"
    label:
      en: Environment variable NEXT_PUBLIC_CREDENTIALS_ENABLED
      uk: Змінна середовища NEXT_PUBLIC_CREDENTIALS_ENABLED
  - name: POSTGRES_USER
    type: text
    default: postgres
    label:
      en: Environment variable POSTGRES_USER
      uk: Змінна середовища POSTGRES_USER
  - name: POSTGRES_DB
    type: text
    default: linkwarden
    label:
      en: Environment variable POSTGRES_DB
      uk: Змінна середовища POSTGRES_DB
  - name: MEILI_ENV
    type: text
    default: production
    label:
      en: Environment variable MEILI_ENV
      uk: Змінна середовища MEILI_ENV
