title: Linkwarden
tagline:
  en: "Self-hosted collaborative bookmark manager to collect, read, annotate, and fully preserve what matters, all in one…"
  uk: "Спільний менеджер закладок на власному сервері: збирайте, читайте, коментуйте й зберігайте важливе."
description:
  en: "Linkwarden is an open-source self-hosted bookmark and web archive manager designed to help users collect, organize, and preserve important online content in one place. In addition to traditional bookmarking capabilities, it provides full webpage backup so valuable information remains safely accessible over time.\n\nBuilt around long-term content preservation, Linkwarden can automatically capture webpage screenshots, PDFs, and full HTML files to help prevent link rot. It also includes reading mode, annotations, local AI-powered tagging, full-text search, and a multi-level classification system for smarter and more efficient information management. Its modular architecture supports self-hosting, browser extensions, and cross-device sync.\n\nIn practice, Linkwarden is suitable not only for personal knowledge management and content collection, but also for team collaboration and shared curation. With collections and permission controls, users can organize content together and manage it publicly or privately. It is a modern bookmarking tool that balances data ownership, security, and collaboration.\n\n**Key Features:**\n\n- Full webpage archiving (screenshots, PDFs, HTML) to prevent link rot\n- AI-powered auto-tagging and full-text search\n- Reading mode, text highlighting, and annotations\n- Multi-level categories and tags for flexible organization\n- Team collaboration and permission management\n\n**Learn more:**\n\n- [Linkwarden GitHub](https://github.com/linkwarden/linkwarden)"
  uk: "Linkwarden — менеджер закладок і вебархіву з відкритим кодом для власного сервера, який допомагає збирати, впорядковувати та зберігати важливий онлайн-вміст в одному місці. Окрім звичайних закладок, він робить повну резервну копію вебсторінок, тож цінна інформація лишається доступною надовго.\n\nLinkwarden створений для довгострокового збереження вмісту: він може автоматично зберігати знімки сторінок, PDF і повні файли HTML, щоб посилання не «гнили». Також є режим читання, анотації, локальне ШІ-тегування, повнотекстовий пошук і багаторівнева класифікація для розумнішого й ефективнішого керування інформацією. Модульна архітектура підтримує розгортання на власному сервері, розширення для браузерів і синхронізацію між пристроями.\n\nНа практиці Linkwarden підходить не лише для особистого керування знаннями та збору вмісту, а й для спільної роботи та спільного добору матеріалів. Завдяки колекціям і керуванню дозволами користувачі можуть разом впорядковувати вміст і робити його публічним або приватним. Це сучасний інструмент закладок, який поєднує володіння даними, безпеку й співпрацю.\n\n**Основні можливості:**\n\n- Повне архівування вебсторінок (знімки екрана, PDF, HTML), щоб посилання не «гнили»\n- ШІ-теги та повнотекстовий пошук\n- Режим читання, виділення тексту й анотації\n- Багаторівневі категорії та теги для гнучкого впорядкування\n- Спільна робота та керування дозволами\n\n**Докладніше:**\n\n- [Linkwarden на GitHub](https://github.com/linkwarden/linkwarden)"
