# Apache-2.0, changed for Hata Store: see NOTICE
title: PyLoad
tagline:
  en: Free Downloader Manager.
  uk: Безкоштовний менеджер завантажень.
description:
  en: "pyLoad is a Free and Open Source download manager written in Python and designed to be extremely lightweight, easily extensible and fully manageable via web."
  uk: "pyLoad — безкоштовний менеджер завантажень з відкритим кодом, написаний на Python. Він дуже легкий, його просто розширювати, а керувати ним можна повністю через вебінтерфейс."
notes:
  en: "Default Account\n\n| Username | Password | |----------|----------| | `pyload`    | `pyload` |\n\nDefault Accessible Path in Pyload\n\n| Name | Value | | ---- | ----- | | Downloads Path | `/DATA/Downloads` |"
  uk: "Обліковий запис за промовчанням\n\n| Ім'я користувача | Пароль | |----------|----------| | `pyload`    | `pyload` |\n\nТека за промовчанням, доступна в PyLoad\n\n| Назва | Значення | | ---- | ----- | | Тека завантажень | `/DATA/Downloads` |"
category: media
developer: linuxserver
website: https://pyload.net
source: https://github.com/pyload/pyload
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: pyload
  port: 8000
settings:
  - name: WEB_PORT
    type: port
    default: 8000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_9666
    type: port
    default: 9666
    label:
      en: PyLoad listening Port (TCP)
      uk: Порт PyLoad (TCP)
    advanced: true
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: PyLoad Download Directory
      uk: Тека завантажень PyLoad
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
