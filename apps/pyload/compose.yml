# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  pyload:
    image: linuxserver/pyload-ng:0.5.0
    deploy:
      resources:
        reservations:
          memory: 256M
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    restart: unless-stopped
    privileged: false
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
    ports:
      - "${WEB_PORT:-8000}:8000"
      - "${PORT_9666:-9666}:9666"
