# Apache-2.0, changed for Hata Store: see NOTICE
services:
  photoprism:
    environment:
      PHOTOPRISM_ADMIN_PASSWORD: "${PHOTOPRISM_ADMIN_PASSWORD:?set PHOTOPRISM_ADMIN_PASSWORD}"
      PHOTOPRISM_UPLOAD_NSFW: "${PHOTOPRISM_UPLOAD_NSFW:-true}"
      TZ: "${TZ:-UTC}"
    image: photoprism/photoprism:260523
    deploy:
      resources:
        reservations:
          memory: 512M
    ports:
      - "${WEB_PORT:-2342}:2342"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/photoprism/storage"
        target: /photoprism/storage
      - type: bind
        source: "${GALLERY_DIR:-./Gallery}"
        target: /photoprism/originals
