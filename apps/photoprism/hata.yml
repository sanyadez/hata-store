# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: PhotoPrism
tagline:
  en: Browse Your Life in Images
  zh: 用照片回忆您的生活
  ar: تصفح وتنظيم ومشاركة مجموعة صورك
  de: "Durchsuchen, Organisieren und Teilen Ihrer Foto-Sammlung"
  es: "Navegar, organizar y compartir su colección de fotos"
  fr: "Parcourir, organiser et partager votre collection de photos"
  hu: "A fényképek böngészése, rendezése és megosztása"
  it: "Sfogliare, organizzare e condividere la tua collezione di foto"
  ru: "Просмотр, организация и обмен фотоколлекцией"
  pl: "Przeglądanie, organizowanie i udostępnianie kolekcji zdjęć"
  pt: "Navegando, organizando e compartilhando sua coleção de fotos"
  sv: "Bläddra, organisera och dela din fotokollektion"
  uk: Перегляд вашого життя в зображеннях
description:
  en: "Your AI-Powered Photos App for the Decentralized Web\n\nPhotoPrism brings the magic of AI to your home TV, phone, and multiple devices, revolutionizing the way you manage and share your photos. Unlike traditional photo albums that require manual organization, PhotoPrism automatically tags and finds your pictures, making it easier than ever to relive your memories. Whether you're showing family photos on your TV or sharing vacation snapshots on your phone, PhotoPrism makes the experience seamless and enjoyable.\n\nPhotoPrism offers a host of features designed to enhance your photo management experience. With powerful search capabilities, automatic tagging, and a user-friendly interface, you'll find it easy to keep your photo collection organized. The app is free to use, with premium options available for those seeking additional features and support. Users can expect a smooth, intuitive experience that blends cutting-edge technology with everyday convenience."
  zh: "您的去中心化的，AI驱动的照片应用程序\n\nPhotoPrism 将 AI 的魔力带入您的家庭电视、手机和多设备中，彻底改变了您管理和分享照片的方式。不像传统的照片相册需要手动整理，PhotoPrism 自动标记和查找您的照片，让您更轻松地重温美好回忆。无论是通过电视展示家庭照片，还是在手机上分享度假快照，PhotoPrism 都能使这一过程变得无缝且愉快。\n\nPhotoPrism 提供了一系列旨在增强您照片管理体验的功能。借助强大的搜索功能、自动标记和用户友好的界面，您将发现整理照片收藏变得轻而易举。该应用程序免费使用，并为那些寻求更多功能和支持的用户提供高级选项。用户可以期待一种融合前沿技术与日常便利的顺畅、直观的体验。"
  ar: PhotoPrism® هو تطبيق يعمل بقوة AI لاستعراض وتنظيم ومشاركة مجموعة صورك. يستخدمها التقنيات الأحدث للتسمية والعثور على الصور بشكل تلقائي دون أن يتدخل في طريقك. يمكنك تشغيله في المنزل أو على خادم خاص أو في السحابة.
  de: "PhotoPrism® ist eine mit AI betriebene App zum Durchsuchen, Organisieren und Teilen Ihrer Foto-Sammlung. Es nutzt die neuesten Technologien, um Bilder automatisch zu kennzeichnen und zu finden, ohne Sie dabei zu stören. Sie können es zu Hause, auf einem privaten Server oder in der Cloud ausführen."
  es: "PhotoPrism® es una aplicación impulsada por IA para navegar, organizar y compartir su colección de fotos. Hace uso de las últimas tecnologías para etiquetar y encontrar fotos automáticamente sin molestarte. Puedes ejecutarlo en casa, en un servidor privado o en la nube."
  fr: "PhotoPrism® est une application alimentée par l'IA pour parcourir, organiser et partager votre collection de photos. Il utilise les dernières technologies pour étiqueter et trouver des photos automatiquement sans vous déranger. Vous pouvez l'exécuter à la maison, sur un serveur privé ou dans le cloud."
  hu: "A PhotoPrism® egy AI-meghajtott alkalmazás, amely lehetővé teszi a fényképek böngészését, rendezését és megosztását. A legújabb technológiákat használja a képek automatikus címkézéséhez és megtalálásához, anélkül, hogy bármit is akadályozna. Otthon, egy privát szerveren vagy felhőben futtathatja."
  it: "PhotoPrism® è un'app alimentata da IA per sfogliare, organizzare e condividere la tua collezione di foto. Fa uso delle ultime tecnologie per etichettare e trovare le foto automaticamente senza disturbarti. Puoi eseguirlo a casa, su un server privato o in cloud."
  ru: "PhotoPrism® - это приложение, работающее на AI, для просмотра, организации и обмена фотоколлекцией. Оно использует последние технологии для автоматической маркировки и поиска фотографий без помех. Вы можете запустить его дома, на частном сервере или в облаке."
  pl: "PhotoPrism® to aplikacja napędzana przez AI do przeglądania, organizowania i udostępniania kolekcji zdjęć. Wykorzystuje najnowsze technologie do automatycznego oznaczania i wyszukiwania zdjęć bez przeszkadzania. Możesz uruchomić ją w domu, na prywatnym serwerze lub w chmurze."
  pt: "PhotoPrism® é um aplicativo alimentado por IA para navegar, organizar e compartilhar sua coleção de fotos. Ele usa as últimas tecnologias para marcar e encontrar fotos automaticamente sem te incomodar. Você pode executá-lo em casa, em um servidor privado ou na nuvem."
  sv: "PhotoPrism® är en AI-drivet app för att bläddra, organisera och dela din fotokollektion. Den använder de senaste teknologierna för att märka och hitta bilder automatiskt utan att störa dig. Du kan köra det hemma, på en privat server eller i molnet."
  uk: "Застосунок для фотографій на основі ШІ для децентралізованого вебу\n\nPhotoPrism приносить можливості ШІ на ваш домашній телевізор, телефон і інші пристрої та змінює те, як ви керуєте фотографіями й ділитеся ними. На відміну від звичайних фотоальбомів, які потрібно впорядковувати вручну, PhotoPrism сам позначає мітками та знаходить ваші знімки, тож згадувати події стало простіше, ніж будь-коли. Чи показуєте ви сімейні фото на телевізорі, чи ділитеся відпускними знімками з телефона, PhotoPrism робить це легким і приємним.\n\nPhotoPrism має багато функцій, які полегшують роботу з фотографіями. Завдяки потужному пошуку, автоматичним міткам і зручному інтерфейсу вашу колекцію легко тримати впорядкованою. Застосунком можна користуватися безкоштовно, а для тих, кому потрібні додаткові можливості та підтримка, є платні варіанти. Він працює плавно та інтуїтивно, поєднуючи сучасні технології зі щоденною зручністю."
notes:
