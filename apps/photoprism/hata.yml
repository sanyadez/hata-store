web:
  service: photoprism
  port: 2342
settings:
  - name: WEB_PORT
    type: port
    default: 2342
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: GALLERY_DIR
    type: folder
    default: "${DATA_ROOT}/Gallery"
    label:
      en: PhotoPrism originals directory
      zh: PhotoPrism 原始文件目录
      uk: Тека оригіналів PhotoPrism
    hint:
      en: Inside the app it is /photoprism/originals
      uk: У застосунку вона — /photoprism/originals
  - name: PHOTOPRISM_ADMIN_PASSWORD
    type: password
    required: true
    label:
      en: The password of admin
      zh: 管理员密码
      uk: Пароль адміністратора
  - name: PHOTOPRISM_UPLOAD_NSFW
    type: text
    default: "true"
    label:
      en: "true or false, is it possible to upload NSFW"
      zh: true 或 false，是否允许上传 NSFW
      uk: "true або false: чи можна завантажувати NSFW"
