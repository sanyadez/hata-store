title: Playit Agent
tagline:
  en: A free reverse proxy for tunneling services (not self-hosted).
  uk: Безкоштовний зворотний проксі для тунелювання сервісів (не на власному сервері).
description:
  en: A free reverse proxy for tunneling services (not self-hosted).
  uk: Безкоштовний зворотний проксі для тунелювання сервісів (не на власному сервері).
notes:
  en: "This is the agent for use with playit.gg's reverse proxy. After having installed the container/app, you have to go to the settings of the container/app and go to the logs. The logs will tell you to click a link to activate the agent. Copy the link (you will have to do it manually with your cursor) and paste it in your web browser in a new tab. This will open a page asking you to login or register. If you have an account already then you can login. If not, register an account. Once you're logged in, it will ask to allow the agent. Allow the agent and remember the agent name. Then head over to https://playit.gg/account/agents. From there you need to select the correct agent, according to the agent name you just were to remember. From there you can add tunnels. Choose the options for the tunnel as you need, and a port in case of doing it manually with TCP, UDP and TCP+UDP. After that use the provided domain and port to connect to the tunnel and use that to get access to your tunneled service!"
  uk: "Це агент для роботи зі зворотним проксі playit.gg. Після встановлення контейнера чи застосунку відкрийте його налаштування й перейдіть до журналів. У журналах буде посилання для активації агента. Скопіюйте посилання (це потрібно зробити вручну, виділивши його курсором) і вставте в браузері в новій вкладці. Відкриється сторінка входу чи реєстрації. Якщо обліковий запис уже є, увійдіть. Якщо ні — зареєструйтеся. Після входу вам запропонують дозволити агента. Дозвольте його й запам'ятайте ім'я агента. Потім перейдіть на https://playit.gg/account/agents. Там виберіть потрібного агента за ім'ям, яке ви щойно запам'ятали. Тоді можна додавати тунелі. Виберіть параметри тунелю на свій розсуд, а для налаштування вручну — порт у разі TCP, UDP або TCP+UDP. Після цього використовуйте надані домен і порт, щоб підключатися до тунелю та отримувати доступ до вашого сервісу!"
