title: Gatus
tagline:
  en: A status page that checks your sites and services and warns when one fails
  uk: Сторінка стану, що перевіряє ваші сайти й сервіси і попереджає, коли щось падає
description:
  en: >
    A status page driven by one config file. It checks web addresses, ports, DNS and certificates on a
    schedule, compares the answers with your conditions (status, time, content) and shows the history
    of each, and can alert you in Telegram, ntfy, e-mail and many other services.
  uk: >
    Сторінка стану, якою керує один файл налаштувань. За розкладом перевіряє вебадреси, порти, DNS і
    сертифікати, порівнює відповіді з вашими умовами (код, час, вміст), показує історію кожної перевірки
    й може сповіщати в Telegram, ntfy, на пошту та в багато інших сервісів.
notes:
  en: >
    What it checks is written in **config/config.yaml** in the app's data folder; the first one checks
    the internet and DNS and has examples to copy. Gatus reads the file again by itself after it is saved.
  uk: >
    Що перевіряти, записано у **config/config.yaml** у теці даних застосунку; перший файл перевіряє
    інтернет і DNS та має приклади, які можна скопіювати. Після збереження Gatus сам перечитує файл.
category: monitoring
developer: TwiN
website: https://gatus.io
source: https://github.com/TwiN/gatus
icon: data:image/svg+xml;base64,
web:
  service: gatus
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label: { en: Web port, uk: Порт вебінтерфейсу }
