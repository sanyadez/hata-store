title: Langflow
tagline:
  en: Open-source UI for building and debugging multi-agent and RAG applications
  uk: Інтерфейс з відкритим кодом для створення та налагодження мультиагентних застосунків і RAG
description:
  en: "Langflow is a powerful, open-source UI designed specifically for building and debugging multi-agent and Retrieval-Augmented Generation (RAG) applications. It provides a visual, drag-and-drop interface that simplifies the process of creating complex AI workflows.\n\nThe system consists of two main components:\n- **Langflow**: The main application providing a visual interface for building AI workflows\n- **PostgreSQL**: A robust database system for storing application data and configurations\n\n**Key Features:**\n- Visual, drag-and-drop interface for building AI workflows\n- Support for multi-agent systems and RAG applications\n- Integrated debugging tools for testing and optimization\n- Persistent storage for workflows and configurations\n- Easy deployment with Docker containers\n\n**Learn More:**\n- [Langflow Official Website](https://www.langflow.org)\n- [Langflow GitHub Repository](https://github.com/langflow-ai/langflow)\n- [Documentation](https://docs.langflow.org)"
  uk: "Langflow — потужний інтерфейс з відкритим кодом, створений спеціально для побудови та налагодження мультиагентних застосунків і застосунків із генерацією з доповненням пошуком (RAG). Візуальний інтерфейс із перетягуванням спрощує створення складних ШІ-процесів.\n\nСистема складається з двох основних компонентів:\n- **Langflow**: головний застосунок із візуальним інтерфейсом для створення ШІ-процесів\n- **PostgreSQL**: надійна система баз даних для зберігання даних і конфігурацій застосунку\n\n**Основні можливості:**\n- Візуальний інтерфейс із перетягуванням для створення ШІ-процесів\n- Підтримка мультиагентних систем і застосунків RAG\n- Вбудовані інструменти налагодження для тестування та оптимізації\n- Постійне зберігання процесів і конфігурацій\n- Просте розгортання в контейнерах Docker\n\n**Докладніше:**\n- [Офіційний сайт Langflow](https://www.langflow.org)\n- [Репозиторій Langflow на GitHub](https://github.com/langflow-ai/langflow)\n- [Документація](https://docs.langflow.org)"
category: ai
developer: langflowai
website: https://www.langflow.org
source: https://github.com/langflow-ai/langflow
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: langflow
  port: 7860
settings:
  - name: WEB_PORT
    type: port
    default: 17860
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: LANGFLOW_SUPERUSER
    type: text
    default: admin
    required: true
    label:
      en: "Administrator's user name"
      uk: "Ім'я адміністратора"
  - name: LANGFLOW_SUPERUSER_PASSWORD
    type: password
    required: true
    label:
      en: "Administrator's password"
      uk: Пароль адміністратора
  - name: LANGFLOW_CONFIG_DIR
    type: text
    default: /app/langflow
    label:
      en: Directory for Langflow Configuration Files
      uk: Тека файлів конфігурації Langflow
  - name: POSTGRES_USER
    type: text
    default: langflow
    label:
      en: PostgreSQL Username
      uk: Користувач PostgreSQL
  - name: POSTGRES_PASSWORD
    type: secret
    label:
      en: PostgreSQL Password
      uk: Пароль PostgreSQL
  - name: POSTGRES_DB
    type: text
    default: langflow
    label:
      en: PostgreSQL Database Name
      uk: Назва бази даних PostgreSQL
