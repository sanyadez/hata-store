# Apache-2.0, changed for Hata Store: see NOTICE
services:
  langflow:
    image: langflowai/langflow:1.13.0
    user: 0:0
    ports:
      - "${WEB_PORT:-17860}:7860"
    depends_on:
      - langflow-postgres
    networks:
      - langflow-net
    environment:
      LANGFLOW_DATABASE_URL: "postgresql://langflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@langflow-postgres:5432/langflow"
      LANGFLOW_CONFIG_DIR: "${LANGFLOW_CONFIG_DIR:-/app/langflow}"
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: "${LANGFLOW_SUPERUSER:-admin}"
      LANGFLOW_SUPERUSER_PASSWORD: "${LANGFLOW_SUPERUSER_PASSWORD:?set LANGFLOW_SUPERUSER_PASSWORD}"
    volumes:
      - "${APP_DATA:-.}/backend:/app/langflow"
    restart: unless-stopped
  langflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-langflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-langflow}"
    networks:
      - langflow-net
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/postgres"
        target: /var/lib/postgresql/data
    restart: unless-stopped
networks:
  langflow-net:
    driver: bridge
