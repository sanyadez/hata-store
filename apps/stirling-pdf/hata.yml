title: Stirling-PDF
tagline:
  en: Every PDF tool in one place, on your own server
  uk: Усі інструменти для PDF в одному місці, на вашому сервері
description:
  en: >
    Merge, split, rotate, compress, sign and convert PDF files in the browser — dozens of tools,
    among them text recognition in scans and conversion from Word documents and pictures. The files
    are handled on your server and sent nowhere.
  uk: >
    Об'єднуйте, розділяйте, повертайте, стискайте, підписуйте й перетворюйте PDF у браузері —
    десятки інструментів, серед них розпізнавання тексту в сканах і перетворення з документів Word
    та зображень. Файли обробляються на вашому сервері й нікуди не надсилаються.
notes:
  en: >
    It asks for no sign-in: anybody on the home network can use it. If that matters, turn on
    Hata's sign-in for it.
  uk: >
    Входу не потребує: ним може користуватися будь-хто в домашній мережі. Якщо це важливо,
    увімкніть для нього вхід через Hata.
category: productivity
developer: Stirling Tools
website: https://www.stirlingpdf.com
source: https://github.com/Stirling-Tools/Stirling-PDF
icon: data:image/svg+xml;base64,
web:
  service: stirling-pdf
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label: { en: Web port, uk: Порт вебінтерфейсу }
