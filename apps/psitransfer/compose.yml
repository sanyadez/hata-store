# Apache-2.0, changed for Hata Store: see NOTICE
services:
  psitransfer:
    image: psitrax/psitransfer:v2.4.4
    ports:
      - "${WEB_PORT:-13001}:3000"
    environment:
      PSITRANSFER_ADMIN_PASS: "${PSITRANSFER_ADMIN_PASS:?set PSITRANSFER_ADMIN_PASS}"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
    deploy:
      resources:
        reservations:
          memory: 256M
    restart: unless-stopped
