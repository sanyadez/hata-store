# Apache-2.0, changed for Hata Store: see NOTICE
title: PsiTransfer
tagline:
  en: "A simple, open-source file sharing host."
  uk: Простий сервіс обміну файлами з відкритим кодом.
description:
  en: "PsiTransfer is a simple, self-hosted open-source file sharing service that allows you to share files securely and easily without registration.\n\n**Key Features:**\n- **No Registration Required:** Share files instantly without creating an account.\n- **Privacy and Control:** All files are stored on your own server, giving you complete control over your data.\n- **Password Protection:** Protect shared files with a password for enhanced security.\n- **Upload Expiry:** Set uploaded files to automatically expire after a specific time to save storage space.\n- **Admin Panel:** Manage all uploads through a clean admin panel.\n- **Delivery Target:** Send files to predefined email addresses (configuration required).\n- **Responsive Web Interface:** Clean and user-friendly interface that works perfectly on all devices.\n\n**Learn More:**\n- [PsiTransfer GitHub Repository](https://github.com/psi-4ward/psitransfer)"
  uk: "PsiTransfer — простий власний сервіс обміну файлами з відкритим кодом, що дає змогу безпечно й легко ділитися файлами без реєстрації.\n\n**Основні можливості:**\n- **Без реєстрації:** діліться файлами одразу, не створюючи облікового запису.\n- **Приватність і контроль:** усі файли зберігаються на вашому сервері, тож ваші дані повністю у ваших руках.\n- **Захист паролем:** захистіть файли паролем для більшої безпеки.\n- **Термін зберігання:** налаштуйте автоматичне видалення завантажених файлів через певний час, щоб заощадити місце.\n- **Панель адміністратора:** керуйте всіма завантаженнями в зручній панелі.\n- **Надсилання на пошту:** відправляйте файли на задані адреси електронної пошти (потрібне налаштування).\n- **Адаптивний вебінтерфейс:** охайний і зручний інтерфейс, що чудово працює на всіх пристроях.\n\n**Докладніше:**\n- [Репозиторій PsiTransfer на GitHub](https://github.com/psi-4ward/psitransfer)"
category: productivity
developer: psitrax
website: https://github.com/psi-4ward/psitransfer
source: https://github.com/psi-4ward/psitransfer
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: psitransfer
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 13001
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PSITRANSFER_ADMIN_PASS
    type: password
    required: true
    label:
      en: Password for the administrator account
      uk: Пароль облікового запису адміністратора
