title: BookStack
tagline:
  en: A wiki for the household, laid out like books on a shelf
  uk: Вікі для дому, впорядкована, як книжки на полиці
description:
  en: >
    A simple wiki where knowledge is kept on shelves, in books, chapters and pages: manuals for the
    appliances, recipes, notes about the house and the car. A plain editor or Markdown, pictures and
    attachments, search across everything, and accounts with their own rights.
  uk: >
    Проста вікі, де знання лежать на полицях, у книжках, розділах і на сторінках: інструкції до
    техніки, рецепти, нотатки про дім і машину. Звичайний редактор або Markdown, зображення й
    вкладення, пошук усім вмістом і облікові записи з власними правами.
notes:
  en: >
    Sign in the first time as **admin@admin.com** with the password **password** and change both at
    once. Pictures in pages keep the address they were added at: set up Hata's domain before filling
    the wiki.
  uk: >
    Уперше увійдіть як **admin@admin.com** з паролем **password** і відразу змініть обидва.
    Зображення на сторінках зберігають адресу, з якою їх додали: налаштуйте домен Hata, перш ніж
    наповнювати вікі.
category: productivity
developer: Dan Brown
website: https://www.bookstackapp.com
source: https://codeberg.org/bookstack/bookstack
icon: data:image/svg+xml;base64,
web:
  service: bookstack
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 6875
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: APP_KEY
    type: secret
    length: 32
    label: { en: Encryption key, uk: Ключ шифрування }
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
  - name: DB_ROOT_PASSWORD
    type: secret
    label: { en: Database administrator's password, uk: Пароль адміністратора бази даних }
