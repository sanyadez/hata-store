title: Transmission
tagline:
  en: Transmission is a cross-platform BitTorrent client
  uk: Transmission — кросплатформний BitTorrent-клієнт
description:
  en: "Transmission is a BitTorrent client designed for simplicity and powerful performance, delivering an efficient and user-friendly downloading experience. It comes equipped with all the essential features you expect, including encryption, a web interface, peer exchange, magnet links, DHT, µTP, UPnP and NAT-PMP port forwarding, webseed support, watch directories, tracker editing, global and per-torrent speed limits, and more.\n\nWith its intuitive interface, Transmission caters to both beginners and advanced users. Whether you’re managing a single download or juggling complex torrent queues, Transmission ensures a seamless experience with optimized resource usage and reliable performance. For casual users and tech enthusiasts alike, Transmission is the ideal BitTorrent solution."
  uk: "Transmission — BitTorrent-клієнт, створений бути простим і швидким, для зручного й ефективного завантаження. Він має все потрібне: шифрування, вебінтерфейс, обмін пірами, magnet-посилання, DHT, µTP, прокидання портів через UPnP і NAT-PMP, підтримку webseed, теки спостереження, редагування трекерів, глобальні та окремі для кожного торента обмеження швидкості тощо.\n\nІнтуїтивний інтерфейс підходить і новачкам, і досвідченим користувачам. Чи ви керуєте одним завантаженням, чи складною чергою торентів, Transmission працює плавно, економно витрачає ресурси та надійно. Для звичайних користувачів і технічних ентузіастів це ідеальне рішення для BitTorrent."
category: media
developer: Transmission
website: https://transmissionbt.com/
source: https://github.com/transmission/transmission
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: transmission
  port: 9091
settings:
  - name: WEB_PORT
    type: port
    default: 9091
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_51413
    type: port
    default: 51413
    label:
      en: Port 51413
      uk: Порт 51413
    advanced: true
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads
      uk: Завантаження
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
  - name: WATCH_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads/watch"
    label:
      en: Downloads/watch
      uk: Завантаження/watch
    hint:
      en: Inside the app it is /watch
      uk: У застосунку вона — /watch
  - name: PASS
    type: password
    required: true
    label:
      en: Password to sign in
      uk: Пароль для входу
  - name: USER
    type: text
    default: admin
    required: true
    label:
      en: User name
      uk: "Ім'я користувача"
