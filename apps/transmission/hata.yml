title:
  en: Transmission
tagline:
  en: Transmission is a cross-platform BitTorrent client
  it: Transmission è un client BitTorrent multipiattaforma
  nb: Transmission er en kryssplattform BitTorrent-klient
  zh: Transmission 是一个跨平台的 BitTorrent 客户端
  ja: Transmission はクロスプラットフォームの BitTorrent クライアントです
  ko: Transmission은 크로스 플랫폼 BitTorrent 클라이언트입니다
  fr: Transmission est un client BitTorrent multiplateforme
  de: Transmission ist ein plattformübergreifender BitTorrent-Client
  sv: Transmission är en plattformsoberoende BitTorrent-klient
  el: Το Transmission είναι ένας πελάτης BitTorrent πολλαπλών πλατφορμών
  hr: Transmission je višeplatformski BitTorrent klijent
  pt: Transmission é um cliente BitTorrent multiplataforma
  ru: Transmission — это кроссплатформенный BitTorrent-клиент
  tr: "Transmission, platformlar arası bir BitTorrent istemcisidir"
  uk: Transmission — кросплатформний BitTorrent-клієнт
description:
  en: "Transmission is a BitTorrent client designed for simplicity and powerful performance, delivering an efficient and user-friendly downloading experience. It comes equipped with all the essential features you expect, including encryption, a web interface, peer exchange, magnet links, DHT, µTP, UPnP and NAT-PMP port forwarding, webseed support, watch directories, tracker editing, global and per-torrent speed limits, and more.\n\nWith its intuitive interface, Transmission caters to both beginners and advanced users. Whether you’re managing a single download or juggling complex torrent queues, Transmission ensures a seamless experience with optimized resource usage and reliable performance. For casual users and tech enthusiasts alike, Transmission is the ideal BitTorrent solution."
  it: "Transmission è un client BitTorrent progettato per la semplicità e le prestazioni potenti, offrendo un'esperienza di download efficiente e user-friendly. È dotato di tutte le funzionalità essenziali che ti aspetti, tra cui crittografia, un'interfaccia web, scambio di peer, link magnetici, DHT, µTP, port forwarding UPnP e NAT-PMP, supporto webseed, directory di monitoraggio, modifica del tracker, limiti di velocità globali e per torrent, e altro ancora.\n\nCon la sua interfaccia intuitiva, Transmission si rivolge sia ai principianti che agli utenti avanzati. Che tu stia gestendo un singolo download o bilanciando code di torrent complesse, Transmission garantisce un'esperienza senza interruzioni con un utilizzo ottimizzato delle risorse e prestazioni affidabili. Per gli utenti occasionali e gli appassionati di tecnologia, Transmission è la soluzione BitTorrent ideale."
  nb: "Transmission er en BitTorrent-klient designet for enkelhet og kraftig ytelse, og leverer en effektiv og brukervennlig nedlastingsopplevelse. Den er utstyrt med alle de essensielle funksjonene du forventer, inkludert kryptering, et webgrensesnitt, peer-utveksling, magnetlenker, DHT, µTP, UPnP og NAT-PMP portvideresending, webseed-støtte, overvåkingsmapper, tracker-redigering, globale og per-torrent hastighetsbegrensninger, og mer.\n\nMed sitt intuitive grensesnitt henvender Transmission seg til både nybegynnere og avanserte brukere. Enten du administrerer en enkelt nedlasting eller sjonglerer komplekse torrentkøer, sikrer Transmission en sømløs opplevelse med optimalisert ressursbruk og pålitelig ytelse. For tilfeldige brukere og teknologientusiaster er Transmission den ideelle BitTorrent-løsningen."
  zh: "Transmission 是一款 BitTorrent 客户端，专为简单性和强大性能而设计，提供高效且用户友好的下载体验。它配备了您期望的所有基本功能，包括加密、Web 界面、peer 交换、磁力链接、DHT、µTP、UPnP 和 NAT-PMP 端口转发、webseed 支持、监视目录、tracker 编辑、全局和每个 torrent 的速度限制等。\n\nTransmission 凭借其直观的界面，适合初学者和高级用户。无论您是管理单个下载还是处理复杂的 torrent 队列，Transmission 都能确保以优化的资源使用和可靠的性能提供无缝体验。对于普通用户和技术爱好者来说，Transmission 是理想的 BitTorrent 解决方案。"
  ja: "Transmissionは、シンプルさと強力なパフォーマンスを追求して設計されたBitTorrentクライアントで、効率的でユーザーフレンドリーなダウンロード体験を提供します。暗号化、Webインターフェース、ピア交換、マグネットリンク、DHT、µTP、UPnPおよびNAT-PMPポートフォワーディング、webseedサポート、監視ディレクトリ、トラッカー編集、グローバルおよびトレントごとの速度制限など、期待されるすべての基本機能が搭載されています。\n\n直感的なインターフェースにより、Transmissionは初心者から上級者まで対応しています。単一のダウンロードを管理する場合でも、複雑なトレントキューをやりくりする場合でも、Transmissionは最適化されたリソース使用と信頼性の高いパフォーマンスでシームレスな体験を保証します。カジュアルユーザーとテクノロジー愛好家の両方にとって、Transmissionは理想的なBitTorrentソリューションです。"
  ko: "Transmission은 간결함과 강력한 성능을 위해 설계된 BitTorrent 클라이언트로, 효율적이고 사용자 친화적인 다운로드 경험을 제공합니다. 암호화, 웹 인터페이스, 피어 교환, 마그넷 링크, DHT, µTP, UPnP 및 NAT-PMP 포트 포워딩, 웹시드 지원, 감시 디렉토리, 트래커 편집, 전역 및 토렌트별 속도 제한 등 기대하는 모든 필수 기능이 탑재되어 있습니다.\n\n직관적인 인터페이스를 갖춘 Transmission은 초보자와 고급 사용자 모두에게 적합합니다. 단일 다운로드를 관리하든 복잡한 토렌트 대기열을 처리하든, Transmission은 최적화된 리소스 사용과 안정적인 성능으로 원활한 경험을 보장합니다. 일반 사용자와 기술 애호가 모두에게 Transmission은 이상적인 BitTorrent 솔루션입니다。"
  fr: "Transmission est un client BitTorrent conçu pour la simplicité et des performances puissantes, offrant une expérience de téléchargement efficace et conviviale. Il est équipé de toutes les fonctionnalités essentielles que vous attendez, y compris le chiffrement, une interface web, l'échange de pairs, les liens magnet, DHT, µTP, le redirection de port UPnP et NAT-PMP, la prise en charge des webseeds, les répertoires de surveillance, l'édition de trackers, les limites de vitesse globales et par torrent, et plus encore.\n\nAvec son interface intuitive, Transmission s'adresse aussi bien aux débutants qu'aux utilisateurs avancés. Que vous gériez un seul téléchargement ou que vous jongliez avec des files d'attente de torrents complexes, Transmission garantit une expérience fluide avec une utilisation optimisée des ressources et des performances fiables. Pour les utilisateurs occasionnels et les passionnés de technologie, Transmission est la solution BitTorrent idéale。"
  de: "Transmission ist ein BitTorrent-Client, der für Einfachheit und leistungsstarke Performance entwickelt wurde und ein effizientes und benutzerfreundliches Download-Erlebnis bietet. Er ist mit allen wesentlichen Funktionen ausgestattet, die Sie erwarten, darunter Verschlüsselung, eine Weboberfläche, Peer-Austausch, Magnet-Links, DHT, µTP, UPnP- und NAT-PMP-Portweiterleitung, Webseed-Unterstützung, Überwachungsverzeichnisse, Tracker-Bearbeitung, globale und torrent-spezifische Geschwindigkeitsbegrenzungen und mehr.\n\nMit seiner intuitiven Benutzeroberfläche richtet sich Transmission sowohl an Anfänger als auch an fortgeschrittene Benutzer. Egal, ob Sie einen einzelnen Download verwalten oder komplexe Torrent-Warteschlangen jonglieren, Transmission sorgt für ein nahtloses Erlebnis mit optimierter Ressourcennutzung und zuverlässiger Leistung. Für Gelegenheitsnutzer und Technikbegeisterte gleichermaßen ist Transmission die ideale BitTorrent-Lösung。"
  sv: "Transmission är en BitTorrent-klient designad för enkelhet och kraftfull prestanda, som levererar en effektiv och användarvänlig nedladdningsupplevelse. Den är utrustad med alla de väsentliga funktioner du förväntar dig, inklusive kryptering, ett webbgränssnitt, peer-utbyte, magnetlänkar, DHT, µTP, UPnP och NAT-PMP portvidarebefordran, webseed-stöd, övervakningsmappar, tracker-redigering, globala och per-torrent hastighetsbegrensningar, och mer.\n\nMed sitt intuitiva gränssnitt vänder sig Transmission till både nybörjare och avancerade användare. Oavsett om du hanterar en enskild nedladdning eller jonglerar med komplexa torrentköer, ser Transmission till en sömlös upplevelse med optimerad resursanvändning och pålitlig prestanda. För tillfälliga användare och teknikentusiaster är Transmission den idealiska BitTorrent-lösningen。"
  el: "Το Transmission είναι ένας πελάτης BitTorrent σχεδιασμένος για απλότητα και ισχυρή απόδοση, προσφέροντας μια αποτελεσματική και φιλική προς τον χρήστη εμπειρία λήψης. Είναι εξοπλισμένο με όλα τα απαραίτητα χαρακτηριστικά που περιμένετε, συμπεριλαμβανομένης της κρυπτογράφησης, μιας διεπαφής ιστού, ανταλλαγής peer, μαγνητικών συνδέσμων, DHT, µTP, προώθησης θυρών UPnP και NAT-PMP, υποστήριξης webseed, φακέλων παρακολούθησης, επεξεργασίας tracker, παγκόσμιων και ανά torrent ορίων ταχύτητας, και πολλά άλλα.\n\nΜε τη διαισθητική του διεπαφή, το Transmission απευθύνεται τόσο σε αρχάριους όσο και σε προχωρημένους χρήστες. Είτε διαχειρίζεστε μια μεμονωμένη λήψη είτε χειρίζεστε σύνθετες ουρές torrent, το Transmission εξασφαλίζει μια απρόσκοπτη εμπειρία με βελτιστοποιημένη χρήση πόρων και αξιόπιστη απόδοση. Για τους περιστασιακούς χρήστες και τους λάτρεις της τεχνολογίας, το Transmission είναι η ιδανική λύση BitTorrent。"
  hr: "Transmission je BitTorrent klijent dizajniran za jednostavnost i snažne performanse, pružajući učinkovito i korisnički prijateljsko iskustvo preuzimanja. Opremljen je svim bitnim značajkama koje očekujete, uključujući šifriranje, web sučelje, razmjenu peerova, magnetne veze, DHT, µTP, UPnP i NAT-PMP prosljeđivanje portova, podršku za webseed, nadzirane direktorije, uređivanje trackera, globalna i po torrentu ograničenja brzine, i još mnogo toga.\n\nSa svojim intuitivnim sučeljem, Transmission se obraća i početnicima i naprednim korisnicima. Bilo da upravljate jednim preuzimanjem ili žonglirate složenim redovima torrenta, Transmission osigurava besprijekorno iskustvo s optimiziranim korištenjem resursa i pouzdanim performansama. Za povremene korisnike i tehnološke entuzijaste, Transmission je idealno BitTorrent rješenje。"
  pt: "Transmission é um cliente BitTorrent projetado para simplicidade e desempenho poderoso, proporcionando uma experiência de download eficiente e amigável. Ele vem equipado com todas as funcionalidades essenciais que você espera, incluindo encriptação, uma interface web, troca de peers, links magnéticos, DHT, µTP, encaminhamento de portas UPnP e NAT-PMP, suporte a webseed, diretórios de vigilância, edição de trackers, limites de velocidade globais e por torrent, e muito mais.\n\nCom sua interface intuitiva, Transmission atende tanto a iniciantes quanto a utilizadores avançados. Seja gerindo um único download ou lidando com filas complexas de torrents, Transmission garante uma experiência fluida com uso otimizado de recursos e desempenho confiável. Para utilizadores casuais e entusiastas da tecnologia, Transmission é a solução BitTorrent ideal。"
  ru: "Transmission — это BitTorrent-клиент, разработанный для простоты и мощной производительности, обеспечивающий эффективный и удобный опыт загрузки. Он оснащен всеми основными функциями, которые вы ожидаете, включая шифрование, веб-интерфейс, обмен пирами, магнитные ссылки, DHT, µTP, перенаправление портов UPnP и NAT-PMP, поддержку webseed, отслеживание директорий, редактирование трекеров, глобальные и индивидуальные для каждого торрента ограничения скорости и многое другое.\n\nБлагодаря интуитивно понятному интерфейсу Transmission подходит как для начинающих, так и для продвинутых пользователей. Управляете ли вы одной загрузкой или жонглируете сложными очередями торрентов, Transmission обеспечивает бесперебойную работу с оптимизированным использованием ресурсов и надежной производительностью. Для обычных пользователей и технических энтузиастов Transmission является идеальным решением для BitTorrent。"
  tr: "Transmission, basitlik ve güçlü performans için tasarlanmış bir BitTorrent istemcisidir ve verimli ve kullanıcı dostu bir indirme deneyimi sunar. Şifreleme, web arayüzü, eş değişimi, manyetik bağlantılar, DHT, µTP, UPnP ve NAT-PMP bağlantı noktası yönlendirme, webseed desteği, izleme dizinleri, izleyici düzenleme, global ve torrent başına hız limitleri ve daha fazlası gibi beklediğiniz tüm temel özelliklerle donatılmıştır.\n\nSezgisel arayüzü ile Transmission, hem yeni başlayanlara hem de ileri düzey kullanıcılara hitap eder. Tek bir indirmeyi yönetiyor olun ya da karmaşık torrent kuyruklarıyla uğraşıyor olun, Transmission optimize edilmiş kaynak kullanımı ve güvenilir performans ile sorunsuz bir deneyim sağlar. Gündelik kullanıcılar ve teknoloji meraklıları için Transmission, ideal BitTorrent çözümüdür。"
  uk: "Transmission — BitTorrent-клієнт, створений бути простим і швидким, для зручного й ефективного завантаження. Він має все потрібне: шифрування, вебінтерфейс, обмін пірами, magnet-посилання, DHT, µTP, прокидання портів через UPnP і NAT-PMP, підтримку webseed, теки спостереження, редагування трекерів, глобальні та окремі для кожного торента обмеження швидкості тощо.\n\nІнтуїтивний інтерфейс підходить і новачкам, і досвідченим користувачам. Чи ви керуєте одним завантаженням, чи складною чергою торентів, Transmission працює плавно, економно витрачає ресурси та надійно. Для звичайних користувачів і технічних ентузіастів це ідеальне рішення для BitTorrent."
