  - name: PORT_51413
    type: port
    default: 51413
    label:
      en: Port 51413
      uk: Порт 51413
    advanced: true
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads
      uk: Завантаження
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
  - name: WATCH_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads/watch"
    label:
      en: Downloads/watch
      uk: Завантаження/watch
    hint:
      en: Inside the app it is /watch
      uk: У застосунку вона — /watch
  - name: USER
    type: text
    default: admin
    required: true
    label:
      en: User name
      uk: "Ім'я користувача"
