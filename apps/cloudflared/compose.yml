# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  cloudflared:
    image: wisdomsky/cloudflared-web:2026.10.0
    restart: unless-stopped
    network_mode: host
    ports:
      - "${WEB_PORT:-14333}:14333"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
