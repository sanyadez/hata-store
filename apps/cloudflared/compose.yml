# Apache-2.0, changed for Hata Store: see NOTICE
services:
  cloudflared:
    image: wisdomsky/cloudflared-web:2026.11.1
    restart: unless-stopped
    network_mode: host
    ports:
      - "${WEB_PORT:-14333}:14333"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
