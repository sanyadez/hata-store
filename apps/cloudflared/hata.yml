title:
  en: Cloudflared
tagline:
  en: A tunneling daemon by Cloudflare that safely exposes your web servers into the internet.
  it: Un demone di tunneling di Cloudflare che espone in modo sicuro i tuoi server web su Internet.
  nb: En tunnel-demon fra Cloudflare som trygt eksponerer webserverne dine på internett.
  zh: Cloudflare提供的隧道守护程序，可安全地将您的Web服务器暴露在互联网上。
  ja: Cloudflareが提供するトンネリングデーモンで、Webサーバーを安全にインターネットに公開します。
  ko: Cloudflare의 터널링 데몬으로 웹 서버를 안전하게 인터넷에 노출시킵니다.
  fr: Un démon de tunneling par Cloudflare qui expose en toute sécurité vos serveurs web à Internet.
  de: "Ein Tunnel-Daemon von Cloudflare, der Ihre Webserver sicher im Internet verfügbar macht."
  sv: En tunneldaemon från Cloudflare som säkert exponerar dina webbservrar på internet.
  el: Ένα δαίμονα διοχέτευσης από την Cloudflare που εκθέτει με ασφάλεια τους διακομιστές σας στο διαδίκτυο.
  hr: Cloudflareov tunelski demon koji sigurno izlaže vaše web poslužitelje na internet.
  pt: Um daemon de tunneling da Cloudflare que expõe com segurança os seus servidores web à internet.
  ru: "Демон туннелирования от Cloudflare, который безопасно открывает ваши веб-серверы в интернете."
  tr: Cloudflare tarafından sunulan bir tünel servisi olup web sunucularınızı güvenli bir şekilde internete açar.
  uk: "Демон тунелювання від Cloudflare, що безпечно відкриває ваші вебсервери в інтернет."
description:
  en: "Cloudflare Tunnel offers an easy way to expose web servers securely to the internet, without opening up firewall ports and configuring ACLs. Cloudflare Tunnel also ensures requests route through Cloudflare before reaching the web server, so you can be sure attack traffic is stopped with Cloudflare’s WAF and Unmetered DDoS mitigation, and authenticated with Access if you’ve enabled those features for your account.\n\nThe software provides a seamless way to securely expose web servers to the internet without configuring firewall ports or access control lists (ACLs). All requests are routed through Cloudflare before reaching your web server, leveraging Cloudflare’s Web Application Firewall (WAF) and unmetered DDoS mitigation to block attack traffic, with optional authentication via Cloudflare Access if enabled. With its intuitive Web interface and efficient tunnel management, this tool is the perfect solution for securely deploying web services."
  it: "Cloudflare Tunnel offre un modo semplice per esporre i server web in modo sicuro su internet, senza aprire porte firewall e configurare ACL. Cloudflare Tunnel assicura anche che le richieste passino attraverso Cloudflare prima di raggiungere il server web, così puoi essere sicuro che il traffico di attacco viene fermato con il WAF di Cloudflare e la mitigazione DDoS illimitata, e autenticato con Access se hai abilitato queste funzionalità per il tuo account.\n\nIl software fornisce un modo senza soluzione di continuità per esporre in modo sicuro i server web su internet senza configurare porte firewall o liste di controllo accessi (ACL). Tutte le richieste sono instradate attraverso Cloudflare prima di raggiungere il tuo server web, sfruttando il Web Application Firewall (WAF) di Cloudflare e la mitigazione DDoS illimitata per bloccare il traffico di attacco, con autenticazione opzionale tramite Cloudflare Access se abilitata. Con la sua interfaccia Web intuitiva e la gestione efficiente dei tunnel, questo strumento è la soluzione perfetta per distribuire servizi web in modo sicuro."
  nb: "Cloudflare Tunnel tilbyr en enkel måte å eksponere webservere sikkert til internett, uten å åpne brannmurporter og konfigurere ACL-er. Cloudflare Tunnel sørger også for at forespørsler rutes gjennom Cloudflare før de når webserveren, slik at du kan være sikker på at angrepstrafikk stoppes med Cloudflares WAF og ubegrenset DDoS-mitigering, og autentiseres med Access hvis du har aktivert disse funksjonene for kontoen din.\n\nProgramvaren gir en sømløs måte å eksponere webservere sikkert til internett uten å konfigurere brannmurporter eller tilgangskontrollister (ACL-er). Alle forespørsler rutes gjennom Cloudflare før de når webserveren din, og utnytter Cloudflares Web Application Firewall (WAF) og ubegrenset DDoS-mitigering for å blokkere angrepstrafikk, med valgfri autentisering via Cloudflare Access hvis aktivert. Med sitt intuitive webgrensesnitt og effektiv tunneladministrasjon er dette verktøyet den perfekte løsningen for sikker distribusjon av webtjenester."
  zh: "Cloudflare Tunnel 提供了一种简单的方法，可以安全地将 Web 服务器暴露到互联网上，而无需打开防火墙端口和配置 ACL。Cloudflare Tunnel 还确保请求在到达 Web 服务器之前通过 Cloudflare 路由，因此您可以确信攻击流量会被 Cloudflare 的 WAF 和无限制 DDoS 缓解措施阻止，如果您为帐户启用了这些功能，还会通过 Access 进行身份验证。\n\n该软件提供了一种无缝的方式，可以安全地将 Web 服务器暴露到互联网上，而无需配置防火墙端口或访问控制列表 (ACL)。所有请求在到达您的 Web 服务器之前都会通过 Cloudflare 路由，利用 Cloudflare 的 Web 应用程序防火墙 (WAF) 和无限制 DDoS 缓解措施来阻止攻击流量，如果启用了 Cloudflare Access，还可以选择通过其进行身份验证。凭借其直观的 Web 界面和高效的隧道管理，此工具是安全部署 Web 服务的完美解决方案。"
  ja: "Cloudflare Tunnel は、ファイアウォールポートを開放したり ACL を設定したりせずに、Web サーバーを安全にインターネットに公開する簡単な方法を提供します。Cloudflare Tunnel は、リクエストが Web サーバーに到達する前に Cloudflare を経由するようにすることで、攻撃トラフィックが Cloudflare の WAF および無制限の DDoS 緩和によって停止され、アカウントで有効にしている場合は Access で認証されることを保証します。\n\nこのソフトウェアは、ファイアウォールポートやアクセス制御リスト (ACL) を設定せずに、Web サーバーを安全にインターネットに公開するシームレスな方法を提供します。すべてのリクエストは、Web サーバーに到達する前に Cloudflare を経由し、Cloudflare の Web アプリケーション ファイアウォール (WAF) および無制限の DDoS 緩和を活用して攻撃トラフィックをブロックし、有効にしている場合は Cloudflare Access 経由で認証するオプションもあります。直感的な Web インターフェイスと効率的なトンネル管理により、このツールは Web サービスを安全に展開するための完璧なソリューションです。"
  ko: "Cloudflare Tunnel은 방화벽 포트를 열거나 ACL을 구성하지 않고도 웹 서버를 안전하게 인터넷에 노출할 수 있는 쉬운 방법을 제공합니다. Cloudflare Tunnel은 또한 요청이 웹 서버에 도달하기 전에 Cloudflare를 통해 라우팅되도록 하여 Cloudflare의 WAF 및 무제한 DDoS 완화 기능으로 공격 트래픽이 차단되고, 계정에 대해 해당 기능을 활성화한 경우 Access를 통해 인증되도록 합니다.\n\n이 소프트웨어는 방화벽 포트나 액세스 제어 목록(ACL)을 구성하지 않고도 웹 서버를 안전하게 인터넷에 노출할 수 있는 원활한 방법을 제공합니다. 모든 요청은 웹 서버에 도달하기 전에 Cloudflare를 통해 라우팅되며, Cloudflare의 웹 애플리케이션 방화벽(WAF) 및 무제한 DDoS 완화 기능을 활용하여 공격 트래픽을 차단하고, 활성화된 경우 Cloudflare Access를 통한 선택적 인증을 제공합니다. 직관적인 웹 인터페이스와 효율적인 터널 관리를 통해 이 도구는 웹 서비스를 안전하게 배포하기 위한 완벽한 솔루션입니다."
  fr: "Cloudflare Tunnel offre un moyen facile d'exposer des serveurs web de manière sécurisée sur Internet, sans ouvrir de ports de pare-feu ni configurer d'ACL. Cloudflare Tunnel garantit également que les requêtes sont acheminées via Cloudflare avant d'atteindre le serveur web, vous pouvez donc être sûr que le trafic d'attaque est arrêté par le WAF de Cloudflare et la mitigation DDoS illimitée, et authentifié avec Access si vous avez activé ces fonctionnalités pour votre compte.\n\nLe logiciel fournit un moyen transparent d'exposer de manière sécurisée des serveurs web sur Internet sans configurer de ports de pare-feu ou de listes de contrôle d'accès (ACL). Toutes les requêtes sont acheminées via Cloudflare avant d'atteindre votre serveur web, en tirant parti du pare-feu d'applications web (WAF) de Cloudflare et de la mitigation DDoS illimitée pour bloquer le trafic d'attaque, avec une authentification optionnelle via Cloudflare Access si elle est activée. Avec son interface Web intuitive et sa gestion efficace des tunnels, cet outil est la solution parfaite pour déployer des services web en toute sécurité."
  de: "Cloudflare Tunnel bietet eine einfache Möglichkeit, Webserver sicher im Internet bereitzustellen, ohne Firewall-Ports zu öffnen und ACLs zu konfigurieren. Cloudflare Tunnel stellt außerdem sicher, dass Anfragen über Cloudflare geleitet werden, bevor sie den Webserver erreichen, sodass Sie sicher sein können, dass Angriffsverkehr durch Cloudflares WAF und unbegrenzte DDoS-Abwehr gestoppt und mit Access authentifiziert wird, wenn Sie diese Funktionen für Ihr Konto aktiviert haben.\n\nDie Software bietet eine nahtlose Möglichkeit, Webserver sicher im Internet bereitzustellen, ohne Firewall-Ports oder Zugriffskontrolllisten (ACLs) zu konfigurieren. Alle Anfragen werden über Cloudflare geleitet, bevor sie Ihren Webserver erreichen, und nutzen Cloudflares Web Application Firewall (WAF) und unbegrenzte DDoS-Abwehr, um Angriffsverkehr zu blockieren, mit optionaler Authentifizierung über Cloudflare Access, falls aktiviert. Mit seiner intuitiven Web-Oberfläche und effizientem Tunnel-Management ist dieses Tool die perfekte Lösung für die sichere Bereitstellung von Webdiensten."
  sv: "Cloudflare Tunnel erbjuder ett enkelt sätt att exponera webbservrar säkert till internet, utan att öppna brandväggsportar och konfigurera ACL:er. Cloudflare Tunnel ser också till att förfrågningar dirigeras genom Cloudflare innan de når webbservrarna, så du kan vara säker på att attacktrafik stoppas med Cloudflares WAF och obegränsad DDoS-mitigering, och autentiseras med Access om du har aktiverat dessa funktioner för ditt konto.\n\nMjukvaran tillhandahåller ett sömlöst sätt att säkert exponera webbservrar till internet utan att konfigurera brandväggsportar eller åtkomstkontrollistor (ACL:er). Alla förfrågningar dirigeras genom Cloudflare innan de når din webbservrar, och utnyttjar Cloudflares Web Application Firewall (WAF) och obegränsad DDoS-mitigering för att blockera attacktrafik, med valfri autentisering via Cloudflare Access om det är aktiverat. Med sitt intuitiva webbgränssnitt och effektiv tunnelhantering är detta verktyg den perfekta lösningen för att säkert distribuera webbtjänster."
  el: "Το Cloudflare Tunnel προσφέρει έναν εύκολο τρόπο να εκθέσετε τους web servers σας με ασφάλεια στο διαδίκτυο, χωρίς να ανοίξετε θύρες τείχους προστασίας ή να ρυθμίσετε ACLs. Το Cloudflare Tunnel εξασφαλίζει επίσης ότι τα αιτήματα δρομολογούνται μέσω του Cloudflare πριν φτάσουν στον web server, ώστε να είστε σίγουροι ότι η κυκλοφορία επιθέσεων σταματάει με το WAF του Cloudflare και την απεριόριστη μείωση DDoS, και πιστοποιείται με το Access εάν έχετε ενεργοποιήσει αυτές τις λειτουργίες για τον λογαριασμό σας.\n\nΤο λογισμικό παρέχει έναν απρόσκοπτο τρόπο να εκθέσετε τους web servers σας με ασφάλεια στο διαδίκτυο χωρίς να ρυθμίσετε θύρες τείχους προστασίας ή λίστες ελέγχου πρόσβασης (ACLs). Όλα τα αιτήματα δρομολογούνται μέσω του Cloudflare πριν φτάσουν στον web server σας, αξιοποιώντας το Web Application Firewall (WAF) του Cloudflare και την απεριόριστη μείωση DDoS για να μπλοκάρουν την κυκλοφορία επιθέσεων, με προαιρετική πιστοποίηση μέσω του Cloudflare Access εάν είναι ενεργοποιημένη. Με τη διαισθητική του διεπαφή Web και την αποτελεσματική διαχείριση tunnel, αυτό το εργαλείο είναι η τέλεια λύση για την ασφαλή ανάπτυξη υπηρεσιών web."
  hr: "Cloudflare Tunnel nudi jednostavan način za sigurno izlaganje web poslužitelja internetu, bez otvaranja portova vatrozida i konfiguriranja ACL-ova. Cloudflare Tunnel također osigurava da se zahtjevi usmjeravaju kroz Cloudflare prije nego što stignu do web poslužitelja, tako da možete biti sigurni da se napadački promet zaustavlja pomoću Cloudflareovog WAF-a i neograničene DDoS mitigacije, te autentificira pomoću Accessa ako ste omogućili te značajke za svoj račun.\n\nSoftver pruža besprijekoran način za sigurno izlaganje web poslužitelja internetu bez konfiguriranja portova vatrozida ili lista kontrole pristupa (ACL-ova). Svi zahtjevi se usmjeravaju kroz Cloudflare prije nego što stignu do vašeg web poslužitelja, koristeći Cloudflareov Web Application Firewall (WAF) i neograničenu DDoS mitigaciju za blokiranje napadačkog prometa, s opcionalnom autentifikacijom putem Cloudflare Accessa ako je omogućena. Sa svojim intuitivnim web sučeljem i učinkovitim upravljanjem tunelima, ovaj alat je savršeno rješenje za sigurno implementiranje web usluga."
  pt: "O Cloudflare Tunnel oferece uma forma fácil de expor servidores web de forma segura à internet, sem abrir portas de firewall e configurar ACLs. O Cloudflare Tunnel também garante que os pedidos são encaminhados através do Cloudflare antes de chegarem ao servidor web, para que possa ter a certeza de que o tráfego de ataque é interrompido com o WAF do Cloudflare e a mitigação DDoS ilimitada, e autenticado com o Access se tiver ativado essas funcionalidades para a sua conta.\n\nO software fornece uma forma transparente de expor servidores web de forma segura à internet sem configurar portas de firewall ou listas de controlo de acesso (ACLs). Todos os pedidos são encaminhados através do Cloudflare antes de chegarem ao seu servidor web, aproveitando o Web Application Firewall (WAF) do Cloudflare e a mitigação DDoS ilimitada para bloquear o tráfego de ataque, com autenticação opcional através do Cloudflare Access se ativada. Com a sua interface Web intuitiva e gestão eficiente de túneis, esta ferramenta é a solução perfeita para implementar serviços web de forma segura."
  ru: "Cloudflare Tunnel предлагает простой способ безопасного подключения веб-серверов к Интернету, не открывая порты брандмауэра и не настраивая ACL. Cloudflare Tunnel также обеспечивает маршрутизацию запросов через Cloudflare до того, как они достигнут веб-сервера, поэтому вы можете быть уверены, что трафик атак блокируется с помощью WAF Cloudflare и неограниченной защиты от DDoS, а также аутентифицируется с помощью Access, если вы включили эти функции для своей учетной записи.\n\nПрограммное обеспечение обеспечивает беспрепятственный способ безопасного подключения веб-серверов к Интернету без настройки портов брандмауэра или списков контроля доступа (ACL). Все запросы направляются через Cloudflare до того, как они достигнут вашего веб-сервера, используя Web Application Firewall (WAF) Cloudflare и неограниченную защиту от DDoS для блокировки трафика атак, с возможностью аутентификации через Cloudflare Access, если она включена. Благодаря интуитивно понятному веб-интерфейсу и эффективному управлению туннелями этот инструмент является идеальным решением для безопасного развертывания веб-служб."
  tr: "Cloudflare Tunnel, web sunucularını güvenli bir şekilde internete maruz bırakmanın kolay bir yolunu sunar, güvenlik duvarı portlarını açmadan ve ACL'leri yapılandırmadan. Cloudflare Tunnel ayrıca isteklerin web sunucusuna ulaşmadan önce Cloudflare üzerinden yönlendirilmesini sağlar, böylece saldırı trafiğinin Cloudflare'ın WAF ve sınırsız DDoS azaltma ile durdurulduğundan ve hesabınız için bu özellikleri etkinleştirdiyseniz Access ile kimlik doğrulandığından emin olabilirsiniz.\n\nYazılım, güvenlik duvarı portlarını veya erişim kontrol listelerini (ACL'ler) yapılandırmadan web sunucularını güvenli bir şekilde internete maruz bırakmanın sorunsuz bir yolunu sunar. Tüm istekler, web sunucunuza ulaşmadan önce Cloudflare üzerinden yönlendirilir, Cloudflare'ın Web Uygulama Güvenlik Duvarı (WAF) ve sınırsız DDoS azaltma özelliklerini kullanarak saldırı trafiğini engeller, etkinleştirilmişse Cloudflare Access aracılığıyla isteğe bağlı kimlik doğrulama ile. Sezgisel Web arayüzü ve verimli tünel yönetimi ile bu araç, web hizmetlerini güvenli bir şekilde dağıtmak için mükemmel bir çözümdür."
  uk: "Cloudflare Tunnel — простий спосіб безпечно відкрити вебсервери в інтернет без відкриття портів у брандмауері та налаштування ACL. Крім того, запити проходять через Cloudflare, перш ніж потрапити на вебсервер, тож атакувальний трафік зупиняється за допомогою WAF і необмеженого захисту від DDoS від Cloudflare, а автентифікація виконується через Access, якщо ви ввімкнули ці функції для свого облікового запису.\n\nПрограма дає змогу безперешкодно й безпечно відкрити вебсервери в інтернет без налаштування портів брандмауера чи списків контролю доступу (ACL). Усі запити проходять через Cloudflare, перш ніж потрапити на ваш вебсервер: брандмауер вебзастосунків (WAF) і необмежений захист від DDoS блокують атакувальний трафік, а за потреби можна ввімкнути автентифікацію через Cloudflare Access. Зрозумілий вебінтерфейс і ефективне керування тунелями роблять цей інструмент ідеальним рішенням для безпечного розгортання вебсервісів."
