title: Cloudflared
tagline:
  en: A tunneling daemon by Cloudflare that safely exposes your web servers into the internet.
  uk: "Демон тунелювання від Cloudflare, що безпечно відкриває ваші вебсервери в інтернет."
description:
  en: "Cloudflare Tunnel offers an easy way to expose web servers securely to the internet, without opening up firewall ports and configuring ACLs. Cloudflare Tunnel also ensures requests route through Cloudflare before reaching the web server, so you can be sure attack traffic is stopped with Cloudflare’s WAF and Unmetered DDoS mitigation, and authenticated with Access if you’ve enabled those features for your account.\n\nThe software provides a seamless way to securely expose web servers to the internet without configuring firewall ports or access control lists (ACLs). All requests are routed through Cloudflare before reaching your web server, leveraging Cloudflare’s Web Application Firewall (WAF) and unmetered DDoS mitigation to block attack traffic, with optional authentication via Cloudflare Access if enabled. With its intuitive Web interface and efficient tunnel management, this tool is the perfect solution for securely deploying web services."
  uk: "Cloudflare Tunnel — простий спосіб безпечно відкрити вебсервери в інтернет без відкриття портів у брандмауері та налаштування ACL. Крім того, запити проходять через Cloudflare, перш ніж потрапити на вебсервер, тож атакувальний трафік зупиняється за допомогою WAF і необмеженого захисту від DDoS від Cloudflare, а автентифікація виконується через Access, якщо ви ввімкнули ці функції для свого облікового запису.\n\nПрограма дає змогу безперешкодно й безпечно відкрити вебсервери в інтернет без налаштування портів брандмауера чи списків контролю доступу (ACL). Усі запити проходять через Cloudflare, перш ніж потрапити на ваш вебсервер: брандмауер вебзастосунків (WAF) і необмежений захист від DDoS блокують атакувальний трафік, а за потреби можна ввімкнути автентифікацію через Cloudflare Access. Зрозумілий вебінтерфейс і ефективне керування тунелями роблять цей інструмент ідеальним рішенням для безпечного розгортання вебсервісів."
category: network
developer: Cloudflare Inc.
website: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/get-started/create-remote-tunnel/
source: https://github.com/WisdomSky/Cloudflared-web
icon: "data:image/svg+xml;base64,"
