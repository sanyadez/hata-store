# Apache-2.0, changed for Hata Store: see NOTICE
title: Adminer
tagline:
  en: Database management in a single PHP file
  uk: Керування базами даних в одному PHP-файлі
description:
  en: "Adminer (formerly phpMinAdmin) is a full-featured database management tool written in PHP. Conversely to phpMyAdmin, it consist of a single file ready to deploy to the target server. Adminer is available for MySQL, PostgreSQL, SQLite, MS SQL, Oracle, Firebird, SimpleDB, Elasticsearch and MongoDB."
  uk: "Adminer (раніше phpMinAdmin) — повнофункціональний інструмент для керування базами даних, написаний на PHP. На відміну від phpMyAdmin, він складається з єдиного файлу, готового до розгортання на цільовому сервері. Adminer працює з MySQL, PostgreSQL, SQLite, MS SQL, Oracle, Firebird, SimpleDB, Elasticsearch і MongoDB."
category: development
developer: Jakub Vrána
website: https://www.adminer.org
source: https://github.com/vrana/adminer
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: adminer
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label:
      en: Web port
      uk: Порт вебінтерфейсу
