# Apache-2.0, changed for Hata Store: see NOTICE
title: Nzbget
tagline:
  en: Efficient Usenet downloader
  uk: Ефективний завантажувач із Usenet
description:
  en: "NZBGet can run on almost any device - classic PC, NAS, media player, SAT-receiver, WLAN-router, etc. The download area provides precompiled binaries for Windows, macOS, Linux (compatible with many CPUs and platform variants), FreeBSD and Android. For other platforms the program can be compiled from sources."
  uk: "NZBGet може працювати майже на будь-якому пристрої: звичайному комп’ютері, NAS, медіаплеєрі, супутниковому ресивері, Wi-Fi-маршрутизаторі тощо. У розділі завантажень є готові збірки для Windows, macOS, Linux (для багатьох процесорів і варіантів платформ), FreeBSD та Android. Для інших платформ програму можна зібрати з вихідного коду."
notes:
  en: "Default Account\n\n| Username | Password | | -------- | -------- | | nzbget   | tegbzn6789 |"
  uk: "Типовий обліковий запис\n\n| Ім'я користувача | Пароль | | -------- | -------- | | nzbget   | tegbzn6789 |"
category: media
developer: Nzbget Team
website: https://nzbget.com
source: https://github.com/nzbgetcom/nzbget
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: nzbget
  port: 6789
settings:
  - name: WEB_PORT
    type: port
    default: 6789
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads
      uk: Завантаження
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
  - name: NZBGET_PASS
    type: password
    required: true
    label:
      en: Password to sign in
      uk: Пароль для входу
