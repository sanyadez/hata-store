  - name: PORT_3478
    type: port
    default: 3478
    label:
      en: Port 3478
      uk: Порт 3478
    advanced: true
  - name: PORT_10001
    type: port
    default: 10001
    label:
      en: Port 10001
      uk: Порт 10001
    advanced: true
  - name: PORT_8080
    type: port
    default: 8080
    label:
      en: Port 8080
      uk: Порт 8080
    advanced: true
  - name: MONGO_PASS
    type: secret
    label:
      en: MONGO_PASS
  - name: UNIFI_DB_PORT_27017
    type: port
    default: 27017
    label:
      en: Port 27017
      uk: Порт 27017
    advanced: true
