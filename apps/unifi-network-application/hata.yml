# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Unifi Network Application
tagline:
  en: "The Unifi network application software is a powerful, enterprise wireless software engine ideal for high-density…"
  zh: Unifi控制器软件是一种功能强大的企业级无线软件引擎，适用于需要低延迟和高可用性性能的高密度客户端部署。
  uk: "UniFi Network Application — керування бездротовими мережами UniFi, навіть із великою кількістю пристроїв."
description:
  en: "Only mandatory ports are enabled by default, to extend functionality consider exposing 1900:1900/udp, 8843:8843, 8880:8880, 6789:6789, 5514:5514/udp. Other ports specifications [here](https://docs.linuxserver.io/images/docker-unifi-network-application/#ports-p).\n\nBecause the network application runs inside Docker by default it uses an IP address not accessible by other devices. So, for it to adopt other devices, it is required to use port `8080` and change the inform IP address. To do so, go in settings and search for the `Inform Host` option, there select override and set the address to that of the host. Often, it is also needed to ssh into the devices you want to adopt and manually set the inform IP address, the command needed for doing so is `set-inform http://HOST-ADDRESS:8080/inform`.\n\nFor more [information](https://docs.linuxserver.io/images/docker-unifi-network-application/)"
  zh: "默认情况下仅启用强制端口，要扩展功能，请考虑公开 1900:1900/udp、8843:8843、8880:8880、6789:6789、5514:5514/udp。 其他端口规范[此处](https://docs.linuxserver.io/images/docker-unifi-network-application/#ports-p)。\n\n由于网络应用程序默认在 Docker 内部运行，因此它使用其他设备无法访问的 IP 地址。 因此，要采用其他设备，需要使用端口“8080”并更改通知IP地址。 为此，请进入设置并搜索“通知主机”选项，选择覆盖并将地址设置为主机的地址。 通常，还需要 ssh 到您想要采用的设备并手动设置通知 IP 地址，所需的命令是“set-inform http://HOST-ADDRESS:8080/inform”。\n\n了解更多[信息](https://docs.linuxserver.io/images/docker-unifi-network-application/)"
  uk: "Типово ввімкнено лише обов'язкові порти. Щоб розширити можливості, розгляньте відкриття 1900:1900/udp, 8843:8843, 8880:8880, 6789:6789, 5514:5514/udp. Опис інших портів — [тут](https://docs.linuxserver.io/images/docker-unifi-network-application/#ports-p).\n\nОскільки застосунок працює всередині Docker, він типово має IP-адресу, недоступну іншим пристроям. Тому, щоб він міг приймати інші пристрої, потрібно використати порт `8080` і змінити inform-адресу. Для цього відкрийте налаштування, знайдіть параметр `Inform Host`, виберіть override і вкажіть адресу хоста. Часто також потрібно підключитися до пристроїв, які ви хочете прийняти, через ssh і вручну задати inform-адресу такою командою: `set-inform http://HOST-ADDRESS:8080/inform`.\n\nДокладніше — у [документації](https://docs.linuxserver.io/images/docker-unifi-network-application/)"
notes:
  en: "Only mandatory ports are enabled by default, to extend functionality consider exposing 1900:1900/udp, 8843:8843, 8880:8880, 6789:6789, 5514:5514/udp. Other ports specifications [here](https://docs.linuxserver.io/images/docker-unifi-network-application/#ports-p).\n\nBecause the network application runs inside Docker by default it uses an IP address not accessible by other devices. So, for it to adopt other devices, it is required to use port `8080` and change the inform IP address. To do so, go in settings and search for the `Inform Host` option, there select override and set the address to that of the host. Often, it is also needed to ssh into the devices you want to adopt and manually set the inform IP address, the command needed for doing so is `set-inform http://HOST-ADDRESS:8080/inform`.\n\nFor more [information](https://docs.linuxserver.io/images/docker-unifi-network-application/)"
  zh: "默认情况下仅启用强制端口，要扩展功能，请考虑公开 1900:1900/udp、8843:8843、8880:8880、6789:6789、5514:5514/udp。 其他端口规范[此处](https://docs.linuxserver.io/images/docker-unifi-network-application/#ports-p)。\n\n由于网络应用程序默认在 Docker 内部运行，因此它使用其他设备无法访问的 IP 地址。 因此，要采用其他设备，需要使用端口“8080”并更改通知IP地址。 为此，请进入设置并搜索“通知主机”选项，选择覆盖并将地址设置为主机的地址。 通常，还需要 ssh 到您想要采用的设备并手动设置通知 IP 地址，所需的命令是“set-inform http://HOST-ADDRESS:8080/inform”。\n\n了解更多[信息](https://docs.linuxserver.io/images/docker-unifi-network-application/)"
  uk: "Типово ввімкнено лише обов'язкові порти. Щоб розширити можливості, розгляньте відкриття 1900:1900/udp, 8843:8843, 8880:8880, 6789:6789, 5514:5514/udp. Опис інших портів — [тут](https://docs.linuxserver.io/images/docker-unifi-network-application/#ports-p).\n\nОскільки застосунок працює всередині Docker, він типово має IP-адресу, недоступну іншим пристроям. Тому, щоб він міг приймати інші пристрої, потрібно використати порт `8080` і змінити inform-адресу. Для цього відкрийте налаштування, знайдіть параметр `Inform Host`, виберіть override і вкажіть адресу хоста. Часто також потрібно підключитися до пристроїв, які ви хочете прийняти, через ssh і вручну задати inform-адресу такою командою: `set-inform http://HOST-ADDRESS:8080/inform`.\n\nДокладніше — у [документації](https://docs.linuxserver.io/images/docker-unifi-network-application/)"
