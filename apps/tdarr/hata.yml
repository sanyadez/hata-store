title: Tdarr
tagline:
  en: Converts the whole film and series library to the format you choose
  uk: Перекодовує всю бібліотеку фільмів і серіалів у вибраний формат
description:
  en: >
    Goes through your media folder and converts each file by the rules you set: to H.265 or AV1
    to save space, to one container and audio track so every player opens it, without the
    subtitles you never use. It checks files for damage too, and uses the server's graphics for
    speed where it can.
  uk: >
    Проходить текою з медіа й перекодовує кожен файл за вашими правилами: в H.265 чи AV1, щоб
    звільнити місце, в один контейнер і одну доріжку звуку, щоб відкривав будь-який програвач, без
    субтитрів, якими ви не користуєтеся. Також перевіряє файли на пошкодження й, де може, прискорює
    роботу графікою сервера.
notes:
  en: >
    Tdarr has no sign-in of its own here: turn on Hata's sign-in for it in its access settings.
    Converting replaces the original files: try the rules on a copy first.
  uk: >
    Власного входу в Tdarr тут немає: увімкніть для нього вхід Hata в налаштуваннях доступу.
    Перекодування замінює початкові файли: спершу спробуйте правила на копії.
category: media
developer: HaveAGitGat
website: https://tdarr.io
source: https://github.com/HaveAGitGat/Tdarr
icon: data:image/svg+xml;base64,
web:
  service: tdarr
  port: 8265
settings:
  - name: WEB_PORT
    type: port
    default: 8265
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: MEDIA
    type: folder
    default: ${DATA_ROOT}/Media
    label: { en: Media folder, uk: Тека з медіа }
    hint:
      en: The films and series to convert; inside the app it is /media
      uk: Фільми й серіали, які треба перекодувати; у застосунку вона — /media
  - name: CACHE
    type: folder
    default: ${APP_DATA}/cache
    label: { en: Folder for files being converted, uk: Тека для файлів під час перекодування }
    hint:
      en: Needs room for a few films at once; a fast disk helps. Inside the app it is /temp
      uk: Потрібне місце на кілька фільмів одразу; швидкий диск допоможе. У застосунку вона — /temp
  - name: SERVER_PORT
    type: port
    default: 8266
    advanced: true
    label: { en: Port for nodes on other computers, uk: Порт для вузлів на інших комп'ютерах }
permissions:
  devices:
    en: Uses the server's graphics (/dev/dri) to convert video faster
    uk: Користується графікою сервера (/dev/dri), щоб швидше перекодовувати відео
