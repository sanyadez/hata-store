  uk: "Промислова система синтезу мовлення з тексту без додаткового навчання, з гнучким керуванням і високою ефективністю"
description:
  en: "IndexTTS2 is an advanced zero-shot text-to-speech model that innovatively achieves complete decoupling of emotional expression and speaker identity. The model supports precise speech duration control and multimodal emotion control, capable of maintaining the target timbre while accurately reproducing the specified emotional intonation.\n\nThe model employs a three-stage training paradigm and introduces GPT latent representations, ensuring excellent speech clarity and stability even under high emotional expression. Through the Qwen-based soft instruction mechanism, users can easily control the emotional characteristics of generated speech using natural language descriptions.\n\nIn multi-dataset evaluations, IndexTTS2 surpasses existing zero-shot TTS models in key metrics such as word error rate, speaker similarity, and emotion fidelity, providing industry-leading speech synthesis quality.\n\n**Key Features:**\n- Zero-shot TTS capability to replicate any timbre without training\n- Independent control of emotion and timbre with multimodal emotion input\n- Precise duration control with explicit token count specification for perfect audio-video synchronization\n- Natural language-based emotion control to guide speech generation through text descriptions\n\n**Prerequisites:**\n- Please ensure available memory > 12 GB, otherwise the application may not run properly\n- NVIDIA GPU with ≥ 8 GB VRAM (recommended for optimal performance)\n- NVIDIA CUDA Toolkit version ≥ 12.8\n\n**Learn More:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  de: "IndexTTS2 ist ein fortschrittliches Zero-Shot-Text-zu-Sprache-Modell, das innovativ eine vollständige Entkopplung von emotionaler Ausdrucksfähigkeit und Sprecher-Identität realisiert. Das Modell unterstützt präzise Sprachdauerkontrolle und multimodale Emotionskontrolle, wobei es die Zielstimme beibehalten und gleichzeitig die angegebene emotionale Intonation präzise wiedergeben kann.\n\nDas Modell verwendet ein dreistufiges Trainingsparadigma und führt GPT-Latent-Repräsentationen ein, um hervorragende Sprachklarheit und Stabilität auch bei hoher emotionaler Ausdrucksfähigkeit zu gewährleisten. Durch den auf Qwen basierenden Soft-Instruction-Mechanismus können Benutzer die emotionalen Merkmale der generierten Sprache einfach mit natürlichsprachlichen Beschreibungen steuern.\n\nIn Multi-Dataset-Evaluierungen übertrifft IndexTTS2 bestehende Zero-Shot-TTS-Modelle in Schlüsselmetriken wie Wortfehlerrate, Sprecher-Ähnlichkeit und emotionaler Wiedergabetreue und bietet branchenführende Sprachsynthesequalität.\n\n**Hauptfunktionen:**\n- Zero-Shot TTS-Fähigkeit zur Nachbildung beliebiger Stimmen ohne Training\n- Unabhängige Kontrolle von Emotion und Timbre mit multimodaler Emotionseingabe\n- Präzise Dauerkontrolle zur expliziten Token-Anzahl-Spezifikation für perfekte Audio-Video-Synchronisation\n- Natürlichsprachliche Emotionskontrolle zur Steuerung der Sprachgenerierung durch Textbeschreibungen\n\n**Voraussetzungen:**\n- Bitte stellen Sie sicher, dass verfügbarer Speicher > 12 GB ist, andernfalls kann die Anwendung möglicherweise nicht ordnungsgemäß ausgeführt werden\n- NVIDIA GPU mit ≥ 8 GB VRAM (empfohlen für optimale Leistung)\n- NVIDIA CUDA Toolkit Version ≥ 12.8\n\n**Mehr Erfahren:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  el: "Το IndexTTS2 είναι ένα προηγμένο μοντέλο μετατροπής κειμένου σε ομιλία χωρίς εκπαίδευση (zero-shot), που υλοποιεί καινοτόμα την πλήρη αποσύζευξη της συναισθηματικής έκφρασης και της ταυτότητας του ομιλητή. Το μοντέλο υποστηρίζει ακριβή έλεγχο διάρκειας φωνής και πολυτροπικό έλεγχο συναισθημάτων, μπορώντας να διατηρήσει την φωνή-στόχο ενώ αναπαράγει με ακρίβεια τον καθορισμένο συναισθηματικό τόνο.\n\nΤο μοντέλο χρησιμοποιεί ένα τριφασικό παράδειγμα εκπαίδευσης και εισάγει αναπαραστάσεις λανθάνουσας GPT, εξασφαλίζοντας εξαιρετική σαφήνεια και σταθερότητα φωνής ακόμη και με υψηλή συναισθηματική έκφραση. Μέσω του μηχανισμού μαλακών οδηγιών βασισμένου στο Qwen, οι χρήστες μπορούν να ελέγχουν εύκολα τα συναισθηματικά χαρακτηριστικά της παραγόμενης φωνής χρησιμοποιώντας περιγραφές φυσικής γλώσσας.\n\nΣε αξιολογήσεις πολλαπλών συνόλων δεδομένων, το IndexTTS2 ξεπερνά τα υπάρχοντα μοντέλα zero-shot TTS σε βασικές μετρήσεις όπως ποσοστό λάθους λέξεων, ομοιότητα ομιλητή και πιστότητα συναισθήματος, παρέχοντας ποιότητα σύνθεσης φωνής κορυφαίου επιπέδου.\n\n**Κύρια Χαρακτηριστικά:**\n- Ικανότητα Zero-Shot TTS για αναπαραγωγή οποιασδήποτε φωνής χωρίς εκπαίδευση\n- Ανεξάρτητος έλεγχος συναισθήματος και χροιάς με πολυτροπική εισαγωγή συναισθημάτων\n- Ακριβής έλεγχος διάρκειας με ρητή καθορισμό αριθμού tokens για τέλειο συγχρονισμό ήχου-βίντεο\n- Έλεγχος συναισθημάτων με φυσική γλώσσα για καθοδήγηση της παραγωγής φωνής μέσω περιγραφών κειμένου\n\n**Προαπαιτούμενα:**\n- Βεβαιωθείτε ότι η διαθέσιμη μνήμη είναι > 12 GB, διαφορετικά η εφαρμογή ενδέχεται να μην λειτουργήσει σωστά\n- NVIDIA GPU με ≥ 8 GB VRAM (συνιστάται για βέλτιστη απόδοση)\n- NVIDIA CUDA Toolkit έκδοση ≥ 12.8\n\n**Μάθετε Περισσότερα:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  fr: "IndexTTS2 est un modèle avancé de synthèse vocale zéro-shot qui réalise de manière innovante un découplage complet entre l'expression émotionnelle et l'identité du locuteur. Le modèle prend en charge un contrôle précis de la durée de la parole et un contrôle émotionnel multimodal, capable de maintenir le timbre cible tout en reproduisant avec précision l'intonation émotionnelle spécifiée.\n\nLe modèle emploie un paradigme d'entraînement en trois étapes et introduit des représentations latentes GPT, garantissant une excellente clarté et stabilité de la parole même en cas d'expression émotionnelle élevée. Grâce au mécanisme d'instruction souple basé sur Qwen, les utilisateurs peuvent facilement contrôler les caractéristiques émotionnelles de la parole générée en utilisant des descriptions en langage naturel.\n\nDans les évaluations multi-ensembles de données, IndexTTS2 surpasse les modèles TTS zéro-shot existants dans des métriques clés telles que le taux d'erreur de mots, la similarité du locuteur et la fidélité émotionnelle, offrant une qualité de synthèse vocale de premier plan dans l'industrie.\n\n**Fonctionnalités Clés:**\n- Capacité TTS zéro-shot pour reproduire n'importe quel timbre sans entraînement\n- Contrôle indépendant de l'émotion et du timbre avec entrée émotionnelle multimodale\n- Contrôle précis de la durée avec spécification explicite du nombre de tokens pour une synchronisation audio-vidéo parfaite\n- Contrôle émotionnel basé sur le langage naturel pour guider la génération vocale par descriptions textuelles\n\n**Prérequis:**\n- Veuillez vous assurer que la mémoire disponible > 12 Go, sinon l'application pourrait ne pas fonctionner correctement\n- GPU NVIDIA avec ≥ 8 GB de VRAM (recommandé pour des performances optimales)\n- NVIDIA CUDA Toolkit version ≥ 12.8\n\n**En Savoir Plus:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  hr: "IndexTTS2 je napredni zero-shot model pretvaranja teksta u govor koji inovativno postiže potpuno razdvajanje emocionalnog izraza i identiteta govornika. Model podržava preciznu kontrolu trajanja govora i multimodalnu kontrolu emocija, sposoban zadržati ciljni timbar dok točno reproducira specificirani emocionalni ton.\n\nModel koristi trofaznu paradigmu treniranja i uvodi GPT latentne reprezentacije, osiguravajući izvrsnu jasnoću i stabilnost govora čak i pod visokim emocionalnim izrazom. Kroz mehanizam mekih uputa temeljen na Qwen-u, korisnici mogu lako kontrolirati emocionalne karakteristike generiranog govora koristeći opise prirodnog jezika.\n\nU evaluacijama na više skupova podataka, IndexTTS2 nadmašuje postojeće zero-shot TTS modele u ključnim metrikama kao što su stopa pogreške riječi, sličnost govornika i emocionalna vjernost, pružajući vodeću kvalitetu sinteze govora u industriji.\n\n**Ključne Značajke:**\n- Zero-shot TTS sposobnost za repliciranje bilo kojeg timbra bez treniranja\n- Neovisna kontrola emocija i timbra s multimodalnim emocionalnim unosom\n- Precizna kontrola trajanja s eksplicitnom specifikacijom broja tokena za savršenu audio-video sinkronizaciju\n- Kontrola emocija temeljena na prirodnom jeziku za usmjeravanje generiranja govora kroz tekstualne opise\n\n**Preduvjeti:**\n- Molimo osigurajte da dostupna memorija bude > 12 GB, inače aplikacija možda neće raditi pravilno\n- NVIDIA GPU s ≥ 8 GB VRAM-a (preporučeno za optimalnu performansu)\n- NVIDIA CUDA Toolkit verzija ≥ 12.8\n\n**Saznajte Više:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  it: "IndexTTS2 è un modello avanzato di sintesi vocale zero-shot che realizza in modo innovativo un completo disaccoppiamento tra espressione emotiva e identità del parlante. Il modello supporta il controllo preciso della durata del parlato e il controllo emotivo multimodale, capace di mantenere il timbro target mentre riproduce accuratamente l'intonazione emotiva specificata.\n\nIl modello impiega un paradigma di addestramento a tre fasi e introduce rappresentazioni latenti GPT, garantendo eccellente chiarezza e stabilità del parlato anche in condizioni di alta espressione emotiva. Attraverso il meccanismo di istruzioni morbide basato su Qwen, gli utenti possono facilmente controllare le caratteristiche emotive del parlato generato utilizzando descrizioni in linguaggio naturale.\n\nNelle valutazioni multi-dataset, IndexTTS2 supera i modelli TTS zero-shot esistenti in metriche chiave come tasso di errore delle parole, somiglianza del parlante e fedeltà emotiva, fornendo qualità di sintesi vocale leader del settore.\n\n**Funzionalità Principali:**\n- Capacità TTS zero-shot per replicare qualsiasi timbro senza addestramento\n- Controllo indipendente di emozione e timbro con input emotivo multimodale\n- Controllo preciso della durata con specifica esplicita del conteggio dei token per perfetta sincronizzazione audio-video\n- Controllo emotivo basato sul linguaggio naturale per guidare la generazione vocale attraverso descrizioni testuali\n\n**Prerequisiti:**\n- Si prega di assicurarsi che la memoria disponibile sia > 12 GB, altrimenti l'applicazione potrebbe non funzionare correttamente\n- GPU NVIDIA con ≥ 8 GB di VRAM (consigliato per prestazioni ottimali)\n- NVIDIA CUDA Toolkit versione ≥ 12.8\n\n**Scopri di Più:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  ja: "IndexTTS2は、感情表現と話者アイデンティティの完全な分離を革新的に実現した高度なゼロショットテキスト読み上げモデルです。このモデルは、精密な音声時間制御とマルチモーダル感情制御をサポートし、ターゲット音色を維持しながら指定された感情的イントネーションを正確に再現できます。\n\nこのモデルは3段階のトレーニングパラダイムを採用し、GPT潜在表現を導入することで、高い感情表現下でも優れた音声明瞭性と安定性を確保します。Qwenベースのソフトインストラクション機構により、ユーザーは自然言語記述を使用して生成音声の感情特性を簡単に制御できます。\n\n複数データセット評価において、IndexTTS2は単語誤り率、話者類似度、感情忠実度などの主要指標で既存のゼロショットTTSモデルを上回り、業界最先端の音声合成品質を提供します。\n\n**主な機能：**\n- トレーニングなしで任意の音色を再現するゼロショットTTS機能\n- マルチモーダル感情入力による感情と音色の独立制御\n- 完璧な音声・映像同期のための明示的トークン数指定による精密な時間制御\n- テキスト記述による音声生成をガイドする自然言語ベースの感情制御\n\n**前提条件：**\n- 利用可能なメモリが 12 GB を超えることを確認してください。そうでない場合、アプリケーションが正常に動作しない可能性があります\n- ≥ 8 GBのVRAMを搭載したNVIDIA GPU（最適なパフォーマンスのため推奨）\n- NVIDIA CUDA Toolkitバージョン ≥ 12.8\n\n**詳細情報：**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  ko: "IndexTTS2는 감정 표현과 화자 신원의 완전한 분리를 혁신적으로 구현한 고급 제로샷 텍스트 음성 변환 모델입니다. 이 모델은 정밀한 음성 지속 시간 제어와 다중 모달 감정 제어를 지원하며, 대상 음색을 유지하면서 지정된 감정적 억양을 정확하게 재현할 수 있습니다.\n\n이 모델은 3단계 훈련 패러다임을 채택하고 GPT 잠재 표현을 도입하여 높은 감정 표현에서도 우수한 음성 명료도와 안정성을 보장합니다. Qwen 기반 소프트 인스트럭션 메커니즘을 통해 사용자는 자연어 설명을 사용하여 생성된 음성의 감정적 특성을 쉽게 제어할 수 있습니다.\n\n다중 데이터셋 평가에서 IndexTTS2는 단어 오류율, 화자 유사성, 감정 충실도와 같은 주요 지표에서 기존 제로샷 TTS 모델을 능가하며 업계 최고 수준의 음성 합성 품질을 제공합니다.\n\n**주요 기능:**\n- 훈련 없이 모든 음색을 복제하는 제로샷 TTS 기능\n- 다중 모달 감정 입력을 통한 감정과 음색의 독립적 제어\n- 완벽한 오디오-비디오 동기화를 위한 명시적 토큰 수 지정을 통한 정밀한 지속 시간 제어\n- 텍스트 설명을 통해 음성 생성을 안내하는 자연어 기반 감정 제어\n\n**전제 조건:**\n- 사용 가능한 메모리가 12GB를 초과하는지 확인하십시오. 그렇지 않으면 애플리케이션이 제대로 실행되지 않을 수 있습니다\n- ≥ 8GB VRAM을 갖춘 NVIDIA GPU (최적의 성능을 위해 권장)\n- NVIDIA CUDA Toolkit 버전 ≥ 12.8\n\n**자세히 알아보기:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  nb: "IndexTTS2 er en avansert zero-shot tekst-til-tale-modell som innovativt oppnår fullstendig frakobling av emosjonelt uttrykk og taler-identitet. Modellen støtter presis kontroll av talelengde og multimodal emosjonskontroll, i stand til å opprettholde målklangfargen samtidig som den nøyaktig gjengir den spesifiserte emosjonelle intonasjonen.\n\nModellen benytter et tre-trinns treningsparadigme og introduserer GPT latente representasjoner, som sikrer utmerket taleklårhet og stabilitet selv under høyt emosjonelt uttrykk. Gjennom den Qwen-baserte myke instruksjonsmekanismen kan brukere enkelt kontrollere de emosjonelle egenskapene til generert tale ved hjelp av naturlige språkbeskrivelser.\n\nI multi-datasett-evalueringer overgår IndexTTS2 eksisterende zero-shot TTS-modeller i nøkkelberegninger som ordfeilvurdering, talerlighet og emosjonell troskap, og leverer bransjeledende talekvalitet.\n\n**Nøkkelegenskaper:**\n- Zero-shot TTS-evne for å replikere hvilken som helst klangfarge uten trening\n- Uavhengig kontroll av emosjon og klangfarge med multimodal emosjonsinntasting\n- Presis varighetskontroll med eksplisitt token-antallspesifikasjon for perfekt lyd-video-synkronisering\n- Naturlig språkbasert emosjonskontroll for å veilede talegenerering gjennom tekstbeskrivelser\n\n**Forutsetninger:**\n- Vennligst sørg for at tilgjengelig minne > 12 GB, ellers kan applikasjonen ikke kjøre ordentlig\n- NVIDIA GPU med ≥ 8 GB VRAM (anbefalt for optimal ytelse)\n- NVIDIA CUDA Toolkit versjon ≥ 12.8\n\n**Lær Mer:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  pt: "IndexTTS2 é um modelo avançado de texto para fala zero-shot que alcança inovadoramente o desacoplamento completo entre expressão emocional e identidade do falante. O modelo suporta controle preciso da duração da fala e controle emocional multimodal, capaz de manter o timbre alvo enquanto reproduz com precisão a entonação emocional especificada.\n\nO modelo emprega um paradigma de treinamento em três fases e introduz representações latentes GPT, garantindo excelente clareza e estabilidade da fala mesmo sob alta expressão emocional. Através do mecanismo de instrução suave baseado em Qwen, os usuários podem facilmente controlar as características emocionais da fala gerada usando descrições em linguagem natural.\n\nEm avaliações multi-conjuntos de dados, IndexTTS2 supera os modelos TTS zero-shot existentes em métricas-chave como taxa de erro de palavras, similaridade do falante e fidelidade emocional, fornecendo qualidade de síntese de fala líder da indústria.\n\n**Funcionalidades Principais:**\n- Capacidade TTS zero-shot para replicar qualquer timbre sem treinamento\n- Controle independente de emoção e timbre com entrada emocional multimodal\n- Controle preciso de duração com especificação explícita de contagem de tokens para sincronização perfeita de áudio-vídeo\n- Controle emocional baseado em linguagem natural para guiar a geração de fala através de descrições textuais\n\n**Pré-requisitos:**\n- Por favor, certifique-se de que a memória disponível > 12 GB, caso contrário a aplicação poderá não funcionar corretamente\n- GPU NVIDIA com ≥ 8 GB de VRAM (recomendado para desempenho ideal)\n- NVIDIA CUDA Toolkit versão ≥ 12.8\n\n**Saiba Mais:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  ru: "IndexTTS2 - это продвинутая модель синтеза речи с нулевым обучением (zero-shot), которая инновационно реализует полное разделение эмоционального выражения и личности говорящего. Модель поддерживает точный контроль длительности речи и мультимодальный контроль эмоций, способна сохранять целевой тембр при точном воспроизведении указанной эмоциональной интонации.\n\nМодель использует трёхэтапную парадигму обучения и вводит GPT латентные представления, обеспечивая отличную чёткость и стабильность речи даже при высоком эмоциональном выражении. Благодаря механизму мягких инструкций на основе Qwen, пользователи могут легко контролировать эмоциональные характеристики генерируемой речи с помощью описаний на естественном языке.\n\nВ оценках на множестве наборов данных IndexTTS2 превосходит существующие модели TTS с нулевым обучением по ключевым метрикам, таким как частота ошибок слов, схожесть говорящего и точность эмоций, предоставляя ведущее в отрасли качество синтеза речи.\n\n**Ключевые Особенности:**\n- Возможность TTS с нулевым обучением для воспроизведения любого тембра без обучения\n- Независимый контроль эмоций и тембра с мультимодальным эмоциональным вводом\n- Точный контроль длительности с явным указанием количества токенов для идеальной синхронизации аудио-видео\n- Эмоциональный контроль на основе естественного языка для управления генерацией речи через текстовые описания\n\n**Предварительные требования:**\n- Пожалуйста, убедитесь, что доступная память > 12 ГБ, в противном случае приложение может работать некорректно\n- GPU NVIDIA с ≥ 8 ГБ видеопамяти (рекомендуется для оптимальной производительности)\n- NVIDIA CUDA Toolkit версии ≥ 12.8\n\n**Узнать Больше:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  sv: "IndexTTS2 - это продвинутая модель синтеза речи с нулевым обучением (zero-shot), которая инновационно реализует полное разделение эмоционального выражения и личности говорящего. Модель поддерживает точный контроль длительности речи и мультимодальный контроль эмоций, способна сохранять целевой тембр при точном воспроизведении указанной эмоциональной интонации.\n\nМодель использует трёхэтапную парадигму обучения и вводит GPT латентные представления, обеспечивая отличную чёткость и стабильность речи даже при высоком эмоциональном выражении. Благодаря механизму мягких инструкций на основе Qwen, пользователи могут легко контролировать эмоциональные характеристики генерируемой речи с помощью описаний на естественном языке.\n\nВ оценках на множестве наборов данных IndexTTS2 превосходит существующие модели TTS с нулевым обучением по ключевым метрикам, таким как частота ошибок слов, схожесть говорящего и точность эмоций, предоставляя ведущее в отрасли качество синтеза речи.\n\n**Ключевые Особенности:**\n- Возможность TTS с нулевым обучением для воспроизведения любого тембра без обучения\n- Независимый контроль эмоций и тембра с мультимодальным эмоциональным вводом\n- Точный контроль длительности с явным указанием количества токенов для идеальной синхронизации аудио-видео\n- Эмоциональный контроль на основе естественного языка для управления генерацией речи через текстовые описания\n\n**Förutsättningar:**\n- Vänligen se till att tillgängligt minne > 12 GB, annars kan applikationen inte köras korrekt\n- NVIDIA GPU med ≥ 8 GB VRAM (rekommenderas för optimal prestanda)\n- NVIDIA CUDA Toolkit version ≥ 12.8\n\n**Läs Mer:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  tr: "IndexTTS2, duygusal ifade ile konuşmacı kimliğinin tam ayrıştırılmasını yenilikçi bir şekilde gerçekleştiren gelişmiş bir sıfır örnekli (zero-shot) metinden sese modelidir. Model, hassas konuşma süresi kontrolünü ve çok modlu duygu kontrolünü destekler, hedef tınıyı korurken belirtilen duygusal tonlamayı doğru bir şekilde yeniden üretebilir.\n\nModel, üç aşamalı bir eğitim paradigması kullanır ve GPT gizli gösterimleri sunar, yüksek duygusal ifade altında bile mükemmel konuşma netliği ve kararlılığı sağlar. Qwen tabanlı yumuşak talimat mekanizması sayesinde, kullanıcılar doğal dil açıklamaları kullanarak üretilen konuşmanın duygusal özelliklerini kolayca kontrol edebilirler.\n\nÇoklu veri kümesi değerlendirmelerinde, IndexTTS2, kelime hata oranı, konuşmacı benzerliği ve duygu sadakati gibi temel metriklerde mevcut sıfır örnekli TTS modellerini aşarak sektör lideri konuşma sentez kalitesi sunmaktadır.\n\n**Temel Özellikler:**\n- Eğitim olmadan herhangi bir tınıyı çoğaltmak için sıfır örnekli TTS yeteneği\n- Çok modlu duygu girişi ile duygu ve tınının bağımsız kontrolü\n- Mükemmel ses-video senkronizasyonu için açık token sayısı belirtimi ile hassas süre kontrolü\n- Metin açıklamaları aracılığıyla konuşma üretimini yönlendirmek için doğal dil tabanlı duygu kontrolü\n\n**Ön Koşullar:**\n- Lütfen kullanılabilir belleğin > 12 GB olduğundan emin olun, aksi takdirde uygulama düzgün çalışmayabilir\n- ≥ 8 GB VRAM'e sahip NVIDIA GPU (optimal performans için önerilir)\n- NVIDIA CUDA Toolkit sürüm ≥ 12.8\n\n**Daha Fazla Bilgi:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  zh: "IndexTTS2 是一个先进的零样本文本转语音模型，创新性地实现了情感表达与说话人身份的完全解耦。模型支持精确的语音时长控制和多模态情感控制，能够在保持目标音色的同时准确还原指定的情感语调。\n\n该模型采用三阶段训练范式并引入GPT潜在表示，确保在高情感表达下仍能保持出色的语音清晰度和稳定性。通过基于Qwen的软指令机制，用户可以使用自然语言描述轻松控制生成语音的情感特征。\n\n在多数据集评测中，IndexTTS2在词错误率、说话人相似度和情感保真度等关键指标上均超越现有零样本TTS模型，提供了业界领先的语音合成质量。\n\n**主要功能：**\n- 零样本TTS能力，无需训练即可复刻任意音色\n- 情感与音色独立控制，支持多模态情感输入\n- 精确时长控制，可显式指定token数量实现完美音视频同步\n- 基于自然语言的情感控制，通过文本描述引导语音生成\n\n**前置条件:**\n- 请确保可用内存 > 12G，否则可能会导致应用无法正常运行\n- 具有 ≥ 8 GB 显存的 NVIDIA GPU（推荐，用于获得最佳性能）\n- NVIDIA CUDA Toolkit 版本 ≥ 12.8\n\n**了解更多：**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  uk: "IndexTTS2 — сучасна модель синтезу мовлення з тексту без додаткового навчання (zero-shot), яка по-новому повністю розділяє емоційне забарвлення та особу мовця. Модель підтримує точне керування тривалістю мовлення й мультимодальне керування емоціями: зберігаючи тембр потрібного голосу, вона точно відтворює задану емоційну інтонацію.\n\nМодель використовує триетапну схему навчання та латентні представлення GPT, що забезпечує чудову розбірливість і стабільність мовлення навіть за яскравого вираження емоцій. Завдяки механізму м’яких інструкцій на основі Qwen емоційними характеристиками згенерованого мовлення можна легко керувати за допомогою описів природною мовою.\n\nУ порівняннях на кількох наборах даних IndexTTS2 перевершує наявні zero-shot TTS-моделі за ключовими показниками — частотою помилок у словах, схожістю голосу та точністю емоцій — і забезпечує провідну в галузі якість синтезу мовлення.\n\n**Основні можливості:**\n- Zero-shot TTS: відтворення будь-якого тембру без навчання\n- Незалежне керування емоціями й тембром, мультимодальне введення емоцій\n- Точне керування тривалістю: явне задання кількості токенів для ідеальної синхронізації звуку з відео\n- Керування емоціями природною мовою: мовлення формується за текстовими описами\n\n**Вимоги:**\n- Переконайтеся, що вільної пам’яті понад 12 ГБ, інакше застосунок може працювати некоректно\n- Відеокарта NVIDIA з ≥ 8 ГБ відеопам’яті (рекомендовано для найкращої продуктивності)\n- NVIDIA CUDA Toolkit версії ≥ 12.8\n\n**Докладніше:**\n- [IndexTTS на GitHub](https://github.com/index-tts/index-tts)"
