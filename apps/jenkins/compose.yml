# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    privileged: false
    user: root
    restart: always
    cpu_shares: 50
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
      - type: bind
        source: /var/lib/docker/volumes/b098c98b2c5dec792246dc33375853c05958ace7c144f4aa157326a6f6c0de4c/_data
        target: /var/jenkins_home
    hostname: Jenkins
    networks:
      default:
        aliases:
          - Jenkins
