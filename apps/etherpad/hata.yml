title:
  en: Etherpad
tagline:
  en: Real-time collaborative document editor
  it: Editor di documenti collaborativo in tempo reale
  nb: Samarbeidsredigerer for dokumenter i sanntid
  zh: 实时协作文档编辑器
  ja: リアルタイム共同文書エディタ
  ko: 실시간 협업 문서 편집기
  fr: Éditeur de documents collaboratif en temps réel
  de: Kollaborativer Dokumenteneditor in Echtzeit
  sv: Samarbetseditor för dokument i realtid
  el: Επεξεργαστής συνεργατικών εγγράφων σε πραγματικό χρόνο
  hr: Uređivač suradničkih dokumenata u stvarnom vremenu
  pt: Editor colaborativo de documentos em tempo real
  ru: Редактор совместных документов в реальном времени
  tr: Gerçek zamanlı ortak belge düzenleyici
  uk: Редактор документів для спільної роботи в реальному часі
description:
  en: "Etherpad is a real-time collaborative document editor where multiple people can edit the same pad simultaneously, with every change synchronized instantly and colour-coded per author. Self-hosted, open source, and fully under your control, it is perfect for meeting notes, brainstorming, shared writing, and lightweight knowledge capture. It ships with a built-in admin panel, a plugin ecosystem of 250+ add-ons, native DOCX/PDF/Markdown import & export, and multi-architecture container support (amd64 + arm64).\n\n**Main Features:**\n- Real-time collaborative editing with instant sync\n- Per-author colour coding for clear writing attribution\n- Built-in admin panel and a plugin ecosystem with 250+ add-ons\n- Native DOCX, PDF, and Markdown import & export\n- Open source, self-hosted deployment with amd64 and arm64 support\n\n**Learn More:**\n- [Etherpad Official Website](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad Documentation](https://docs.etherpad.org/)"
  it: "Etherpad è un editor di documenti collaborativo in tempo reale in cui più persone possono modificare lo stesso pad contemporaneamente, con ogni modifica sincronizzata all'istante e colorata in base all'autore. Self-hosted, open source e completamente sotto il tuo controllo, è perfetto per verbali di riunioni, brainstorming, scrittura condivisa e raccolta leggera della conoscenza. Include un pannello di amministrazione integrato, un ecosistema di oltre 250 componenti aggiuntivi, importazione ed esportazione native DOCX/PDF/Markdown e supporto multiarchitettura per container (amd64 + arm64).\n\n**Funzionalità Principali:**\n- Modifica collaborativa in tempo reale con sincronizzazione immediata\n- Colori per autore per vedere chiaramente chi ha scritto cosa\n- Pannello di amministrazione integrato ed ecosistema con oltre 250 componenti aggiuntivi\n- Importazione ed esportazione native di DOCX, PDF e Markdown\n- Distribuzione open source self-hosted con supporto amd64 e arm64\n\n**Ulteriori Informazioni:**\n- [Sito Ufficiale Etherpad](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Documentazione Etherpad](https://docs.etherpad.org/)"
  nb: "Etherpad er en samarbeidsredigerer for dokumenter i sanntid der flere personer kan redigere samme pad samtidig, og hver endring synkroniseres umiddelbart og fargekodes etter forfatter. Selvhostet, åpen kildekode og fullt under din kontroll, passer det godt til møtenotater, idémyldring, delt skriving og lett kunnskapsfangst. Det leveres med et innebygd administrasjonspanel, et plugin-økosystem med 250+ tillegg, innebygd import og eksport for DOCX/PDF/Markdown og multiarkitektur-støtte for containere (amd64 + arm64).\n\n**Hovedfunksjoner:**\n- Samarbeidsredigering i sanntid med øyeblikkelig synkronisering\n- Fargekoding per forfatter for tydelig skriveattribusjon\n- Innebygd administrasjonspanel og plugin-økosystem med 250+ tillegg\n- Innebygd import og eksport av DOCX, PDF og Markdown\n- Åpen kildekode og selvhostet drift med støtte for amd64 og arm64\n\n**Lær Mer:**\n- [Etherpad Offisielle Nettside](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad Dokumentasjon](https://docs.etherpad.org/)"
  zh: "Etherpad 是一款实时协作文档编辑器，多人可以同时编辑同一个 pad，所有修改都会立即同步，并按作者颜色区分。 它支持自托管、开源且完全由你掌控，非常适合会议记录、头脑风暴、协作写作和轻量知识沉淀。 它内置管理面板，拥有 250+ 插件生态，原生支持 DOCX/PDF/Markdown 导入导出，并提供 amd64 与 arm64 多架构容器支持。\n\n**主要功能：**\n- 实时协同编辑，修改即时同步\n- 按作者颜色区分内容，便于追踪贡献\n- 内置管理面板，配合 250+ 插件扩展生态\n- 原生支持 DOCX、PDF 和 Markdown 的导入与导出\n- 开源自托管部署，支持 amd64 和 arm64\n\n**了解更多：**\n- [Etherpad 官网](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad 文档](https://docs.etherpad.org/)"
  ja: "Etherpadはリアルタイム共同文書エディタであり、複数の人が同じパッドを同時に編集でき、すべての変更は即座に同期され、著者ごとに色分けされます。 セルフホスト可能でオープンソース、そして完全に自分で管理できるため、会議メモ、ブレインストーミング、共同執筆、軽量なナレッジ共有に適しています。 内蔵の管理パネル、250以上のアドオンを持つプラグインエコシステム、DOCX/PDF/Markdownのネイティブなインポートとエクスポート、amd64とarm64向けのマルチアーキテクチャ対応コンテナを備えています。\n\n**主な機能：**\n- 即時同期に対応したリアルタイム共同編集\n- 誰が書いたかを分かりやすくする著者ごとの色分け\n- 内蔵管理パネルと250以上のアドオンを備えたプラグインエコシステム\n- DOCX、PDF、Markdownのネイティブなインポートとエクスポート\n- amd64とarm64をサポートするオープンソースのセルフホスト運用\n\n**詳細情報：**\n- [Etherpad 公式サイト](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad ドキュメント](https://docs.etherpad.org/)"
  ko: "Etherpad는 실시간 협업 문서 편집기로, 여러 사람이 같은 패드를 동시에 편집할 수 있으며 모든 변경 사항은 즉시 동기화되고 작성자별로 색상이 구분됩니다. 자체 호스팅이 가능하고 오픈 소스이며 완전히 직접 제어할 수 있어 회의록, 브레인스토밍, 공동 작성, 가벼운 지식 정리에 적합합니다. 내장 관리자 패널, 250개 이상의 애드온을 갖춘 플러그인 생태계, DOCX/PDF/Markdown의 기본 가져오기 및 내보내기, amd64와 arm64를 지원하는 멀티 아키텍처 컨테이너를 제공합니다.\n\n**주요 기능:**\n- 즉시 동기화되는 실시간 협업 편집\n- 누가 무엇을 썼는지 보여 주는 작성자별 색상 구분\n- 250개 이상의 애드온을 갖춘 내장 관리자 패널과 플러그인 생태계\n- DOCX, PDF, Markdown의 기본 가져오기 및 내보내기\n- amd64와 arm64를 지원하는 오픈 소스 자체 호스팅 배포\n\n**더 알아보기:**\n- [Etherpad 공식 웹사이트](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad 문서](https://docs.etherpad.org/)"
  fr: "Etherpad est un éditeur de documents collaboratif en temps réel où plusieurs personnes peuvent modifier le même pad simultanément, avec chaque changement synchronisé instantanément et codé par couleur selon l'auteur. Auto-hébergé, open source et entièrement sous votre contrôle, il est idéal pour les comptes rendus de réunion, le brainstorming, l'écriture partagée et la capture légère de connaissances. Il comprend un panneau d'administration intégré, un écosystème de plus de 250 extensions, l'import et l'export natifs DOCX/PDF/Markdown, ainsi qu'une prise en charge multiarchitecture des conteneurs (amd64 + arm64).\n\n**Fonctionnalités Principales :**\n- Édition collaborative en temps réel avec synchronisation immédiate\n- Codage par couleur par auteur pour identifier clairement les contributions\n- Panneau d'administration intégré et écosystème de plus de 250 extensions\n- Import et export natifs de DOCX, PDF et Markdown\n- Déploiement auto-hébergé open source avec prise en charge amd64 et arm64\n\n**En Savoir Plus :**\n- [Site Officiel Etherpad](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Documentation Etherpad](https://docs.etherpad.org/)"
  de: "Etherpad ist ein kollaborativer Dokumenteneditor in Echtzeit, in dem mehrere Personen gleichzeitig dasselbe Pad bearbeiten können, wobei jede Änderung sofort synchronisiert und pro Autor farblich gekennzeichnet wird. Selbst gehostet, Open Source und vollständig unter Ihrer Kontrolle eignet es sich ideal für Besprechungsnotizen, Brainstorming, gemeinsames Schreiben und leichte Wissensdokumentation. Es bietet ein integriertes Administrationspanel, ein Plugin-Ökosystem mit mehr als 250 Erweiterungen, nativen DOCX/PDF/Markdown-Import und -Export sowie Multiarchitektur-Containerunterstützung für amd64 und arm64.\n\n**Hauptfunktionen:**\n- Zusammenarbeit in Echtzeit mit sofortiger Synchronisierung\n- Farbliche Kennzeichnung pro Autor für klare Zuordnung von Beiträgen\n- Integriertes Administrationspanel und Plugin-Ökosystem mit über 250 Erweiterungen\n- Nativer Import und Export für DOCX, PDF und Markdown\n- Open-Source-Self-Hosting mit Unterstützung für amd64 und arm64\n\n**Mehr Erfahren:**\n- [Etherpad Offizielle Website](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad Dokumentation](https://docs.etherpad.org/)"
  sv: "Etherpad är en samarbetseditor för dokument i realtid där flera personer kan redigera samma pad samtidigt, och varje ändring synkroniseras direkt och färgkodas per författare. Självhostad, öppen källkod och helt under din kontroll passar den bra för mötesanteckningar, brainstorming, gemensamt skrivande och lätt kunskapsinsamling. Den levereras med en inbyggd administrationspanel, ett plugin-ekosystem med över 250 tillägg, inbyggd import och export för DOCX/PDF/Markdown samt containerstöd för flera arkitekturer (amd64 + arm64).\n\n**Huvudfunktioner:**\n- Samarbetsredigering i realtid med omedelbar synkronisering\n- Färgkodning per författare för tydlig attribution\n- Inbyggd administrationspanel och plugin-ekosystem med över 250 tillägg\n- Inbyggd import och export av DOCX, PDF och Markdown\n- Öppen källkod och självhostad drift med stöd för amd64 och arm64\n\n**Lär Dig Mer:**\n- [Etherpad Officiella Webbplats](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad Dokumentation](https://docs.etherpad.org/)"
  el: "Το Etherpad είναι ένας επεξεργαστής συνεργατικών εγγράφων σε πραγματικό χρόνο όπου πολλά άτομα μπορούν να επεξεργάζονται το ίδιο pad ταυτόχρονα, με κάθε αλλαγή να συγχρονίζεται άμεσα και να χρωματίζεται ανά συγγραφέα. Αυτο-φιλοξενούμενο, ανοιχτού κώδικα και πλήρως υπό τον έλεγχό σας, είναι ιδανικό για σημειώσεις συναντήσεων, brainstorming, κοινή συγγραφή και ελαφριά καταγραφή γνώσης. Περιλαμβάνει ενσωματωμένο πίνακα διαχείρισης, οικοσύστημα με 250+ πρόσθετα, εγγενή εισαγωγή και εξαγωγή DOCX/PDF/Markdown και υποστήριξη κοντέινερ πολλαπλών αρχιτεκτονικών (amd64 + arm64).\n\n**Κύριες Λειτουργίες:**\n- Συνεργατική επεξεργασία σε πραγματικό χρόνο με άμεσο συγχρονισμό\n- Χρωματική κωδικοποίηση ανά συγγραφέα για σαφή απόδοση συνεισφορών\n- Ενσωματωμένος πίνακας διαχείρισης και οικοσύστημα με 250+ πρόσθετα\n- Εγγενής εισαγωγή και εξαγωγή DOCX, PDF και Markdown\n- Αυτο-φιλοξενούμενη εγκατάσταση ανοιχτού κώδικα με υποστήριξη amd64 και arm64\n\n**Μάθετε Περισσότερα:**\n- [Επίσημος Ιστότοπος Etherpad](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Τεκμηρίωση Etherpad](https://docs.etherpad.org/)"
  hr: "Etherpad je uređivač suradničkih dokumenata u stvarnom vremenu u kojem više osoba može istovremeno uređivati isti pad, a svaka promjena sinkronizira se odmah i označava bojom prema autoru. Samohostiran, otvorenog koda i potpuno pod vašom kontrolom, idealan je za zapisnike sastanaka, brainstorming, zajedničko pisanje i lagano bilježenje znanja. Dolazi s ugrađenom administratorskom pločom, ekosustavom s više od 250 dodataka, izvornim DOCX/PDF/Markdown uvozom i izvozom te podrškom za višearhitekturne spremnike (amd64 + arm64).\n\n**Glavne Funkcije:**\n- Suradničko uređivanje u stvarnom vremenu s trenutačnom sinkronizacijom\n- Označavanje bojom po autoru za jasno praćenje doprinosa\n- Ugrađena administratorska ploča i ekosustav s više od 250 dodataka\n- Izvorni uvoz i izvoz za DOCX, PDF i Markdown\n- Samohostirano open source postavljanje uz podršku za amd64 i arm64\n\n**Saznajte Više:**\n- [Službena Web Stranica Etherpad](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad Dokumentacija](https://docs.etherpad.org/)"
  pt: "Etherpad é um editor colaborativo de documentos em tempo real onde várias pessoas podem editar o mesmo pad em simultâneo, com cada alteração sincronizada de imediato e identificada por cores por autor. Auto-hospedado, open source e totalmente sob o seu controlo, é ideal para notas de reunião, brainstorming, escrita partilhada e recolha leve de conhecimento. Inclui um painel de administração integrado, um ecossistema com mais de 250 extensões, importação e exportação nativas de DOCX/PDF/Markdown e suporte de contentor multiarquitetura (amd64 + arm64).\n\n**Principais Funcionalidades:**\n- Edição colaborativa em tempo real com sincronização imediata\n- Identificação por cores por autor para atribuição clara do texto\n- Painel de administração integrado e ecossistema com mais de 250 extensões\n- Importação e exportação nativas de DOCX, PDF e Markdown\n- Implementação auto-hospedada open source com suporte para amd64 e arm64\n\n**Saiba Mais:**\n- [Site Oficial Etherpad](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Documentação Etherpad](https://docs.etherpad.org/)"
  ru: "Etherpad - это редактор совместных документов в реальном времени, в котором несколько человек могут одновременно редактировать один и тот же pad, при этом каждое изменение мгновенно синхронизируется и выделяется цветом по автору. Самостоятельно размещаемый, с открытым исходным кодом и полностью подконтрольный вам, он отлично подходит для заметок встреч, мозговых штурмов, совместного письма и легкого накопления знаний. В комплект входят встроенная панель администратора, экосистема из 250+ дополнений, нативный импорт и экспорт DOCX/PDF/Markdown, а также поддержка контейнеров для нескольких архитектур (amd64 + arm64).\n\n**Основные Функции:**\n- Совместное редактирование в реальном времени с мгновенной синхронизацией\n- Цветовое выделение по авторам для понятной атрибуции текста\n- Встроенная панель администратора и экосистема из 250+ дополнений\n- Нативный импорт и экспорт DOCX, PDF и Markdown\n- Open source self-hosted развертывание с поддержкой amd64 и arm64\n\n**Узнать Больше:**\n- [Официальный Сайт Etherpad](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Документация Etherpad](https://docs.etherpad.org/)"
  tr: "Etherpad, birden fazla kişinin aynı pad üzerinde aynı anda çalışabildiği, her değişikliğin anında senkronize edilip yazara göre renkle gösterildiği gerçek zamanlı ortak belge düzenleyicisidir. Kendi kendine barındırılabilir, açık kaynaklıdır ve tamamen sizin kontrolünüzdedir; toplantı notları, beyin fırtınası, ortak yazım ve hafif bilgi toplama için idealdir. Yerleşik bir yönetim paneli, 250'den fazla eklenti içeren bir ekosistem, yerel DOCX/PDF/Markdown içe aktarma ve dışa aktarma ile çoklu mimari kapsayıcı desteği (amd64 + arm64) sunar.\n\n**Başlıca İşlevler:**\n- Anında senkronizasyon ile gerçek zamanlı ortak düzenleme\n- Katkıları açıkça görmek için yazar bazlı renk kodlama\n- Yerleşik yönetim paneli ve 250'den fazla eklenti içeren ekosistem\n- DOCX, PDF ve Markdown için yerel içe aktarma ve dışa aktarma\n- amd64 ve arm64 desteğine sahip açık kaynaklı self-hosted kurulum\n\n**Daha Fazla Bilgi:**\n- [Etherpad Resmi Web Sitesi](https://etherpad.org/)\n- [Etherpad GitHub](https://github.com/ether/etherpad)\n- [Etherpad Dokümantasyonu](https://docs.etherpad.org/)"
  uk: "Etherpad — редактор документів для спільної роботи в реальному часі: кілька людей одночасно редагують один пад, кожна зміна миттєво синхронізується й позначається кольором автора. Це відкрите програмне забезпечення для самостійного розгортання, яке повністю під вашим контролем, і воно ідеально підходить для нотаток із нарад, мозкових штурмів, спільного письма та швидкого запису знань. Має вбудовану панель адміністратора, екосистему з понад 250 плагінів, вбудований імпорт і експорт DOCX/PDF/Markdown та підтримку контейнерів для кількох архітектур (amd64 + arm64).\n\n**Основні можливості:**\n- Спільне редагування в реальному часі з миттєвою синхронізацією\n- Кольорове позначення авторів, щоб було видно, хто що написав\n- Вбудована панель адміністратора та екосистема з понад 250 плагінів\n- Вбудований імпорт і експорт DOCX, PDF та Markdown\n- Відкритий код, самостійне розгортання, підтримка amd64 та arm64\n\n**Докладніше:**\n- [Офіційний сайт Etherpad](https://etherpad.org/)\n- [Etherpad на GitHub](https://github.com/ether/etherpad)\n- [Документація Etherpad](https://docs.etherpad.org/)"
notes:
  en: "Default admin password is \"admin\". Change ADMIN_PASSWORD before exposing Etherpad to the network. Pads are stored on-disk in /DATA/AppData/etherpad/var using the embedded dirty database; this is ideal for personal and small-team use. For heavy multi-user production workloads, switch DB_TYPE to postgres or mysql and point DB_HOST, DB_NAME, DB_USER, and DB_PASS at an external database."
  it: "La password amministratore predefinita è \"admin\". Modifica ADMIN_PASSWORD prima di esporre Etherpad alla rete. I pad vengono salvati su disco in /DATA/AppData/etherpad/var usando il database dirty integrato; questa configurazione è ideale per uso personale o per piccoli team. Per carichi di produzione con molti utenti, imposta DB_TYPE su postgres o mysql e fai puntare DB_HOST, DB_NAME, DB_USER e DB_PASS a un database esterno."
  nb: "Standard administratorpassord er \"admin\". Endre ADMIN_PASSWORD før du eksponerer Etherpad mot nettverket. Pads lagres på disk i /DATA/AppData/etherpad/var ved hjelp av den innebygde dirty-databasen; dette er ideelt for personlig bruk og små team. For tunge produksjonsmiljøer med mange brukere bør du bytte DB_TYPE til postgres eller mysql og peke DB_HOST, DB_NAME, DB_USER og DB_PASS til en ekstern database."
  zh: "默认管理员密码是 \"admin\"。在将 Etherpad 暴露到网络之前，请先修改 ADMIN_PASSWORD。Pad 数据会使用内置的 dirty 数据库存储在 /DATA/AppData/etherpad/var 中，这种方式适合个人或小团队使用。对于高并发的生产场景，请将 DB_TYPE 改为 postgres 或 mysql，并将 DB_HOST、DB_NAME、DB_USER 和 DB_PASS 指向外部数据库。"
  ja: "デフォルトの管理者パスワードは \"admin\" です。Etherpad をネットワークに公開する前に ADMIN_PASSWORD を変更してください。pad は組み込みの dirty データベースを使って /DATA/AppData/etherpad/var に保存され、この構成は個人利用や小規模チームに適しています。多数のユーザーが利用する本番環境では、DB_TYPE を postgres または mysql に変更し、DB_HOST、DB_NAME、DB_USER、DB_PASS を外部データベースに向けてください。"
  ko: "기본 관리자 비밀번호는 \"admin\"입니다. Etherpad를 네트워크에 노출하기 전에 ADMIN_PASSWORD를 변경하세요. 패드는 내장 dirty 데이터베이스를 사용해 /DATA/AppData/etherpad/var 에 디스크로 저장되며, 이 방식은 개인용이나 소규모 팀에 적합합니다. 많은 사용자가 사용하는 운영 환경이라면 DB_TYPE을 postgres 또는 mysql로 바꾸고 DB_HOST, DB_NAME, DB_USER, DB_PASS를 외부 데이터베이스로 지정하세요."
  fr: "Le mot de passe administrateur par défaut est \"admin\". Modifiez ADMIN_PASSWORD avant d'exposer Etherpad au réseau. Les pads sont stockés sur disque dans /DATA/AppData/etherpad/var à l'aide de la base dirty intégrée ; cette configuration convient à un usage personnel ou à de petites équipes. Pour des charges de production multi-utilisateurs importantes, remplacez DB_TYPE par postgres ou mysql et pointez DB_HOST, DB_NAME, DB_USER et DB_PASS vers une base de données externe."
  de: "Das Standard-Administratorpasswort lautet \"admin\". Ändern Sie ADMIN_PASSWORD, bevor Sie Etherpad im Netzwerk verfügbar machen. Pads werden mit der eingebetteten dirty-Datenbank auf dem Datenträger unter /DATA/AppData/etherpad/var gespeichert; das ist ideal für den persönlichen Einsatz und kleine Teams. Für stark ausgelastete Produktionsumgebungen mit vielen Benutzern sollten Sie DB_TYPE auf postgres oder mysql umstellen und DB_HOST, DB_NAME, DB_USER und DB_PASS auf eine externe Datenbank verweisen lassen."
  sv: "Standardlösenordet för administratören är \"admin\". Ändra ADMIN_PASSWORD innan du exponerar Etherpad mot nätverket. Pads lagras på disk i /DATA/AppData/etherpad/var med den inbyggda dirty-databasen; detta passar bra för personligt bruk och små team. För tyngre produktionsmiljöer med många användare bör du byta DB_TYPE till postgres eller mysql och peka DB_HOST, DB_NAME, DB_USER och DB_PASS mot en extern databas."
  el: "Ο προεπιλεγμένος κωδικός διαχειριστή είναι \"admin\". Αλλάξτε το ADMIN_PASSWORD πριν εκθέσετε το Etherpad στο δίκτυο. Τα pads αποθηκεύονται στον δίσκο στο /DATA/AppData/etherpad/var χρησιμοποιώντας την ενσωματωμένη βάση dirty· αυτή η ρύθμιση είναι ιδανική για προσωπική χρήση και μικρές ομάδες. Για βαριά παραγωγικά φορτία πολλών χρηστών, αλλάξτε το DB_TYPE σε postgres ή mysql και κατευθύνετε τα DB_HOST, DB_NAME, DB_USER και DB_PASS σε εξωτερική βάση δεδομένων."
  hr: "Zadana administratorska lozinka je \"admin\". Promijenite ADMIN_PASSWORD prije nego što Etherpad izložite mreži. Padovi se pohranjuju na disk u /DATA/AppData/etherpad/var koristeći ugrađenu dirty bazu podataka; to je idealno za osobnu upotrebu i male timove. Za zahtjevnija produkcijska okruženja s više korisnika promijenite DB_TYPE u postgres ili mysql te usmjerite DB_HOST, DB_NAME, DB_USER i DB_PASS na vanjsku bazu podataka."
  pt: "A palavra-passe de administrador predefinida é \"admin\". Altere ADMIN_PASSWORD antes de expor o Etherpad à rede. Os pads são guardados em disco em /DATA/AppData/etherpad/var usando a base de dados dirty incorporada; esta configuração é ideal para uso pessoal e pequenas equipas. Para cargas de produção multiutilizador mais pesadas, altere DB_TYPE para postgres ou mysql e aponte DB_HOST, DB_NAME, DB_USER e DB_PASS para uma base de dados externa."
  ru: "Пароль администратора по умолчанию - \"admin\". Измените ADMIN_PASSWORD перед тем, как открывать Etherpad для сети. Данные pad сохраняются на диске в /DATA/AppData/etherpad/var с использованием встроенной базы dirty; такой вариант подходит для личного использования и небольших команд. Для нагруженных производственных установок с большим числом пользователей переключите DB_TYPE на postgres или mysql и направьте DB_HOST, DB_NAME, DB_USER и DB_PASS на внешнюю базу данных."
  tr: "Varsayılan yönetici parolası \"admin\" değeridir. Etherpad'i ağa açmadan önce ADMIN_PASSWORD değerini değiştirin. Pad'ler, gömülü dirty veritabanı kullanılarak /DATA/AppData/etherpad/var üzerinde diske kaydedilir; bu yapı kişisel kullanım ve küçük ekipler için idealdir. Yoğun çok kullanıcılı üretim iş yüklerinde DB_TYPE değerini postgres veya mysql olarak değiştirin ve DB_HOST, DB_NAME, DB_USER ile DB_PASS değerlerini harici bir veritabanına yönlendirin."
  uk: "Пароль адміністратора за замовчуванням — \"admin\". Змініть ADMIN_PASSWORD, перш ніж відкривати Etherpad у мережі. Паєди зберігаються на диску в /DATA/AppData/etherpad/var у вбудованій базі dirty; це добре підходить для особистого використання та невеликих команд. Для великого навантаження з багатьма користувачами змініть DB_TYPE на postgres або mysql і вкажіть у DB_HOST, DB_NAME, DB_USER та DB_PASS зовнішню базу даних."
category: productivity
developer: Etherpad Foundation
website: https://etherpad.org/
source: https://github.com/ether/etherpad
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: etherpad
  port: 9001
settings:
  - name: WEB_PORT
    type: port
    default: 9001
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: TITLE
    type: text
    default: Etherpad
    label:
      en: Name of your Etherpad instance (shown in the browser tab)
      uk: Назва вашого Etherpad (показується на вкладці браузера)
  - name: ADMIN_PASSWORD
    type: password
    required: true
    label:
      en: Admin password
      uk: Пароль адміністратора
    hint:
      en: "Password for the \"admin\" user used to reach /admin. CHANGE THIS."
      uk: "Пароль користувача \"admin\" для входу в /admin. Обов'язково змініть."
  - name: AUTHENTICATION_METHOD
    type: text
    default: apikey
    label:
      en: Authentication method
      uk: Спосіб автентифікації
    hint:
      en: "Authentication mode. \"apikey\" (default here) enables admin login; \"sso\" enables OAuth2."
      uk: "Режим автентифікації. \"apikey\" (типово тут) вмикає вхід адміністратора; \"sso\" вмикає OAuth2."
  - name: DB_TYPE
    type: text
    default: dirty
    label:
      en: Db type
      uk: Тип бази даних
    hint:
      en: "Database backend. \"dirty\" is a zero-config embedded file store suitable for single-user installs. Use \"postgres\"/\"mysql\" for production."
      uk: "Сховище бази даних. \"dirty\" — вбудоване файлове сховище без налаштувань, підходить для одного користувача. Для постійної роботи використовуйте \"postgres\" або \"mysql\"."
  - name: DB_FILENAME
    type: text
    default: /opt/etherpad-lite/var/dirty.db
    label:
      en: Db filename
      uk: Файл бази даних
    hint:
      en: Path inside the container for the dirty-db file. Kept on the persistent volume.
      uk: Шлях усередині контейнера до файлу бази dirty. Зберігається на постійному томі.
  - name: TRUST_PROXY
    type: text
    default: "true"
    label:
      en: "Set to \"true\" when running behind the reverse proxy"
      uk: "Установіть \"true\", якщо працюєте за зворотним проксі"
  - name: REQUIRE_AUTHENTICATION
    type: text
    default: "false"
    label:
      en: Require authentication
      uk: Вимагати автентифікацію
    hint:
      en: "If \"true\", every pad requires a login. Default \"false\" means public pads."
      uk: "Якщо \"true\", кожен документ потребує входу. Типове \"false\" означає відкриті документи."
