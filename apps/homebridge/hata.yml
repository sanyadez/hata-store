# Apache-2.0, changed for Hata Store: see NOTICE
title: Homebridge
tagline:
  en: HomeKit support for the impatient.
  uk: Підтримка HomeKit для нетерплячих.
description:
  en: "Homebridge is a lightweight NodeJS server you can run on your home network that emulates the iOS HomeKit API. It supports Plugins, which are community-contributed modules that provide a basic bridge from HomeKit to various 3rd-party APIs provided by manufacturers of \"smart home\" devices."
  uk: "Homebridge — легкий сервер на NodeJS, який можна запустити у домашній мережі: він емулює API iOS HomeKit. Він підтримує плагіни — модулі від спільноти, що забезпечують простий міст між HomeKit і різними сторонніми API виробників пристроїв «розумного дому»."
category: home
developer: Homebridge
website: https://homebridge.io/
source: https://github.com/homebridge/homebridge
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: homebridge
  port: 8581
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
