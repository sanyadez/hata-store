# Apache-2.0, changed for Hata Store: see NOTICE
services:
  homebridge:
    image: homebridge/homebridge:latest@sha256:5a76d945dd24250b1886f13f14fd65bb3ccc8489eaf57a23dd336cff1cf436ba
    restart: always
    network_mode: host
    volumes:
      - "${APP_DATA:-.}/config:/homebridge"
    logging:
      driver: json-file
      options:
        max-size: 10mb
        max-file: "1"
