# Apache-2.0, changed for Hata Store: see NOTICE
services:
  homebridge:
    image: homebridge/homebridge:latest@sha256:3c775f1c761238ea3957d0c83c54b5270eae702236d3f67b6df81e1e621cd6e6
    restart: always
    network_mode: host
    volumes:
      - "${APP_DATA:-.}/config:/homebridge"
    logging:
      driver: json-file
      options:
        max-size: 10mb
        max-file: "1"
