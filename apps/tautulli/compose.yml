# Apache-2.0, changed for Hata Store: see NOTICE
services:
  tautulli:
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: "${TZ:-UTC}"
    image: linuxserver/tautulli:2.18.1
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-8181}:8181"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
