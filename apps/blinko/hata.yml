settings:
  - name: WEB_PORT
    type: port
    default: 1111
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: NODE_ENV
    type: text
    default: production
    label:
      en: "Node.js environment mode (development, production, or test)"
      uk: "Режим середовища Node.js (development, production або test)"
  - name: NEXTAUTH_SECRET
    type: secret
    length: 44
    label:
      en: Secret key used to encrypt NextAuth.js JWT tokens
      uk: Секретний ключ для шифрування JWT-токенів NextAuth.js
  - name: POSTGRES_DB
    type: text
    default: postgres
    label:
      en: Name of the PostgreSQL database to create and use
      uk: "Назва бази PostgreSQL, яку буде створено й використано"
  - name: POSTGRES_USER
    type: text
    default: postgres
    label:
      en: PostgreSQL database user for authentication
      uk: Користувач бази PostgreSQL для автентифікації
  - name: POSTGRES_PASSWORD
    type: secret
    label:
      en: PostgreSQL database user password for authentication
      uk: Пароль користувача бази PostgreSQL для автентифікації
