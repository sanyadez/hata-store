title: Index-TTS
tagline:
  en: An Industrial-Level Controllable and Efficient Zero-Shot Text-To-Speech System
  uk: "Промислова система синтезу мовлення з тексту без додаткового навчання, з гнучким керуванням і високою ефективністю"
description:
  en: "IndexTTS2 is an advanced zero-shot text-to-speech model that innovatively achieves complete decoupling of emotional expression and speaker identity. The model supports precise speech duration control and multimodal emotion control, capable of maintaining the target timbre while accurately reproducing the specified emotional intonation.\n\nThe model employs a three-stage training paradigm and introduces GPT latent representations, ensuring excellent speech clarity and stability even under high emotional expression. Through the Qwen-based soft instruction mechanism, users can easily control the emotional characteristics of generated speech using natural language descriptions.\n\nIn multi-dataset evaluations, IndexTTS2 surpasses existing zero-shot TTS models in key metrics such as word error rate, speaker similarity, and emotion fidelity, providing industry-leading speech synthesis quality.\n\n**Key Features:**\n- Zero-shot TTS capability to replicate any timbre without training\n- Independent control of emotion and timbre with multimodal emotion input\n- Precise duration control with explicit token count specification for perfect audio-video synchronization\n- Natural language-based emotion control to guide speech generation through text descriptions\n\n**Learn More:**\n- [IndexTTS GitHub](https://github.com/index-tts/index-tts)"
  uk: "IndexTTS2 — сучасна модель синтезу мовлення з тексту без додаткового навчання (zero-shot), яка по-новому повністю розділяє емоційне забарвлення та особу мовця. Модель підтримує точне керування тривалістю мовлення й мультимодальне керування емоціями: зберігаючи тембр потрібного голосу, вона точно відтворює задану емоційну інтонацію.\n\nМодель використовує триетапну схему навчання та латентні представлення GPT, що забезпечує чудову розбірливість і стабільність мовлення навіть за яскравого вираження емоцій. Завдяки механізму м’яких інструкцій на основі Qwen емоційними характеристиками згенерованого мовлення можна легко керувати за допомогою описів природною мовою.\n\nУ порівняннях на кількох наборах даних IndexTTS2 перевершує наявні zero-shot TTS-моделі за ключовими показниками — частотою помилок у словах, схожістю голосу та точністю емоцій — і забезпечує провідну в галузі якість синтезу мовлення.\n\n**Основні можливості:**\n- Zero-shot TTS: відтворення будь-якого тембру без навчання\n- Незалежне керування емоціями й тембром, мультимодальне введення емоцій\n- Точне керування тривалістю: явне задання кількості токенів для ідеальної синхронізації звуку з відео\n- Керування емоціями природною мовою: мовлення формується за текстовими описами\n\n**Докладніше:**\n- [IndexTTS на GitHub](https://github.com/index-tts/index-tts)"
