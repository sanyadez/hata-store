# Apache-2.0, changed for Hata Store: see NOTICE
services:
  mylar3:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: linuxserver/mylar3:0.9.0
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-8090}:8090"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${COMICS_DIR:-./Media/Comics}"
        target: /comics
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
