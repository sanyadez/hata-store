settings:
  - name: WEB_PORT
    type: port
    default: 8090
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: COMICS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Comics"
    label:
      en: Mylar3 Comics directory
      uk: Тека коміксів Mylar3
    hint:
      en: Inside the app it is /comics
      uk: У застосунку вона — /comics
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Mylar3 downloads directory
      uk: Тека завантажень Mylar3
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
