# Apache-2.0, changed for Hata Store: see NOTICE
services:
  memos:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: neosmemo/memos:0.31.0
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-5230}:5230"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/memos"
        target: /var/opt/memos
