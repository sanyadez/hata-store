title: Stable Diffusion
tagline:
  en: An AI model used to generate images conditioned on text descriptions.
  uk: Модель ШІ для створення зображень за текстовим описом.
description:
  en: "Stable Diffusion is a deep learning, text-to-image model released in 2022 based on diffusion techniques. It is primarily used to generate detailed images conditioned on text descriptions, though it can also be applied to other tasks such as inpainting, outpainting, and generating image-to-image translations guided by a text prompt."
  uk: "Stable Diffusion — модель глибокого навчання для перетворення тексту на зображення, випущена 2022 року на основі дифузійних технік. Її здебільшого використовують для створення детальних зображень за текстовим описом, але вона також придатна для інших завдань: дозаповнення (inpainting), добудови за межі кадру (outpainting) і перетворення одних зображень на інші за текстовою підказкою."
category: ai
developer: stability.ai
website: https://github.com/AUTOMATIC1111/stable-diffusion-webui
source: https://github.com/AUTOMATIC1111/stable-diffusion-webui
