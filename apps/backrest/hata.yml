title: Backrest
tagline:
  en: Backups of your folders with restic, set up and restored in the browser
  uk: Резервні копії ваших тек через restic, налаштування й відновлення в браузері
description:
  en: >
    A web page for restic, the fast and encrypted backup program. Plans copy chosen folders on a
    schedule to a disk, another machine or a cloud bucket (S3, Backblaze, SFTP and anything rclone
    reaches), keep as many versions as you say, and let you browse any of them and get a file back.
  uk: >
    Вебсторінка для restic — швидкої програми резервного копіювання з шифруванням. Плани за розкладом
    копіюють вибрані теки на диск, на інший комп'ютер чи в хмарне сховище (S3, Backblaze, SFTP і все,
    до чого дістається rclone), зберігають стільки версій, скільки скажете, і дають переглянути будь-яку
    з них та повернути файл.
notes:
  en: >
    At the first visit Backrest asks for a name and a password of its own. The folder to back up is
    seen inside as **/userdata** and only read; add a repository at **/repos** for copies on this
    server. Restored files go to a folder you pick there, for example /repos/restored.
  uk: >
    Під час першого відкриття Backrest попросить придумати власні ім'я й пароль. Тека для копіювання
    видна всередині як **/userdata** і лише читається; для копій на цьому сервері додайте сховище в
    **/repos**. Відновлені файли потрапляють у вибрану там теку, наприклад /repos/restored.
category: files
developer: Gareth George
website: https://garethgeorge.github.io/backrest/
source: https://github.com/garethgeorge/backrest
icon: data:image/webp;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: backrest
  port: 9898
settings:
  - name: WEB_PORT
    type: port
    default: 9898
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: BACKUP_SOURCE
    type: folder
    default: ${DATA_ROOT}/Documents
    required: true
    label: { en: Folder to back up, uk: "Тека, яку копіювати" }
    hint:
      en: Backrest only reads it. To back up several folders, pick the one that holds them all
      uk: Backrest її лише читає. Щоб копіювати кілька тек, виберіть ту, що містить їх усі
  - name: REPOS
    type: folder
    default: ${DATA_ROOT}/Restic
    required: true
    label: { en: Folder for the copies, uk: Тека для копій }
    hint:
      en: Where repositories on this server are kept; better on another disk than the data
      uk: Де лежать сховища копій на цьому сервері; краще на іншому диску, ніж самі дані
