# Apache-2.0, changed for Hata Store: see NOTICE
services:
  label-studio:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: heartexlabs/label-studio:1.23.2
    deploy:
      resources:
        reservations:
          memory: 256M
    ports:
      - "${WEB_PORT:-3080}:8080"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /label-studio/data
