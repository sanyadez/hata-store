# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Label Studio
tagline:
  en: Label Studio is an open source data labeling tool.
  zh: Label Studio 是一个开源数据标记工具。 它允许您使用简单直观的 UI 来标记音频、文本、图像、视频和时间序列等数据类型，并导出为各种模型格式。 它可用于准备原始数据或改进现有训练数据以获得更准确的机器学习模型。
  uk: Label Studio — інструмент розмітки даних з відкритим кодом.
description:
  en: "Label Studio is an open source data labeling tool. It lets you label data types like audio, text, images, videos, and time series with a simple and straightforward UI and export to various model formats. It can be used to prepare raw data or improve existing training data to get more accurate ML models."
  zh: Label Studio 是一个开源数据标记工具。 它允许您使用简单直观的 UI 来标记音频、文本、图像、视频和时间序列等数据类型，并导出为各种模型格式。 它可用于准备原始数据或改进现有训练数据以获得更准确的机器学习模型。
  uk: "Label Studio — інструмент розмітки даних з відкритим кодом. У простому й зрозумілому інтерфейсі в ньому можна розмічати дані різних типів — аудіо, текст, зображення, відео та часові ряди — і експортувати їх у різні формати моделей. Ним можна підготувати сирі дані або покращити наявні навчальні дані, щоб отримати точніші моделі машинного навчання."
