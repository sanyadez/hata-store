title: Zigbee2MQTT
tagline:
  en: Zigbee sensors, bulbs and switches of any brand, without their hubs
  uk: Датчики, лампи й вимикачі Zigbee будь-якої марки без їхніх хабів
description:
  en: >
    Talks to Zigbee devices through one USB or network adapter and passes them on over MQTT. Thousands
    of devices from Aqara, IKEA, Philips Hue, Tuya and others work without their makers' hubs and
    clouds, and Home Assistant finds them by itself. Its web page pairs devices and shows the Zigbee
    network as a map.
  uk: >
    Спілкується з пристроями Zigbee через один адаптер — USB чи мережевий — і передає їх далі через
    MQTT. Тисячі пристроїв Aqara, IKEA, Philips Hue, Tuya та інших працюють без фірмових хабів і хмар,
    а Home Assistant сам їх знаходить. На його вебсторінці пристрої додаються, а мережа Zigbee видна
    як мапа.
notes:
  en: >
    Plug the Zigbee adapter in before installing, and have an MQTT broker (Mosquitto from this store).
    The first visit to its page asks for the adapter and the broker's address
    (`mqtt://<server address>:1883`) with its user name and password; leave the web port there at 8080.
  uk: >
    Під'єднайте адаптер Zigbee до встановлення й майте брокер MQTT (Mosquitto з цього магазину).
    Під час першого відкриття сторінка спитає адаптер і адресу брокера
    (`mqtt://<адреса сервера>:1883`) з іменем і паролем; порт вебсторінки лишіть там 8080.
category: home
developer: Koen Kanters
website: https://www.zigbee2mqtt.io
source: https://github.com/Koenkk/zigbee2mqtt
icon: data:image/svg+xml;base64,
web:
  service: zigbee2mqtt
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ZIGBEE_ADAPTER
    type: text
    default: /dev/ttyUSB0
    required: true
    label: { en: Zigbee adapter, uk: Адаптер Zigbee }
    hint:
      en: >
        The USB adapter's device, best by its lasting name from /dev/serial/by-id/. A network adapter
        needs none: when the server has no such device, it is left out.
      uk: >
        Пристрій USB-адаптера, найкраще за сталою назвою з /dev/serial/by-id/. Мережевому адаптеру він
        не потрібен: якщо такого пристрою на сервері немає, його буде пропущено.
permissions:
  devices:
    en: Talks to the Zigbee adapter plugged into the server (the device chosen in the settings)
    uk: Працює з адаптером Zigbee, під'єднаним до сервера (пристрій, обраний у налаштуваннях)
  host-files:
    en: Reads the device database of the system (/run/udev) to recognise the adapter
    uk: Читає системну базу пристроїв (/run/udev), щоб розпізнати адаптер
