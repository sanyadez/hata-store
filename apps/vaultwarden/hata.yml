title: Vaultwarden
tagline:
  en: A password manager for the family, with the Bitwarden apps
  uk: Менеджер паролів для родини, з застосунками Bitwarden
description:
  en: >
    A light server for the Bitwarden apps and browser extensions: passwords, cards, notes and
    one-time codes, shared with family members through organisations, kept on your own server.
  uk: >
    Легкий сервер для застосунків і розширень браузера Bitwarden: паролі, картки, нотатки й
    одноразові коди, спільні з родиною через організації, — на вашому власному сервері.
notes:
  en: >
    The web vault and the apps work only over **HTTPS**: open it at its address under Hata's domain.
    Once everybody has an account, turn "Anyone may sign up" off.
  uk: >
    Вебсховище й застосунки працюють лише через **HTTPS**: відкривайте його за адресою під доменом
    Hata. Коли всі матимуть облікові записи, вимкніть «Будь-хто може зареєструватися».
category: security
developer: Daniel García
website: https://github.com/dani-garcia/vaultwarden
source: https://github.com/dani-garcia/vaultwarden
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: vaultwarden
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: SIGNUPS_ALLOWED
    type: switch
    default: true
    label: { en: Anyone may sign up, uk: Будь-хто може зареєструватися }
  - name: ADMIN_TOKEN
    type: password
    advanced: true
    label: { en: Admin page password, uk: Пароль сторінки адміністратора }
    hint:
      en: Opens /admin; leave it empty to keep that page off
      uk: Відкриває /admin; порожній — сторінка вимкнена
