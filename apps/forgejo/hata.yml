title: Forgejo
tagline:
  en: Your own place for Git repositories, like GitHub at home
  uk: Власне місце для репозиторіїв Git, як GitHub удома
description:
  en: >
    A light server for code and other projects kept in Git: repositories, issues, pull requests,
    a wiki, releases and packages, and automatic builds through Forgejo Actions once a runner is
    connected. Mirrors of repositories hosted elsewhere keep a copy of what matters to you at home.
  uk: >
    Легкий сервер для коду й інших проєктів у Git: репозиторії, задачі, запити на злиття, вікі,
    випуски й пакунки, а також автоматичні збірки через Forgejo Actions, якщо під'єднати
    виконавця. Дзеркала репозиторіїв з інших місць тримають удома копію того, що вам важливо.
notes:
  en: >
    The first visit opens the setup page: everything is filled in already, just make the
    administrator's account at the bottom of it.
  uk: >
    Перше відкриття показує сторінку налаштування: усе вже заповнено, лише створіть унизу
    обліковий запис адміністратора.
category: development
developer: Forgejo
website: https://forgejo.org
source: https://codeberg.org/forgejo/forgejo
icon: data:image/svg+xml;base64,
web:
  service: forgejo
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: SSH_PORT
    type: port
    default: 2222
    label: { en: SSH port for Git, uk: Порт SSH для Git }
    hint:
      en: Used in the addresses to clone over SSH
      uk: Його видно в адресах для клонування через SSH
