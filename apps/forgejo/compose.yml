services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.0
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-3000}:3000
      - ${SSH_PORT:-2222}:22
    volumes:
      - ${APP_DATA:-.}/data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: ${APP_URL:-http://localhost:3000}/
      FORGEJO__server__DOMAIN: ${APP_HOST:-localhost}
      FORGEJO__server__SSH_DOMAIN: ${APP_HOST:-localhost}
      FORGEJO__server__SSH_PORT: ${SSH_PORT:-2222}
