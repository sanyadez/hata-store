# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  ombi:
    environment:
      BASE_URL: /ombi
      PGID: "1000"
      PUID: "1000"
      TZ: "${TZ:-UTC}"
    image: linuxserver/ombi:4.53.5
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-3579}:3579"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
