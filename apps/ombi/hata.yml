title: Ombi
tagline:
  en: "Friendly media request tool, automatically syncs with your media servers!"
  uk: "Зручний інструмент запитів на медіа, який сам синхронізується з вашими медіасерверами!"
description:
  en: Ombi is a self-hosted web application that automatically gives your shared Plex or Emby users the ability to request content by themselves! Ombi can be linked to multiple TV Show and Movie DVR tools to create a seamless end-to-end experience for your users.
  uk: "Ombi — вебзастосунок на власному сервері, який дає вашим користувачам Plex або Emby змогу самим надсилати запити на контент. Ombi можна пов’язати з кількома інструментами для фільмів і серіалів, щоб користувачі мали цілісний досвід від запиту до перегляду."
category: media
developer: Sabnzbd Team
website: https://ombi.io
source: https://github.com/Ombi-app/Ombi
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: ombi
  port: 3579
settings:
  - name: WEB_PORT
    type: port
    default: 3579
    label:
      en: Web port
      uk: Порт вебінтерфейсу
