title: code-server
tagline:
  en: Visual Studio Code in the browser, running on your server
  uk: Visual Studio Code у браузері, що працює на вашому сервері
description:
  en: >
    The editor of Visual Studio Code served as a web page: open your projects from any computer or
    tablet, with the terminal, Git, extensions and the server's speed behind them. Handy for editing
    configs and scripts of the home server itself.
  uk: >
    Редактор Visual Studio Code як вебсторінка: відкривайте свої проєкти з будь-якого комп'ютера чи
    планшета, з терміналом, Git, розширеннями й потужністю сервера. Зручно правити налаштування й
    скрипти самого домашнього сервера.
notes:
  en: >
    Some parts (previews of extensions, the clipboard) work only over **HTTPS**: open it at its address
    under Hata's domain. The terminal inside runs as the apps' user and sees only its own folders and
    the projects folder.
  uk: >
    Деякі частини (перегляд у розширеннях, буфер обміну) працюють лише через **HTTPS**: відкривайте його
    за адресою під доменом Hata. Термінал усередині працює від імені користувача застосунків і бачить
    лише власні теки та теку з проєктами.
category: development
developer: Coder
website: https://coder.com/docs/code-server
source: https://github.com/coder/code-server
icon: data:image/webp;base64,
web:
  service: code-server
  port: 8443
settings:
  - name: WEB_PORT
    type: port
    default: 8443
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: PASSWORD
    type: password
    required: true
    label: { en: Password to sign in, uk: Пароль для входу }
  - name: PROJECTS
    type: folder
    default: ${DATA_ROOT}/Projects
    label: { en: Projects folder, uk: Тека з проєктами }
    hint:
      en: Opened in the editor at the start
      uk: Відкривається в редакторі одразу
