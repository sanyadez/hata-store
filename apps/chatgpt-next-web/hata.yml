# Apache-2.0, changed for Hata Store: see NOTICE
title: ChatGPT Next Web
tagline:
  en: A well-designed cross-platform ChatGPT UI.
  uk: Продуманий кросплатформний інтерфейс ChatGPT.
description:
  en: "An intelligent chat application based on ChatGPT, supports fast deployment, Markdown, beautiful UI, fluid response, privacy and security, and allows customization of preset roles for quick creation, sharing, and debugging of personalized conversations."
  uk: "Розумний чат-застосунок на основі ChatGPT: швидке розгортання, підтримка Markdown, гарний інтерфейс, плавні відповіді, приватність і безпека. Дає змогу налаштовувати готові ролі, щоб швидко створювати, поширювати й налагоджувати персоналізовані розмови."
category: ai
developer: Yidadaa
website: https://nextchat.club
source: https://github.com/ChatGPTNextWeb/NextChat
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: chatgpt-next-web
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: CODE
    type: text
    label:
      en: "Access password, separated by comma"
      uk: Пароль доступу (кілька — через кому)
  - name: PROXY_URL
    type: text
    label:
      en: http proxy
      uk: HTTP-проксі
  - name: BASE_URL
    type: text
    default: https://api.openai.com
    label:
      en: Override OpenAI API request base URL
      uk: Інша базова адреса для запитів до API OpenAI
