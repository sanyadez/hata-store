# Apache-2.0, changed for Hata Store: see NOTICE
title: Netronome
tagline:
  en: "Monitor, analyze, and alert on network performance."
  uk: "Стежте за продуктивністю мережі, аналізуйте її та отримуйте сповіщення."
description:
  en: "Netronome is a complete network performance monitoring solution with speed tests, continuous packet-loss monitoring, distributed server agents, automated alerts, visualizations, and historical tracking."
  uk: "Netronome — повноцінне рішення для моніторингу продуктивності мережі: тести швидкості, постійне стеження за втратою пакетів, розподілені серверні агенти, автоматичні сповіщення, візуалізації та історія вимірювань."
category: network
developer: autobrr
website: https://netrono.me
source: https://github.com/autobrr/netronome
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: netronome
  port: 7575
settings:
  - name: WEB_PORT
    type: port
    default: 7575
    label:
      en: Web port
      uk: Порт вебінтерфейсу
permissions:
  capabilities:
    en: "It asks for extra rights of the system: NET_RAW"
    uk: "Він просить додаткових прав у системі: NET_RAW"
