title: Immich
tagline:
  en: Photos and videos from every phone in the family, backed up at home
  uk: Фото й відео з усіх телефонів родини, збережені вдома
description:
  en: >
    A photo library in the spirit of Google Photos. The phone app uploads new pictures by itself;
    the server finds faces, places and things in them, so a search for "dog on the beach" works,
    and keeps albums, shared links and memories of this day years ago.
  uk: >
    Фотобібліотека на кшталт Google Photos. Застосунок на телефоні сам вивантажує нові знімки;
    сервер знаходить на них обличчя, місця й речі, тож пошук «собака на пляжі» працює, і тримає
    альбоми, спільні посилання й спогади про цей день кілька років тому.
notes:
  en: >
    Recognising faces and things needs a few gigabytes of memory, and the first pass over a large
    library takes hours. The database stays in the app's folder: keep it on a local disk, not on a
    network one.
  uk: >
    Розпізнавання облич і речей потребує кількох гігабайтів пам'яті, а перший прохід великою
    бібліотекою триває години. База даних лишається в теці застосунку: тримайте її на локальному
    диску, не на мережевому.
category: photos
developer: Immich
website: https://immich.app
source: https://github.com/immich-app/immich
icon: data:image/svg+xml;base64,
web:
  service: immich-server
  port: 2283
settings:
  - name: WEB_PORT
    type: port
    default: 2283
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: UPLOAD_LOCATION
    type: folder
    default: ${DATA_ROOT}/Gallery
    label: { en: Photo folder, uk: Тека для фото }
    hint:
      en: Where uploaded photos and videos are kept
      uk: Куди складаються вивантажені фото й відео
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
