settings:
  - name: NB_SETUP_KEY
    type: password
    label:
      en: Nb setup key
      uk: Ключ налаштування
    hint:
      en: NetBird Setup Key (get from your dashboard at app.netbird.io or your self-hosted instance)
      zh: NetBird 设置密钥（从 app.netbird.io 或您的自托管实例获取）
      ja: NetBirdセットアップキー（app.netbird.ioまたはセルフホストインスタンスから取得）
      uk: Ключ налаштування NetBird (отримайте на панелі керування app.netbird.io або на власному сервері).
  - name: NB_MANAGEMENT_URL
    type: text
    label:
      en: "NetBird Management URL (optional, for self-hosted instances)"
      zh: NetBird 管理 URL（可选，用于自托管实例）
      ja: NetBird管理URL（オプション、セルフホストインスタンス用）
      uk: "URL керування NetBird (необов'язково, для власних серверів)"
  - name: NB_HOSTNAME
    type: text
    default: hata
    label:
      en: Hostname for this NetBird client
      zh: 此 NetBird 客户端的主机名
      ja: このNetBirdクライアントのホスト名
      uk: "Ім'я хоста для цього клієнта NetBird"
  - name: NB_ENABLE_SSH_ROOT
    type: text
    default: "true"
    label:
      en: Enable SSH access as root user
      zh: 启用 root 用户 SSH 访问
      ja: rootユーザーでのSSHアクセスを有効にする
      uk: Увімкнути SSH-доступ для користувача root
  - name: NB_ALLOW_SERVER_SSH
    type: text
    default: "true"
    label:
      en: Allow SSH server access through NetBird
      zh: 允许通过 NetBird 访问 SSH 服务器
      ja: NetBird経由のSSHサーバーアクセスを許可
      uk: Дозволити SSH-доступ до сервера через NetBird
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
  capabilities:
    en: "It asks for extra rights of the system: NET_ADMIN, SYS_ADMIN, SYS_RESOURCE"
    uk: "Він просить додаткових прав у системі: NET_ADMIN, SYS_ADMIN, SYS_RESOURCE"
