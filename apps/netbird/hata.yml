# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: NetBird
tagline:
  en: "Connect your devices into a secure WireGuard®-based overlay network with SSO, MFA and granular access controls."
  zh: 将设备连接到安全的 WireGuard® 覆盖网络，支持 SSO、MFA 和细粒度访问控制。
  ja: SSO、MFA、きめ細かなアクセス制御を備えた安全なWireGuard®ベースのオーバーレイネットワークにデバイスを接続します。
  uk: "Об'єднайте свої пристрої в захищену оверлейну мережу на основі WireGuard® з SSO, MFA та гнучким керуванням доступом."
description:
  en: "NetBird combines a WireGuard®-based overlay network with Zero Trust Network Access, providing a unified open source platform for reliable and secure connectivity.\n\n- Secure Remote Access – Enable least privilege network access in a few clicks\n- Zero-Config Deployment – Replace legacy VPNs with a peer-to-peer WireGuard®-based network\n- Seamless SSO with MFA – Secure your network access with session-based SSO & MFA\n- Dynamic Posture Checks – Grant access only to devices meeting your security rules\n- Centralized Network Management – Control your private network from a single place\n- Detailed Activity Logging – Identify who did what, and when in your network\n\n**Learn More:**\n- [NetBird Website](https://netbird.io)\n- [Documentation](https://docs.netbird.io)\n- [Self-Hosting Guide](https://docs.netbird.io/selfhosted/selfhosted-quickstart)\n- [NetBird GitHub](https://github.com/netbirdio/netbird)\n- [Slack Community](https://docs.netbird.io/slack-url)"
  zh: "NetBird 将基于 WireGuard® 的覆盖网络与零信任网络访问相结合，提供一个统一的开源平台，实现可靠且安全的连接。\n\n- 安全远程访问 – 轻松实现最小权限网络访问\n- 零配置部署 – 使用点对点 WireGuard® 网络取代传统 VPN\n- 无缝 SSO 与 MFA – 通过基于会话的 SSO 和 MFA 保护网络访问\n- 动态 Posture 检查 – 仅允许符合安全规则的设备访问\n- 集中网络管理 – 从单一位置控制您的私有网络\n- 详细活动日志 – 识别网络中的操作者和操作时间\n\n**了解更多：**\n- [NetBird 官网](https://netbird.io)\n- [文档](https://docs.netbird.io)\n- [自托管指南](https://docs.netbird.io/selfhosted/selfhosted-quickstart)\n- [NetBird GitHub](https://github.com/netbirdio/netbird)\n- [Slack 社区](https://docs.netbird.io/slack-url)"
  ja: "NetBirdはWireGuard®ベースのオーバーレイネットワークとゼロトラストネットワークアクセスを組み合わせ、信頼性とセキュリティを備えた統合オープンソースプラットフォームを提供します。\n\n- 安全なリモートアクセス – 数回のクリックで最小権限ネットワークアクセスを有効化\n- ゼロ設定デプロイメント – ピアツーピアWireGuard®ベースネットワークでレガシーVPNを置き換え\n- シームレスなSSOとMFA – セッションベースのSSOとMFAでネットワークアクセスを保護\n- 動的ポスチャチェック – セキュリティルールを満たすデバイスにのみアクセスを許可\n- 集中ネットワーク管理 – 単一の場所からプライベートネットワークを制御\n- 詳細なアクティビティログ – ネットワーク内で誰が、いつ、何を行ったかを特定\n\n**詳細：**\n- [NetBird ウェブサイト](https://netbird.io)\n- [ドキュメント](https://docs.netbird.io)\n- [セルフホストガイド](https://docs.netbird.io/selfhosted/selfhosted-quickstart)\n- [NetBird GitHub](https://github.com/netbirdio/netbird)\n- [Slack コミュニティ](https://docs.netbird.io/slack-url)"
  uk: "NetBird поєднує оверлейну мережу на основі WireGuard® із Zero Trust Network Access, пропонуючи єдину платформу з відкритим кодом для надійного та безпечного з'єднання.\n\n- Безпечний віддалений доступ — надавайте мережевий доступ за принципом найменших привілеїв у кілька кліків\n- Розгортання без налаштувань — замініть застарілі VPN одноранговою мережею на основі WireGuard®\n- Зручний SSO з MFA — захистіть доступ до мережі за допомогою SSO та MFA на рівні сеансу\n- Динамічні перевірки стану пристроїв — надавайте доступ лише пристроям, що відповідають вашим правилам безпеки\n- Централізоване керування мережею — керуйте приватною мережею з одного місця\n- Докладний журнал дій — дізнавайтеся, хто, що і коли робив у вашій мережі\n\n**Дізнатися більше:**\n- [Сайт NetBird](https://netbird.io)\n- [Документація](https://docs.netbird.io)\n- [Посібник із самостійного розгортання](https://docs.netbird.io/selfhosted/selfhosted-quickstart)\n- [NetBird на GitHub](https://github.com/netbirdio/netbird)\n- [Спільнота в Slack](https://docs.netbird.io/slack-url)"
notes:
  en: "### Getting Started\n\nYour device will now appear in your NetBird dashboard and can connect to other devices in your mesh network."
  zh: "### 入门\n\n您的设备现在将出现在您的 NetBird 仪表板中，并可以连接到网格网络中的其他设备。"
  ja: "### はじめに\n\nこれでデバイスがNetBirdダッシュボードに表示され、メッシュネットワーク内の他のデバイスと接続できるようになります。"
  uk: "### Початок роботи\n\nТепер ваш пристрій з'явиться на панелі NetBird і зможе підключатися до інших пристроїв у вашій mesh-мережі."
