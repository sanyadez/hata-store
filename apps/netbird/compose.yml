# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  netbird:
    image: netbirdio/netbird:0.62.3
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    deploy:
      resources:
        reservations:
          memory: 128M
    environment:
      NB_SETUP_KEY: "${NB_SETUP_KEY:-}"
      NB_MANAGEMENT_URL: "${NB_MANAGEMENT_URL:-}"
      NB_HOSTNAME: "${NB_HOSTNAME:-hata}"
      NB_ENABLE_SSH_ROOT: "${NB_ENABLE_SSH_ROOT:-true}"
      NB_ALLOW_SERVER_SSH: "${NB_ALLOW_SERVER_SSH:-true}"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /var/lib/netbird
