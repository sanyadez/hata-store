# Apache-2.0, changed for Hata Store: see NOTICE
services:
  lidarr:
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: "${TZ:-UTC}"
    image: linuxserver/lidarr:3.1.6
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-8686}:8686"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${MUSIC_DIR:-./Media/Music}"
        target: /music
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
