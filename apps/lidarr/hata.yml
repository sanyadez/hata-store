settings:
  - name: WEB_PORT
    type: port
    default: 8686
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MUSIC_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Music"
    label:
      en: Media/Music
      uk: Медіа/Музика
    hint:
      en: Inside the app it is /music
      uk: У застосунку вона — /music
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads
      uk: Завантаження
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
