permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
  privileged:
    en: Its authors run it with full access to the server
    uk: Автори запускають його з повним доступом до сервера
  host-files:
    en: "It reaches these places of the system: /lib/modules, /etc/resolv.conf"
    uk: "Він має доступ до цих місць системи: /lib/modules, /etc/resolv.conf"
