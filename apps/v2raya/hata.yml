# Apache-2.0, changed for Hata Store: see NOTICE
title: V2rayA
tagline:
  en: "A web GUI client of Project V which supports VMess, VLESS, SS, SSR, Trojan, Tuic and Juicity protocols"
  uk: "Вебклієнт Project V з підтримкою протоколів VMess, VLESS, SS, SSR, Trojan, Tuic і Juicity"
description:
  en: "v2rayA is a V2Ray client supporting global transparent proxy, compatible with SS, SSR, Trojan (trojan-go), Tuic, and Juicity protocols. Designed for simplicity, it meets most user needs, ideal for scenarios requiring efficient proxy services.\n\nCore features include global transparent proxy and multi-outbound load balancing with traffic splitting. It provides proxy services for nearly all applications without requiring application-specific proxy support. Support for creating and connecting multiple outbound nodes ensures load balancing and efficient traffic splitting for optimal network performance.\n\nIt offers RoutingA, a custom routing language for V2Ray, providing powerful and convenient traffic splitting support. Multiple strategies address DNS pollution, with advanced settings enabling customized configurations. With simplicity and functionality at the core, the platform delivers a modern solution for proxy management.\n\n**Key Features:**\n- Web-based GUI for easy configuration and management\n- Support for multiple protocols: VMess, VLESS, SS, SSR, Trojan, Tuic, Juicity\n- Global transparent proxy for seamless application proxy services\n- Multi-outbound load balancing and traffic splitting\n- RoutingA custom routing for convenient traffic splitting\n- Multiple DNS pollution mitigation strategies with advanced custom settings\n\n**Learn More:**\n- [V2rayA Official Website](https://v2raya.org/)\n- [V2rayA GitHub](https://github.com/v2rayA/v2rayA)"
  uk: "v2rayA — клієнт V2Ray з підтримкою глобального прозорого проксі, сумісний із протоколами SS, SSR, Trojan (trojan-go), Tuic і Juicity. Він простий у налаштуванні, задовольняє більшість потреб і підходить, коли потрібен ефективний проксі-сервіс.\n\nОсновні можливості — глобальний прозорий проксі та балансування навантаження між кількома вихідними вузлами з розділенням трафіку. Проксі працює майже для всіх застосунків, навіть якщо вони самі не підтримують проксі. Можна створювати й підключати кілька вихідних вузлів, щоб балансувати навантаження й ефективно розділяти трафік для найкращої продуктивності мережі.\n\nЗастосунок пропонує RoutingA — власну мову маршрутизації для V2Ray, яка дає потужне й зручне розділення трафіку. Кілька стратегій допомагають боротися зі спотворенням DNS, а розширені налаштування дозволяють гнучко все налаштувати. Простота й функціональність — основа цієї сучасної платформи керування проксі.\n\n**Основні можливості:**\n- Вебінтерфейс для простого налаштування й керування\n- Підтримка кількох протоколів: VMess, VLESS, SS, SSR, Trojan, Tuic, Juicity\n- Глобальний прозорий проксі для надійної роботи застосунків через проксі\n- Балансування навантаження між кількома вихідними вузлами та розділення трафіку\n- Власна маршрутизація RoutingA для зручного розділення трафіку\n- Кілька стратегій проти спотворення DNS з розширеними власними налаштуваннями\n\n**Докладніше:**\n- [Офіційний сайт V2rayA](https://v2raya.org/)\n- [V2rayA на GitHub](https://github.com/v2rayA/v2rayA)"
