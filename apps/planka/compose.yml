services:
  planka:
    image: ghcr.io/plankanban/planka:2.2.1
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-3000}:1337
    volumes:
      - ${APP_DATA:-.}/data:/app/data
    environment:
      BASE_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?set DB_PASSWORD, letters and digits only}@postgres/planka
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, a long random string}
      TRUST_PROXY: "true"
      DEFAULT_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD, the administrator's password}
      DEFAULT_ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      DEFAULT_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA:-.}/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: planka
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, letters and digits only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
