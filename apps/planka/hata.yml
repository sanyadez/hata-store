title: PLANKA
tagline:
  en: Kanban boards for home projects, chores and plans
  uk: Канбан-дошки для домашніх проєктів, справ і планів
description:
  en: >
    Boards in the spirit of Trello: lists of cards you drag from "to do" to "done", with
    checklists, due dates, labels, files and comments. Good for a renovation, a move, a trip or the
    week's chores, shared with the family in real time.
  uk: >
    Дошки на кшталт Trello: списки карток, які перетягуєте з «зробити» в «готово», з чеклистами,
    термінами, мітками, файлами й коментарями. Стане в пригоді для ремонту, переїзду, подорожі чи
    хатніх справ на тиждень, і родина бачить зміни одразу.
notes:
  en: >
    Sign in with the administrator's e-mail or user name and the password set here; other people
    are added by the administrator. This administrator is changed here, in the app's settings, not
    in PLANKA itself.
  uk: >
    Входьте з поштою чи ім'ям користувача адміністратора й паролем, заданими тут; інших людей
    додає адміністратор. Цього адміністратора змінюють тут, у налаштуваннях застосунку, а не в
    самій PLANKA.
category: productivity
developer: PLANKA Software
website: https://planka.app
source: https://github.com/plankanban/planka
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
web:
  service: planka
  port: 1337
settings:
  - name: WEB_PORT
    type: port
    default: 3000
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ADMIN_EMAIL
    type: text
    default: admin@example.com
    required: true
    label: { en: Administrator's e-mail, uk: Пошта адміністратора }
    hint:
      en: Change it to your own address
      uk: Замініть на власну адресу
  - name: ADMIN_USERNAME
    type: text
    default: admin
    required: true
    label: { en: Administrator's user name, uk: Ім'я користувача адміністратора }
    hint:
      en: Small Latin letters, digits, dots and underscores, 3 to 16 characters
      uk: Малі латинські літери, цифри, крапки й підкреслення, від 3 до 16 знаків
  - name: ADMIN_NAME
    type: text
    default: Administrator
    required: true
    label: { en: Administrator's full name, uk: Повне ім'я адміністратора }
  - name: ADMIN_PASSWORD
    type: password
    required: true
    label: { en: Administrator's password, uk: Пароль адміністратора }
  - name: SECRET_KEY
    type: secret
    length: 48
    label: { en: Session signing key, uk: Ключ підпису сесій }
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
