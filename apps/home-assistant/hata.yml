title: Home Assistant
tagline:
  en: One home for every smart device, whatever its brand
  uk: Один дім для всіх розумних пристроїв, хай якої марки
description:
  en: >
    Open-source home automation that runs at home, not in somebody's cloud. Connects lights,
    sensors, thermostats, cameras, vacuum cleaners and thousands of other devices, shows them on one
    dashboard and makes them work together through automations.
  uk: >
    Автоматизація дому з відкритим кодом, що працює вдома, а не в чиїйсь хмарі. Під'єднує світло,
    датчики, термостати, камери, пилососи й тисячі інших пристроїв, показує їх на одній панелі й
    змушує працювати разом через автоматизації.
notes:
  en: >
    It uses the server's own network, so the port 8123 cannot be changed and must be free.
  uk: >
    Він працює в мережі самого сервера, тож порт 8123 змінити не можна, і він має бути вільним.
category: home
developer: Open Home Foundation
website: https://www.home-assistant.io
source: https://github.com/home-assistant/core
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: homeassistant
  port: 8123
permissions:
  host-network:
    en: To find devices on the home network by themselves (mDNS, UPnP, Chromecast and others)
    uk: Щоб самому знаходити пристрої в домашній мережі (mDNS, UPnP, Chromecast та інші)
  host-files:
    en: Reads the system's message bus (/run/dbus) to reach Bluetooth
    uk: Читає системну шину повідомлень (/run/dbus), щоб діставатися до Bluetooth
