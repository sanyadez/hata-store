title: SparkyFitness
tagline:
  en: Food, exercise, water and body measurements for the whole family, with an AI helper
  uk: Харчування, вправи, вода й заміри тіла для всієї родини, з помічником на ШІ
description:
  en: >
    A diary of what you eat and how you move: meals with calories and nutrients from food databases
    (Open Food Facts, USDA and others) or a barcode, exercises and workouts, water, weight and body
    measurements, sleep and the cycle, with goals and reports over time. Family members keep their own
    diaries and can share them with each other. Its phone app syncs with Apple Health and Health Connect,
    and with a key of an AI service the assistant Sparky logs a meal from a sentence or a photo.
  uk: >
    Щоденник того, що ви їсте і як рухаєтесь: страви з калоріями й поживними речовинами з баз продуктів
    (Open Food Facts, USDA та інших) або за штрихкодом, вправи й тренування, вода, вага й заміри тіла,
    сон і цикл, із цілями та звітами за час. Члени родини ведуть власні щоденники й можуть ділитися ними
    одне з одним. Застосунок для телефона синхронізується з Apple Health і Health Connect, а з ключем
    сервісу ШІ помічник Sparky записує страву з речення чи фото.
notes:
  en: >
    The first account made is the administrator's. Anyone who can open the page can sign up until
    "Allow new accounts" is switched off in the app's settings. SparkyFitness is free for personal use
    only: its licence forbids commercial use.
  uk: >
    Перший створений обліковий запис — адміністратора. Зареєструватися може кожен, хто відкриє сторінку,
    поки в налаштуваннях застосунку не вимкнено «Дозволити нові облікові записи». SparkyFitness
    безкоштовний лише для особистого використання: його ліцензія забороняє комерційне.
category: productivity
developer: CodeWithCJ
website: https://codewithcj.github.io/SparkyFitness/
source: https://github.com/CodeWithCJ/SparkyFitness
icon: "data:image/webp;base64,"
screenshots: [1.webp, 2.webp]
web:
  service: sparkyfitness
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 3018
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: DISABLE_SIGNUP
    type: choice
    default: "false"
    options:
      - { value: "false", label: { en: Allowed, uk: Дозволено } }
      - { value: "true", label: { en: Not allowed, uk: Заборонено } }
    label: { en: Allow new accounts, uk: Дозволити нові облікові записи }
  - name: ADMIN_EMAIL
    type: text
    label: { en: Administrator's e-mail, uk: Пошта адміністратора }
    hint:
      en: Optional. The account with this address gets the admin panel
      uk: Необов'язково. Обліковий запис із цією адресою отримує панель адміністрування
    advanced: true
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
  - name: APP_DB_PASSWORD
    type: secret
    label: { en: Password of the app's database user, uk: Пароль користувача бази для застосунку }
  - name: API_ENCRYPTION_KEY
    type: secret
    length: 64
    chars: hex
    label: { en: Key that encrypts saved service keys, uk: Ключ шифрування збережених ключів сервісів }
  - name: AUTH_SECRET
    type: secret
    length: 44
    label: { en: Key that signs the sign-ins, uk: "Ключ, яким підписуються входи" }
