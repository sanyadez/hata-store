title: Actual Budget
tagline:
  en: Privacy-first finance app with envelope budgeting and multi-device sync.
  uk: "Особисті фінанси з конвертним бюджетом: приватність насамперед і синхронізація між пристроями."
description:
  en: "Actual Budget is a fast, privacy-focused finance management app using local-first envelope budgeting, ensuring full control over data. Its intuitive interface supports offline use, with multi-device sync and optional end-to-end encryption, delivering a secure, efficient financial management experience, ideal for users seeking clear financial oversight.\n\nThe app's core features include envelope budgeting based on real income, rapid transaction handling, and intuitive financial reporting. It helps users track spending and monitor monthly savings clearly, with a streamlined transaction editor for quick categorization, split transactions, and transfers. Built-in net worth and cash flow reports provide financial insights, and a custom report engine allows tailored reports for specific needs. Undo and redo functionality ensures users can easily correct mistakes, maintaining operational flexibility.\n\nIt integrates bank accounts via goCardless (EU/UK) or SimpleFIN (US/Canada), supports multi-device syncing for data privacy, and enables importing transaction data from YNAB4, nYNAB, and QIF, OFX, QFX, CAMT.053, CSV files, simplifying migration of existing financial records. Community documentation enhances usability, and the app's simple operation and high flexibility deliver a modern finance management solution.\n\n**Key Features:**\n- Privacy-focused personal finance management\n- Envelope budgeting methodology\n- Multi-device synchronization\n- End-to-end encryption support\n- Local data ownership\n- Fast and responsive interface\n- Open source and self-hosted\n- Bank account synchronization\n- Detailed financial reporting\n- Budget tracking and analysis\n\n**Learn More:**\n- [Actual Budget Official Website](https://actualbudget.org)\n- [Actual Budget GitHub Repository](https://github.com/actualbudget/actual)\n- [Actual Budget Docker Image](https://hub.docker.com/r/actualbudget/actual-server)"
  uk: "Actual Budget — швидкий застосунок для керування фінансами, який дбає про приватність. Він використовує конвертне бюджетування з локальним зберіганням, тож усі дані залишаються під вашим контролем. Зрозумілий інтерфейс працює й без мережі, а синхронізація між пристроями та необов’язкове наскрізне шифрування роблять керування грошима безпечним і зручним для тих, хто хоче чітко бачити свої фінанси.\n\nОсновні можливості: конвертне бюджетування на основі реальних доходів, швидка робота з транзакціями та наочні фінансові звіти. Застосунок допомагає стежити за витратами й щомісячними заощадженнями, а компактний редактор транзакцій дає змогу швидко призначати категорії, розділяти транзакції та робити перекази. Вбудовані звіти про чисті активи й рух коштів дають змогу краще розуміти фінансову картину, а конструктор власних звітів — створювати звіти під конкретні потреби. Скасування й повторення дій допомагають легко виправляти помилки.\n\nЗастосунок підключає банківські рахунки через goCardless (ЄС/Велика Британія) або SimpleFIN (США/Канада), підтримує синхронізацію між пристроями без шкоди для приватності й дає змогу імпортувати транзакції з YNAB4, nYNAB та файлів QIF, OFX, QFX, CAMT.053, CSV, тож переносити наявні фінансові записи просто. Є документація від спільноти, а простота використання й гнучкість роблять його сучасним рішенням для керування фінансами.\n\n**Основні можливості:**\n- Особисті фінанси з акцентом на приватність\n- Метод конвертного бюджетування\n- Синхронізація між пристроями\n- Підтримка наскрізного шифрування\n- Дані зберігаються у вас\n- Швидкий і чуйний інтерфейс\n- Відкритий код і розгортання на власному сервері\n- Синхронізація банківських рахунків\n- Докладні фінансові звіти\n- Облік і аналіз бюджету\n\n**Дізнатися більше:**\n- [Офіційний сайт Actual Budget](https://actualbudget.org)\n- [Репозиторій Actual Budget на GitHub](https://github.com/actualbudget/actual)\n- [Docker-образ Actual Budget](https://hub.docker.com/r/actualbudget/actual-server)"
notes:
