# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  actualbudget:
    image: actualbudget/actual-server:26.5.2
    deploy:
      resources:
        reservations:
          memory: 128M
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /data
    ports:
      - "${WEB_PORT:-15006}:5006"
