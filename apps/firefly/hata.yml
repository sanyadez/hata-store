# Apache-2.0, changed for Hata Store: see NOTICE
title: Firefly
tagline:
  en: "Firefly, the easiest using of WireGuard VPN server, plus version of wg-easy."
  uk: "Firefly — найпростіший у використанні VPN-сервер WireGuard, розширена версія wg-easy."
description:
  en: "Firefly is a simple and easy to install WireGuard server software, which can be widely used in scenarios such as remote networking, remote work, and expose a local server behind a NAT or firewall to the internet.  🎯 Features 🟢 Provide a simple and easy-to-use web management UI  🟣 Supports access to all WireGuard clients  🟡 No need for system installation of WireGuard components  🟠 Single file, no additional library dependencies  🔴 Automatically apply for free SSL certificate"
  uk: "Firefly — проста у встановленні серверна програма WireGuard, яку можна застосовувати для віддаленого з'єднання мереж, віддаленої роботи та відкриття в інтернет локального сервера, що стоїть за NAT або брандмауером.  🎯 Можливості 🟢 Простий і зручний вебінтерфейс керування  🟣 Підтримка всіх клієнтів WireGuard  🟡 Не потрібно встановлювати компоненти WireGuard у системі  🟠 Один файл, без додаткових бібліотек  🔴 Автоматичне отримання безкоштовного SSL-сертифіката"
notes:
  en: "Default password for admin background `firefly`, you can modify it in environment variables."
  uk: "Пароль адміністратора за замовчуванням — `firefly`, його можна змінити у змінних середовища."
category: network
developer: Safe3
website: https://qq.uusec.com/
source: https://github.com/Safe3/firefly
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
web:
  service: firefly
  port: 50121
settings:
  - name: FIREFLY_PASSWORD
    type: password
    required: true
    label:
      en: Password to sign in
      uk: Пароль для входу
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
  devices:
    en: "It uses devices of the server: /dev/net/tun"
    uk: "Він користується пристроями сервера: /dev/net/tun"
  capabilities:
    en: "It asks for extra rights of the system: NET_ADMIN, SYS_MODULE"
    uk: "Він просить додаткових прав у системі: NET_ADMIN, SYS_MODULE"
  host-files:
    en: "It reaches these places of the system: /lib/modules"
    uk: "Він має доступ до цих місць системи: /lib/modules"
