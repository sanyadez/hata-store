title: Flowise
tagline:
  en: An open source generative AI development platform for building AI Agents and LLM workflows
  uk: Платформа з відкритим кодом для створення ШІ-агентів і робочих процесів на основі LLM
description:
  en: "Flowise is a generative AI development platform for building AI agents and LLM workflows. An intuitive interface with a visual editor simplifies complex workflow design, ideal for developers creating diverse AI applications, from chatbots to data processing pipelines.\n\nCore features include visual orchestration and data integration. Support for various models, custom code, and branching, looping, and routing logic enables complex workflow creation. Connection to over 100 data sources, vector databases, and memory modules ensures flexible data ingestion. Monitoring capabilities provide execution logs and visual debugging for workflow transparency and maintenance. Self-hosted and air-gapped deployment options accommodate diverse infrastructure needs.\n\nIt offers data processing with transforms, filters, aggregates, and RAG indexing pipelines. Memory optimization and planning techniques enhance performance, while MCP integration supports tool connections and authentication. Security controls include role-based access, single sign-on, and encrypted credentials for data protection. API, JavaScript and Python SDKs, and command-line interface enable extensibility, with embedded chat components and a template marketplace accelerating development. Scalability supports high-throughput workflows, and evaluation features optimize performance. With flexibility and efficiency at the core, the platform delivers a modern solution for AI development.\n\n**Key Features:**\n- Visual editor supporting multiple models, custom code, branching looping routing logic\n- Connection to over 100 data sources, vector databases, and memory modules\n- Execution logs and visual debugging for enhanced monitoring\n- Data processing with transforms, filters, aggregates, and RAG indexing pipelines\n- Various memory optimization technique and integrations\n- MCP client and server nodes for tool integration\n- Input moderation and output post-processing for safety\n- API, JavaScript and Python SDKs, and command-line interface\n- Customizable embedded chat components\n- Template marketplace and reusable components\n- Role-based access control, single sign-on, encrypted credentials\n- Vertical and horizontal scalability for high-throughput workflows\n- Datasets and evaluation features for workflow optimization\n\n**Learn More:**\n- [Flowise Official Website](https://flowiseai.com/)\n- [Flowise GitHub](https://github.com/flowiseai/flowise)\n- [Flowise Documentation](https://docs.flowiseai.com/)"
  uk: "Flowise — платформа для розробки генеративного ШІ: з її допомогою створюють ШІ-агентів і робочі процеси на основі LLM. Зрозумілий інтерфейс із візуальним редактором спрощує проєктування складних процесів, тож платформа підійде розробникам різних ШІ-застосунків, від чат-ботів до конвеєрів обробки даних.\n\nОсновні можливості — візуальна оркестрація та інтеграція даних. Підтримка різних моделей, власного коду, а також логіки розгалужень, циклів і маршрутизації дає змогу будувати складні процеси. Підключення до понад 100 джерел даних, векторних баз і модулів пам’яті забезпечує гнучке отримання даних. Моніторинг показує журнали виконання та візуальне налагодження, щоб процеси були прозорими й легкими в супроводі. Можна розгортати на власному сервері й в ізольованому контурі без доступу до інтернету.\n\nПлатформа обробляє дані за допомогою перетворень, фільтрів, агрегацій і конвеєрів індексації для RAG. Оптимізація пам’яті та методи планування підвищують продуктивність, а інтеграція з MCP підтримує підключення інструментів і автентифікацію. Засоби безпеки охоплюють рольовий доступ, єдиний вхід (SSO) і шифровані облікові дані. API, SDK для JavaScript і Python та інтерфейс командного рядка роблять платформу розширюваною, а вбудовувані компоненти чату й каталог шаблонів прискорюють розробку. Масштабованість підтримує процеси з високим навантаженням, а засоби оцінювання допомагають покращувати результати.\n\n**Основні можливості:**\n- Візуальний редактор із підтримкою різних моделей, власного коду, розгалужень, циклів і маршрутизації\n- Підключення до понад 100 джерел даних, векторних баз і модулів пам’яті\n- Журнали виконання та візуальне налагодження для зручнішого моніторингу\n- Обробка даних: перетворення, фільтри, агрегації та конвеєри індексації для RAG\n- Різні методи оптимізації пам’яті та інтеграції\n- Вузли MCP-клієнта й MCP-сервера для підключення інструментів\n- Модерація вхідних даних і постобробка вихідних для безпеки\n- API, SDK для JavaScript і Python та інтерфейс командного рядка\n- Настроювані вбудовувані компоненти чату\n- Каталог шаблонів і компонентів для повторного використання\n- Рольовий контроль доступу, єдиний вхід (SSO), шифровані облікові дані\n- Вертикальне й горизонтальне масштабування для процесів із високим навантаженням\n- Набори даних і засоби оцінювання для оптимізації процесів\n\n**Докладніше:**\n- [Офіційний сайт Flowise](https://flowiseai.com/)\n- [Flowise на GitHub](https://github.com/flowiseai/flowise)\n- [Документація Flowise](https://docs.flowiseai.com/)"
