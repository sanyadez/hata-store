# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  flowise:
    image: flowiseai/flowise:3.1.2
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 256M
    environment:
      PORT: "3025"
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: "${SECRETKEY_PATH:?set SECRETKEY_PATH}"
      LOG_PATH: /root/.flowise/logs
      BLOB_STORAGE_PATH: /root/.flowise/storage
      FLOWISE_USERNAME: "${FLOWISE_USERNAME:-admin}"
      FLOWISE_PASSWORD: hata
    ports:
      - "${WEB_PORT:-3025}:3025"
    volumes:
      - "${APP_DATA:-.}:/root/.flowise"
    entrypoint: "/bin/sh -c \"sleep 3; flowise start\""
