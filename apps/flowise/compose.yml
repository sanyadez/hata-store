# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  flowise:
    image: flowiseai/flowise:3.1.4
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 256M
    environment:
      PORT: "3025"
      DATABASE_PATH: /home/node/.flowise
      APIKEY_PATH: /home/node/.flowise
      SECRETKEY_PATH: /home/node/.flowise
      LOG_PATH: /home/node/.flowise/logs
      BLOB_STORAGE_PATH: /home/node/.flowise/storage
      FLOWISE_USERNAME: "${FLOWISE_USERNAME:-admin}"
      FLOWISE_PASSWORD: "${FLOWISE_PASSWORD:?set FLOWISE_PASSWORD}"
    ports:
      - "${WEB_PORT:-3025}:3025"
    volumes:
      - "${APP_DATA:-.}:/home/node/.flowise"
    entrypoint: "/bin/sh -c \"sleep 3; flowise start\""
