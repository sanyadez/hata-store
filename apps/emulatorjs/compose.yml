# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  emulatorjs:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      SUBFOLDER: /
      TZ: "${TZ:-UTC}"
    image: linuxserver/emulatorjs:1.9.2
    ports:
      - "${PORT_3000:-3001}:3000"
      - "${PORT_4001:-4001}:4001"
      - "${WEB_PORT:-88}:80"
    privileged: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
      - type: bind
        source: /ROMS/nes
        target: /data/nes/roms
