# Apache-2.0, changed for Hata Store: see NOTICE
title: emulatorjs
tagline:
  en: emulatorjs
  uk: emulatorjs
description:
  en: "EmulatorJS is a Docker-based emulator application that can simulate various operating systems and device environments within containers for development, testing, and learning purposes."
  uk: "EmulatorJS — емулятор у Docker, який може відтворювати різні операційні системи та середовища пристроїв у контейнерах для розробки, тестування й навчання."
category: media
developer: self
website: https://emulatorjs.org/
source: https://github.com/linuxserver/emulatorjs
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
web:
  service: emulatorjs
  port: 80
settings:
  - name: PORT_3000
    type: port
    default: 3001
    label:
      en: Manage ROMS
      uk: Керування ROM-файлами
    advanced: true
  - name: PORT_4001
    type: port
    default: 4001
    label:
      en: Port 4001
      uk: Порт 4001
    advanced: true
  - name: WEB_PORT
    type: port
    default: 88
    label:
      en: Web port
      uk: Порт вебінтерфейсу
permissions:
  privileged:
    en: Its authors run it with full access to the server
    uk: Автори запускають його з повним доступом до сервера
  host-files:
    en: "It reaches these places of the system: /ROMS/nes"
    uk: "Він має доступ до цих місць системи: /ROMS/nes"
