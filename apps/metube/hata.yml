title: MeTube
tagline:
  en: Saves videos and music from YouTube and hundreds of other sites
  uk: Зберігає відео й музику з YouTube і сотень інших сайтів
description:
  en: >
    A web page for yt-dlp: paste a link and the video, a whole playlist or a channel lands in
    your downloads folder, in the quality and format you pick, or as audio only. Subscribe to a
    channel and its new videos are downloaded as they come out.
  uk: >
    Вебсторінка для yt-dlp: вставте посилання, і відео, цілий список відтворення чи канал
    опиниться в теці завантажень, у вибраній якості й форматі або лише звуком. Підпишіться на
    канал, і його нові відео завантажуватимуться, щойно вийдуть.
category: media
developer: Alex Shnitman
website: https://github.com/alexta69/metube
source: https://github.com/alexta69/metube
icon: data:image/svg+xml;base64,
web:
  service: metube
  port: 8081
settings:
  - name: WEB_PORT
    type: port
    default: 8081
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: DOWNLOADS
    type: folder
    default: ${DATA_ROOT}/Downloads
    label: { en: Downloads folder, uk: Тека завантажень }
    hint:
      en: Where videos and music are saved
      uk: Куди зберігаються відео й музика
