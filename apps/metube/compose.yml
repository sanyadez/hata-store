services:
  metube:
    image: ghcr.io/alexta69/metube:2026.10.27
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-8081}:8081
    volumes:
      - ${DOWNLOADS:-./downloads}:/downloads
      - ${APP_DATA:-.}/state:/state
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      STATE_DIR: /state
      TZ: ${TZ:-UTC}
