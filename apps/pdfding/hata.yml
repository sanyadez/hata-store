    type: port
    default: 8000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: SECRET_KEY
    type: secret
    length: 20
    label:
      en: Key that signs its sessions
      uk: "Ключ, яким підписуються сесії"
