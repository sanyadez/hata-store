title: ComfyUI (NVIDIA)
tagline:
  en: Make pictures and videos with AI models, node by node
  uk: Створюйте зображення й відео моделями ШІ, вузол за вузлом
description:
  en: >
    A visual editor for generative AI: Stable Diffusion, Flux, video and audio models are joined
    into a workflow of nodes on a canvas, so every step from the prompt to the finished picture can
    be seen and changed. Models and extra nodes are added from the built-in manager.
  uk: >
    Візуальний редактор для генеративного ШІ: моделі Stable Diffusion, Flux, відео й звуку
    з'єднуються на полотні в схему з вузлів, тож кожен крок від запиту до готового зображення
    видно й можна змінити. Моделі й додаткові вузли додаються з вбудованого менеджера.
notes:
  en: >
    Needs an NVIDIA graphics card from the GTX 16 or RTX 20 series on, its driver and the NVIDIA
    Container Toolkit on the server. It comes without models: download one first (they take
    gigabytes). The image is made by the community, not by the authors of ComfyUI.
  uk: >
    Потрібна відеокарта NVIDIA серії GTX 16 чи RTX 20 або новіша, її драйвер і NVIDIA Container
    Toolkit на сервері. Моделей у комплекті немає: спершу завантажте якусь (вони займають
    гігабайти). Образ зроблено спільнотою, а не авторами ComfyUI.
category: ai
developer: Comfy Org
website: https://www.comfy.org
source: https://github.com/Comfy-Org/ComfyUI
icon: data:image/svg+xml;base64,
web:
  service: comfyui
  port: 8188
settings:
  - name: WEB_PORT
    type: port
    default: 8188
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: CLI_ARGS
    type: text
    advanced: true
    label: { en: Extra launch options, uk: Додаткові параметри запуску }
    hint:
      en: ComfyUI's command-line options, for example --fast or --lowvram
      uk: Параметри командного рядка ComfyUI, наприклад --fast чи --lowvram
