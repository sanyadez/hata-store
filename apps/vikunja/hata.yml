title: Vikunja
tagline:
  en: To-do lists and projects for yourself and the family
  uk: Списки справ і проєкти для себе й родини
description:
  en: >
    A task manager in the spirit of Todoist: lists, projects, due dates, reminders and labels, seen
    as a list, a kanban board, a table or a timeline. Share a project with family members, or move
    your tasks over from Todoist, Trello or Microsoft To Do.
  uk: >
    Менеджер завдань на кшталт Todoist: списки, проєкти, терміни, нагадування й мітки — у вигляді
    списку, канбан-дошки, таблиці чи часової шкали. Діліться проєктом із родиною або перенесіть
    свої завдання з Todoist, Trello чи Microsoft To Do.
notes:
  en: >
    The first person registers on the sign-in page. Once everybody has an account, turn "Anyone may
    sign up" off.
  uk: >
    Перший користувач реєструється на сторінці входу. Коли всі матимуть облікові записи, вимкніть
    «Будь-хто може зареєструватися».
category: productivity
developer: Vikunja
website: https://vikunja.io
source: https://github.com/go-vikunja/vikunja
icon: data:image/svg+xml;base64,
web:
  service: vikunja
  port: 3456
settings:
  - name: WEB_PORT
    type: port
    default: 3456
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ENABLE_REGISTRATION
    type: switch
    default: true
    label: { en: Anyone may sign up, uk: Будь-хто може зареєструватися }
  - name: JWT_SECRET
    type: secret
    length: 48
    label: { en: Sign-in signing key, uk: Ключ підпису входу }
