title: Tailscale
tagline:
  en: Connect your devices and users together in your own secure virtual private network.
  uk: "Об'єднайте свої пристрої та користувачів у власну захищену віртуальну приватну мережу."
description:
  en: "A modern self-hosted networking app built on WireGuard®, providing secure, encrypted connections between devices regardless of their location. Its zero-configuration networking eliminates the need for complex firewall rules, port forwarding, or network administration, making it ideal for businesses and individuals creating efficient, secure network environments.\n\nThe app's core features include seamless device connectivity and robust security. It uses WireGuard® for end-to-end encryption, ensuring traffic cannot be intercepted, with private keys stored solely on user devices. Automatic NAT traversal enables connections across computers, phones, servers, and IoT devices over different network types, forming a unified private network. It also offers identity-based access control, integrating with Google, Microsoft, GitHub, or custom SSO solutions for simple authentication, replacing traditional IP-based restrictions to enhance security.\n\nIt excels in delivering secure remote access to services and infrastructure. Users can effortlessly access home servers, connect to office networks while traveling, or establish secure links between cloud services. Subnet routing allows access to entire networks, exit nodes enable secure internet browsing, and MagicDNS simplifies device discovery. These features ensure efficient, secure access to resources from any location.\n\nIt supports nearly all platforms, including Linux, Windows, macOS, iOS, Android, and various router firmwares, with flexible deployment in cloud or on-premises environments. A user-friendly Web interface provides real-time monitoring of network topology, device status, and access controls, with community documentation aiding configuration optimization. Whether setting up secure access for small teams or managing enterprise-scale networks, the app’s intuitive operation and high flexibility deliver a modern networking solution.\n\n**Key Features:**\n- End-to-end encryption via WireGuard®, ensuring uninterceptible traffic\n- Zero-configuration networking, eliminating complex firewall or port forwarding setup\n- Automatic NAT traversal for seamless device connectivity across network types\n- Identity-based access control with SSO integration (Google, Microsoft, GitHub)\n- Subnet routing for secure network-wide access\n- Exit nodes for safe internet browsing\n- MagicDNS for simplified device discovery\n\n**Learn More:**\n- [Tailscale Official Website](https://tailscale.com)\n- [Tailscale GitHub Repository](https://github.com/tailscale/tailscale)"
  uk: "Сучасний застосунок для мережі, що ви можете розгорнути самостійно. Він працює на WireGuard® і забезпечує захищені зашифровані з'єднання між пристроями, де б вони не були. Мережа працює без налаштування: не потрібні складні правила брандмауера, прокидання портів чи адміністрування мережі, тож застосунок підходить і бізнесу, і окремим людям, які будують ефективні та безпечні мережі.\n\nОсновні можливості — безперебійне з'єднання пристроїв і надійний захист. Наскрізне шифрування WireGuard® не дає перехопити трафік, а приватні ключі зберігаються лише на пристроях користувачів. Автоматичний обхід NAT дозволяє з'єднувати комп'ютери, телефони, сервери та IoT-пристрої в різних типах мереж в одну приватну мережу. Доступ керується за особою: можна входити через Google, Microsoft, GitHub або власний SSO замість обмежень за IP-адресами, що підвищує безпеку.\n\nЗастосунок чудово підходить для захищеного віддаленого доступу до сервісів та інфраструктури. Ви можете легко дістатися до домашніх серверів, під'єднатися до офісної мережі під час подорожі або об'єднати хмарні сервіси захищеними каналами. Маршрутизація підмереж дає доступ до цілих мереж, вихідні вузли (exit nodes) — безпечний вихід в інтернет, а MagicDNS спрощує пошук пристроїв. Так ви маєте зручний і безпечний доступ до ресурсів звідки завгодно.\n\nПідтримуються майже всі платформи: Linux, Windows, macOS, iOS, Android і прошивки різних маршрутизаторів, у хмарі чи на власному обладнанні. Зручний вебінтерфейс показує в реальному часі топологію мережі, стан пристроїв і правила доступу, а документація спільноти допомагає з налаштуванням. Чи це захищений доступ для невеликої команди, чи мережа масштабу підприємства — застосунок простий у використанні та гнучкий.\n\n**Основні можливості:**\n- Наскрізне шифрування через WireGuard®, трафік неможливо перехопити\n- Мережа без налаштування: жодних складних правил брандмауера чи прокидання портів\n- Автоматичний обхід NAT для надійного з'єднання пристроїв у різних мережах\n- Керування доступом за особою з інтеграцією SSO (Google, Microsoft, GitHub)\n- Маршрутизація підмереж для безпечного доступу до всієї мережі\n- Вихідні вузли для безпечного перегляду інтернету\n- MagicDNS для простого пошуку пристроїв\n\n**Докладніше:**\n- [Офіційний сайт Tailscale](https://tailscale.com)\n- [Репозиторій Tailscale на GitHub](https://github.com/tailscale/tailscale)"
category: network
developer: Tailscale Inc.
website: https://tailscale.com
source: https://github.com/tailscale/tailscale
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
web:
  service: tailscale
  port: 5252
settings:
  - name: TS_STATE_DIR
    type: text
    default: /var/lib/tailscale
    label:
      en: Tailscale State Directory Path
      uk: Шлях до теки стану Tailscale
permissions:
  host-network:
    en: "Its authors run it on the server's own network: it reaches the devices of the home network, and its ports are the server's"
    uk: "Автори запускають його в мережі самого сервера: він бачить пристрої домашньої мережі, а його порти — порти сервера"
  capabilities:
    en: "It asks for extra rights of the system: NET_ADMIN, NET_RAW"
    uk: "Він просить додаткових прав у системі: NET_ADMIN, NET_RAW"
  host-files:
    en: "It reaches these places of the system: /dev/net/tun"
    uk: "Він має доступ до цих місць системи: /dev/net/tun"
