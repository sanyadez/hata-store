description:
  en: "Pingvin-Share is a self-hosted file sharing application compatible with Nextcloud apps, offering a modern and intuitive web interface. It enables users to securely store, organize, and share files without relying on external cloud services. The application supports multiple authentication methods and provides features such as share links, user accounts, and a responsive interface.\n\n**Key features:**\n- Modern, responsive web interface\n- User accounts with a permission system\n- Secure share links for files\n- Drag-and-drop file upload\n- Password-protected shares\n- Multiple authentication methods\n- Docker-based deployment for easy installation\n\n**Learn more:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  de: "Pingvin-Share ist eine selbstgehostete Dateifreigabe-Anwendung, die mit Nextcloud-Apps kompatibel ist und eine moderne, intuitive Weboberfläche bietet. Sie ermöglicht es Benutzern, Dateien sicher zu speichern, zu organisieren und zu teilen, ohne auf externe Cloud-Dienste angewiesen zu sein. Die Anwendung unterstützt verschiedene Authentifizierungsmethoden und bietet Funktionen wie Freigabelinks, Benutzerkonten und eine responsive Oberfläche.\n\n**Hauptfunktionen:**\n- Moderne, responsive Weboberfläche\n- Benutzerkonten mit Berechtigungssystem\n- Sichere Freigabelinks für Dateien\n- Drag-and-Drop-Dateiupload\n- Passwortgeschützte Freigaben\n- Mehrere Authentifizierungsmethoden\n- Docker-basierte Bereitstellung für einfache Installation\n\n**Mehr erfahren:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  el: "Το Pingvin-Share είναι μια αυτο-φιλοξενούμενη εφαρμογή κοινής χρήσης αρχείων συμβατή με εφαρμογές Nextcloud και προσφέρει ένα σύγχρονο, διαισθητικό web περιβάλλον. Επιτρέπει στους χρήστες να αποθηκεύουν, να οργανώνουν και να μοιράζονται αρχεία με ασφάλεια χωρίς να βασίζονται σε εξωτερικές υπηρεσίες cloud. Η εφαρμογή υποστηρίζει διάφορες μεθόδους αυθεντικοποίησης και παρέχει λειτουργίες όπως σύνδεσμοι κοινής χρήσης, λογαριασμοί χρηστών και responsive διεπαφή.\n\n**Κύρια χαρακτηριστικά:**\n- Σύγχρονο, responsive web περιβάλλον\n- Λογαριασμοί χρηστών με σύστημα δικαιωμάτων\n- Ασφαλείς σύνδεσμοι κοινής χρήσης για αρχεία\n- Μεταφόρτωση αρχείων με drag-and-drop\n- Κοινές χρήσεις με προστασία κωδικού\n- Πολλαπλές μέθοδοι αυθεντικοποίησης\n- Ανάπτυξη μέσω Docker για εύκολη εγκατάσταση\n\n**Μάθετε περισσότερα:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  fr: "Pingvin-Share est une application de partage de fichiers auto-hébergée compatible avec les applications Nextcloud, offrant une interface web moderne et intuitive. Elle permet aux utilisateurs de stocker, d’organiser et de partager des fichiers en toute sécurité sans dépendre de services cloud externes. L’application prend en charge plusieurs méthodes d’authentification et propose des fonctionnalités telles que des liens de partage, des comptes utilisateurs et une interface responsive.\n\n**Fonctionnalités principales :**\n- Interface web moderne et responsive\n- Comptes utilisateurs avec système de permissions\n- Liens de partage sécurisés pour les fichiers\n- Téléversement de fichiers par glisser-déposer\n- Partages protégés par mot de passe\n- Plusieurs méthodes d’authentification\n- Déploiement basé sur Docker pour une installation facile\n\n**En savoir plus :**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  hr: "Pingvin-Share je samostalno hostana aplikacija za dijeljenje datoteka kompatibilna s Nextcloud aplikacijama, koja nudi moderno i intuitivno web sučelje. Omogućuje korisnicima sigurno spremanje, organiziranje i dijeljenje datoteka bez oslanjanja na vanjske cloud usluge. Aplikacija podržava više metoda autentikacije i nudi funkcije poput poveznica za dijeljenje, korisničkih računa i responzivnog sučelja.\n\n**Glavne značajke:**\n- Moderno, responzivno web sučelje\n- Korisnički računi sa sustavom dozvola\n- Sigurne poveznice za dijeljenje datoteka\n- Učitavanje datoteka povlačenjem i ispuštanjem\n- Dijeljenja zaštićena lozinkom\n- Više metoda autentikacije\n- Docker implementacija za jednostavnu instalaciju\n\n**Saznajte više:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  it: "Pingvin-Share è un'applicazione di condivisione file self-hosted compatibile con le app Nextcloud, che offre un'interfaccia web moderna e intuitiva. Consente agli utenti di archiviare, organizzare e condividere file in modo sicuro senza dipendere da servizi cloud esterni. L'applicazione supporta più metodi di autenticazione e offre funzionalità come link di condivisione, account utente e un'interfaccia responsive.\n\n**Funzionalità principali:**\n- Interfaccia web moderna e responsive\n- Account utente con sistema di autorizzazioni\n- Link di condivisione sicuri per i file\n- Caricamento file con drag-and-drop\n- Condivisioni protette da password\n- Più metodi di autenticazione\n- Distribuzione basata su Docker per una facile installazione\n\n**Scopri di più:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  ja: "Pingvin-ShareはNextcloudアプリと互換性のあるセルフホスト型のファイル共有アプリケーションで、モダンで直感的なWebインターフェースを提供します。外部のクラウドサービスに依存せず、ファイルを安全に保存・整理・共有できます。複数の認証方式をサポートし、共有リンク、ユーザーアカウント、レスポンシブなUIなどの機能を備えています。\n\n**主な機能：**\n- モダンでレスポンシブなWebインターフェース\n- 権限システム付きユーザーアカウント\n- ファイル用の安全な共有リンク\n- ドラッグ＆ドロップによるファイルアップロード\n- パスワード保護された共有\n- 複数の認証方式\n- Dockerによる簡単な導入\n\n**詳細：**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  ko: "Pingvin-Share는 Nextcloud 앱과 호환되는 자체 호스팅 파일 공유 애플리케이션으로, 현대적이고 직관적인 웹 인터페이스를 제공합니다. 외부 클라우드 서비스에 의존하지 않고 파일을 안전하게 저장, 정리 및 공유할 수 있습니다. 다양한 인증 방식을 지원하며 공유 링크, 사용자 계정, 반응형 인터페이스 등의 기능을 제공합니다.\n\n**주요 기능:**\n- 현대적이고 반응형 웹 인터페이스\n- 권한 시스템이 있는 사용자 계정\n- 파일을 위한 안전한 공유 링크\n- 드래그 앤 드롭 파일 업로드\n- 비밀번호 보호 공유\n- 다양한 인증 방식 지원\n- 쉬운 설치를 위한 Docker 기반 배포\n\n**자세히 알아보기:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  nb: "Pingvin-Share er en selv-hostet fildelingsapplikasjon som er kompatibel med Nextcloud-apper og tilbyr et moderne og intuitivt webgrensesnitt. Den lar brukere lagre, organisere og dele filer sikkert uten å være avhengig av eksterne skytjenester. Applikasjonen støtter flere autentiseringsmetoder og tilbyr funksjoner som delelenker, brukerkontoer og et responsivt grensesnitt.\n\n**Hovedfunksjoner:**\n- Moderne, responsivt webgrensesnitt\n- Brukerkontoer med tillatelsessystem\n- Sikre delelenker for filer\n- Dra-og-slipp filopplasting\n- Passordbeskyttede delinger\n- Flere autentiseringsmetoder\n- Docker-basert distribusjon for enkel installasjon\n\n**Les mer:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  pt: "Pingvin-Share é uma aplicação de partilha de ficheiros auto-hospedada compatível com aplicações Nextcloud, oferecendo uma interface web moderna e intuitiva. Permite aos utilizadores armazenar, organizar e partilhar ficheiros de forma segura sem depender de serviços cloud externos. A aplicação suporta vários métodos de autenticação e fornece funcionalidades como links de partilha, contas de utilizador e uma interface responsiva.\n\n**Funcionalidades principais:**\n- Interface web moderna e responsiva\n- Contas de utilizador com sistema de permissões\n- Links de partilha seguros para ficheiros\n- Carregamento de ficheiros com arrastar e largar\n- Partilhas protegidas por palavra-passe\n- Vários métodos de autenticação\n- Implementação baseada em Docker para fácil instalação\n\n**Saiba mais:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  ru: "Pingvin-Share — это самостоятельно размещаемое приложение для обмена файлами, совместимое с приложениями Nextcloud и предлагающее современный и интуитивно понятный веб-интерфейс. Оно позволяет пользователям безопасно хранить, организовывать и делиться файлами без зависимости от внешних облачных сервисов. Приложение поддерживает несколько методов аутентификации и предоставляет такие функции, как ссылки для обмена, учетные записи пользователей и адаптивный интерфейс.\n\n**Основные возможности:**\n- Современный, адаптивный веб-интерфейс\n- Учетные записи пользователей с системой прав доступа\n- Безопасные ссылки для обмена файлами\n- Загрузка файлов методом drag-and-drop\n- Общий доступ, защищённый паролем\n- Несколько методов аутентификации\n- Docker-развертывание для простой установки\n\n**Подробнее:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  sv: "Pingvin-Share är en självhostad fildelningsapplikation som är kompatibel med Nextcloud-appar och erbjuder ett modernt och intuitivt webbgränssnitt. Den gör det möjligt för användare att lagra, organisera och dela filer säkert utan att förlita sig på externa molntjänster. Applikationen stöder flera autentiseringsmetoder och erbjuder funktioner som delningslänkar, användarkonton och ett responsivt gränssnitt.\n\n**Huvudfunktioner:**\n- Modernt, responsivt webbgränssnitt\n- Användarkonton med behörighetssystem\n- Säkra delningslänkar för filer\n- Dra-och-släpp filuppladdning\n- Lösenordsskyddade delningar\n- Flera autentiseringsmetoder\n- Docker-baserad distribution för enkel installation\n\n**Läs mer:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  tr: "Pingvin-Share, Nextcloud uygulamalarıyla uyumlu, modern ve sezgisel bir web arayüzü sunan kendi kendine barındırılan bir dosya paylaşım uygulamasıdır. Kullanıcıların harici bulut hizmetlerine bağlı kalmadan dosyaları güvenli bir şekilde depolamasına, düzenlemesine ve paylaşmasına olanak tanır. Uygulama birden fazla kimlik doğrulama yöntemini destekler ve paylaşım bağlantıları, kullanıcı hesapları ve duyarlı bir arayüz gibi özellikler sunar.\n\n**Temel özellikler:**\n- Modern, duyarlı web arayüzü\n- Yetki sistemi olan kullanıcı hesapları\n- Dosyalar için güvenli paylaşım bağlantıları\n- Sürükle-bırak dosya yükleme\n- Parola korumalı paylaşımlar\n- Birden fazla kimlik doğrulama yöntemi\n- Kolay kurulum için Docker tabanlı dağıtım\n\n**Daha fazla bilgi:**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  zh: "Pingvin-Share是一个与Nextcloud应用兼容的自托管文件共享应用，提供现代、直观的Web界面。它允许用户安全地存储、整理和共享文件，而无需依赖外部云服务。该应用支持多种身份验证方法，并提供共享链接、用户账户和响应式界面等功能。\n\n**主要功能：**\n- 现代、响应式Web界面\n- 具有权限系统的用户账户\n- 文件的安全共享链接\n- 拖放式文件上传\n- 密码保护的共享\n- 多种身份验证方法\n- 基于Docker的部署，便于安装\n\n**了解更多：**\n- [Pingvin-Share GitHub](https://github.com/stonith404/pingvin-share)"
  uk: "Pingvin-Share — застосунок для обміну файлами для самостійного розгортання, сумісний із застосунками Nextcloud, із сучасним і зрозумілим вебінтерфейсом. Він дає змогу безпечно зберігати, упорядковувати та надавати файли без зовнішніх хмарних сервісів. Підтримує кілька способів автентифікації та пропонує посилання для обміну, облікові записи користувачів і адаптивний інтерфейс.\n\n**Основні можливості:**\n- Сучасний адаптивний вебінтерфейс\n- Облікові записи користувачів із системою дозволів\n- Безпечні посилання для обміну файлами\n- Завантаження файлів перетягуванням\n- Спільний доступ із захистом паролем\n- Кілька способів автентифікації\n- Розгортання через Docker для простого встановлення\n\n**Докладніше:**\n- [Pingvin-Share на GitHub](https://github.com/stonith404/pingvin-share)"
