# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Glances
  zh: Glances
  pt: Glances
tagline:
  en: Cross-platform monitoring tool.
  zh: 跨平台监控工具
  pt: Ferramenta de monitoramento multiplataforma.
  uk: Кросплатформений інструмент моніторингу.
description:
  en: "Glances is an open-source system cross-platform monitoring tool. It allows real-time monitoring of various aspects of your system such as CPU, memory, disk, network usage etc."
  zh: "Glances\_是一个开源的跨平台系统监控工具。它允许实时监控系统的各个方面，如 CPU、内存、磁盘、网络使用情况等。"
  pt: "Glances é uma ferramenta de monitoramento de sistema de plataforma cruzada de código aberto. Ele permite o monitoramento em tempo real de vários aspectos do seu sistema, como CPU, memória, disco, uso da rede, etc."
  uk: "Glances — кросплатформений інструмент моніторингу системи з відкритим кодом. Він показує в реальному часі навантаження процесора, пам’ять, диски, мережу та інші показники вашої системи."
category: productivity
developer: Nicolas Hennion
website: https://nicolargo.github.io/glances/
source: https://github.com/nicolargo/glances
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
web:
  service: glances
  port: 61208
settings:
  - name: WEB_PORT
    type: port
    default: 61208
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_61209
    type: port
    default: 61209
    label:
      en: Glances API port
      zh: Glances API 端口
      uk: Порт API Glances
    advanced: true
  - name: GLANCES_OPT
    type: text
    default: "-w"
    label:
      en: Glances mode
      zh: Glances模式
      uk: Режим Glances
permissions:
  host-pid:
    en: It sees the processes of the server
    uk: Він бачить процеси сервера
  docker:
    en: "It controls the server's Docker: it sees and manages the containers"
    uk: "Він керує Docker сервера: бачить контейнери й керує ними"
  host-files:
    en: "It reaches these places of the system: /mnt"
    uk: "Він має доступ до цих місць системи: /mnt"
