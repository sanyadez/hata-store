title: Pi-hole
tagline:
  en: Network-wide Ad Blocking
  uk: Блокування реклами в усій мережі
description:
  en: "Pi-hole is a network-wide ad-blocking platform for Linux hardware, using DNS sinkhole technology to protect devices from unwanted content without requiring client-side software. Designed for home or enterprise networks, it offers efficient ad blocking and network optimization.\n\nCore features include network-wide ad blocking and content blocking in non-browser environments. It uses DNS sinkhole to block ads, covering mobile apps and smart TVs. Caching DNS queries speeds up everyday browsing. A command-line interface ensures interoperability with reliable control options.\n\nIt provides an intuitive web interface dashboard for viewing and managing system status. An optional DHCP server function automatically protects all devices. Capable of handling high query volumes on server-grade hardware, it supports ad blocking over IPv4 and IPv6. With efficiency and versatility at the core, the platform delivers a modern network protection solution.\n\n**Key Features:**\n- Network-wide ad blocking via DNS sinkhole technology\n- Blocking content in non-browser environments, including mobile apps and smart TVs\n- Caching DNS queries to speed up browsing\n- Command-line interface for interoperability\n- Intuitive web interface dashboard for system viewing and control\n- Optional DHCP server function for automatic device protection\n- Ad blocking support for IPv4 and IPv6\n\n**Learn More:**\n- [Pi-hole Official Website](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  uk: "Pi-hole — платформа для блокування реклами в усій мережі на Linux-пристроях. Вона використовує технологію DNS sinkhole, щоб захищати пристрої від небажаного вмісту без жодного клієнтського програмного забезпечення. Створена для домашніх і корпоративних мереж, вона ефективно блокує рекламу й оптимізує мережу.\n\nОсновні можливості — блокування реклами в усій мережі та блокування вмісту поза браузерами. DNS sinkhole блокує рекламу, зокрема в мобільних застосунках і на смарт-телевізорах. Кешування DNS-запитів пришвидшує щоденний перегляд сторінок. Інтерфейс командного рядка забезпечує сумісність і надійне керування.\n\nІнтуїтивна панель у вебінтерфейсі показує стан системи й дає змогу керувати нею. Додатковий DHCP-сервер автоматично захищає всі пристрої. Платформа витримує велику кількість запитів на серверному обладнанні та блокує рекламу в IPv4 і IPv6. Ефективність і універсальність роблять її сучасним рішенням для захисту мережі.\n\n**Основні можливості:**\n- Блокування реклами в усій мережі за технологією DNS sinkhole\n- Блокування вмісту поза браузерами, зокрема в мобільних застосунках і на смарт-телевізорах\n- Кешування DNS-запитів для швидшого перегляду\n- Інтерфейс командного рядка для сумісності\n- Інтуїтивна панель вебінтерфейсу для перегляду стану й керування системою\n- Додатковий DHCP-сервер для автоматичного захисту пристроїв\n- Блокування реклами в IPv4 та IPv6\n\n**Докладніше:**\n- [Офіційний сайт Pi-hole](https://pi-hole.net/)\n- [Pi-hole на GitHub](https://github.com/pi-hole/pi-hole)"
category: network
developer: Pi-hole
website: https://pi-hole.net/
source: https://github.com/pi-hole/pi-hole
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: pihole
  port: 80
  path: /admin
settings:
  - name: WEB_PORT
    type: port
    default: 8800
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_53
    type: port
    default: 53
    label:
      en: Pi-hole DNS port
      uk: DNS-порт Pi-hole
    advanced: true
  - name: PORT_443
    type: port
    default: 8443
    label:
      en: Pi-hole HTTPS port
      uk: HTTPS-порт Pi-hole
    advanced: true
  - name: FTLCONF_WEBSERVER_API_PASSWORD
    type: password
    required: true
    label:
      en: Pi-hole admin password
      uk: Пароль адміністратора Pi-hole
  - name: FTLCONF_DNS_LISTENINGMODE
    type: text
    default: all
    label:
      en: DNS listening mode
      uk: Режим прослуховування DNS
permissions:
  capabilities:
    en: "It asks for extra rights of the system: NET_ADMIN"
    uk: "Він просить додаткових прав у системі: NET_ADMIN"
