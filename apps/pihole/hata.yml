description:
  en: "Pi-hole is a network-wide ad-blocking platform for Linux hardware, using DNS sinkhole technology to protect devices from unwanted content without requiring client-side software. Designed for home or enterprise networks, it offers efficient ad blocking and network optimization.\n\nCore features include network-wide ad blocking and content blocking in non-browser environments. It uses DNS sinkhole to block ads, covering mobile apps and smart TVs. Caching DNS queries speeds up everyday browsing. A command-line interface ensures interoperability with reliable control options.\n\nIt provides an intuitive web interface dashboard for viewing and managing system status. An optional DHCP server function automatically protects all devices. Capable of handling high query volumes on server-grade hardware, it supports ad blocking over IPv4 and IPv6. With efficiency and versatility at the core, the platform delivers a modern network protection solution.\n\n**Key Features:**\n- Network-wide ad blocking via DNS sinkhole technology\n- Blocking content in non-browser environments, including mobile apps and smart TVs\n- Caching DNS queries to speed up browsing\n- Command-line interface for interoperability\n- Intuitive web interface dashboard for system viewing and control\n- Optional DHCP server function for automatic device protection\n- Ad blocking support for IPv4 and IPv6\n\n**Learn More:**\n- [Pi-hole Official Website](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  it: "Pi-hole è una piattaforma di blocco pubblicità a livello di rete per hardware Linux, che utilizza la tecnologia DNS sinkhole per proteggere i dispositivi da contenuti indesiderati senza richiedere software client-side. Progettata per reti domestiche o aziendali, offre blocco pubblicità efficiente e ottimizzazione di rete.\n\nLe caratteristiche principali includono blocco pubblicità a livello di rete e blocco contenuti in ambienti non-browser. Utilizza DNS sinkhole per bloccare annunci, coprendo app mobili e smart TV. Il caching delle query DNS accelera la navigazione quotidiana. Un'interfaccia a riga di comando assicura interoperabilità con opzioni di controllo affidabili.\n\nFornisce un dashboard dell'interfaccia web intuitivo per visualizzare e gestire lo stato del sistema. Una funzione server DHCP opzionale protegge automaticamente tutti i dispositivi. Capace di gestire volumi elevati di query su hardware server-grade, supporta il blocco pubblicità su IPv4 e IPv6.\n\n**Caratteristiche Principali:**\n- Blocco pubblicità a livello di rete tramite tecnologia DNS sinkhole\n- Blocco contenuti in ambienti non-browser, incluse app mobili e smart TV\n- Caching query DNS per accelerare la navigazione\n- Interfaccia a riga di comando per interoperabilità\n- Dashboard interfaccia web intuitivo per visualizzazione e controllo sistema\n- Funzione server DHCP opzionale per protezione automatica dispositivi\n- Supporto blocco pubblicità per IPv4 e IPv6\n\n**Scopri di Più:**\n- [Sito Ufficiale Pi-hole](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  nb: "Pi-hole er en nettverksomfattende reklameblokkplattform for Linux-maskinvare, som bruker DNS-sinkhole-teknologi for å beskytte enheter mot uønsket innhold uten å kreve klientside-programvare. Designet for hjemme- eller bedriftsnettverk, tilbyr den effektiv reklameblokkering og nettverksoptimalisering.\n\nKjernefunksjoner inkluderer nettverksomfattende reklameblokkering og innholdsblokkering i ikke-nettlesermiljøer. Den bruker DNS-sinkhole for å blokkere annonser, og dekker mobilapper og smart-TVer. Caching av DNS-spørringer øker hastigheten på daglig surfing. Et kommandolinjegrensesnitt sikrer interoperabilitet med pålitelige kontrollalternativer.\n\nDen gir et intuitivt web-grensesnitt dashboard for å se og administrere systemstatus. En valgfri DHCP-serverfunksjon beskytter automatisk alle enheter. I stand til å håndtere høye spørringsvolumer på server-grade maskinvare, støtter den reklameblokkering over IPv4 og IPv6.\n\n**Hovedfunksjoner:**\n- Nettverksomfattende reklameblokkering via DNS-sinkhole-teknologi\n- Blokkering av innhold i ikke-nettlesermiljøer, inkludert mobilapper og smart-TVer\n- Caching DNS-spørringer for å øke surfehastighet\n- Kommandolinjegrensesnitt for interoperabilitet\n- Intuitivt web-grensesnitt dashboard for systemvisning og kontroll\n- Valgfri DHCP-serverfunksjon for automatisk enhetsbeskyttelse\n- Reklameblokkering støtte for IPv4 og IPv6\n\n**Lær Mer:**\n- [Pi-hole Offisielle Nettside](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  zh: "Pi-hole 是一款基于 Linux 硬件的网络级广告拦截平台，通过 DNS 沉洞技术保护设备免受不受欢迎内容干扰，无需安装客户端软件。其设计适合家庭或企业网络，提供高效广告拦截和网络优化体验。\n\n核心功能包括网络级广告拦截和非浏览器内容屏蔽。它通过 DNS 沉洞拦截广告，覆盖移动应用和智能电视等非浏览器环境。缓存 DNS 查询加速日常浏览体验。命令行界面确保互操作性，提供稳定控制选项。\n\n它提供直观的网页仪表板，方便查看和管理系统状态。可选的 DHCP 服务器功能自动保护所有设备。支持大规模查询处理，适合服务器级硬件，兼容 IPv4 和 IPv6 广告拦截。以高效性和通用性为核心，该平台为网络保护提供现代化解决方案。\n\n**主要功能：**\n- 网络级广告拦截，通过 DNS 沉洞技术\n- 屏蔽非浏览器环境内容，包括移动应用和智能电视\n- 缓存 DNS 查询，加速浏览体验\n- 命令行界面，支持互操作性\n- 直观网页仪表板，查看和控制系统\n- 可选 DHCP 服务器功能，自动保护设备\n- 兼容 IPv4 和 IPv6 广告拦截\n\n**了解更多：**\n- [Pi-hole 官方网站](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  ja: "Pi-holeは、DNS sinkholeテクノロジーを使用してクライアントサイドソフトウェアを必要とせずにデバイスを不要なコンテンツから保護する、Linuxハードウェア向けのネットワーク全体の広告ブロッキングプラットフォームです。家庭または企業ネットワーク向けに設計され、効率的な広告ブロッキングとネットワーク最適化を提供します。\n\nコア機能には、ネットワーク全体の広告ブロッキングと非ブラウザ環境でのコンテンツブロッキングが含まれます。DNS sinkholeを使用して広告をブロックし、モバイルアプリやスマートTVをカバーします。DNSクエリのキャッシュにより日常的なブラウジングが高速化されます。コマンドラインインターフェースにより、信頼性の高いコントロールオプションでの相互運用性が確保されます。\n\nシステムステータスの表示と管理のための直感的なWebインターフェースダッシュボードを提供します。オプションのDHCPサーバー機能により、すべてのデバイスが自動的に保護されます。サーバーグレードハードウェアでの高クエリボリュームを処理でき、IPv4とIPv6での広告ブロッキングをサポートします。\n\n**主な機能：**\n- DNS sinkholeテクノロジーによるネットワーク全体広告ブロッキング\n- モバイルアプリやスマートTVを含む非ブラウザ環境でのコンテンツブロッキング\n- ブラウジング高速化のためのDNSクエリキャッシュ\n- 相互運用性のためのコマンドラインインターフェース\n- システム表示とコントロールのための直感的Webインターフェースダッシュボード\n- 自動デバイス保護のためのオプションDHCPサーバー機能\n- IPv4とIPv6での広告ブロッキングサポート\n\n**詳細はこちら：**\n- [Pi-hole公式ウェブサイト](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  ko: "Pi-hole은 DNS sinkhole 기술을 사용하여 클라이언트 측 소프트웨어 없이도 기기를 원치 않는 콘텐츠로부터 보호하는 Linux 하드웨어용 네트워크 전체 광고 차단 플랫폼입니다. 가정용 또는 기업용 네트워크를 위해 설계되어 효율적인 광고 차단과 네트워크 최적화를 제공합니다.\n\n핵심 기능에는 네트워크 전체 광고 차단과 비브라우저 환경에서의 콘텐츠 차단이 포함됩니다. DNS sinkhole을 사용하여 광고를 차단하며, 모바일 앱과 스마트 TV를 포함합니다. DNS 쿼리 캐싱으로 일상적인 브라우징 속도를 높입니다. 명령줄 인터페이스는 신뢰할 수 있는 제어 옵션으로 상호 운용성을 보장합니다.\n\n시스템 상태 보기와 관리를 위한 직관적인 웹 인터페이스 대시보드를 제공합니다. 선택적 DHCP 서버 기능으로 모든 기기를 자동으로 보호합니다. 서버급 하드웨어에서 높은 쿼리 볼륨을 처리할 수 있으며, IPv4와 IPv6에서 광고 차단을 지원합니다.\n\n**주요 기능:**\n- DNS sinkhole 기술을 통한 네트워크 전체 광고 차단\n- 모바일 앱과 스마트 TV를 포함한 비브라우저 환경에서의 콘텐츠 차단\n- 브라우징 속도 향상을 위한 DNS 쿼리 캐싱\n- 상호 운용성을 위한 명령줄 인터페이스\n- 시스템 보기와 제어를 위한 직관적 웹 인터페이스 대시보드\n- 자동 기기 보호를 위한 선택적 DHCP 서버 기능\n- IPv4와 IPv6 광고 차단 지원\n\n**자세히 알아보기:**\n- [Pi-hole 공식 웹사이트](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  fr: "Pi-hole est une plateforme de blocage de publicités à l'échelle du réseau pour le matériel Linux, utilisant la technologie DNS sinkhole pour protéger les appareils contre le contenu indésirable sans nécessiter de logiciel côté client. Conçue pour les réseaux domestiques ou d'entreprise, elle offre un blocage de publicités efficace et une optimisation réseau.\n\nLes fonctionnalités principales incluent le blocage de publicités à l'échelle du réseau et le blocage de contenu dans les environnements non-navigateur. Elle utilise DNS sinkhole pour bloquer les publicités, couvrant les applications mobiles et les téléviseurs intelligents. La mise en cache des requêtes DNS accélère la navigation quotidienne. Une interface en ligne de commande assure l'interopérabilité avec des options de contrôle fiables.\n\nElle fournit un tableau de bord d'interface web intuitif pour visualiser et gérer l'état du système. Une fonction serveur DHCP optionnelle protège automatiquement tous les appareils. Capable de gérer des volumes élevés de requêtes sur du matériel de niveau serveur, elle prend en charge le blocage de publicités sur IPv4 et IPv6.\n\n**Fonctionnalités Principales :**\n- Blocage de publicités à l'échelle du réseau via la technologie DNS sinkhole\n- Blocage de contenu dans les environnements non-navigateur, y compris les applications mobiles et téléviseurs intelligents\n- Mise en cache des requêtes DNS pour accélérer la navigation\n- Interface en ligne de commande pour l'interopérabilité\n- Tableau de bord d'interface web intuitif pour la visualisation et le contrôle du système\n- Fonction serveur DHCP optionnelle pour la protection automatique des appareils\n- Support de blocage de publicités pour IPv4 et IPv6\n\n**En Savoir Plus :**\n- [Site Officiel Pi-hole](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  de: "Pi-hole ist eine netzwerkweite Werbeblockierungs-Plattform für Linux-Hardware, die DNS-Sinkhole-Technologie verwendet, um Geräte vor unerwünschten Inhalten zu schützen, ohne clientseitige Software zu benötigen. Für Heim- oder Unternehmensnetzwerke konzipiert, bietet sie effiziente Werbeblockierung und Netzwerkoptimierung.\n\nKernfunktionen umfassen netzwerkweite Werbeblockierung und Inhaltsblockierung in Nicht-Browser-Umgebungen. Sie verwendet DNS-Sinkhole zum Blockieren von Werbung und deckt mobile Apps und Smart-TVs ab. Das Zwischenspeichern von DNS-Abfragen beschleunigt das tägliche Surfen. Eine Befehlszeilenschnittstelle gewährleistet Interoperabilität mit zuverlässigen Steuerungsoptionen.\n\nSie bietet ein intuitives Web-Interface-Dashboard zum Anzeigen und Verwalten des Systemstatus. Eine optionale DHCP-Serverfunktion schützt automatisch alle Geräte. Fähig, hohe Abfragevolumen auf Server-Hardware zu bewältigen, unterstützt sie Werbeblockierung über IPv4 und IPv6.\n\n**Hauptmerkmale:**\n- Netzwerkweite Werbeblockierung über DNS-Sinkhole-Technologie\n- Inhaltsblockierung in Nicht-Browser-Umgebungen, einschließlich mobiler Apps und Smart-TVs\n- DNS-Abfragen-Zwischenspeicherung zur Beschleunigung des Surfens\n- Befehlszeilenschnittstelle für Interoperabilität\n- Intuitives Web-Interface-Dashboard für Systemanzeige und -steuerung\n- Optionale DHCP-Serverfunktion für automatischen Geräteschutz\n- Werbeblockierungs-Unterstützung für IPv4 und IPv6\n\n**Mehr Erfahren:**\n- [Pi-hole Offizielle Website](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  sv: "Pi-hole är en nätverksomfattande reklamblockering plattform för Linux-hårdvara, som använder DNS-sinkhole-teknik för att skydda enheter från oönskat innehåll utan att kräva klientsidans programvara. Designad för hem- eller företagsnätverk, erbjuder den effektiv reklamblockering och nätverksoptimering.\n\nKärnfunktioner inkluderar nätverksomfattande reklamblockering och innehållsblockering i icke-webbläsarmiljöer. Den använder DNS-sinkhole för att blockera annonser, täcker mobilappar och smart-TV:s. Cachning av DNS-frågor snabbar upp vardaglig surfning. Ett kommandoradsgränssnitt säkerställer interoperabilitet med pålitliga styrningsalternativ.\n\nDen tillhandahåller en intuitiv webbgränssnitt dashboard för att visa och hantera systemstatus. En valfri DHCP-serverfunktion skyddar automatiskt alla enheter. Kapabel att hantera höga frågevolymer på server-grade hårdvara, stöder den reklamblockering över IPv4 och IPv6.\n\n**Huvudfunktioner:**\n- Nätverksomfattande reklamblockering via DNS-sinkhole-teknik\n- Blockering av innehåll i icke-webbläsarmiljöer, inklusive mobilappar och smart-TV:s\n- Cachning DNS-frågor för att snabba upp surfning\n- Kommandoradsgränssnitt för interoperabilitet\n- Intuitiv webbgränssnitt dashboard för systemvisning och kontroll\n- Valfri DHCP-serverfunktion för automatiskt enhetsskydd\n- Reklamblockering stöd för IPv4 och IPv6\n\n**Lär Dig Mer:**\n- [Pi-hole Officiell Webbplats](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  el: "Το Pi-hole είναι μια πλατφόρμα αποκλεισμού διαφημίσεων σε επίπεδο δικτύου για Linux hardware, χρησιμοποιώντας την τεχνολογία DNS sinkhole για να προστατεύσει τις συσκευές από ανεπιθύμητο περιεχόμενο χωρίς να απαιτεί λογισμικό client-side. Σχεδιασμένο για οικιακά ή εταιρικά δίκτυα, προσφέρει αποτελεσματικό αποκλεισμό διαφημίσεων και βελτιστοποίηση δικτύου.\n\nΤα βασικά χαρακτηριστικά περιλαμβάνουν αποκλεισμό διαφημίσεων σε επίπεδο δικτύου και αποκλεισμό περιεχομένου σε περιβάλλοντα μη-browser. Χρησιμοποιεί DNS sinkhole για να αποκλείσει διαφημίσεις, καλύπτοντας mobile apps και smart TVs. Η αποθήκευση στην cache των DNS queries επιταχύνει την καθημερινή περιήγηση. Ένα interface γραμμής εντολών εξασφαλίζει διαλειτουργικότητα με αξιόπιστες επιλογές ελέγχου.\n\nΠαρέχει ένα διαισθητικό dashboard web interface για προβολή και διαχείριση της κατάστασης του συστήματος. Μια προαιρετική λειτουργία DHCP server προστατεύει αυτόματα όλες τις συσκευές. Ικανό να χειριστεί υψηλούς όγκους queries σε server-grade hardware, υποστηρίζει αποκλεισμό διαφημίσεων μέσω IPv4 και IPv6.\n\n**Βασικά Χαρακτηριστικά:**\n- Αποκλεισμός διαφημίσεων σε επίπεδο δικτύου μέσω τεχνολογίας DNS sinkhole\n- Αποκλεισμός περιεχομένου σε περιβάλλοντα μη-browser, συμπεριλαμβανομένων mobile apps και smart TVs\n- Cache DNS queries για επιτάχυνση περιήγησης\n- Interface γραμμής εντολών για διαλειτουργικότητα\n- Διαισθητικό dashboard web interface για προβολή και έλεγχο συστήματος\n- Προαιρετική λειτουργία DHCP server για αυτόματη προστασία συσκευών\n- Υποστήριξη αποκλεισμού διαφημίσεων για IPv4 και IPv6\n\n**Μάθετε Περισσότερα:**\n- [Επίσημος Ιστότοπος Pi-hole](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  hr: "Pi-hole je platforma za blokiranje reklama na razini mreže za Linux hardver, koja koristi DNS sinkhole tehnologiju za zaštićavanje uređaja od neželjenog sadržaja bez potrebe za klijentskim softverom. Dizajnirana za kućne ili poslovne mreže, nudi učinkovito blokiranje reklama i optimizaciju mreže.\n\nOsnovne značajke uključuju blokiranje reklama na razini mreže i blokiranje sadržaja u ne-browser okruženjima. Koristi DNS sinkhole za blokiranje reklama, pokrivajući mobilne aplikacije i pametne televizore. Keširanje DNS upita ubrzava svakodnevno pregledavanje. Sučelje naredbenog retka osigurava interoperabilnost s pouzdanim opcijama kontrole.\n\nPruža intuitivnu web sučelje nadzornu ploču za pregled i upravljanje statusom sustava. Opcionalna DHCP server funkcija automatski štiti sve uređaje. Sposobna za rukovanje velikim volumenom upita na server-grade hardveru, podržava blokiranje reklama preko IPv4 i IPv6.\n\n**Ključne Značajke:**\n- Blokiranje reklama na razini mreže putem DNS sinkhole tehnologije\n- Blokiranje sadržaja u ne-browser okruženjima, uključujući mobilne aplikacije i pametne televizore\n- Keširanje DNS upita za ubrzavanje pregledavanja\n- Sučelje naredbenog retka za interoperabilnost\n- Intuitivna web sučelje nadzorna ploča za pregled i kontrolu sustava\n- Opcionalna DHCP server funkcija za automatsku zaštićavanje uređaja\n- Podrška za blokiranje reklama za IPv4 i IPv6\n\n**Saznajte Više:**\n- [Pi-hole Službena Web Stranica](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  pt: "O Pi-hole é uma plataforma de bloqueio de anúncios ao nível da rede para hardware Linux, usando tecnologia DNS sinkhole para proteger dispositivos de conteúdo indesejado sem requerer software do lado do cliente. Concebido para redes domésticas ou empresariais, oferece bloqueio eficiente de anúncios e optimização de rede.\n\nAs funcionalidades principais incluem bloqueio de anúncios ao nível da rede e bloqueio de conteúdo em ambientes não-navegador. Usa DNS sinkhole para bloquear anúncios, cobrindo aplicações móveis e smart TVs. O cache de consultas DNS acelera a navegação quotidiana. Uma interface de linha de comandos garante interoperabilidade com opções de controlo fiáveis.\n\nFornece um painel de interface web intuitivo para visualizar e gerir o estado do sistema. Uma função de servidor DHCP opcional protege automaticamente todos os dispositivos. Capaz de lidar com volumes elevados de consultas em hardware de nível servidor, suporta bloqueio de anúncios sobre IPv4 e IPv6.\n\n**Funcionalidades Principais:**\n- Bloqueio de anúncios ao nível da rede via tecnologia DNS sinkhole\n- Bloqueio de conteúdo em ambientes não-navegador, incluindo aplicações móveis e smart TVs\n- Cache de consultas DNS para acelerar navegação\n- Interface de linha de comandos para interoperabilidade\n- Painel de interface web intuitivo para visualização e controlo do sistema\n- Função de servidor DHCP opcional para protecção automática de dispositivos\n- Suporte de bloqueio de anúncios para IPv4 e IPv6\n\n**Saber Mais:**\n- [Website Oficial Pi-hole](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  ru: "Pi-hole — это платформа блокировки рекламы на уровне сети для Linux-оборудования, использующая технологию DNS sinkhole для защиты устройств от нежелательного контента без требования клиентского программного обеспечения. Разработанная для домашних или корпоративных сетей, она предлагает эффективную блокировку рекламы и оптимизацию сети.\n\nОсновные функции включают блокировку рекламы на уровне сети и блокировку контента в небраузерных средах. Использует DNS sinkhole для блокировки рекламы, покрывая мобильные приложения и умные телевизоры. Кэширование DNS-запросов ускоряет повседневный просмотр. Интерфейс командной строки обеспечивает совместимость с надёжными опциями управления.\n\nПредоставляет интуитивную панель веб-интерфейса для просмотра и управления состоянием системы. Дополнительная функция DHCP-сервера автоматически защищает все устройства. Способная обрабатывать большие объёмы запросов на серверном оборудовании, поддерживает блокировку рекламы через IPv4 и IPv6.\n\n**Ключевые Особенности:**\n- Блокировка рекламы на уровне сети через технологию DNS sinkhole\n- Блокировка контента в небраузерных средах, включая мобильные приложения и умные телевизоры\n- Кэширование DNS-запросов для ускорения просмотра\n- Интерфейс командной строки для совместимости\n- Интуитивная панель веб-интерфейса для просмотра и управления системой\n- Дополнительная функция DHCP-сервера для автоматической защиты устройств\n- Поддержка блокировки рекламы для IPv4 и IPv6\n\n**Узнать Больше:**\n- [Официальный Сайт Pi-hole](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  tr: "Pi-hole, istemci tarafı yazılım gerektirmeden cihazları istenmeyen içerikten korumak için DNS sinkhole teknolojisini kullanan Linux donanımı için ağ çapında reklam engelleme platformudur. Ev veya kurumsal ağlar için tasarlanmış olup, verimli reklam engelleme ve ağ optimizasyonu sunar.\n\nTemel özellikler ağ çapında reklam engelleme ve tarayıcı olmayan ortamlarda içerik engellemeyi içerir. Reklamları engellemek için DNS sinkhole kullanır, mobil uygulamaları ve akıllı TV'leri kapsar. DNS sorgularını önbelleğe alma günlük gezinmeyi hızlandırır. Komut satırı arayüzü güvenilir kontrol seçenekleriyle birlikte işlerlik sağlar.\n\nSistem durumunu görüntülemek ve yönetmek için sezgisel web arayüz panosu sağlar. İsteğe bağlı DHCP sunucu işlevi tüm cihazları otomatik olarak korur. Sunucu seviyesi donanımda yüksek sorgu hacimlerini işleyebilir, IPv4 ve IPv6 üzerinden reklam engellemeyi destekler.\n\n**Ana Özellikler:**\n- DNS sinkhole teknolojisi ile ağ çapında reklam engelleme\n- Mobil uygulamalar ve akıllı TV'ler dahil tarayıcı olmayan ortamlarda içerik engelleme\n- Gezinmeyi hızlandırmak için DNS sorgu önbelleğe alma\n- İşlerlik için komut satırı arayüzü\n- Sistem görüntüleme ve kontrolü için sezgisel web arayüz panosu\n- Otomatik cihaz koruması için isteğe bağlı DHCP sunucu işlevi\n- IPv4 ve IPv6 için reklam engelleme desteği\n\n**Daha Fazla Bilgi:**\n- [Pi-hole Resmi Web Sitesi](https://pi-hole.net/)\n- [Pi-hole GitHub](https://github.com/pi-hole/pi-hole)"
  uk: "Pi-hole — платформа для блокування реклами в усій мережі на Linux-пристроях. Вона використовує технологію DNS sinkhole, щоб захищати пристрої від небажаного вмісту без жодного клієнтського програмного забезпечення. Створена для домашніх і корпоративних мереж, вона ефективно блокує рекламу й оптимізує мережу.\n\nОсновні можливості — блокування реклами в усій мережі та блокування вмісту поза браузерами. DNS sinkhole блокує рекламу, зокрема в мобільних застосунках і на смарт-телевізорах. Кешування DNS-запитів пришвидшує щоденний перегляд сторінок. Інтерфейс командного рядка забезпечує сумісність і надійне керування.\n\nІнтуїтивна панель у вебінтерфейсі показує стан системи й дає змогу керувати нею. Додатковий DHCP-сервер автоматично захищає всі пристрої. Платформа витримує велику кількість запитів на серверному обладнанні та блокує рекламу в IPv4 і IPv6. Ефективність і універсальність роблять її сучасним рішенням для захисту мережі.\n\n**Основні можливості:**\n- Блокування реклами в усій мережі за технологією DNS sinkhole\n- Блокування вмісту поза браузерами, зокрема в мобільних застосунках і на смарт-телевізорах\n- Кешування DNS-запитів для швидшого перегляду\n- Інтерфейс командного рядка для сумісності\n- Інтуїтивна панель вебінтерфейсу для перегляду стану й керування системою\n- Додатковий DHCP-сервер для автоматичного захисту пристроїв\n- Блокування реклами в IPv4 та IPv6\n\n**Докладніше:**\n- [Офіційний сайт Pi-hole](https://pi-hole.net/)\n- [Pi-hole на GitHub](https://github.com/pi-hole/pi-hole)"
