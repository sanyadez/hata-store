title: OpenClaw
tagline:
  en: OpenClaw is a personal AI assistant you run on your own devices
  uk: "OpenClaw — персональний ШІ-асистент, який працює на ваших власних пристроях"
description:
  en: "OpenClaw is an open-source personal AI assistant designed to extend the capabilities of large language models (LLMs) into intelligent agents that actively execute tasks, interact across multiple platforms, and operate continuously. It supports 24/7 operation on the user's own device or server and provides intelligent automation services through common communication tools. OpenClaw connects AI to existing chat channels (such as WhatsApp, Telegram, Discord, etc.) via a locally running \"gateway + agent\" architecture, enabling it not only to answer questions but also to proactively perform actions, manage schedules, process emails, automate workflows, and more.\n\n**Key Features**:\n\n- Multi-channel Communication Integration: Interact directly with AI through common communication platforms like WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams, etc., without the need for additional applications.\n\n- Continuous Online & Long-term Memory: OpenClaw can run 24/7, possessing persistent memory and context retention capabilities, allowing it to remember preferences, historical conversations, and provide personalized services.\n\n- Real Action Execution: Beyond text replies, it can perform system tasks (e.g., clear inbox, send emails, fill forms, schedule appointments, browse web, control browser, etc.).\n\n- Skill Expansion & Automated Workflows: Supports community plugins, extended skills, and custom automation scripts, enabling the AI to execute complex tasks in various scenarios.\n\n**Learn More:**\n\n- [Official Website](https://openclaw.ai)\n\n- [Official Documentation](https://docs.openclaw.ai/)\n\n- [OpenClaw GitHub Repository](https://github.com/openclaw/openclaw)"
  uk: "OpenClaw — персональний ШІ-асистент із відкритим кодом, що перетворює великі мовні моделі (LLM) на розумних агентів: вони самі виконують завдання, працюють у різних сервісах і не припиняють роботи. Він може працювати цілодобово на вашому пристрої чи сервері та автоматизує справи через звичні засоби спілкування. OpenClaw підключає ШІ до наявних чатів (WhatsApp, Telegram, Discord тощо) за допомогою локальної архітектури «шлюз + агент», тож він не лише відповідає на запитання, а й сам виконує дії, веде розклад, обробляє пошту, автоматизує робочі процеси та інше.\n\n**Основні можливості**:\n\n- Інтеграція з багатьма каналами зв'язку: спілкуйтеся зі ШІ просто у WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Microsoft Teams тощо, без додаткових застосунків.\n\n- Постійна робота й довготривала пам'ять: OpenClaw працює 24/7, зберігає пам'ять і контекст, тож пам'ятає ваші вподобання та попередні розмови й надає персоналізовану допомогу.\n\n- Реальне виконання дій: окрім текстових відповідей, він може виконувати системні завдання (розбирати пошту, надсилати листи, заповнювати форми, планувати зустрічі, переглядати вебсторінки, керувати браузером тощо).\n\n- Розширення навичок і автоматизація: підтримуються плагіни спільноти, додаткові навички та власні скрипти автоматизації, завдяки чому ШІ виконує складні завдання в різних сценаріях.\n\n**Докладніше:**\n\n- [Офіційний сайт](https://openclaw.ai)\n\n- [Офіційна документація](https://docs.openclaw.ai/)\n\n- [Репозиторій OpenClaw на GitHub](https://github.com/openclaw/openclaw)"
