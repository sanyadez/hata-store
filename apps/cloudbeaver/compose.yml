# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  cloudbeaver:
    deploy:
      resources:
        reservations:
          memory: 256M
    image: dbeaver/cloudbeaver:26.2.2
    ports:
      - "${WEB_PORT:-8978}:8978"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/workspace"
        target: /opt/cloudbeaver/workspace
    privileged: false
