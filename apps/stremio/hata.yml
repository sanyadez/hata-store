# Apache-2.0, changed for Hata Store: see NOTICE
title: Stremio
tagline:
  en: Stremio is a modern media center that gives you the freedom to watch everything you want.
  uk: "Stremio — сучасний медіацентр, що дає свободу дивитися все, що хочете."
description:
  en: "Stremio offers a secure, modern and seamless entertainment experience. With its easy-to-use interface and diverse content library, including 4K HDR support, users can enjoy their favorite movies and TV shows across all their devices. And with its commitment to security, Stremio is the ultimate choice for a worry-free, high-quality streaming experience."
  uk: "Stremio дарує безпечні, сучасні та бездоганні розваги. Завдяки зручному інтерфейсу та різноманітній бібліотеці вмісту, зокрема з підтримкою 4K HDR, ви можете дивитися улюблені фільми й серіали на всіх своїх пристроях. А турбота про безпеку робить Stremio найкращим вибором для якісного стрімінгу без зайвих турбот."
category: media
developer: Andreas Tsarida / Stremio
website: https://www.stremio.com
source: https://github.com/tsaridas/stremio-docker
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: stremio
  port: 8080
settings:
  - name: PORT_11470
    type: port
    default: 11470
    label:
      en: Server Port
      uk: Порт сервера
    advanced: true
  - name: WEB_PORT
    type: port
    default: 8100
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: NO_CORS
    type: text
    default: "1"
    label:
      en: CORS config
      uk: Налаштування CORS
  - name: AUTO_SERVER_URL
    type: text
    default: "1"
    label:
      en: Enables automatic server URL detection for remote clients
      uk: Автоматично визначати адресу сервера для віддалених клієнтів
permissions:
  devices:
    en: "It uses devices of the server: /dev/dri"
    uk: "Він користується пристроями сервера: /dev/dri"
