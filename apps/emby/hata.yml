title: Emby
tagline:
  en: "Emby brings together your personal videos, music, photos, and live television."
  uk: "Emby об'єднує ваші особисті відео, музику, фото та прямий телеефір."
description:
  en: "Emby is a personal media management platform that brings home videos, music, and photos together, automatically converting and streaming to any device. An intuitive design makes it ideal for users to enjoy media content anytime, anywhere, meeting family entertainment and media management needs.\n\nCore features include cross-device media streaming and easy access. It supports real-time conversion and streaming of personal media to any device for seamless playback. A connection service enables easy media access while away from home. Live TV functionality supports streaming, managing DVR, and accessing a library of recordings. Mobile sync delivers media to smartphones and tablets for offline access, automatically updating new content.\n\nIt offers parental controls to restrict children's content access, set schedules and time limits, and remotely monitor sessions. Chromecast support enables easy streaming of videos, music, photos, and Live TV. Content is presented elegantly, enhancing visual experience. Cloud sync supports backup, archiving, and multi-resolution storage for optimized streaming. Web-based media management facilitates editing metadata, images, and searching subtitles, while DLNA integration auto-detects network devices for content streaming. With convenience and versatility at the core, the platform delivers a modern media management solution.\n\n**Key Features:**\n- Automatic conversion and streaming of media to any device\n- Easy access via connection service while away from home\n- Live TV streaming, DVR management, and recording library access\n- Mobile sync to smartphones and tablets for offline access\n- Parental controls with content restrictions, schedules, and remote monitoring\n- Chromecast support for streaming videos, music, photos, and Live TV\n- Cloud sync for backup and multi-resolution storage\n- Web-based media management for editing metadata and searching subtitles\n- DLNA integration for auto-detecting network devices and streaming content\n\n**Learn More:**\n- [Emby Official Website](https://emby.media/)"
  uk: "Emby — платформа для керування особистими медіа, що об'єднує домашні відео, музику й фото та автоматично перетворює їх для потокового відтворення на будь-якому пристрої. Продуманий інтерфейс дозволяє насолоджуватися медіа будь-де й будь-коли, а також задовольняє потреби сімейного дозвілля та впорядкування медіа.\n\nГоловні можливості — потокове відтворення на різних пристроях і зручний доступ. Особисті медіа перетворюються в реальному часі та передаються на будь-який пристрій для плавного відтворення. Служба підключення дає змогу легко дістатися до медіа, коли ви поза домом. Прямий телеефір підтримує потокове відтворення, керування записами (DVR) і доступ до бібліотеки записів. Мобільна синхронізація доставляє медіа на смартфони й планшети для офлайн-доступу та автоматично оновлює нові матеріали.\n\nБатьківський контроль обмежує доступ дітей до вмісту, задає розклад і ліміти часу та дозволяє дистанційно стежити за сеансами. Підтримка Chromecast дає змогу легко транслювати відео, музику, фото й прямий телеефір. Вміст подається привабливо, що покращує візуальне сприйняття. Хмарна синхронізація підтримує резервне копіювання, архівування та зберігання в кількох роздільностях для оптимального відтворення. Вебкерування медіа дозволяє редагувати метадані й зображення та шукати субтитри, а інтеграція DLNA автоматично знаходить пристрої в мережі для трансляції вмісту. Завдяки зручності й універсальності платформа — сучасне рішення для керування медіа.\n\n**Основні можливості:**\n- Автоматичне перетворення та потокове відтворення медіа на будь-якому пристрої\n- Простий доступ поза домом через службу підключення\n- Потоковий прямий телеефір, керування записами (DVR) і доступ до бібліотеки записів\n- Мобільна синхронізація зі смартфонами й планшетами для офлайн-доступу\n- Батьківський контроль: обмеження вмісту, розклад і дистанційний моніторинг\n- Підтримка Chromecast для трансляції відео, музики, фото й прямого телеефіру\n- Хмарна синхронізація для резервних копій і зберігання в кількох роздільностях\n- Вебкерування медіа: редагування метаданих і пошук субтитрів\n- Інтеграція DLNA для автоматичного пошуку пристроїв у мережі й трансляції вмісту\n\n**Докладніше:**\n- [Офіційний сайт Emby](https://emby.media/)"
category: media
developer: Emby Team
website: https://emby.media/
source: https://hub.docker.com/r/emby/embyserver
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: emby
  port: 8096
settings:
  - name: WEB_PORT
    type: port
    default: 8096
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_8920
    type: port
    default: 8920
    label:
      en: Port 8920
      uk: Порт 8920
    advanced: true
  - name: TV_SHOWS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/TV Shows"
    label:
      en: Media/TV Shows
      uk: Медіа/Серіали
    hint:
      en: Inside the app it is /data/tvshows
      uk: У застосунку вона — /data/tvshows
  - name: MOVIES_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Movies"
    label:
      en: Media/Movies
      uk: Медіа/Фільми
    hint:
      en: Inside the app it is /data/movies
      uk: У застосунку вона — /data/movies
  - name: UID
    type: text
    default: "1000"
    label:
      en: UID used to run Emby
      uk: "UID, від імені якого працює Emby"
  - name: GID
    type: text
    default: "100"
    label:
      en: Primary GID used to run Emby
      uk: "Основний GID, від імені якого працює Emby"
  - name: GIDLIST
    type: text
    default: "100"
    label:
      en: Gidlist
      uk: Список GID
    hint:
      en: "Comma-separated supplementary group IDs. The default includes users (100), video (44), and render (109); adjust these IDs if the host uses different values."
      uk: "Ідентифікатори додаткових груп через кому. Типово це users (100), video (44) і render (109); змініть їх, якщо на хості інші значення."
permissions:
  devices:
    en: "It uses devices of the server: /dev/dri, /dev/vchiq, /dev/video10, /dev/video11, /dev/video12"
    uk: "Він користується пристроями сервера: /dev/dri, /dev/vchiq, /dev/video10, /dev/video11, /dev/video12"
