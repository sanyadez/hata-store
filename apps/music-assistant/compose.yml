services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.7
    restart: unless-stopped
    # players are found and streamed to on the home network itself (mDNS, AirPlay, Chromecast, DLNA, Sonos)
    network_mode: host
    volumes:
      - ${APP_DATA:-.}/data:/data
      - ${MUSIC:-./music}:/media:ro
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-UTC}
