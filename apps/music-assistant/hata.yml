title: Music Assistant
tagline:
  en: All your music in one library, played on any speaker in the home
  uk: Уся ваша музика в одній бібліотеці, на будь-якому динаміку вдома
description:
  en: >
    Brings together music from your own folder and from streaming services such as Spotify,
    Tidal, YouTube Music and internet radio into one library, and plays it on the speakers you
    have: Sonos, AirPlay, Chromecast, DLNA, smart speakers and more, one room or several in sync.
    Works with Home Assistant for automations.
  uk: >
    Збирає музику з вашої теки й зі стримінгових сервісів, як-от Spotify, Tidal, YouTube Music та
    інтернет-радіо, в одну бібліотеку й грає її на динаміках, які у вас є: Sonos, AirPlay,
    Chromecast, DLNA, розумні колонки тощо, в одній кімнаті чи в кількох разом. Працює з Home
    Assistant для автоматизацій.
notes:
  en: >
    It uses the server's own network, so the port 8095 cannot be changed and must be free; music
    is streamed to the players from the port 8097. Add the music folder in its settings as a
    local folder at `/media`.
  uk: >
    Він працює в мережі самого сервера, тож порт 8095 змінити не можна, і він має бути вільним;
    музика йде на програвачі з порту 8097. Теку з музикою додайте в його налаштуваннях як
    локальну теку `/media`.
category: media
developer: Open Home Foundation
website: https://www.music-assistant.io
source: https://github.com/music-assistant/server
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: music-assistant
  port: 8095
settings:
  - name: MUSIC
    type: folder
    default: ${DATA_ROOT}/Media/Music
    label: { en: Music folder, uk: Тека з музикою }
    hint:
      en: Read only; inside the app it is /media
      uk: Лише для читання; у застосунку вона — /media
permissions:
  host-network:
    en: To find speakers and players on the home network and stream to them (AirPlay, Chromecast, DLNA, Sonos open ports of their own)
    uk: Щоб знаходити динаміки й програвачі в домашній мережі та передавати на них музику (AirPlay, Chromecast, DLNA, Sonos відкривають власні порти)
