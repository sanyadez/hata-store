# Apache-2.0, changed for Hata Store: see NOTICE
title: Virtual Machine Manager
tagline:
  en: A GTK Broadway web UI for libvirt and virt-manager.
  uk: Вебінтерфейс GTK Broadway для libvirt і virt-manager.
description:
  en: "A GTK Broadway web UI for libvirt and virt-manager, to run virtual machines using QEMU/KVM."
  uk: "Вебінтерфейс GTK Broadway для libvirt і virt-manager, щоб запускати віртуальні машини через QEMU/KVM."
notes:
  en: >
    Install `qemu-kvm` and `libvirt` on the server first (on Debian and Ubuntu: `libvirt-daemon-system`
    and `libvirt-clients`), or the app cannot connect to QEMU/KVM. If it shows no connection, use
    File > Add Connection, pick QEMU/KVM and leave the SSH option off. To keep disk images and ISO files
    in a folder, add it as a storage pool: right-click QEMU/KVM, Details, Storage.
  uk: >
    Спершу встановіть на сервері `qemu-kvm` і `libvirt` (у Debian та Ubuntu: `libvirt-daemon-system`
    і `libvirt-clients`), інакше застосунок не зможе під'єднатися до QEMU/KVM. Якщо з'єднання немає,
    виберіть File > Add Connection, оберіть QEMU/KVM і не вмикайте SSH. Щоб тримати образи дисків і
    файли ISO в окремій теці, додайте її як пул зберігання: правий клік на QEMU/KVM, Details, Storage.
category: development
developer: Red Hat
website: https://virt-manager.org
source: https://github.com/m-bers/docker-virt-manager
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: virt-manager
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 8185
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads directory
      uk: Тека завантажень
    hint:
      en: Inside the app it is /DATA/Downloads
      uk: У застосунку вона — /DATA/Downloads
  - name: DARK_MODE
    type: text
    default: "false"
    label:
      en: Set DARK_MODE to true to enable dark mode
      uk: "Задайте DARK_MODE=true, щоб увімкнути темну тему"
permissions:
  devices:
    en: "It uses devices of the server: /dev/kvm"
    uk: "Він користується пристроями сервера: /dev/kvm"
  host-files:
    en: "It reaches these places of the system: /var/run/libvirt/libvirt-sock, /var/lib/libvirt"
    uk: "Він має доступ до цих місць системи: /var/run/libvirt/libvirt-sock, /var/lib/libvirt"
