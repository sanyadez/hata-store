title: Virtual Machine Manager
tagline:
  en: A GTK Broadway web UI for libvirt and virt-manager.
  uk: Вебінтерфейс GTK Broadway для libvirt і virt-manager.
description:
  en: "A GTK Broadway web UI for libvirt and virt-manager, to run virtual machines using QEMU/KVM."
  uk: "Вебінтерфейс GTK Broadway для libvirt і virt-manager, щоб запускати віртуальні машини через QEMU/KVM."
notes:
  en: "# PLEASE READ WELL!\n## Installing Necessary Dependencies on Host\n\nTo make sure that everything works, you should first install ``qemu`` and ``libvirt`` on your system for the Virtual Machine Manager application to work, because otherwise it doesn't and won't be able to connect to the QEMU/KVM connection (this always applies if you have left HOST at the default).\n\nUbuntu/Debian/Raspberry Pi OS: ``` sudo apt update sudo apt install -y qemu-kvm libvirt-daemon-system libvirt-clients ``` Alpine Linux: ``` sudo apk update sudo apk add qemu libvirt qemu-img sudo rc-update add libvirtd default sudo systemctl enable --now libvirtd ``` OpenWrt (compile from source): ```\n# Install necessary packages to compile from source sudo opkg update sudo opkg install build-essential libtool automake autoconf pkg-config libudev-dev libnl-tiny-dev glib2-dev libssl-dev\n\n# Clone QEMU and libvirt repositories git clone https://github.com/qemu/qemu.git git clone https://github.com/libvirt/libvirt.git\n\n# Build and install QEMU cd qemu ./configure make -j$(nproc) sudo make install\n\n# Build and install libvirt cd ../libvirt ./autogen.sh ./configure make -j$(nproc) sudo make install ``` Arch Linux: ``` sudo pacman -S --noconfirm qemu libvirt virt-manager sudo systemctl enable --now libvirtd ```\n\n## Setting up Directories (for ISO Images, Hard Disk Images etc.)\n\nIn order to set up directories and volumes for storing and accessing things (ISO and hard disk images for example), you can go to the panel for Virtual Machine Manager, right click on the 'QEMU/KVM' text at the homepage of Virtual Machine Manager and click on on 'Details'. From there, go to 'Storage' and click on the green plus icon. From there, you can choose a pool name and use 'Target Path' to choose the desired directory. E.g. for ISO images you can choose /DATA/Downloads (mounted on container at default) as directory to store ISO images. Then create it, and you're good to go! You can do the same if you'd want to store the hard disk images on another location or another drive (a volume/mount first needs to be configured with the settings of the Docker container of Virtual Machine Manager) and make sure to point it to the same path as on the host, in order to resolve conflicts when connecting to the server remotely! Also, if you desire you could also choose the ISO images manually from a path later on, but it has to be on the drive that the server uses and mounted.\n## Troubleshooting\n### No Connection Found\n\nJust go to 'File' > 'Add Connection...'. Make sure that the hypervisor is on QEMU/KVM and do NOT check the SSH option. I'd recommend to leave the automatic connection option turned on, and click 'Connect'. It should then be fixed!"
  uk: "# ПРОЧИТАЙТЕ УВАЖНО!\n## Встановлення потрібних залежностей на хості\n\nЩоб усе працювало, спершу встановіть у системі ``qemu`` і ``libvirt``: без них Virtual Machine Manager не зможе під'єднатися до з'єднання QEMU/KVM (це завжди так, якщо HOST залишено типовим).\n\nUbuntu/Debian/Raspberry Pi OS: ``` sudo apt update sudo apt install -y qemu-kvm libvirt-daemon-system libvirt-clients ``` Alpine Linux: ``` sudo apk update sudo apk add qemu libvirt qemu-img sudo rc-update add libvirtd default sudo systemctl enable --now libvirtd ``` OpenWrt (збирання з вихідного коду): ```\n# Install necessary packages to compile from source sudo opkg update sudo opkg install build-essential libtool automake autoconf pkg-config libudev-dev libnl-tiny-dev glib2-dev libssl-dev\n\n# Clone QEMU and libvirt repositories git clone https://github.com/qemu/qemu.git git clone https://github.com/libvirt/libvirt.git\n\n# Build and install QEMU cd qemu ./configure make -j$(nproc) sudo make install\n\n# Build and install libvirt cd ../libvirt ./autogen.sh ./configure make -j$(nproc) sudo make install ``` Arch Linux: ``` sudo pacman -S --noconfirm qemu libvirt virt-manager sudo systemctl enable --now libvirtd ```\n\n## Налаштування тек (для образів ISO, образів жорстких дисків тощо)\n\nЩоб налаштувати теки й томи для зберігання та доступу до файлів (наприклад, образів ISO і жорстких дисків), відкрийте панель Virtual Machine Manager, клацніть правою кнопкою на тексті «QEMU/KVM» на головній сторінці й виберіть «Details». Перейдіть до «Storage» і натисніть зелений плюс. Там можна вибрати назву пулу та через «Target Path» вказати потрібну теку. Наприклад, для образів ISO можна вибрати /DATA/Downloads (типово змонтовано в контейнер). Потім створіть пул — і все готово. Так само можна зберігати образи жорстких дисків в іншому місці чи на іншому диску (спершу потрібно налаштувати том або монтування в параметрах Docker-контейнера Virtual Machine Manager). Вказуйте той самий шлях, що й на хості, щоб уникнути конфліктів під час віддаленого підключення до сервера. Також образи ISO можна пізніше вибрати вручну за шляхом, але вони мають лежати на диску, який використовує сервер, і бути змонтованими.\n## Усунення неполадок\n### З'єднання не знайдено\n\nПерейдіть у «File» > «Add Connection...». Переконайтеся, що гіпервізор — QEMU/KVM, і НЕ вмикайте параметр SSH. Раджу залишити ввімкненим автоматичне підключення й натиснути «Connect». Це має допомогти!"
category: development
developer: Red Hat
website: https://virt-manager.org
source: https://github.com/m-bers/docker-virt-manager
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
web:
  service: virt-manager
  port: 80
settings:
  - name: WEB_PORT
    type: port
    default: 8185
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads directory
      uk: Тека завантажень
    hint:
      en: Inside the app it is /DATA/Downloads
      uk: У застосунку вона — /DATA/Downloads
  - name: DARK_MODE
    type: text
    default: "false"
    label:
      en: Set DARK_MODE to true to enable dark mode
      uk: "Задайте DARK_MODE=true, щоб увімкнути темну тему"
permissions:
  devices:
    en: "It uses devices of the server: /dev/kvm"
    uk: "Він користується пристроями сервера: /dev/kvm"
  host-files:
    en: "It reaches these places of the system: /var/run/libvirt/libvirt-sock, /var/lib/libvirt"
    uk: "Він має доступ до цих місць системи: /var/run/libvirt/libvirt-sock, /var/lib/libvirt"
