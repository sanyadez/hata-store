# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  librechat-api:
    ports:
      - "${WEB_PORT:-3080}:3080"
    depends_on:
      - librechat-mongodb
      - librechat-rag-api
    image: ghcr.io/danny-avila/librechat-dev:latest@sha256:b278c620834c5653801030091072cad1974b47d0fc15a5009ed1a7d6e4c4f0d7
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      ASSISTANTS_API_KEY: "${ASSISTANTS_API_KEY:?set ASSISTANTS_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?set OPENAI_API_KEY}"
      GOOGLE_KEY: "${GOOGLE_KEY:?set GOOGLE_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}"
      HOST: "${HOST:-0.0.0.0}"
      PORT: "3080"
      DOMAIN_CLIENT: http://0.0.0.0:3080
      DOMAIN_SERVER: http://0.0.0.0:3080
      NO_INDEX: "true"
      TRUST_PROXY: "1"
      CONSOLE_JSON: "false"
      DEBUG_LOGGING: "true"
      DEBUG_CONSOLE: "false"
      MONGO_URI: "${MONGO_URI:-mongodb://librechat-mongodb:27017/LibreChat}"
      MEILI_HOST: "${MEILI_HOST:-http://librechat-meilisearch:7700}"
      RAG_PORT: "${RAG_PORT:-8000}"
      RAG_API_URL: "${RAG_API_URL:-http://librechat-rag-api:8000}"
      SEARCH: "${SEARCH:-true}"
      MEILI_NO_ANALYTICS: "${MEILI_NO_ANALYTICS:-true}"
      OPENAI_MODERATION: "${OPENAI_MODERATION:-false}"
      BAN_VIOLATIONS: "true"
      BAN_DURATION: 1000 * 60 * 60 * 2
      BAN_INTERVAL: "20"
      LOGIN_VIOLATION_SCORE: "1"
      REGISTRATION_VIOLATION_SCORE: "1"
      CONCURRENT_VIOLATION_SCORE: "1"
      MESSAGE_VIOLATION_SCORE: "1"
      NON_BROWSER_VIOLATION_SCORE: "20"
      TTS_VIOLATION_SCORE: "0"
      STT_VIOLATION_SCORE: "0"
      FORK_VIOLATION_SCORE: "0"
      IMPORT_VIOLATION_SCORE: "0"
      FILE_UPLOAD_VIOLATION_SCORE: "0"
      LOGIN_MAX: "7"
      LOGIN_WINDOW: "5"
      REGISTER_MAX: "5"
      REGISTER_WINDOW: "60"
      LIMIT_CONCURRENT_MESSAGES: "true"
      CONCURRENT_MESSAGE_MAX: "2"
      LIMIT_MESSAGE_IP: "true"
      MESSAGE_IP_MAX: "40"
      MESSAGE_IP_WINDOW: "1"
      LIMIT_MESSAGE_USER: "false"
      MESSAGE_USER_MAX: "40"
      MESSAGE_USER_WINDOW: "1"
      ILLEGAL_MODEL_REQ_SCORE: "5"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_REGISTRATION: "true"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_SOCIAL_REGISTRATION: "false"
      ALLOW_PASSWORD_RESET: "${ALLOW_PASSWORD_RESET:?set ALLOW_PASSWORD_RESET}"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      SESSION_EXPIRY: 1000 * 60 * 15
      REFRESH_TOKEN_EXPIRY: (1000 * 60 * 60 * 24) * 7
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}"
      CREDS_KEY: "${CREDS_KEY:?set CREDS_KEY}"
      CREDS_IV: e2341419ec3dd3d19b13a1a87fafcbfb
      DEBUG_PLUGINS: "true"
      DEBUG_OPENAI: "false"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/images"
        target: /app/client/public/images
      - type: bind
        source: "${APP_DATA:-.}/uploads"
        target: /app/uploads
      - type: bind
        source: "${APP_DATA:-.}/logs"
        target: /app/api/logs
    networks:
      - librechat-net
    deploy:
      resources:
        reservations:
          memory: 1024M
  librechat-mongodb:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data-node"
        target: /data/db
    command:
      - mongod
      - "--noauth"
    networks:
      - librechat-net
    deploy:
      resources:
        reservations:
          memory: 1024M
  librechat-meilisearch:
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    user: 1000:1000
    environment:
      MEILI_HOST: "${MEILI_HOST_2:-http://librechat-meilisearch:7700}"
      MEILI_NO_ANALYTICS: "${MEILI_NO_ANALYTICS_2:-true}"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}"
      MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE: "true"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/meili_data_v1.12"
        target: /meili_data
    networks:
      - librechat-net
  librechat-vectordb:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mydatabase}"
      POSTGRES_USER: "${POSTGRES_USER:-myuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    restart: unless-stopped
    volumes:
      - "${APP_DATA:-.}/postgresql/data:/var/lib/postgresql/data"
    networks:
      - librechat-net
    deploy:
      resources:
        reservations:
          memory: 500M
  librechat-rag-api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.9.0
    environment:
      DB_HOST: "${DB_HOST:-librechat-vectordb}"
      RAG_PORT: "${RAG_PORT_2:-8000}"
    restart: unless-stopped
    depends_on:
      - librechat-vectordb
    networks:
      - librechat-net
    deploy:
      resources:
        reservations:
          memory: 1024M
networks:
  librechat-net:
    driver: bridge
