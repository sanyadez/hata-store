title: LibreChat
tagline:
  en: "A full-featured, open-source AI chat interface"
  uk: Повнофункціональний ШІ-чат з відкритим кодом
description:
  en: "LibreChat is a full-featured, open-source AI chat interface that allows users to interact with multiple AI models through a unified platform. It supports various AI providers and offers advanced features like conversation management, plugin support, and customizable interfaces.\n**Key Features:**\n- Support for multiple AI models and providers\n- Conversation history and management\n- Plugin system for extended functionality\n- Customizable themes and interfaces\n- User authentication and management\n- API integrations for various services\n- Search functionality with MeiliSearch\n- RAG (Retrieval-Augmented Generation) support\n- File upload and processing capabilities\n- Multi-language support\n\n**Learn More:**\n- [LibreChat Official Website](https://www.librechat.ai)\n- [LibreChat GitHub Repository](https://github.com/danny-avila/LibreChat)\n\n**extra:** You can refer to the [Custom AI Endpoints](https://www.librechat.ai/docs/configuration/librechat_yaml/ai_endpoints) documentation to configure the relevant files for calling the APIs of Anyscale, ApiPie, Cohere, Deepseek, Databricks, Fireworks, Groq, HuggingFace, Mistral, OpenRouter, Perplexity, ShuttleAI, TogetherAI, Unify, and xAI."
  uk: "LibreChat — повнофункціональний ШІ-чат з відкритим кодом, який дає змогу працювати з багатьма ШІ-моделями на єдиній платформі. Підтримує різних ШІ-провайдерів і пропонує розширені можливості: керування розмовами, підтримку плагінів і настроюваний інтерфейс.\n**Основні можливості:**\n- Підтримка багатьох ШІ-моделей і провайдерів\n- Історія розмов і керування ними\n- Система плагінів для розширення функціональності\n- Настроювані теми та інтерфейси\n- Автентифікація й керування користувачами\n- Інтеграції через API з різними сервісами\n- Пошук за допомогою MeiliSearch\n- Підтримка RAG (генерація з доповненням пошуком)\n- Завантаження та обробка файлів\n- Багатомовна підтримка\n\n**Докладніше:**\n- [Офіційний сайт LibreChat](https://www.librechat.ai)\n- [Репозиторій LibreChat на GitHub](https://github.com/danny-avila/LibreChat)\n\n**Додатково:** щоб настроїти файли для виклику API Anyscale, ApiPie, Cohere, Deepseek, Databricks, Fireworks, Groq, HuggingFace, Mistral, OpenRouter, Perplexity, ShuttleAI, TogetherAI, Unify і xAI, дивіться документацію про [власні кінцеві точки ШІ](https://www.librechat.ai/docs/configuration/librechat_yaml/ai_endpoints)."
category: ai
developer: LibreChat
website: https://www.librechat.ai
source: https://github.com/danny-avila/LibreChat
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: librechat-api
  port: 3080
settings:
  - name: WEB_PORT
    type: port
    default: 3080
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: HOST
    type: text
    default: 0.0.0.0
    label:
      en: Host Address
      uk: Адреса хоста
  - name: MONGO_URI
    type: text
    default: mongodb://librechat-mongodb:27017/LibreChat
    label:
      en: MongoDB Connection URI
      uk: URI підключення до MongoDB
  - name: MEILI_HOST
    type: text
    default: http://librechat-meilisearch:7700
    label:
      en: MeiliSearch Host
      uk: Хост MeiliSearch
  - name: RAG_PORT
    type: text
    default: "8000"
    label:
      en: RAG API Port
      uk: Порт API RAG
  - name: RAG_API_URL
    type: text
    default: http://librechat-rag-api:8000
    label:
      en: RAG API URL
      uk: Адреса API RAG
  - name: SEARCH
    type: text
    default: "true"
    label:
      en: Enable Search Functionality
      uk: Увімкнути пошук
  - name: MEILI_NO_ANALYTICS
    type: text
    default: "true"
    label:
      en: Disable MeiliSearch Analytics in API
      uk: Вимкнути аналітику MeiliSearch в API
  - name: OPENAI_MODERATION
    type: text
    default: "false"
    label:
      en: Enable OpenAI Content Moderation
      uk: Увімкнути модерацію вмісту OpenAI
  - name: ALLOW_PASSWORD_RESET
    type: switch
    default: false
    label:
      en: Password reset by email
      uk: Відновлення пароля поштою
  - name: JWT_SECRET
    type: secret
    length: 64
    chars: hex
    label:
      en: JWT Secret Key for Authentication
      uk: Секретний ключ JWT для автентифікації
  - name: JWT_REFRESH_SECRET
    type: secret
    length: 64
    chars: hex
    label:
      en: JWT Refresh Secret Key
      uk: Секретний ключ JWT для оновлення
  - name: CREDS_KEY
    type: secret
    length: 64
    chars: hex
    label:
      en: Key that encrypts saved API keys
      uk: "Ключ, яким шифруються збережені ключі API"
  - name: MEILI_HOST_2
    type: text
    default: http://librechat-meilisearch:7700
    label:
      en: MeiliSearch Host Address
      uk: Адреса хоста MeiliSearch
  - name: MEILI_NO_ANALYTICS_2
    type: text
    default: "true"
    label:
      en: Disable MeiliSearch Analytics
      uk: Вимкнути аналітику MeiliSearch
  - name: MEILI_MASTER_KEY
    type: secret
    length: 44
    label:
      en: MeiliSearch Master Key
      uk: Головний ключ MeiliSearch
  - name: POSTGRES_DB
    type: text
    default: mydatabase
    label:
      en: PostgreSQL Database Name
      uk: Назва бази даних PostgreSQL
  - name: POSTGRES_USER
    type: text
    default: myuser
    label:
      en: PostgreSQL Username
      uk: Користувач PostgreSQL
  - name: POSTGRES_PASSWORD
    type: secret
    label:
      en: PostgreSQL Password
      uk: Пароль PostgreSQL
  - name: DB_HOST
    type: text
    default: librechat-vectordb
    label:
      en: Database Host for RAG
      uk: Хост бази даних для RAG
  - name: RAG_PORT_2
    type: text
    default: "8000"
    label:
      en: RAG Service Port
      uk: Порт служби RAG
