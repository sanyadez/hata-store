      hr: RAG API Port
      pt: Porta API RAG
      ru: Порт API RAG
      tr: RAG API Bağlantı Noktası
      uk: Порт API RAG
  - name: RAG_API_URL
    type: text
    default: http://librechat-rag-api:8000
    label:
      en: RAG API URL
      it: URL API RAG
      nb: RAG API URL
      zh: RAG API URL
      ja: RAG API URL
      ko: RAG API URL
