    type: text
    default: "true"
    label:
      en: Enable Search Functionality
      it: Abilita Funzionalità di Ricerca
      nb: Aktiver Søke Funksjonalitet
      zh: 启用搜索功能
      ja: 検索機能を有効化
      ko: 검색 기능 활성화
      fr: Activer la Fonctionnalité de Recherche
      de: Suchfunktionalität aktivieren
