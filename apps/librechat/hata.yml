      el: Απενεργοποίηση Αναλύσεων MeiliSearch στο API
      hr: Onemogući MeiliSearch Analytics u API-ju
      pt: Desativar Análises MeiliSearch na API
      ru: Отключить аналитику MeiliSearch в API
      tr: "API'de MeiliSearch Analytics'i Devre Dışı Bırak"
      uk: Вимкнути аналітику MeiliSearch в API
