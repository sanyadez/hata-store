      hr: MeiliSearch Domaćin
      pt: Anfitrião MeiliSearch
      ru: Хост MeiliSearch
      tr: MeiliSearch Ana Bilgisayarı
      uk: Хост MeiliSearch
  - name: RAG_PORT
    type: text
    default: "8000"
    label:
      en: RAG API Port
      it: Porta API RAG
      nb: RAG API Port
      zh: RAG API端口
      ja: RAG APIポート
      ko: RAG API 포트
      fr: Port API RAG
      de: RAG API Port
      sv: RAG API Port
