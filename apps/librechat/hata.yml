    type: text
    default: "true"
    label:
      en: Disable MeiliSearch Analytics in API
      it: Disabilita Analisi MeiliSearch in API
      nb: Deaktiver MeiliSearch Analytics i API
      zh: 在API中禁用MeiliSearch分析
