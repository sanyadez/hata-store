    type: text
    default: "false"
    label:
      en: Enable OpenAI Content Moderation
      it: Abilita Moderazione Contenuti OpenAI
      nb: Aktiver OpenAI Innholds Moderering
      zh: 启用OpenAI内容审核
      ja: OpenAIコンテンツモデレーションを有効化
      ko: OpenAI 콘텐츠 조정 활성화
      fr: Activer la Modération de Contenu OpenAI
