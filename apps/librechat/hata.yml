source: https://github.com/danny-avila/LibreChat
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: librechat-api
  port: 3080
settings:
  - name: WEB_PORT
    type: port
    default: 3080
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: ASSISTANTS_API_KEY
    type: secret
    length: 13
    label:
      en: ASSISTANTS_API_KEY
  - name: OPENAI_API_KEY
    type: secret
    length: 13
    label:
      en: OPENAI_API_KEY
  - name: GOOGLE_KEY
    type: secret
    length: 13
    label:
      en: GOOGLE_KEY
  - name: ANTHROPIC_API_KEY
    type: secret
    length: 13
    label:
      en: ANTHROPIC_API_KEY
  - name: HOST
    type: text
    default: 0.0.0.0
    label:
      en: Host Address
      it: Indirizzo Host
      nb: Vert Adresse
      zh: 主机地址
      ja: ホストアドレス
      ko: 호스트 주소
      fr: Adresse Hôte
      de: Host-Adresse
      sv: Värd Adress
      el: Διεύθυνση Κεντρικού Υπολογιστή
      hr: Adresa Domaćina
      pt: Endereço do Anfitrião
      ru: Адрес хоста
      tr: Ana Bilgisayar Adresi
      uk: Адреса хоста
  - name: MONGO_URI
    type: text
    default: mongodb://librechat-mongodb:27017/LibreChat
    label:
      en: MongoDB Connection URI
      it: URI Connessione MongoDB
      nb: MongoDB Tilkoblings-URI
      zh: MongoDB连接URI
      ja: MongoDB接続URI
      ko: MongoDB 연결 URI
      fr: URI de Connexion MongoDB
      de: MongoDB-Verbindungs-URI
      sv: MongoDB Anslutnings-URI
      el: URI Σύνδεσης MongoDB
      hr: MongoDB URI Veze
      pt: URI de Ligação MongoDB
      ru: URI подключения MongoDB
      tr: "MongoDB Bağlantı URI'si"
      uk: URI підключення до MongoDB
  - name: MEILI_HOST
    type: text
    default: http://librechat-meilisearch:7700
    label:
      en: MeiliSearch Host
      it: Host MeiliSearch
      nb: MeiliSearch Vert
      zh: MeiliSearch主机
      ja: MeiliSearchホスト
