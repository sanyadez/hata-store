# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: PodFetch
tagline:
  en: Sleek podcast downloader with GPodder sync
  uk: Витончений завантажувач подкастів із синхронізацією GPodder
description:
  en: "PodFetch is a sleek and efficient self-hosted podcast manager written in Rust. It automatically downloads new episodes of your favorite podcasts on a configurable interval and lets you listen to them from a clean, fast web UI on any device.\n\nIts standout feature is a GPodder-compatible sync API: keep using mobile podcast apps like AntennaPod while subscriptions, episode actions, and playback positions stay in sync with your server. PodFetch also supports multi-user setups with invites and roles, playlists, favorites, OPML import and export, podcast search via iTunes or Podcast Index, and optional OIDC or basic authentication."
  uk: "PodFetch — витончений і ефективний менеджер подкастів для самостійного розгортання, написаний на Rust. Він автоматично завантажує нові випуски улюблених подкастів із налаштованою періодичністю, а слухати їх можна в чистому й швидкому вебінтерфейсі на будь-якому пристрої.\n\nГоловна особливість — API синхронізації, сумісний із GPodder: користуйтеся мобільними застосунками на кшталт AntennaPod, а підписки, дії з випусками й позиції відтворення залишатимуться синхронізованими з вашим сервером. PodFetch також підтримує кількох користувачів із запрошеннями й ролями, плейлисти, обране, імпорт та експорт OPML, пошук подкастів через iTunes чи Podcast Index і необов'язкову автентифікацію через OIDC або базову."
category: media
developer: SamTV12345
website: https://samtv12345.github.io/PodFetch/
source: https://github.com/SamTV12345/PodFetch
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: podfetch
  port: 8000
settings:
  - name: WEB_PORT
    type: port
    default: 8000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DATABASE_URL
    type: text
    default: sqlite:///app/db/podcast.db
    label:
      en: SQLite database location (or a PostgreSQL connection string)
      uk: Розташування бази SQLite (або рядок підключення до PostgreSQL)
  - name: POLLING_INTERVAL
    type: text
    default: "300"
    label:
      en: Minutes between checks for new episodes
      uk: Кількість хвилин між перевірками нових випусків
  - name: BASIC_AUTH
    type: text
    default: "false"
    label:
      en: Basic auth
      uk: Базова автентифікація
    hint:
      en: Set to true to enable login (required for GPodder sync); also set USERNAME and PASSWORD
      uk: "Установіть true, щоб увімкнути вхід (потрібно для синхронізації GPodder); також укажіть USERNAME і PASSWORD."
  - name: GPODDER_INTEGRATION_ENABLED
    type: text
    default: "false"
    label:
      en: Gpodder integration enabled
      uk: Інтеграція з GPodder
    hint:
      en: Set to true to enable the GPodder-compatible sync API for apps like AntennaPod
      uk: "Установіть true, щоб увімкнути API синхронізації, сумісний із GPodder, для застосунків на кшталт AntennaPod."
