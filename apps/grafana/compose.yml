# Apache-2.0, changed for Hata Store: see NOTICE
services:
  grafana:
    image: grafana/grafana:13.0.1-security-01
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-3003}:3000"
    restart: always
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /var/lib/grafana
