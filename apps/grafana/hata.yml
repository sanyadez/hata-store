title: Grafana
tagline:
  en: "Grafana is a complete observability stack that allows you to monitor and analyze metrics, logs and traces."
  uk: "Grafana — спостереження за системами: метрики, журнали й трасування на одних панелях."
description:
  en: "Grafana open source is open source visualization and analytics software.Visualizations: Fast and flexible client side graphs with a multitude of options. Panel plugins offer many different ways to visualize metrics and logs. Dynamic Dashboards: Create dynamic & reusable dashboards with template variables that appear as dropdowns at the top of the dashboard. Explore Metrics: Explore your data through ad-hoc queries and dynamic drilldown. Split view and compare different time ranges, queries and data sources side by side. Explore Logs: Experience the magic of switching from metrics to logs with preserved label filters. Quickly search through all your logs or streaming them live. Alerting: Visually define alert rules for your most important metrics. Grafana will continuously evaluate and send notifications to systems like Slack, PagerDuty, VictorOps, OpsGenie. Mixed Data Sources: Mix different data sources in the same graph! You can specify a data source on a per-query basis. This works for even custom datasources."
  uk: "Grafana з відкритим кодом — програма для візуалізації та аналізу даних з відкритим кодом. Візуалізації: швидкі й гнучкі графіки на стороні клієнта з безліччю параметрів. Плагіни панелей пропонують багато способів показати метрики й журнали. Динамічні дашборди: створюйте динамічні дашборди багаторазового використання зі змінними шаблону, які з’являються як випадні списки вгорі дашборда. Дослідження метрик: вивчайте дані за допомогою довільних запитів і динамічної деталізації. Розділяйте вікно та порівнюйте різні проміжки часу, запити й джерела даних поруч. Дослідження журналів: переходьте від метрик до журналів зі збереженням фільтрів за мітками. Швидко шукайте в усіх журналах або дивіться їх наживо. Сповіщення: наочно задавайте правила сповіщень для найважливіших метрик. Grafana постійно перевірятиме їх і надсилатиме сповіщення в такі системи, як Slack, PagerDuty, VictorOps, OpsGenie. Змішані джерела даних: поєднуйте різні джерела даних в одному графіку! Джерело можна задати для кожного запиту окремо, навіть для власних джерел даних."
