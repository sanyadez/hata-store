title: ezBookkeeping
tagline:
  en: Light personal bookkeeping for the household, on the desktop and the phone
  uk: Легкий облік особистих і сімейних фінансів, на комп'ютері й на телефоні
description:
  en: >
    A light personal finance app: accounts and cards, expenses, income and transfers with categories and
    tags, several currencies with exchange rates, scheduled transactions, pictures and places on a map, and
    statistics with charts and an explorer of your own questions. Records can be imported from a bank
    statement or other apps (CSV, OFX, QIF, Firefly III, GnuCash and more). It has a page made for the
    desktop and one made for the phone, which can be added to the home screen as an app.
  uk: >
    Легкий застосунок для особистих фінансів: рахунки й картки, витрати, доходи й перекази з категоріями та
    мітками, кілька валют із курсами, заплановані операції, фото й місця на мапі, а також статистика з
    діаграмами й власними запитами до даних. Записи можна завантажити з банківської виписки чи інших
    застосунків (CSV, OFX, QIF, Firefly III, GnuCash тощо). Має сторінку для комп'ютера й окрему для
    телефона, яку можна додати на головний екран як застосунок.
notes:
  en: >
    At the first visit press **Create an account**: the first account is yours. Anyone who can open the
    page can make one too, so once everybody has an account, switch off "Allow new accounts" in the app's
    settings.
  uk: >
    Під час першого відкриття натисніть **Create an account**: перший обліковий запис — ваш. Створити
    його може кожен, хто відкриє сторінку, тож коли всі вже мають облікові записи, вимкніть «Дозволити
    нові облікові записи» в налаштуваннях застосунку.
category: finance
developer: MaysWind
website: https://ezbookkeeping.mayswind.net
source: https://github.com/mayswind/ezbookkeeping
icon: "data:image/webp;base64,"
screenshots: [1.webp, 2.webp, 3.webp, 4.webp, 5.webp, 6.webp]
web:
  service: ezbookkeeping
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 18087
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ENABLE_REGISTER
    type: switch
    default: true
    label: { en: Allow new accounts, uk: Дозволити нові облікові записи }
    hint:
      en: Anyone who opens the page can make an account while this is on
      uk: Поки ввімкнено, обліковий запис може створити кожен, хто відкриє сторінку
  - name: SECRET_KEY
    type: secret
    label: { en: Key that signs the sign-ins, uk: "Ключ, яким підписуються входи" }
