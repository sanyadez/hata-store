title: LyrionMusicServer
tagline:
  en: Lyrion Music Server is a streaming audio server for Squeezebox audio players.
  uk: Lyrion Music Server — сервер потокового аудіо для програвачів Squeezebox.
description:
  en: "Lyrion Music Server is a self-hosted music management app designed to control a variety of audio playback devices, supporting streaming of local music collections, internet radio, and multiple streaming services (with or without subscriptions). Its intuitive Web interface enables users to access and control music effortlessly via any browser, ideal for music enthusiasts creating personalized audio experiences.\n\nThe app's core features include versatile music streaming and extensive customization. Users can seamlessly play local music libraries, listen to global internet radio, or connect to streaming services, catering to diverse listening needs. It offers flexible control options, allowing customization of server functionality, interaction methods, and interface appearance. Additionally, it supports a unified interface across multiple devices, ensuring a consistent experience on phones, computers, or other players, with the ability to select the ideal playback device for any scenario.\n\nIt can be flexibly deployed on personal servers or NAS devices, with community-provided documentation aiding users in optimising setups and extending functionality. Whether managing personal music collections or creating a shared audio hub for family, the app's intuitive operation and high flexibility deliver a modern music management platform, meeting needs from casual listening to professional audio management.\n\n**Key Features:**\n- Music streaming for local collections, internet radio, and multiple streaming services\n- Intuitive Web interface for effortless music access and control via any browser\n- Extensive customisation options for server functionality, interaction methods, and interface appearance\n- Unified multi-device interface ensuring consistent experience across phones, computers, and other players\n- Community documentation support for optimising setups and extending functionality\n\n**Learn More:**\n- [Lyrion Music Server Official Website](https://www.lyrion.org)\n- [Lyrion Music Server GitHub Repository](https://github.com/lms-community/slimserver)"
  uk: "Lyrion Music Server — застосунок для керування музикою на власному сервері, який керує різними пристроями відтворення і підтримує потокове відтворення локальних колекцій, інтернет-радіо та кількох стрімінгових сервісів (з підпискою чи без). Зрозумілий вебінтерфейс дає змогу керувати музикою з будь-якого браузера — для всіх, хто хоче налаштувати слухання під себе.\n\nОсновні можливості — гнучке потокове відтворення і широкі налаштування. Можна відтворювати локальні музичні бібліотеки, слухати радіо з усього світу або підключати стрімінгові сервіси. Сервер гнучко настроюється: функції, способи керування і вигляд інтерфейсу. Крім того, єдиний інтерфейс на всіх пристроях дає однаковий досвід на телефоні, комп'ютері чи іншому програвачі, а для будь-якої ситуації можна вибрати найзручніший пристрій відтворення.\n\nЗастосунок можна гнучко розгорнути на власному сервері або NAS, а документація від спільноти допомагає оптимізувати налаштування і розширювати можливості. Чи ви керуєте особистою музичною колекцією, чи створюєте спільний аудіоосередок для родини, простота використання й гнучкість дають сучасну платформу керування музикою, що задовольнить потреби від розважального слухання до професійної роботи з аудіо.\n\n**Основні можливості:**\n- Потокова музика з локальних колекцій, інтернет-радіо та кількох стрімінгових сервісів\n- Зрозумілий вебінтерфейс для легкого доступу до музики й керування нею з будь-якого браузера\n- Широкі налаштування функцій сервера, способів керування і вигляду інтерфейсу\n- Єдиний інтерфейс на різних пристроях — однаковий досвід на телефонах, комп'ютерах та інших програвачах\n- Документація від спільноти для оптимізації налаштувань і розширення можливостей\n\n**Докладніше:**\n- [Офіційний сайт Lyrion Music Server](https://www.lyrion.org)\n- [Репозиторій Lyrion Music Server на GitHub](https://github.com/lms-community/slimserver)"
category: media
developer: LMS-Community
website: https://www.lyrion.org
source: https://github.com/lms-community/slimserver
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: lyrionmusicserver
  port: 9000
settings:
  - name: WEB_PORT
    type: port
    default: 9000
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_9090
    type: port
    default: 9090
    label:
      en: CLI Port
      uk: Порт CLI
    advanced: true
  - name: PORT_3483
    type: port
    default: 3483
    label:
      en: Discovery Port (TCP)
      uk: Порт виявлення (TCP)
    advanced: true
  - name: MUSIC_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Music"
    label:
      en: Music directory
      uk: Тека з музикою
    hint:
      en: Inside the app it is /music
      uk: У застосунку вона — /music
  - name: HTTP_PORT
    type: text
    default: "9000"
    label:
      en: HTTP Port for Web Interface
      uk: Порт HTTP для вебінтерфейсу
