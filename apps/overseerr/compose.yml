# Apache-2.0, changed for Hata Store: see NOTICE
services:
  overseerr:
    image: linuxserver/overseerr:1.35.0
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${WEB_PORT:-5055}:5055"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
