# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  overseerr:
    image: linuxserver/overseerr:1.35.0
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${WEB_PORT:-5055}:5055"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
