# Apache-2.0, changed for Hata Store: see NOTICE
services:
  medusa:
    deploy:
      resources:
        limits:
          memory: 7848M
    environment:
      TZ: "${TZ:-UTC}"
    image: pymedusa/medusa:master@sha256:0caf2991d15030b99864158144903c1d2b5f4f9ff019ec4450c4f1cb33569857
    ports:
      - "${WEB_PORT:-8081}:8081"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /config
      - type: bind
        source: "${APP_DATA:-.}/Downloads/Television"
        target: /downloads
      - type: bind
        source: "${APP_DATA:-.}/Media/Television"
        target: /tv
    privileged: false
