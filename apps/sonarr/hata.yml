settings:
  - name: WEB_PORT
    type: port
    default: 8989
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: TV_SHOWS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/TV Shows"
    label:
      en: Sonarr tv directory
      zh: Sonarr TV目录
      uk: Тека серіалів Sonarr
    hint:
      en: Inside the app it is /tv
      uk: У застосунку вона — /tv
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Sonarr downloads directory
      zh: Sonarr下载目录
      uk: Тека завантажень Sonarr
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
