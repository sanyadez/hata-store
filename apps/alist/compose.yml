# Apache-2.0, changed for Hata Store: see NOTICE
services:
  alist:
    image: xhofe/alist:v3.66.0
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-5244}:5244"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /opt/alist/data
