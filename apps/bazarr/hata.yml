# Apache-2.0, changed for Hata Store: see NOTICE
title: Bazarr
tagline:
  en: Letter generators for Sonarr and Radarr
  uk: Субтитри для Sonarr і Radarr
description:
  en: Bazarr is a companion application to Sonarr and Radarr. It can manage and download subtitles based on your requirements. You define your preferences by TV show or movie and Bazarr takes care of everything for you.
  uk: "Bazarr — супутній застосунок для Sonarr і Radarr. Він керує субтитрами й завантажує їх відповідно до ваших вимог. Ви задаєте уподобання для кожного серіалу чи фільму, а решту Bazarr робить сам."
category: media
developer: Sabnzbd Team
website: https://www.bazarr.media
source: https://github.com/morpheus65535/bazarr
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: bazarr
  port: 6767
settings:
  - name: WEB_PORT
    type: port
    default: 6767
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MOVIES_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Movies"
    label:
      en: Media/Movies
      uk: Медіа/Фільми
    hint:
      en: Inside the app it is /movies
      uk: У застосунку вона — /movies
  - name: TV_SHOWS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/TV Shows"
    label:
      en: Media/TV Shows
      uk: Медіа/Серіали
    hint:
      en: Inside the app it is /tv
      uk: У застосунку вона — /tv
