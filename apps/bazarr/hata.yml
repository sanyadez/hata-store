title:
  en: Bazarr
tagline:
  en: Letter generators for Sonarr and Radarr
  zh: Sonarr和Radarr的信件生成器
  ar: مولدات رسائل لـ Sonarr و Radarr
  de: Briefgeneratoren für Sonarr und Radarr
  es: Generadores de cartas para Sonarr y Radarr
  fr: Générateurs de lettres pour Sonarr et Radarr
  hu: Levélgenerátorok a Sonarr és Radarr számára
  it: Generatori di lettere per Sonarr e Radarr
  ru: Генераторы писем для Sonarr и Radarr
  pl: Generatory listów dla Sonarr i Radarr
  pt: Geradores de cartas para Sonarr e Radarr
  sv: Brevgenererare för Sonarr och Radarr
  uk: Субтитри для Sonarr і Radarr
description:
  en: Bazarr is a companion application to Sonarr and Radarr. It can manage and download subtitles based on your requirements. You define your preferences by TV show or movie and Bazarr takes care of everything for you.
  zh: Bazarr是Sonarr和Radarr的伴侣应用程序。它可以根据您的要求管理和下载字幕。您可以根据电视节目或电影来定义您的偏好，并且Bazarr会为您处理所有事情。
  ar: يمكن لـ Bazarr أن يكون تطبيقًا مرافقًا لـ Sonarr و Radarr. يمكنه إدارة الترجمات وتنزيلها بناءً على متطلباتك. تحدد تفضيلاتك حسب البرنامج التلفزيوني أو الفيلم ويتولى Bazarr كل شيء لك.
  de: "Bazarr ist eine Begleitapplikation zu Sonarr und Radarr. Es kann Untertitel verwalten und herunterladen, basierend auf Ihren Anforderungen. Sie definieren Ihre Präferenzen nach TV-Serie oder Film und Bazarr kümmert sich für Sie um alles."
  es: Bazarr es una aplicación complementaria a Sonarr y Radarr. Puede administrar y descargar subtítulos según sus requisitos. Puede definir sus preferencias por serie de televisión o película y Bazarr se encarga de todo por usted.
  fr: "Bazarr est une application complémentaire à Sonarr et Radarr. Il peut gérer et télécharger des sous-titres en fonction de vos besoins. Vous définissez vos préférences par série télévisée ou film et Bazarr s'occupe de tout pour vous."
  hu: "A Bazarr egy Sonarr és Radarr kiegészítő alkalmazás. Alapján a követelményeinek kezelheti és letöltheti a feliratokat. A TV sorozatok vagy filmek preferenciáit meghatározhatja, és a Bazarr mindenért felel."
  it: "Bazarr è un'applicazione complementare a Sonarr e Radarr. Può gestire e scaricare sottotitoli in base alle tue esigenze. Puoi definire le tue preferenze per serie TV o film e Bazarr si occupa di tutto per te."
  ru: "Bazarr - это дополнительное приложение к Sonarr и Radarr. Он может управлять и загружать субтитры в соответствии с вашими требованиями. Вы определяете свои предпочтения по сериалу или фильму, а Bazarr заботится обо всем за вас."
  pl: "Bazarr to aplikacja pomocnicza do Sonarr i Radarr. Może zarządzać i pobierać napisy na podstawie swoich wymagań. Definiujesz swoje preferencje według serialu telewizyjnego lub filmu, a Bazarr zajmuje się wszystkim za ciebie."
  pt: O Bazarr é um aplicativo complementar ao Sonarr e Radarr. Ele pode gerenciar e baixar legendas com base em suas necessidades. Você define suas preferências por série de TV ou filme e o Bazarr cuida de tudo para você.
  sv: Bazarr är ett komplement till Sonarr och Radarr. Det kan hantera och ladda ner undertexter baserat på dina krav. Du definierar dina preferenser för TV-serie eller film och Bazarr tar hand om allt åt dig.
  uk: "Bazarr — супутній застосунок для Sonarr і Radarr. Він керує субтитрами й завантажує їх відповідно до ваших вимог. Ви задаєте уподобання для кожного серіалу чи фільму, а решту Bazarr робить сам."
