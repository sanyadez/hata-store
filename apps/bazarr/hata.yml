settings:
  - name: WEB_PORT
    type: port
    default: 6767
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: MOVIES_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Movies"
    label:
      en: Media/Movies
      uk: Медіа/Фільми
    hint:
      en: Inside the app it is /movies
      uk: У застосунку вона — /movies
  - name: TV_SHOWS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/TV Shows"
    label:
      en: Media/TV Shows
      uk: Медіа/Серіали
    hint:
      en: Inside the app it is /tv
      uk: У застосунку вона — /tv
