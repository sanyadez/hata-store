# Apache-2.0, changed for Hata Store: see NOTICE
title: Nginx Proxy Manager
tagline:
  en: "Managing Nginx proxy hosts with a simple, powerful interface."
  uk: Керування проксі-вузлами Nginx через простий і потужний інтерфейс.
description:
  en: "Nginx Proxy Manager is a simple, powerful tool to help you host multiple websites on a single server."
  uk: "Nginx Proxy Manager — простий і потужний інструмент, який допомагає розмістити кілька вебсайтів на одному сервері."
notes:
  en: "Default Administrator User\n\n| Username | Password | | -------- | -------- | | `admin@example.com` | `changeme` |"
  uk: "Типовий адміністратор\n\n| Ім'я користувача | Пароль | | -------- | -------- | | `admin@example.com` | `changeme` |"
category: network
developer: Nginx Proxy Manager
website: https://nginxproxymanager.com
source: https://github.com/NginxProxyManager/nginx-proxy-manager
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: nginxproxymanager
  port: 81
settings:
  - name: PORT_80
    type: port
    default: 80
    label:
      en: Nginx HTTP Port
      uk: HTTP-порт Nginx
    advanced: true
  - name: PORT_443
    type: port
    default: 443
    label:
      en: Nginx HTTPS Port
      uk: HTTPS-порт Nginx
    advanced: true
  - name: WEB_PORT
    type: port
    default: 81
    label:
      en: Web port
      uk: Порт вебінтерфейсу
