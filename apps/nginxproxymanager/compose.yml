# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  nginxproxymanager:
    image: jc21/nginx-proxy-manager:2.13.5
    deploy:
      resources:
        reservations:
          memory: 128M
    ports:
      - "${PORT_80:-80}:80"
      - "${PORT_443:-443}:443"
      - "${WEB_PORT:-81}:81"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
      - type: bind
        source: "${APP_DATA:-.}/etc/letsencrypt"
        target: /etc/letsencrypt
