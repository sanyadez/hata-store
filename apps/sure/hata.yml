description:
  en: "Sure is a personal finance management application designed to help you track your expenses, income, and investments in one place. With an intuitive interface and powerful features, Sure makes it easy to understand your financial situation and make informed decisions about your money.\n\n**Key Features:**\n- **Expense Tracking**: Easily log and categorize your expenses\n- **Income Management**: Track multiple income sources\n- **Investment Monitoring**: Keep an eye on your investments and their performance\n- **Budget Planning**: Create and maintain budgets to control your spending\n- **Financial Reports**: Generate detailed reports to understand your financial habits\n- **AI-Powered Insights**: Get personalized financial advice using AI technology\n\n**Use Cases:**\n- Personal budget management\n- Expense tracking and categorization\n- Investment portfolio monitoring\n- Financial goal setting and tracking\n- Cash flow analysis\n\n**Learn More:**\n- [Sure GitHub Repository](https://github.com/we-promise/sure)"
  it: "Sure è un'applicazione di gestione finanziaria personale progettata per aiutarti a monitorare spese, redditi e investimenti in un unico posto. Con un'interfaccia intuitiva e funzionalità potenti, Sure rende facile comprendere la tua situazione finanziaria e prendere decisioni informate sul tuo denaro.\n\n**Caratteristiche Principali:**\n- **Tracciamento Spese**: Registra e categorizza facilmente le tue spese\n- **Gestione Reddito**: Monitora molteplici fonti di reddito\n- **Monitoraggio Investimenti**: Tieni d'occhio i tuoi investimenti e le loro performance\n- **Pianificazione Budget**: Crea e mantieni budget per controllare le tue spese\n- **Report Finanziari**: Genera report dettagliati per comprendere le tue abitudini finanziarie\n- **Approfondimenti AI**: Ottieni consigli finanziari personalizzati utilizzando la tecnologia AI\n\n**Casi d'Uso:**\n- Gestione del budget personale\n- Tracciamento e categorizzazione delle spese\n- Monitoraggio del portafoglio di investimenti\n- Impostazione e monitoraggio degli obiettivi finanziari\n- Analisi del flusso di cassa\n\n**Scopri di Più:**\n- [Repository GitHub Sure](https://github.com/we-promise/sure)"
  nb: "Sure er en applikasjon for personlig finansforvaltning designet for å hjelpe deg med å spore utgifter, inntekter og investeringer på ett sted. Med et intuitivt grensesnitt og kraftfulle funksjoner, gjør Sure det enkelt å forstå din finansielle situasjon og ta informerte beslutninger om pengene dine.\n\n**Hovedfunksjoner:**\n- **Utgiftssporing**: Loggfør og kategoriser enkelt utgiftene dine\n- **Inntektsstyring**: Spor flere inntektskilder\n- **Investeringsovervåking**: Hold øye med investeringene dine og deres ytelse\n- **Budsjettplanlegging**: Opprett og vedlikehold budsjetter for å kontrollere utgiftene dine\n- **Finansielle Rapporter**: Generer detaljerte rapporter for å forstå dine finansielle vaner\n- **AI-drevne Innsikter**: Få personlig finansiell rådgivning ved bruk av AI-teknologi\n\n**Bruksområder:**\n- Personlig budsjettstyring\n- Utgiftssporing og kategorisering\n- Overvåking av investeringsportefølje\n- Målsetting og sporing av finansielle mål\n- Kontantstrømanalyse\n\n**Lær Mer:**\n- [Sure GitHub Repository](https://github.com/we-promise/sure)"
  zh: "Sure是一款个人理财管理应用，旨在帮助您在一个地方跟踪您的支出、收入和投资。凭借直观的界面和强大的功能，Sure让您轻松了解自己的财务状况，并对您的资金做出明智的决策。\n\n**主要特性：**\n- **支出跟踪**：轻松记录和分类您的支出\n- **收入管理**：跟踪多个收入来源\n- **投资监控**：关注您的投资及其表现\n- **预算规划**：创建和维护预算以控制您的支出\n- **财务报告**：生成详细报告以了解您的财务习惯\n- **AI驱动洞察**：使用AI技术获取个性化财务建议\n\n**使用场景：**\n- 个人预算管理\n- 支出跟踪和分类\n- 投资组合监控\n- 财务目标设定和跟踪\n- 现金流分析\n\n**了解更多：**\n- [Sure GitHub仓库](https://github.com/we-promise/sure)"
  ja: "Sureは、支出、収入、投資を一か所で追跡するために設計された個人ファイナンス管理アプリケーションです。直感的なインターフェースと強力な機能により、Sureは財政状況を理解し、資金について情報に基づいた意思決定を容易にします。\n\n**主な機能：**\n- **支出追跡**：支出を簡単に記録および分類\n- **収入管理**：複数の収入源を追跡\n- **投資モニタリング**：投資とそのパフォーマンスを監視\n- **予算計画**：支出を管理するための予算を作成および維持\n- **財務レポート**：財務習慣を理解するための詳細なレポートを生成\n- **AI駆動型洞察**：AI技術を使用してパーソナライズされた財務アドバイスを取得\n\n**使用例：**\n- 個人予算管理\n- 支出の追跡と分類\n- 投資ポートフォリオの監視\n- 財務目標の設定と追跡\n- キャッシュフロー分析\n\n**詳細情報：**\n- [Sure GitHubリポジトリ](https://github.com/we-promise/sure)"
  ko: "Sure는 지출, 수입, 투자를 한곳에서 추적할 수 있도록 설계된 개인 재무 관리 애플리케이션입니다. 직관적인 인터페이스와 강력한 기능을 통해 Sure는 재정 상황을 이해하고 자금에 대한 정보에 입각한 결정을 내리는 것을 쉽게 만듭니다.\n\n**주요 기능:**\n- **지출 추적**: 지출을 쉽게 기록하고 분류\n- **수입 관리**: 여러 수입원 추적\n- **투자 모니터링**: 투자와 그 성과를 주시\n- **예산 계획**: 지출을 통제하기 위해 예산 생성 및 유지\n- **재무 보고서**: 재무 습관을 이해하기 위한 상세한 보고서 생성\n- **AI 기반 통찰력**: AI 기술을 사용하여 개인화된 재무 조언 얻기\n\n**사용 사례:**\n- 개인 예산 관리\n- 지출 추적 및 분류\n- 투자 포트폴리오 모니터링\n- 재무 목표 설정 및 추적\n- 현금 흐름 분석\n\n**더 알아보기:**\n- [Sure GitHub 저장소](https://github.com/we-promise/sure)"
  fr: "Sure est une application de gestion financière personnelle conçue pour vous aider à suivre vos dépenses, revenus et investissements en un seul endroit. Avec une interface intuitive et des fonctionnalités puissantes, Sure facilite la compréhension de votre situation financière et la prise de décisions éclairées concernant votre argent.\n\n**Fonctionnalités Clés :**\n- **Suivi des Dépenses** : Enregistrez et catégorisez facilement vos dépenses\n- **Gestion des Revenus** : Suivez plusieurs sources de revenus\n- **Surveillance des Investissements** : Gardez un œil sur vos investissements et leurs performances\n- **Planification Budgétaire** : Créez et maintenez des budgets pour contrôler vos dépenses\n- **Rapports Financiers** : Générez des rapports détaillés pour comprendre vos habitudes financières\n- **Conseils par IA** : Obtenez des conseils financiers personnalisés grâce à la technologie IA\n\n**Cas d'Usage :**\n- Gestion du budget personnel\n- Suivi et catégorisation des dépenses\n- Surveillance du portefeuille d'investissements\n- Définition et suivi des objectifs financiers\n- Analyse de la trésorerie\n\n**En Savoir Plus :**\n- [Dépôt GitHub Sure](https://github.com/we-promise/sure)"
  de: "Sure ist eine Anwendung zur persönlichen Finanzverwaltung, die entwickelt wurde, um Ihnen zu helfen, Ausgaben, Einkommen und Investitionen an einem Ort zu verfolgen. Mit einer intuitiven Benutzeroberfläche und leistungsstarken Funktionen macht Sure es einfach, Ihre finanzielle Situation zu verstehen und fundierte Entscheidungen über Ihr Geld zu treffen.\n\n**Hauptfunktionen:**\n- **Ausgabenverfolgung**: Erfassen und kategorisieren Sie Ihre Ausgaben einfach\n- **Einkommensverwaltung**: Verfolgen Sie mehrere Einkommensquellen\n- **Investitionsüberwachung**: Behalten Sie Ihre Investitionen und deren Leistung im Auge\n- **Budgetplanung**: Erstellen und pflegen Sie Budgets, um Ihre Ausgaben zu kontrollieren\n- **Finanzberichte**: Generieren Sie detaillierte Berichte, um Ihre Finanzgewohnheiten zu verstehen\n- **KI-gestützte Einblicke**: Erhalten Sie personalisierte Finanzberatung durch KI-Technologie\n\n**Anwendungsfälle:**\n- Persönliche Budgetverwaltung\n- Ausgabenverfolgung und -kategorisierung\n- Überwachung des Anlageportfolios\n- Festlegung und Verfolgung von Finanzzielen\n- Cashflow-Analyse\n\n**Mehr Erfahren:**\n- [Sure GitHub Repository](https://github.com/we-promise/sure)"
  sv: "Sure är en applikation för personlig finanshantering designad för att hjälpa dig att spara utgifter, inkomster och investeringar på ett ställe. Med ett intuitivt gränssnitt och kraftfulla funktioner gör Sure det enkelt att förstå din finansiella situation och fatta välgrundade beslut om dina pengar.\n\n**Huvudfunktioner:**\n- **Ugiftsspårning**: Logga och kategorisera enkelt dina utgifter\n- **Inkomsthanterning**: Spåra flera inkomstkällor\n- **Investeringsövervakning**: Håll koll på dina investeringar och deras prestation\n- **Budgetplanering**: Skapa och underhåll budgetar för att kontrollera dina utgifter\n- **Finansiella Rapporter**: Generera detaljerade rapporter för att förstå dina finansiella vanor\n- **AI-drivna Insikter**: Få personlig finansiell rådgivning med AI-teknik\n\n**Användningsområden:**\n- Personlig budgethantering\n- Utgiftsspårning och kategorisering\n- Övervakning av investeringsportfölj\n- Målsättning och spårning av finansiella mål\n- Kassaflödesanalys\n\n**Läs Mer:**\n- [Sure GitHub Repository](https://github.com/we-promise/sure)"
  el: "Το Sure είναι μια εφαρμογή διαχείρισης προσωπικών οικονομικών σχεδιασμένη για να σας βοηθήσει να παρακολουθείτε τα έξοδα, τα έσοδα και τις επενδύσεις σας σε ένα μέρος. Με ένα διαισθητικό περιβάλλον και ισχυρές λειτουργίες, το Sure καθιστά εύκολη την κατανόηση της οικονομικής σας κατάστασης και τη λήψη ενημερωμένων αποφάσεων για τα χρήματά σας.\n\n**Βασικά Χαρακτηριστικά:**\n- **Παρακολούθηση Εξόδων**: Καταγράψτε και κατηγοριοποιήστε εύκολα τα έξοδά σας\n- **Διαχείριση Εσόδων**: Παρακολουθήστε πολλαπλές πηγές εσόδων\n- **Παρακολούθηση Επενδύσεων**: Κρατήστε ματιά στις επενδύσεις σας και την απόδοσή τους\n- **Σχεδιασμός Προϋπολογισμού**: Δημιουργήστε και διατηρήστε προϋπολογισμούς για να ελέγχετε τα έξοδά σας\n- **Οικονομικές Αναφορές**: Δημιουργήστε λεπτομερείς αναφορές για να κατανοήσετε τις οικονομικές σας συνήθειες\n- **Ευφυείς Συμβουλές AI**: Λάβετε εξατομικευμένες οικονομικές συμβουλές χρησιμοποιώντας τεχνολογία AI\n\n**Περιπτώσεις Χρήσης:**\n- Διαχείριση προσωπικού προϋπολογισμού\n- Παρακολούθηση και κατηγοριοποίηση εξόδων\n- Παρακολούθηση χαρτοφυλακίου επενδύσεων\n- Ορισμός και παρακολούθηση οικονομικών στόχων\n- Ανάλυση ταμειακών ροών\n\n**Μάθετε Περισσότερα:**\n- [Αποθετήριο GitHub Sure](https://github.com/we-promise/sure)"
  hr: "Sure je aplikacija za upravljanje osobnim financijama dizajnirana da vam pomogne pratiti troškove, prihode i investicije na jednom mjestu. S intuitivnim sučeljem i moćnim značajkama, Sure olakšava razumijevanje vaše financijske situacije i donošenje informiranih odluka o novcu.\n\n**Ključne Značajke:**\n- **Praćenje Troškova**: Lako evidentirajte i kategorizirajte svoje troškove\n- **Upravljanje Prihodima**: Pratite više izvora prihoda\n- **Praćenje Investicija**: Pratite svoje investicije i njihovu učinkovitost\n- **Planiranje Proračuna**: Stvarajte i održavajte proračune za kontrolu troškova\n- **Financijska Izvješća**: Generirajte detaljna izvješća za razumijevanje financijskih navika\n- **AI-Upravljani Uvidi**: Dobijte personalizirane financijske savjete korištenjem AI tehnologije\n\n**Slučajevi Korištenja:**\n- Upravljanje osobnim proračunom\n- Praćenje i kategorizacija troškova\n- Praćenje investicijskog portfelja\n- Postavljanje i praćenje financijskih ciljeva\n- Analiza novčanog tijeka\n\n**Saznajte Više:**\n- [Sure GitHub Repozitorij](https://github.com/we-promise/sure)"
  pt: "Sure é um aplicativo de gerenciamento de finanças pessoais projetado para ajudá-lo a rastrear suas despesas, receitas e investimentos em um só lugar. Com uma interface intuitiva e recursos poderosos, o Sure facilita a compreensão da sua situação financeira e a tomada de decisões informadas sobre seu dinheiro.\n\n**Principais Recursos:**\n- **Rastreamento de Despesas**: Registre e categorize facilmente suas despesas\n- **Gerenciamento de Receitas**: Acompanhe várias fontes de receita\n- **Monitoramento de Investimentos**: Fique de olho em seus investimentos e seu desempenho\n- **Planejamento Orçamentário**: Crie e mantenha orçamentos para controlar seus gastos\n- **Relatórios Financeiros**: Gere relatórios detalhados para entender seus hábitos financeiros\n- **Insights com IA**: Obtenha conselhos financeiros personalizados usando tecnologia de IA\n\n**Casos de Uso:**\n- Gerenciamento de orçamento pessoal\n- Rastreamento e categorização de despesas\n- Monitoramento de portfólio de investimentos\n- Definição e acompanhamento de metas financeiras\n- Análise de fluxo de caixa\n\n**Saiba Mais:**\n- [Repositório GitHub Sure]("
  ru: "Sure — это приложение для управления личными финансами, разработанное, чтобы помочь вам отслеживать расходы, доходы и инвестиции в одном месте. С интуитивно понятным интерфейсом и мощными функциями Sure облегчает понимание вашего финансового положения и принятие обоснованных решений о ваших деньгах.\n\n**Ключевые Особенности:**\n- **Отслеживание Расходов**: Легко записывайте и категоризируйте свои расходы\n- **Управление Доходами**: Отслеживайте несколько источников дохода\n- **Мониторинг Инвестиций**: Следите за своими инвестициями и их производительностью\n- **Планирование Бюджета**: Создавайте и поддерживайте бюджеты для контроля расходов\n- **Финансовые Отчеты**: Генерируйте подробные отчеты для понимания ваших финансовых привычек\n- **ИИ-рекомендации**: Получайте персонализированные финансовые советы с помощью ИИ-технологии\n\n**Случаи Использования:**\n- Управление личным бюджетом\n- Отслеживание и категоризация расходов\n- Мониторинг инвестиционного портфеля\n- Постановка и отслеживание финансовых целей\n- Анализ движения денежных средств\n\n**Узнать Больше:**\n- [GitHub Репозиторий Sure](https://github.com/we-promise/sure)"
  tr: "Sure, harcamalarınızı, gelirlerinizi ve yatırımlarınızı tek bir yerde takip etmenize yardımcı olmak için tasarlanmış kişisel finans yönetimi uygulamasıdır. Sezgisel arayüzü ve güçlü özellikleriyle Sure, finansal durumunuzu anlamanızı ve paranız hakkında bilinçli kararlar almanızı kolaylaştırır.\n\n**Ana Özellikler:**\n- **Harcama Takibi**: Harcamalarınızı kolayca kaydedin ve kategorize edin\n- **Gelir Yönetimi**: Birden fazla gelir kaynağını takip edin\n- **Yatırım İzleme**: Yatırımlarınızı ve performanslarını izleyin\n- **Bütçe Planlama**: Harcamalarınızı kontrol etmek için bütçeler oluşturun ve sürdürün\n- **Finansal Raporlar**: Finansal alışkanlıklarınızı anlamak için detaylı raporlar oluşturun\n- **AI Destekli İçgörüler**: AI teknolojisini kullanarak kişiselleştirilmiş finansal tavsiyeler alın\n\n**Kullanım Alanları:**\n- Kişisel bütçe yönetimi\n- Harcama takibi ve kategorizasyonu\n- Yatırım portföyü izleme\n- Finansal hedef belirleme ve takip\n- Nakit akışı analizi\n\n**Daha Fazla Bilgi:**\n- [Sure GitHub Deposu](https://github.com/we-promise/sure)"
  uk: "Sure — застосунок для керування особистими фінансами, який допомагає відстежувати витрати, доходи та інвестиції в одному місці. Інтуїтивний інтерфейс і потужні функції дають змогу легко зрозуміти свій фінансовий стан і ухвалювати зважені рішення щодо грошей.\n\n**Основні можливості:**\n- **Облік витрат**: легко записуйте витрати й розподіляйте їх за категоріями\n- **Керування доходами**: відстежуйте кілька джерел доходу\n- **Моніторинг інвестицій**: стежте за інвестиціями та їхньою дохідністю\n- **Планування бюджету**: створюйте й ведіть бюджети, щоб контролювати витрати\n- **Фінансові звіти**: формуйте докладні звіти, щоб краще розуміти свої фінансові звички\n- **Поради на основі ШІ**: отримуйте персоналізовані фінансові поради завдяки ШІ\n\n**Сценарії використання:**\n- Керування особистим бюджетом\n- Облік і категоризація витрат\n- Моніторинг інвестиційного портфеля\n- Постановка та відстеження фінансових цілей\n- Аналіз грошових потоків\n\n**Докладніше:**\n- [Репозиторій Sure на GitHub](https://github.com/we-promise/sure)"
