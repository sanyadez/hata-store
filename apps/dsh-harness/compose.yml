# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  dsh:
    command: null
    entrypoint: null
    image: ghcr.io/smanx/deepseek-harness:0.2.0-rc.2
    networks:
      - default
    ports:
      - "${WEB_PORT:-3080}:3080"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /root/.dsh
        bind:
          create_host_path: true
