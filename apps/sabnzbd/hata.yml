  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
  - 6.webp
  - 7.webp
web:
  service: sabnzbd
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8282
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Downloads
      uk: Завантаження
    hint:
      en: Inside the app it is /incomplete-downloads
      uk: У застосунку вона — /incomplete-downloads
