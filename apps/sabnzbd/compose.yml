# Apache-2.0, changed for Hata Store: see NOTICE
services:
  sabnzbd:
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: "${TZ:-UTC}"
    image: linuxserver/sabnzbd:5.1.3
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-8282}:8080"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /incomplete-downloads
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
