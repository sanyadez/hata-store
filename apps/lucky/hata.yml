# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Lucky
tagline:
  en: Powerful networking tool
  zh: 家用软硬路由公网利器
  uk: Потужний мережевий інструмент
description:
  en: "A powerful tool for port forwarding, reverse proxy, dynamic DNS, wake-on-LAN, IPv4 NAT traversal, webdav services, task scheduling, and automatic certificate management."
  zh: 一款功能强大的端口转发、反向代理、动态域名、网络唤醒、IPv4内网穿透、webdav服务、计划任务和自动证书管理工具。
  uk: "Потужний інструмент для перенаправлення портів, зворотного проксі, динамічного DNS, wake-on-LAN, проходження IPv4 NAT, служб webdav, планування завдань і автоматичного керування сертифікатами."
notes:
  en: "Default login account `666`, Default login password `666`,tips:`Before each update, remember to back up the configuration`."
  zh: "默认登录账号 `666`，默认登录密码 `666`,提示：`每次更新前，请记得备份好配置`"
  uk: "Типовий логін `666`, типовий пароль `666`. Порада: `перед кожним оновленням не забудьте зробити резервну копію конфігурації`."
