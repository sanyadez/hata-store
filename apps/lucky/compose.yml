# Apache-2.0, changed for Hata Store: see NOTICE
services:
  lucky:
    deploy:
      resources:
        reservations:
          memory: 64M
    image: gdy666/lucky:2.27.2
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /goodluck
    environment:
      TZ: "${TZ:-UTC}"
    network_mode: host
    privileged: false
