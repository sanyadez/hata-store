# Apache-2.0, changed for Hata Store: see NOTICE
services:
  lucky:
    deploy:
      resources:
        reservations:
          memory: 64M
    image: gdy666/lucky:2.27.2
    restart: unless-stopped
    # The image's own login is public: an empty folder starts with the password made for this install.
    entrypoint:
      - /bin/sh
      - -c
      - |
        base=/app/conf/lucky_base.lkcf
        seed=/app/conf/.hata-seed
        rm -rf "$$seed"
        if [ -n "$$LUCKY_PASSWORD" ] && [ ! -e "$$base" ]; then
          # Made aside and moved in whole: a start cut short leaves no file with the public login.
          /app/lucky -setconf -key AdminAccount -value admin -cd "$$seed" &&
            /app/lucky -setconf -key AdminPassword -value "$$LUCKY_PASSWORD" -cd "$$seed" &&
            mv "$$seed/lucky_base.lkcf" "$$base" ||
            exit 1
          rm -rf "$$seed"
        fi
        exec /app/start.sh
    volumes:
      - type: bind
        source: "${APP_DATA:-.}"
        target: /app/conf
    environment:
      TZ: "${TZ:-UTC}"
      LUCKY_PASSWORD: "${LUCKY_PASSWORD:-}"
    network_mode: host
    privileged: false
