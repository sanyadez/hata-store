# Apache-2.0, changed for Hata Store: see NOTICE
title: handbrake
tagline:
  en: Liberate your videos and unleash infinite possibilities.
  uk: Звільніть свої відео й відкрийте безмежні можливості.
description:
  en: "Handbrake is a Docker-based application for video transcoding and compression, offering powerful and flexible multimedia processing across multiple platforms."
  uk: Handbrake — застосунок у Docker для перекодування та стиснення відео. Він пропонує потужну й гнучку обробку мультимедіа на різних платформах.
notes:
  en: "## Handbrake\n#### Professional video transcoding."
  uk: "## Handbrake\n#### Професійне перекодування відео."
category: media
developer: self
website: https://handbrake.fr
source: https://github.com/jlesage/docker-handbrake
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
web:
  service: handbrake
  port: 5800
settings:
  - name: WEB_PORT
    type: port
    default: 5800
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: DATA_DIR
    type: folder
    default: "${DATA_ROOT}"
    label:
      en: Data folder
      uk: Тека даних
  - name: MEDIA_DIR
    type: folder
    default: "${DATA_ROOT}/Media"
    label:
      en: Media
      uk: Медіа
    hint:
      en: Inside the app it is /output
      uk: У застосунку вона — /output
permissions:
  privileged:
    en: Its authors run it with full access to the server
    uk: Автори запускають його з повним доступом до сервера
