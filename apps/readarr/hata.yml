web:
  service: readarr
  port: 8787
settings:
  - name: WEB_PORT
    type: port
    default: 8787
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: BOOKS_DIR
    type: folder
    default: "${DATA_ROOT}/Media/Books"
    label:
      en: Readarr books directory
      uk: Тека книг Readarr
    hint:
      en: Inside the app it is /books
      uk: У застосунку вона — /books
  - name: DOWNLOADS_DIR
    type: folder
    default: "${DATA_ROOT}/Downloads"
    label:
      en: Readarr downloads directory
      uk: Тека завантажень Readarr
    hint:
      en: Inside the app it is /downloads
      uk: У застосунку вона — /downloads
