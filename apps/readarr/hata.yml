# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Readarr
tagline:
  en: Ebook and audiobook collection manager for Usenet and BitTorrent users.
  zh: 用于Usenet和BitTorrent用户的电子书和有声书收藏管理器。
  ar: مدير مجموعة كتب إلكترونية وكتب صوتية لمستخدمي Usenet و BitTorrent.
  de: E-Book- und Hörbuch-Sammlungsmanager für Usenet- und BitTorrent-Nutzer.
  es: Administrador de colecciones de libros electrónicos y audiolibros para usuarios de Usenet y BitTorrent.
  fr: "Gestionnaire de collection de livres électroniques et d'audiolivres pour les utilisateurs de Usenet et de BitTorrent."
  hu: Usenet és BitTorrent felhasználók számára elektronikus könyv- és hangoskönyvgyűjteménykezelő.
  it: Gestore di collezioni di libri elettronici e audiolibri per utenti Usenet e BitTorrent.
  ru: Менеджер коллекций электронных книг и аудиокниг для пользователей Usenet и BitTorrent.
  pl: Menadżer kolekcji e-booków i audiobooków dla użytkowników Usenet i BitTorrent.
  pt: Gerenciador de coleções de livros eletrônicos e audiolivros para usuários de Usenet e BitTorrent.
  sv: E-bokssamling för användare av Usenet och BitTorrent.
  uk: Менеджер колекції е-книг і аудіокниг для користувачів Usenet і BitTorrent.
description:
  en: "Readarr is a ebook collection manager for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new books from your favorite authors and will interface with clients and indexers to grab, sort, and rename them."
  zh: Readarr是一个用于Usenet和BitTorrent用户的电子书收藏管理器。它可以监视多个RSS源以获取您最喜欢的作者的新书，并且可以与客户端和索引器进行交互以获取，排序和重命名它们。
  ar: Readarr هو مدير مجموعة كتب إلكترونية لمستخدمي Usenet و BitTorrent. يمكنه مراقبة مزودي RSS متعددة للكتب الجديدة من مؤلفيك المفضلين وسيتم تفاعله مع العملاء والمؤشرات للتقاط وفرز وإعادة تسمية.
  de: "Readarr ist ein E-Book-Sammlungsmanager für Usenet- und BitTorrent-Nutzer. Es kann mehrere RSS-Feeds überwachen, um neue Bücher von Ihren Lieblingsautoren zu erhalten und wird mit Clients und Indexern interagieren, um sie zu erhalten, zu sortieren und umzubenennen."
  es: "Readarr es un administrador de colecciones de libros electrónicos para usuarios de Usenet y BitTorrent. Puede monitorear múltiples fuentes RSS para obtener nuevos libros de sus autores favoritos y se comunicará con clientes e indexadores para obtener, clasificar y renombrarlos."
  fr: "Readarr est un gestionnaire de collection de livres électroniques pour les utilisateurs de Usenet et de BitTorrent. Il peut surveiller plusieurs flux RSS pour obtenir de nouveaux livres de vos auteurs préférés et interagira avec des clients et des indexeurs pour les obtenir, les trier et les renommer."
  hu: "A Readarr egy elektronikus könyvgyűjteménykezelő a Usenet és a BitTorrent felhasználók számára. Követni tudja a kedvenc szerzői könyvek új könyveinek több RSS-hírcsatornáját, és a kliensekkel és indexelőkkel kommunikálhat, hogy beszerezze, rendezze és átnevezze őket."
  it: "Readarr è un gestore di collezioni di libri elettronici per utenti Usenet e BitTorrent. Può monitorare più feed RSS per ottenere nuovi libri dai tuoi autori preferiti e interagirà con client e indexer per ottenerli, ordinarli e rinominarli."
  ru: "Readarr - это менеджер коллекций электронных книг для пользователей Usenet и BitTorrent. Он может отслеживать несколько RSS-каналов для получения новых книг от ваших любимых авторов и будет взаимодействовать с клиентами и индексаторами для получения, сортировки и переименования их."
  pl: "Readarr to menedżer kolekcji e-booków dla użytkowników Usenet i BitTorrent. Może monitorować wiele kanałów RSS do uzyskania nowych książek od ulubionych autorów i będzie komunikować się z klientami i indeksatorami, aby uzyskać, posortować i zmienić nazwę."
  pt: "Readarr é um gerenciador de coleções de livros eletrônicos para usuários de Usenet e BitTorrent. Ele pode monitorar vários feeds RSS para obter novos livros de seus autores favoritos e interagir com clientes e indexadores para obtê-los, classificá-los e renomeá-los."
  sv: "Readarr är en e-bokssamling för användare av Usenet och BitTorrent. Den kan övervaka flera RSS-flöden för nya böcker från dina favoritförfattare och kommer att interagera med klienter och index för att hämta, sortera och döpa om dem."
  uk: "Readarr — менеджер колекції е-книг для користувачів Usenet і BitTorrent. Він може стежити за кількома RSS-стрічками, шукаючи нові книги ваших улюблених авторів, і взаємодіє з клієнтами та індексаторами, щоб знаходити, сортувати й перейменовувати їх."
category: media
developer: Readarr Team
