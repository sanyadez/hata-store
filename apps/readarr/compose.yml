# Apache-2.0, changed for Hata Store: see NOTICE
services:
  readarr:
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    image: linuxserver/readarr:0.3.10-develop
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-8787}:8787"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
      - type: bind
        source: "${BOOKS_DIR:-./Media/Books}"
        target: /books
      - type: bind
        source: "${DOWNLOADS_DIR:-./Downloads}"
        target: /downloads
