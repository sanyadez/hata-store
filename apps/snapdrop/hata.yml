# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: snapdrop
tagline:
  en: Cross-platform file sharing made easy.
  zh: 轻松实现跨平台文件共享。
  ar: تبادل الملفات عبر المنصات بكل سهولة.
  de: Einfacher plattformübergreifender Dateiaustausch.
  es: Compartir archivos entre plataformas nunca fue tan fácil.
  fr: Partage de fichiers multiplateforme simplifié.
  hu: Egyszerűsített többplatformos fájlmegosztás.
  it: Condivisione di file multi-piattaforma resa facile.
  ru: Простой обмен файлами между платформами.
  pl: Proste udostępnianie plików międzyplatformowych.
  pt: Compartilhamento de arquivos entre plataformas feito fácil.
  sv: Enkel filöverföring mellan olika plattformar.
  uk: Простий обмін файлами між різними платформами.
description:
  en: Snapdrop is a Progressive Web App (PWA) that allows you to transfer files between devices in the same network without having to install anything.
  zh: Snapdrop是一个渐进式Web应用程序（PWA），允许您在同一网络中的设备之间传输文件，而无需安装任何内容。
  ar: Snapdrop هو تطبيق ويب تدريجي (PWA) يتيح لك نقل الملفات بين الأجهزة في نفس الشبكة دون الحاجة إلى تثبيت أي شيء.
  de: "Snapdrop ist eine Progressive Web App (PWA), mit der Sie Dateien zwischen Geräten im selben Netzwerk übertragen können, ohne etwas installieren zu müssen."
  es: Snapdrop es una aplicación web progresiva (PWA) que le permite transferir archivos entre dispositivos en la misma red sin tener que instalar nada.
  fr: Snapdrop est une application Web progressive (PWA) qui vous permet de transférer des fichiers entre des appareils sur le même réseau sans avoir à installer quoi que ce soit.
  hu: "A Snapdrop egy progresszív webalkalmazás (PWA), amely lehetővé teszi a fájlok átvitelét a hálózaton belüli eszközök között anélkül, hogy telepítenie kellene bármit is."
  it: "Snapdrop è un'app Web progressiva (PWA) che consente di trasferire file tra dispositivi nella stessa rete senza dover installare nulla."
  ru: "Snapdrop - это прогрессивное веб-приложение (PWA), которое позволяет передавать файлы между устройствами в одной сети без необходимости устанавливать что-либо."
  pl: "Snapdrop to progresywna aplikacja internetowa (PWA), która umożliwia przesyłanie plików między urządzeniami w tej samej sieci bez konieczności instalowania czegokolwiek."
  pt: Snapdrop é um aplicativo da Web progressivo (PWA) que permite transferir arquivos entre dispositivos na mesma rede sem precisar instalar nada.
  sv: Snapdrop är en progressiv webbapp (PWA) som låter dig överföra filer mellan enheter i samma nätverk utan att behöva installera något.
  uk: "Snapdrop — прогресивний вебзастосунок (PWA), який дає змогу передавати файли між пристроями в одній мережі, нічого не встановлюючи."
category: productivity
developer: self
website: https://snapdrop.net
source: https://github.com/RobinLinus/snapdrop
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
web:
  service: snapdrop
  port: 80
settings:
  - name: PORT_443
    type: port
    default: 443
    label:
      en: Port 443
      uk: Порт 443
    advanced: true
  - name: WEB_PORT
    type: port
    default: 89
    label:
      en: Web port
      uk: Порт вебінтерфейсу
