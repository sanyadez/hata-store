title: Node-RED
tagline:
  en: Low-code programming for event-driven applications
  uk: Low-code програмування для подієво-орієнтованих застосунків
description:
  en: "Node-RED is a flow-based low-code development platform that enables creating automation tasks and applications by connecting various nodes. A browser-based editor, simple to use, makes it ideal for users in home automation, industrial control, or other fields to quickly build data processing flows.\n\nCore features include a low-code flow editor and robust data handling. Built on Node.js with an event-driven, non-blocking model, the platform supports real-time data collection, transformation, and visualization. A palette with over 5000 nodes allows users to construct flows via drag-and-drop. A rich text editor enables creating JavaScript functions for enhanced customization.\n\nIt stores flows in JSON format, facilitating easy import and export for sharing. A built-in library allows saving useful functions, templates, or flows for reuse, and an online flow library supports sharing top flows globally. With ease of use and efficiency at the core, the platform delivers a modern solution for diverse automation needs.\n\n**Key Features:**\n- Browser-based low-code flow editor with drag-and-drop node connections\n- Real-time data collection, transformation, and visualization\n- Event-driven, non-blocking model with Node.js\n- Palette with over 5000 nodes for extended functionality\n- Rich text editor for creating JavaScript functions\n- JSON-based flow storage for easy sharing\n- Built-in library for saving functions, templates, and flows\n- Online flow library for sharing top flows\n\n**Learn More:**\n- [Node-RED Official Website](https://nodered.org/)\n- [Node-RED GitHub](https://github.com/node-red/node-red)"
  uk: "Node-RED — low-code платформа розробки на основі потоків, що дає змогу створювати завдання автоматизації та застосунки, з'єднуючи різні вузли. Простий редактор у браузері робить її зручною для домашньої автоматизації, промислового керування та інших сфер, де потрібно швидко будувати потоки обробки даних.\n\nОсновні можливості — low-code редактор потоків і надійна обробка даних. Платформа працює на Node.js за подієвою неблокувальною моделлю та підтримує збір, перетворення й візуалізацію даних у реальному часі. Палітра з понад 5000 вузлів дозволяє будувати потоки перетягуванням. Розширений текстовий редактор допомагає писати функції на JavaScript для гнучкішого налаштування.\n\nПотоки зберігаються у форматі JSON, тож їх легко імпортувати й експортувати, щоб ділитися ними. Вбудована бібліотека дає змогу зберігати корисні функції, шаблони чи потоки для повторного використання, а онлайн-бібліотека потоків — ділитися найкращими потоками з усім світом. Завдяки простоті та ефективності платформа пропонує сучасне рішення для різноманітних потреб автоматизації.\n\n**Основні можливості:**\n- Low-code редактор потоків у браузері зі з'єднанням вузлів перетягуванням\n- Збір, перетворення й візуалізація даних у реальному часі\n- Подієва неблокувальна модель на Node.js\n- Палітра з понад 5000 вузлів для розширення можливостей\n- Розширений текстовий редактор для створення функцій на JavaScript\n- Зберігання потоків у JSON для зручного обміну\n- Вбудована бібліотека для збереження функцій, шаблонів і потоків\n- Онлайн-бібліотека потоків для обміну найкращими потоками\n\n**Дізнатися більше:**\n- [Офіційний сайт Node-RED](https://nodered.org/)\n- [Node-RED на GitHub](https://github.com/node-red/node-red)"
