# Apache-2.0, changed for Hata Store: see NOTICE
services:
  node-red:
    image: nodered/node-red:4.1.17-22
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: host
    ports:
      - "${WEB_PORT:-1880}:1880"
    restart: always
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /data
