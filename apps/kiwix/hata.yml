title: Kiwix
tagline:
  en: Wikipedia and other sites without the internet, from your own server
  uk: Вікіпедія та інші сайти без інтернету, з вашого сервера
description:
  en: >
    Serves copies of websites packed into .zim files: the whole Wikipedia, Wiktionary, Stack
    Exchange, the books of Project Gutenberg, TED talks and more. Download the files you want from
    the Kiwix library, and every device at home reads them in a browser, even when the internet is
    down.
  uk: >
    Віддає копії сайтів, запаковані у файли .zim: усю Вікіпедію, Вікісловник, Stack Exchange,
    книжки проєкту «Гутенберг», лекції TED тощо. Завантажте потрібні файли з бібліотеки Kiwix, і
    кожен пристрій удома читатиме їх у браузері, навіть коли інтернету немає.
notes:
  en: >
    Put .zim files into the chosen folder: Wikipedia and other sites to download are on
    library.kiwix.org. A file put there is served within a minute.
  uk: >
    Покладіть у вибрану теку файли .zim: Вікіпедію та інші сайти можна завантажити з
    library.kiwix.org. Покладений файл з'явиться протягом хвилини.
category: media
developer: Kiwix
website: https://kiwix.org
source: https://github.com/kiwix/kiwix-tools
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
web:
  service: kiwix-serve
  port: 8080
settings:
  - name: WEB_PORT
    type: port
    default: 8080
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ZIM_DIR
    type: folder
    default: ${DATA_ROOT}/Media/Kiwix
    required: true
    label: { en: Folder with .zim files, uk: Тека з файлами .zim }
    hint:
      en: The files are downloaded from library.kiwix.org
      uk: Файли завантажують із library.kiwix.org
