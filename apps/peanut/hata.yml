description:
  en: "PeaNUT is a web-based UPS monitoring system specifically designed for monitoring Uninterruptible Power Supplies (UPS). It provides a user-friendly interface for monitoring UPS status, battery life, and power outage notifications to ensure your systems are always protected.\n\n**Key Features:**\n- Real-time UPS status monitoring and control\n- Battery life and charge level monitoring\n- Automatic power outage notifications via email/webhook\n- Historical data logging and reporting\n- Support for various UPS manufacturers and models\n- Mobile-friendly responsive web interface for remote access\n- Configurable warning thresholds and alerts\n- Docker-based deployment for easy installation\n\n**Learn More:**\n- [PeaNUT GitHub Repository](https://github.com/brandawg93/peanut)"
  de: "PeaNUT ist ein webbasiertes UPS-Überwachungssystem, das speziell für die Überwachung von Unterbrechungsfreien Stromversorgungen (USV) entwickelt wurde. Es bietet eine benutzerfreundliche Oberfläche zur Überwachung des UPS-Status, der Batterielebensdauer und zur Benachrichtigung bei Stromausfällen, um sicherzustellen, dass Ihre Systeme immer geschützt sind.\n\n**Hauptfunktionen:**\n- Echtzeit-UPS-Statusüberwachung und -steuerung\n- Batterielebensdauer- und Ladezustandsüberwachung\n- Automatische Stromausfallbenachrichtigungen per E-Mail/Webhook\n- Historische Datenprotokollierung und Berichterstattung\n- Unterstützung für verschiedene UPS-Hersteller und Modelle\n- Mobiles responsives Web-Interface für Fernzugriff\n- Konfigurierbare Warnschwellen und Alarme\n- Docker-basierte Bereitstellung für einfache Installation\n\n**Mehr Erfahren:**\n- [PeaNUT GitHub-Repository](https://github.com/brandawg93/peanut)"
  el: "Το PeaNUT είναι ένα σύστημα παρακολούθησης UPS βασισμένο στο web, σχεδιασμένο ειδικά για την παρακολούθηση των Αδιάλειπτων Πηγών Ενέργειας (UPS). Παρέχει ένα φιλικό προς τον χρήστη περιβάλλον για την παρακολούθηση της κατάστασης UPS, της διάρκειας ζωής της μπαταρίας και την αποστολή ειδοποιήσεων κατά τη διακοπή ρεύματος, διασφαλίζοντας ότι τα συστήματά σας είναι πάντα προστατευμένα.\n\n**Κύρια Χαρακτηριστικά:**\n- Παρακολούθηση και έλεγχος κατάστασης UPS σε πραγματικό χρόνο\n- Παρακολούθηση διάρκειας ζωής μπαταρίας και κατάστασης φόρτισης\n- Αυτόματες ειδοποιήσεις διακοπής ρεύματος μέσω email/webhook\n- Καταγραφή και αναφορές ιστορικών δεδομένων\n- Υποστήριξη για διάφορους κατασκευαστές και μοντέλα UPS\n- Φιλικό προς κινητά responsive web περιβάλλον για απομακρυσμένη πρόσβαση\n- Ρυθμιζόμενα όρια προειδοποίησης και συναγερμοί\n- Παροχή βάσει Docker για εύκολη εγκατάσταση\n\n**Μάθετε Περισσότερα:**\n- [PeaNUT GitHub Αποθετήριο](https://github.com/brandawg93/peanut)"
  fr: "PeaNUT est un système de surveillance UPS basé sur le web, spécifiquement conçu pour surveiller les Alimentations Sans Interruption (ASI/UPS). Il fournit une interface conviviale pour surveiller le statut UPS, la durée de vie de la batterie et les notifications de coupure de courant pour garantir que vos systèmes sont toujours protégés.\n\n**Fonctionnalités Clés:**\n- Surveillance et contrôle du statut UPS en temps réel\n- Surveillance de la durée de vie de la batterie et du niveau de charge\n- Notifications automatiques de coupure de courant via email/webhook\n- Journalisation des données historiques et rapports\n- Support pour divers fabricants et modèles UPS\n- Interface web responsive adaptée aux mobiles pour accès à distance\n- Seuils d'avertissement et alertes configurables\n- Déploiement basé sur Docker pour une installation facile\n\n**En Savoir Plus:**\n- [Dépôt GitHub PeaNUT](https://github.com/brandawg93/peanut)"
  hr: "PeaNUT je web-based UPS nadzorni sustav specifično dizajniran za praćenje Neprekidnih Izvora Napajanja (UPS). Pruža korisnički pristupno sučelje za praćenje UPS statusa, trajanja baterije i obavijesti o prekidu napajanja kako bi se osiguralo da su vaši sustavi uvijek zaštićeni.\n\n**Ključne Značajke:**\n- Praćenje i kontrola UPS statusa u stvarnom vremenu\n- Praćenje trajanja baterije i razine napunjenosti\n- Automatske obavijesti o prekidu napajanja putem email/webhook\n- Pohrana povijesnih podataka i izvještavanje\n- Podrška za različite proizvođače i modele UPS\n- Mobilno prilagođeno responsivno web sučelje za daljinski pristup\n- Konfigurabilni pragovi upozorenja i alarmi\n- Implementacija temeljena na Dockeru za laku instalaciju\n\n**Saznajte Više:**\n- [PeaNUT GitHub Repozitorij](https://github.com/brandawg93/peanut)"
  it: "PeaNUT è un sistema di monitoraggio UPS basato sul web, specificamente progettato per monitorare i Gruppi di Continuità (UPS). Fornisce un'interfaccia user-friendly per monitorare lo stato UPS, la durata della batteria e le notifiche di interruzione di corrente per garantire che i sistemi siano sempre protetti.\n\n**Funzionalità Principali:**\n- Monitoraggio e controllo dello stato UPS in tempo reale\n- Monitoraggio della durata della batteria e del livello di carica\n- Notifiche automatiche di interruzione di corrente via email/webhook\n- Registrazione dati storici e reportistica\n- Supporto per vari produttori e modelli UPS\n- Interfaccia web responsive adatta ai dispositivi mobili per accesso remoto\n- Soglie di avviso e allarmi configurabili\n- Distribuzione basata su Docker per facile installazione\n\n**Scopri di Più:**\n- [Repository GitHub PeaNUT](https://github.com/brandawg93/peanut)"
  ja: "PeaNUTは、無停電電源装置（UPS）の監視専用に設計されたWebベースのUPS監視システムです。UPSステータス、バッテリー寿命、停電通知を監視するユーザーフレンドリーなインターフェースを提供し、システムが常に保護されていることを保証します。\n\n**主な機能：**\n- リアルタイムUPSステータス監視と制御\n- バッテリー寿命と充電レベルの監視\n- Eメール/Webhookによる自動停電通知\n- 履歴データの記録とレポート作成\n- 様々なUPSメーカーとモデルのサポート\n- リモートアクセス用のモバイルフレンドリーなレスポンシブWebインターフェース\n- 設定可能な警告しきい値とアラート\n- 簡単なインストールのためのDockerベースのデプロイメント\n\n**詳細情報：**\n- [PeaNUT GitHubリポジトリ](https://github.com/brandawg93/peanut)"
  ko: "PeaNUT은 무정전 전원 공급 장치(UPS) 모니터링용으로 특별히 설계된 웹 기반 UPS 모니터링 시스템입니다. UPS 상태, 배터리 수명 및 정전 알림을 모니터링하는 사용자 친화적 인터페이스를 제공하여 시스템이 항상 보호되도록 합니다.\n\n**주요 기능:**\n- 실시간 UPS 상태 모니터링 및 제어\n- 배터리 수명 및 충전 수준 모니터링\n- 이메일/Webhook을 통한 자동 정전 알림\n- 과거 데이터 기록 및 보고\n- 다양한 UPS 제조업체 및 모델 지원\n- 원격 액세스용 모바일 친화적 반응형 웹 인터페이스\n- 구성 가능한 경고 임계값 및 알림\n- 쉬운 설치를 위한 Docker 기반 배포\n\n**자세히 알아보기:**\n- [PeaNUT GitHub 저장소](https://github.com/brandawg93/peanut)"
  nb: "PeaNUT er et web-basert UPS overvåkingssystem spesifikt designet for overvåking av Unntatt Strømforsyning (UPS). Det gir et brukervennlig grensesnitt for overvåking av UPS-status, batterilevetid og strømbruddsvarsler for å sikre at systemene dine alltid er beskyttet.\n\n**Nøkkelegenskaper:**\n- Sanntids overvåking og kontroll av UPS-status\n- Overvåking av batterilevetid og ladningsnivå\n- Automatiske strømbruddsvarsler via e-post/webhook\n- Historisk datalogging og rapportering\n- Støtte for ulike UPS-produsenter og modeller\n- Mobilvennlig responsivt web-grensesnitt for fjerntilgang\n- Konfigurerbare varslingsterskler og alarmer\n- Docker-basert distribusjon for enkel installasjon\n\n**Lær Mer:**\n- [PeaNUT GitHub Repository](https://github.com/brandawg93/peanut)"
  pt: "PeaNUT é um sistema de monitorização UPS baseado na web, especificamente projetado para monitorizar Fontes de Alimentação Ininterrupta (UPS). Fornece uma interface amigável para monitorizar o estado UPS, a vida útil da bateria e notificações de interrupção de energia para garantir que os seus sistemas estejam sempre protegidos.\n\n**Funcionalidades Principais:**\n- Monitorização e controlo do estado UPS em tempo real\n- Monitorização da vida útil da bateria e nível de carga\n- Notificações automáticas de interrupção de energia via email/webhook\n- Registo de dados históricos e relatórios\n- Suporte para vários fabricantes e modelos UPS\n- Interface web responsiva amigável para acesso remoto\n- Limiares de aviso configuráveis e alertas\n- Implementação baseada em Docker para fácil instalação\n\n**Saiba Mais:**\n- [Repositório GitHub PeaNUT](https://github.com/brandawg93/peanut)"
  ru: "PeaNUT - это веб-система мониторинга ИБП, специально разработанная для мониторинга источников бесперебойного питания (ИБП). Она предоставляет удобный интерфейс для мониторинга статуса ИБП, срока службы батареи и уведомлений об отключении электроэнергии, чтобы обеспечить постоянную защиту ваших систем.\n\n**Ключевые Особенности:**\n- Мониторинг и контроль статуса ИБП в реальном времени\n- Мониторинг срока службы батареи и уровня заряда\n- Автоматические уведомления об отключении электроэнергии через email/webhook\n- Запись исторических данных и создание отчетов\n- Поддержка различных производителей и моделей ИБП\n- Адаптивный веб-интерфейс, дружественный к мобильным устройствам, для удаленного доступа\n- Настраиваемые пороги предупреждений и оповещения\n- Развертывание на основе Docker для простой установки\n\n**Узнать Больше:**\n- [Репозиторий GitHub PeaNUT](https://github.com/brandawg93/peanut)"
  sv: "PeaNUT är ett webbaserat UPS övervakningssystem specifikt designat för övervakning av Oavbrutna Kraftkällor (UPS). Det ger ett användarvänligt gränssnitt för övervakning av UPS-status, batterilivslängd och strömavbrottsnotifieringar för att säkerställa att dina system alltid är skyddade.\n\n**Nyckelfunktioner:**\n- Realtidsövervakning och kontroll av UPS-status\n- Övervakning av batterilivslängd och laddningsnivå\n- Automatiska strömavbrottsnotifieringar via e-post/webhook\n- Historisk dataloggning och rapportering\n- Stöd för olika UPS-tillverkare och modeller\n- Mobilvänligt responsivt webbgränssnitt för fjärråtkomst\n- Konfigurerbara varningsgränser och larm\n- Docker-baserad distribution för enkel installation\n\n**Läs Mer:**\n- [PeaNUT GitHub Repository](https://github.com/brandawg93/peanut)"
  tr: "PeaNUT, Kesintisiz Güç Kaynakları (UPS) izleme için özel olarak tasarlanmış web tabanlı bir UPS izleme sistemidir. Sistemlerinizin her zaman korunduğundan emin olmak için UPS durumunu, pil ömrünü ve güç kesintisi bildirimlerini izlemek için kullanıcı dostu bir arayüz sağlar.\n\n**Temel Özellikler:**\n- Gerçek zamanlı UPS durumu izleme ve kontrol\n- Pil ömrü ve şarj seviyesi izleme\n- E-posta/webhook yoluyla otomatik güç kesintisi bildirimleri\n- Geçmiş veri kaydı ve raporlama\n- Çeşitli UPS üreticileri ve modelleri için destek\n- Uzaktan erişim için mobil dostu duyarlı web arayüzü\n- Yapılandırılabilir uyarı eşiği ve alarmlar\n- Kolay kurulum için Docker tabanlı dağıtım\n\n**Daha Fazla Bilgi:**\n- [PeaNUT GitHub Deposu](https://github.com/brandawg93/peanut)"
  zh: "PeaNUT是一个基于Web的UPS监控系统，专门设计用于监控不间断电源（UPS）。它提供用户友好的界面来监控UPS状态、电池寿命和停电通知，确保您的系统始终受到保护。\n\n**主要功能：**\n- 实时UPS状态监控和控制\n- 电池寿命和充电水平监控\n- 通过邮件/Webhook自动发送停电通知\n- 历史数据记录和报告\n- 支持各种UPS制造商和型号\n- 移动友好的响应式Web界面，支持远程访问\n- 可配置的警告阈值和警报\n- 基于Docker的部署，便于安装\n\n**了解更多：**\n- [PeaNUT GitHub仓库](https://github.com/brandawg93/peanut)"
  uk: "PeaNUT — вебсистема моніторингу, створена спеціально для джерел безперебійного живлення (ДБЖ). Вона має зручний інтерфейс для перегляду стану ДБЖ, ресурсу батареї та сповіщень про відключення електрики, щоб ваші системи завжди були захищені.\n\n**Основні можливості:**\n- Моніторинг і керування станом ДБЖ у реальному часі\n- Стеження за ресурсом і рівнем заряду батареї\n- Автоматичні сповіщення про відключення електрики електронною поштою чи вебхуком\n- Журнал історичних даних і звіти\n- Підтримка ДБЖ різних виробників і моделей\n- Адаптивний вебінтерфейс для мобільних пристроїв і віддаленого доступу\n- Налаштовувані порогові значення й сповіщення\n- Розгортання через Docker для простого встановлення\n\n**Докладніше:**\n- [Репозиторій PeaNUT на GitHub](https://github.com/brandawg93/peanut)"
