# Apache-2.0, changed for Hata Store: see NOTICE
services:
  peanut:
    image: brandawg93/peanut:6.0.0
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
    ports:
      - "${WEB_PORT:-8084}:8080"
    environment:
      WEB_PORT: "${WEB_PORT_2:-8080}"
    deploy:
      resources:
        reservations:
          memory: 256M
    networks:
      default:
        aliases:
          - PeaNUT
