# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: MariaDB
tagline:
  en: MariaDB Server is one of the most popular database servers in the world.
  zh: MariaDB Server 是世界上最受欢迎的数据库服务器之一。它由 MySQL 的原始开发者创建，并保证始终保持开源。
  ar: خادم MariaDB هو واحد من أكثر خوادم قواعد البيانات شهرة في العالم.
  de: MariaDB Server ist einer der beliebtesten Datenbankserver der Welt.
  es: MariaDB Server es uno de los servidores de bases de datos más populares del mundo.
  fr: "MariaDB Server est l'un des serveurs de bases de données les plus populaires au monde."
  hu: A MariaDB Server a világ egyik legnépszerűbb adatbázis-szervere.
  it: MariaDB Server è uno dei server di database più popolari al mondo.
  ru: Сервер MariaDB является одним из самых популярных серверов баз данных в мире.
  pl: Serwer MariaDB jest jednym z najpopularniejszych serwerów baz danych na świecie.
  pt: O MariaDB Server é um dos servidores de banco de dados mais populares do mundo.
  sv: MariaDB Server är en av världens mest populära databasservrar.
  uk: MariaDB Server — один із найпопулярніших серверів баз даних у світі.
description:
  en: "MariaDB Server is one of the most popular open source relational databases. It’s made by the original developers of MySQL and guaranteed to stay open source. It is part of most cloud offerings and the default in most Linux distributions.\n\nIt is built upon the values of performance, stability, and openness, and MariaDB Foundation ensures contributions will be accepted on technical merit. Recent new functionality includes advanced clustering with Galera Cluster 4, compatibility features with Oracle Database and Temporal Data Tables, allowing one to query the data as it stood at any point in the past."
  zh: "MariaDB Server 是最受欢迎的开源关系数据库之一。它由 MySQL 的原始开发者制作，并保证保持开源。它是大多数云提供商的一部分，并且是大多数 Linux 发行版的默认选择。\n\n它以性能、稳定性和开放性为核心价值观，MariaDB 基金会确保技术上合理的贡献将被接受。最近的新功能包括使用 Galera Cluster 4 进行高级集群，与 Oracle Database 和 Temporal Data Tables 兼容的功能，允许查询数据在过去的任何时间点的状态。"
  ar: "خادم MariaDB هو واحد من أكثر قواعد البيانات العلاقية مفتوحة المصدر شهرةً. إنه مصنوع من قِبَل المطوّرين الأصليين لـ MySQL ومضمون البقاء كمصدر مفتوح. إنه جزء من معظم عروض السحابة والافتراضية في معظم توزيعات Linux.\n\nيتم بناؤه على قيم الأداء والاستقرار والانفتاح، وتضمن مؤسسة MariaDB قبول المساهمات بناءً على الجدارة التقنية. يشمل الوظائف الجديدة الأخيرة التجميع المتقدم باستخدام Galera Cluster 4، وميزات التوافق مع Oracle Database وجداول البيانات الزمنية، مما يسمح للمستخدم باستعلام البيانات كما كانت في أي نقطة في الماضي."
  de: "Der MariaDB Server ist eine der beliebtesten Open-Source-Relation-Datenbanken. Er wird von den ursprünglichen Entwicklern von MySQL hergestellt und bleibt garantiert Open Source. Er ist Teil der meisten Cloud-Angebote und die Standardoption in den meisten Linux-Distributionen.\n\nEr basiert auf den Werten von Leistung, Stabilität und Offenheit, und die MariaDB Foundation stellt sicher, dass Beiträge nach technischer Verdienst angenommen werden. Zu den neuesten Funktionen gehören erweitertes Clustering mit Galera Cluster 4, Kompatibilitätsfunktionen mit Oracle Database und temporale Datentabellen, mit denen Daten zu jedem beliebigen Zeitpunkt abgefragt werden können."
  es: "MariaDB Server es una de las bases de datos relacionales de código abierto más populares. Está creado por los desarrolladores originales de MySQL y está garantizado que se mantendrá como código abierto. Es parte de la mayoría de las ofertas en la nube y es la opción predeterminada en la mayoría de las distribuciones de Linux.\n\nEstá construido sobre los valores de rendimiento, estabilidad y apertura, y la Fundación MariaDB garantiza que se aceptarán contribuciones basadas en méritos técnicos. Las últimas funcionalidades incluyen clustering avanzado con Galera Cluster 4, características de compatibilidad con Oracle Database y Tablas de Datos Temporales, lo que permite consultar los datos tal como estaban en cualquier momento en el pasado."
  fr: "MariaDB Server est l'une des bases de données relationnelles open source les plus populaires. Il est développé par les développeurs originaux de MySQL et est garanti d'être open source. Il fait partie de la plupart des offres cloud et est la solution par défaut dans la plupart des distributions Linux.\n\nIl repose sur les valeurs de performance, de stabilité et d'ouverture, et la Fondation MariaDB garantit que les contributions seront acceptées sur des critères techniques. Les fonctionnalités récentes incluent le clustering avancé avec Galera Cluster 4, les fonctionnalités de compatibilité avec Oracle Database et les tables de données temporelles, permettant d'interroger les données telles qu'elles étaient à n'importe quel moment dans le passé."
  hu: "A MariaDB Server a legnépszerűbb nyílt forráskódú relációs adatbázisok közé tartozik. Az eredeti MySQL fejlesztői készítették és garantáltan nyílt forráskódú marad. A legtöbb felhőkínálat és a legtöbb Linux disztribúció alapértelmezett része.\n\nA teljesítmény, a stabilitás és a nyitottság értékeire épül, és a MariaDB Foundation biztosítja, hogy a technikai érdemek alapján elfogadja a hozzájárulásokat. Az új funkciók között szerepel az előrehaladott kluszterezés a Galera Cluster 4-tel, az Oracle Database-kompatibilitási funkciók és a Temporal Data Tables, amelyek lehetővé teszik az adatok lekérdezését a múlt bármely pontján."
  it: "MariaDB Server è uno dei database relazionali open source più popolari. È stato creato dagli sviluppatori originali di MySQL ed è garantito di rimanere open source. Fa parte della maggior parte delle offerte cloud e viene utilizzato come predefinito nella maggior parte delle distribuzioni Linux.\n\nSi basa sui valori di prestazioni, stabilità e apertura e la Fondazione MariaDB assicura che i contributi siano accettati in base ai meriti tecnici. Le nuove funzionalità includono il clustering avanzato con Galera Cluster 4, funzionalità di compatibilità con Oracle Database e tabelle di dati temporali, consentendo di interrogare i dati così come erano in un determinato punto nel passato."
  ru: "MariaDB Server является одной из самых популярных реляционных баз данных с открытым исходным кодом. Он создан разработчиками MySQL и гарантированно останется открытым исходным кодом. Он является частью большинства облачных предложений и является наиболее распространенным в большинстве дистрибутивов Linux.\n\nОн основан на ценностях производительности, стабильности и открытости, и MariaDB Foundation гарантирует, что вклады будут приниматься на основе технического достоинства. Среди последних новых функций: продвинутое кластеризование с помощью Galera Cluster 4, функции совместимости с Oracle Database и временные таблицы данных, позволяющие выполнять запросы к данным на любой момент в прошлом."
  pt: "O MariaDB Server é um dos bancos de dados relacionais de código aberto mais populares. É feito pelos desenvolvedores originais do MySQL e garantido para permanecer como código aberto. Ele faz parte da maioria das ofertas em nuvem e é a opção padrão na maioria das distribuições Linux.\n\nEle é construído com base nos valores de desempenho, estabilidade e abertura, e a Fundação MariaDB garante que contribuições serão aceitas com base no mérito técnico. Recursos recentes incluem clusterização avançada com Galera Cluster 4, recursos de compatibilidade com o Oracle Database e tabelas de dados temporais, permitindo consultar os dados conforme estavam em qualquer ponto do passado."
  sv: "MariaDB Server är en av de mest populära öppna relationella databaserna. Den är skapad av ursprungliga utvecklare av MySQL och garanteras att vara öppen källkod. Den är en del av de flesta molnleverantörer och standardvalet i de flesta Linux-distributioner.\n\nDen är byggd på värdena prestanda, stabilitet och öppenhet, och MariaDB Foundation säkerställer att bidrag accepteras utifrån teknisk förtjänst. Nya funktioner inkluderar avancerad klustrering med Galera Cluster 4, kompatibilitetsfunktioner med Oracle Database och Temporal Data Tables, vilket gör det möjligt att fråga data som det var vid valfri tidpunkt i det förflutna."
  uk: "MariaDB Server — одна з найпопулярніших реляційних баз даних із відкритим кодом. Її створили оригінальні розробники MySQL, і вона гарантовано лишиться з відкритим кодом. Вона є майже в усіх хмарних пропозиціях і за замовчуванням у більшості дистрибутивів Linux.\n\nВона ґрунтується на продуктивності, стабільності та відкритості, а MariaDB Foundation гарантує, що внески приймаються за технічними заслугами. Серед нових можливостей — розвинена кластеризація з Galera Cluster 4, засоби сумісності з Oracle Database і темпоральні таблиці, які дають змогу запитувати дані в такому стані, у якому вони були в будь-який момент минулого."
category: development
developer: MariaDB Foundation
website: https://mariadb.org/
source: https://github.com/MariaDB/server
icon: "data:image/svg+xml;base64,"
settings:
  - name: PORT_3306
    type: port
    default: 3306
    label:
      en: Port 3306
      uk: Порт 3306
    advanced: true
  - name: MYSQL_ROOT_PASSWORD
    type: text
    default: hata
    label:
      en: Mysql root password
      uk: Пароль root MySQL
    hint:
      en: Set this to root password for installation (minimum 4 characters & non-alphanumeric passwords must be properly escaped).
      uk: Пароль користувача root для встановлення (щонайменше 4 символи; нелітерно-цифрові символи в паролі потрібно правильно екранувати).
  - name: MYSQL_DATABASE
    type: text
    default: hata
    label:
      en: Mysql database
      uk: База даних MySQL
    hint:
      en: Specify the name of a database to be created on image startup.
      uk: "Назва бази даних, яка буде створена під час запуску образу."
  - name: MYSQL_USER
    type: text
    default: admin
    required: true
    label:
      en: Mysql user
      uk: Користувач MySQL
    hint:
      en: This user will have superuser access to the database specified by MYSQL_DATABASE (do not use root here).
      uk: "Цей користувач матиме повний доступ до бази, указаної в MYSQL_DATABASE (не вказуйте тут root)."
  - name: MYSQL_PASSWORD
    type: text
    default: hata
    label:
      en: Mysql password
      uk: Пароль MySQL
    hint:
      en: Set this to the password you want to use for you MYSQL_USER (minimum 4 characters & non-alphanumeric passwords must be properly escaped).
      uk: Пароль для користувача MYSQL_USER (щонайменше 4 символи; нелітерно-цифрові символи в паролі потрібно правильно екранувати).
  - name: REMOTE_SQL
    type: text
    label:
      en: Remote sql
      uk: Віддалені SQL-файли
    hint:
      en: Set this to ingest sql files from an http/https endpoint (comma seperated array).
      uk: "Адреси http/https, з яких завантажувати файли SQL (список через кому)."
