# Apache-2.0, changed for Hata Store: see NOTICE
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.24
    deploy:
      resources:
        reservations:
          memory: 1G
    restart: unless-stopped
    command:
      - gateway
      - run
    ports:
      - "${PORT_8642:-8642}:8642"
      - "${WEB_PORT:-9119}:9119"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/"
        target: /opt/data
    environment:
      HERMES_DASHBOARD: "${HERMES_DASHBOARD:-1}"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"
