title:
  en: Hermes
tagline:
  en: "A self-improving AI agent with memory, skills, messaging, and a web dashboard."
  it: "Un agente AI auto-migliorante con memoria, competenze, messaggistica e dashboard web."
  nb: "En selvforbedrende AI-agent med minne, ferdigheter, meldinger og et webdashboard."
  zh: 一款具备记忆、技能、消息功能和 Web 仪表盘的自我改进 AI 代理。
  ja: メモリ、スキル、メッセージング、Webダッシュボードを備えた自己改善型AIエージェント。
  ko: "메모리, 스킬, 메시징, 웹 대시보드를 갖춘 자기개선형 AI 에이전트입니다."
  fr: "Un agent IA auto-améliorant avec mémoire, compétences, messagerie et tableau de bord web."
  de: "Ein selbstverbessernder KI-Agent mit Speicher, Fähigkeiten, Messaging und Web-Dashboard."
  sv: "En självförbättrande AI-agent med minne, färdigheter, meddelanden och en webbpanel."
  el: "Ένας αυτοβελτιούμενος πράκτορας AI με μνήμη, δεξιότητες, μηνύματα και πίνακα ελέγχου web."
  hr: "Samopoboljšavajući AI agent s memorijom, vještinama, porukama i web nadzornom pločom."
  pt: "Um agente de IA autoaperfeiçoável com memória, competências, mensagens e painel web."
  ru: "Самообучающийся ИИ-агент с памятью, навыками, сообщениями и веб-панелью."
  tr: "Hafıza, beceriler, mesajlaşma ve web paneline sahip kendini geliştiren bir yapay zeka aracısı."
  uk: "ШІ-агент, що самовдосконалюється: з пам’яттю, навичками, месенджерами та вебпанеллю."
description:
  en: "Hermes Agent is a self-improving AI agent from Nous Research, designed to be a long-running collaborator rather than a one-off chatbot. Its built-in learning loop combines persistent memory, cross-session recall, and reusable skills so it can keep context and improve recurring workflows over time. With a unified gateway, rich toolsets, and a browser-based dashboard, Hermes fits research, automation, cross-platform communication, and ongoing operational work.\n\n**Main Features:**\n- Built-in learning loop with persistent memory, session search, and reusable skills\n- One gateway for CLI, Telegram, Discord, Slack, WhatsApp, Signal, and more\n- Tool-driven workflows with terminal access, web search, browser automation, file editing, and MCP integration\n- Automation and coordination with cron jobs, subagents, the web dashboard, and an OpenAI-compatible API\n\n**Learn More:**\n- [Hermes Agent Official Website](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent Documentation](https://hermes-agent.nousresearch.com/docs/)"
  it: "Hermes Agent è un agente AI auto-migliorante di Nous Research, progettato per essere un collaboratore continuativo più che un semplice chatbot occasionale. Il suo ciclo di apprendimento interno combina memoria persistente, richiamo tra sessioni e competenze riutilizzabili, così da mantenere il contesto e migliorare nel tempo i flussi di lavoro ricorrenti. Con un gateway unificato, ricchi set di strumenti e una dashboard accessibile dal browser, Hermes si adatta bene a ricerca, automazione, comunicazione multipiattaforma e lavoro operativo continuativo.\n\n**Funzionalità Principali:**\n- Ciclo di apprendimento integrato con memoria persistente, richiamo tra sessioni e competenze riutilizzabili\n- Un solo gateway per CLI, Telegram, Discord, Slack, WhatsApp, Signal e altre piattaforme\n- Flussi di lavoro guidati dagli strumenti con terminale, ricerca web, automazione del browser, modifica file e integrazione MCP\n- Automazione e coordinamento con cron, sottoagenti, dashboard web e API compatibile con OpenAI\n\n**Ulteriori Informazioni:**\n- [Sito Ufficiale di Hermes Agent](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Documentazione di Hermes Agent](https://hermes-agent.nousresearch.com/docs/)"
  nb: "Hermes Agent er en selvforbedrende AI-agent fra Nous Research, laget for å være en langsiktig samarbeidspartner heller enn en engangs chatbot. Den innebygde læringssløyfen kombinerer vedvarende minne, søk på tvers av økter og gjenbrukbare ferdigheter, slik at den kan huske kontekst og forbedre tilbakevendende arbeidsflyter over tid. Med en samlet gateway, rike verktøysett og et nettleserbasert dashboard passer Hermes godt til forskning, automatisering, kommunikasjon på tvers av plattformer og løpende operativt arbeid.\n\n**Hovedfunksjoner:**\n- Innebygd læringssløyfe med vedvarende minne, øktsøk og gjenbrukbare ferdigheter\n- Én gateway for CLI, Telegram, Discord, Slack, WhatsApp, Signal og mer\n- Verktøydrevne arbeidsflyter med terminal, nettsøk, nettleserautomatisering, filredigering og MCP-integrasjon\n- Automatisering og koordinering med cron, underagenter, webdashboard og OpenAI-kompatibelt API\n\n**Lær Mer:**\n- [Hermes Agent Offisielle Nettside](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent-dokumentasjon](https://hermes-agent.nousresearch.com/docs/)"
  zh: "Hermes Agent 是 Nous Research 推出的自我改进 AI 代理，定位不是一次性聊天机器人，而是可以长期协作的智能助手。 它内置学习闭环，把长期记忆、跨会话检索和可复用技能结合在一起，能够持续保留上下文，并不断改进重复出现的工作流。 借助统一消息网关、丰富工具集和基于浏览器的仪表盘，Hermes 很适合研究整理、任务自动化、跨平台沟通以及持续性的运营工作。\n\n**主要功能：**\n- 内置学习闭环，结合长期记忆、会话检索与可复用技能\n- 单一网关连接 CLI、Telegram、Discord、Slack、WhatsApp、Signal 等多种平台\n- 可通过工具执行终端操作、网页搜索、浏览器自动化、文件编辑和 MCP 扩展集成\n- 支持定时任务、子代理协作、Web 仪表盘与 OpenAI 兼容 API 等自动化与协同能力\n\n**了解更多：**\n- [Hermes Agent 官网](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent 文档](https://hermes-agent.nousresearch.com/docs/)"
  ja: "Hermes AgentはNous Researchによる自己改善型AIエージェントで、単発のチャットボットではなく長期的な協業相手として設計されています。 組み込みの学習ループにより、永続メモリ、セッションをまたぐ検索、再利用可能なスキルを組み合わせ、文脈を保ちながら反復的なワークフローを改善していきます。 統合ゲートウェイ、豊富なツールセット、ブラウザベースのダッシュボードを備え、調査、自動化、複数プラットフォームでの連携、継続的な運用業務に適しています。\n\n**主な機能：**\n- 永続メモリ、セッション検索、再利用可能スキルを備えた学習ループ\n- CLI、Telegram、Discord、Slack、WhatsApp、Signal などをつなぐ単一ゲートウェイ\n- ターミナル操作、Web検索、ブラウザ自動化、ファイル編集、MCP連携によるツール駆動ワークフロー\n- cron、サブエージェント、Webダッシュボード、OpenAI互換APIによる自動化と調整\n\n**詳細情報：**\n- [Hermes Agent 公式サイト](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent ドキュメント](https://hermes-agent.nousresearch.com/docs/)"
  ko: "Hermes Agent는 Nous Research가 만든 자기개선형 AI 에이전트로, 일회성 챗봇이 아니라 오래 함께 일하는 협업 도우미를 지향합니다. 내장된 학습 루프는 지속 메모리, 세션 간 검색, 재사용 가능한 스킬을 결합해 문맥을 기억하고 반복되는 워크플로를 시간이 지날수록 더 잘 처리하게 만듭니다. 통합 게이트웨이, 풍부한 도구 세트, 브라우저 기반 대시보드를 바탕으로 리서치, 자동화, 다중 플랫폼 커뮤니케이션, 지속적인 운영 업무에 잘 맞습니다。\n\n**주요 기능:**\n- 지속 메모리, 세션 검색, 재사용 가능한 스킬을 결합한 내장 학습 루프\n- CLI, Telegram, Discord, Slack, WhatsApp, Signal 등을 연결하는 단일 게이트웨이\n- 터미널, 웹 검색, 브라우저 자동화, 파일 편집, MCP 연동을 포함한 도구 기반 작업\n- 크론 작업, 서브에이전트, 웹 대시보드, OpenAI 호환 API를 통한 자동화와 조정\n\n**더 알아보기:**\n- [Hermes Agent 공식 웹사이트](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent 문서](https://hermes-agent.nousresearch.com/docs/)"
  fr: "Hermes Agent est un agent IA auto-améliorant de Nous Research, conçu comme un collaborateur durable plutôt qu'un simple chatbot ponctuel. Sa boucle d'apprentissage intégrée combine mémoire persistante, recherche intersessions et compétences réutilisables afin de conserver le contexte et d'améliorer les flux de travail récurrents au fil du temps. Avec une passerelle unifiée, de riches jeux d'outils et un tableau de bord accessible depuis le navigateur, Hermes convient bien à la recherche, à l'automatisation, à la communication multiplateforme et aux opérations continues.\n\n**Fonctionnalités Principales :**\n- Boucle d'apprentissage intégrée avec mémoire persistante, recherche entre sessions et compétences réutilisables\n- Une seule passerelle pour le CLI, Telegram, Discord, Slack, WhatsApp, Signal et d'autres plateformes\n- Flux pilotés par outils avec terminal, recherche web, automatisation du navigateur, édition de fichiers et intégration MCP\n- Automatisation et coordination avec cron, sous-agents, tableau de bord web et API compatible OpenAI\n\n**En Savoir Plus :**\n- [Site Officiel Hermes Agent](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Documentation Hermes Agent](https://hermes-agent.nousresearch.com/docs/)"
  de: "Hermes Agent ist ein selbstverbessernder KI-Agent von Nous Research, der als langfristiger Arbeitsbegleiter und nicht als einmaliger Chatbot gedacht ist. Seine integrierte Lernschleife verbindet dauerhaftes Gedächtnis, sitzungsübergreifende Suche und wiederverwendbare Fähigkeiten, damit Kontext erhalten bleibt und wiederkehrende Abläufe mit der Zeit besser werden. Mit einer einheitlichen Gateway-Schicht, umfangreichen Toolsets und einem browserbasierten Dashboard eignet sich Hermes für Recherche, Automatisierung, plattformübergreifende Kommunikation und laufende operative Arbeit.\n\n**Hauptfunktionen:**\n- Integrierte Lernschleife mit persistentem Gedächtnis, sitzungsübergreifender Suche und wiederverwendbaren Fähigkeiten\n- Ein Gateway für CLI, Telegram, Discord, Slack, WhatsApp, Signal und weitere Plattformen\n- Werkzeuggestützte Workflows mit Terminal, Websuche, Browserautomatisierung, Dateibearbeitung und MCP-Integration\n- Automatisierung und Koordination mit Cron, Subagenten, Web-Dashboard und OpenAI-kompatibler API\n\n**Mehr Erfahren:**\n- [Hermes Agent Offizielle Website](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent Dokumentation](https://hermes-agent.nousresearch.com/docs/)"
  sv: "Hermes Agent är en självförbättrande AI-agent från Nous Research, byggd för att vara en långsiktig samarbetspartner snarare än en engångschattbot. Den inbyggda lärloopen kombinerar beständigt minne, sökning mellan sessioner och återanvändbara färdigheter så att den kan minnas sammanhang och förbättra återkommande arbetsflöden över tid. Med en gemensam gateway, rika verktygsuppsättningar och en webbaserad panel passar Hermes för forskning, automatisering, kommunikation över flera plattformar och löpande operativt arbete.\n\n**Huvudfunktioner:**\n- Inbyggd lärloop med beständigt minne, sessionssökning och återanvändbara färdigheter\n- En gateway för CLI, Telegram, Discord, Slack, WhatsApp, Signal och fler plattformar\n- Verktygsdrivna arbetsflöden med terminal, webbsökning, webbläsarautomatisering, filredigering och MCP-integration\n- Automatisering och samordning med cron, underagenter, webbpanel och OpenAI-kompatibelt API\n\n**Lär Dig Mer:**\n- [Hermes Agent Officiella Webbplats](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent-dokumentation](https://hermes-agent.nousresearch.com/docs/)"
  el: "Το Hermes Agent είναι ένας αυτοβελτιούμενος πράκτορας AI της Nous Research, σχεδιασμένος ως μακροχρόνιος συνεργάτης και όχι ως ένα απλό εφάπαξ chatbot. Ο ενσωματωμένος βρόχος μάθησης συνδυάζει επίμονη μνήμη, αναζήτηση μεταξύ συνεδριών και επαναχρησιμοποιήσιμες δεξιότητες, ώστε να διατηρεί το πλαίσιο και να βελτιώνει επαναλαμβανόμενες ροές εργασίας με τον χρόνο. Με ενιαία πύλη, πλούσια σύνολα εργαλείων και πίνακα ελέγχου μέσω προγράμματος περιήγησης, το Hermes ταιριάζει σε έρευνα, αυτοματοποίηση, επικοινωνία σε πολλές πλατφόρμες και συνεχή επιχειρησιακή εργασία.\n\n**Κύριες Λειτουργίες:**\n- Ενσωματωμένος βρόχος μάθησης με επίμονη μνήμη, αναζήτηση συνεδριών και επαναχρησιμοποιήσιμες δεξιότητες\n- Μία πύλη για CLI, Telegram, Discord, Slack, WhatsApp, Signal και περισσότερες πλατφόρμες\n- Ροές εργασίας με εργαλεία όπως τερματικό, αναζήτηση ιστού, αυτοματοποίηση περιηγητή, επεξεργασία αρχείων και ενσωμάτωση MCP\n- Αυτοματισμός και συντονισμός με cron, υποπράκτορες, web dashboard και API συμβατό με OpenAI\n\n**Μάθετε Περισσότερα:**\n- [Επίσημος Ιστότοπος Hermes Agent](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Τεκμηρίωση Hermes Agent](https://hermes-agent.nousresearch.com/docs/)"
  hr: "Hermes Agent je samopoboljšavajući AI agent tvrtke Nous Research, osmišljen kao dugoročni suradnik, a ne kao jednokratni chatbot. Njegova ugrađena petlja učenja spaja trajnu memoriju, pretraživanje između sesija i ponovno upotrebljive vještine kako bi zadržao kontekst i s vremenom unaprijedio ponavljajuće radne tokove. Uz objedinjeni pristupnik, bogate skupove alata i web nadzornu ploču, Hermes je prikladan za istraživanje, automatizaciju, višekanalnu komunikaciju i kontinuirani operativni rad.\n\n**Glavne Funkcije:**\n- Ugrađena petlja učenja s trajnom memorijom, pretraživanjem sesija i ponovno upotrebljivim vještinama\n- Jedan pristupnik za CLI, Telegram, Discord, Slack, WhatsApp, Signal i druge platforme\n- Radni tokovi vođeni alatima uz terminal, web pretragu, automatizaciju preglednika, uređivanje datoteka i MCP integraciju\n- Automatizacija i koordinacija uz cron, podagente, web nadzornu ploču i OpenAI-kompatibilni API\n\n**Saznajte Više:**\n- [Službena Web Stranica Hermes Agent](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Dokumentacija Hermes Agent](https://hermes-agent.nousresearch.com/docs/)"
  pt: "Hermes Agent é um agente de IA autoaperfeiçoável da Nous Research, concebido para funcionar como colaborador de longo prazo e não apenas como um chatbot ocasional. O seu ciclo de aprendizagem integrado combina memória persistente, pesquisa entre sessões e competências reutilizáveis, permitindo-lhe manter contexto e melhorar fluxos de trabalho recorrentes ao longo do tempo. Com um gateway unificado, conjuntos de ferramentas ricos e um painel baseado no navegador, o Hermes adapta-se bem a investigação, automação, comunicação multiplataforma e trabalho operacional contínuo.\n\n**Principais Funcionalidades:**\n- Ciclo de aprendizagem integrado com memória persistente, pesquisa entre sessões e competências reutilizáveis\n- Um único gateway para CLI, Telegram, Discord, Slack, WhatsApp, Signal e outras plataformas\n- Fluxos de trabalho orientados por ferramentas com terminal, pesquisa web, automação do navegador, edição de ficheiros e integração MCP\n- Automação e coordenação com cron, subagentes, painel web e API compatível com OpenAI\n\n**Saiba Mais:**\n- [Site Oficial do Hermes Agent](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Documentação do Hermes Agent](https://hermes-agent.nousresearch.com/docs/)"
  ru: "Hermes Agent — это самообучающийся ИИ-агент от Nous Research, созданный не как разовый чат-бот, а как долгосрочный помощник для совместной работы. Его встроенный цикл обучения объединяет постоянную память, поиск между сессиями и переиспользуемые навыки, чтобы сохранять контекст и со временем улучшать повторяющиеся рабочие процессы. Благодаря единому шлюзу, богатому набору инструментов и веб-панели Hermes хорошо подходит для исследований, автоматизации, коммуникации на разных платформах и длительной операционной работы.\n\n**Основные Функции:**\n- Встроенный цикл обучения с постоянной памятью, межсессионным поиском и переиспользуемыми навыками\n- Единый шлюз для CLI, Telegram, Discord, Slack, WhatsApp, Signal и других платформ\n- Инструментальные рабочие процессы с терминалом, веб-поиском, автоматизацией браузера, редактированием файлов и интеграцией MCP\n- Автоматизация и координация через cron, субагентов, веб-панель и OpenAI-совместимый API\n\n**Узнать Больше:**\n- [Официальный Сайт Hermes Agent](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Документация Hermes Agent](https://hermes-agent.nousresearch.com/docs/)"
  tr: "Hermes Agent, Nous Research tarafından geliştirilen ve tek seferlik bir sohbet botundan ziyade uzun vadeli bir çalışma ortağı olarak tasarlanan kendini geliştiren bir yapay zeka aracısıdır. Yerleşik öğrenme döngüsü kalıcı hafıza, oturumlar arası arama ve yeniden kullanılabilir becerileri bir araya getirerek bağlamı korumasını ve tekrar eden iş akışlarını zamanla iyileştirmesini sağlar. Birleşik ağ geçidi, zengin araç setleri ve tarayıcı tabanlı paneli sayesinde Hermes; araştırma, otomasyon, çok platformlu iletişim ve süreklilik gerektiren operasyonel işler için uygundur.\n\n**Başlıca İşlevler:**\n- Kalıcı hafıza, oturumlar arası arama ve yeniden kullanılabilir becerilerle yerleşik öğrenme döngüsü\n- CLI, Telegram, Discord, Slack, WhatsApp, Signal ve daha fazlası için tek ağ geçidi\n- Terminal, web araması, tarayıcı otomasyonu, dosya düzenleme ve MCP entegrasyonu ile araç odaklı iş akışları\n- Cron, alt aracılar, web paneli ve OpenAI uyumlu API ile otomasyon ve koordinasyon\n\n**Daha Fazla Bilgi:**\n- [Hermes Agent Resmi Web Sitesi](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent GitHub](https://github.com/NousResearch/hermes-agent)\n- [Hermes Agent Dokümantasyonu](https://hermes-agent.nousresearch.com/docs/)"
  uk: "Hermes Agent — ШІ-агент від Nous Research, що самовдосконалюється. Він задуманий як співрозмовник, що працює тривалий час, а не разовий чат-бот. Вбудований цикл навчання поєднує постійну пам’ять, пошук по минулих сесіях і навички для повторного використання, тож агент зберігає контекст і з часом покращує повторювані процеси. Єдиний шлюз, багатий набір інструментів і панель у браузері роблять Hermes придатним для досліджень, автоматизації, спілкування різними платформами та постійної операційної роботи.\n\n**Основні можливості:**\n- Вбудований цикл навчання з постійною пам’яттю, пошуком по сесіях і навичками для повторного використання\n- Єдиний шлюз для CLI, Telegram, Discord, Slack, WhatsApp, Signal та інших\n- Робота з інструментами: доступ до терміналу, вебпошук, автоматизація браузера, редагування файлів та інтеграція з MCP\n- Автоматизація й координація: завдання за розкладом (cron), субагенти, вебпанель і API, сумісний з OpenAI\n\n**Докладніше:**\n- [Офіційний сайт Hermes Agent](https://hermes-agent.nousresearch.com/)\n- [Hermes Agent на GitHub](https://github.com/NousResearch/hermes-agent)\n- [Документація Hermes Agent](https://hermes-agent.nousresearch.com/docs/)"
