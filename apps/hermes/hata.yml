screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: hermes
  port: 9119
settings:
  - name: PORT_8642
    type: port
    default: 8642
    label:
      en: Gateway API Port
      it: Porta API del gateway
      nb: Gateway API-port
      zh: 网关 API 端口
      ja: ゲートウェイ API ポート
      ko: 게이트웨이 API 포트
      fr: Port API de la passerelle
      de: Gateway-API-Port
      sv: Gateway API-port
      el: Θύρα API πύλης
      hr: API priključak pristupnika
      pt: Porta da API do gateway
      ru: Порт API шлюза
      tr: Ağ geçidi API bağlantı noktası
      uk: Порт API шлюзу
    advanced: true
  - name: WEB_PORT
    type: port
    default: 9119
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: HERMES_DASHBOARD
    type: text
    default: "1"
    label:
      en: Enables the Hermes web dashboard
      it: Abilita la dashboard web di Hermes
      nb: Aktiverer Hermes-nettdashbordet
      zh: 启用 Hermes Web 仪表盘
      ja: Hermes の Web ダッシュボードを有効にします
      ko: Hermes 웹 대시보드를 활성화합니다
      fr: Active le tableau de bord web de Hermes
      de: Aktiviert das Hermes-Web-Dashboard
      sv: Aktiverar Hermes webbpanel
      el: Ενεργοποιεί τον πίνακα ελέγχου web του Hermes
      hr: Omogućuje Hermes web nadzornu ploču
      pt: Ativa o painel web do Hermes
      ru: Включает веб-панель Hermes
      tr: Hermes web panelini etkinleştirir
      uk: Увімкнути вебпанель Hermes
  - name: HERMES_DASHBOARD_INSECURE
    type: text
    default: "1"
    label:
      en: Allows dashboard access from non-loopback hosts
      it: "Consente l'accesso alla dashboard da host non loopback"
      nb: Tillater dashbordtilgang fra ikke-loopback-verter
      zh: 允许从非 loopback 主机访问仪表盘
      ja: loopback 以外のホストからのダッシュボードアクセスを許可します
      ko: non-loopback 호스트에서 대시보드에 접근할 수 있게 합니다
      fr: "Autorise l'acces au tableau de bord depuis des hotes non loopback"
      de: Erlaubt den Dashboard-Zugriff von Nicht-Loopback-Hosts
      sv: Tillater dashboardatkomst fran vardar som inte ar loopback
      el: Επιτρέπει πρόσβαση στο dashboard από hosts εκτός loopback
      hr: Omogucuje pristup nadzornoj ploci s hostova koji nisu loopback
      pt: Permite o acesso ao painel a partir de hosts nao loopback
      ru: "Разрешает доступ к панели управления с хостов, отличных от loopback"
      tr: Panel erisimine loopback disi ana makinelerden izin verir
      uk: Дозволити доступ до панелі з не-loopback-адрес
