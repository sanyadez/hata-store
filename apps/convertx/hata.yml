# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: ConvertX
tagline:
  en: A versatile file conversion tool that supports multiple formats.
  it: Uno strumento di conversione file versatile che supporta più formati.
  nb: Et allsidig filkonverteringsverktøy som støtter flere formater.
  zh: 一款支持多种格式的多功能文件转换工具。
  ja: 複数のフォーマットをサポートする多目的ファイル変換ツール。
  ko: 다양한 형식을 지원하는 다용도 파일 변환 도구입니다.
  fr: Un outil de conversion de fichiers polyvalent prenant en charge plusieurs formats.
  de: "Ein vielseitiges Dateikonvertierungstool, das mehrere Formate unterstützt."
  sv: Ett mångsidigt filkonverteringsverktyg som stöder flera format.
  el: Ένα ευέλικτο εργαλείο μετατροπής αρχείων που υποστηρίζει πολλαπλές μορφές.
  hr: Svestran alat za pretvaranje datoteka koji podržava više formata.
  pt: Uma ferramenta de conversão de arquivos versátil que suporta múltiplos formatos.
  ru: "Универсальный инструмент для преобразования файлов, поддерживающий несколько форматов."
  tr: Çoklu formatları desteklayan çok yönlü bir dosya dönüştürme aracı.
  uk: "Універсальний інструмент перетворення файлів, що підтримує безліч форматів."
description:
  en: "ConvertX is a self-hosted file conversion service that allows users to convert files between different formats through an intuitive web interface. It supports a wide range of file types including documents, images, videos, and audio files, making it a comprehensive solution for all your file conversion needs.\n\nThe service is designed with simplicity and ease of use in mind. Users can simply upload their files, select the desired output format, and let ConvertX handle the conversion process. The web interface provides a clean and user-friendly experience, with drag-and-drop support and batch conversion capabilities.\n\nConvertX runs entirely on your own infrastructure, ensuring that your files remain private and secure. There's no need to upload sensitive documents to third-party services, giving you full control over your data. The service is containerized for easy deployment and can be integrated into existing home server setups.\n\n**Key Features:**\n- Support for multiple file formats (documents, images, videos, audio)\n- Intuitive web interface with drag-and-drop support\n- Batch conversion capabilities\n- Self-hosted for privacy and security\n- Containerized for easy deployment\n- No file size limitations\n\n**Learn More:**\n- [ConvertX GitHub Repository](https://github.com/c4illin/convertx)"
  it: "ConvertX è un servizio di conversione file self-hosted che permette agli utenti di convertire file tra diversi formati attraverso un'interfaccia web intuitiva. Supporta un'ampia gamma di tipi di file inclusi documenti, immagini, video e file audio, rendendolo una soluzione completa per tutte le tue esigenze di conversione file.\n\nIl servizio è progettato con semplicità e facilità d'uso in mente. Gli utenti possono semplicemente caricare i loro file, selezionare il formato di output desiderato e lasciare che ConvertX gestisca il processo di conversione. L'interfaccia web fornisce un'esperienza pulita e user-friendly, con supporto drag-and-drop e capacità di conversione batch.\n\nConvertX funziona interamente sulla tua infrastruttura, garantendo che i tuoi file rimangano privati e sicuri. Non c'è bisogno di caricare documenti sensibili su servizi di terze parti, dandoti pieno controllo sui tuoi dati. Il servizio è containerizzato per una facile distribuzione e può essere integrato in configurazioni di home server esistenti.\n\n**Funzionalità Principali:**\n- Supporto per più formati di file (documenti, immagini, video, audio)\n- Interfaccia web intuitiva con supporto drag-and-drop\n- Capacità di conversione batch\n- Self-hosted per privacy e sicurezza\n- Containerizzato per facile distribuzione\n- Nessuna limitazione sulle dimensioni dei file\n\n**Ulteriori Informazioni:**\n- [Repository GitHub ConvertX](https://github.com/c4illin/convertx)"
  nb: "ConvertX er en selvhostet filkonverteringstjeneste som lar brukere konvertere filer mellom ulike formater gjennom et intuitivt webgrensesnitt. Den støtter et bredt spekter av filtyper inkludert dokumenter, bilder, videoer og lydfiler, noe som gjør den til en omfattende løsning for alle dine filkonverteringsbehov.\n\nTjenesten er designet med enkelhet og brukervennlighet i tankene. Brukere kan enkelt laste opp filene sine, velge ønsket utdataformat og la ConvertX håndtere konverteringsprosessen. Webgrensesnittet gir en ren og brukervennlig opplevelse, med dra-og-slipp-støtte og batchkonverteringsmuligheter.\n\nConvertX kjører helt på din egen infrastruktur, noe som sikrer at filene dine forblir private og sikre. Det er ikke nødvendig å laste opp sensitive dokumenter til tredjepartstjenester, noe som gir deg full kontroll over dataene dine. Tjenesten er containerisert for enkel distribusjon og kan integreres i eksisterende hjemmeserveroppsett.\n\n**Nøkkelfunksjoner:**\n- Støtte for flere filformater (dokumenter, bilder, videoer, lyd)\n- Intuitivt webgrensesnitt med dra-og-slipp-støtte\n- Batchkonverteringsmuligheter\n- Selvhostet for personvern og sikkerhet\n- Containerisert for enkel distribusjon\n- Ingen begrensninger på filstørrelse\n\n**Lær mer:**\n- [ConvertX GitHub Repository](https://github.com/c4illin/convertx)"
  zh: "ConvertX 是一款自托管的文件转换服务，允许用户通过直观的 Web 界面在不同格式之间转换文件。它支持广泛的文件类型，包括文档、图像、视频和音频文件，使其成为满足您所有文件转换需求的综合解决方案。\n\n该服务的设计注重简单性和易用性。用户只需上传文件，选择所需的输出格式，然后让 ConvertX 处理转换过程。Web 界面提供干净友好的用户体验，支持拖放和批量转换功能。\n\nConvertX 完全在您自己的基础设施上运行，确保您的文件保持私密和安全。无需将敏感文档上传到第三方服务，让您完全控制自己的数据。该服务采用容器化设计，便于部署，并可集成到现有的家庭服务器设置中。\n\n**主要功能：**\n- 支持多种文件格式（文档、图像、视频、音频）\n- 直观的 Web 界面，支持拖放\n- 批量转换功能\n- 自托管，保护隐私和安全\n- 容器化，便于部署\n- 无文件大小限制\n\n**了解更多：**\n- [ConvertX GitHub 仓库](https://github.com/c4illin/convertx)"
  ja: "ConvertXは、直感的なWebインターフェースを通じてユーザーが異なる形式間でファイルを変換できる自己ホスト型のファイル変換サービスです。ドキュメント、画像、ビデオ、オーディオファイルなど、幅広いファイルタイプをサポートしており、すべてのファイル変換ニーズに対応する総合的なソリューションです。\n\nこのサービスは、シンプルさと使いやすさを念頭に設計されています。ユーザーはファイルをアップロードし、目的の出力形式を選択するだけで、ConvertXが変換プロセスを処理します。Webインターフェースは、ドラッグアンドドロップサポートとバッチ変換機能を備えた、クリーンでユーザーフレンドリーな体験を提供します。\n\nConvertXは完全に独自のインフラストラクチャで実行されるため、ファイルのプライバシーとセキュリティが確保されます。機密文書をサードパーティサービスにアップロードする必要がなく、データを完全に制御できます。このサービスはコンテナ化されており、簡単にデプロイでき、既存のホームサーバーセットアップに統合できます。\n\n**主な機能：**\n- 複数のファイル形式をサポート（ドキュメント、画像、ビデオ、オーディオ）\n- ドラッグアンドドロップサポート付きの直感的なWebインターフェース\n- バッチ変換機能\n- プライバシーとセキュリティのための自己ホスト型\n- 簡単なデプロイのためのコンテナ化\n- ファイルサイズ制限なし\n\n**詳細情報：**\n- [ConvertX GitHubリポジトリ](https://github.com/c4illin/convertx)"
  ko: "ConvertX는 직관적인 웹 인터페이스를 통해 사용자가 다양한 형식 간에 파일을 변환할 수 있는 셀프 호스팅 파일 변환 서비스입니다. 문서, 이미지, 비디오, 오디오 파일을 포함한 광범위한 파일 유형을 지원하여 모든 파일 변환 요구 사항에 대한 포괄적인 솔루션을 제공합니다.\n\n이 서비스는 단순성과 사용 편의성을 염두에 두고 설계되었습니다. 사용자는 파일을 업로드하고 원하는 출력 형식을 선택하기만 하면 ConvertX가 변환 프로세스를 처리합니다. 웹 인터페이스는 드래그 앤 드롭 지원과 일괄 변환 기능을 갖춘 깨끗하고 사용자 친화적인 경험을 제공합니다.\n\nConvertX는 완전히 자체 인프라에서 실행되어 파일의 프라이버시와 보안을 보장합니다. 민감한 문서를 제3자 서비스에 업로드할 필요가 없어 데이터를 완전히 제어할 수 있습니다. 이 서비스는 컨테이너화되어 배포가 쉽고 기존 홈 서버 설정에 통합될 수 있습니다.\n\n**주요 기능:**\n- 다양한 파일 형식 지원(문서, 이미지, 비디오, 오디오)\n- 드래그 앤 드롭 지원 직관적인 웹 인터페이스\n- 일괄 변환 기능\n- 프라이버시와 보안을 위한 셀프 호스팅\n- 쉬운 배포를 위한 컨테이너화\n- 파일 크기 제한 없음\n\n**자세히 알아보기:**\n- [ConvertX GitHub 저장소](https://github.com/c4illin/convertx)"
  fr: "ConvertX est un service de conversion de fichiers auto-hébergé qui permet aux utilisateurs de convertir des fichiers entre différents formats via une interface web intuitive. Il prend en charge une large gamme de types de fichiers, y compris les documents, les images, les vidéos et les fichiers audio, en faisant une solution complète pour tous vos besoins de conversion de fichiers.\n\nLe service est conçu en pensant à la simplicité et à la facilité d'utilisation. Les utilisateurs peuvent simplement télécharger leurs fichiers, sélectionner le format de sortie souhaité et laisser ConvertX gérer le processus de conversion. L'interface web offre une expérience propre et conviviale, avec prise en charge du glisser-déposer et capacités de conversion par lots.\n\nConvertX fonctionne entièrement sur votre propre infrastructure, garantissant que vos fichiers restent privés et sécurisés. Il n'est pas nécessaire de télécharger des documents sensibles vers des services tiers, vous donnant un contrôle total sur vos données. Le service est conteneurisé pour un déploiement facile et peut être intégré dans des configurations de serveurs domestiques existantes.\n\n**Fonctionnalités Clés :**\n- Prise en charge de plusieurs formats de fichiers (documents, images, vidéos, audio)\n- Interface web intuitive avec prise en charge du glisser-déposer\n- Capacités de conversion par lots\n- Auto-hébergé pour la confidentialité et la sécurité\n- Conteneurisé pour un déploiement facile\n- Aucune limitation de taille de fichier\n\n**En Savoir Plus :**\n- [Dépôt GitHub ConvertX](https://github.com/c4illin/convertx)"
  de: "ConvertX ist ein selbstgehosteter Dateikonvertierungsdienst, der Benutzern ermöglicht, Dateien über eine intuitive Weboberfläche zwischen verschiedenen Formaten zu konvertieren. Er unterstützt eine breite Palette von Dateitypen, einschließlich Dokumenten, Bildern, Videos und Audiodateien, was ihn zu einer umfassenden Lösung für alle Ihre Dateikonvertierungsbedürfnisse macht.\n\nDer Dienst wurde mit Einfachheit und Benutzerfreundlichkeit im Sinn entwickelt. Benutzer können einfach ihre Dateien hochladen, das gewünschte Ausgabeformat auswählen und ConvertX den Konvertierungsprozess überlassen. Die Weboberfläche bietet ein sauberes und benutzerfreundliches Erlebnis mit Drag-and-Drop-Unterstützung und Stapelkonvertierungsfunktionen.\n\nConvertX läuft vollständig auf Ihrer eigenen Infrastruktur, wodurch sichergestellt wird, dass Ihre Dateien privat und sicher bleiben. Es ist nicht erforderlich, vertrauliche Dokumente an Drittanbieterdienste hochzuladen, was Ihnen volle Kontrolle über Ihre Daten gibt. Der Dienst ist containerisiert für eine einfache Bereitstellung und kann in bestehende Heimserver-Setups integriert werden.\n\n**Hauptfunktionen:**\n- Unterstützung für mehrere Dateiformate (Dokumente, Bilder, Videos, Audio)\n- Intuitive Weboberfläche mit Drag-and-Drop-Unterstützung\n- Stapelkonvertierungsfunktionen\n- Selbstgehostet für Privatsphäre und Sicherheit\n- Containerisiert für einfache Bereitstellung\n- Keine Dateigrößenbeschränkungen\n\n**Mehr Erfahren:**\n- [ConvertX GitHub Repository](https://github.com/c4illin/convertx)"
  sv: "ConvertX är en självhostad filkonverteringstjänst som låter användare konvertera filer mellan olika format genom ett intuitivt webbgränssnitt. Den stöder ett brett utbud av filtyper inklusive dokument, bilder, videor och ljudfiler, vilket gör den till en omfattande lösning för alla dina filkonverteringsbehov.\n\nTjänsten är designad med enkelhet och användarvänlighet i åtanke. Användare kan enkelt ladda upp sina filer, välja önskat utdataformat och låta ConvertX hantera konverteringsprocessen. Webbgränssnittet ger en ren och användarvänlig upplevelse med dra-och-släpp-stöd och batchkonverteringsmöjligheter.\n\nConvertX körs helt på din egen infrastruktur, vilket säkerställer att dina filer förblir privata och säkra. Det finns inget behov av att ladda upp känsliga dokument till tredjepartstjänster, vilket ger dig full kontroll över dina data. Tjänsten är containeriserad för enkel distribution och kan integreras i befintliga hemserverinstallationer.\n\n**Huvudfunktioner:**\n- Stöd för flera filformat (dokument, bilder, videor, ljud)\n- Intuitivt webbgränssnitt med dra-och-släpp-stöd\n- Batchkonverteringsmöjligheter\n- Självhostat för integritet och säkerhet\n- Containeriserat för enkel distribution\n- Inga filstorleksbegränsningar\n\n**Lär Dig Mer:**\n- [ConvertX GitHub Repository](https://github.com/c4illin/convertx)"
  el: "Το ConvertX είναι μια αυτο-φιλοξενούμενη υπηρεσία μετατροπής αρχείων που επιτρέπει στους χρήστες να μετατρέπουν αρχεία μεταξύ διαφορετικών μορφών μέσω μιας διαισθητικής διεπαφής Ιστού. Υποστηρίζει ένα ευρύ φάσμα τύπων αρχείων συμπεριλαμβανομένων εγγράφων, εικόνων, βίντεο και αρχείων ήχου, καθιστώντας το μια ολοκληρωμένη λύση για όλες τις ανάγκες μετατροπής αρχείων σας.\n\nΗ υπηρεσία έχει σχεδιαστεί με απλότητα και ευκολία χρήσης κατά νου. Οι χρήστες μπορούν απλώς να ανεβάσουν τα αρχεία τους, να επιλέξουν την επιθυμητή μορφή εξόδου και να αφήσουν το ConvertX να διαχειριστεί τη διαδικασία μετατροπής. Η διεπαφή Ιστού παρέχει μια καθαρή και φιλική προς τον χρήστη εμπειρία, με υποστήριξη σύρσης και απόθεσης και δυνατότητες μαζικής μετατροπής.\n\nΤο ConvertX εκτελείται εξ ολοκλήρου στη δική σας υποδομή, διασφαλίζοντας ότι τα αρχεία σας παραμένουν ιδιωτικά και ασφαλή. Δεν υπάρχει ανάγκη να ανεβάσετε ευαίσθητα έγγραφα σε υπηρεσίες τρίτων, δίνοντάς σας πλήρη έλεγχο των δεδομένων σας. Η υπηρεσία είναι εμπορευματοποιημένη για εύκολη ανάπτυξη και μπορεί να ενσωματωθεί σε υπάρχουσες διαμορφώσεις οικιακού διακομιστή.\n\n**Βασικά Χαρακτηριστικά:**\n- Υποστήριξη για πολλαπλές μορφές αρχείων (έγγραφα, εικόνες, βίντεο, ήχος)\n- Διαισθητική διεπαφή Ιστού με υποστήριξη σύρσης και απόθεσης\n- Δυνατότητες μαζικής μετατροπής\n- Αυτο-φιλοξενούμενο για ιδιωτικότητα και ασφάλεια\n- Εμπορευματοποιημένο για εύκολη ανάπτυξη\n- Καμία περιορισμός μεγέθους αρχείου\n\n**Μάθετε Περισσότερα:**\n- [ConvertX GitHub Repository](https://github.com/c4illin/convertx)"
  hr: "ConvertX je samohostovana usluga pretvaranja datoteka koja korisnicima omogućuje pretvaranje datoteka između različitih formata kroz intuitivno web sučelje. Podržava širok raspon tipova datoteka uključujući dokumente, slike, videozapise i audio datoteke, čineći je sveobuhvatnim rješenjem za sve vaše potrebe pretvaranja datoteka.\n\nUsluga je dizajnirana s jednostavnošću i lakoćom korištenja na umu. Korisnici mogu jednostavno učitati svoje datoteke, odabrati željeni izlazni format i prepustiti ConvertX-u da rukuje procesom pretvaranja. Web sučelje pruža čisto i korisnički prijateljsko iskustvo, s podrškom za povlačenje i ispuštanje te mogućnošću grupnog pretvaranja.\n\nConvertX se izvodi u potpunosti na vlastitoj infrastrukturi, osiguravajući da vaše datoteke ostanu privatne i sigurne. Nema potrebe učitavati osjetljive dokumente na usluge trećih strana, dajući vam punu kontrolu nad vašim podacima. Usluga je kontejnerizirana za lako implementiranje i može se integrirati u postojeće postavke kućnog poslužitelja.\n\n**Ključne Značajke:**\n- Podrška za više formata datoteka (dokumenti, slike, videozapisi, audio)\n- Intuitivno web sučelje s podrškom za povlačenje i ispuštanje\n- Mogućnosti grupnog pretvaranja\n- Samohostovano za privatnost i sigurnost\n- Kontejnerizirano za lako implementiranje\n- Nema ograničenja veličine datoteke\n\n**Saznajte Više:**\n- [ConvertX GitHub Repository](https://github.com/c4illin/convertx)"
  pt: "ConvertX é um serviço de conversão de ficheiros auto-hospedado que permite aos utilizadores converter ficheiros entre diferentes formatos através de uma interface web intuitiva. Suporta uma vasta gama de tipos de ficheiros incluindo documentos, imagens, vídeos e ficheiros de áudio, tornando-o uma solução abrangente para todas as suas necessidades de conversão de ficheiros.\n\nO serviço é concebido com simplicidade e facilidade de utilização em mente. Os utilizadores podem simplesmente carregar os seus ficheiros, selecionar o formato de saída desejado e deixar o ConvertX tratar do processo de conversão. A interface web proporciona uma experiência limpa e amigável, com suporte para arrastar e largar e capacidades de conversão em lote.\n\nConvertX funciona inteiramente na sua própria infraestrutura, garantindo que os seus ficheiros permanecem privados e seguros. Não há necessidade de carregar documentos sensíveis para serviços de terceiros, dando-lhe controlo total sobre os seus dados. O serviço é contentorizado para fácil implementação e pode ser integrado em configurações existentes de servidores domésticos.\n\n**Características Principais:**\n- Suporte para múltiplos formatos de ficheiros (documentos, imagens, vídeos, áudio)\n- Interface web intuitiva com suporte para arrastar e largar\n- Capacidades de conversão em lote\n- Auto-hospedado para privacidade e segurança\n- Contentorizado para fácil implementação\n- Sem limitações de tamanho de ficheiro\n\n**Saiba Mais:**\n- [ConvertX GitHub Repository](https://github.com/c4illin/convertx)"
  ru: "ConvertX - это самостоятельный сервис преобразования файлов, который позволяет пользователям конвертировать файлы между различными форматами через интуитивно понятный веб-интерфейс. Он поддерживает широкий спектр типов файлов, включая документы, изображения, видео и аудиофайлы, что делает его комплексным решением для всех ваших потребностей в преобразовании файлов.\n\nСервис разработан с учетом простоты и легкости использования. Пользователи могут просто загрузить свои файлы, выбрать желаемый выходной формат и позволить ConvertX обработать процесс преобразования. Веб-интерфейс обеспечивает чистый и удобный опыт работы с поддержкой перетаскивания и возможностями пакетного преобразования.\n\nConvertX работает полностью на вашей собственной инфраструктуре, обеспечивая конфиденциальность и безопасность ваших файлов. Нет необходимости загружать конфиденциальные документы в сторонние сервисы, что дает вам полный контроль над вашими данными. Сервис контейнеризирован для легкого развертывания и может быть интегрирован в существующие настройки домашнего сервера.\n\n**Ключевые особенности:**\n- Поддержка множества форматов файлов (документы, изображения, видео, аудио)\n- Интуитивно понятный веб-интерфейс с поддержкой перетаскивания\n- Возможности пакетного преобразования\n- Самостоятельный хостинг для конфиденциальности и безопасности\n- Контейнеризирован для легкого развертывания\n- Нет ограничений на размер файла\n\n**Узнать больше:**\n- [Репозиторий ConvertX на GitHub](https://github.com/c4illin/convertx)"
  tr: "ConvertX, kullanıcıların sezgisel bir web arayüzü aracılığıyla farklı formatlar arasında dosya dönüştürmesine olanak tanıyan kendi kendine barındırılan bir dosya dönüştürme hizmetidir. Belgeleri, görüntüleri, videoları ve ses dosyalarını içeren geniş bir dosya türü yelpazesini destekleyerek, tüm dosya dönüştürme ihtiyaçlarınız için kapsamlı bir çözüm sunar.\n\nHizmet, basitlik ve kullanım kolaylığı göz önünde bulundurularak tasarlanmıştır. Kullanıcılar dosyalarını basitçe yükleyebilir, istedikleri çıktı formatını seçebilir ve dönüştürme işlemini ConvertX'in halletmesine izin verebilir. Web arayüzü, sürükle ve bırak desteği ve toplu dönüştürme yetenekleriyle temiz ve kullanıcı dostu bir deneyim sunar.\n\nConvertX tamamen kendi altyapınızda çalışır, dosyalarınızın özel ve güvende kalmasını sağlar. Hassas belgeleri üçüncü taraf hizmetlere yüklemenize gerek yoktur, bu da verileriniz üzerinde tam kontrol sahibi olmanızı sağlar. Hizmet, kolay dağıtım için konteynerleştirilmiştir ve mevcut ev sunucu kurulumlarına entegre edilebilir.\n\n**Önemli Özellikler:**\n- Çoklu dosya formatı desteği (belgeler, görüntüler, videolar, ses)\n- Sürükle ve bırak destekli sezgisel web arayüzü\n- Toplu dönüştürme yetenekleri\n- Gizlilik ve güvenlik için kendi kendine barındırılan\n- Kolay dağıtım için konteynerleştirilmiş\n- Dosya boyutu sınırlaması yok\n\n**Daha Fazla Bilgi Edinin:**\n- [ConvertX GitHub Deposu](https://github.com/c4illin/convertx)"
  uk: "ConvertX — self-hosted сервіс перетворення файлів, який дає змогу конвертувати файли між різними форматами через зрозумілий вебінтерфейс. Він підтримує широкий спектр типів файлів, зокрема документи, зображення, відео й аудіо, тож охоплює майже всі потреби в перетворенні файлів.\n\nСервіс створено з акцентом на простоту й зручність. Достатньо завантажити файли, вибрати потрібний формат — і ConvertX виконає перетворення. Вебінтерфейс чистий і зручний, підтримує перетягування файлів і пакетне перетворення.\n\nConvertX працює повністю на вашій інфраструктурі, тож файли залишаються приватними й захищеними. Не потрібно завантажувати конфіденційні документи до сторонніх сервісів — ви повністю контролюєте свої дані. Сервіс працює в контейнері, легко розгортається й може вписатися в наявну домашню конфігурацію сервера.\n\n**Основні можливості:**\n- Підтримка багатьох форматів файлів (документи, зображення, відео, аудіо)\n- Зрозумілий вебінтерфейс із перетягуванням файлів\n- Пакетне перетворення\n- Self-hosted: приватність і безпека\n- Працює в контейнері, легко розгортається\n- Без обмежень на розмір файлів\n\n**Дізнатися більше:**\n- [Репозиторій ConvertX на GitHub](https://github.com/c4illin/convertx)"
