# Apache-2.0, changed for Hata Store: see NOTICE
title: OpenHands
tagline:
  en: Open-source AI-powered coding assistant
  uk: ШІ-помічник для програмування з відкритим кодом
description:
  en: "OpenHands is an open-source AI-powered coding assistant that provides developers with intelligent code completion, generation, and debugging capabilities. It runs in a sandboxed environment to ensure security and isolation while allowing access to various development tools and resources.\n\n**Key Features:**\n- AI-powered code completion and generation\n- Interactive debugging and error resolution\n- Support for multiple programming languages\n- Secure sandboxed execution environment\n- Customizable runtime configurations\n- Integration with Docker for containerized workflows\n\n**Learn More:**\n- [OpenHands Official Website](https://www.all-hands.dev)\n- [OpenHands GitHub Repository](https://github.com/All-Hands-AI/OpenHands)\n- [Documentation](https://docs.all-hands.dev)"
  uk: "OpenHands — ШІ-помічник для програмування з відкритим кодом: він пропонує розробникам розумне доповнення й генерацію коду та допомагає з налагодженням. Працює в ізольованому середовищі, що забезпечує безпеку, і водночас дає доступ до різних інструментів та ресурсів розробки.\n\n**Основні можливості:**\n- Доповнення й генерація коду за допомогою ШІ\n- Інтерактивне налагодження та виправлення помилок\n- Підтримка багатьох мов програмування\n- Безпечне ізольоване середовище виконання\n- Налаштовувані конфігурації середовища виконання\n- Інтеграція з Docker для робочих процесів у контейнерах\n\n**Докладніше:**\n- [Офіційний сайт OpenHands](https://www.all-hands.dev)\n- [Репозиторій OpenHands на GitHub](https://github.com/All-Hands-AI/OpenHands)\n- [Документація](https://docs.all-hands.dev)"
category: ai
developer: All-Hands-AI
website: https://www.openhands.dev/
source: https://github.com/All-Hands-AI/OpenHands
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: openhands
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 13333
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: SANDBOX_RUNTIME_CONTAINER_IMAGE
    type: text
    default: ghcr.io/all-hands-ai/runtime:main-nikolaik
    label:
      en: Container Image for Runtime Environment
      uk: Образ контейнера для середовища виконання
permissions:
  docker:
    en: "It controls the server's Docker: it sees and manages the containers"
    uk: "Він керує Docker сервера: бачить контейнери й керує ними"
