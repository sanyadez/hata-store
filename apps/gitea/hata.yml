title:
  en: Gitea
tagline:
  en: Self-hosted software development service
  zh: 自托管软件开发服务
  ar: Git مع كوب من الشاي
  de: Git mit einem Tässchen Tee
  es: Git con una taza de té
  fr: Git avec une tasse de thé
  hu: Git egy csésze tea kíséretében
  it: Git con una tazza di tè
  ru: Git с чашечкой чая
  pl: Git z filiżanką herbaty
  pt: Git com uma xícara de chá
  sv: Git med en kopp te
  uk: Сервіс розробки програмного забезпечення на власному сервері
description:
  en: "Gitea is a painless self-hosted all-in-one software development service, it includes Git hosting, code review, team collaboration, package registry and CI/CD. It is similar to GitHub, Bitbucket and GitLab.\n\n- Code Hosting Gitea supports creating and managing repositories, browsing commit history and code files, reviewing and merging code submissions, managing collaborators, handling branches, and more. It also supports many common Git features such as tags, Cherry-pick, hooks, integrated collaboration tools, and more.\n\n- Lightweight and Fast One of Gitea's design goals is to be lightweight and fast in response. Unlike some large code hosting platforms, it remains lean, performing well in terms of speed, and is suitable for resource-limited server environments. Due to its lightweight design, Gitea has relatively low resource consumption and performs well in resource-constrained environments.\n\n- Easy Deployment and Maintenance It can be easily deployed on various servers without complex configurations or dependencies. This makes it convenient for individual developers or small teams to set up and manage their own Git services.\n\n- Security Gitea places a strong emphasis on security, offering features such as user permission management, access control lists, and more to ensure the security of code and data.\n\n- Code Review Code review supports both the Pull Request workflow and AGit workflow. Reviewers can browse code online and provide review comments or feedback. Submitters can receive review comments and respond or modify code online. Code reviews can help individuals and organizations enhance code quality.\n\n- CI/CD Gitea Actions supports CI/CD functionality, compatible with GitHub Actions. Users can write workflows in familiar YAML format and reuse a variety of existing Actions plugins. Actions plugins support downloading from any Git website.\n\n- Project Management Gitea tracks project requirements, features, and bugs through columns and issues. Issues support features like branches, tags, milestones, assignments, time tracking, due dates, dependencies, and more.\n\n- Artifact Repository Gitea supports over 20 different types of public or private software package management, including Cargo, Chef, Composer, Conan, Conda, Container, Helm, Maven, npm, NuGet, Pub, PyPI, RubyGems, Vagrant, and more.\n\n- Open Source Community Support Gitea is an open-source project based on the MIT license. It has an active open-source community that continuously develops and improves the platform. The project also actively welcomes community contributions, ensuring updates and innovation.\n\n- Multilingual Support Gitea provides interfaces in multiple languages, catering to users globally and promoting internationalization and localization."
  zh: "Gitea 是一个轻松自托管的全方位软件开发服务，包含 Git 托管、代码评审、团队协作、包注册表和 CI/CD。它类似于 GitHub、Bitbucket 和 GitLab。\n\n- 代码托管 Gitea 支持创建和管理仓库、浏览提交历史和代码文件、评审和合并代码提交、管理协作者、处理分支等。它还支持许多常见的 Git 功能，如标签、Cherry-pick、钩子、集成协作工具等。\n\n- 轻量且快速 Gitea 的设计目标之一是轻量且响应迅速。与一些大型代码托管平台不同，它保持精简，在速度方面表现良好，适合资源有限的服务器环境。由于其轻量设计，Gitea 的资源消耗相对较低，在资源受限的环境中表现出色。\n\n- 易于部署和维护 Gitea 可以轻松部署在各种服务器上，无需复杂的配置或依赖项。这使得个人开发者或小团队可以方便地设置和管理自己的 Git 服务。\n\n- 安全性 Gitea 非常重视安全性，提供了用户权限管理、访问控制列表等功能，以确保代码和数据的安全。\n\n- 代码评审 Gitea 的代码评审支持 Pull Request 工作流和 AGit 工作流。评审者可以在线浏览代码并提供评审意见或反馈。提交者可以接收评审意见并在线回应或修改代码。代码评审有助于个人和组织提升代码质量。\n\n- CI/CD Gitea Actions 支持 CI/CD 功能，兼容 GitHub Actions。用户可以使用熟悉的 YAML 格式编写工作流，并重用各种现有的 Actions 插件。Actions 插件支持从任何 Git 网站下载。\n\n- 项目管理 Gitea 通过列和问题跟踪项目需求、功能和 bug。问题支持分支、标签、里程碑、分配、时间跟踪、截止日期、依赖关系等功能。\n\n- 工件仓库 Gitea 支持超过 20 种不同类型的公共或私有软件包管理，包括 Cargo、Chef、Composer、Conan、Conda、Container、Helm、Maven、npm、NuGet、Pub、PyPI、RubyGems、Vagrant 等。\n\n- 开源社区支持 Gitea 是基于 MIT 许可证的开源项目。它拥有一个活跃的开源社区，持续开发和改进平台。该项目还积极欢迎社区贡献，确保更新和创新。\n\n- 多语言支持 Gitea 提供多语言界面，满足全球用户需求，促进国际化和本地化。"
  ar: Gitea هو حل استضافة الشفرة الخفيفة المدار من قبل المجتمع مكتوب بلغة Go.
  de: "Gitea ist eine von der Community verwaltete, leichte Code-Hosting-Lösung, die in Go geschrieben ist."
  es: Gitea es una solución de alojamiento de código ligera administrada por la comunidad escrita en Go.
  fr: "Gitea est une solution d'hébergement de code légère gérée par la communauté écrite en Go."
  hu: "A Gitea egy közösség által kezelt könnyű kódhelyezési megoldás, amelyet Go írt."
  it: Gitea è una soluzione di hosting di codice leggera gestita dalla comunità scritta in Go.
  ru: "Gitea - это легкое решение для размещения кода, управляемое сообществом, написанное на Go."
  pl: Gitea to lekka rozwiązanie do hostingu kodu zarządzane przez społeczność napisane w Go.
  pt: O Gitea é uma solução de hospedagem de código leve gerenciada pela comunidade escrita em Go.
  sv: Gitea är ett communityhanterat lätthanterat kodhostningslösning skrivet i Go.
  uk: "Gitea — простий у розгортанні сервіс «все в одному» для розробки програмного забезпечення на власному сервері. Він містить хостинг Git, рецензування коду, командну роботу, реєстр пакетів і CI/CD. Схожий на GitHub, Bitbucket і GitLab.\n\n- Хостинг коду. Gitea дає змогу створювати репозиторії й керувати ними, переглядати історію комітів і файли коду, переглядати та зливати внесені зміни, керувати співавторами, гілками тощо. Також підтримує поширені можливості Git: теги, Cherry-pick, хуки, вбудовані інструменти для співпраці та інше.\n\n- Легкий і швидкий. Одна з цілей Gitea — бути легкою й швидко відповідати. На відміну від великих платформ для хостингу коду, вона лишається компактною, добре працює за швидкістю й підходить для серверів з обмеженими ресурсами. Завдяки легкій конструкції вона споживає мало ресурсів.\n\n- Просте розгортання й обслуговування. Її легко розгорнути на різних серверах без складних налаштувань і залежностей. Тому окремим розробникам і невеликим командам зручно запускати власні сервіси Git і керувати ними.\n\n- Безпека. Gitea приділяє безпеці велику увагу: керування правами користувачів, списки контролю доступу та інші засоби захищають код і дані.\n\n- Рецензування коду. Підтримуються робочі процеси Pull Request і AGit. Рецензенти можуть переглядати код онлайн і залишати коментарі чи відгуки. Автори отримують коментарі та можуть відповідати на них або змінювати код онлайн. Рецензування допомагає людям і організаціям підвищувати якість коду.\n\n- CI/CD. Gitea Actions підтримує CI/CD і сумісна з GitHub Actions. Можна писати робочі процеси у звичному форматі YAML і використовувати безліч наявних плагінів Actions. Плагіни Actions можна завантажувати з будь-якого сайту Git.\n\n- Керування проєктами. Gitea відстежує вимоги, функції та помилки проєкту за допомогою колонок і задач. Задачі підтримують гілки, теги, віхи, призначення виконавців, облік часу, терміни, залежності та інше.\n\n- Сховище артефактів. Gitea підтримує понад 20 типів публічних і приватних реєстрів пакетів, зокрема Cargo, Chef, Composer, Conan, Conda, Container, Helm, Maven, npm, NuGet, Pub, PyPI, RubyGems, Vagrant та інші.\n\n- Підтримка спільноти з відкритим кодом. Gitea — проєкт із відкритим кодом на ліцензії MIT. Його постійно розвиває й удосконалює активна спільнота. Внески спільноти вітаються, що забезпечує оновлення та новизну.\n\n- Багатомовність. Gitea має інтерфейс багатьма мовами, тож підходить користувачам з усього світу й сприяє інтернаціоналізації та локалізації."
notes:
