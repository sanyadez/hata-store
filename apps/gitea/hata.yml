settings:
  - name: WEB_PORT
    type: port
    default: 3002
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_22
    type: port
    default: 222
    label:
      en: SSH Port
      uk: Порт SSH
    advanced: true
  - name: USER_GID
    type: text
    default: "1000"
    label:
      en: The GID (Unix group ID) of the user that runs Gitea
      uk: "GID (ідентифікатор групи Unix) користувача, від імені якого працює Gitea"
  - name: USER_UID
    type: text
    default: "1000"
    label:
      en: The UID (Unix user ID) of the user that runs Gitea
      uk: "UID (ідентифікатор користувача Unix), від імені якого працює Gitea"
