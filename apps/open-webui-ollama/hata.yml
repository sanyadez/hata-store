title: Open WebUI
tagline:
  en: User-friendly WebUI for LLMs (Formerly Ollama WebUI)
  uk: Зручний вебінтерфейс для LLM (раніше Ollama WebUI)
description:
  en: "Open WebUI is a feature-rich, user-friendly self-hosted AI platform designed for fully offline operation, supporting multiple large language model runners and API integration. Its intuitive Web interface provides powerful AI deployment capabilities, ideal for developers, researchers, and AI enthusiasts building localized intelligent applications.\n\nThe tool's core features include local model execution and Retrieval Augmented Generation (RAG). It supports Ollama and OpenAI-compatible APIs (e.g., LMStudio, GroqCloud), enabling seamless model switching and multi-model conversations. RAG enhances chat experiences through local document loading or web search integration (e.g., SearXNG, Google PSE). Granular permissions and role-based access control (RBAC) ensure security with customized user role management.\n\nIt supports Markdown and LaTeX for enriched interactions and offers hands-free voice and video call features for dynamic communication. Image generation integration (e.g., DALL-E, ComfyUI) enriches visual content, and a model builder enables creating and importing custom models via the interface. The Pipelines plugin framework supports Python plugins, extending functionality like function calling and real-time translation. The tool’s offline privacy and flexibility deliver a modern AI interaction solution.\n\n**Key Features:**\n- Local execution of Ollama and OpenAI-compatible APIs with multi-model conversations\n- RAG support with local document and web search integration (e.g., SearXNG, Google PSE)\n- Granular permissions and role-based access control (RBAC)\n- Simultaneous interaction with multiple models, leveraging their strengths\n- Image generation integration with DALL-E, ComfyUI, and more\n- Full Markdown and LaTeX support\n- Hands-free voice and video call functionality\n- Pipelines plugin framework for custom Python functionality\n\n**Learn More:**\n- [Open WebUI Official Website](https://openwebui.com)\n- [Open WebUI Documentation](https://docs.openwebui.com)\n- [Open WebUI GitHub Repository](https://github.com/open-webui/open-webui)"
  uk: "Open WebUI — багатофункціональна й зручна платформа ШІ для самостійного розгортання, створена для повністю автономної роботи. Вона підтримує кілька рушіїв великих мовних моделей та інтеграцію з API. Інтуїтивний вебінтерфейс дає потужні можливості для розгортання ШІ й підійде розробникам, дослідникам та всім, хто створює локальні інтелектуальні застосунки.\n\nГоловні можливості — локальний запуск моделей і генерація з доповненням пошуком (RAG). Платформа підтримує Ollama та API, сумісні з OpenAI (наприклад, LMStudio, GroqCloud), що дозволяє легко перемикати моделі й вести розмови з кількома моделями. RAG покращує спілкування завдяки завантаженню локальних документів або пошуку в інтернеті (наприклад, SearXNG, Google PSE). Докладні дозволи й рольовий контроль доступу (RBAC) забезпечують безпеку та гнучке керування ролями користувачів.\n\nПідтримуються Markdown і LaTeX, а також голосові й відеодзвінки без допомоги рук. Інтеграція з генерацією зображень (наприклад, DALL-E, ComfyUI) збагачує візуальний вміст, а конструктор моделей дає змогу створювати й імпортувати власні моделі просто в інтерфейсі. Фреймворк плагінів Pipelines підтримує плагіни на Python і розширює функціональність, зокрема викликом функцій та перекладом у реальному часі. Автономність, приватність і гнучкість роблять його сучасним рішенням для роботи зі ШІ.\n\n**Основні можливості:**\n- Локальний запуск Ollama та API, сумісних з OpenAI, із розмовами з кількома моделями\n- Підтримка RAG: локальні документи та пошук в інтернеті (наприклад, SearXNG, Google PSE)\n- Докладні дозволи й рольовий контроль доступу (RBAC)\n- Одночасна робота з кількома моделями, щоб використати сильні сторони кожної\n- Інтеграція з генерацією зображень: DALL-E, ComfyUI та інші\n- Повна підтримка Markdown і LaTeX\n- Голосові й відеодзвінки без допомоги рук\n- Фреймворк плагінів Pipelines для власних функцій на Python\n\n**Докладніше:**\n- [Офіційний сайт Open WebUI](https://openwebui.com)\n- [Документація Open WebUI](https://docs.openwebui.com)\n- [Репозиторій Open WebUI на GitHub](https://github.com/open-webui/open-webui)"
notes:
  en: "**IMPORTANT NOTE ON USER ROLES AND PRIVACY:**\n- **Admin Creation**: The first account created on Open WebUI gains Administrator privileges, controlling user management and system settings.\n- **User Registrations**: Subsequent sign-ups start with Pending status, requiring Administrator approval for access.\n- **Privacy and Data Security**: All your data, including login details, is locally stored on your device. Open WebUI ensures strict confidentiality and no external requests for enhanced privacy and security.\n\n| Please refer to the [official documentation](https://docs.openwebui.com) for more information.\n\n**RESOURCES USAGE NOTICE:** Please be mindful of your device resources (CPU/GPU/RAM) usage to avoid overloading that may lead to device performance degradation."
  uk: "**ВАЖЛИВО ПРО РОЛІ КОРИСТУВАЧІВ І ПРИВАТНІСТЬ:**\n- **Створення адміністратора**: перший обліковий запис, створений в Open WebUI, отримує права адміністратора, який керує користувачами та налаштуваннями системи.\n- **Реєстрація користувачів**: усі наступні реєстрації мають статус «Очікує», і для доступу потрібне схвалення адміністратора.\n- **Приватність і безпека даних**: усі ваші дані, зокрема дані для входу, зберігаються локально на вашому пристрої. Open WebUI суворо дотримується конфіденційності й не робить зовнішніх запитів.\n\n| Докладніше дивіться в [офіційній документації](https://docs.openwebui.com).\n\n**ПРО ВИКОРИСТАННЯ РЕСУРСІВ:** стежте за навантаженням на ресурси пристрою (CPU/GPU/RAM), щоб не перевантажити його — це може погіршити його роботу."
