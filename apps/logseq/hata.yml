# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Logseq
tagline:
  en: "A privacy-first, open-source platform for knowledge management and collaboration."
  zh: "A privacy-first, open-source platform for knowledge management and collaboration."
  uk: "Платформа з відкритим кодом для керування знаннями та співпраці, де на першому місці приватність."
description:
  en: "A privacy-first, open-source platform for knowledge management and collaboration."
  zh: "A privacy-first, open-source platform for knowledge management and collaboration."
  uk: "Платформа з відкритим кодом для керування знаннями та співпраці, де на першому місці приватність."
category: productivity
developer: Logseq  Team
website: https://logseq.com/
source: https://github.com/logseq/logseq
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: logseq
  port: 3000
settings:
  - name: WEB_PORT
    type: port
    default: 3325
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_12315
    type: port
    default: 12315
    label:
      en: Port 12315
      uk: Порт 12315
    advanced: true
  - name: NOTES_DIR
    type: folder
    default: "${DATA_ROOT}/Documents/Notes"
    label:
      en: Documents/Notes
      uk: Документи/Notes
    hint:
      en: Inside the app it is /notes
      uk: У застосунку вона — /notes
permissions:
  privileged:
    en: Its authors run it with full access to the server
    uk: Автори запускають його з повним доступом до сервера
