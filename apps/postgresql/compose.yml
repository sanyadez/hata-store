# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  postgresql:
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hata}"
      POSTGRES_DB: "${POSTGRES_DB:-hata}"
    image: postgres:17.4
    deploy:
      resources:
        reservations:
          memory: 2048M
    restart: unless-stopped
    ports:
      - "${PORT_5432:-5432}:5432"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/data"
        target: /var/lib/postgresql/data
