# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: PostgreSQL
tagline:
  en: "PostgreSQL is an advanced, enterprise-class, and open-source relational database system."
  zh: PostgreSQL 是一种先进的、企业级的、开源的关系型数据库系统。PostgreSQL 支持 SQL（关系型）和 JSON（非关系型）查询。
  ar: PostgreSQL هو نظام قاعدة بيانات علاقية متقدمة ومتطورة ومفتوح المصدر.
  de: "PostgreSQL ist ein fortschrittliches, unternehmensfähiges und Open-Source-Relationales-Datenbank-System."
  es: "PostgreSQL es un sistema de base de datos relacional avanzado, de clase empresarial y de código abierto."
  fr: "PostgreSQL est un système de gestion de base de données relationnelle avancé, de classe entreprise et open source."
  hu: "A PostgreSQL egy fejlett, vállalati szintű, nyílt forráskódú relációs adatbázis rendszer."
  it: "PostgreSQL è un sistema di database relazionale avanzato, di classe enterprise e open source."
  ru: "PostgreSQL - это продвинутая, корпоративного класса, открытая реляционная система управления базами данных."
  pl: "PostgreSQL to zaawansowany, przeznaczony do zastosowań przedsiębiorczych i dostępny jako oprogramowanie open source…"
  pt: "O PostgreSQL é um sistema avançado de banco de dados relacional, de classe empresarial e de código aberto."
  sv: "PostgreSQL är ett avancerat, företagsklassat och öppen källkod-relationellt databassystem."
  uk: PostgreSQL — розвинена реляційна система керування базами даних корпоративного рівня з відкритим кодом.
description:
  en: "PostgreSQL is a powerful, open source object-relational database system with over 35 years of active development that has earned it a strong reputation for reliability, feature robustness, and performance.\n\nPostgreSQL is a highly stable database backed by more than 20 years of development by the open-source community.\n\nPostgreSQL is used as a primary database for many web applications as well as mobile and analytics applications."
  zh: "PostgreSQL 是一款功能强大的开源对象关系型数据库系统，经过35年的积极开发，它以可靠性、功能稳定性和性能而闻名。\n\nPostgreSQL 是一个高度稳定的数据库，由开源社区进行了20多年的开发。\n\nPostgreSQL 被广泛应用于许多网络应用、移动应用和分析应用的主数据库。"
  ar: "PostgreSQL هو نظام قاعدة بيانات شامل وقوي مفتوح المصدر يعمل على تطويره منذ أكثر من 35 عامًا ويتمتع بسمعة قوية فيما يتعلق بالموثوقية والمرونة والأداء.\n\nPostgreSQL هو قاعدة بيانات مستقرة بشكل كبير وتم تطويرها على مدى أكثر من 20 عامًا من قبل المجتمع مفتوح المصدر.\n\nيُستخدم PostgreSQL كقاعدة بيانات رئيسية للعديد من تطبيقات الويب وتطبيقات الجوال وتطبيقات التحليل."
  de: "PostgreSQL ist ein leistungsstarkes, Open-Source-Objekt-Relationales Datenbankmanagementsystem, das seit über 35 Jahren aktiv entwickelt wird und einen starken Ruf hinsichtlich Zuverlässigkeit, Funktionsumfang und Leistung hat.\n\nPostgreSQL ist eine hochstabile Datenbank, die seit über 20 Jahren von der Open-Source-Community entwickelt wurde.\n\nPostgreSQL wird als primäre Datenbank in vielen Webanwendungen sowie in mobilen und Analyseanwendungen verwendet."
  es: "PostgreSQL es un sistema de gestión de bases de datos relacional de código abierto y potente que ha sido desarrollado activamente durante más de 35 años y ha ganado una sólida reputación en cuanto a confiabilidad, robustez de características y rendimiento.\n\nPostgreSQL es una base de datos altamente estable respaldada por más de 20 años de desarrollo realizado por la comunidad de código abierto.\n\nPostgreSQL se utiliza como base de datos principal en muchas aplicaciones web, así como en aplicaciones móviles y de análisis."
  fr: "PostgreSQL est un puissant système de gestion de bases de données relationnelles open source qui bénéficie de plus de 35 ans de développement actif, lui conférant une solide réputation en termes de fiabilité, de robustesse des fonctionnalités et de performances.\n\nPostgreSQL est une base de données hautement stable, développée depuis plus de 20 ans par la communauté open source.\n\nPostgreSQL est utilisé comme base de données principale dans de nombreuses applications web, ainsi que dans des applications mobiles et d'analyse."
  hu: "A PostgreSQL a világ egyik legnépszerűbb nyílt forráskódú objektum-relációs adatbázis rendszere. Az eredeti MySQL fejlesztői által készült és garantáltan nyílt forráskódú marad. A legtöbb felhőmegoldás része, és az alapértelmezett adatbázisrendszer a legtöbb Linux disztribúcióban.\n\nA PostgreSQL a teljesítmény, stabilitás és nyitottság értékein alapul, és a MariaDB Foundation garantálja, hogy a technikai érdemek alapján elfogadja a hozzájárulásokat. Az új funkciók között szerepel az összetett klaszterezés a Galera Cluster 4-gyel, a kompatibilitási funkciók az Oracle adatbázissal és az időszaki adattáblák, amelyek lehetővé teszik az adatok lekérdezését bármely korábbi időpontban."
  it: "PostgreSQL è un potente sistema di gestione di database relazionali open source, sviluppato attivamente da oltre 35 anni e con una solida reputazione di affidabilità, robustezza delle funzionalità e prestazioni.\n\nPostgreSQL è un database altamente stabile supportato da oltre 20 anni di sviluppo della comunità open source.\n\nPostgreSQL viene utilizzato come database primario in molte applicazioni web, nonché in applicazioni mobile e di analisi."
  ru: "PostgreSQL – мощная система управления реляционными базами данных с открытым исходным кодом, разрабатываемая на протяжении более 35 лет. Она заслужила прочную репутацию благодаря надежности, мощным функциональным возможностям и высокой производительности.\n\nPostgreSQL – это стабильная база данных, над разработкой которой работает сообщество разработчиков более 20 лет.\n\nPostgreSQL широко используется в качестве основной базы данных для множества веб-приложений, а также мобильных и аналитических приложений."
  pl: "PostgreSQL to potężny, open source'owy system zarządzania bazami danych relacyjnych, który jest rozwijany aktywnie od ponad 35 lat i cieszy się solidną reputacją pod względem niezawodności, wszechstronności funkcji oraz wydajności.\n\nPostgreSQL to bardzo stabilna baza danych, wspierana przez ponad 20 lat rozwoju przez społeczność open source.\n\nPostgreSQL jest wykorzystywany jako główna baza danych w wielu aplikacjach internetowych, a także aplikacjach mobilnych i analitycznych."
  pt: "O PostgreSQL é um poderoso sistema de gerenciamento de banco de dados relacional de código aberto, com mais de 35 anos de desenvolvimento ativo, o que lhe confere uma sólida reputação em termos de confiabilidade, robustez de recursos e desempenho.\n\nO PostgreSQL é um banco de dados altamente estável, respaldado por mais de 20 anos de desenvolvimento pela comunidade de código aberto.\n\nO PostgreSQL é usado como banco de dados principal em muitas aplicações web, bem como em aplicações móveis e de análise."
  tr: "PostgreSQL, güçlü, açık kaynaklı bir nesne ilişkisel veritabanı yönetim sistemi olup 35 yılı aşkın aktif geliştirme süreciyle güvenilirlik, özellik sağlamlığı ve performans konularında sağlam bir üne sahiptir.\n\nPostgreSQL, açık kaynak topluluğu tarafından 20 yılı aşkın bir sürede geliştirilen son derece stabil bir veritabanıdır.\n\nPostgreSQL, birçok web uygulaması yanı sıra mobil ve analitik uygulamalar için birincil veritabanı olarak kullanılmaktadır."
  ja: "PostgreSQLは、35年以上の積極的な開発を経て確かな信頼性と機能の堅牢さ、高いパフォーマンスを備えた強力なオープンソースのオブジェクトリレーショナルデータベースシステムです。\n\nPostgreSQLはオープンソースコミュニティによる20年以上の開発によって高度に安定したデータベースです。\n\nPostgreSQLは多くのWebアプリケーションやモバイルアプリケーション、分析アプリケーションで主要なデータベースとして使用されています。"
  nl: "PostgreSQL is een krachtig, open source object-relationeel databasebeheersysteem dat al meer dan 35 jaar actief wordt ontwikkeld en een sterke reputatie heeft opgebouwd op het gebied van betrouwbaarheid, functionaliteit en prestaties.\n\nPostgreSQL is een zeer stabiele database die wordt ondersteund door meer dan 20 jaar ontwikkeling door de open source gemeenschap.\n\nPostgreSQL wordt gebruikt als primaire database voor veel webapplicaties, evenals mobiele en analytische applicaties."
  ko: "PostgreSQL은 35년 이상의 뛰어난 활발한 개발을 통해 신뢰성, 기능의 견고함, 성능 측면에서 강력한 평판을 가진 강력한 오픈 소스 객체 관계형 데이터베이스 시스템입니다.\n\nPostgreSQL은 오픈 소스 커뮤니티에 의해 20년 이상 개발된 매우 안정적인 데이터베이스입니다.\n\nPostgreSQL은 많은 웹 애플리케이션 및 모바일 및 분석 애플리케이션에서 기본 데이터베이스로 사용됩니다."
  uk: "PostgreSQL — потужна об'єктно-реляційна система керування базами даних з відкритим кодом. Вона розвивається понад 35 років і заслужено має репутацію надійної, багатофункціональної та швидкої.\n\nPostgreSQL — дуже стабільна база даних, яку понад 20 років розробляє спільнота відкритого коду.\n\nPostgreSQL використовують як основну базу даних у багатьох вебзастосунках, а також у мобільних та аналітичних застосунках."
category: development
developer: "PostgreSQL Global Dev't Group"
website: https://www.postgresql.org
source: https://github.com/postgres/postgres
icon: "data:image/svg+xml;base64,"
settings:
  - name: PORT_5432
    type: port
    default: 5432
    label:
      en: Port 5432
      uk: Порт 5432
    advanced: true
  - name: POSTGRES_USER
    type: text
    default: admin
    required: true
    label:
      en: Postgres server username
      uk: "Ім'я користувача сервера Postgres"
  - name: POSTGRES_PASSWORD
    type: secret
    label:
      en: Postgres server password
      uk: Пароль користувача сервера Postgres
  - name: POSTGRES_DB
    type: text
    default: hata
    label:
      en: Postgres db
      uk: База даних Postgres
    hint:
      en: Specify the name of a database to be created on image startup.
      uk: "Назва бази даних, яка буде створена під час запуску образу."
