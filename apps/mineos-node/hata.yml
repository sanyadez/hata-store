# Apache-2.0, changed for Hata Store: see NOTICE
title: MineOS
tagline:
  en: Free and easy to use Minecraft server management tool.
  uk: Безкоштовний і простий у користуванні інструмент керування сервером Minecraft.
description:
  en: "MineOS is a server front-end to ease managing Minecraft administrative tasks. This iteration using Node.js aims to enhance previous MineOS scripts (Python-based), by leveraging the event-triggering, asyncronous model of Node.JS and websockets."
  uk: "MineOS — серверна оболонка, що полегшує адміністрування Minecraft. Ця версія на Node.js покращує попередні скрипти MineOS (на Python), використовуючи подієву асинхронну модель Node.JS і вебсокети."
notes:
  en: "Default Account\n\n| Username | Password | |----------|----------| | `mc`    | `root` |"
  uk: "Обліковий запис за замовчуванням\n\n| Ім’я користувача | Пароль | |----------|----------| | `mc`    | `root` |"
category: media
developer: hexparrot
website: https://www.mineos.net/
source: https://github.com/hexparrot/mineos-node
icon: "data:image/webp;base64,"
screenshots:
  - 1.webp
web:
  service: mineos
  port: 8443
  path: /admin/index.html
  scheme: https
settings:
  - name: WEB_PORT
    type: port
    default: 8444
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: USE_HTTPS
    type: text
    default: "true"
    label:
      en: Use https
      uk: Використовувати HTTPS
    hint:
      en: "Should the web interface use HTTPS or HTTP? Valid entries are \"true\" and \"false\" (with quotes)"
      uk: "Чи має вебінтерфейс працювати через HTTPS, чи через HTTP? Допустимі значення \"true\" і \"false\" (з лапками)."
  - name: SERVER_PORT
    type: text
    default: "8443"
    label:
      en: Server port
      uk: Порт сервера
    hint:
      en: What port should the web interface listen on? This is independent of the USE_HTTPS setting.
      uk: На якому порту слухатиме вебінтерфейс? Не залежить від налаштування USE_HTTPS.
  - name: USER_NAME
    type: text
    default: mc
    label:
      en: User name
      uk: "Ім'я користувача"
    hint:
      en: "On startup, mineos will check if an account of the name \"mc\" exists. If it does not exist, one will be created. This account, and any other created with this variable will be permitted to login to the web interface."
      uk: "Під час запуску mineos перевіряє, чи існує обліковий запис \"mc\". Якщо його немає, його буде створено. Цей запис і будь-які інші, створені через цю змінну, зможуть входити у вебінтерфейс."
  - name: USER_UID
    type: text
    default: "1000"
    label:
      en: User uid
      uk: UID користувача
    hint:
      en: "If the \"mc\" account does not already exist, when mineos creates it, it will do so with UID same as the value of the variable. If an account with this UID already exists, account creation will be aborted."
      uk: "Якщо облікового запису \"mc\" ще немає, mineos створить його з UID, що дорівнює значенню цієї змінної. Якщо обліковий запис із таким UID уже існує, створення буде скасовано."
  - name: USER_PASSWORD
    type: password
    required: true
    label:
      en: User password
      uk: Пароль користувача
    hint:
      en: "If the \"mc\" account is being created, it will use the default password \"root\" (without quotes). It is recommended to change this to something more secure."
      uk: "Якщо обліковий запис \"mc\" створюється, він отримає типовий пароль \"root\" (без лапок). Рекомендовано змінити його на щось надійніше."
permissions:
  host-files:
    en: "It reaches these places of the system: /var/games/mineos/minecraft"
    uk: "Він має доступ до цих місць системи: /var/games/mineos/minecraft"
