# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Deluge
tagline:
  en: A lightweight and free BitTorrent client.
  zh: 轻量级且免费的 BitTorrent 客户端。
  ar: عميل BitTorrent خفيف ومجاني.
  de: Ein leichtgewichtiger und kostenloser BitTorrent-Client.
  es: Un cliente ligero y gratuito de BitTorrent.
  fr: Un client BitTorrent léger et gratuit.
  hu: Egy könnyűsúlyú és ingyenes BitTorrent kliens.
  it: Un client BitTorrent leggero e gratuito.
  ru: Легковесный и бесплатный клиент BitTorrent.
  pl: Lekki i darmowy klient BitTorrent.
  pt: Um cliente BitTorrent leve e gratuito.
  sv: En lättviktig och gratis BitTorrent-klient.
  uk: Легкий і безкоштовний клієнт BitTorrent.
description:
  en: "Deluge contains the common features to BitTorrent clients such as Protocol Encryption, DHT, Local Peer Discovery (LSD), Peer Exchange (PEX), UPnP, NAT-PMP, Proxy support, Web seeds, global and per-torrent speed limits. As Deluge heavily utilises the ​libtorrent library it has a comprehensive list of the ​features provided."
  zh: Deluge 包含 BitTorrent 客户端的常见功能，如协议加密、DHT、本地对等发现（LSD）、对等交换（PEX）、UPnP、NAT-PMP、代理支持、Web 种子、全局和每个 torrent 速度限制。由于 Deluge 大量利用了 libtorrent 库，因此它具有提供的功能的详细列表。
  ar: يحتوي Deluge على الميزات الشائعة لعملاء BitTorrent مثل التشفير البروتوكولي و DHT واكتشاف الأقران المحلي (LSD) وتبادل الأقران (PEX) و UPnP و NAT-PMP ودعم الوكيل والبذور على الويب والحد العالمي والحد لكل torrent. لأن Deluge يستخدم بشكل كبير مكتبة libtorrent ، فإنه يحتوي على قائمة شاملة من الميزات المقدمة.
  de: "Deluge enthält die gängigen Funktionen von BitTorrent-Clients wie Protokollverschlüsselung, DHT, lokales Peersuche (LSD), Peeraustausch (PEX), UPnP, NAT-PMP, Proxy-Unterstützung, Web Seeds, globale und pro Torrent-Geschwindigkeitsbegrenzungen. Da Deluge die libtorrent-Bibliothek stark nutzt, verfügt es über eine umfassende Liste der bereitgestellten Funktionen."
  es: "Deluge contiene las características comunes de los clientes BitTorrent como el cifrado de protocolo, DHT, descubrimiento de pares locales (LSD), intercambio de pares (PEX), UPnP, NAT-PMP, soporte de proxy, semillas web, límites de velocidad globales y por torrent. Como Deluge utiliza intensamente la biblioteca libtorrent, tiene una lista completa de las características proporcionadas."
  fr: "Deluge contient les fonctionnalités communes aux clients BitTorrent tels que le chiffrement de protocole, DHT, découverte de pairs locaux (LSD), échange de pairs (PEX), UPnP, NAT-PMP, prise en charge des proxy, les graines Web, les limites de vitesse globales et par torrent. Comme Deluge utilise intensivement la bibliothèque libtorrent, il dispose d'une liste complète des fonctionnalités fournies."
  hu: "A Deluge a BitTorrent kliensek általános jellemzőit tartalmazza, mint például a protokoll titkosítás, a DHT, a helyi partner felfedezés (LSD), a partner cseréje (PEX), az UPnP, a NAT-PMP, a proxy támogatás, a webmagok, a globális és a torrentenkénti sebességkorlátok. Mivel a Deluge erősen kihasználja a libtorrent könyvtárat, rendelkezik egy teljes listával a szolgáltatott funkciókról."
  it: "Deluge contiene le caratteristiche comuni dei client BitTorrent come crittografia del protocollo, DHT, scoperta di peer locali (LSD), scambio di peer (PEX), UPnP, NAT-PMP, supporto proxy, semi web, limiti di velocità globali e per torrent. Poiché Deluge utilizza intensivamente la libreria libtorrent, dispone di un elenco completo delle funzionalità fornite."
  ru: "Deluge содержит общие функции клиентов BitTorrent, такие как шифрование протокола, DHT, локальный поиск пиров (LSD), обмен пиров (PEX), UPnP, NAT-PMP, поддержка прокси, веб-сиды, глобальные и ограничения скорости для каждого торрента. Поскольку Deluge сильно использует библиотеку libtorrent, он имеет полный список предоставляемых функций."
  pl: "Deluge zawiera wspólne funkcje klientów BitTorrent, takie jak szyfrowanie protokołu, DHT, lokalne odkrywanie par (LSD), wymiana par (PEX), UPnP, NAT-PMP, obsługa proxy, nasiona sieci Web, globalne i ograniczenia prędkości dla każdego torrenta. Ponieważ Deluge mocno wykorzystuje bibliotekę libtorrent, posiada pełną listę dostarczanych funkcji."
  pt: "O Deluge contém os recursos comuns dos clientes BitTorrent, como criptografia de protocolo, DHT, descoberta de pares locais (LSD), troca de pares (PEX), UPnP, NAT-PMP, suporte a proxy, sementes web, limites globais e por torrent. Como o Deluge usa intensivamente a biblioteca libtorrent, ele possui uma lista completa das funcionalidades fornecidas."
  sv: "Deluge innehåller de vanliga funktionerna hos BitTorrent-klienter, såsom protokollkryptering, DHT, lokalt parupptäckt (LSD), parbyte (PEX), UPnP, NAT-PMP, proxystöd, webblöss, globala och torrentbaserade hastighetsbegränsningar. Eftersom Deluge använder libtorrent-biblioteket intensivt har den en fullständig lista över tillhandahållna funktioner."
  uk: "Deluge має всі типові можливості клієнтів BitTorrent: шифрування протоколу, DHT, пошук локальних пірів (LSD), обмін пірами (PEX), UPnP, NAT-PMP, підтримку проксі, веб-сіди, а також загальні й окремі для кожного торента обмеження швидкості. Оскільки Deluge активно використовує бібліотеку libtorrent, він підтримує весь її широкий набір функцій."
notes:
  en: "Default Password: `deluge`\n\nDefault Accessible Path in Deluge\n\n| Name | Value | | --- | --- | | DATA Path | `/DATA` | | Downloads Path | `/DATA/Downloads` | | Media Path | `/DATA/Media` |\n\nPlease make sure you use the correct path when using Deluge."
  zh: "默认密码：`deluge`\n\nDeluge 中可访问的路径\n\n| 名称 | 值 | | --- | --- | | DATA 路径 | `/DATA` | | 下载路径 | `/DATA/Downloads` | | 媒体路径 | `/DATA/Media` |\n\n请确保在使用 Deluge 时使用正确的路径。"
  uk: "Пароль за замовчуванням: `deluge`\n\nШляхи, доступні в Deluge за замовчуванням\n\n| Назва | Значення | | --- | --- | | Шлях до DATA | `/DATA` | | Шлях до завантажень | `/DATA/Downloads` | | Шлях до медіа | `/DATA/Media` |\n\nПереконайтеся, що в Deluge ви використовуєте правильний шлях."
