web:
  service: deluge
  port: 8112
settings:
  - name: WEB_PORT
    type: port
    default: 8112
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_6881
    type: port
    default: 6881
    label:
      en: Inbound torrent traffic (TCP)
      zh: 入站 torrent 流量（TCP）
      uk: Вхідний торентний трафік (TCP)
    advanced: true
  - name: DATA_DIR
    type: folder
    default: "${DATA_ROOT}"
    label:
      en: Data folder
      uk: Тека даних
  - name: DELUGE_LOGLEVEL
    type: text
    default: error
    label:
      en: Deluge Log Level
      zh: Deluge 日志级别
      uk: Рівень журналу Deluge
