title: Deluge
tagline:
  en: A lightweight and free BitTorrent client.
  uk: Легкий і безкоштовний клієнт BitTorrent.
description:
  en: "Deluge contains the common features to BitTorrent clients such as Protocol Encryption, DHT, Local Peer Discovery (LSD), Peer Exchange (PEX), UPnP, NAT-PMP, Proxy support, Web seeds, global and per-torrent speed limits. As Deluge heavily utilises the ​libtorrent library it has a comprehensive list of the ​features provided."
  uk: "Deluge має всі типові можливості клієнтів BitTorrent: шифрування протоколу, DHT, пошук локальних пірів (LSD), обмін пірами (PEX), UPnP, NAT-PMP, підтримку проксі, веб-сіди, а також загальні й окремі для кожного торента обмеження швидкості. Оскільки Deluge активно використовує бібліотеку libtorrent, він підтримує весь її широкий набір функцій."
notes:
  en: "Default Password: `deluge`\n\nDefault Accessible Path in Deluge\n\n| Name | Value | | --- | --- | | DATA Path | `/DATA` | | Downloads Path | `/DATA/Downloads` | | Media Path | `/DATA/Media` |\n\nPlease make sure you use the correct path when using Deluge."
  uk: "Пароль за замовчуванням: `deluge`\n\nШляхи, доступні в Deluge за замовчуванням\n\n| Назва | Значення | | --- | --- | | Шлях до DATA | `/DATA` | | Шлях до завантажень | `/DATA/Downloads` | | Шлях до медіа | `/DATA/Media` |\n\nПереконайтеся, що в Deluge ви використовуєте правильний шлях."
category: media
developer: Deluge Team
website: https://deluge-torrent.org
source: https://github.com/deluge-torrent/deluge
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
web:
  service: deluge
  port: 8112
settings:
  - name: WEB_PORT
    type: port
    default: 8112
    label:
      en: Web port
      uk: Порт вебінтерфейсу
  - name: PORT_6881
    type: port
    default: 6881
    label:
      en: Inbound torrent traffic (TCP)
      uk: Вхідний торентний трафік (TCP)
    advanced: true
  - name: DATA_DIR
    type: folder
    default: "${DATA_ROOT}"
    label:
      en: Data folder
      uk: Тека даних
  - name: DELUGE_LOGLEVEL
    type: text
    default: error
    label:
      en: Deluge Log Level
      uk: Рівень журналу Deluge
