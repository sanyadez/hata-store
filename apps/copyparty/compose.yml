# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  copyparty:
    image: icewhaletech/copyparty:1.20.13
    ports:
      - "${WEB_PORT:-29708}:3923"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/w"
        target: /w
      - type: bind
        source: "${APP_DATA:-.}/confg"
        target: /cfg
    deploy:
      resources:
        reservations:
          memory: 512m
    stdin_open: true
    tty: true
    restart: unless-stopped
