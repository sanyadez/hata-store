description:
  en: "**CopyParty** is a fast, privacy-focused file sharing server using a local-first, single-file architecture, ensuring full control over data without cloud dependencies. Its intuitive interface supports offline use, with cross-platform compatibility and multi-protocol access, delivering a secure, efficient file management experience, ideal for users seeking direct data ownership and a lightweight solution.\n\nThe app's core features include accelerated resumable uploads (via the up2k protocol), ensuring reliable large file transfers, and automatic deduplication to optimize storage. It helps users organize folders and media effortlessly, with a web-based file manager that includes a built-in media indexer and thumbnail generator for quick previews. Fine-grained permission controls allow specific user access rules. The \"upload-while-downloading\" feature enhances sharing efficiency, and the zero-dependency design ensures it runs on almost any hardware.\n\nIt integrates multiple access protocols, including HTTP, WebDAV, FTP, and TFTP, supporting connections from standard web browsers, dedicated file clients, and legacy hardware (such as PSP). The app supports Docker and Python for deployment, simplifying setup across various server environments. It facilitates seamless access to local files without complex configuration. Community documentation enhances usability, and the app's simple operation and high flexibility deliver a modern local file service solution.\n\n**Key Features:**\n- Privacy-focused local file sharing\n- Zero-dependency single-file architecture\n- Accelerated resumable uploads\n- Multi-protocol support (HTTP, WebDAV, FTP, etc.)\n- Cross-platform compatibility\n- Media indexing and streaming\n- Smart deduplication\n- User permission management\n\n**Learn More:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  de: "**CopyParty** ist ein schneller, auf Datenschutz ausgerichteter Dateifreigabeserver mit einer Local-First-Einzeldateienarchitektur, die die vollständige Kontrolle über Daten ohne Cloud-Abhängigkeiten gewährleistet. Die intuitive Benutzeroberfläche unterstützt die Offline-Nutzung, bietet plattformübergreifende Kompatibilität und Multi-Protokoll-Zugriff und liefert ein sicheres, effizientes Dateiverwaltungserlebnis, ideal für Benutzer, die direkte Datenhoheit und eine leichtgewichtige Lösung suchen.\n\nZu den Kernfunktionen der App gehören beschleunigte, fortsetzbare Uploads (über das up2k-Protokoll), die zuverlässige Übertragungen großer Dateien gewährleisten, und automatische Deduplizierung zur Speicheroptimierung. Sie hilft Benutzern, Ordner und Medien mühelos zu organisieren, mit einem webbasierten Dateimanager, der einen integrierten Medienindexer und Thumbnail-Generator für schnelle Vorschauen enthält. Fein abgestufte Berechtigungssteuerungen ermöglichen spezifische Benutzerzugriffsregeln. Die Funktion „Upload während des Downloads“ verbessert die Effizienz der Freigabe, und das Zero-Dependency-Design stellt sicher, dass die App auf nahezu jeder Hardware läuft.\n\nSie integriert mehrere Zugriffsprotokolle, darunter HTTP, WebDAV, FTP und TFTP, und unterstützt Verbindungen von Standard-Webbrowsern, dedizierten Dateiclienten und älterer Hardware (wie PSP). Die App unterstützt Docker und Python für die Bereitstellung, was die Einrichtung in verschiedenen Serverumgebungen vereinfacht. Sie ermöglicht nahtlosen Zugriff auf lokale Dateien ohne komplexe Konfiguration. Die Community-Dokumentation verbessert die Benutzerfreundlichkeit, und die einfache Bedienung und hohe Flexibilität der App bieten eine moderne Lösung für lokale Dateidienste.\n\n**Hauptmerkmale:**\n- Datenschutzorientierte lokale Dateifreigabe\n- Zero-Dependency-Einzeldateienarchitektur\n- Beschleunigte, fortsetzbare Uploads\n- Multi-Protokoll-Unterstützung (HTTP, WebDAV, FTP, etc.)\n- Plattformübergreifende Kompatibilität\n- Medienindizierung und -streaming\n- Intelligente Deduplizierung\n- Benutzerberechtigungsverwaltung\n\n**Mehr erfahren:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  el: "Το **CopyParty** είναι ένας γρήγορος διακομιστής κοινής χρήσης αρχείων με έμφαση στην ιδιωτικότητα, χρησιμοποιώντας μια αρχιτεκτονική τοπικής πρώτης, ενιαίου αρχείου, εξασφαλίζοντας πλήρη έλεγχο των δεδομένων χωρίς εξαρτήσεις από το cloud. Η διαισθητική διεπαφή του υποστηρίζει χρήση εκτός σύνδεσης, με συμβατότητα πολλαπλών πλατφορμών και πρόσβαση πολλαπλών πρωτοκόλλων, προσφέροντας μια ασφαλή, αποτελεσματική εμπειρία διαχείρισης αρχείων, ιδανική για χρήστες που αναζητούν άμεση ιδιοκτησία δεδομένων και μια ελαφριά λύση.\n\nΟι βασικές λειτουργίες της εφαρμογής περιλαμβάνουν επιταχυνόμενες μεταφορτώσεις με δυνατότητα συνέχισης (μέσω του πρωτοκόλλου up2k), εξασφαλίζοντας αξιόπιστες μεταφορές μεγάλων αρχείων, και αυτόματη αποδιπλασιασμό για βελτιστοποίηση του αποθηκευτικού χώρου. Βοηθά τους χρήστες να οργανώνουν φακέλους και μέσα χωρίς κόπο, με έναν διαχειριστή αρχείων βασισμένο στο διαδίκτυο που περιλαμβάνει ενσωματωμένο ευρετήριο μέσων και γεννήτρια μικρογραφιών για γρήγορες προεπισκοπήσεις. Οι λεπτομερείς έλεγχοι αδειών επιτρέπουν συγκεκριμένους κανόνες πρόσβασης χρηστών. Η λειτουργία «μεταφόρτωση κατά τη λήψη» ενισχύει την αποτελεσματικότητα της κοινής χρήσης, και ο σχεδιασμός μηδενικών εξαρτήσεων διασφαλίζει ότι λειτουργεί σχεδόν σε οποιοδήποτε υλικό.\n\nΕνσωματώνει πολλαπλά πρωτόκολλα πρόσβασης, συμπεριλαμβανομένων των HTTP, WebDAV, FTP και TFTP, υποστηρίζοντας συνδέσεις από τυπικά προγράμματα περιήγησης ιστού, ειδικούς πελάτες αρχείων και παλαιότερο υλικό (όπως PSP). Η εφαρμογή υποστηρίζει Docker και Python για ανάπτυξη, απλοποιώντας τη ρύθμιση σε διάφορα περιβάλλοντα διακομιστών. Διευκολύνει την απρόσκοπτη πρόσβαση σε τοπικά αρχεία χωρίς πολύπλοκη διαμόρφωση. Η τεκμηρίωση της κοινότητας ενισχύει τη χρηστικότητα, και η απλή λειτουργία και η υψηλή ευελιξία της εφαρμογής προσφέρουν μια σύγχρονη λύση υπηρεσίας τοπικών αρχείων.\n\n**Βασικά Χαρακτηριστικά:**\n- Τοπική κοινή χρήση αρχείων με έμφαση στην ιδιωτικότητα\n- Αρχιτεκτονική ενιαίου αρχείου χωρίς εξαρτήσεις\n- Επιταχυνόμενες μεταφορτώσεις με δυνατότητα συνέχισης\n- Υποστήριξη πολλαπλών πρωτοκόλλων (HTTP, WebDAV, FTP, κ.λπ.)\n- Συμβατότητα πολλαπλών πλατφορμών\n- Ευρετηρίαση και ροή μέσων\n- Έξυπνη αποδιπλασιασμός\n- Διαχείριση αδειών χρήστη\n\n**Μάθετε Περισσότερα:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  fr: "**CopyParty** est un serveur de partage de fichiers rapide et axé sur la confidentialité, utilisant une architecture « local-first » à fichier unique, garantissant un contrôle total sur les données sans dépendances cloud. Son interface intuitive prend en charge l'utilisation hors ligne, avec une compatibilité multiplateforme et un accès multi-protocole, offrant une expérience de gestion de fichiers sécurisée et efficace, idéale pour les utilisateurs recherchant une propriété directe des données et une solution légère.\n\nLes fonctionnalités principales de l'application incluent des téléchargements accélérés et reprenables (via le protocole up2k), assurant des transferts de fichiers volumineux fiables, et une déduplication automatique pour optimiser le stockage. Elle aide les utilisateurs à organiser sans effort leurs dossiers et médias, grâce à un gestionnaire de fichiers basé sur le web qui comprend un indexeur de médias intégré et un générateur de vignettes pour des aperçus rapides. Des contrôles de permissions granulaires permettent des règles d'accès utilisateur spécifiques. La fonction « upload-while-downloading » (téléchargement pendant le téléchargement) améliore l'efficacité du partage, et la conception sans dépendances garantit son fonctionnement sur presque n'importe quel matériel.\n\nIl intègre plusieurs protocoles d'accès, y compris HTTP, WebDAV, FTP et TFTP, prenant en charge les connexions depuis les navigateurs web standards, les clients de fichiers dédiés et le matériel hérité (tel que la PSP). L'application prend en charge Docker et Python pour le déploiement, simplifiant la configuration dans divers environnements de serveur. Elle facilite l'accès transparent aux fichiers locaux sans configuration complexe. La documentation communautaire améliore l'utilisabilité, et le fonctionnement simple et la grande flexibilité de l'application offrent une solution moderne de service de fichiers locaux.\n\n**Fonctionnalités Clés :**\n- Partage de fichiers local axé sur la confidentialité\n- Architecture à fichier unique sans dépendances\n- Téléchargements reprenables accélérés\n- Prise en charge multi-protocole (HTTP, WebDAV, FTP, etc.)\n- Compatibilité multiplateforme\n- Indexation et streaming de médias\n- Déduplication intelligente\n- Gestion des permissions utilisateur\n\n**En savoir plus :**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  hr: "**CopyParty** je brz poslužitelj za dijeljenje datoteka usmjeren na privatnost, koristeći arhitekturu 'local-first', s jednom datotekom, osiguravajući potpunu kontrolu nad podacima bez ovisnosti o oblaku. Njegovo intuitivno sučelje podržava izvanmrežnu upotrebu, s višeplatformskom kompatibilnošću i višeprotokolnim pristupom, pružajući sigurno i učinkovito iskustvo upravljanja datotekama, idealno za korisnike koji traže izravno vlasništvo nad podacima i lagano rješenje.\n\nOsnovne značajke aplikacije uključuju ubrzane, nastavljive prijenose (putem up2k protokola), osiguravajući pouzdane prijenose velikih datoteka, i automatsku deduplikaciju za optimizaciju pohrane. Pomaže korisnicima da bez napora organiziraju mape i medije, s web-baziranim upraviteljem datoteka koji uključuje ugrađeni indeksator medija i generator sličica za brze preglede. Detaljne kontrole dopuštenja omogućuju specifična pravila pristupa korisnicima. Značajka „upload-while-downloading“ (prijenos tijekom preuzimanja) poboljšava učinkovitost dijeljenja, a dizajn bez ovisnosti osigurava da radi na gotovo svakom hardveru.\n\nIntegrira više pristupnih protokola, uključujući HTTP, WebDAV, FTP i TFTP, podržavajući veze sa standardnih web preglednika, namjenskih klijenata datoteka i starijeg hardvera (kao što je PSP). Aplikacija podržava Docker i Python za implementaciju, pojednostavljujući postavljanje u različitim poslužiteljskim okruženjima. Omogućuje besprijekoran pristup lokalnim datotekama bez složene konfiguracije. Dokumentacija zajednice poboljšava upotrebljivost, a jednostavno rukovanje i visoka fleksibilnost aplikacije pružaju moderno rješenje za lokalne datotečne usluge.\n\n**Ključne značajke:**\n- Lokalno dijeljenje datoteka usmjereno na privatnost\n- Arhitektura s jednom datotekom bez ovisnosti\n- Ubrzani, nastavljivi prijenosi\n- Podrška za više protokola (HTTP, WebDAV, FTP, itd.)\n- Višeplatformska kompatibilnost\n- Indeksiranje i streaming medija\n- Pametna deduplikacija\n- Upravljanje korisničkim dopuštenjima\n\n**Saznajte više:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  it: "**CopyParty** è un server di condivisione file veloce e attento alla privacy, che utilizza un'architettura \"local-first\" a file singolo, garantendo il pieno controllo sui dati senza dipendenze dal cloud. La sua interfaccia intuitiva supporta l'uso offline, con compatibilità multipiattaforma e accesso multi-protocollo, offrendo un'esperienza di gestione file sicura ed efficiente, ideale per gli utenti che cercano la proprietà diretta dei dati e una soluzione leggera.\n\nLe funzionalità principali dell'app includono upload ripristinabili accelerati (tramite il protocollo up2k), garantendo trasferimenti affidabili di file di grandi dimensioni, e deduplicazione automatica per ottimizzare lo storage. Aiuta gli utenti a organizzare cartelle e media senza sforzo, con un file manager basato sul web che include un indicizzatore multimediale integrato e un generatore di miniature per anteprime rapide. I controlli di autorizzazione granulari consentono regole di accesso utente specifiche. La funzione \"upload-while-downloading\" (caricamento durante il download) migliora l'efficienza della condivisione, e il design a zero dipendenze assicura che funzioni su quasi qualsiasi hardware.\n\nIntegra più protocolli di accesso, inclusi HTTP, WebDAV, FTP e TFTP, supportando connessioni da browser web standard, client di file dedicati e hardware legacy (come PSP). L'app supporta Docker e Python per la distribuzione, semplificando la configurazione in vari ambienti server. Facilita l'accesso senza interruzioni ai file locali senza configurazioni complesse. La documentazione della community migliora l'usabilità, e il funzionamento semplice e l'elevata flessibilità dell'app offrono una soluzione moderna per i servizi di file locali.\n\n**Caratteristiche principali:**\n- Condivisione file locale attenta alla privacy\n- Architettura a file singolo a zero dipendenze\n- Upload ripristinabili accelerati\n- Supporto multi-protocollo (HTTP, WebDAV, FTP, ecc.)\n- Compatibilità multipiattaforma\n- Indicizzazione e streaming multimediale\n- Deduplicazione intelligente\n- Gestione dei permessi utente\n\n**Scopri di più:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  ja: "**CopyParty** は、ローカルファーストの単一ファイルアーキテクチャを使用する、高速でプライバシー重視のファイル共有サーバーであり、クラウドへの依存なしにデータに対する完全な制御を保証します。その直感的なインターフェースはオフライン使用をサポートし、クロスプラットフォーム互換性とマルチプロトコルアクセスを備え、安全で効率的なファイル管理体験を提供します。データの直接所有権と軽量なソリューションを求めるユーザーに最適です。\n\nアプリの主要機能には、高速で再開可能なアップロード（up2kプロトコル経由）が含まれており、信頼性の高い大容量ファイル転送を保証し、ストレージを最適化するための自動重複排除も行います。組み込みのメディアインデクサーとサムネイルジェネレーターを備えたウェブベースのファイルマネージャーにより、ユーザーはフォルダーやメディアを簡単に整理し、素早くプレビューできます。きめ細かなアクセス許可制御により、特定のユーザーアクセスルールを設定できます。「ダウンロードしながらアップロード」機能は共有効率を高め、ゼロ依存設計により、ほぼすべてのハードウェアで動作します。\n\nHTTP、WebDAV、FTP、TFTPを含む複数のアクセスプロトコルを統合し、標準のウェブブラウザ、専用ファイルクライアント、レガシーハードウェア（PSPなど）からの接続をサポートします。このアプリはDockerとPythonでのデプロイメントをサポートし、さまざまなサーバー環境でのセットアップを簡素化します。複雑な設定なしでローカルファイルへのシームレスなアクセスを容易にします。コミュニティドキュメントは使いやすさを向上させ、アプリのシンプルな操作性と高い柔軟性は、最新のローカルファイルサービスソリューションを提供します。\n\n**主な機能:**\n- プライバシー重視のローカルファイル共有\n- ゼロ依存の単一ファイルアーキテクチャ\n- 高速で再開可能なアップロード\n- マルチプロトコルサポート（HTTP、WebDAV、FTPなど）\n- クロスプラットフォーム互換性\n- メディアインデックス作成とストリーミング\n- スマートな重複排除\n- ユーザー権限管理\n\n**詳細はこちら:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  ko: "**CopyParty**는 로컬 우선, 단일 파일 아키텍처를 사용하는 빠르고 개인 정보 보호에 중점을 둔 파일 공유 서버로, 클라우드 종속성 없이 데이터에 대한 완전한 제어를 보장합니다. 직관적인 인터페이스는 오프라인 사용을 지원하며, 크로스 플랫폼 호환성과 다중 프로토콜 액세스를 통해 안전하고 효율적인 파일 관리 경험을 제공하여 직접적인 데이터 소유권과 경량 솔루션을 찾는 사용자에게 이상적입니다.\n\n앱의 핵심 기능에는 가속화된 재개 가능한 업로드(up2k 프로토콜을 통해)가 포함되어 안정적인 대용량 파일 전송을 보장하며, 저장 공간을 최적화하기 위한 자동 중복 제거 기능도 있습니다. 내장된 미디어 인덱서와 썸네일 생성기가 포함된 웹 기반 파일 관리자를 통해 사용자는 폴더와 미디어를 손쉽게 정리하고 빠르게 미리 볼 수 있습니다. 세분화된 권한 제어를 통해 특정 사용자 액세스 규칙을 설정할 수 있습니다. \"다운로드 중 업로드\" 기능은 공유 효율성을 높이며, 제로 종속성 설계로 거의 모든 하드웨어에서 실행됩니다.\n\nHTTP, WebDAV, FTP, TFTP를 포함한 여러 액세스 프로토콜을 통합하여 표준 웹 브라우저, 전용 파일 클라이언트 및 레거시 하드웨어(PSP 등)의 연결을 지원합니다. 이 앱은 배포를 위해 Docker 및 Python을 지원하여 다양한 서버 환경에서 설정을 간소화합니다. 복잡한 구성 없이 로컬 파일에 대한 원활한 액세스를 용이하게 합니다. 커뮤니티 문서는 사용성을 향상시키며, 앱의 간단한 작동과 높은 유연성은 현대적인 로컬 파일 서비스 솔루션을 제공합니다.\n\n**주요 기능:**\n- 개인 정보 보호에 중점을 둔 로컬 파일 공유\n- 제로 종속성 단일 파일 아키텍처\n- 가속화된 재개 가능한 업로드\n- 다중 프로토콜 지원 (HTTP, WebDAV, FTP 등)\n- 크로스 플랫폼 호환성\n- 미디어 인덱싱 및 스트리밍\n- 스마트 중복 제거\n- 사용자 권한 관리\n\n**더 알아보기:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  nb: "**CopyParty** er en rask, personvernfokusert fildelingsserver som bruker en lokal-først, enkeltfil-arkitektur, og sikrer full kontroll over data uten skyavhengigheter. Det intuitive grensesnittet støtter offline bruk, med kryssplattformkompatibilitet og multi-protokoll tilgang, og leverer en sikker, effektiv filbehandlingsopplevelse, ideell for brukere som søker direkte dataeierskap og en lettvektsløsning.\n\nAppens kjernefunksjoner inkluderer akselererte gjenopptagbare opplastinger (via up2k-protokollen), som sikrer pålitelige store filoverføringer, og automatisk deduplisering for å optimalisere lagring. Den hjelper brukere med å organisere mapper og medier uten anstrengelse, med en nettbasert filbehandler som inkluderer en innebygd medieindekserer og miniatyrbildegenerator for raske forhåndsvisninger. Finmaskede tillatelseskontroller tillater spesifikke brukeraksessregler. Funksjonen «opplasting under nedlasting» forbedrer delingseffektiviteten, og den null-avhengige designen sikrer at den kjører på nesten all maskinvare.\n\nDen integrerer flere tilgangsprotokoller, inkludert HTTP, WebDAV, FTP og TFTP, og støtter tilkoblinger fra standard nettlesere, dedikerte filklienter og eldre maskinvare (som PSP). Appen støtter Docker og Python for distribusjon, noe som forenkler oppsettet på tvers av ulike servermiljøer. Den tilrettelegger for sømløs tilgang til lokale filer uten kompleks konfigurasjon. Fellesskapsdokumentasjon forbedrer brukervennligheten, og appens enkle betjening og høye fleksibilitet leverer en moderne lokal filløsning.\n\n**Nøkkelfunksjoner:**\n- Personvernfokusert lokal fildeling\n- Null-avhengig enkeltfil-arkitektur\n- Akselererte gjenopptagbare opplastinger\n- Multi-protokoll støtte (HTTP, WebDAV, FTP, etc.)\n- Kryssplattformkompatibilitet\n- Medieindeksering og strømming\n- Smart deduplisering\n- Brukertillatelsesadministrasjon\n\n**Lær mer:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  pt: "**CopyParty** é um servidor de partilha de ficheiros rápido e focado na privacidade, utilizando uma arquitetura de ficheiro único, \"local-first\", garantindo controlo total sobre os dados sem dependências da cloud. A sua interface intuitiva suporta o uso offline, com compatibilidade multiplataforma e acesso multi-protocolo, proporcionando uma experiência de gestão de ficheiros segura e eficiente, ideal para utilizadores que procuram propriedade direta dos dados e uma solução leve.\n\nAs principais funcionalidades da aplicação incluem uploads acelerados e retomáveis (via protocolo up2k), garantindo transferências fiáveis de ficheiros grandes, e deduplicação automática para otimizar o armazenamento. Ajuda os utilizadores a organizar pastas e multimédia sem esforço, com um gestor de ficheiros baseado na web que inclui um indexador de multimédia integrado e um gerador de miniaturas para pré-visualizações rápidas. Os controlos de permissões granulares permitem regras de acesso de utilizador específicas. A funcionalidade \"upload-while-downloading\" (carregar enquanto descarrega) melhora a eficiência da partilha, e o design de zero dependências garante que funciona em quase qualquer hardware.\n\nIntegra múltiplos protocolos de acesso, incluindo HTTP, WebDAV, FTP e TFTP, suportando ligações de navegadores web padrão, clientes de ficheiros dedicados e hardware legado (como PSP). A aplicação suporta Docker e Python para implementação, simplificando a configuração em vários ambientes de servidor. Facilita o acesso contínuo a ficheiros locais sem configuração complexa. A documentação da comunidade melhora a usabilidade, e a operação simples e alta flexibilidade da aplicação oferecem uma solução moderna de serviço de ficheiros locais.\n\n**Funcionalidades Chave:**\n- Partilha de ficheiros local focada na privacidade\n- Arquitetura de ficheiro único com zero dependências\n- Uploads acelerados e retomáveis\n- Suporte multi-protocolo (HTTP, WebDAV, FTP, etc.)\n- Compatibilidade multiplataforma\n- Indexação e streaming de multimédia\n- Deduplicação inteligente\n- Gestão de permissões de utilizador\n\n**Saber Mais:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  ru: "**CopyParty** — это быстрый, ориентированный на конфиденциальность сервер для обмена файлами, использующий архитектуру «local-first» с одним файлом, обеспечивающую полный контроль над данными без зависимостей от облака. Его интуитивно понятный интерфейс поддерживает автономное использование, кроссплатформенную совместимость и многопротокольный доступ, предоставляя безопасное и эффективное управление файлами, идеально подходящее для пользователей, стремящихся к прямому владению данными и легковесному решению.\n\nОсновные функции приложения включают ускоренную возобновляемую загрузку (через протокол up2k), обеспечивающую надежную передачу больших файлов, и автоматическую дедупликацию для оптимизации хранилища. Оно помогает пользователям без усилий организовывать папки и медиафайлы с помощью веб-менеджера файлов, который включает встроенный индексатор медиа и генератор миниатюр для быстрого предварительного просмотра. Детальный контроль разрешений позволяет устанавливать специфические правила доступа для пользователей. Функция «загрузка во время скачивания» повышает эффективность обмена, а конструкция с нулевой зависимостью гарантирует работу почти на любом оборудовании.\n\nОн интегрирует несколько протоколов доступа, включая HTTP, WebDAV, FTP и TFTP, поддерживая соединения со стандартных веб-браузеров, специализированных файловых клиентов и устаревшего оборудования (например, PSP). Приложение поддерживает Docker и Python для развертывания, упрощая настройку в различных серверных средах. Оно обеспечивает беспрепятственный доступ к локальным файлам без сложной конфигурации. Документация сообщества повышает удобство использования, а простота работы и высокая гибкость приложения обеспечивают современное решение для локальных файловых служб.\n\n**Ключевые особенности:**\n- Локальный обмен файлами с акцентом на конфиденциальность\n- Однофайловая архитектура с нулевой зависимостью\n- Ускоренная возобновляемая загрузка\n- Поддержка нескольких протоколов (HTTP, WebDAV, FTP и т. д.)\n- Кроссплатформенная совместимость\n- Индексация и потоковая передача медиа\n- Интеллектуальная дедупликация\n- Управление разрешениями пользователей\n\n**Узнать больше:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  sv: "**CopyParty** är en snabb, integritetsfokuserad filserver som använder en lokal-först, enfilsarkitektur, vilket säkerställer full kontroll över data utan molnberoenden. Dess intuitiva gränssnitt stöder offlineanvändning, med plattformsoberoende kompatibilitet och multiprotokollåtkomst, vilket ger en säker och effektiv filhanteringsupplevelse, idealisk för användare som söker direkt dataägarskap och en lättviktslösning.\n\nAppens kärnfunktioner inkluderar accelererade återupptagbara uppladdningar (via up2k-protokollet), vilket säkerställer tillförlitliga stora filöverföringar, och automatisk deduplicering för att optimera lagring. Den hjälper användare att enkelt organisera mappar och media, med en webbaserad filhanterare som inkluderar en inbyggd medieindexerare och miniatyrbildsgenerator för snabba förhandsvisningar. Finstämd behörighetskontroll möjliggör specifika användaråtkomstregler. Funktionen \"ladda upp medan du laddar ner\" förbättrar delningseffektiviteten, och den beroendefria designen säkerställer att den körs på nästan vilken hårdvara som helst.\n\nDen integrerar flera åtkomstprotokoll, inklusive HTTP, WebDAV, FTP och TFTP, och stöder anslutningar från standardwebbläsare, dedikerade filklienter och äldre hårdvara (som PSP). Appen stöder Docker och Python för distribution, vilket förenklar installationen i olika servermiljöer. Den underlättar sömlös åtkomst till lokala filer utan komplex konfiguration. Gemenskapsdokumentation förbättrar användbarheten, och appens enkla funktion och höga flexibilitet levererar en modern lösning för lokala filtjänster.\n\n**Nyckelfunktioner:**\n- Integritetsfokuserad lokal fildelning\n- Beroendefri enfilsarkitektur\n- Accelererade återupptagbara uppladdningar\n- Stöd för flera protokoll (HTTP, WebDAV, FTP, etc.)\n- Plattformsoberoende kompatibilitet\n- Medieindexering och streaming\n- Smart deduplicering\n- Användarbehörighetshantering\n\n**Läs mer:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  tr: "**CopyParty**, yerel öncelikli, tek dosyalı mimari kullanarak hızlı, gizlilik odaklı bir dosya paylaşım sunucusudur ve bulut bağımlılıkları olmadan veriler üzerinde tam kontrol sağlar. Sezgisel arayüzü çevrimdışı kullanımı destekler, çapraz platform uyumluluğu ve çok protokollü erişim ile güvenli, verimli bir dosya yönetimi deneyimi sunar; doğrudan veri sahipliği ve hafif bir çözüm arayan kullanıcılar için idealdir.\n\nUygulamanın temel özellikleri arasında hızlandırılmış, devam ettirilebilir yüklemeler (up2k protokolü aracılığıyla) bulunur, bu da güvenilir büyük dosya transferleri sağlar ve depolamayı optimize etmek için otomatik tekilleştirme yapar. Dahili medya dizinleyici ve küçük resim oluşturucu içeren web tabanlı bir dosya yöneticisi ile kullanıcıların klasörleri ve medyayı zahmetsizce düzenlemesine yardımcı olur. İnce taneli izin kontrolleri, belirli kullanıcı erişim kurallarına olanak tanır. \"İndirirken yükle\" özelliği paylaşım verimliliğini artırır ve sıfır bağımlılık tasarımı, neredeyse her donanımda çalışmasını sağlar.\n\nHTTP, WebDAV, FTP ve TFTP dahil olmak üzere birden fazla erişim protokolünü entegre eder, standart web tarayıcılarından, özel dosya istemcilerinden ve eski donanımlardan (PSP gibi) bağlantıları destekler. Uygulama, dağıtım için Docker ve Python'ı destekleyerek çeşitli sunucu ortamlarında kurulumu basitleştirir. Karmaşık yapılandırma olmadan yerel dosyalara sorunsuz erişimi kolaylaştırır. Topluluk belgeleri kullanılabilirliği artırır ve uygulamanın basit çalışması ve yüksek esnekliği modern bir yerel dosya hizmeti çözümü sunar.\n\n**Temel Özellikler:**\n- Gizlilik odaklı yerel dosya paylaşımı\n- Sıfır bağımlılıklı tek dosyalı mimari\n- Hızlandırılmış, devam ettirilebilir yüklemeler\n- Çok protokollü destek (HTTP, WebDAV, FTP, vb.)\n- Çapraz platform uyumluluğu\n- Medya dizinleme ve akış\n- Akıllı tekilleştirme\n- Kullanıcı izin yönetimi\n\n**Daha Fazla Bilgi Edinin:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  zh: "**CopyParty** 是一款快速、注重隐私的文件共享服务器，采用本地优先、单文件架构，确保对数据拥有完全控制权，且不依赖云服务。其直观的界面支持离线使用，具备跨平台兼容性和多协议访问能力，提供安全、高效的文件管理体验，是寻求直接数据所有权和轻量级解决方案的用户的理想选择。\n\n该应用的核心功能包括加速可恢复上传（通过 up2k 协议），确保可靠的大文件传输，以及自动去重以优化存储。它通过一个基于网络的 文件管理器帮助用户轻松组织文件夹和媒体，该管理器内置媒体索引器和缩略图生成器，可实现快速预览。细粒度的权限控制允许设置特定的用户访问规则。“边下载边上传”功能提高了共享效率，零依赖设计确保它几乎可以在任何硬件上运行。\n\n它集成了多种访问协议，包括 HTTP、WebDAV、FTP 和 TFTP，支持来自标准网页浏览器、专用文件客户端和旧硬件（如 PSP）的连接。该应用支持 Docker 和 Python 部署，简化了各种服务器环境的设置。它无需复杂配置即可实现对本地文件的无缝访问。社区文档增强了可用性，该应用简单的操作和高度的灵活性提供了一个现代化的本地文件服务解决方案。\n\n**主要功能：**\n- 注重隐私的本地文件共享\n- 零依赖的单文件架构\n- 加速可恢复上传\n- 多协议支持（HTTP、WebDAV、FTP 等）\n- 跨平台兼容性\n- 媒体索引和流媒体\n- 智能去重\n- 用户权限管理\n\n**了解更多：**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  uk: "**CopyParty** — швидкий файловий сервер, що дбає про приватність. Він працює локально й складається з одного файлу, тож ви повністю контролюєте свої дані без хмарних залежностей. Зручний інтерфейс працює й офлайн, сервер підтримує різні платформи та кілька протоколів доступу, а керувати файлами безпечно й ефективно. Це добрий вибір для тих, хто хоче володіти своїми даними та шукає легке рішення.\n\nСеред головних можливостей — прискорене завантаження з відновленням (через протокол up2k), яке надійно передає великі файли, та автоматична дедуплікація для економії місця. Вебпроглядач файлів має вбудований індексатор медіа й генератор мініатюр для швидкого перегляду, тож теки й медіа легко впорядкувати. Докладні права доступу дають змогу налаштувати правила для окремих користувачів. Функція «завантаження під час скачування» пришвидшує обмін файлами, а відсутність залежностей дозволяє запускати сервер майже на будь-якому обладнанні.\n\nСервер підтримує кілька протоколів, зокрема HTTP, WebDAV, FTP і TFTP, тож підключатися можна зі звичайних браузерів, спеціальних файлових клієнтів і навіть зі старих пристроїв (наприклад, PSP). Його можна розгорнути через Docker або Python, що спрощує налаштування в різних серверних середовищах. Доступ до локальних файлів не потребує складної конфігурації. Документація спільноти полегшує користування, а проста робота й гнучкість роблять CopyParty сучасним рішенням для локального файлового сервісу.\n\n**Основні можливості:**\n- Локальний обмін файлами з увагою до приватності\n- Один файл без залежностей\n- Прискорене завантаження з відновленням\n- Підтримка кількох протоколів (HTTP, WebDAV, FTP тощо)\n- Робота на різних платформах\n- Індексація та потокове відтворення медіа\n- Розумна дедуплікація\n- Керування правами користувачів\n\n**Докладніше:**\n- [Репозиторій CopyParty на GitHub](https://github.com/9001/copyparty)"
notes:
  en: "## Default Account\n\n## Modify Username and Password\n\nTo modify the default username and password, you can configure it by mapping the `/cfg/` path and adding a `copyparty.conf` configuration file in that directory.\n\nFor specific configuration, please refer to: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  de: "## Standardkonto\n\n## Benutzername und Passwort ändern\n\nUm den Standard-Benutzernamen und das Passwort zu ändern, können Sie dies konfigurieren, indem Sie den Pfad `/cfg/` zuordnen und eine Konfigurationsdatei `copyparty.conf` in diesem Verzeichnis hinzufügen.\n\nFür die spezifische Konfiguration lesen Sie bitte: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  el: "## Προεπιλεγμένος λογαριασμός\n\n## Τροποποίηση ονόματος χρήστη και κωδικού πρόσβασης\n\nΓια να τροποποιήσετε το προεπιλεγμένο όνομα χρήστη και κωδικό πρόσβασης, μπορείτε να το διαμορφώσετε αντιστοιχίζοντας τη διαδρομή `/cfg/` και προσθέτοντας ένα αρχείο διαμόρφωσης `copyparty.conf` σε αυτόν τον κατάλογο.\n\nΓια συγκεκριμένη διαμόρφωση, ανατρέξτε στο: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  fr: "## Compte par défaut\n\n## Modifier le nom d'utilisateur et le mot de passe\n\nPour modifier le nom d'utilisateur et le mot de passe par défaut, vous pouvez le configurer en mappant le chemin `/cfg/` et en ajoutant un fichier de configuration `copyparty.conf` dans ce répertoire.\n\nPour une configuration spécifique, veuillez vous référer à : [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  hr: "## Zadani račun\n\n## Promjena korisničkog imena i lozinke\n\nZa promjenu zadanog korisničkog imena i lozinke, to možete konfigurirati mapiranjem putanje `/cfg/` i dodavanjem konfiguracijske datoteke `copyparty.conf` u taj direktorij.\n\nZa specifičnu konfiguraciju, molimo pogledajte: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  it: "## Account predefinito\n\n## Modifica nome utente e password\n\nPer modificare il nome utente e la password predefiniti, è possibile configurarlo mappando il percorso `/cfg/` e aggiungendo un file di configurazione `copyparty.conf` in quella directory.\n\nPer la configurazione specifica, fare riferimento a: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  ja: "## デフォルトアカウント\n\n## ユーザー名とパスワードの変更\n\nデフォルトのユーザー名とパスワードを変更するには、`/cfg/` パスをマッピングし、そのディレクトリに `copyparty.conf` 設定ファイルを追加することで設定できます。\n\n具体的な設定については、以下を参照してください：[example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  ko: "## 기본 계정\n\n## 사용자 이름 및 비밀번호 수정\n\n기본 사용자 이름과 비밀번호를 수정하려면 `/cfg/` 경로를 매핑하고 해당 디렉토리에 `copyparty.conf` 구성 파일을 추가하여 구성할 수 있습니다.\n\n자세한 구성은 다음을 참조하십시오: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  nb: "## Standardkonto\n\n## Endre brukernavn og passord\n\nFor å endre standard brukernavn og passord, kan du konfigurere dette ved å mappe `/cfg/`-banen og legge til en `copyparty.conf`-konfigurasjonsfil i den katalogen.\n\nFor spesifikk konfigurasjon, se: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  pt: "## Conta Padrão\n\n## Modificar Nome de Utilizador e Palavra-passe\n\nPara modificar o nome de utilizador e a palavra-passe predefinidos, pode configurá-lo mapeando o caminho `/cfg/` e adicionando um ficheiro de configuração `copyparty.conf` nesse diretório.\n\nPara a configuração específica, consulte: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  ru: "## Учетная запись по умолчанию\n\n## Изменение имени пользователя и пароля\n\nЧтобы изменить имя пользователя и пароль по умолчанию, вы можете настроить это, сопоставив путь `/cfg/` и добавив файл конфигурации `copyparty.conf` в этот каталог.\n\nПодробную информацию о конфигурации см. здесь: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  sv: "## Standardkonto\n\n## Ändra användarnamn och lösenord\n\nFör att ändra standardanvändarnamn och lösenord kan du konfigurera detta genom att mappa sökvägen `/cfg/` och lägga till en konfigurationsfil `copyparty.conf` i den katalogen.\n\nFör specifik konfiguration, se: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  tr: "## Varsayılan Hesap\n\n## Kullanıcı Adı ve Parolayı Değiştirme\n\nVarsayılan kullanıcı adını ve parolayı değiştirmek için, `/cfg/` yolunu eşleyerek ve bu dizine bir `copyparty.conf` yapılandırma dosyası ekleyerek yapılandırabilirsiniz.\n\nSpesifik yapılandırma için lütfen şuraya bakın: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  zh: "## 默认账户\n\n## 修改用户名和密码\n\n如需修改默认用户名和密码，可以通过映射 `/cfg/` 路径，并在该目录中添加 `copyparty.conf` 配置文件进行配置。\n\n具体配置请参考：[example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  uk: "## Обліковий запис за замовчуванням\n\n## Як змінити ім'я користувача й пароль\n\nЩоб змінити ім'я користувача й пароль за замовчуванням, прив'яжіть шлях `/cfg/` і додайте в цю теку файл конфігурації `copyparty.conf`.\n\nДокладніше про налаштування: [приклад](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
