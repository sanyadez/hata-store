# Apache-2.0, changed for Hata Store: see NOTICE
title: CopyParty
tagline:
  en: "A simple, private file server."
  uk: Простий приватний файловий сервер.
description:
  en: "**CopyParty** is a fast, privacy-focused file sharing server using a local-first, single-file architecture, ensuring full control over data without cloud dependencies. Its intuitive interface supports offline use, with cross-platform compatibility and multi-protocol access, delivering a secure, efficient file management experience, ideal for users seeking direct data ownership and a lightweight solution.\n\nThe app's core features include accelerated resumable uploads (via the up2k protocol), ensuring reliable large file transfers, and automatic deduplication to optimize storage. It helps users organize folders and media effortlessly, with a web-based file manager that includes a built-in media indexer and thumbnail generator for quick previews. Fine-grained permission controls allow specific user access rules. The \"upload-while-downloading\" feature enhances sharing efficiency, and the zero-dependency design ensures it runs on almost any hardware.\n\nIt integrates multiple access protocols, including HTTP, WebDAV, FTP, and TFTP, supporting connections from standard web browsers, dedicated file clients, and legacy hardware (such as PSP). The app supports Docker and Python for deployment, simplifying setup across various server environments. It facilitates seamless access to local files without complex configuration. Community documentation enhances usability, and the app's simple operation and high flexibility deliver a modern local file service solution.\n\n**Key Features:**\n- Privacy-focused local file sharing\n- Zero-dependency single-file architecture\n- Accelerated resumable uploads\n- Multi-protocol support (HTTP, WebDAV, FTP, etc.)\n- Cross-platform compatibility\n- Media indexing and streaming\n- Smart deduplication\n- User permission management\n\n**Learn More:**\n- [CopyParty GitHub Repository](https://github.com/9001/copyparty)"
  uk: "**CopyParty** — швидкий файловий сервер, що дбає про приватність. Він працює локально й складається з одного файлу, тож ви повністю контролюєте свої дані без хмарних залежностей. Зручний інтерфейс працює й офлайн, сервер підтримує різні платформи та кілька протоколів доступу, а керувати файлами безпечно й ефективно. Це добрий вибір для тих, хто хоче володіти своїми даними та шукає легке рішення.\n\nСеред головних можливостей — прискорене завантаження з відновленням (через протокол up2k), яке надійно передає великі файли, та автоматична дедуплікація для економії місця. Вебпроглядач файлів має вбудований індексатор медіа й генератор мініатюр для швидкого перегляду, тож теки й медіа легко впорядкувати. Докладні права доступу дають змогу налаштувати правила для окремих користувачів. Функція «завантаження під час скачування» пришвидшує обмін файлами, а відсутність залежностей дозволяє запускати сервер майже на будь-якому обладнанні.\n\nСервер підтримує кілька протоколів, зокрема HTTP, WebDAV, FTP і TFTP, тож підключатися можна зі звичайних браузерів, спеціальних файлових клієнтів і навіть зі старих пристроїв (наприклад, PSP). Його можна розгорнути через Docker або Python, що спрощує налаштування в різних серверних середовищах. Доступ до локальних файлів не потребує складної конфігурації. Документація спільноти полегшує користування, а проста робота й гнучкість роблять CopyParty сучасним рішенням для локального файлового сервісу.\n\n**Основні можливості:**\n- Локальний обмін файлами з увагою до приватності\n- Один файл без залежностей\n- Прискорене завантаження з відновленням\n- Підтримка кількох протоколів (HTTP, WebDAV, FTP тощо)\n- Робота на різних платформах\n- Індексація та потокове відтворення медіа\n- Розумна дедуплікація\n- Керування правами користувачів\n\n**Докладніше:**\n- [Репозиторій CopyParty на GitHub](https://github.com/9001/copyparty)"
notes:
  en: "## Default Account\n\n## Modify Username and Password\n\nTo modify the default username and password, you can configure it by mapping the `/cfg/` path and adding a `copyparty.conf` configuration file in that directory.\n\nFor specific configuration, please refer to: [example](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
  uk: "## Обліковий запис за замовчуванням\n\n## Як змінити ім'я користувача й пароль\n\nЩоб змінити ім'я користувача й пароль за замовчуванням, прив'яжіть шлях `/cfg/` і додайте в цю теку файл конфігурації `copyparty.conf`.\n\nДокладніше про налаштування: [приклад](https://github.com/9001/copyparty/blob/hovudstraum/docs/example.conf)"
