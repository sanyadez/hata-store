# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
title:
  en: Clumoove
  de: Clumoove
tagline:
  en: Self-hosted cloud data migration & sync manager
  de: Self-hosted Cloud-Datenmigration & Synchronisation
  uk: Менеджер міграції та синхронізації хмарних даних для власного сервера
description:
  en: "Clumoove is a modern, self-hosted cloud data migration and synchronization platform for files, calendars, and contacts.\n\nEasily connect, transfer, and synchronize data between cloud storage providers including Nextcloud, Google Drive, Dropbox, OneDrive, HiDrive, S3, WebDAV, SMB, SFTP, FTP, Immich, Seafile, Koofr, MEGA, and local storage.\n\nKey Features:\n- Zero-disk streaming transfers (no local temporary storage retention during migration)\n- Multi-threaded background migrations and cron-based synchronization schedules\n- Robust 3-way hash integrity verification & flexible conflict resolution\n- Integrated cloud file manager with multi-format previews and thumbnails\n- Multi-channel notification delivery (Gotify, ntfy, Telegram, Discord, Email)\n- Enterprise-grade security with AES-256-GCM encryption, TOTP 2FA, and audit logging"
  de: "Clumoove ist eine moderne, selbstgehostete Plattform zur Migration und Synchronisation von Cloud-Daten für Dateien, Kalender und Kontakte.\n\nVerbinden, übertragen und synchronisieren Sie Ihre Daten mühelos zwischen Anbietern wie Nextcloud, Google Drive, Dropbox, OneDrive, HiDrive, S3, WebDAV, SMB, SFTP, FTP, Immich, Seafile, Koofr, MEGA und lokalem Speicher.\n\nHauptfunktionen:\n- Streaming-Übertragungen im RAM ohne Zwischenspeichern auf der Festplatte\n- Parallele Hintergrund-Migrationen und automatisierte Cron-Synchronisationszeitpläne\n- 3-Wege-Hash-Integritätsprüfung & anpassbare Konfliktlösungsstrategien\n- Integrierter Cloud-Dateimanager mit Vorschauen und Thumbnail-Unterstützung\n- Benachrichtigungen über mehrere Kanäle (Gotify, ntfy, Telegram, Discord, E-Mail)\n- Höchste Sicherheit durch AES-256-GCM-Verschlüsselung, 2FA (TOTP) und Audit-Logs"
  uk: "Clumoove — сучасна платформа для міграції та синхронізації хмарних даних: файлів, календарів і контактів.\n\nЛегко підключайте сховища, переносьте та синхронізуйте дані між ними: Nextcloud, Google Drive, Dropbox, OneDrive, HiDrive, S3, WebDAV, SMB, SFTP, FTP, Immich, Seafile, Koofr, MEGA і локальне сховище.\n\nОсновні можливості:\n- Потокове перенесення без запису на диск (під час міграції локально нічого тимчасово не зберігається)\n- Багатопотокові фонові міграції та синхронізація за розкладом cron\n- Надійна тристороння перевірка цілісності за хешами та гнучке розв’язання конфліктів\n- Вбудований файловий менеджер хмари з переглядом різних форматів і мініатюрами\n- Сповіщення через різні канали (Gotify, ntfy, Telegram, Discord, пошта)\n- Захист корпоративного рівня: шифрування AES-256-GCM, двофакторна автентифікація TOTP і журнал аудиту"
