# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  frontend:
    image: ghcr.io/xxroxxerxx/clumoove-frontend:v0.18.0@sha256:74e6cce4f2a2f52937b27b48a0137abd4be40d534556785cb579e0f464ba6888
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8380}:3000"
    environment:
      CLUMOOVE_API_URL: ""
    depends_on:
      - api-backend
    networks:
      clumoove-network:
        aliases:
          - clumoove-frontend
  api-backend:
    image: ghcr.io/xxroxxerxx/clumoove-api:v0.18.0@sha256:d9c34a1c6db8c7ffbeb942cffae849796a9c4eab267d8af2a7d1eb75c932b9bc
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://clumoove:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres-db:5432/cloud_migration_db?sslmode=disable"
      REDIS_URL: redis://:clumoove_secure_redis_pass@redis-queue:6379
      PORT: "8000"
      ENCRYPTION_SECRET_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?set JWT_SECRET_KEY}"
      TRUSTED_PROXY: "1"
      LOCAL_STORAGE_ROOT: /clumoove
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/storage"
        target: /clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      clumoove-network:
        aliases:
          - clumoove-api
  migration-worker:
    image: ghcr.io/xxroxxerxx/clumoove-worker:v0.18.0@sha256:76ea62f213b117a66083a1414704fdde3f40216231ce2a69f3a396595c85b405
    restart: unless-stopped
    command:
      - /app/worker
    environment:
      DATABASE_URL: "postgres://clumoove:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres-db:5432/cloud_migration_db?sslmode=disable"
      REDIS_URL: redis://:clumoove_secure_redis_pass@redis-queue:6379
      ENCRYPTION_SECRET_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      LOCAL_STORAGE_ROOT: /clumoove
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/storage"
        target: /clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      clumoove-network:
        aliases:
          - clumoove-worker
  postgres-db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    command:
      - postgres
      - "-c"
      - max_connections=300
    environment:
      POSTGRES_USER: clumoove
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: cloud_migration_db
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/postgres"
        target: /var/lib/postgresql/data
    networks:
      - clumoove-network
  redis-queue:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: "redis-server --appendonly yes --requirepass \"clumoove_secure_redis_pass\" --bind 0.0.0.0"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/redis"
        target: /data
    networks:
      - clumoove-network
networks:
  clumoove-network:
    driver: bridge
