# Apache-2.0, changed for Hata Store: see NOTICE
services:
  frontend:
    image: ghcr.io/xxroxxerxx/clumoove-frontend:v0.19.0@sha256:8fbdb27158f4cfaabccf5b7f5f5866686dc3fb5e01bd40997f080b4facd6385a
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8380}:3000"
    environment:
      CLUMOOVE_API_URL: ""
    depends_on:
      - api-backend
    networks:
      clumoove-network:
        aliases:
          - clumoove-frontend
  api-backend:
    image: ghcr.io/xxroxxerxx/clumoove-api:v0.19.0@sha256:d5a30c51c5ac6684e6afc399ca5ab845338bc06ab14cc3873bdbd52e2d3478cf
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://clumoove:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres-db:5432/cloud_migration_db?sslmode=disable"
      REDIS_URL: redis://:clumoove_secure_redis_pass@redis-queue:6379
      PORT: "8000"
      ENCRYPTION_SECRET_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?set JWT_SECRET_KEY}"
      TRUSTED_PROXY: "1"
      LOCAL_STORAGE_ROOT: /clumoove
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/storage"
        target: /clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      clumoove-network:
        aliases:
          - clumoove-api
  migration-worker:
    image: ghcr.io/xxroxxerxx/clumoove-worker:v0.19.0@sha256:680ba9935621eb032b6abd5d0d25472eddd2738222f35778fce86914d6a47662
    restart: unless-stopped
    command:
      - /app/worker
    environment:
      DATABASE_URL: "postgres://clumoove:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres-db:5432/cloud_migration_db?sslmode=disable"
      REDIS_URL: redis://:clumoove_secure_redis_pass@redis-queue:6379
      ENCRYPTION_SECRET_KEY: "${DB_PASSWORD:?set DB_PASSWORD}"
      LOCAL_STORAGE_ROOT: /clumoove
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/storage"
        target: /clumoove
    depends_on:
      - postgres-db
      - redis-queue
    networks:
      clumoove-network:
        aliases:
          - clumoove-worker
  postgres-db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    command:
      - postgres
      - "-c"
      - max_connections=300
    environment:
      POSTGRES_USER: clumoove
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: cloud_migration_db
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/postgres"
        target: /var/lib/postgresql/data
    networks:
      - clumoove-network
  redis-queue:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: "redis-server --appendonly yes --requirepass \"clumoove_secure_redis_pass\" --bind 0.0.0.0"
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/redis"
        target: /data
    networks:
      - clumoove-network
networks:
  clumoove-network:
    driver: bridge
