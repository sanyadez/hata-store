# Apache-2.0, changed for Hata Store: see NOTICE
title: Netdata
tagline:
  en: Real-time Performance Monitoring
  uk: Моніторинг продуктивності в реальному часі
description:
  en: Netdata is a real-time performance and health monitoring solution that helps you visualize and understand the behavior of your systems.
  uk: "Netdata — рішення для моніторингу продуктивності та стану систем у реальному часі, яке допомагає наочно побачити й зрозуміти, як поводяться ваші системи."
category: productivity
developer: f4bio
website: https://www.netdata.cloud
source: https://github.com/netdata/netdata
icon: "data:image/svg+xml;base64,"
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
web:
  service: netdata
  port: 19999
settings:
  - name: WEB_PORT
    type: port
    default: 19999
    label:
      en: Web port
      uk: Порт вебінтерфейсу
permissions:
  host-pid:
    en: It sees the processes of the server
    uk: Він бачить процеси сервера
  docker:
    en: "It controls the server's Docker: it sees and manages the containers"
    uk: "Він керує Docker сервера: бачить контейнери й керує ними"
  capabilities:
    en: "It asks for extra rights of the system: SYS_PTRACE, SYS_ADMIN"
    uk: "Він просить додаткових прав у системі: SYS_PTRACE, SYS_ADMIN"
  host-files:
    en: "It reaches these places of the system: /etc/passwd, /etc/group, /proc, /sys, /etc/os-release"
    uk: "Він має доступ до цих місць системи: /etc/passwd, /etc/group, /proc, /sys, /etc/os-release"
