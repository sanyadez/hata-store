# Apache-2.0, changed for Hata Store: see NOTICE
services:
  ddns-go:
    image: jeessy/ddns-go:v6.17.7
    deploy:
      resources:
        reservations:
          memory: 32M
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /root
    ports:
      - "${WEB_PORT:-9876}:9876"
