title: Joplin Server
tagline:
  en: Sync for the Joplin notes apps, on your own server
  uk: Синхронізація нотаток Joplin на власному сервері
description:
  en: >
    Joplin is a notes and to-do app for phones and computers. This server keeps the notes of every
    device in step, shares notebooks with other people and publishes a note as a web page — with no
    Dropbox or OneDrive in between.
  uk: >
    Joplin — застосунок для нотаток і справ на телефонах і комп'ютерах. Цей сервер синхронізує
    нотатки між усіма пристроями, ділиться блокнотами з іншими людьми й публікує нотатку як
    вебсторінку — без Dropbox чи OneDrive посередині.
notes:
  en: >
    Sign in the first time as **admin@localhost** with the password **admin** and change both. In
    the Joplin apps choose "Joplin Server" for sync and give the address the server is opened at.
  uk: >
    Уперше увійдіть як **admin@localhost** з паролем **admin** і змініть обидва. У застосунках
    Joplin виберіть для синхронізації «Joplin Server» і вкажіть адресу, за якою відкривається
    сервер.
category: productivity
developer: Laurent Cozic
website: https://joplinapp.org
source: https://github.com/laurent22/joplin
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
web:
  service: app
  port: 22300
settings:
  - name: WEB_PORT
    type: port
    default: 22300
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: DB_PASSWORD
    type: secret
    label: { en: Database password, uk: Пароль бази даних }
