services:
  app:
    image: joplin/server:3.7.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${WEB_PORT:-22300}:22300
    environment:
      APP_PORT: 22300
      APP_BASE_URL: ${APP_URL:-http://localhost:22300}
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}

  db:
    image: postgres:16.15
    restart: unless-stopped
    volumes:
      - ${APP_DATA:-.}/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joplin -d joplin"]
      interval: 5s
      timeout: 5s
      retries: 30
