# From the CasaOS AppStore (https://github.com/IceWhaleTech/CasaOS-AppStore, Apache-2.0), changed for Hata Store.
services:
  openhab:
    environment:
      CRYPTO_POLICY: "${CRYPTO_POLICY:-unlimited}"
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
    image: openhab/openhab:5.1.4
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
      - type: bind
        source: "${APP_DATA:-.}/addons"
        target: /openhab/addons
      - type: bind
        source: "${APP_DATA:-.}/conf"
        target: /openhab/conf
      - type: bind
        source: "${APP_DATA:-.}/userdata"
        target: /openhab/userdata
