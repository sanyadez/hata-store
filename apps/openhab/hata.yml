title:
  en: OpenHAB
tagline:
  en: Empowering the smart home
  zh: 助力智能家居
  ar: تمكين البيت الذكي
  de: Stärkung des Smart Home
  es: Empoderamiento del hogar inteligente
  fr: Renforcer la maison intelligente
  hu: A okos otthon erősítése
  it: Potenziamento della casa intelligente
  ru: Усиление умного дома
  pl: Wzmocnienie inteligentnego domu
  pt: Empoderando o lar inteligente
  sv: Stärkning av smart hem
  uk: Розумний дім у ваших руках
description:
  en: "The open Home Automation Bus (openHAB, pronounced ˈəʊpənˈhæb) is an open source, technology agnostic home automation platform which runs as the center of your smart home! Its ability to integrate a multitude of other devices and systems. openHAB includes other home automation systems, (smart) devices and other technologies into a single solution. To provide a uniform user interface and a common approach to automation rules across the entire system, regardless of the number of manufacturers and sub-systems involved. Giving you the most flexible tool available to make almost any home automation wish come true; if you can think it, odds are that you can implement it with openHAB."
  zh: 开放式家庭自动化总线（openHAB，发音为ˈəʊpənˈhæb）是一个开源的，技术不可知的家庭自动化平台，它作为智能家居的中心运行！ 它能够将多种其他设备和系统集成到一个单一的解决方案中。 为了在整个系统中提供统一的用户界面和通用的自动化规则方法，无论涉及的制造商和子系统的数量如何。 为您提供最灵活的工具，使几乎任何家庭自动化愿望成真; 如果您能想到，那么您可以用openHAB实现它。
  ar: يعمل open Home Automation Bus (openHAB، يقرأ ˈəʊpənˈhæb) كمنصة للتحكم في الأجهزة المنزلية المفتوحة المصدر والتي لا تعتمد على أي تقنية معينة وتعمل كمركز للمنزل الذكي الخاص بك! قدرته على دمج العديد من الأجهزة والأنظمة الأخرى. يتضمن openHAB أنظمة التحكم في الأجهزة المنزلية الأخرى والأجهزة والتقنيات الأخرى في حل واحد. لتوفير واجهة مستخدم واحدة ومنهجية موحدة لقواعد التحكم عبر النظام بأكمله بغض النظر عن عدد المصنعين والأنظمة الفرعية المتضمنة. يمنحك أداة أكثر مرونة متاحة لتحقيق أي رغبة في التحكم في المنزل تقريبًا؛ إذا كنت تستطيع التفكير في ذلك، فالأرجح أنك يمكنك تنفيذها مع openHAB.
  de: "Der offene Heimautomatisierungsbus (openHAB, ausgesprochen ˈəʊpənˈhæb) ist eine quelloffene, technologieunabhängige Heimautomatisierungsplattform, die als Mittelpunkt Ihres Smart Homes läuft! Seine Fähigkeit, eine Vielzahl anderer Geräte und Systeme zu integrieren. openHAB integriert andere Heimautomatisierungssysteme, (intelligente) Geräte und andere Technologien in eine einzige Lösung. Um eine einheitliche Benutzeroberfläche und einen gemeinsamen Ansatz für Automatisierungsregeln über das gesamte System hinweg zu bieten, unabhängig von der Anzahl der Hersteller und Teilsysteme. Geben Sie Ihnen das flexibelste Werkzeug, um fast jeden Wunsch zur Heimautomatisierung wahr werden zu lassen; Wenn Sie es denken können, ist es wahrscheinlich, dass Sie es mit openHAB umsetzen können."
  es: "El open Home Automation Bus (openHAB, pronunciado ˈəʊpənˈhæb) es una plataforma de automatización doméstica de código abierto y tecnología agnóstica que funciona como el centro de su hogar inteligente. ¡Su capacidad para integrar una multitud de otros dispositivos y sistemas. openHAB incluye otros sistemas de automatización doméstica, dispositivos (inteligentes) y otras tecnologías en una sola solución. Para proporcionar una interfaz de usuario uniforme y un enfoque común a las reglas de automatización a lo largo de todo el sistema, independientemente del número de fabricantes y sub-sistemas involucrados. Dándote la herramienta más flexible disponible para hacer realidad casi cualquier deseo de automatización doméstica; si puedes pensar en ello, es probable que puedas implementarlo con openHAB."
  fr: "Le bus d'automatisation domestique open (openHAB, prononcé ˈəʊpənˈhæb) est une plate-forme d'automatisation domestique open source et technologie agnostique qui fonctionne comme le centre de votre maison intelligente. Sa capacité à intégrer une multitude d'autres appareils et systèmes. openHAB inclut d'autres systèmes d'automatisation domestique, (intelligents) appareils et autres technologies dans une seule solution. Pour fournir une interface utilisateur uniforme et une approche commune aux règles d'automatisation sur l'ensemble du système, indépendamment du nombre de fabricants et de sous-systèmes impliqués. Vous donnant l'outil le plus flexible disponible pour rendre presque tous les souhaits d'automatisation domestique; si vous pouvez y penser, il est probable que vous puissiez le mettre en œuvre avec openHAB."
  hu: "Az open Home Automation Bus (openHAB, ˈəʊpənˈhæb) egy nyílt forráskódú, technológia agnostikus otthoni automatizálási platform, amely a Smart Home központjaként működik! A többi különböző eszköz és rendszer integrálásának képessége. Az openHAB más otthoni automatizálási rendszereket, (intelligens) eszközöket és más technológiákat egyetlen megoldásba integrál. A rendszer egészére vonatkozóan egy egységes felhasználói felület és egy közös automatizálási szabályok megközelítésének biztosítása a gyártók és a részrendszerök számától függetlenül. Adja Önnek a legrugalmasabb eszközt, hogy majdnem bármilyen otthoni automatizálási kívánságát teljesítheti; ha gondolhatja, valószínűleg megvalósíthatja az openHAB-vel."
  it: "Il bus di automazione domestica open (openHAB, pronunciato ˈəʊpənˈhæb) è una piattaforma di automazione domestica open source e tecnologia agnostica che funziona come il centro della tua casa intelligente. La sua capacità di integrare una moltitudine di altri dispositivi e sistemi. openHAB include altri sistemi di automazione domestica, dispositivi (intelligenti) e altre tecnologie in una sola soluzione. Per fornire un'interfaccia utente uniforme e un approccio comune alle regole di automazione su tutto il sistema, indipendentemente dal numero di produttori e sottosistemi coinvolti. Ti dà l'unico strumento più flessibile disponibile per realizzare quasi ogni desiderio di automazione domestica; se puoi pensarlo, è probabile che tu possa realizzarlo con openHAB."
  ru: "Открытый автоматизационный домашний автобус (openHAB, произносится ˈəʊpənˈhæb) - это открытая платформа для автоматизации домашней техники и технологии, которая работает как центр вашего умного дома. Его способность интегрировать множество других устройств и систем. openHAB включает в себя другие системы автоматизации домашней техники, (умные) устройства и другие технологии в единую систему. Для обеспечения единого пользовательского интерфейса и единого подхода к правилам автоматизации по всей системе, независимо от количества производителей и подсистем. Давая вам самый гибкий инструмент, чтобы сделать почти любое желание по автоматизации дома; если вы можете себе это представить, вероятно, вы можете сделать это с openHAB."
  pl: "Open Home Automation Bus (openHAB, wymawiane ˈəʊpənˈhæb) to otwarta platforma automatyzacji domowej i technologii agnostycznej, która działa jako centrum inteligentnego domu. Jego zdolność do integracji wielu innych urządzeń i systemów. openHAB obejmuje inne systemy automatyzacji domowej, urządzenia (inteligentne) i inne technologie w jednym rozwiązaniu. Aby zapewnić jednolitą interfejs użytkownika i wspólny podejście do reguł automatyzacji na całym systemie, niezależnie od liczby producentów i podsystemów. Dając Ci najbardziej elastyczny narzędzie do realizacji prawie każdego życzenia automatyzacji domowej; jeśli możesz sobie to wyobrazić, prawdopodobnie możesz to zrobić z openHAB."
  pt: "O Open Home Automation Bus (openHAB, pronunciado ˈəʊpənˈhæb) é uma plataforma de automação residencial de código aberto e tecnologia agnóstica que funciona como o centro da sua casa inteligente. Sua capacidade de integrar uma multidão de outros dispositivos e sistemas. openHAB inclui outros sistemas de automação residencial, dispositivos (inteligentes) e outras tecnologias em uma única solução. Para fornecer uma interface de usuário uniforme e uma abordagem comum às regras de automação em todo o sistema, independentemente do número de fabricantes e sub-sistemas envolvidos. Você dá a você a ferramenta mais flexível disponível para realizar quase todos os seus desejos de automação residencial; se você pode pensar nisso, é provável que você possa implementá-lo com openHAB."
  sv: "Open Home Automation Bus (openHAB, uttalas ˈəʊpənˈhæb) är en öppen plattform för hemautomation och teknologiagnostisk som fungerar som centrum för ditt smarta hem. Sitt förmåga att integrera en mängd andra enheter och system. openHAB inkluderar andra hemautomationsystem, enheter (smart) och andra teknologier i en enda lösning. För att ge en enhetlig användargränssnitt och en gemensam tillvägagångssätt till automationsregler över hela systemet, oavsett antal tillverkare och underliggande system. Du ger dig själv den mest flexibla verktygen tillgängliga för att genomföra nästan alla dina önskemål om hemautomation; om du kan tänka dig det, är det troligt att du kan genomföra det med openHAB."
  uk: "Open Home Automation Bus (openHAB, вимовляється ˈəʊpənˈhæb) — платформа автоматизації дому з відкритим кодом, не прив’язана до жодної технології. Вона працює як центр вашого розумного дому та вміє поєднувати безліч інших пристроїв і систем. openHAB об’єднує в одне рішення інші системи автоматизації дому, (розумні) пристрої та технології. Вона дає єдиний інтерфейс і спільний підхід до правил автоматизації в усій системі, незалежно від кількості виробників і підсистем. Це найгнучкіший інструмент, щоб утілити майже будь-яке бажання щодо автоматизації дому: якщо ви це вигадали, то, найімовірніше, зможете реалізувати це в openHAB."
