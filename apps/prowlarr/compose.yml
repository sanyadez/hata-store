# Apache-2.0, changed for Hata Store: see NOTICE
services:
  prowlarr:
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: "${TZ:-UTC}"
    image: linuxserver/prowlarr:2.6.5
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
      - "${WEB_PORT:-9696}:9696"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${APP_DATA:-.}/config"
        target: /config
