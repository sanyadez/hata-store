title:
  en: Prowlarr
tagline:
  en: Integration of various PVR applications
  zh: 各种PVR应用程序的集成
  ar: تكامل مختلف تطبيقات PVR
  de: Integration verschiedener PVR-Anwendungen
  es: Integración de varias aplicaciones PVR
  fr: Intégration de diverses applications PVR
  hu: Különböző PVR alkalmazások integrációja
  it: Integrazione di varie applicazioni PVR
  ru: Интеграция различных приложений PVR
  pl: Integracja różnych aplikacji PVR
  pt: Integração de várias aplicações PVR
  sv: Integration av olika PVR-appar
  uk: Інтеграція різних застосунків PVR
description:
  en: "Prowlarr is an indexer manager/proxy built on the popular *arr .net/reactjs base stack to integrate with your various PVR apps. Prowlarr supports management of both Torrent Trackers and Usenet Indexers. It integrates seamlessly with Lidarr, Mylar3, Radarr, Readarr, and Sonarr offering complete management of your indexers with no per app Indexer setup required (we do it all)."
  zh: Prowlarr是一个索引器管理器/代理，建立在流行的*arr .net / reactjs基础堆栈上，用于与各种PVR应用程序集成。 Prowlarr支持管理Torrent Trackers和Usenet Indexers。它与Lidarr，Mylar3，Radarr，Readarr和Sonarr无缝集成，提供完整的索引器管理，无需每个应用程序索引器设置即可完成（我们全部都做到了）。
  ar: Prowlarr هو مدير مؤشر / وكيل مبني على مكتبة * arr الشعبية .net / reactjs للتكامل مع تطبيقات PVR المختلفة. Prowlarr يدعم إدارة Torrent Trackers و Usenet Indexers. يتم تكامله بسلاسة مع Lidarr و Mylar3 و Radarr و Readarr و Sonarr ، مما يوفر إدارة كاملة لمؤشراتك بدون تعيين مؤشر لكل تطبيق مطلوب (نحن نفعل كل شيء).
  de: "Prowlarr ist ein Indexmanager / Proxy, der auf der beliebten * arr .net / reactjs-Grundstapelbasis für die Integration mit Ihren verschiedenen PVR-Apps entwickelt wurde. Prowlarr unterstützt die Verwaltung von Torrent-Trackern und Usenet-Indexern. Es integriert sich nahtlos in Lidarr, Mylar3, Radarr, Readarr und Sonarr und bietet eine vollständige Verwaltung Ihrer Indexer ohne eine Indexer-Einstellung pro App (wir machen alles)."
  es: "Prowlarr es un administrador de índices / proxy construido en la popular base de pila .net / reactjs * arr para integrarse con sus diversas aplicaciones PVR. Prowlarr admite la gestión de Torrent Trackers y Usenet Indexers. Se integra sin problemas con Lidarr, Mylar3, Radarr, Readarr y Sonarr, ofreciendo una gestión completa de sus indexadores sin configuración de indexador por aplicación (lo hacemos todo)."
  fr: "Prowlarr est un gestionnaire d'index / proxy construit sur la base de pile populaire .net / reactjs * arr pour s'intégrer à vos différentes applications PVR. Prowlarr prend en charge la gestion des trackers Torrent et des indexeurs Usenet. Il s'intègre sans problème à Lidarr, Mylar3, Radarr, Readarr et Sonarr, offrant une gestion complète de vos indexeurs sans configuration d'indexeur par application (nous faisons tout)."
  hu: "A Prowlarr egy indexelőkezelő / proxy, amely a népszerű * arr .net / reactjs alapstackre épül, hogy integrálja a különböző PVR alkalmazásait. A Prowlarr támogatja a Torrent Trackers és a Usenet Indexers kezelését. A Lidarr, Mylar3, Radarr, Readarr és Sonarr integrálódik a tökéletesen, és teljes kezelést biztosít az indexelőknek az alkalmazásokonkénti indexelőbeállítás nélkül (mindent megteszünk)."
  it: "Prowlarr è un gestore di indici / proxy costruito sulla popolare base di stack .net / reactjs * arr per integrarsi con le varie applicazioni PVR. Prowlarr supporta la gestione di Torrent Trackers e Usenet Indexers. Si integra perfettamente con Lidarr, Mylar3, Radarr, Readarr e Sonarr, offrendo un'intera gestione degli indexer senza configurazione di indexer per applicazione (lo facciamo tutto)."
  ru: "Prowlarr - это менеджер индексов / прокси, построенный на популярной базе стека .net / reactjs * arr для интеграции с различными приложениями PVR. Prowlarr поддерживает управление трекерами Torrent и Usenet Indexers. Он безупречно интегрируется с Lidarr, Mylar3, Radarr, Readarr и Sonarr, предлагая полное управление индексами без необходимости настройки индекса для каждого приложения (мы делаем все)."
  pl: "Prowlarr to menedżer indeksów / proxy, zbudowany na popularnej podstawie stosu .net / reactjs * arr do integracji z różnymi aplikacjami PVR. Prowlarr obsługuje zarządzanie Torrent Trackers i Usenet Indexers. Bezproblemowo integruje się z Lidarr, Mylar3, Radarr, Readarr i Sonarr, oferując pełną obsługę indeksów bez konieczności konfigurowania indeksu dla każdej aplikacji (robimy wszystko)."
  pt: "O Prowlarr é um gerenciador de índices / proxy construído na base de pilha popular .net / reactjs * arr para integração com suas várias aplicações PVR. O Prowlarr suporta a gestão de Torrent Trackers e Usenet Indexers. Ele se integra perfeitamente com Lidarr, Mylar3, Radarr, Readarr e Sonarr, oferecendo gerenciamento completo de seus indexadores sem configuração de indexador por aplicativo (fazemos tudo)."
  sv: "Prowlarr är en indexhanterare / proxy som byggs på den populära .net / reactjs-staplarna * arr för att integreras med dina olika PVR-appar. Prowlarr stöder hantering av Torrent Trackers och Usenet Indexers. Det integreras perfekt med Lidarr, Mylar3, Radarr, Readarr och Sonarr, vilket ger fullständig hantering av dina index utan indexinställning per app (vi gör allt)."
  uk: "Prowlarr — менеджер і проксі індексаторів, створений на популярній основі *arr (.net/reactjs) для інтеграції з вашими застосунками PVR. Prowlarr керує і торентовими трекерами, і індексаторами Usenet. Він без зусиль інтегрується з Lidarr, Mylar3, Radarr, Readarr і Sonarr та повністю керує вашими індексаторами, тож налаштовувати їх окремо в кожному застосунку не потрібно (це робимо ми)."
