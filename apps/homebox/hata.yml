title: Homebox
tagline:
  en: An inventory of everything at home, from tools to warranties
  uk: Облік усього, що є вдома, від інструментів до гарантій
description:
  en: >
    Keeps track of what you own and where it lies: items by room and box, with photos, receipts,
    manuals, serial numbers and warranty dates. Labels with QR codes lead from a box to its list, and
    a search answers "where is the drill" in a second. Light enough for any server.
  uk: >
    Веде облік того, що у вас є і де воно лежить: речі за кімнатами й коробками, з фото, чеками,
    інструкціями, серійними номерами й строками гарантії. Наліпки з QR-кодами ведуть від коробки до її
    списку, а пошук за секунду відповідає, де дриль. Досить легкий для будь-якого сервера.
notes:
  en: >
    The first account is made by signing up on its page. Once the family has its accounts, turn
    "Anyone may sign up" off.
  uk: >
    Перший обліковий запис створюється реєстрацією на його сторінці. Коли вся родина матиме облікові
    записи, вимкніть «Будь-хто може зареєструватися».
category: productivity
developer: Sysadmins Media
website: https://homebox.software
source: https://github.com/sysadminsmedia/homebox
icon: data:image/svg+xml;base64,
screenshots:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
web:
  service: homebox
  port: 7745
settings:
  - name: WEB_PORT
    type: port
    default: 3100
    label: { en: Web port, uk: Порт вебінтерфейсу }
  - name: ALLOW_REGISTRATION
    type: switch
    default: true
    label: { en: Anyone may sign up, uk: Будь-хто може зареєструватися }
  - name: MAX_UPLOAD_MB
    type: number
    default: 10
    advanced: true
    label: { en: "Largest attachment, MB", uk: "Найбільший вкладений файл, МБ" }
  - name: API_KEY_PEPPER
    type: secret
    length: 48
    label: { en: Key for API tokens, uk: Ключ для токенів API }
