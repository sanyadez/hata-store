services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.0
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-3100}:7745
    volumes:
      - ${APP_DATA:-.}/data:/data
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_WEB_MAX_UPLOAD_SIZE: ${MAX_UPLOAD_MB:-10}
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      HBOX_AUTH_API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER, 32 characters or more}
      TZ: ${TZ:-UTC}
